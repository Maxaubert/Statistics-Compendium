id: k
sym: "k"
short_def: "Antall — vanligvis antall suksesser eller hendelser, men kan også bety antall kategorier eller frihetsgrader avhengig av kontekst."
contexts:
  - usage: "Antall suksesser/hendelser"
    detail: |
      k er rett og slett et tall du teller deg fram til: hvor mange
      ganger noe skjedde. Det er verdien du slår opp i tabellene:
      P(X = k), P(X ≤ k), eller P(X ≥ k).

      Eksempel: kaster du en mynt 10 ganger og spør 'sannsynligheten
      for nøyaktig 7 kron', så er k = 7 og du regner P(X = 7) i
      Bin(10, 0.5).

      Pass på språk: 'minst k' betyr X ≥ k, og regnes ofte via
      komplement: P(X ≥ k) = 1 − P(X ≤ k − 1). 'Høyst k' er X ≤ k,
      som du leser direkte i tabellen.

      I binomial og poisson er k et heltall (0, 1, 2, ...).
    entry_refs:
      - binomial-fordeling
      - poisson-fordeling
      - hypergeometrisk-fordeling
  - usage: "Antall kategorier"
    detail: |
      I kjikvadrat-godhetstest er k antall kategorier dataene deler
      seg i. For eksempel: tester du om en terning er rettferdig,
      er k = 6 (én kategori per side).

      Frihetsgrader er da ν = k − 1. Husk: minus 1, ikke k selv.
    entry_refs:
      - kjikvadrat-goodness-of-fit
