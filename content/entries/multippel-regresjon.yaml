id: multippel-regresjon
name_no: "Multippel lineær regresjon"
type: regression
category: regression_estimate
tagline: "Generaliser enkel lineær regresjon til flere forklaringsvariabler `x_1, …, x_k`. Estimer koeffisientene, tolk p-verdier og KI, mål forklaringsgrad med `R²`, og test hele modellen med F-test."

formula_main: "ŷ = β̂_0 + β̂_1·x_1 + β̂_2·x_2 + … + β̂_k·x_k"
formula_latex: "\\hat{y} = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_1 + \\hat{\\beta}_2 x_2 + \\cdots + \\hat{\\beta}_k x_k"

what_it_does: |
  Utvider enkel lineær regresjon til å la `Y` avhenge LINEÆRT av `k`
  forklaringsvariabler `x_1, x_2, …, x_k` samtidig:

  `Y = β_0 + β_1·x_1 + β_2·x_2 + … + β_k·x_k + ε`,   `ε ~ N(0, σ²)`.

  Hver `β_j` tolkes som **partiell** effekt: gjennomsnittlig endring i `Y` når
  `x_j` øker med én enhet, ALLE andre `x_l` (`l ≠ j`) holdt konstante.
  Estimering skjer typisk med minste-kvadraters-metode på matriseform
  (`β̂ = (X^T X)^(−1) X^T y`), og programvare gir ut tabell med
  `β̂_j`, `SE(β̂_j)`, t-observator, p-verdi og KI per koeffisient samt
  globale mål `R²`, `R²_adj` og F-statistikk.

  Pensum-oppgavene fokuserer på TOLKNING av output, ikke selve matriseregningen —
  hvilke variabler er signifikante, hva betyr `R²`, hvilken redusert modell anbefales.

why_use: |
  Få fenomener avhenger av bare én variabel. Multippel regresjon lar deg:

  - estimere effekten av hver `x_j` korrigert for de andre forklaringsvariablene,
  - sammenligne størrelse og statistisk signifikans på tvers av variabler,
  - måle hvor mye av variasjonen i `Y` modellen totalt forklarer (`R²`),
  - teste om modellen som helhet bidrar utover null-modellen (F-test),
  - velge en sparsommelig modell ved å fjerne ikke-signifikante prediktorer.

  Se også [forutsetninger-regresjon](glossary:forutsetninger-regresjon) for
  antakelsene som må holde for at p-verdier og KI skal være gyldige.

recognition_cues:
  - "Oppgaven oppgir en utskrift fra statistikkprogram med flere koeffisienter `β̂_0, β̂_1, …, β̂_k` og tilhørende p-verdier"
  - "Flere forklaringsvariabler nevnes: «NOx som funksjon av luftfuktighet, temperatur og trykk»"
  - "Du blir spurt om å TOLKE hvilke variabler som bidrar signifikant, eller hvilke som bør fjernes"
  - "`R²` (eventuelt justert `R²_adj`) er gitt eller skal beregnes"
  - "F-statistikk og df-paret `(k, n−k−1)` dukker opp"
  - "Modellformelen `ŷ = β̂_0 + β̂_1·x_1 + … + β̂_k·x_k` er allerede oppgitt"

when_NOT_to_use:
  - "Bare én forklaringsvariabel `x` → bruk [lineær regresjon](/entry/lineaer-regresjon)"
  - "Responsvariabelen `Y` er binær (0/1) → logistisk regresjon (utenfor pensum)"
  - "Forklaringsvariablene har klar ikke-lineær sammenheng med `Y` → vurder transformasjon (`log x`, `x²`) eller annen modell"
  - "Sterkt korrelerte prediktorer (multikollinearitet) gjør koeffisientene ustabile — fjern eller kombiner variabler"
  - "Antallet observasjoner er nær antallet prediktorer (`n ≈ k`) → modellen tilpasser støy («overfitting»)"

symbols:
  - { sym: "Y",            means: "responsvariabelen (avhengig variabel)" }
  - { sym: "x_1, …, x_k",  means: "de `k` forklaringsvariablene (prediktorene)" }
  - { sym: "k",            means: "antall forklaringsvariabler (ekskluderer skjæringspunktet)" }
  - { sym: "n",            means: "antall observasjoner" }
  - { sym: "β_0",          means: "skjæringspunkt (intercept) — forventet `Y` når alle `x_j = 0`" }
  - { sym: "β_j",          means: "partiell effekt av `x_j`: endring i `E[Y]` per enhetsøkning i `x_j`, øvrige holdt konstant" }
  - { sym: "β̂_j",         means: "minste-kvadraters-estimat for `β_j`" }
  - { sym: "ŷ",            means: "predikert verdi: `β̂_0 + β̂_1·x_1 + … + β̂_k·x_k`" }
  - { sym: "ε",            means: "tilfeldig feilkomponent, `ε ~ N(0, σ²)`" }
  - { sym: "σ²",           means: "residualenes (ukjente) varians" }
  - { sym: "SSE",          means: "`Σ(y_i − ŷ_i)²` — restkvadratsum" }
  - { sym: "SST",          means: "`Σ(y_i − ȳ)²` — total kvadratsum" }
  - { sym: "SSR",          means: "`SST − SSE` — kvadratsum forklart av modellen" }
  - { sym: "R²",           means: "forklart andel av variasjonen, `R² = 1 − SSE/SST = SSR/SST ∈ [0, 1]`" }
  - { sym: "R²_adj",       means: "justert R², korrigerer for antall prediktorer" }
  - { sym: "F",            means: "F-observator for «hele modellen», fordelt `F_(k, n−k−1)` under `H₀`" }
  - { sym: "p-verdi",      means: "sannsynlighet for å observere en så ekstrem `β̂_j` (eller F) hvis `H₀` er sann" }
  - { sym: "KI",           means: "konfidensintervall for `β_j`, vanligvis `β̂_j ± t·SE(β̂_j)`" }
  - { sym: "α",            means: "signifikansnivå" }
  - { sym: "X",            means: "designmatrise (`n × (k+1)`), kolonne av 1-ere først for skjæringspunkt" }

filters:
  computes: [parameter_estimate, hypothesis_test, confidence_interval, correlation]
  random_variable: [continuous, slope_estimate]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list, summary_stats_given, normal_assumed, two_sided_alternative]
  parameters_known: [slope_se, residual_variance, confidence_level, alpha_significance, regression_line_estimate]
  distribution_assumption: [t_distribution, normal, f_distribution]
  tooling: [t_quantile_table_E5, f_quantile_table_E8, calculator_sqrt]

