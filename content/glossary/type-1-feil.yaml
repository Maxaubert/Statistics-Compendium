id: type-1-feil
term_no: Type-I-feil
short_def: "Å forkaste `H₀` når `H₀` faktisk er sann — falsk alarm."
aliases:
  - type-I-feilen
  - type-I-feil
  - type-I-feilene
  - type I-feil
  - type 1-feil
filters:
  computes: [hypothesis_test]
  parameters_known: [alpha_significance]
  distribution_assumption: [normal]
long_def: |
  En **type-I-feil** er å forkaste `H₀` når den faktisk er sann — en «falsk
  alarm». Du konkluderer med en effekt selv om det ikke er noen.

  - Sannsynligheten er nøyaktig signifikansnivået `α`, som du **velger selv**
    (typisk `0.05` eller `0.01`). Setter du `α = 0.05`, godtar du 5 % sjanse for
    falsk alarm.
  - `α` er det eneste av feilsannsynlighetene du kontrollerer direkte.

  **Avveiing:** lavere `α` gir mindre type-I-risiko, men flytter
  forkastningsgrensa lenger unna og øker dermed risikoen for
  [type-II-feil](glossary:type-2-feil). Begge kan reduseres samtidig kun ved å
  øke utvalget `n`.

  *Eksempel:* en brannvarsler som piper uten at det brenner gjør en type-I-feil.
