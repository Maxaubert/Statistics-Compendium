id: uordnet-utvalg-uten-tilbakelegging
name_no: "Uordnet utvalg uten tilbakelegging (binomialkoeffisient)"
type: combinatorics
category: combinatorics
tagline: "Antall måter å velge k elementer blant n, der rekkefølge ikke teller."

formula_main: "C(n, k) = n! / (k! · (n - k)!)"
formula_latex: "\\binom{n}{k} = \\frac{n!}{k! (n-k)!}"

what_it_does: |
  Beregner antall mulige utvalg av k elementer fra en mengde av n
  forskjellige elementer, når rekkefølgen ikke spiller noen rolle og
  ingen elementer kan trekkes flere ganger.

why_use: |
  Brukes for å telle antall gunstige eller mulige utvalg i sannsynlighetsberegninger
  med "uniform sannsynlighetsfordeling og uten tilbakelegging" (kort fra
  kortstokk, baller fra urne, etc.). Direkte forbundet med hypergeometrisk
  fordeling og binomial sannsynlighet.

recognition_cues:
  - "Du trekker eller velger ut k elementer fra n"
  - "Rekkefølgen er IKKE viktig (samme utvalg uansett rekkefølge)"
  - "UTEN tilbakelegging: hvert element kan velges maksimalt én gang"
  - "Ofte blir det gunstige/mulige med C(K,k)·C(N-K,n-k) / C(N,n)"

when_NOT_to_use:
  - "Rekkefølge er viktig (permutasjoner) → bruk n!/(n-k)! (P(n,k))"
  - "Tilbakelegging er tillatt (multinomial-typer) → andre formler"

symbols:
  - { sym: "n",       means: "antall elementer i populasjonen" }
  - { sym: "k",       means: "antall vi trekker ut" }
  - { sym: "n!",      means: "n-fakultet, n·(n-1)·...·1" }
  - { sym: "C(n,k)",  means: "binomialkoeffisient, også skrevet som ⁿCₖ eller (n velg k)" }

filters:
  computes: [combinatorial_count, exact_probability]
  random_variable: []
  setup: [single_population, without_replacement, finite_pool]
  structural_cues: [total_observations_n]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_binomial_coef, calculator_factorial]

solution_template:
  - "Identifiser n (totalt) og k (det som skal velges)"
  - "Beregn C(n,k) – på kalkulator typisk 'nCr' eller 'COMB'"
  - "Hvis sannsynlighetsoppgave: kombiner med antall mulige utvalg, P = gunstige/mulige"

common_traps: |
  C(n,k) er ikke det samme som n^k. Pass på at n og k er heltall og 0 ≤ k ≤ n.
  Symmetrien C(n,k) = C(n, n-k) er nyttig for å forenkle beregninger.

detailed_solution_variants:
  - label: "Uordnet utvalg uten tilbakelegging"
    solutions:
      - source: "Eksamen jan25 · oppgave 1"
        question: "Vi trekker 5 kort fra en kortstokk med 52 kort, hvorav 13 er hjerter. Hvor mange mulige uordnete utvalg av 5 kort finnes, og hva er sannsynligheten for å få 5 hjerter?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi trekker `k = 5` kort fra `n = 52` kort." }
              - { text: "Rekkefølgen spiller ingen rolle (samme hånd uansett rekkefølge), og samme kort kan ikke trekkes to ganger." }
              - { text: "Dette er et uordnet utvalg uten tilbakelegging, så vi bruker binomialkoeffisienten `C(n,k)`." }
          - label: "Formel"
            lines:
              - { text: "`C(n, k) = n! / (k! · (n − k)!)`" }
          - label: "Innsatt"
            lines:
              - { text: "Antall mulige hender:" }
              - { indent: "`C(52, 5) = 52! / (5! · 47!)`" }
              - { indent: "`= (52 · 51 · 50 · 49 · 48) / (5 · 4 · 3 · 2 · 1)`" }
              - { indent: "`= 311 875 200 / 120 = 2 598 960`" }
              - { text: "Antall hender med 5 hjerter (gunstige):" }
              - { indent: "`C(13, 5) = 13! / (5! · 8!) = 1 287`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 1 287 / 2 598 960 ≈ 4.95 · 10⁻⁴`" }
        result: "`C(52,5) = 2 598 960`, `P(5 hjerter) ≈ 4.95 · 10⁻⁴`"

      - source: "Praksiseksempel · Lotto"
        question: "I norsk Lotto velger man 7 tall fra 34 mulige. På hvor mange måter kan dette gjøres?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Populasjonen består av `n = 34` tall, og vi velger `k = 7` av disse." }
              - { text: "Rekkefølgen er likegyldig (en lottokupong er den samme uansett hvilken rekkefølge tallene krysses av i)." }
              - { text: "Hvert tall kan velges maksimalt én gang, altså uten tilbakelegging." }
              - { comment: "Dette er klassisk binomialkoeffisient-anvendelse." }
          - label: "Formel"
            lines:
              - { text: "`C(n, k) = n! / (k! · (n − k)!)`" }
          - label: "Innsatt"
            lines:
              - { text: "`C(34, 7) = 34! / (7! · 27!)`" }
              - { indent: "`= (34 · 33 · 32 · 31 · 30 · 29 · 28) / (7 · 6 · 5 · 4 · 3 · 2 · 1)`" }
              - { indent: "`= 27 113 264 640 / 5 040`" }
              - { indent: "`= 5 379 616`" }
        result: "`C(34, 7) = 5 379 616` mulige kuponger"

      - source: "Praksiseksempel · Poker (fire like)"
        question: "Hvor mange mulige femkortshender finnes fra en kortstokk med 52 kort, og hva er sannsynligheten for å få nøyaktig 'fire like'?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi trekker `k = 5` kort fra `n = 52` uten tilbakelegging, og rekkefølgen i hånda spiller ingen rolle." }
              - { text: "Antall mulige hender beregnes med `C(52, 5)`." }
              - { text: "For 'fire like' velger vi først valør (13 valører), tar alle 4 kort av denne valøren, og legger til ett av de 48 gjenværende kortene." }
          - label: "Formel"
            lines:
              - { text: "Mulige hender: `C(n, k) = n! / (k! · (n − k)!)`" }
              - { text: "Gunstige: `gunstige = 13 · C(4,4) · 48 = 13 · 1 · 48`" }
              - { text: "Sannsynlighet: `P = gunstige / mulige`" }
          - label: "Innsatt"
            lines:
              - { text: "Mulige hender:" }
              - { indent: "`C(52, 5) = 2 598 960`" }
              - { text: "Gunstige hender (fire like):" }
              - { indent: "`13 · 48 = 624`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 624 / 2 598 960 ≈ 2.40 · 10⁻⁴`" }
        result: "`C(52,5) = 2 598 960`, `P(fire like) ≈ 0.00024`"

related:
