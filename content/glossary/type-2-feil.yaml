id: type-2-feil
term_no: Type-II-feil
short_def: "Å beholde `H₀` når `H₁` faktisk er sann — du oppdaget ikke effekten."
aliases:
  - type-II-feilen
  - type-II-feil
  - type-II-feilene
  - type II-feil
  - type 2-feil
filters:
  computes: [hypothesis_test, find_n_for_threshold]
  parameters_known: [alpha_significance]
  distribution_assumption: [normal]
  structural_cues: [probability_threshold]
long_def: |
  En **type-II-feil** er å beholde `H₀` når `H₁` faktisk er sann — du
  **oppdaget ikke** en effekt som var der. Sannsynligheten kalles `β`.

  - `β` er **ikke ett fast tall**: den avhenger av hvor langt den sanne verdien
    `θ` ligger fra `H₀`. Lite avvik ⇒ stor `β` (lett å bomme); stort avvik ⇒
    liten `β`.
  - [Hypotesestyrke](glossary:styrkefunksjon) `= 1 − β` er komplementet —
    sjansen for å fange effekten.

  **Slik reduserer du `β`:** større `n` (best), større effekt, eller høyere `α`
  (men det øker [type-I-risikoen](glossary:type-1-feil)).

  *Eksempel:* en brannvarsler som IKKE piper når det faktisk brenner gjør en
  type-II-feil.
