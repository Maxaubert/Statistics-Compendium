id: sannsynlighetsfordeling
term_no: Sannsynlighetsfordeling (PMF, PDF, CDF)
short_def: "Tre funksjoner som beskriver hvordan en stokastisk variabel fordeler sannsynlighet: PMF (diskret), PDF (kontinuerlig), CDF (kumulativ, begge typer)."
