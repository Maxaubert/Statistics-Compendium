id: regresjon-standardfeil-stigningstall
name_no: "Standardfeil til stigningstallet, SE(β̂)"
type: regression
category: regression_estimate
tagline: "Mål for usikkerheten i estimatet av `β̂` – inngår i hypotesetest og KI for `β`."

formula_main: "SE(β̂) = √(S_E² / Σ(x_i - x̄)²) = √(S_E² / S_XX)"
formula_latex: "\\text{SE}(\\hat{\\beta}) = \\sqrt{\\frac{S_E^2}{\\sum (x_i - \\bar{x})^2}}"

what_it_does: |
  Beregner standardfeilen til stigningstallet `β̂` i en lineær regresjon.
  Standardfeilen kvantifiserer hvor mye `β̂` "varierer" fra utvalg til
  utvalg, og brukes i hypotesetest og konfidensintervaller for `β`.

why_use: |
  Mellomsteg i nesten all inferens på regresjonsstigningstallet. Mindre
  `SE(β̂)` betyr at `β̂` er presist estimert (mindre usikkerhet).

recognition_cues:
  - "Du jobber med regresjon og skal teste eller lage KI for `β`"
  - "Spørsmålet ber eksplisitt om `SE(β̂)` eller standardfeil til stigningstallet"
  - "Du har `S_E²` (residualvariansen) og `S_XX = Σ(x − x̄)²`"
  - "Mellomsteg når oppgaven sier 'test om stigningstallet er forskjellig fra 0'"

when_NOT_to_use:
  - "Du vil teste `β = 0` med ferdig `SE(β̂)` → bruk [hypotesetest for stigningstallet](/entry/regresjon-test-stigningstall)"
  - "Du mangler `S_E²` → regn den først via [residualvarians S_E²](/entry/regresjon-residualvarians)"
  - "Du vil ha standardfeil for `α̂` eller for selve `ŷ` → annen formel"

symbols:
  - { sym: "SE(β̂)",  means: "standardfeilen til `β̂`" }
  - { sym: "β̂",      means: "estimert stigningstall (slope) i regresjonen" }
  - { sym: "S_E²",    means: "estimat for residualenes varians" }
  - { sym: "x_i",     means: "`x`-verdiene i de `n` observasjonsparene" }
  - { sym: "x̄",      means: "gjennomsnitt av `x`-verdiene" }
  - { sym: "S_XX",    means: "`Σ(x_i − x̄)²` (sum av kvadrerte avvik for `x`)" }

filters:
  computes: [parameter_estimate, std_dev, confidence_interval]
  random_variable: [slope_estimate, continuous]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, regression_line_given, summary_stats_given]
  parameters_known: [residual_variance, sum_xx_sxy, slope_se, regression_line_estimate]
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]
solution_template:
  - "Beregn `S_E²` først (residualvariansen)"
  - text: "Beregn `S_XX`."
    formula: "S_XX = Σ(x_i − x̄)²"
  - text: "Beregn standardfeilen til stigningstallet."
    formula: "SE(β̂) = √(S_E² / S_XX)"
  - text: "Eksempel: `S_E² = 6.093`, `S_XX = 15.6`:"
    formula: "SE(β̂) = √(6.093/15.6) = √0.391 ≈ 0.625"
    example: true

common_traps: |
  Husk at `SE(β̂) ≠ S_E`. `SE(β̂)` er `√(S_E²/S_XX)`, altså `S_E` delt på `√S_XX`.
  Sjekk dimensjonen: hvis `y` er i prosent og `x` i timer, er `β̂` i prosent/time
  og det samme er `SE(β̂)`.

python_snippet: |
  SE2 = 6.093
  Sxx = 15.6
  SE_beta = (SE2 / Sxx) ** 0.5   # 0.625

detailed_solution_variants:
  - label: "Standardfeil SE(β̂)"
    solutions:
      - source: "Eksamen mai25 · oppgave 5d"
        question: "Gitt `S_E² = 6.093` og `S_XX = 15.6`. Finn standardfeilen `SE(β̂)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Vi skal finne standardfeilen til stigningstallet `β̂` i en lineær regresjon."
              - text: "Formel: `SE(β̂) = √(S_E² / S_XX)`."
              - text: "Vi trenger:"
              - indent: "`S_E²` (residualvariansen)"
              - indent: "`S_XX = Σ(x_i - x̄)²`"
          - label: "Mellom-summer"
            lines:
              - text: "Oppgaven oppgir:"
              - indent: "`S_E² = 6.093`"
              - indent: "`S_XX = 15.6`"
          - label: "Standardfeil"
            lines:
              - text: "Sett inn i formelen:"
              - indent: "`SE(β̂) = √(S_E² / S_XX)`"
              - indent: "`= √(6.093 / 15.6)`"
              - indent: "`= √0.3906`"
              - indent: "`≈ 0.625`"
          - label: "Tolkning"
            lines:
              - text: "`SE(β̂) ≈ 0.625` er et moderat tall sammenliknet med et typisk stigningstall."
              - text: "Det betyr at estimatet `β̂` har en viss usikkerhet; vi vil bruke denne verdien videre i hypotesetest (`T = β̂ / SE(β̂)`) og i konfidensintervallet `β̂ ± t·SE(β̂)`."
        result: "`SE(β̂) ≈ 0.625`"

      - source: "Praksiseksempel · sterk lineær sammenheng"
        question: "Datasett: `(1,2), (2,3), (3,5), (4,6), (5,8)`. Tidligere er det funnet `S_E² = 0.1` og `S_XX = 10`. Finn `SE(β̂)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Vi har en enkel lineær regresjon `y = α + βx + ε` med 5 datapunkter."
              - text: "Vi skal beregne standardfeilen til stigningstallet."
              - text: "Trenger `S_E²` (allerede beregnet) og `S_XX` (allerede beregnet)."
          - label: "Mellom-summer"
            lines:
              - text: "Fra tidligere utregning:"
              - indent: "`S_E² = 0.1` (liten residualvarians – punktene ligger nær linja)"
              - indent: "`S_XX = Σ(x_i - x̄)² = 10` (god spredning i x-verdiene)"
          - label: "Standardfeil"
            lines:
              - text: "Sett inn i formelen:"
              - indent: "`SE(β̂) = √(S_E² / S_XX)`"
              - indent: "`= √(0.1 / 10)`"
              - indent: "`= √0.01`"
              - indent: "`= 0.1`"
          - label: "Tolkning"
            lines:
              - text: "`SE(β̂) = 0.1` er liten. Det betyr at `β̂` er presist estimert."
              - text: "Det skyldes både liten residualvarians (god tilpasning) og god x-spredning (`S_XX` stor)."
              - text: "I et 95 % KI vil bredden bli `± t·0.1`, dvs. smalt – vi har høy tiltro til estimatet av `β`."
        result: "`SE(β̂) = 0.1`"

      - source: "Praksiseksempel · svak sammenheng og få datapunkter"
        question: "Anta en regresjon basert på `n = 4` observasjoner med `S_E² = 4.0` og `S_XX = 2.5`. Finn `SE(β̂)` og kommenter usikkerheten."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Liten utvalgsstørrelse og dårlig x-spredning gir typisk stor `SE(β̂)`."
              - text: "Vi bruker `SE(β̂) = √(S_E² / S_XX)`."
          - label: "Mellom-summer"
            lines:
              - text: "Oppgitt:"
              - indent: "`S_E² = 4.0` (stor residualvarians – punktene ligger langt fra linja)"
              - indent: "`S_XX = 2.5` (liten spredning i x-verdiene)"
          - label: "Standardfeil"
            lines:
              - text: "Sett inn i formelen:"
              - indent: "`SE(β̂) = √(S_E² / S_XX)`"
              - indent: "`= √(4.0 / 2.5)`"
              - indent: "`= √1.6`"
              - indent: "`≈ 1.265`"
          - label: "Tolkning"
            lines:
              - text: "`SE(β̂) ≈ 1.265` er stor. Estimatet av `β̂` er usikkert."
              - text: "Et 95 % KI for `β` blir bredt (`β̂ ± t·1.265`), og en hypotesetest vil sjelden forkaste `H_0: β = 0` selv om det fins en svak reell sammenheng."
              - text: "Lærdom: For å redusere `SE(β̂)` kan man øke `n` (gir mindre `S_E²` og større `S_XX`) eller velge x-verdier med større spredning."
        result: "`SE(β̂) ≈ 1.265` (stor)"

