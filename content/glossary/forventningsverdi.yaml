id: forventningsverdi
term_no: Forventningsverdi (E[X], μ)
short_def: "Gjennomsnittet på lang sikt av en stokastisk variabel — det «sentrale tyngdepunktet» i fordelingen."
long_def: |
  Forventningsverdien er det «vektede gjennomsnittet» av en variabels
  mulige verdier — det langsiktige snittet hvis du gjentok eksperimentet
  uendelig mange ganger.

  **Diskret stokastisk variabel:**

      E[X] = Σ x · P(X = x)

  **Kontinuerlig stokastisk variabel:**

      E[X] = ∫ x · f(x) dx

  **Utvalg** (estimat for `μ`):

      X̄ = (1/n) · Σ Xᵢ

  **Lineæritet:**

      E[aX + b] = a · E[X] + b
      E[X + Y]  = E[X] + E[Y]        (uten antakelse om uavhengighet)
