id: ki-andel-binomial
name_no: "Konfidensintervall for andel p (binomial)"
type: identity
category: confidence_interval
tagline: "`(1−α)·100 %` KI for sannsynlighet/andel `p` basert på `X` suksesser av `n` forsøk."

formula_main: "p̂ ± z_(α/2) · √(p̂·(1-p̂)/n)"
formula_latex: "\\hat{p} \\pm z_{\\alpha/2} \\cdot \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}}"

what_it_does: |
  Gir et tilnærmet intervall som med `(1−α)·100 %` sikkerhet inneholder
  den sanne andelen `p` i en populasjon, basert på `p̂ = X/n`. Forutsetter
  at `n` er stort nok (`n·p̂·(1−p̂) ≥ 5`).

why_use: |
  Brukes når problemet handler om en binomisk situasjon (`n` forsøk,
  hver med to mulige utfall) og vi vil estimere den underliggende
  sannsynligheten `p` med usikkerhetsmål.

recognition_cues:
  - "Oppgaven ber om '95 % konfidensintervall for andelen `p`'"
  - "Du har observert `X` suksesser i `n` forsøk (f.eks. 'av 200 spurte svarte 142 ja')"
  - "Frasering 'estimer andelen som ... med usikkerhet'"
  - "Du har en binomisk situasjon (samme `p` i hvert forsøk, uavhengige)"
  - "Utvalget er stort nok (`n · p̂ · (1 − p̂) ≥ 5`) til normalapproksimasjon"

when_NOT_to_use:
  - "Du estimerer en rate (per tidsenhet) → bruk [KI for poissonrate](/entry/ki-poissonrate)"
  - "`n·p̂·(1−p̂) < 5` → normalapproksimasjon for unøyaktig"
  - "Du vil teste `p` mot en spesifisert verdi `p₀` (ikke estimere intervall) → bruk [z-test for andel](/entry/en-utvalg-z-test-andel) i stedet"

symbols:
  - { sym: "p",         means: "den ukjente andelen i populasjonen (det vi estimerer)" }
  - { sym: "p̂",        means: "punktestimat for andelen, `p̂ = X/n`" }
  - { sym: "X",         means: "antall suksesser observert" }
  - { sym: "n",         means: "antall forsøk" }
  - { sym: "α",         means: "signifikansnivå; `1 − α` er konfidensnivået" }
  - { sym: "z_(α/2)",   means: "kvantil i standardnormalfordelingen" }

filters:
  computes: [confidence_interval, parameter_estimate, find_n_for_threshold]
  random_variable: [proportion, discrete_count]
  setup: [single_population, fixed_n_trials, with_replacement]
  structural_cues: [two_outcomes_per_trial, independent_events, summary_stats_given, probability_threshold]
  parameters_known: [success_p, sample_size_large, confidence_level]
  distribution_assumption: [binomial, normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]
solution_variants:
  - label: "KI for andel p"
    recognition: "«Lag et 95 % konfidensintervall for andelen `p`», «hvor presist er `p̂`?», eller «mellom hvilke verdier ligger sannsynligheten?». Du har `X` suksesser av `n` forsøk."
    steps:
      - "Identifiser antall suksesser `X` og utvalgsstørrelsen `n`"
      - text: "Beregn punktestimat:"
        formula: "p̂ = X/n"
      - text: "Sjekk at normalapproksimasjon er gyldig:"
        formula: "n·p̂·(1−p̂) ≥ 5"
      - "Finn `α` fra konfidensnivået: `(1 − α)·100 %` KI ⇒ `α = 1 − konfidensnivå` (f.eks. 90 % KI gir `α = 0.10`, så `α/2 = 0.05`)"
      - "Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). F.eks. `z_(0.05) = 1.645`"
      - text: "Beregn margin:"
        formula: "margin = z_(α/2) · √(p̂(1−p̂)/n)"
      - text: "Sett opp KI:"
        formula: "p̂ ± margin"
      - text: "Eksempel: meningsmåling med `X = 200`, `n = 500`, 95 % KI (`z_(0.025) = 1.96`):"
        formula: "0.40 ± 1.96·√(0.4·0.6/500) ≈ 0.40 ± 0.0429 = (0.357, 0.443)"
        example: true

  - label: "Finn n for ønsket KI-bredde"
    recognition: "«Hvor mange observasjoner trengs for at 95 % KI for `p` skal ha lengde høyst `L`?», «hvor stort utvalg må vi ha for at intervallet ikke skal bli bredere enn …?». Du har et anslag for `p̂` (eller bruker `p̂ = 0.5` som verste tilfelle) og en ønsket total intervall-lengde `L`."
    steps:
      - "Identifiser kravet: ønsket TOTAL lengde `L` på KI og konfidensnivå `(1−α)·100 %`."
      - text: "**ADVARSEL — `L` er total lengde, IKKE halvbredde/margin.** Hvis oppgaven sier «marginalen skal være høyst `m`», så er `L = 2m`. Bruker du feil form, blir `n` 4× for stor eller 4× for liten."
        conditional: true
      - "Skaff `p̂`: enten gitt fra tidligere undersøkelse, eller bruk worst-case `p̂ = 0.5` (gir største `p̂(1−p̂) = 0.25` og dermed største `n`)."
      - "Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). F.eks. `z_(0.025) = 1.960` for 95 % KI."
      - text: "Bruk formelen:"
        formula: "n ≥ 4·p̂·(1−p̂)·(z_(α/2)/L)²"
      - text: "Worst-case-snarvei (når `p̂` er ukjent): sett `p̂ = 0.5` og formelen kollapser til:"
        formula: "n ≥ (z_(α/2)/L)²"
        conditional: true
      - text: "Alternativ form hvis oppgaven bruker halvbredde/margin `E = L/2` i stedet for total bredde:"
        formula: "n ≥ p̂(1−p̂)·(z_(α/2)/E)²"
        conditional: true
      - "Rund **alltid** opp til nærmeste heltall (selv `5797.01 → 5798`), siden `n` må være heltall og kravet er en nedre grense."
      - text: "Eksempel (mai 2021, oppg. 4c): `p̂ = 0.1852`, `L = 0.02`, `z_(0.025) = 1.960`:"
        formula: "n ≥ 4·0.1852·0.8148·(1.960/0.02)² ≈ 5797.3 ⇒ n = 5798"
        example: true
      - text: "Worst-case-eksempel: ingen pilot, `L = 0.04`, 95 % ⇒ `n ≥ (1.960/0.04)² = 49² = 2401`."
        example: true

common_traps: |
  Standard error i KI bruker `p̂` (estimert), MEN i [hypotesetest for andel](/entry/en-utvalg-z-test-andel)
  bruker man `p₀` (verdien fra `H₀`). Pass på! Husk å sjekke approksimasjons-
  betingelsen før du bruker normalapproksimasjon.

python_snippet: |
  import math
  from scipy.stats import norm

  X, n, alpha = 23, 80, 0.10
  p_hat = X / n                         # 0.2875
  z = norm.ppf(1 - alpha/2)             # 1.645
  margin = z * math.sqrt(p_hat * (1 - p_hat) / n)
  ci = (p_hat - margin, p_hat + margin)

detailed_solution_variants:
  - label: "KI for andel p"
    solutions:
      - source: "Eksamen mai25 · oppgave 3b"
        question: "Vi plukket ut 80 grantrær og 23 hadde sykdom. Finn et tilnærmet 90 % konfidensintervall for andelen p av grantrær som har sykdommen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 80, X = 23, konfidensnivå 90 % → α = 0.10" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 23/80 = 0.2875`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 80·0.2875·0.7125 ≈ 16.4 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.05} = 1.645" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.2875·0.7125/80)`" }
              - { indent: "`= √0.002562 = 0.0506`" }
              - { text: "`marginal = z·SE = 1.645·0.0506 = 0.0832`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.2875 ± 0.0832`" }
              - { indent: "`= (0.204, 0.371)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 90 % sikre på at den sanne andelen syke grantrær ligger mellom 20.4 % og 37.1 %." }
        result: "`p ∈ (0.204, 0.371)`"

      - source: "Praksis · meningsmåling"
        question: "I en undersøkelse svarte 200 av 500 spurte at de støtter et nytt forslag. Lag et 95 % konfidensintervall for den sanne andelen p som støtter forslaget."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 500, X = 200, konfidensnivå 95 % → α = 0.05" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 200/500 = 0.40`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 500·0.40·0.60 = 120 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.025} = 1.96" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.40·0.60/500)`" }
              - { indent: "`= √0.00048 = 0.02191`" }
              - { text: "`marginal = z·SE = 1.96·0.02191 = 0.0429`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.40 ± 0.043`" }
              - { indent: "`= (0.357, 0.443)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 95 % sikre på at den sanne andelen som støtter forslaget ligger mellom 35.7 % og 44.3 %." }
        result: "`p ∈ (0.357, 0.443)`"

      - source: "Eksamen · Kirsebærdalen (sjelden sykdom, lite p̂, stort n)"
        question: "I løpet av to år registreres 24 nyfødte med sykdommen tengilis sinistra av totalt 4231 nyfødte i Kirsebærdalen. Finn et tilnærmet 95 % konfidensintervall for andelen p av nyfødte med sykdommen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 4231`, `X = 24`, konfidensnivå 95 % → `α = 0.05`." }
              - { comment: "Eksempel på sjelden hendelse: p̂ vil bli veldig liten" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 24/4231 ≈ 0.00567 = 5.67·10⁻³`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1−p̂) = 4231·0.00567·(1−0.00567) ≈ 23.9 ≥ 5` ✓" }
              - { comment: "Selv om p̂ er liten, redder den store n approksimasjonen" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(α/2) = z_(0.025) = 1.960`" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1−p̂)/n) = √(0.00567·0.99433/4231)`" }
              - { indent: "`= √(1.332·10⁻⁶) ≈ 0.001154`" }
              - { text: "`marginal = z·SE = 1.960·0.001154 ≈ 0.00226 = 2.26·10⁻³`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.00567 ± 0.00226`" }
              - { indent: "`= (0.00341, 0.00793)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 95 % sikre på at den sanne andelen nyfødte med sykdommen ligger mellom ca. 0.34 % og 0.79 %." }
        result: "`p ∈ (0.00341, 0.00793)`"

      - source: "Praksis · produkttest"
        question: "I en kvalitetstest viser det seg at 12 av 80 deler er defekte. Lag et 99 % konfidensintervall for den sanne defekt-raten p."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 80, X = 12, konfidensnivå 99 % → α = 0.01" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 12/80 = 0.15`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 80·0.15·0.85 = 10.2 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.005} = 2.576" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.15·0.85/80)`" }
              - { indent: "`= √0.001594 = 0.0399`" }
              - { text: "`marginal = z·SE = 2.576·0.0399 = 0.1028`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.15 ± 0.103`" }
              - { indent: "`= (0.047, 0.253)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 99 % sikre på at den sanne defekt-raten ligger mellom 4.7 % og 25.3 %. Intervallet er bredt fordi konfidensnivået er høyt og n relativt lite." }
        result: "`p ∈ (0.047, 0.253)`"

  - label: "Finn n for ønsket KI-bredde"
    solutions:
      - source: "Eksamen mai 2021 · oppgave 4c"
        question: "Det ble observert `p̂ = 0.1852` i en tidligere undersøkelse. Hvor mange observasjoner `n` trengs for at et 95 % konfidensintervall for andelen `p` skal ha total lengde høyst `L = 0.02`?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Oppgitt: `p̂ = 0.1852`, ønsket total lengde `L = 0.02`, konfidensnivå 95 % → `α = 0.05`." }
              - { text: "Vi skal finne: minste nødvendige `n`." }
              - { comment: "Merk: L er TOTAL lengde av intervallet, ikke margin/halvbredde." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(α/2) = z_(0.025) = 1.960`" } }
          - label: "Formel"
            lines:
              - { text: "`n ≥ 4·p̂·(1−p̂)·(z_(α/2)/L)²`" }
          - label: "Innsatt"
            lines:
              - { text: "`n ≥ 4·0.1852·0.8148·(1.960/0.02)²`" }
              - { indent: "`= 4·0.1852·0.8148·(98)²`" }
              - { indent: "`= 4·0.1852·0.8148·9604`" }
              - { indent: "`= 5797.3`" }
          - label: "Avrunding"
            lines:
              - { text: "Vi runder **alltid opp** (selv om desimalen er liten), siden `n` må være heltall og ulikheten er en nedre grense:" }
              - { indent: "`5797.3 → n = 5798`" }
          - label: "Konklusjon"
            lines:
              - { text: "Det trengs minst **5798 observasjoner** for at 95 % KI skal ha total lengde høyst 0.02." }
        result: "`n = 5798`"

      - source: "Praksis · worst-case (ukjent p̂)"
        question: "En meningsmåling skal planlegges. Vi har ingen forhåndsinformasjon om andelen `p`, men vi ønsker et 95 % konfidensintervall med total bredde høyst `L = 0.04`. Finn minste nødvendige `n`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Ingen pilot ⇒ bruk worst case `p̂ = 0.5` (gir maks `p̂(1−p̂) = 0.25`)." }
              - { text: "Ønsket bredde `L = 0.04`, konfidensnivå 95 % → `α = 0.05`." }
              - { comment: "Worst case er konservativt — gir alltid bred nok KI uansett sann p." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(α/2) = z_(0.025) = 1.960`" } }
          - label: "Worst-case-formel"
            lines:
              - { text: "Med `p̂ = 0.5` blir `4·p̂(1−p̂) = 1`, så:" }
              - { indent: "`n ≥ (z_(α/2)/L)²`" }
          - label: "Innsatt"
            lines:
              - { text: "`n ≥ (1.960/0.04)² = 49² = 2401`" }
          - label: "Konklusjon"
            lines:
              - { text: "Med 2401 spurte er vi sikret 95 % KI for `p` med bredde høyst 0.04, uansett hva den sanne `p` er." }
              - { comment: "Hvis pilot hadde gitt p̂ langt fra 0.5, ville færre observasjoner holdt." }
        result: "`n = 2401`"

