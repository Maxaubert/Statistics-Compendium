id: en-utvalg-t-test
name_no: "Én-utvalg t-test"
type: test
category: hypothesis_test
tagline: "Tester forventningsverdien μ mot en gitt verdi μ₀ når σ er ukjent."

formula_main: "T = (X̄ - μ₀) / (S/√n)"
formula_latex: "T = \\frac{\\overline{X} - \\mu_0}{S / \\sqrt{n}}"

what_it_does: |
  Tester nullhypotesen om forventningsverdien μ er lik (eller minst/høyst)
  en gitt verdi μ₀, når populasjonsstandardavviket σ er ukjent og må
  estimeres med utvalgsstandardavviket S. Testobservatoren er t-fordelt
  med ν = n - 1 frihetsgrader.

why_use: |
  Brukes når man ikke kjenner populasjonens σ, og kun har utvalgsstørrelse
  og utvalgs-statistikk. Standardvalget i praksis siden σ sjelden er kjent.
  Forutsetter normalfordelte observasjoner eller stort utvalg (n ≥ 30).

recognition_cues:
  - "Du skal teste forventningsverdien μ mot en bestemt verdi μ₀"
  - "Standardavviket σ er IKKE oppgitt; kun s² eller s kan beregnes fra utvalg"
  - "Eller σ er et estimat fra dataene, ikke en kjent populasjonsverdi"
  - "Spørsmålet kan være: 'er gjennomsnittet høyere/lavere/forskjellig fra μ₀?'"

when_NOT_to_use:
  - "σ er kjent (oppgitt eksplisitt) → bruk z-test"
  - "Du sammenligner to grupper → bruk to-utvalgs t-test"
  - "Du tester en andel → bruk z-test for andel"

symbols:
  - { sym: "X̄",   means: "utvalgsgjennomsnittet" }
  - { sym: "μ₀",   means: "verdien vi tester mot (fra nullhypotesen)" }
  - { sym: "S",    means: "utvalgs-standardavviket (estimat for σ)" }
  - { sym: "n",    means: "antall observasjoner" }
  - { sym: "ν",    means: "frihetsgrader, ν = n - 1" }
  - { sym: "T",    means: "testobservatoren, t-fordelt under H₀" }

filters:
  computes: [hypothesis_test]
  random_variable: [mean_of_samples]
  setup: [single_population]
  structural_cues: [normal_assumed, data_as_list, summary_stats_given, total_observations_n]
  parameters_known: [population_variance_unknown, mean_known, sample_size_small_lt30, alpha_significance]
  distribution_assumption: [t_distribution]
  tooling: [t_quantile_table_E5]

solution_variants:
  - label: "H₁: μ < μ₀ (venstre)"
    description: "Ensidig venstresidig test. Forkast H₀ hvis `T < −t_(α, ν)`."
    steps:
      - "Formuler hypotesene: `H₀: μ = μ₀` mot `H₁: μ < μ₀` (venstresidig)"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - "Beregn `x̄` og `s` fra dataene (`s² = (1/(n−1))·Σ(xᵢ − x̄)²`)"
      - "Beregn testobservatoren `T = (x̄ − μ₀)/(s/√n)` (f.eks. `n = 12`, `ν = 11`, `x̄ = 4.6`, `s = 0.8`, `μ₀ = 5.0` → `T = (4.6−5.0)/(0.8/√12) ≈ −1.732`)"
      - { text: "Hvis `σ` er kjent, bruk z-test i stedet (mer presist for kjent `σ`)", conditional: true }
      - "Slå opp `t_(α, ν)` i tabell E.5 med `ν = n − 1` frihetsgrader (f.eks. `α = 0.05`, `ν = 11` → `t_(0.05, 11) ≈ 1.796`)"
      - "Forkastingsregel: forkast `H₀` hvis `T < −t_(α, ν)` (kritisk verdi er negativ for venstresidig)"
      - { text: "Hvis du oppgir p-verdi: ensidig `p = P(T < t, ν)` (venstresidig); forkast hvis `p < α`", conditional: true }
      - "Konkluder i kontekst: hvis `T < −t_(α, ν)`, er det signifikant evidens for at `μ < μ₀`"
  - label: "H₁: μ > μ₀ (høyre)"
    description: "Ensidig høyresidig test. Forkast H₀ hvis `T > +t_(α, ν)`."
    steps:
      - "Formuler hypotesene: `H₀: μ = μ₀` mot `H₁: μ > μ₀` (høyresidig)"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - "Beregn `x̄` og `s` fra dataene (`s² = (1/(n−1))·Σ(xᵢ − x̄)²`)"
      - "Beregn testobservatoren `T = (x̄ − μ₀)/(s/√n)` (f.eks. `n = 12`, `ν = 11`, `x̄ = 5.4`, `s = 0.8`, `μ₀ = 5.0` → `T = (5.4−5.0)/(0.8/√12) ≈ 1.732`)"
      - { text: "Hvis `n` er stor (`≥ 30`), gir t- og z-test nær identiske svar", conditional: true }
      - "Slå opp `t_(α, ν)` i tabell E.5 med `ν = n − 1` frihetsgrader (f.eks. `α = 0.05`, `ν = 11` → `t_(0.05, 11) ≈ 1.796`)"
      - "Forkastingsregel: forkast `H₀` hvis `T > +t_(α, ν)` (kritisk verdi er positiv for høyresidig)"
      - { text: "Hvis du oppgir p-verdi: ensidig `p = P(T > t, ν)` (høyresidig); forkast hvis `p < α`", conditional: true }
      - "Konkluder i kontekst: hvis `T > +t_(α, ν)`, er det signifikant evidens for at `μ > μ₀`"
  - label: "H₁: μ ≠ μ₀ (tosidig)"
    description: "Tosidig test. Forkast H₀ hvis `|T| > t_(α/2, ν)`."
    steps:
      - "Formuler hypotesene: `H₀: μ = μ₀` mot `H₁: μ ≠ μ₀` (tosidig)"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - "Beregn `x̄` og `s` fra dataene (`s² = (1/(n−1))·Σ(xᵢ − x̄)²`)"
      - "Beregn testobservatoren `T = (x̄ − μ₀)/(s/√n)` (f.eks. `n = 10`, `ν = 9`, `x̄ = 71.30`, `s = 14.33`, `μ₀ = 70` → `T = (71.30−70)/(14.33/√10) ≈ 0.287`)"
      - { text: "Hvis `σ` er kjent, bruk z-test i stedet (mer presist for kjent `σ`)", conditional: true }
      - "Slå opp `t_(α/2, ν)` i tabell E.5 med `ν = n − 1` frihetsgrader (merk: `α/2`, ikke `α`; f.eks. `α = 0.05`, `ν = 9` → `t_(0.025, 9) ≈ 2.262`)"
      - "Forkastingsregel: forkast `H₀` hvis `|T| > t_(α/2, ν)` (kritisk verdi gjelder begge haler)"
      - { text: "Hvis du oppgir p-verdi: tosidig `p = 2·P(T > |t|, ν)`; forkast hvis `p < α`", conditional: true }
      - "Konkluder i kontekst: hvis `|T| > t_(α/2, ν)`, er det signifikant evidens for at `μ ≠ μ₀`; ellers beholdes `H₀`"

common_traps: |
  Husk frihetsgrader: ν = n - 1 for én-utvalgs t-test (ikke n - 2 som i
  regresjon, og ikke n_X + n_Y - 2 som i to-utvalgs). Pass på fortegn:
  for venstresidig test sammenlignes med -t_α, for høyresidig med +t_α.
  Tosidig: |t| > t_(α/2,ν).

python_snippet: |
  from scipy.stats import t

  x_bar, mu0, s, n, alpha = 71.30, 70, 14.33, 10, 0.05
  t_obs = (x_bar - mu0) / (s / (n ** 0.5))     # 0.287

  # Tosidig kritisk verdi
  t_crit = t.ppf(1 - alpha/2, df=n-1)          # 2.262

  reject = abs(t_obs) > t_crit                 # False

