id: variansen-til-stigningstallet
term_no: Variansen til stigningstallet (Var(βˆ))
short_def: "Spredningen i regresjonsstigningen: `Var(βˆ) = S_E² / S_XX`, der `S_XX = Σ(xᵢ − x̄)²`."
filters:
  random_variable: [slope_estimate]
  setup: [linear_relationship]
  parameters_known: [slope_se, residual_variance, sum_xx_sxy]
  computes: [std_dev, hypothesis_test]
  structural_cues: [linear_relationship_suspected]
  distribution_assumption: [t_distribution]
long_def: |
  Formel:

      Var(βˆ) = S_E² / S_XX        der    S_XX = Σ(xᵢ − x̄)²

  Hvor presist vi kjenner `βˆ` — variansen i estimatet av stigningstallet.

  **Trenger rådata?** Indirekte: trenger `S_E²` (residualvariansen) og
  `S_XX`. Begge regnes fra rådataene `(xᵢ, yᵢ)`. Hvis disse størrelsene
  er oppgitt, trenger du ikke selve observasjonene.

  - **Stor `S_XX`** (mye spredning i x) → liten `Var(βˆ)` → presis estimering.
  - **Liten `S_XX`** (data klumpet på én x-verdi) → høy usikkerhet.

  Standardfeilen:

      SE(βˆ) = √(S_E² / S_XX)

  — brukes i hypotesetest og KI for `β`.
aliases:
  - variansen til stigningstallet
  - varians til stigningstallet
  - var(βˆ)
  - var(beta-hat)
