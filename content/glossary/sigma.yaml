id: sigma
term_no: Sigma (σ)
short_def: "Populasjonens standardavvik — spredningen rundt μ, samme enhet som dataene."
long_def: |
  σ = √Var(X) er standardavviket til populasjonen. Når σ er kjent, brukes
  z-test og z-baserte KI; når σ er ukjent (det vanlige), bruker du s
  (utvalgets standardavvik) og t-fordeling. Pass på: stor Σ er sumtegn,
  liten σ er standardavvik — to helt forskjellige ting.
