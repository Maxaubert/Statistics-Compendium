id: sentralgrenseteoremet
name_no: "Sentralgrenseteoremet"
type: concept
tagline: "Gjennomsnittet av mange uavhengige variabler er tilnærmet normalfordelt."

what_it_means: |
  Sentralgrenseteoremet (CLT) sier at hvis X_1, ..., X_n er uavhengige
  og identisk fordelte med forventning μ og standardavvik σ, så er
  utvalgsgjennomsnittet X̄ tilnærmet normalfordelt N(μ, σ/√n) når n er
  stort, UANSETT hvilken fordeling X_i har.

  Tommelfingerregel: n ≥ 30 er ofte nok for at tilnærmingen er god,
  unntatt ved svært skjev fordeling.

  Konsekvens: z-test og t-test kan brukes også for ikke-normalfordelte
  observasjoner, så lenge n er stort.

  Hvis n er for liten og fordelingen ikke kan antas normal: bruk bootstrapping.

recognition_cues:
  - "Begrunnelsen 'antallet observasjoner er stort, så vi bruker normalfordeling'"
  - "Spørsmål om hvorfor en z-test eller t-test er gyldig"
  - "n ≥ 30 nevnes"

filters: {}

related:
