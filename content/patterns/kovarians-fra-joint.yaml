id: kovarians-fra-joint
name_no: "Joint table gitt, beregn kovarians"
cue: "Du har en simultanfordeling P(X = x, Y = y) og oppgaven ber om kovariansen Cov(X, Y) — ofte som steg på vei mot korrelasjonen ρ eller variansen til en sum Var(X + Y). Krever marginalene først."
procedure:
  - "Regn marginalfordelingene: P(X = x_i) = Σ_j P(x_i, y_j) og P(Y = y_j) = Σ_i P(x_i, y_j)"
  - "Regn μ_X = E[X] = Σ x_i · P(X = x_i)"
  - "Regn μ_Y = E[Y] = Σ y_j · P(Y = y_j)"
  - "Regn E[XY] = Σ_i Σ_j x_i · y_j · P(X = x_i, Y = y_j) (gå gjennom HELE joint-tabellen)"
  - "Cov(X, Y) = E[XY] − μ_X · μ_Y"
  - "Sanity check: hvis X og Y er uavhengige, skal Cov være 0"
entry_refs:
  - kovarians
  - marginalfordeling
example: "Joint som over: μ_X = 0.7, μ_Y = 0.6. E[XY] = 0·0·0.1 + 0·1·0.2 + 1·0·0.3 + 1·1·0.4 = 0.4. Cov(X, Y) = 0.4 − 0.7·0.6 = 0.4 − 0.42 = −0.02."
