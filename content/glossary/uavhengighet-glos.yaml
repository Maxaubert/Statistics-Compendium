id: uavhengighet-glos
term_no: Uavhengighet (uavhengige hendelser)
short_def: "`A` og `B` er uavhengige hvis `P(A ∩ B) = P(A)·P(B)` — `A` endrer ikke sannsynligheten for `B`."
filters:
  structural_cues: [independent_events, joint_table_present]
  computes: [test_independence, joint_probability]
  setup: [joint_table_given]
long_def: |
  Tre ekvivalente definisjoner:

      P(A ∩ B) = P(A) · P(B)
      P(B | A) = P(B)
      P(A | B) = P(A)

  Uavhengighet er **IKKE** det samme som disjunkthet — disjunkte hendelser
  med positiv sannsynlighet er sterkt avhengige.

  **TESTE uavhengighet:** regn ut `P(A) · P(B)` og sammenlign med oppgitt
  eller observert `P(A ∩ B)`. Hvis de er like, er hendelsene uavhengige.
  Alternativt: sjekk om `P(B|A) = P(B)`.

  For utvalg: observasjoner kalles uavhengige hvis verdien til den ene
  ikke påvirker den andre (typisk antatt for utvalg fra populasjon).
aliases:
  - uavhengig
  - uavhengige
  - uavhengighet
  - uavhengigheten
