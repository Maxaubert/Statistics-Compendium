summary:
  entries_audited: 23
  total_contexts: 75
  contexts_with_missing_tags: 53
  total_missing_tag_findings: 92
  proposed_new_dimensions: 0
  proposed_new_values: 0
notes: |
  All 23 a-g glossary entries audited. Key patterns observed:

  1. Symbol entries (alpha, beta) lose their alias-meanings:
     - alpha is missing intercept/regression context (setup: linear_relationship,
       computes: parameter_estimate, structural_cues: linear_relationship_suspected)
     - beta is missing computes: confidence_interval despite long_def covering KI for β
     - gjennomsnitt is missing computes: confidence_interval despite KI for μ being a
       very common exam task using X̄

  2. Test-related entries (alternativhypotese, ensidig-test, forkastningsomrade,
     frihetsgrader-glos) are largely correctly tagged but consistently miss the
     associated distribution_assumption / tooling tags that students would use to
     filter (t_distribution + t_quantile_table_E5, normal + normal_quantile_table_E4,
     chi_squared + chi_square_quantile_table_E6).

  3. Probability-rule entries (betinget-sannsynlighet-glos, de-morgans-lov,
     disjunkte-hendelser-glos) miss cross-references between rules (e.g. betinget
     in joint_table_given context, disjunkt vs independent test).

  4. Variance-formula entries (binomialvarians, eksponentialvarians, diskret-varians)
     consistently miss expected_value as a co-tag despite the long_def listing E[X]
     formula alongside Var(X). They also miss process/distribution structural_cues
     (poisson_process_mentioned, time_until_first, rate_given) for exponential.

  5. Estimator-theory entries (bias, estimator, forventningsrett) need std_dev as a
     co-compute since variance is part of MSE and the n vs n-1 discussion.

  No new filter dimensions or values were needed — the existing taxonomy in
  filters.yaml is comprehensive enough to cover all observed exam contexts.
