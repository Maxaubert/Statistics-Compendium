id: konfidensintervall
term_no: Konfidensintervall (KI)
short_def: "Intervall som med `(1 − α)·100 %` sikkerhet inneholder den ukjente parameteren."
filters:
  computes: [confidence_interval, parameter_estimate, find_n_for_threshold]
  parameters_known: [confidence_level, alpha_significance, population_variance_unknown, population_variance_known]
  random_variable: [proportion]
  distribution_assumption: [binomial, normal, t_distribution]
  tooling: [normal_quantile_table_E4, t_quantile_table_E5]
  structural_cues: [probability_threshold]
aliases:
  - konfidensintervall
  - konfidensintervallet
  - konfidensintervaller
  - konfidensintervallene
  - KI
long_def: |
  Generell form:

      estimat ± kvantil · standardfeil

  Eksempel — 95 % KI for `μ` med kjent `σ`:

      X̄ ± 1.96 · σ/√n

  **Tolking:** hvis vi gjentok eksperimentet mange ganger, ville
  `(1 − α)·100 %` av intervallene fange den sanne parameteren.
see_also:
  - { id: ki-mu-og-varians, kind: entry }
  - { id: ki-andel-binomial, kind: entry }
