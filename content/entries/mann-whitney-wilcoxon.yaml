id: mann-whitney-wilcoxon
name_no: "Mann-Whitney-Wilcoxon-test (uparet, ikke-parametrisk)"
type: test
category: hypothesis_test
tagline: "Ikke-parametrisk to-utvalgstest som sammenligner to uavhengige grupper uten antagelse om normalfordeling."

formula_main: "U = W − n₁(n₁+1)/2"
formula_latex: "U = W - \\frac{n_1 (n_1 + 1)}{2}"

what_it_does: |
  Tester om to uavhengige utvalg kommer fra samme fordeling, basert på rangering
  av alle observasjonene samlet. Man rangerer alle `n = n₁ + n₂` observasjonene
  fra 1 til `n`, summerer rangene for ett av utvalgene (`W`), og regner ut
  testobservatoren `U`. Små verdier av `U` betyr at den ene gruppa har systematisk
  lave rangtall (små verdier), store verdier at den har systematisk høye rangtall.

why_use: |
  Brukes når man ikke vil eller kan anta normalfordelte data — typisk ved små
  utvalg, asymmetriske fordelinger, eller når oppgaveteksten eksplisitt sier
  «ikke-parametrisk test». Krever bare at observasjonene kan rangeres
  (ordinalskala eller bedre). MWW er det ikke-parametriske alternativet til
  uparet to-utvalgs t-test.

recognition_cues:
  - "Oppgaveteksten sier 'ikke-parametrisk', 'fordelingsfri', 'Mann-Whitney' eller 'Wilcoxon (uparet)'"
  - "Det er to uavhengige grupper, men man kan IKKE anta normalfordeling"
  - "Utvalgsstørrelsene er små, slik at sentralgrenseteoremet ikke 'redder' t-testen"
  - "Data er på ordinalskala (ranger, karakterer) — gjennomsnitt gir lite mening"
  - "Det er gitt en U-tabell for kritiske verdier i vedlegget"

when_NOT_to_use:
  - "Data er normalfordelt eller `n` er stor → bruk [to-utvalgs t-test](/entry/to-utvalgs-t-test) (mer effektiv)"
  - "Observasjonene er paret (samme individ målt to ganger) → bruk Wilcoxon tegn-rangtest (paret variant)"
  - "Du tester ett utvalg mot en kjent verdi → bruk [én-utvalg t-test](/entry/en-utvalg-t-test) eller tegn-test"
  - "Mange like verdier (mye tie-ing) — testen er mindre presis; vurder evt. normalapproksimasjon med tie-korreksjon"

symbols:
  - { sym: "n₁, n₂",   means: "antall observasjoner i hver av de to gruppene" }
  - { sym: "n",        means: "totalt antall, `n = n₁ + n₂`" }
  - { sym: "R(x_i)",   means: "rangtallet til observasjon `x_i` i den samlede sorterte listen (1 = lavest, `n` = høyest)" }
  - { sym: "W",        means: "rangsummen (sum av rangtall) for ett av utvalgene; konvensjonelt gruppe 1, slik at `n₁` viser til dette utvalget" }
  - { sym: "U",        means: "testobservatoren, `U = W − n₁(n₁+1)/2`" }
  - { sym: "U₁, U₂",   means: "U beregnet fra hvert utvalg; `U₁ + U₂ = n₁·n₂`" }
  - { sym: "U_(α, n₁, n₂)", means: "kritisk verdi fra U-tabellen (vedlagt). Forkast `H₀` hvis testobservatoren er `≤` denne." }
  - { sym: "H₀",       means: "nullhypotesen: de to gruppene har samme fordeling (samme median/sentraltendens)" }
  - { sym: "H₁",       means: "alternativhypotesen: fordelingene er forskjellige (tosidig) eller forskjøvet i én retning (ensidig)" }
  - { sym: "α",        means: "signifikansnivå (typisk `0.05`)" }

filters:
  computes: [hypothesis_test]
  random_variable: [continuous, difference_of_means]
  setup: [two_independent_samples]
  structural_cues: [data_as_list, total_observations_n, two_sided_alternative, one_sided_alternative, nonparametric_required, rank_based_data]
  parameters_known: [population_variance_unknown, sample_size_small_lt30, alpha_significance]
  distribution_assumption: [none_assumed]
  tooling: [mann_whitney_table_E7]

tags:
  - "ikke-parametrisk"
  - "fordelingsfri"
  - "rangsum"
  - "rangtest"
  - "Mann-Whitney"
  - "Wilcoxon"

solution_variants:
  - label: "H₁: μ_X ≠ μ_Y (tosidig)"
    steps:
      - text: "Formuler hypotesene (tosidig):"
        formula: "H₀: fordelingene er like     mot     H₁: fordelingene er forskjøvet (μ_X ≠ μ_Y)"
      - "Begrunn MWW: to uavhengige utvalg, normalfordeling kan IKKE antas, og oppgaven krever ikke-parametrisk test"
      - "Slå alle `n = n₁ + n₂` observasjoner sammen og sorter fra lavest til høyest"
      - text: "Tilordne rangtall 1, 2, ..., `n` (laveste = 1). Marker hver verdi med gruppe (X eller Y). Ved likheter: gi gjennomsnittsrang (f.eks. ranger 3 og 4 deles → begge får 3.5)."
      - text: "Mini-eksempel: `n_X = 3`, `n_Y = 3`. Du har **n = n_X + n_Y = 6** observasjoner totalt. Alle sorteres samlet og får ranger **1 til 6** — ikke 1 til 3 i hver gruppe:"
        formula: "n_X = 3, n_Y = 3  ⇒  n = n_X + n_Y = 6  (ranger 1..6, samlet sortering)"
        table:
          headers: ["Rang", "Verdi", "Gruppe"]
          rows:
            - ["1", "2.1", "Y"]
            - ["2", "3.4", "X"]
            - ["3", "4.7", "Y"]
            - ["4", "5.0", "X"]
            - ["5", "6.2", "X"]
            - ["6", "7.1", "Y"]
        example: true
      - text: "Beregn rangsummen `W` for det utvalget du valgte som «gruppe 1» (her `X`). **NB:** Du summerer RANGENE (1, 2, 3, ...) til X-observasjonene — ikke selve verdiene. Hopp over Y-radene."
        formula: "W = Σ R(x_i) for x_i i gruppe 1   (sum av rangtall, ikke av verdier)"
      - text: "Mini-eksempel: I rang-tabellen over har X rang **2, 4, 5** (verdiene 3.4, 5.0, 6.2). Y har rang 1, 3, 6 og hoppes over. Da:"
        formula: ["W_X = 2 + 4 + 5 = 11   (sum av X-rangene)", "W_Y = 1 + 3 + 6 = 10   (sum av Y-rangene, til kontroll)", "Kontroll: W_X + W_Y = 21 = n(n+1)/2 = 6·7/2 ✓"]
        example: true
      - text: "I formelen er `W` rangsummen til **én** gruppe — ikke `W_X + W_Y`. Du regner én `U` per gruppe, der `n₁` er antallet i den gruppa du setter inn:"
        formula: ["U_X = W_X − n_X(n_X+1)/2", "U_Y = W_Y − n_Y(n_Y+1)/2"]
      - text: "Verifiser med kontroll-regelen `U₁ + U₂ = n₁·n₂` (regn også ut `U₂` fra den andre gruppa, eller bruk `U₂ = n₁·n₂ − U₁`)."
      - text: "Bruk `min(U₁, U₂)` — den minste av de to — som testobservator for tosidig test."
      - text: "Slå opp kritisk verdi `U_(α/2, n₁, n₂)` i tabell E.7."
      - text: "Forkastingsregel (tosidig):"
        formula: "Forkast H₀ hvis min(U₁, U₂) ≤ U_(α/2, n₁, n₂)"
      - "Konkluder i kontekst"
  - label: "H₁: μ_X < μ_Y (venstresidig)"
    steps:
      - text: "Formuler hypotesene (venstresidig — gruppe X har lavere verdier):"
        formula: "H₀: fordelingene er like     mot     H₁: μ_X < μ_Y"
      - "Begrunn MWW: to uavhengige utvalg, normalfordeling kan IKKE antas, og oppgaven krever ikke-parametrisk test"
      - "Slå alle `n = n_X + n_Y` observasjoner sammen og sorter fra lavest til høyest"
      - text: "Tilordne rangtall 1, 2, ..., `n` (laveste = 1). Marker hver verdi med gruppe (X eller Y). Ved likheter: gi gjennomsnittsrang (f.eks. ranger 3 og 4 deles → begge får 3.5)."
      - text: "Mini-eksempel: `n_X = 3`, `n_Y = 3`. Du har **n = n_X + n_Y = 6** observasjoner totalt. Alle sorteres samlet og får ranger **1 til 6** — ikke 1 til 3 i hver gruppe:"
        formula: "n_X = 3, n_Y = 3  ⇒  n = n_X + n_Y = 6  (ranger 1..6, samlet sortering)"
        table:
          headers: ["Rang", "Verdi", "Gruppe"]
          rows:
            - ["1", "2.1", "Y"]
            - ["2", "3.4", "X"]
            - ["3", "4.7", "Y"]
            - ["4", "5.0", "X"]
            - ["5", "6.2", "X"]
            - ["6", "7.1", "Y"]
        example: true
      - text: "Beregn rangsummen `W_X` for gruppe X (den vi tror har lave verdier). **NB:** Du summerer X-RANGENE — ikke selve verdiene. Hopp over Y-radene."
        formula: "W_X = Σ R(x_i)   (sum av rangtall, ikke av verdier)"
      - text: "Mini-eksempel: I rang-tabellen over har X rang **2, 4, 5** (verdiene 3.4, 5.0, 6.2). Y har rang 1, 3, 6 og hoppes over. Da:"
        formula: ["W_X = 2 + 4 + 5 = 11   (sum av X-rangene)", "W_Y = 1 + 3 + 6 = 10   (sum av Y-rangene, til kontroll)", "Kontroll: W_X + W_Y = 21 = n(n+1)/2 = 6·7/2 ✓"]
        example: true
      - text: "Beregn `U_X`. H₁ sier at X har lave verdier ⇒ X får lave rangtall ⇒ `U_X` blir liten ved forkastning. Det er derfor `U_X` som er testobservatoren:"
        formula: "U_X = W_X − n_X(n_X+1)/2"
      - text: "Verifiser med kontroll-regelen `U_X + U_Y = n_X · n_Y` (regn også ut `U_Y` direkte, eller bruk `U_Y = n_X·n_Y − U_X`)."
      - text: "Slå opp kritisk verdi `U_(α, n_X, n_Y)` i tabell E.7."
      - text: "Forkastingsregel (venstresidig):"
        formula: "Forkast H₀ hvis U_X ≤ U_(α, n_X, n_Y)"
      - "Konkluder i kontekst"
  - label: "H₁: μ_X > μ_Y (høyresidig)"
    steps:
      - text: "Formuler hypotesene (høyresidig — gruppe X har høyere verdier):"
        formula: "H₀: fordelingene er like     mot     H₁: μ_X > μ_Y"
      - "Begrunn MWW: to uavhengige utvalg, normalfordeling kan IKKE antas, og oppgaven krever ikke-parametrisk test"
      - "Slå alle `n = n_X + n_Y` observasjoner sammen og sorter fra lavest til høyest"
      - text: "Tilordne rangtall 1, 2, ..., `n` (laveste = 1). Marker hver verdi med gruppe (X eller Y). Ved likheter: gi gjennomsnittsrang (f.eks. ranger 3 og 4 deles → begge får 3.5)."
      - text: "Mini-eksempel: `n_X = 3`, `n_Y = 3`. Du har **n = n_X + n_Y = 6** observasjoner totalt. Alle sorteres samlet og får ranger **1 til 6** — ikke 1 til 3 i hver gruppe:"
        formula: "n_X = 3, n_Y = 3  ⇒  n = n_X + n_Y = 6  (ranger 1..6, samlet sortering)"
        table:
          headers: ["Rang", "Verdi", "Gruppe"]
          rows:
            - ["1", "2.1", "Y"]
            - ["2", "3.4", "X"]
            - ["3", "4.7", "Y"]
            - ["4", "5.0", "X"]
            - ["5", "6.2", "X"]
            - ["6", "7.1", "Y"]
        example: true
      - text: "Beregn rangsummen `W_Y` for gruppe Y. (H₁ sier X er høy ⇒ Y er lav ⇒ vi følger Y her.) **NB:** Du summerer Y-RANGENE — ikke selve verdiene. Hopp over X-radene."
        formula: "W_Y = Σ R(y_j)   (sum av rangtall, ikke av verdier)"
      - text: "Mini-eksempel: I rang-tabellen over har Y rang **1, 3, 6** (verdiene 2.1, 4.7, 7.1). X har rang 2, 4, 5 og hoppes over. Da:"
        formula: ["W_Y = 1 + 3 + 6 = 10   (sum av Y-rangene)", "W_X = 2 + 4 + 5 = 11   (sum av X-rangene, til kontroll)", "Kontroll: W_X + W_Y = 21 = n(n+1)/2 = 6·7/2 ✓"]
        example: true
      - text: "Beregn `U_Y`. H₁ sier at X har høye verdier ⇒ Y får lave rangtall ⇒ `U_Y` blir liten ved forkastning. Det er derfor `U_Y` som er testobservatoren:"
        formula: "U_Y = W_Y − n_Y(n_Y+1)/2"
      - text: "Verifiser med kontroll-regelen `U_X + U_Y = n_X · n_Y` (regn også ut `U_X` direkte, eller bruk `U_X = n_X·n_Y − U_Y`)."
      - text: "Slå opp kritisk verdi `U_(α, n_X, n_Y)` i tabell E.7."
      - text: "Forkastingsregel (høyresidig):"
        formula: "Forkast H₀ hvis U_Y ≤ U_(α, n_X, n_Y)"
      - "Konkluder i kontekst"

common_traps: |
  **Pluss eller gange?** Det er to forskjellige `n`-uttrykk som lett blandes:

  - **Rangering:** `n = n_X + n_Y` (legg sammen). Med `n_X = n_Y = 5` får
    du `n = 10` ranger samlet, ikke 1..5 i hver gruppe. Laveste verdi blant
    alle 10 får rang 1, høyeste får rang 10.
  - **U-kontrollregel:** `U_X + U_Y = n_X · n_Y` (gang sammen). Med
    `n_X = n_Y = 5` skal `U_X + U_Y = 25`. Bruker du `+` her, gjør du feil.

  **U skal være LITEN** for å gi forkastning — motsatt av t-testen der `|t|`
  skal være stor. Tabell E.7 er indeksert på **ensidig α**. Ved tosidig test
  på problemnivå `α_to` slår du opp under ensidig `α = α_to / 2`; ved ensidig
  test bruker du problemets α direkte. Verifiser alltid `U₁ + U₂ = n₁·n₂` —
  feiler den, har du gjort feil i rangtildelingen (typisk ved likheter).

python_snippet: |
  from scipy.stats import mannwhitneyu
  X = [5.7, 7.3, 7.6, 6.0, 6.5]
  Y = [4.9, 7.4, 5.3, 4.6, 6.2]
  # alternative: 'two-sided' (tosidig), 'less' (μ_X<μ_Y), 'greater' (μ_X>μ_Y)
  res = mannwhitneyu(X, Y, alternative='two-sided', method='exact')
  print(f"U = {res.statistic}, p = {res.pvalue:.4f}")
  # scipy returnerer U for første argument (her X). For å sammenligne med
  # tabellen brukes ofte min(U_X, U_Y) der U_Y = n_X*n_Y - U_X.

detailed_solution_variants:
  - label: "H₁: μ_X ≠ μ_Y (tosidig)"
    solutions:
      - source: "Eksamen · oppgave 6 (flammehemmende stoff)"
        question: "Et tøystykke av to ulike stoff testes for flammehemmende egenskaper. Vertikal skade (cm) etter 10 sek åpen flamme: Stoff X: 5.7, 7.3, 7.6, 6.0, 6.5. Stoff Y: 4.9, 7.4, 5.3, 4.6, 6.2. Gir undersøkelsene grunn til å hevde at de er forskjellige? Bruk Mann-Whitney-Wilcoxon på α = 0.05. (Data antas IKKE normalfordelte.)"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "To uavhengige utvalg av målt skade." }
              - { text: "`n_X = 5`, `n_Y = 5`, `n = 10`." }
              - { text: "`α = 0.05`, tosidig." }
              - { text: "Oppgaven sier eksplisitt: ikke normalfordeling kan antas ⇒ MWW." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀:` stoff X og Y har samme fordeling av skadelengde." }
              - { text: "`H₁:` fordelingene er forskjellige (tosidig)." }
          - label: "Ranger alle 10 observasjoner samlet"
            lines:
              - { text: "Sortert (lavest → høyest) med gruppe og rang:" }
              - { table: { headers: ["Rang", "Verdi", "Gruppe"], rows: [
                    ["1",  "4.6", "Y"],
                    ["2",  "4.9", "Y"],
                    ["3",  "5.3", "Y"],
                    ["4",  "5.7", "X"],
                    ["5",  "6.0", "X"],
                    ["6",  "6.2", "Y"],
                    ["7",  "6.5", "X"],
                    ["8",  "7.3", "X"],
                    ["9",  "7.4", "Y"],
                    ["10", "7.6", "X"]
                  ] } }
              - { text: "Ingen likheter — alle rangtall heltall." }
          - label: "Rangsummer W"
            lines:
              - { text: "`W_X = 4 + 5 + 7 + 8 + 10 = 34`" }
              - { text: "`W_Y = 1 + 2 + 3 + 6 + 9 = 21`" }
              - { text: "Kontroll: `W_X + W_Y = 34 + 21 = 55 = n(n+1)/2 = 10·11/2 = 55` ✓" }
          - label: "Testobservator U"
            lines:
              - { text: "`U_X = W_X − n_X(n_X+1)/2 = 34 − 5·6/2 = 34 − 15 = 19`" }
              - { text: "`U_Y = W_Y − n_Y(n_Y+1)/2 = 21 − 5·6/2 = 21 − 15 = 6`" }
              - { text: "Kontroll: `U_X + U_Y = 19 + 6 = 25 = n_X·n_Y = 5·5` ✓" }
              - { text: "Tosidig test: bruk `U = min(U_X, U_Y) = min(19, 6) = 6`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "Tosidig problem-α `α_to = 0.05` ⇒ bruk ensidig `α = α_to/2 = 0.025` som kolonne, `n₁ = n₂ = 5`." }
              - { table_lookup: { ref: "E.7", text: "`U_(0.025, 5, 5) = 2`; forkast `H₀` hvis `min(U_X, U_Y) ≤ 2`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `min(U_X, U_Y) = 6` IKKE `≤ 2`." }
              - { text: "Behold `H₀`." }
              - { comment: "Eksakt to-sidig p-verdi for disse data er ca. 0.22 — langt fra signifikant." }
        result: "`U = 6 > 2` ⇒ behold `H₀`. På α = 0.05 er det IKKE grunnlag for å hevde at de to stoffene har forskjellige flammehemmende egenskaper."

      - source: "Praksis · bremselengde to dekktyper"
        question: "Bremselengde (m) for to dekktyper testes på våt vei. Dekk X (n_X = 6): 41, 43, 38, 39, 44, 40. Dekk Y (n_Y = 5): 47, 49, 42, 46, 45. Sjekk om bremselengdene er forskjellige med MWW på α = 0.05. (Ingen normalfordelingsantakelse.)"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n_X = 6`, `n_Y = 5`, `n = 11`, `α = 0.05`, tosidig." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀:` lik fordeling for X og Y." }
              - { text: "`H₁:` ulik fordeling (tosidig)." }
          - label: "Sortering og rang"
            lines:
              - { table: { headers: ["Rang", "Verdi", "Gruppe"], rows: [
                    ["1",  "38", "X"],
                    ["2",  "39", "X"],
                    ["3",  "40", "X"],
                    ["4",  "41", "X"],
                    ["5",  "42", "Y"],
                    ["6",  "43", "X"],
                    ["7",  "44", "X"],
                    ["8",  "45", "Y"],
                    ["9",  "46", "Y"],
                    ["10", "47", "Y"],
                    ["11", "49", "Y"]
                  ] } }
          - label: "Rangsummer og U"
            lines:
              - { text: "`W_X = 1+2+3+4+6+7 = 23`" }
              - { text: "`W_Y = 5+8+9+10+11 = 43`" }
              - { text: "Kontroll: `23 + 43 = 66 = 11·12/2` ✓" }
              - { text: "`U_X = 23 − 6·7/2 = 23 − 21 = 2`" }
              - { text: "`U_Y = 43 − 5·6/2 = 43 − 15 = 28`" }
              - { text: "Kontroll: `U_X + U_Y = 30 = n_X·n_Y` ✓" }
              - { text: "`min(U_X, U_Y) = 2`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "Tosidig problem-α `α_to = 0.05` ⇒ ensidig `α = 0.025`, `n₁ = 5`, `n₂ = 6`." }
              - { table_lookup: { ref: "E.7", text: "`U_(0.025, 5, 6) = 3`; forkast `H₀` hvis `min(U_X, U_Y) ≤ 3`." } }
          - label: "Konklusjon"
            lines:
              - { text: "`2 ≤ 3` ⇒ forkast `H₀`." }
        result: "`U = 2 ≤ 3` ⇒ forkast `H₀`. Det er signifikant forskjell på bremselengdene mellom de to dekktypene på α = 0.05."

  - label: "H₁: μ_X < μ_Y (venstresidig)"
    solutions:
      - source: "Praksis · holdbarhet av maling"
        question: "Holdbarhet (skala 1–100) for tradisjonell maling X og ny formulering Y, hver med n = 5 prøver. Ny formulering forventes å gi høyere holdbarhet, så vi tester H₁: μ_X < μ_Y. Data: X: 60, 65, 58, 62, 70. Y: 75, 72, 68, 80, 73. Bruk MWW på α = 0.05."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n_X = 5`, `n_Y = 5`, `n = 10`, `α = 0.05`, ensidig (venstre)." }
              - { text: "Ingen normalantakelse — ikke-parametrisk MWW." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀:` lik fordeling." }
              - { text: "`H₁: μ_X < μ_Y` (tradisjonell gir mindre holdbarhet)." }
          - label: "Sortering og rang"
            lines:
              - { table: { headers: ["Rang", "Verdi", "Gruppe"], rows: [
                    ["1",  "58", "X"],
                    ["2",  "60", "X"],
                    ["3",  "62", "X"],
                    ["4",  "65", "X"],
                    ["5",  "68", "Y"],
                    ["6",  "70", "X"],
                    ["7",  "72", "Y"],
                    ["8",  "73", "Y"],
                    ["9",  "75", "Y"],
                    ["10", "80", "Y"]
                  ] } }
          - label: "Rangsum og U"
            lines:
              - { text: "`W_X = 1+2+3+4+6 = 16`" }
              - { text: "`U_X = 16 − 5·6/2 = 16 − 15 = 1`" }
              - { comment: "Venstresidig: vi tester at X får små rangtall, så det er U_X som skal være liten" }
          - label: "Tabelloppslag"
            lines:
              - { text: "Ensidig `α = 0.05`, `n₁ = n₂ = 5`." }
              - { table_lookup: { ref: "E.7", text: "`U_(0.05, 5, 5) = 4`; forkast `H₀` hvis `U_X ≤ 4`." } }
          - label: "Konklusjon"
            lines:
              - { text: "`U_X = 1 ≤ 4` ⇒ forkast `H₀`." }
        result: "`U_X = 1 ≤ 4` ⇒ forkast `H₀`. Det er statistisk grunnlag for å si at den nye malingen gir høyere holdbarhet enn den tradisjonelle på α = 0.05."

  - label: "H₁: μ_X > μ_Y (høyresidig)"
    solutions:
      - source: "Praksis · reaksjonstid med treningsprogram"
        question: "Reaksjonstid (ms) for to grupper: gruppe X uten trening (`n_X = 5`) og gruppe Y med trening (`n_Y = 5`). Trening forventes å gi raskere (lavere) reaksjon, så vi tester H₁: μ_X > μ_Y. Data: X: 250, 268, 240, 275, 262. Y: 215, 230, 245, 220, 235. MWW på α = 0.05."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n_X = 5`, `n_Y = 5`, `n = 10`, `α = 0.05`, ensidig (høyre)." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀:` lik fordeling." }
              - { text: "`H₁: μ_X > μ_Y` (utrente har lengre reaksjonstid)." }
          - label: "Sortering og rang"
            lines:
              - { table: { headers: ["Rang", "Verdi", "Gruppe"], rows: [
                    ["1",  "215", "Y"],
                    ["2",  "220", "Y"],
                    ["3",  "230", "Y"],
                    ["4",  "235", "Y"],
                    ["5",  "240", "X"],
                    ["6",  "245", "Y"],
                    ["7",  "250", "X"],
