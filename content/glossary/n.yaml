id: n
term_no: n (utvalgsstørrelse)
short_def: "Antall observasjoner i utvalget."
filters:
  structural_cues: [data_as_list, probability_threshold]
  parameters_known: [sample_size_small_lt30, sample_size_large, population_variance_unknown]
  computes: [find_n_for_threshold, std_dev, expected_value, confidence_interval]
  random_variable: [mean_of_samples]
  setup: [single_population]
aliases:
  - utvalgsstørrelse
long_def: |
  `n` er hvor mange datapunkter du har. Stor `n` gir mindre standardfeil:

      SE = σ / √n

  og dermed smalere konfidensintervall.

  Mange formler bruker `n − 1` i stedet for `n` (som ved utvalgsvarians
  og frihetsgrader for t-test) — det er ikke en feil, det er **Bessels
  korreksjon** for å gjøre estimatet forventningsrett.
see_also:
  - { id: utvalg, kind: glossary }
  - { id: standardfeil, kind: glossary }
  - { id: frihetsgrader-glos, kind: glossary }
