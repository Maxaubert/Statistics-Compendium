id: poisson-prosess
name_no: Poissonprosess
type: concept
tagline: "Tellestrøm der hendelser inntreffer uavhengig med konstant rate."

what_it_means: |
  En stokastisk prosess der hendelser inntreffer uavhengig med konstant
  rate λ over tid eller område. Konsekvenser:
  - Antall hendelser i et vindu av lengde t er Poissonfordelt med parameter λt.
  - Tid mellom påfølgende hendelser er eksponentialfordelt med parameter λ.
  - Antall hendelser i to disjunkte vinduer er uavhengige.

  Eksempler i pensum: vulkanutbrudd, sommerfugler i felle, kunder til en kasse,
  radioaktiv nedbrytning.

recognition_cues:
  - "Oppgaven sier eksplisitt 'Poissonprosess' eller 'poissonprosess'"
  - "En rate er gitt (hendelser pr. tidsenhet eller pr. arealenhet)"
  - "Hendelser inntreffer kontinuerlig og uavhengig over tid eller rom"
  - "Det er ikke noen øvre grense for antall hendelser i et vindu"

filters:
  random_variable: [discrete_count, time_until_event]
  structural_cues: [rate_given, process_over_time, independent_events]

related:
  - { id: "poisson-fordeling",      kind: "entry" }
  - { id: "eksponential-fordeling", kind: "entry" }
  - { id: "ki-poissonrate",         kind: "entry" }
