id: beta-koeffisient
term_no: Beta-koeffisient (β, stigningstall)
short_def: "Stigningstallet i regresjonslinja: hvor mye `Y` endrer seg når `X` øker med én enhet."
filters:
  random_variable: [slope_estimate]
  setup: [linear_relationship]
  structural_cues: [linear_relationship_suspected]
  computes: [parameter_estimate, confidence_interval, hypothesis_test]
  parameters_known: [slope_se, sum_xx_sxy]
  distribution_assumption: [t_distribution]
  tooling: [t_quantile_table_E5]
aliases:
  - beta-koeffisient
  - stigningstall
  - stigningstallet
  - βˆ
long_def: |
  I modellen

      Y = α + β·X + ε

  er `β` stigningstallet. `βˆ` estimeres fra data ved minste kvadraters
  metode. Tester `β = 0` sjekker om `X` har lineær effekt på `Y`.

  **KI for β:**

      βˆ ± t_(α/2, n−2) · SE(βˆ)
see_also:
  - { id: regresjon-estimat-alpha-beta, kind: entry }
  - { id: regresjon-test-stigningstall, kind: entry }
  - { id: regresjon-standardfeil-stigningstall, kind: entry }
