id: to-utvalgs-z-test-andel
name_no: "Z-test for to andeler (p_X − p_Y)"
type: test
category: hypothesis_test
tagline: "Sammenligner andelene `p_X` og `p_Y` i to uavhengige grupper med binært utfall. Bruker pooled andel under H₀."

formula_main: "Z = (p̂_X − p̂_Y) / √(p̂(1−p̂)(1/n_X + 1/n_Y));  p̂ = (x_X + x_Y)/(n_X + n_Y)"
formula_latex: "Z = \\frac{\\hat{p}_X - \\hat{p}_Y}{\\sqrt{\\hat{p}(1-\\hat{p})\\left(\\frac{1}{n_X} + \\frac{1}{n_Y}\\right)}}, \\quad \\hat{p} = \\frac{x_X + x_Y}{n_X + n_Y}"

what_it_does: |
  Tester om suksessandelen er den samme i to UAVHENGIGE populasjoner, gitt
  `x_X` suksesser av `n_X` i gruppe X og `x_Y` av `n_Y` i gruppe Y. Under
  `H₀: p_X = p_Y` estimeres den felles andelen med en **pooled** (sammenslått)
  andel `p̂ = (x_X + x_Y)/(n_X + n_Y)`, som brukes i standardfeilen. Bruker
  normalapproksimasjon for binomialfordelingen.

why_use: |
  Standardvalg når to grupper sammenlignes på en binær egenskap — andel
  defekte på to produksjonslinjer, suksessrate for to behandlinger, oppslutning
  i to velgergrupper. Pooled-andelen brukes fordi `H₀` antar at gruppene har
  SAMME andel; da er det beste estimatet å slå sammen begge utvalg.

recognition_cues:
  - "To UAVHENGIGE grupper, hver med et binært utfall (suksess/fiasko)"
  - "Du har `x_X` av `n_X` og `x_Y` av `n_Y`, og spør om andelene er like/ulike"
  - "Spørsmålet sammenligner to andeler: «er den ene høyere/lavere/forskjellig?»"
  - "Begge utvalg er store nok til normalapproksimasjon (`n·p̂·(1−p̂) ≥ 5` i hver gruppe)"

when_NOT_to_use:
  - "Bare ÉN gruppe testes mot en kjent `p₀` → bruk [z-test for andel](/entry/en-utvalg-z-test-andel)"
  - "Du vil estimere differansen `p_X − p_Y` med usikkerhetsmargin → bruk [KI for to utvalg](/entry/ki-to-utvalg)"
  - "Du sammenligner gjennomsnitt, ikke andeler → bruk [to-utvalgs t-test](/entry/to-utvalgs-t-test)"
  - "Du har en r×c kontingenstabell med flere kategorier → bruk [kjikvadrat for uavhengighet](/entry/kjikvadrat-uavhengighet) (2×2-tabell gir samme svar som denne testen)"

symbols:
  - { sym: "x_X, x_Y",   means: "antall suksesser i hver gruppe" }
  - { sym: "n_X, n_Y",   means: "utvalgsstørrelsene i hver gruppe" }
  - { sym: "p̂_X, p̂_Y",  means: "andelene i hver gruppe, `p̂_X = x_X/n_X`" }
  - { sym: "p̂",          means: "pooled (sammenslått) andel under `H₀`, `p̂ = (x_X + x_Y)/(n_X + n_Y)`" }
  - { sym: "p_X, p_Y",   means: "de ukjente populasjonsandelene (det vi sammenligner)" }
  - { sym: "Z",          means: "testobservatoren, standardnormalfordelt under `H₀`" }
  - { sym: "H₀",         means: "nullhypotesen, `p_X = p_Y`" }
  - { sym: "α",          means: "signifikansnivå (typisk 0.05)" }

filters:
  computes: [hypothesis_test]
  random_variable: [proportion, discrete_count]
  setup: [two_independent_samples]
  structural_cues: [two_outcomes_per_trial, summary_stats_given, two_sided_alternative, one_sided_alternative]
  parameters_known: [success_p, sample_size_large, alpha_significance]
  distribution_assumption: [binomial, normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]

solution_variants:
  - label: "H₁: p_X < p_Y (venstre)"
    recognition: "«Er andelen i gruppe X SIGNIFIKANT LAVERE enn i Y?», «reduserte tiltaket andelen?». To uavhengige grupper, binært utfall — ensidig venstre."
    description: "Ensidig venstresidig test. Forkast H₀ hvis Z < −z_α."
    steps:
      - text: "Formuler hypotesene (venstresidig):"
        formula: "H₀: p_X ≥ p_Y     mot     H₁: p_X < p_Y"
      - text: "Beregn gruppe-andelene:"
        formula: "p̂_X = x_X/n_X,   p̂_Y = x_Y/n_Y"
      - text: "Beregn pooled andel (slå sammen begge utvalg, siden H₀ antar lik andel):"
        formula: "p̂ = (x_X + x_Y)/(n_X + n_Y)"
      - text: "Beregn testobservatoren med pooled andel i standardfeilen:"
        formula: "Z = (p̂_X − p̂_Y) / √(p̂(1−p̂)(1/n_X + 1/n_Y))"
      - text: "Eksempel: kampanje X `24/200` vs kontroll Y `40/200` (`p̂ = 0.16`):"
        formula: "Z = (0.12 − 0.20)/√(0.16·0.84·(1/200+1/200)) ≈ −2.18"
        example: true
      - "Slå opp `z_α` i **tabell E.4** (f.eks. `α = 0.05` ⇒ `z_0.05 = 1.645`)."
      - text: "Forkastingsregel (kritisk verdi negativ):"
        formula: "Forkast H₀ hvis Z < −z_α"
      - "Konkluder i kontekst: hvis `Z < −z_α`, er andelen i X signifikant lavere enn i Y."

  - label: "H₁: p_X > p_Y (høyre)"
    recognition: "«Er andelen i X SIGNIFIKANT HØYERE enn i Y?», «gir den nye behandlingen høyere suksessrate?». Ensidig høyre."
    description: "Ensidig høyresidig test. Forkast H₀ hvis Z > +z_α."
    steps:
      - text: "Formuler hypotesene (høyresidig):"
        formula: "H₀: p_X ≤ p_Y     mot     H₁: p_X > p_Y"
      - text: "Beregn gruppe-andelene:"
        formula: "p̂_X = x_X/n_X,   p̂_Y = x_Y/n_Y"
      - text: "Beregn pooled andel:"
        formula: "p̂ = (x_X + x_Y)/(n_X + n_Y)"
      - text: "Beregn testobservatoren:"
        formula: "Z = (p̂_X − p̂_Y) / √(p̂(1−p̂)(1/n_X + 1/n_Y))"
      - text: "Eksempel: ny behandling X `78/120` vs gammel Y `60/120` (`p̂ = 0.575`):"
        formula: "Z = (0.65 − 0.50)/√(0.575·0.425·(1/120+1/120)) ≈ 2.35"
        example: true
      - "Slå opp `z_α` i **tabell E.4** (`α = 0.05` ⇒ `z_0.05 = 1.645`)."
      - text: "Forkastingsregel (kritisk verdi positiv):"
        formula: "Forkast H₀ hvis Z > +z_α"
      - "Konkluder i kontekst: hvis `Z > +z_α`, er andelen i X signifikant høyere enn i Y."

  - label: "H₁: p_X ≠ p_Y (tosidig)"
    recognition: "«Er det forskjell mellom de to gruppenes andeler?», «skiller oppslutningen seg?». Tosidig — ingen retning oppgitt, den vanligste varianten."
    description: "Tosidig test. Forkast H₀ hvis |Z| > z_(α/2)."
    steps:
      - text: "Formuler hypotesene (tosidig):"
        formula: "H₀: p_X = p_Y     mot     H₁: p_X ≠ p_Y"
      - text: "Beregn gruppe-andelene:"
        formula: "p̂_X = x_X/n_X,   p̂_Y = x_Y/n_Y"
      - text: "Beregn pooled andel:"
        formula: "p̂ = (x_X + x_Y)/(n_X + n_Y)"
      - text: "Beregn testobservatoren (fortegnet er likegyldig — vi bruker |Z|):"
        formula: "Z = (p̂_X − p̂_Y) / √(p̂(1−p̂)(1/n_X + 1/n_Y))"
      - text: "Eksempel: gruppe X `130/200` vs Y `90/180` (`p̂ = 0.579`):"
        formula: "Z = (0.65 − 0.50)/√(0.579·0.421·(1/200+1/180)) ≈ 2.96"
        example: true
      - "Slå opp `z_(α/2)` i **tabell E.4** — del `α` på 2 (`α = 0.05` ⇒ `z_0.025 = 1.96`)."
      - text: "Forkastingsregel (begge haler):"
        formula: "Forkast H₀ hvis |Z| > z_(α/2)"
      - { text: "Vil du heller estimere differansen med usikkerhet, bruk [KI for p_X − p_Y](/entry/ki-to-utvalg) — det bruker UPOOLED standardfeil (`p̂_X`, `p̂_Y` hver for seg), ikke pooled `p̂`.", conditional: true }
      - "Konkluder i kontekst: hvis `|Z| > z_(α/2)`, er andelene signifikant forskjellige."

common_traps: |
  - **Pooled vs upooled standardfeil:** hypotesetesten bruker den POOLED andelen
    `p̂ = (x_X + x_Y)/(n_X + n_Y)` i standardfeilen (fordi `H₀` antar lik andel).
    [Konfidensintervallet](/entry/ki-to-utvalg) for `p_X − p_Y` bruker derimot
    UPOOLED form med `p̂_X` og `p̂_Y` hver for seg. Ikke bland dem.
  - **Det finnes ingen t-test for andeler** — verken én- eller to-utvalgs. Standardfeilen
    kommer fra andelene selv, ikke fra et estimert `σ`.
  - **Normalapproksimasjon i BEGGE grupper:** sjekk `n·p̂·(1−p̂) ≥ 5` i hver gruppe.
    Er en gruppe liten med ekstrem andel, er testen upålitelig.
  - **2×2-ekvivalens:** denne testen gir nøyaktig samme p-verdi som en
    [kjikvadrat-test for uavhengighet](/entry/kjikvadrat-uavhengighet) på den
    tilhørende 2×2-tabellen (`Z² = χ²`). Bruk den du finner enklest.
  - **Retning og fortegn:** tegnet på `Z` avhenger av rekkefølgen `X − Y`. Hold
    styr på hvilken gruppe som er X for ensidige tester.

python_snippet: |
  from scipy.stats import norm
  import math

  xX, nX = 130, 200
  xY, nY = 90, 180
  pX, pY = xX/nX, xY/nY
  p_pool = (xX + xY) / (nX + nY)               # 0.5789
  se = math.sqrt(p_pool*(1-p_pool)*(1/nX + 1/nY))
  z = (pX - pY) / se                            # 2.96

  # Tosidig kritisk verdi og p-verdi
  z_crit = norm.ppf(1 - 0.05/2)                 # 1.96
  p_value = 2 * (1 - norm.cdf(abs(z)))
  reject = abs(z) > z_crit                       # True

detailed_solution_variants:
  - label: "H₁: p_X < p_Y (venstre)"
    solutions:
      - source: "Praksis · kampanje mot frafall (venstresidig)"
        question: "En nettbutikk tester om en ny utsjekks-design senker andelen avbrutte kjøp. Med ny design (X): `24` avbrutt av `n_X = 200`. Med gammel design (Y): `40` av `n_Y = 200`. Test på `α = 0.05` om andelen avbrudd er LAVERE med ny design (`p_X < p_Y`)."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: p_X ≥ p_Y`" }
              - { text: "`H₁: p_X < p_Y` (ny design reduserer avbrudd)" }
          - label: "Andeler"
            lines:
              - { text: "`p̂_X = 24/200 = 0.12`, `p̂_Y = 40/200 = 0.20`" }
              - { text: "Pooled: `p̂ = (24 + 40)/(200 + 200) = 64/400 = 0.16`" }
          - label: "Testobservator"
            lines:
              - { text: "`SE = √(p̂(1−p̂)(1/n_X + 1/n_Y)) = √(0.16·0.84·(1/200 + 1/200))`" }
              - { indent: "`= √(0.1344·0.01) = √0.001344 ≈ 0.03666`" }
              - { text: "`Z = (0.12 − 0.20)/0.03666 ≈ −2.18`" }
          - label: "Konklusjon"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(0.05) = 1.645` ⇒ venstresidig grense `−1.645`. Forkast H₀ hvis `Z < −1.645`." } }
              - { text: "`Z = −2.18 < −1.645` → forkast `H₀`." }
        result: "Forkast `H₀` på 5 %-nivå: ny design gir signifikant lavere andel avbrutte kjøp."

  - label: "H₁: p_X > p_Y (høyre)"
    solutions:
      - source: "Praksis · ny vs gammel behandling (høyresidig)"
        question: "En ny behandling (X) gir bedring hos `78` av `n_X = 120` pasienter; den gamle (Y) hos `60` av `n_Y = 120`. Test på `α = 0.05` om den nye behandlingen har HØYERE suksessrate (`p_X > p_Y`)."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: p_X ≤ p_Y`" }
              - { text: "`H₁: p_X > p_Y` (ny behandling er bedre)" }
          - label: "Andeler"
            lines:
              - { text: "`p̂_X = 78/120 = 0.65`, `p̂_Y = 60/120 = 0.50`" }
              - { text: "Pooled: `p̂ = (78 + 60)/(120 + 120) = 138/240 = 0.575`" }
          - label: "Testobservator"
            lines:
              - { text: "`SE = √(0.575·0.425·(1/120 + 1/120)) = √(0.244375·0.016667)`" }
              - { indent: "`= √0.004073 ≈ 0.06382`" }
              - { text: "`Z = (0.65 − 0.50)/0.06382 ≈ 2.35`" }
          - label: "Konklusjon"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(0.05) = 1.645` (ensidig). Forkast H₀ hvis `Z > 1.645`." } }
              - { text: "`Z = 2.35 > 1.645` → forkast `H₀`." }
        result: "Forkast `H₀` på 5 %-nivå: den nye behandlingen har signifikant høyere suksessrate."

  - label: "H₁: p_X ≠ p_Y (tosidig)"
    solutions:
      - source: "Praksis · oppslutning i to grupper (tosidig)"
        question: "En spørreundersøkelse måler støtte til et forslag i to byer. By X: `130` av `n_X = 200` støtter. By Y: `90` av `n_Y = 180`. Test på `α = 0.05` om oppslutningen er forskjellig (`p_X ≠ p_Y`)."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: p_X = p_Y`" }
              - { text: "`H₁: p_X ≠ p_Y` (tosidig)" }
          - label: "Andeler"
            lines:
              - { text: "`p̂_X = 130/200 = 0.65`, `p̂_Y = 90/180 = 0.50`" }
              - { text: "Pooled: `p̂ = (130 + 90)/(200 + 180) = 220/380 ≈ 0.5789`" }
          - label: "Testobservator"
            lines:
              - { text: "`SE = √(0.5789·0.4211·(1/200 + 1/180)) = √(0.24378·0.010556)`" }
              - { indent: "`= √0.002573 ≈ 0.05073`" }
              - { text: "`Z = (0.65 − 0.50)/0.05073 ≈ 2.96`" }
          - label: "Konklusjon"
            lines:
              - { table_lookup: { ref: "E.4", text: "Tosidig: `z_(α/2) = z_(0.025) = 1.96`. Forkast H₀ hvis `|Z| > 1.96`." } }
              - { text: "`|Z| = 2.96 > 1.96` → forkast `H₀`." }
        result: "Forkast `H₀` på 5 %-nivå: oppslutningen er signifikant forskjellig mellom de to byene."

