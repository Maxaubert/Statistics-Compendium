id: beta
term_no: Beta (β)
short_def: "Stigningstall i regresjon — også sannsynligheten for type-II-feil i hypotesetesting."
filters:
  random_variable: [slope_estimate]
  setup: [linear_relationship]
  computes: [hypothesis_test, parameter_estimate, confidence_interval]
  structural_cues: [linear_relationship_suspected]
  parameters_known: [alpha_significance, slope_se]
aliases:
  - beta
  - β
long_def: |
  β har to betydninger:

  **Regresjon:** stigningstallet i regresjonsmodellen

      Y = α + β·X + ε

  altså hvor mye `Y` endres når `X` øker med én enhet.

  **Hypotesetesting:** sannsynligheten for type-II-feil (å beholde `H₀`
  når `H₁` er sann). Teststyrke er `1 − β`.

  Lærebøker er ofte tvetydige — sjekk konteksten.
see_also:
  - { id: beta-koeffisient, kind: glossary }
  - { id: type-2-feil, kind: glossary }
  - { id: lineaer-regresjon, kind: entry }
