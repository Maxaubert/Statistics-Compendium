id: ensidig-test
term_no: Ensidig test (én-sidig)
short_def: "Hypotesen ser bare i én retning — `H₁: μ > μ₀` eller `H₁: μ < μ₀`."
filters:
  computes: [hypothesis_test]
  parameters_known: [alpha_significance, population_variance_unknown]
  random_variable: [proportion]
  distribution_assumption: [normal, t_distribution]
  tooling: [t_quantile_table_E5, normal_quantile_table_E4]
  structural_cues: [one_sided_alternative]
long_def: |
  En ensidig test forkaster bare hvis observatoren ligger langt nok ut i
  én hale. Hele `α` legges i den ene halen — halverer ikke `α` slik
  tosidig gjør.

  **Høyresidig:**

      p = P(observator ≥ observert | H₀)

  **Venstresidig:**

      p = P(observator ≤ observert | H₀)

  Bruk når oppgaven sier «større enn», «mindre enn», «minst», eller «høyst».
aliases:
  - ensidig test
  - ensidige tester
  - én-sidig test
  - en-sidig test
  - ensidig
  - én-sidig
  - høyresidig
  - venstresidig
