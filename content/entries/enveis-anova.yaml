              - { indent: "`= (115 + 123 + 111) / 15`" }
              - { indent: "`= 349 / 15 ≈ 23.267`" }
          - label: "SSG (mellom-gruppe)"
            lines:
              - { text: "`SSG = Σ n_i (x̄_i − x̄)²`" }
              - { text: "`= 5·(23.0 − 23.267)² + 5·(24.6 − 23.267)² + 5·(22.2 − 23.267)²`" }
              - { indent: "`= 5·0.0712 + 5·1.7777 + 5·1.1378`" }
              - { indent: "`= 0.356 + 8.889 + 5.689`" }
              - { indent: "`≈ 14.93`" }
          - label: "SSE (innen-gruppe)"
            lines:
              - { text: "`SSE = Σ (n_i − 1) s_i²`" }
              - { text: "`= 4·5.5 + 4·7.3 + 4·5.2`" }
              - { indent: "`= 22.0 + 29.2 + 20.8`" }
              - { indent: "`= 72.0`" }
          - label: "Frihetsgrader og MS"
            lines:
              - { text: "`df₁ = k − 1 = 2`" }
              - { text: "`df₂ = n − k = 15 − 3 = 12`" }
              - { text: "`MSG = SSG / df₁ = 14.93 / 2 ≈ 7.465`" }
              - { text: "`MSE = SSE / df₂ = 72.0 / 12 = 6.0`" }
          - label: "Testobservator"
            lines:
              - { text: "`F = MSG / MSE = 7.465 / 6.0 ≈ 1.244`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.8", text: "F_(0.05, 2, 12) ≈ 3.89; forkast H₀ hvis F > 3.89" } }
          - label: "Konklusjon"
            lines:
              - { text: "`1.244 < 3.89` ⇒ kan IKKE forkaste H₀" }
              - { comment: "Testobservatoren ligger langt unna forkastningsområdet" }
        result: "Vi kan IKKE forkaste `H₀` på `α = 0.05`. Dataene gir ikke grunnlag for å hevde at fastheten varierer mellom leverandørene — den observerte forskjellen ligger godt innenfor det vi forventer ved tilfeldig variasjon mellom utvalgene."

      - source: "Praksis · sammenligne 4 behandlinger (signifikant resultat)"
        question: |
          Et legemiddelfirma tester 4 ulike formuleringer av samme aktive
          stoff. For hver formulering måles blodtrykksreduksjon (mmHg) hos
          10 pasienter, slik at `n_i = 10` for `i = 1,…,4`.

          F1: `x̄_1 = 12.4`, `s_1² = 9.0`
          F2: `x̄_2 = 15.8`, `s_2² = 11.0`
          F3: `x̄_3 = 13.1`, `s_3² = 10.0`
          F4: `x̄_4 = 17.2`, `s_4² = 8.5`

          Test på `α = 0.01` om gjennomsnittlig reduksjon er ulik for de
          fire formuleringene.
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`k = 4`, `n_i = 10`, `n = 40`." }
              - { text: "Normalfordeling og felles `σ²` antas; observasjoner uavhengige." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ_1 = μ_2 = μ_3 = μ_4`" }
              - { text: "`H₁:` minst to middelverdier ulike" }
          - label: "Totalgjennomsnitt"
            lines:
              - { text: "`x̄ = (10·12.4 + 10·15.8 + 10·13.1 + 10·17.2) / 40`" }
              - { indent: "`= (124 + 158 + 131 + 172) / 40`" }
              - { indent: "`= 585 / 40 = 14.625`" }
          - label: "SSG"
            lines:
              - { text: "`SSG = Σ n_i (x̄_i − x̄)²`" }
              - { text: "`= 10·(12.4 − 14.625)² + 10·(15.8 − 14.625)² + 10·(13.1 − 14.625)² + 10·(17.2 − 14.625)²`" }
              - { indent: "`= 10·4.9506 + 10·1.3806 + 10·2.3256 + 10·6.6306`" }
              - { indent: "`= 49.506 + 13.806 + 23.256 + 66.306`" }
              - { indent: "`≈ 152.875`" }
          - label: "SSE"
            lines:
              - { text: "`SSE = Σ (n_i − 1) s_i²`" }
              - { text: "`= 9·9.0 + 9·11.0 + 9·10.0 + 9·8.5`" }
              - { indent: "`= 81 + 99 + 90 + 76.5`" }
              - { indent: "`= 346.5`" }
          - label: "Frihetsgrader og MS"
            lines:
              - { text: "`df₁ = 3, df₂ = 36`" }
              - { text: "`MSG = 152.875 / 3 ≈ 50.96`" }
              - { text: "`MSE = 346.5 / 36 ≈ 9.625`" }
          - label: "Testobservator"
            lines:
              - { text: "`F = 50.96 / 9.625 ≈ 5.295`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.8", text: "F_(0.01, 3, 36) ≈ 4.38 (interpolert mellom df₂ = 30 og 40)" } }
          - label: "Konklusjon"
            lines:
              - { text: "`5.295 > 4.38` ⇒ forkast H₀" }
              - { comment: "Resultatet ville også vært signifikant på α = 0.05 (F_crit ≈ 2.87)" }
        result: "Vi forkaster `H₀` på `α = 0.01`. Det er signifikant evidens for at minst én av formuleringene gir en annen gjennomsnittlig blodtrykksreduksjon enn de andre. F4 (17.2) og F2 (15.8) ser ut til å være de mest effektive, men en post-hoc test (f.eks. Tukey) trengs for å si HVILKE par som faktisk skiller seg fra hverandre."

  - label: "Rådata — lister med målinger per gruppe"
    solutions:
      - source: "Praksis · 3 lærere, samme prøve"
        question: |
          Tre lærere `L1, L2, L3` underviser hvert sitt klasserom i samme
          fag. Etter kurset får alle studentene samme prøve. Vi vil teste om
          gjennomsnittsskåren er den samme på tvers av lærere på `α = 0.05`.

          L1: `[72, 75, 68, 80, 70]`         (`n_1 = 5`)
          L2: `[78, 82, 85, 79, 83, 80]`     (`n_2 = 6`)
          L3: `[65, 70, 72, 68, 71, 69, 74]` (`n_3 = 7`)
        sections:
          - label: "Gruppemiddel og varians"
            lines:
              - { text: "L1: `Σ = 365`, `x̄_1 = 73`. Avvik²: 1+4+25+49+9 = 88. `s_1² = 88/4 = 22.0`." }
              - { text: "L2: `Σ = 487`, `x̄_2 ≈ 81.17`. Avvik²: 10.03+0.69+14.69+4.69+3.36+1.36 ≈ 34.83. `s_2² = 34.83/5 ≈ 6.967`." }
              - { text: "L3: `Σ = 489`, `x̄_3 ≈ 69.86`. Avvik²: 23.59+0.020+4.59+3.45+1.31+0.74+17.16 ≈ 50.86. `s_3² = 50.86/6 ≈ 8.476`." }
          - label: "Identifisering"
            lines:
              - { text: "`k = 3`, `n = 5 + 6 + 7 = 18`." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ_1 = μ_2 = μ_3`" }
              - { text: "`H₁:` minst to middelverdier ulike" }
          - label: "Totalgjennomsnitt"
            lines:
              - { text: "Sum av alle observasjoner = `365 + 487 + 489 = 1341`" }
              - { text: "`x̄ = 1341 / 18 ≈ 74.50`" }
          - label: "SSG"
            lines:
              - { text: "`SSG = 5·(73 − 74.5)² + 6·(81.17 − 74.5)² + 7·(69.86 − 74.5)²`" }
              - { indent: "`= 5·2.25 + 6·44.49 + 7·21.53`" }
              - { indent: "`= 11.25 + 266.94 + 150.71`" }
              - { indent: "`≈ 428.9`" }
          - label: "SSE"
            lines:
              - { text: "`SSE = (n_1 − 1)s_1² + (n_2 − 1)s_2² + (n_3 − 1)s_3²`" }
              - { text: "`= 4·22.0 + 5·6.967 + 6·8.476`" }
              - { indent: "`= 88.0 + 34.83 + 50.86`" }
              - { indent: "`≈ 173.7`" }
          - label: "Frihetsgrader og MS"
            lines:
              - { text: "`df₁ = 2, df₂ = 15`" }
              - { text: "`MSG = 428.9 / 2 ≈ 214.5`" }
              - { text: "`MSE = 173.7 / 15 ≈ 11.58`" }
          - label: "Testobservator"
            lines:
              - { text: "`F = 214.5 / 11.58 ≈ 18.52`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.8", text: "F_(0.05, 2, 15) ≈ 3.68; forkast H₀ hvis F > 3.68" } }
          - label: "Konklusjon"
            lines:
              - { text: "`18.52 ≫ 3.68` ⇒ klart signifikant" }
        result: "Vi forkaster `H₀` på `α = 0.05` (med god margin). Det er sterk evidens for at gjennomsnittsskåren er ulik mellom de tre lærerne. L2 (81.17) ligger høyest, L3 (69.86) lavest — en post-hoc test ville sannsynligvis vise at L2 vs L3 og L1 vs L2 begge er signifikante."

      - source: "Praksis · gjødseltype og avling (ikke-signifikant)"
        question: |
          En agronom sammenligner tre gjødseltyper. Hver type prøves på
          4 åkerlapper, og avlingen i tonn/dekar måles:

          Type I:   `[4.2, 4.0, 4.5, 4.1]`
          Type II:  `[4.4, 4.6, 4.3, 4.5]`
          Type III: `[4.3, 4.1, 4.4, 4.2]`

          Test på `α = 0.05` om gjødseltypene gir forskjellig gjennomsnittlig avling.
        sections:
          - label: "Gruppemiddel og varians"
            lines:
              - { text: "Type I: `Σ = 16.8`, `x̄_1 = 4.2`. Avvik² = 0+0.04+0.09+0.01 = 0.14. `s_1² = 0.14/3 ≈ 0.0467`." }
              - { text: "Type II: `Σ = 17.8`, `x̄_2 = 4.45`. Avvik² = 0.0025+0.0225+0.0225+0.0025 = 0.05. `s_2² = 0.05/3 ≈ 0.0167`." }
              - { text: "Type III: `Σ = 17.0`, `x̄_3 = 4.25`. Avvik² = 0.0025+0.0225+0.0225+0.0025 = 0.05. `s_3² ≈ 0.0167`." }
          - label: "Identifisering"
            lines:
              - { text: "`k = 3`, `n_i = 4`, `n = 12`." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ_1 = μ_2 = μ_3`" }
              - { text: "`H₁:` minst to middelverdier ulike" }
          - label: "Totalgjennomsnitt"
            lines:
              - { text: "`x̄ = (16.8 + 17.8 + 17.0) / 12 = 51.6 / 12 = 4.3`" }
          - label: "SSG"
            lines:
              - { text: "`SSG = 4·(4.2 − 4.3)² + 4·(4.45 − 4.3)² + 4·(4.25 − 4.3)²`" }
              - { indent: "`= 4·0.01 + 4·0.0225 + 4·0.0025`" }
              - { indent: "`= 0.04 + 0.09 + 0.01 = 0.14`" }
          - label: "SSE"
            lines:
              - { text: "`SSE = 3·0.0467 + 3·0.0167 + 3·0.0167`" }
              - { indent: "`= 0.140 + 0.050 + 0.050 = 0.240`" }
          - label: "Frihetsgrader og MS"
            lines:
              - { text: "`df₁ = 2, df₂ = 9`" }
              - { text: "`MSG = 0.14 / 2 = 0.070`" }
              - { text: "`MSE = 0.240 / 9 ≈ 0.0267`" }
          - label: "Testobservator"
            lines:
              - { text: "`F = 0.070 / 0.0267 ≈ 2.625`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.8", text: "F_(0.05, 2, 9) ≈ 4.26; forkast H₀ hvis F > 4.26" } }
          - label: "Konklusjon"
            lines:
              - { text: "`2.625 < 4.26` ⇒ behold H₀" }
        result: "Vi kan IKKE forkaste `H₀` på `α = 0.05`. Selv om Type II har det høyeste utvalgssnittet (4.45), er forskjellene mellom gjødseltypene innenfor det man forventer å se ved tilfeldig variasjon mellom åkerlapper i et utvalg på 12. Datagrunnlaget er for lite til å konkludere."

  - label: "ANOVA-tabell — SSG og SSE delvis fylt ut, fullfør og test"
    solutions:
      - source: "Eksamen-praksis · fyll ut tabellen"
        question: |
          Følgende ANOVA-tabell er delvis fylt ut for et eksperiment med
          `k = 4` behandlinger og `n = 24` totalt. Fyll ut de manglende
          verdiene og test `H₀: μ_1 = μ_2 = μ_3 = μ_4` mot `H₁:` minst to
          ulike, på `α = 0.05`.

          | Variasjon       | SS    | df | MS    | F   |
          |----------------|-------|----|-------|-----|
          | Mellom grupper |  ?    | ?  | 18.5  | ?   |
          | Innen grupper  | 110.0 | ?  | ?     |     |
          | Totalt         |  ?    | ?  |       |     |
        sections:
          - label: "Frihetsgrader"
            lines:
              - { text: "`df₁ = k − 1 = 3`" }
              - { text: "`df₂ = n − k = 24 − 4 = 20`" }
              - { text: "`df_total = n − 1 = 23` (`= df₁ + df₂` — sjekk)" }
          - label: "Innen grupper (MSE)"
            lines:
              - { text: "`MSE = SSE / df₂ = 110.0 / 20 = 5.5`" }
          - label: "Mellom grupper (SSG)"
            lines:
              - { text: "MS er gitt: `MSG = 18.5`. Snu MS-formelen for å finne SS:" }
              - { text: "`SSG = MSG · df₁ = 18.5 · 3 = 55.5`" }
          - label: "Totalt (SST)"
            lines:
              - { text: "`SST = SSG + SSE = 55.5 + 110.0 = 165.5`" }
          - label: "Testobservator"
            lines:
              - { text: "`F = MSG / MSE = 18.5 / 5.5 ≈ 3.364`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.8", text: "F_(0.05, 3, 20) ≈ 3.10; forkast H₀ hvis F > 3.10" } }
          - label: "Konklusjon"
            lines:
              - { text: "`3.364 > 3.10` ⇒ forkast H₀ (såvidt)" }
        result: "Vi forkaster `H₀` på `α = 0.05` (marginalt). Det er evidens for at minst én av behandlingsmiddelene avviker fra de andre. Komplett ANOVA-tabell: `SSG = 55.5, SSE = 110.0, SST = 165.5, df = (3, 20, 23), MSG = 18.5, MSE = 5.5, F ≈ 3.36`."

