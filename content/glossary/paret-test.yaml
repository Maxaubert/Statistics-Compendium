id: paret-test
term_no: Paret test (parvis)
short_def: "Hver observasjon i utvalg 1 hører til en bestemt observasjon i utvalg 2 — test differansen `Dᵢ = Xᵢ − Yᵢ`."
filters:
  setup: [paired_samples]
  computes: [hypothesis_test, confidence_interval]
  distribution_assumption: [t_distribution, normal]
  parameters_known: [population_variance_unknown, confidence_level, sample_size_small_lt30]
  random_variable: [mean_of_samples]
  structural_cues: [data_as_list]
  tooling: [t_quantile_table_E5]
aliases:
  - paret test
  - parede tester
  - parvis test
  - parvis t-test
  - paret t-test
  - parvis
long_def: |
  Paret design: samme person måles før og etter, eller to målinger gjøres
  på samme enhet. Du regner ikke to-utvalgs-test, men én-utvalgs-test på
  differansene:

      Dᵢ = Xᵢ − Yᵢ

  **Hypotese:**

      H₀: μ_D = 0

  Frihetsgrader er `ν = n − 1`.

  Fordelen er at variasjon mellom personer fjernes — testen blir kraftigere.
  Kjennetegn: «før/etter», «parvis», «samme person».
see_also:
  - { id: en-utvalg-t-test, kind: entry }
  - { id: to-utvalgs-t-test, kind: entry }
  - { id: t-test-mu, kind: pattern }
