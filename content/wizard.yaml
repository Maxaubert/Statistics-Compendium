version: 2

# Soft-scoring veiviser: hvert spørsmål akkumulerer poeng på entry-tags.
# «Vet ikke» (skip: true) er alltid det siste alternativet og gir 0 poeng.
# Topp 5 entries med høyest match-score vises til slutt.
#
# Tag-strukturen følger content/filters.yaml. Når du legger til nye
# spørsmål, sjekk at tag-verdiene faktisk eksisterer der.

questions:
  # ===== Q1-Q3: brede sortering — utelukker ingenting =====

  - id: q_variable
    text: "Hva slags variabel håndterer oppgaven?"
    why: "Avgjør om vi snakker diskret fordeling (binomial, Poisson, hypergeom.) eller kontinuerlig (normal, eksponential)."
    options:
      - label: "Antall noe — teller suksesser, defekte, hendelser"
        tags: { random_variable: [discrete_count] }
      - label: "Måling på en skala — vekt, lengde, tid, temperatur"
        tags: { random_variable: [continuous] }
      - label: "Tid til neste hendelse / levetid"
        tags:
          random_variable: [time_until_event]
          structural_cues: [time_until_first]
      - label: "Gjennomsnitt eller sum av flere observasjoner"
        tags: { random_variable: [mean_of_samples, sum_of_samples] }
      - label: "Andel (X av n suksesser)"
        tags: { random_variable: [proportion] }
      - label: "Sammenheng mellom to variabler (x, y)"
        tags:
          random_variable: [slope_estimate]
          setup: [linear_relationship]
      - { skip: true }

  - id: q_goal
    text: "Hva spør oppgaven om?"
    why: "Skiller sannsynlighetsberegning fra inferens (test/KI) fra rene tellinger."
    options:
      - label: "Beregne en sannsynlighet (P(X = k), P(a < X < b), «minst én»)"
        tags: { computes: [exact_probability, at_least_k, range_probability] }
      - label: "Forventet verdi E[X]"
        tags: { computes: [expected_value] }
      - label: "Varians, standardavvik, kovarians eller korrelasjon"
        tags: { computes: [std_dev, covariance, correlation] }
      - label: "Hypotesetest"
        tags: { computes: [hypothesis_test] }
      - label: "Konfidensintervall"
        tags: { computes: [confidence_interval] }
      - label: "Telle antall muligheter (kombinatorikk)"
        tags: { computes: [combinatorial_count] }
      - label: "Snu en betinget sannsynlighet (jeg kjenner P(B|A), leter etter P(A|B))"
        tags:
          computes: [conditional_probability]
          structural_cues: [andel_og_rate_per_gruppe]
      - label: "P(A ∪ B) — «A eller B», eller sjekke om hendelser er DISJUNKTE"
        tags:
          computes: [union_probability]
          structural_cues: [disjoint_events]
      - label: "P(A ∩ B) — «A og B begge», eller sjekke om hendelser er UAVHENGIGE"
        tags:
          computes: [joint_probability, conditional_probability, test_independence]
          structural_cues: [independent_events]
      - label: "Beregne punktestimat (x̄, s², p̂, β̂) fra rådata"
        tags:
          computes: [parameter_estimate]
          structural_cues: [data_as_list]
      - { skip: true }

  - id: q_groups
    text: "Hvor mange grupper eller utvalg er involvert?"
    why: "Skiller én-utvalgs-tester fra to-utvalgs, paret, og ANOVA."
    options:
      - label: "Ett utvalg fra én populasjon"
        tags: { setup: [single_population] }
      - label: "To uavhengige grupper (forskjellige individer i hver)"
        tags: { setup: [two_independent_samples] }
      - label: "Parede observasjoner (samme individ målt to ganger, før/etter)"
        tags: { setup: [paired_samples] }
      - label: "Tre eller flere uavhengige grupper"
        tags: { setup: [three_plus_samples] }
      - label: "Ingen utvalg — bare hendelser eller en kjent fordeling"
        tags: {}
      - { skip: true }

  # ===== Q4+: skarpere — diskrimerer mellom tester/fordelinger =====

  - id: q_replacement
    text: "Trekkes elementene med eller uten tilbakelegging?"
    why: "Skiller binomial (med) fra hypergeometrisk (uten)."
    options:
      - label: "Med tilbakelegging — eller forsøkene er uavhengige"
        tags:
          setup: [with_replacement, fixed_n_trials]
          structural_cues: [independent_events]
      - label: "Uten tilbakelegging fra endelig pott"
        tags:
          setup: [without_replacement, finite_pool]
          distribution_assumption: [hypergeometric]
      - label: "Ikke relevant — det handler om rate eller måling"
        tags: {}
      - { skip: true }

  - id: q_trial_structure
    text: "Hvordan er forsøkene strukturert?"
    why: "Skiller binomial (fast n) fra Poisson (rate i tidsvindu) fra geometrisk (til første)."
    options:
      - label: "Fast antall n forsøk, hver med samme p"
        tags:
          setup: [fixed_n_trials]
          parameters_known: [success_p]
          distribution_assumption: [binomial]
      - label: "Hendelser kommer over tid med rate λ"
        tags:
          setup: [events_in_window]
          parameters_known: [rate_lambda]
          structural_cues: [process_over_time, counting_events]
          distribution_assumption: [poisson]
      - label: "Teller forsøk til FØRSTE suksess"
        tags:
          setup: [trials_until_event]
          structural_cues: [time_until_first]
          distribution_assumption: [geometric]
      - label: "Ingen forsøk — kontinuerlig måling / oppgitt fordeling"
        tags: {}
      - { skip: true }

  - id: q_sigma_known
    text: "Er populasjonens standardavvik σ kjent?"
    why: "z-test/KI krever kjent σ. t-test brukes når vi bare har utvalgets s."
    options:
      - label: "Ja — σ er oppgitt i tekst eller via N(μ, σ)"
        tags:
          parameters_known: [population_variance_known]
          distribution_assumption: [normal]
      - label: "Nei — bare utvalgets s er beregnet/oppgitt"
        tags:
          parameters_known: [population_variance_unknown]
          distribution_assumption: [t_distribution]
      - label: "Ikke relevant — oppgaven handler ikke om μ"
        tags: {}
      - { skip: true }

  - id: q_data_shape
    text: "Hvordan er dataene presentert?"
    why: "Skiller rådata-oppgaver fra summary-stats fra simultantabeller fra kontingenstabeller."
    options:
      - label: "Rå datalinje (x₁, x₂, …)"
        tags: { structural_cues: [data_as_list] }
      - label: "Oppsummeringstall (gj.snitt, s, n) er gitt"
        tags: { structural_cues: [summary_stats_given] }
      - label: "Simultantabell P(X = x, Y = y)"
        tags: { computes: [joint_probability, marginal_probability] }
      - label: "Kontingenstabell (rad × kolonne med observerte antall)"
        tags:
          computes: [test_independence]
          distribution_assumption: [chi_squared]
      - label: "Bare antall i tre eller flere kategorier"
        tags:
          structural_cues: [more_than_two_categories]
          distribution_assumption: [chi_squared]
      - label: "Ingen tabell — fortolkningsoppgave"
        tags: {}
      - { skip: true }

  - id: q_complement_wording
    text: "Står det «minst én», «ingen», «høyst k» eller «ikke alle» i oppgaven?"
    why: "Disse fraseringene løses lettest med komplementregelen."
    options:
      - label: "Ja, en av disse fraseringene står der"
        tags:
          structural_cues: [complement_pattern]
          computes: [at_least_k]
      - label: "Nei — eksakt antall, område, eller annen formulering"
        tags: {}
      - { skip: true }

  - id: q_parameters_given
    text: "Hvilke parametre er eksplisitt oppgitt i teksten?"
    why: "Skiller f.eks. Poisson (λ) fra binomial (n, p) fra normal (μ, σ)."
    options:
      - label: "Rate λ per tidsenhet (f.eks. «2 kunder per minutt»)"
        tags:
          parameters_known: [rate_lambda]
          distribution_assumption: [poisson, exponential]
      - label: "Sannsynlighet p per forsøk"
        tags:
          parameters_known: [success_p]
      - label: "Forventning μ (og evt. σ) for en fordeling"
        tags: { parameters_known: [mean_known] }
      - label: "Stigningstall β̂ og standardfeil SE(β̂) for regresjonslinje"
        tags:
          parameters_known: [slope_se, regression_line_estimate]
          setup: [linear_relationship]
      - label: "Ingen parametre — bare rådata"
        tags: { structural_cues: [data_as_list] }
      - { skip: true }

  - id: q_test_sidedness
    text: "Hvis det er hypotesetest — er den ensidig eller tosidig?"
    why: "Påvirker p-verdi og kritisk verdi. Tosidig: H₁: ≠. Ensidig: H₁: < eller >."
    options:
      - label: "Tosidig (H₁: ≠ μ₀, ≠ p₀, ≠ 0)"
        tags: { structural_cues: [two_sided_alternative] }
      - label: "Ensidig (H₁: < eller >)"
        tags: { structural_cues: [one_sided_alternative] }
      - label: "Ikke en hypotesetest"
        tags: {}
      - { skip: true }

  - id: q_normal_assumed
    text: "Antas dataene å være normalfordelt?"
    why: "Normalantakelse låser opp z-test og t-test. Hvis ikke: ikke-parametriske alternativer."
    options:
      - label: "Ja — oppgaven sier «normalfordelt» eller bruker N(μ, σ)"
        tags:
          structural_cues: [normal_assumed]
          distribution_assumption: [normal, t_distribution]
      - label: "Nei — oppgaven sier eksplisitt at de IKKE er normalfordelt"
        tags:
          distribution_assumption: [none_assumed]
          structural_cues: [rank_based_data]
      - label: "Ikke relevant / oppgaven sier ingenting om fordeling"
        tags: {}
      - { skip: true }

  - id: q_lookup_table
    text: "Hvilken tabell (vedlegg E.1–E.8) ser det ut til å trenge?"
    why: "Hvis du gjenkjenner tabellen, peker det rett på testtypen."
    options:
      - label: "E.1 binomialtabell — kumulativ P(X ≤ k)"
        tags: { tooling: [cumulative_binomial_table_E1] }
      - label: "E.2 poissontabell"
        tags: { tooling: [cumulative_poisson_table_E2] }
      - label: "E.3 standardnormal Z-tabell"
        tags: { tooling: [standard_normal_table_E3] }
      - label: "E.4 Z-kvantiltabell (z_α)"
        tags: { tooling: [normal_quantile_table_E4] }
      - label: "E.5 t-tabell"
        tags: { tooling: [t_quantile_table_E5] }
      - label: "E.6 kjikvadrattabell"
        tags: { tooling: [chi_square_quantile_table_E6] }
      - label: "E.7 Mann-Whitney U-tabell"
        tags: { tooling: [mann_whitney_table_E7] }
      - label: "E.8 F-tabell (ANOVA / varianslikhet)"
        tags: { tooling: [f_quantile_table_E8] }
      - label: "Ingen tabell — kalkulator/formel direkte"
        tags: { tooling: [calculator_only] }
      - { skip: true }
