id: standardavvik
name_no: "Standardavvik (oversikt over de ulike formene)"
type: concept
tagline: "Kvadratrot av variansen — spredning i samme enhet som dataene. Hver variansform har sin parallell."

what_it_means: |
  Standardavvik er kvadratroten av variansen og har samme enhet som
  dataene (variansen har enhet kvadrert). Strukturen følger
  [Varians (oversikt)](/concept/varians) — under er de viktigste formene
  for standardavvik, hver med sin egen seksjon.

  ## Utregnet fra dine data

  ### Utvalgsgjennomsnitt (x̄)

      x̄ = Σ xᵢ / n

  Midtpunktet i dataene og estimat for `μ`. Trenger rådata. Klikk
  gjennomsnittet for definisjon.

  ### Utvalgsstandardavvik (s)

      s = √( Σ(xᵢ − x̄)² / (n − 1) )

  Spredningen i dataene og estimat for `σ` når populasjonens standardavvik
  er ukjent. `n − 1` er Bessels korreksjon. Trenger rådata. Klikk
  utvalgsstandardavviket for definisjon.

  Brukes i: [Én-utvalg t-test](/entry/en-utvalg-t-test),
  [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma).

  ### Residualstandardavvik (S_E)

      S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )

  Gjennomsnittlig størrelse på residualene i regresjon — typisk avvik fra
  regresjonslinjen.

  Entry: [Residualenes varians](/entry/regresjon-residualvarians).

  ## Avlest fra en kjent fordeling

  Når fordelingen er navngitt, er `σ` en egenskap. Du slipper å regne fra rådata.

  ### Normal

      σ = σ   (parameteren selv)

  Entry: [Normalfordeling](/entry/normalfordeling).

  ### Binomial

      σ = √(np(1 − p))

  Detaljer: binomialvarians. Entry: [Binomialfordeling](/entry/binomial-fordeling).

  ### Poisson

      σ = √λ

  Detaljer: poissonvarians. Entry: [Poissonfordeling](/entry/poisson-fordeling).

  ### Eksponential

      σ = 1/λ   (lik forventningen)

  Detaljer: eksponentialvarians. Entry: [Eksponentialfordeling](/entry/eksponential-fordeling).

  ## Spredning til et estimat (standardfeil)

  Når du regner ut et tall fra et utvalg (et estimat), har det selv en
  spredning — kalt standardfeilen `SE`. Det er IKKE spredningen i rådataene;
  det er hvor mye estimatet typisk varierer fra utvalg til utvalg.

  ### Standardfeil til utvalgsgjennomsnittet

      σ_X̄ = σ/√n          (eller s/√n hvis σ er ukjent)

  Trenger IKKE rådata — bare `σ` (eller et estimat) og `n`. Detaljer:
  variansen til utvalgsgjennomsnittet, standardfeilen.

  Innebygget i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  ### Standardfeil til regresjonsstigningstallet

      SE(β̂) = √(S_E² / S_XX)

  Kjernen i hypotesetest og KI for `β`. Stor `S_XX` (mye spredning i x)
  → presis estimering.

  Entry: [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).

  ### Standardfeil til utvalgsandelen

      SE(p̂) = √(p̂(1 − p̂) / n)

  Brukes i [Z-test for andel p](/entry/en-utvalg-z-test-andel) og
  [KI for andel p](/entry/ki-andel-binomial).

  ## Trenger du rådata eller ikke?

  Et viktig skille på eksamen:

  - **Trenger rådata:** `x̄`, `s`, `S_E` — alt som regnes ut fra
    `Σ(...)`-summer over observasjonene.
  - **Trenger IKKE rådata:** `σ/√n`, `√(np(1 − p))`, `√λ`, `1/λ` —
    så lenge fordelingens parametere (eller utvalgsstørrelsen + et
    estimat for `σ`) er gitt.

  Eksempel: hvis oppgaven sier «antar `σ = 5`, finn standardfeilen til
  `X̄` for `n = 25`», trenger du bare `σ/√n = 1` — ingen kalkulering på dataene.

recognition_cues:
  - "Oppgaven nevner spredning, standardavvik, eller standardfeil"
  - "Du må velge mellom σ (kjent), s (estimat fra rådata), og σ/√n (spredning til X̄)"
  - "Du har et estimat og skal kvantifisere usikkerheten i det"

