id: chi
term_no: Chi / kji (χ)
short_def: "Gresk bokstav brukt i kjikvadrat-fordelingen χ² for variansestimat og goodness-of-fit-tester."
aliases:
  - chi
  - kji
  - kjikvadrat
  - kjikvadratfordeling
  - kjikvadrat-fordeling
long_def: |
  Du møter `χ` nesten alltid i kvadrert form: `χ²` (kjikvadrat). Brukes til:

  - KI for varians
  - Goodness-of-fit-test
  - Uavhengighetstest i krysstabell

  Fordelingen har frihetsgrader som eneste parameter og er ikke-symmetrisk
  (skjev mot høyre). Slå opp kvantiler i E.6-tabellen.
see_also:
