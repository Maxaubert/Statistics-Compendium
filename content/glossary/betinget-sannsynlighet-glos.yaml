id: betinget-sannsynlighet-glos
term_no: Betinget sannsynlighet
short_def: "`P(A|B)` = sannsynligheten for `A` når vi vet at `B` har inntruffet."
aliases:
  - betinget sannsynlighet
  - betinget sannsynligheten
  - betingede sannsynligheter
  - betingede sannsynlighetene
long_def: |
  Formel:

      P(A|B) = P(A ∩ B) / P(B)        forutsatt P(B) > 0

  Hvis `A` og `B` er uavhengige, er `P(A|B) = P(A)`. Brukes i Bayes'
  setning og total sannsynlighet.

  **Sammenhenger:**

      Produktregel:        P(A ∩ B) = P(B) · P(A|B)

      Bayes' setning:      P(A|B) = P(A) · P(B|A) / P(B)

      Total sannsynlighet: bryter P(B) over en partisjon.
see_also:
  - { id: bayes-setning, kind: entry }
  - { id: total-sannsynlighet, kind: entry }
