id: interpolert-varians
name_no: "Interpolert (pooled) varians S_P²"
type: concept
tagline: "Vektet snitt av to utvalgsvariansene, brukt i to-utvalgs t-test."

what_it_means: |
  Når vi sammenligner to grupper med antatt like populasjonsstandardavvik,
  kombinerer vi informasjonen fra begge utvalgene i et felles ("pooled")
  variansestimat:

    S_P² = ((n_X − 1) · S_X² + (n_Y − 1) · S_Y²) / (n_X + n_Y − 2)

  Dette er et vektet gjennomsnitt der hver utvalgsvarians vektes med
  sin egen frihetsgrad (n − 1). Brukes nesten utelukkende i to-utvalgs
  t-test (uparet, pooled).

  Standardfeilen i to-utvalgs t-test bruker S_P · √(1/n_X + 1/n_Y).

recognition_cues:
  - "To utvalg med antatt like (eller samme) populasjonsstandardavvik"
  - "Spørsmål om to-utvalgs t-test"
  - "Formelen for testobservator har S_P i nevneren"

filters:
  setup: [two_independent_samples]

related:
  - { id: "to-utvalgs-t-test",     kind: "entry" }
  - { id: "frihetsgrader",         kind: "concept" }
