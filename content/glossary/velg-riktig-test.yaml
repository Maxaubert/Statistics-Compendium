id: velg-riktig-test
term_no: "Hvilken hypotesetest? — oversikt"
short_def: "Cheat-sheet for «hvilken test passer oppgaven?». Tre tabeller etter antall utvalg (ett / to / tre+). Strukturen i oppgaven avgjør — hva testes, hvor mange grupper, og hvilke krav holder."
aliases:
  - hvilken test
  - hvilken hypotesetest
  - hvilken test skal jeg bruke
  - velg riktig test
