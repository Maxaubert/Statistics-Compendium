id: sentralgrenseteoremet-glos
term_no: Sentralgrenseteoremet (CLT)
short_def: "Gjennomsnittet av mange uavhengige variabler er tilnærmet normalfordelt — uansett original fordeling."
filters:
  distribution_assumption: [normal]
  random_variable: [mean_of_samples, sum_of_samples]
  parameters_known: [sample_size_large, sample_size_small_lt30]
  setup: [single_population]
aliases:
  - sentralgrenseteoremet
  - sentralgrenseteorem
  - CLT
long_def: |
  Hvis `X_1, …, X_n` er uavhengige og identisk fordelte med forventning
  `μ` og standardavvik `σ`, så er

      X̄ ≈ N(μ, σ/√n)        for stor n

  **Tommelfingerregel:** `n ≥ 30` holder ofte.

  Forklarer hvorfor z- og t-tester fungerer for ikke-normale data.

  Hvis `n` er for liten og fordelingen ikke kan antas normal: bruk
  bootstrapping i stedet.
see_also:
  - { id: en-utvalg-z-test, kind: entry }
  - { id: bootstrapping, kind: entry }
