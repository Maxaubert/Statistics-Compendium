id: standardavvik-oversikt
name_no: "Standardavvik (oversikt)"
type: overview
tagline: "Kvadratrot av variansen — spredning i samme enhet som dataene. Hver variansform har sin parallell."

what_it_means: |
  Standardavvik er kvadratroten av variansen og har samme enhet som
  dataene (variansen har enhet kvadrert). Strukturen følger
  [Varians (oversikt)](/entry/varians-oversikt) — denne siden er en kjapp
  oversikt over hver standardavvik-form.

  **Klikk på overskriften** for å åpne ordliste-popupen med detaljert
  forklaring og om du trenger rådata eller ikke.

  ## [Standardavvik for diskret stokastisk variabel](glossary:diskret-varians)

      σ = √( Σ (xᵢ − μ)² · P(X = xᵢ) )

  Når du har en PMF-tabell. Vekt = sannsynligheten.

  Entry: [Varians og standardavvik (diskret stokastisk variabel)](/entry/varians-standardavvik-diskret).

  ## [Populasjonsstandardavvik (σ)](glossary:populasjonsstandardavvik)

      σ = √( Σ (xᵢ − μ)² / N )

  Den «sanne» spredningen i hele populasjonen. Antas kjent eller estimeres
  med utvalgsstandardavviket `s` når den ikke er gitt.

  Brukes i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  ## [Utvalgsstandardavvik (s)](glossary:utvalgsstandardavvik)

      s = √( Σ(xᵢ − x̄)² / (n − 1) )

  Estimat for `σ` når populasjonens standardavvik er ukjent. `n − 1` er
  Bessels korreksjon.

  Brukes i: [Én-utvalg t-test](/entry/en-utvalg-t-test),
  [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma).

  ## [Pooled standardavvik (S_P)](glossary:pooled-varians)

      S_P = √( ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2) )

  Felles standardavvik-estimat for to grupper med antatt lik `σ`.

  Brukes i: [To-utvalgs t-test (pooled)](/entry/to-utvalgs-t-test).

  ## [Residualstandardavvik (S_E)](glossary:residualstandardavvik)

      S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )

  Typisk avvik fra regresjonslinjen.

  Entry: [Residualenes varians](/entry/regresjon-residualvarians).

  ## [Standardavvik for binomial](glossary:binomialvarians)

      σ = √(np(1 − p))

  Entry: [Binomialfordeling](/entry/binomial-fordeling).

  ## [Standardavvik for poisson](glossary:poissonvarians)

      σ = √λ

  Entry: [Poissonfordeling](/entry/poisson-fordeling).

  ## [Standardavvik for eksponential](glossary:eksponentialvarians)

      σ = 1/λ   (lik forventningen)

  Entry: [Eksponentialfordeling](/entry/eksponential-fordeling).

  ## [Standardavvik for hypergeometrisk](glossary:hypergeometrisk-varians)

      σ = √( n · (K/N) · ((N−K)/N) · ((N−n)/(N−1)) )

  Som binomial-σ, men med endelig-populasjon-korreksjonen.

  Entry: [Hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling).

  ## [Standardfeil til utvalgsgjennomsnittet](glossary:variansen-til-utvalgsgjennomsnittet)

      σ_X̄ = σ/√n          (eller s/√n hvis σ er ukjent)

  Spredningen i selve estimatet `X̄`, ikke i rådataene.

  Innebygget i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  ## [Standardfeil til regresjonsstigningstallet](glossary:standardfeil-til-stigningstallet)

      SE(β̂) = √(S_E² / S_XX)

  Kjernen i hypotesetest og KI for `β`.

  Entry: [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).

  ## [Standardfeil til utvalgsandelen](glossary:standardfeil-til-andel)

      SE(p̂) = √(p̂(1 − p̂) / n)

  Brukes i [Z-test for andel p](/entry/en-utvalg-z-test-andel) og
  [KI for andel p](/entry/ki-andel-binomial).

recognition_cues:
  - "Oppgaven nevner spredning, standardavvik, eller standardfeil"
  - "Du må velge mellom σ (kjent), s (estimat fra rådata), og σ/√n (spredning til X̄)"
  - "Du har et estimat og skal kvantifisere usikkerheten i det"

filters:
  computes: [std_dev]
  random_variable: [discrete_count, continuous, mean_of_samples, sum_of_samples, proportion]
  setup: [single_population]
  structural_cues: [data_as_list, summary_stats_given, mean_and_sd_given]
  parameters_known: [population_variance_known, population_variance_unknown, success_p]
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]
