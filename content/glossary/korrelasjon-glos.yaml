id: korrelasjon-glos
term_no: Korrelasjon (ρ, r)
short_def: "Tall mellom `−1` og `1` som måler styrken på den lineære sammenhengen mellom to variabler."
long_def: |
  Formel: `ρ(X,Y) = Cov(X,Y) / (σ_X · σ_Y)`.

  - `r = ±1`: perfekt lineær sammenheng
  - `r = 0`: ingen lineær sammenheng (kan likevel ha annen sammenheng)

  Korrelasjon er ikke det samme som årsak.
see_also:
