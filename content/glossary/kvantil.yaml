id: kvantil
term_no: Kvantil
short_def: "Verdien som har en gitt sannsynlighet til venstre for seg i en fordeling."
filters:
  tooling: [normal_quantile_table_E4, t_quantile_table_E5, chi_square_quantile_table_E6, standard_normal_table_E3]
  computes: [confidence_interval, hypothesis_test, find_x_for_threshold]
long_def: |
  `α`-kvantilen i øvre hale er definert ved:

      P(Z > z_α) = α

  **Eksempel:**

      z_(0.025) = 1.96        fordi    P(Z > 1.96) = 0.025

  Kvantiler brukes til å sette grenser for KI og kritiske verdier.
see_also:
  - { id: E4-z-kvantiltabell, kind: table }
  - { id: E5-t-tabell, kind: table }
