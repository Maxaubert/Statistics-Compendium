id: produktregel
name_no: "Produktregelen og betinget sannsynlighet"
type: rule
category: probability_rule
tagline: "Snitt `P(A ∩ B)`, betinget `P(A|B)`, varianter med komplement, og test for uavhengighet — alt fra samme produktregel."

formula_main: "P(A ∩ B) = P(A) · P(B | A);  P(B | A) = P(A ∩ B) / P(A)"
formula_latex: "P(A \\cap B) = P(A) \\cdot P(B|A), \\quad P(B|A) = \\frac{P(A \\cap B)}{P(A)}"

what_it_does: |
  Definerer betinget sannsynlighet og produktregelen som en omformulering
  av samme regel. Sier hvordan sannsynligheter kombineres når hendelser
  skjer i sekvens. For uavhengige hendelser er `P(B|A) = P(B)`, så
  `P(A ∩ B) = P(A)·P(B)`.

why_use: |
  Grunnleggende verktøy for sekvensielle hendelser (f.eks. trekninger fra
  en kortstokk uten tilbakelegging) og for å regne om mellom betinget
  og felles sannsynlighet.

recognition_cues:
  - "Sekvensielle hendelser, der den andre avhenger av den første"
  - "Spørsmålet involverer 'gitt at `A` inntreffer' eller 'først, så'"
  - "Du har `P(A)` og `P(B|A)`, eller du vil finne `P(B|A)` fra `P(A ∩ B)`"
  - "Trekning uten tilbakelegging der `p` endrer seg etter første trekning"
  - "Spørsmålet ber deg sjekke om `A` og `B` er uavhengige (sammenlign `P(A ∩ B)` med `P(A)·P(B)`)"
  - "Frasering med komplement: 'sannsynligheten for at `A` ikke inntreffer gitt at `B` ikke inntreffer'"

when_NOT_to_use:
  - "Hendelsene er uavhengige → spesialtilfellet `P(A ∩ B) = P(A)·P(B)` er enklere"
  - "Du vil snu retning på en betinget sannsynlighet → bruk [Bayes' setning](/entry/bayes-setning) i stedet"
  - "Du har en partisjon av utfallsrommet og vil regne `P(B)` totalt → bruk [total sannsynlighet](/entry/total-sannsynlighet)"

symbols:
  - { sym: "P(A)",       means: "sannsynlighet for hendelse `A`" }
  - { sym: "P(B)",       means: "sannsynlighet for hendelse `B`" }
  - { sym: "P(A ∩ B)",   means: "sannsynlighet for at både `A` og `B` inntreffer" }
  - { sym: "P(B | A)",    means: "betinget sannsynlighet for `B`, gitt at `A` inntreffer" }
  - { sym: "P(A | B)",    means: "betinget sannsynlighet for `A`, gitt at `B` inntreffer" }
  - { sym: "Ā, B̄",       means: "komplementene til `A` og `B` (inntreffer hvis hendelsen ikke gjør det)" }
  - { sym: "P(A ∪ B)",   means: "sannsynlighet for at minst én av `A` eller `B` inntreffer" }

filters:
  computes: [exact_probability, conditional_probability, joint_probability, test_independence]
  random_variable: [discrete_count]
  setup: [single_population, without_replacement, with_replacement, finite_pool]
  structural_cues: [conditional_given, independent_events, conditioning_on_complement, andel_og_rate_per_gruppe]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_variants:
  - label: "Snitt P(A ∩ B)"
    recognition: "«Sannsynligheten for at A OG B skjer», «sannsynligheten for to suksesser på rad». Bruk `P(A) · P(B|A)`, eller `P(A) · P(B)` hvis uavhengige."
    steps:
      - text: "Bruk en av disse, avhengig av relasjonen mellom hendelsene:"
        formula:
          - "Disjunkte:  P(A ∩ B) = 0"
          - "Uavhengige:  P(A ∩ B) = P(A) · P(B)"
          - "Avhengige:  P(A ∩ B) = P(A) · P(B|A)"
      - text: "Eksempel: trekk 2 kort uten tilbakelegging, `P(første ess) = 4/52`, `P(andre ess|første ess) = 3/51`:"
        formula: "P(begge ess) = (4/52)·(3/51) = 1/221 ≈ 0.0045"
        example: true
  - label: "Betinget P(A | B) direkte"
    recognition: "«Sannsynligheten for `A` GITT at `B` har skjedd», «P(har sykdom | positiv test)». Bruk `P(A ∩ B) / P(B)`."
    steps:
      - text: "Bruk definisjonen, forutsatt `P(B) > 0`:"
        formula: "P(A | B) = P(A ∩ B) / P(B)"
      - "Hvis `P(A ∩ B)` ikke er gitt eksplisitt, regn det først ut (typisk via produktregel, total sannsynlighet, eller et venndiagram)"
      - text: "Eksempel: `P(M ∩ F) = 0.41`, `P(F) = 0.45`:"
        formula: "P(M | F) = 0.41 / 0.45 ≈ 0.911"
        example: true
      - text: "Hvis du i stedet kjenner `P(B|A)` (motsatt retning), bruk Bayes' setning:"
        formula: "P(A|B) = P(A)·P(B|A) / P(B)"
        conditional: true
      - text: "Hvis du betinger på et komplement (`P(A | B̄)`) eller begge negert (`P(Ā | B̄)`), se egne fane(r) under."
        conditional: true

  - label: "Betinget på komplement P(A | B̄)"
    recognition: "«Sannsynligheten for `A` gitt at `B` IKKE skjer», «P(suksess | ingen feil)»."
    steps:
      - text: "Definisjonen — samme som vanlig betinget, men nevneren er `P(B̄)`:"
        formula: "P(A | B̄) = P(A ∩ B̄) / P(B̄)"
      - text: "Nevneren er rett frem:"
        formula: "P(B̄) = 1 − P(B)"
      - text: "For `P(A ∩ B̄)` (telleren) avhenger det av relasjonen mellom A og B:"
        formula:
          - "A og B disjunkte:  P(A ∩ B̄) = P(A)   (siden A ⊆ B̄)"
          - "A og B uavhengige:  P(A ∩ B̄) = P(A) · (1 − P(B))"
          - "A og B avhengige:  P(A ∩ B̄) = P(A) − P(A ∩ B)"
      - text: "Eksempel — disjunkt (ansettelse: `P(Anna) = 0.50`, `P(Bjørn) = 0.30`, disjunkte). Gitt at Bjørn IKKE blir ansatt, sjansen for Anna:"
        formula: "P(Anna | ¬Bjørn) = 0.50 / (1 − 0.30) = 0.50 / 0.70 ≈ 0.714"
        example: true
      - text: "Eksempel — generelt (`P(A) = 0.60`, `P(B) = 0.40`, `P(A ∩ B) = 0.25`):"
        formula: "P(A | B̄) = (0.60 − 0.25) / (1 − 0.40) = 0.35 / 0.60 ≈ 0.583"
        example: true
      - { text: "Hvis A og B er disjunkte, forenkles uttrykket til `P(A | B̄) = P(A) / (1 − P(B))` — telleren er bare `P(A)` fordi `A ⊆ B̄` automatisk", conditional: true }

  - label: "Begge negert P(Ā | B̄)"
    recognition: "«Sannsynligheten for at ingen av delene skjer, betinget», «ingen feil gitt at testen er negativ»."
    steps:
      - text: "Definisjonen, samme oppskrift:"
        formula: "P(Ā | B̄) = P(Ā ∩ B̄) / P(B̄)"
      - text: "Bruk De Morgan på telleren — komplementet av union:"
        formula: "P(Ā ∩ B̄) = 1 − P(A ∪ B)"
      - text: "Regn `P(A ∪ B)` via unionssetningen, så sett alt sammen:"
        formula: "P(Ā | B̄) = (1 − P(A ∪ B)) / (1 − P(B))"
      - text: "Eksempel: `P(A) = 0.30`, `P(B) = 0.40`, `P(A ∩ B) = 0.10`. Først unionen:"
        formula: "P(A ∪ B) = 0.30 + 0.40 − 0.10 = 0.60"
        example: true
      - text: "Sett sammen:"
        formula: "P(Ā | B̄) = (1 − 0.60) / (1 − 0.40) = 0.40 / 0.60 ≈ 0.667"
        example: true

  - label: "Test om A og B er uavhengige"
    recognition: "«Er A og B uavhengige hendelser?», «test om P(A ∩ B) = P(A)·P(B)»."
    steps:
      - text: "Definisjonen: `A` og `B` er uavhengige hvis:"
        formula: "P(A ∩ B) = P(A) · P(B)"
      - "Regn ut `P(A) · P(B)` fra de gitte marginalsannsynlighetene"
      - "Sammenlign med oppgitt eller utregnet `P(A ∩ B)`"
      - "Hvis de er like: hendelsene er uavhengige. Hvis ikke: de er avhengige (oppgi differansen som dokumentasjon)"
      - text: "Eksempel: `P(F) = 0.45`, `P(M) = 0.80`, `P(F ∩ M) = 0.41`. Sammenlign:"
        formula: "P(F)·P(M) = 0.36 ≠ 0.41  →  F og M er IKKE uavhengige"
        example: true
      - text: "Ekvivalent test: `P(A|B) = P(A)` ⇔ uavhengighet. Bruk denne hvis det er enklere å beregne `P(A|B)`."
        conditional: true

common_traps: |
  - **`P(B|A) ≠ P(A|B)`** generelt — å bytte rekkefølge gir feil svar
    (likhet gjelder bare hvis `P(A) = P(B)`). For å konvertere mellom dem,
    bruk [Bayes' setning](/entry/bayes-setning).
  - **Uavhengig ≠ disjunkt**: hvis `A` og `B` er disjunkte (utelukker
    hverandre), så er `P(A ∩ B) = 0`, IKKE `P(A)·P(B)`. Uavhengighet
    krever `P(A ∩ B) = P(A)·P(B)`, og disjunkte hendelser med `P > 0` er
    aldri uavhengige.
  - **Uten tilbakelegging**: etter første trekning endrer populasjonen seg —
    `P(andre ess | første ess) = 3/51`, ikke `4/52`. Klassisk feil å bruke
    samme `p` for begge trekninger.
  - **Betingelsen sitter på det som "allerede har skjedd"**: i `P(B|A)` er det
    `A` som er gitt. Ordlyden "gitt at `A`" og "vitende at `A`" peker på `A`
    som betingelse — skriv riktig retning før du regner.
  - **`P(A ∩ B)` er symmetrisk**: `P(A)·P(B|A) = P(B)·P(A|B)`. Bruk den
    rekkefølgen der både `P(·)` og det betingede er gitt eller lettest å finne.

detailed_solution_variants:
  - label: "Produktregel for snitt"
    solutions:
      - source: "Praksis · trekk uten tilbakelegging"
        question: "En urne inneholder 5 røde og 3 hvite kuler. Vi trekker to kuler uten tilbakelegging. Hva er sannsynligheten for at begge er røde?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «første kule er rød» og `B` = «andre kule er rød»." }
              - { text: "Hendelsene er sekvensielle og IKKE uavhengige – sammensetningen i urnen endrer seg etter første trekning." }
              - { text: "Vi skal bruke produktregelen med betinget sannsynlighet." }
          - label: "Formel"
            lines:
              - { text: "Generell produktregel:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B | A)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 5/8`  (5 røde av 8 totalt ved første trekning)" }
              - { indent: "`P(B | A) = 4/7`  (etter at en rød er trukket: 4 røde av 7 igjen)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn i produktregelen:" }
              - { indent: "`P(A ∩ B) = (5/8) · (4/7)`" }
              - { indent: "`= 20/56`" }
              - { indent: "`= 5/14`" }
              - { comment: "Forkort brøken med felles faktor 4." }
        result: "`P(begge røde) = 5/14 ≈ 0.357`"

      - source: "Praksis · kortstokk uten tilbakelegging"
        question: "Vi trekker to kort fra en standard kortstokk (52 kort) uten tilbakelegging. Hva er sannsynligheten for at begge er ess?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «første kort er ess» og `B` = «andre kort er ess»." }
              - { text: "Trekning uten tilbakelegging ⇒ hendelsene er avhengige." }
              - { text: "Det finnes 4 ess i en kortstokk på 52 kort." }
          - label: "Formel"
            lines:
              - { text: "Produktregel for avhengige hendelser:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B | A)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 4/52`  (4 ess av 52 kort)" }
              - { indent: "`P(B | A) = 3/51`  (3 ess igjen av 51 kort etter første trekning)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn i formelen:" }
              - { indent: "`P(A ∩ B) = (4/52) · (3/51)`" }
              - { indent: "`= 12/2652`" }
              - { indent: "`= 1/221`" }
              - { indent: "`≈ 0.00452`" }
        result: "`P(to ess) = 1/221 ≈ 0.0045`"

      - source: "Praksis · uavhengige hendelser"
        question: "Vi kaster en mynt og en terning samtidig. Hva er sannsynligheten for å få krone OG en sekser?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «mynten viser krone» og `B` = «terningen viser 6»." }
              - { text: "Mynt og terning påvirker ikke hverandre ⇒ hendelsene er uavhengige." }
              - { text: "Da forenkles produktregelen til `P(A ∩ B) = P(A) · P(B)`." }
          - label: "Formel"
            lines:
              - { text: "Produktregel for uavhengige hendelser:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 1/2`  (krone på en rettferdig mynt)" }
              - { indent: "`P(B) = 1/6`  (sekser på en rettferdig terning)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn:" }
              - { indent: "`P(A ∩ B) = (1/2) · (1/6)`" }
              - { indent: "`= 1/12`" }
              - { indent: "`≈ 0.0833`" }
        result: "`P(krone ∩ sekser) = 1/12 ≈ 0.083`"

  - label: "Betinget på komplement P(A | B̄)"
    solutions:
      - source: "Praksis · ansettelse (disjunkt)"
        question: "En bedrift skal ansette én ny person blant tre kandidater: Anna, Bjørn og Camilla. Sannsynlighetene er P(Anna) = 0.50, P(Bjørn) = 0.30, P(Camilla) = 0.20 (kun én blir ansatt — disjunkte). Gitt at Bjørn IKKE blir ansatt, hva er sannsynligheten for at Anna blir det?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «Anna blir ansatt» og `B` = «Bjørn blir ansatt»." }
              - { text: "Hendelsene er DISJUNKTE — kun én person ansettes." }
              - { text: "Vi vil ha `P(A | B̄)` — sjansen for Anna gitt at Bjørn ikke ansettes." }
          - label: "Formel"
            lines:
              - { text: "Betinget sannsynlighet:" }
              - { indent: "`P(A | B̄) = P(A ∩ B̄) / P(B̄)`" }
              - { text: "Siden A og B er disjunkte er `A ⊆ B̄`, så `A ∩ B̄ = A`:" }
              - { indent: "`P(A ∩ B̄) = P(A) = 0.50`" }
              - { text: "Nevneren:" }
              - { indent: "`P(B̄) = 1 − P(B) = 1 − 0.30 = 0.70`" }
          - label: "Innsatt"
            lines:
              - { indent: "`P(A | B̄) = 0.50 / 0.70 ≈ 0.714`" }
              - { comment: "Intuisjon: når Bjørn faller bort fordeles sannsynligheten på de to gjenværende kandidatene proporsjonalt." }
        result: "`P(Anna | ¬Bjørn) ≈ 0.714` (71.4 %)"

      - source: "Praksis · venndiagram (generelt)"
        question: "I en befolkning har 60 % bestått matte, 40 % har bestått fysikk, og 25 % har bestått begge. Gitt at en tilfeldig person IKKE har bestått fysikk, hva er sannsynligheten for at hen har bestått matte?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `M` = «bestått matte» og `F` = «bestått fysikk»." }
              - { text: "`P(M) = 0.60`, `P(F) = 0.40`, `P(M ∩ F) = 0.25`." }
              - { text: "Hendelsene overlapper — ikke disjunkte." }
              - { text: "Vi vil ha `P(M | F̄)`." }
          - label: "Formel"
            lines:
              - { text: "Betinget på komplement:" }
              - { indent: "`P(M | F̄) = P(M ∩ F̄) / P(F̄)`" }
              - { text: "Telleren via set-differanse (venndiagram):" }
              - { indent: "`P(M ∩ F̄) = P(M) − P(M ∩ F) = 0.60 − 0.25 = 0.35`" }
              - { text: "Nevneren:" }
              - { indent: "`P(F̄) = 1 − 0.40 = 0.60`" }
          - label: "Innsatt"
            lines:
              - { indent: "`P(M | F̄) = 0.35 / 0.60 ≈ 0.583`" }
        result: "`P(matte | ikke fysikk) ≈ 0.583` (58.3 %)"

      - source: "Praksis · uavhengighet"
        question: "En produsent har to maskiner som svikter uavhengig: maskin A med sannsynlighet 0.10 og maskin B med 0.20 per dag. Gitt at maskin B IKKE svikter en gitt dag, hva er sannsynligheten for at maskin A svikter samme dag?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «maskin A svikter» og `B` = «maskin B svikter»." }
              - { text: "Hendelsene er UAVHENGIGE." }
              - { text: "Vi vil ha `P(A | B̄)`." }
          - label: "Snarvei (uavhengighet)"
            lines:
              - { text: "For uavhengige hendelser er også `A` og `B̄` uavhengige, så betingelsen endrer ingenting:" }
              - { indent: "`P(A | B̄) = P(A) = 0.10`" }
              - { comment: "Sjekk via vanlig oppskrift: `P(A ∩ B̄) = P(A)·(1 − P(B)) = 0.10·0.80 = 0.08`, og `P(A | B̄) = 0.08 / 0.80 = 0.10`. Samme svar." }
        result: "`P(A | B̄) = 0.10` — uendret av betingelsen siden hendelsene er uavhengige"

