id: ki-andel-binomial
name_no: "Konfidensintervall for andel p (binomial)"
type: identity
category: confidence_interval
tagline: "(1-α)·100 % KI for sannsynlighet/andel p basert på X suksesser av n forsøk."

formula_main: "p̂ ± z_(α/2) · √(p̂·(1-p̂)/n)"
formula_latex: "\\hat{p} \\pm z_{\\alpha/2} \\cdot \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}}"

what_it_does: |
  Gir et tilnærmet intervall som med (1-α)·100 % sikkerhet inneholder
  den sanne andelen p i en populasjon, basert på p̂ = X/n. Forutsetter
  at n er stort nok (n·p̂·(1-p̂) ≥ 5).

why_use: |
  Brukes når problemet handler om en binomisk situasjon (n forsøk,
  hver med to mulige utfall) og vi vil estimere den underliggende
  sannsynligheten p med usikkerhetsmål.

recognition_cues:
  - "Spørsmålet ber om KI for en andel/sannsynlighet"
  - "Du har observert X suksesser i n forsøk"
  - "Konfidensnivå er gitt"
  - "Du har en binomisk situasjon (samme p i hvert forsøk, uavhengige)"

when_NOT_to_use:
  - "Du estimerer en rate (per tidsenhet) → bruk KI for poissonrate"
  - "n·p̂·(1-p̂) < 5 → normalapproksimasjon for unøyaktig"

symbols:
  - { sym: "p̂",        means: "punktestimat for andelen, p̂ = X/n" }
  - { sym: "X",         means: "antall suksesser observert" }
  - { sym: "n",         means: "antall forsøk" }
  - { sym: "z_(α/2)",   means: "kvantil i standardnormalfordelingen" }

filters:
  computes: [confidence_interval]
  random_variable: [proportion]
  setup: [single_sample, fixed_n_trials]
  structural_cues: [success_probability_given]
  parameters_known: [success_p, sample_size_large]
  distribution_assumption: [binomial, normal]
  tooling: [normal_quantile_table_E4]

solution_template:
  - "Beregn p̂ = X/n"
  - "Sjekk at n·p̂·(1-p̂) ≥ 5"
  - "Slå opp z_(α/2) i E.4"
  - "Beregn margin: z_(α/2) · √(p̂(1-p̂)/n)"
  - "KI: p̂ ± margin"

common_traps: |
  Standard error i KI bruker p̂ (estimert), MEN i hypotesetest for andel
  bruker man p₀ (verdien fra H₀). Pass på! Husk å sjekke approksimasjons-
  betingelsen før du bruker normalapproksimasjon.

python_snippet: |
  import math
  from scipy.stats import norm

  X, n, alpha = 23, 80, 0.10
  p_hat = X / n                         # 0.2875
  z = norm.ppf(1 - alpha/2)             # 1.645
  margin = z * math.sqrt(p_hat * (1 - p_hat) / n)
  ci = (p_hat - margin, p_hat + margin)

examples:
  - source: "Eksamen mai25 · oppgave 3b"
    excerpt: "23 av 80 grantrær har sykdom. Finn 90 % KI for andel p."
    solution_sketch: "p̂ = 0.2875. z_0.05 = 1.645. Margin = 1.645·√(0.2875·0.7125/80) = 0.0832. CI = [0.204, 0.371]"

detailed_solutions:
  - source: "Eksamen mai25 · oppgave 3b"
    question: "Vi plukket ut 80 grantrær og 23 hadde sykdom. Finn et tilnærmet 90 % konfidensintervall for andelen p av grantrær som har sykdommen."
    sections:
      - label: "Identifisering"
        lines:
          - { text: "X = 23, n = 80, konfidensnivå 90 % → α = 0.10" }
      - label: "Punktestimat"
        lines:
          - { text: "p̂ = X/n = 23/80 = 0.2875" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.4", text: "z_(α/2) = z_0.05 = 1.645" } }
      - label: "Innsatt"
        lines:
          - { text: "Margin = 1.645 · √(0.2875 · (1-0.2875) / 80)" }
          - { indent: "= 1.645 · √(0.2875 · 0.7125 / 80)" }
          - { indent: "= 1.645 · √0.002562" }
          - { indent: "= 1.645 · 0.0506 = 0.0832" }
          - { text: "CI = 0.2875 ± 0.0832" }
    result: "p ∈ [0.204, 0.371]"

