id: z-score
term_no: Z-score (z-verdi)
short_def: "Hvor mange standardavvik en observasjon ligger fra forventningen: `Z = (X − μ)/σ`."
filters:
  distribution_assumption: [normal]
  parameters_known: [population_variance_known, alpha_significance]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4]
  computes: [hypothesis_test, exact_probability, range_probability]
  structural_cues: [normal_assumed]
  random_variable: [mean_of_samples]
  setup: [single_population]
aliases:
  - z-score
  - z-verdi
  - z-skår
long_def: |
  Z-score standardiserer en observasjon til standardnormalfordeling
  (`μ = 0`, `σ = 1`). Brukes både til å sammenligne verdier på ulike
  skalaer og som testobservator i z-test.

  **Enkel observasjon:**

      Z = (X − μ) / σ

  **Utvalgsgjennomsnitt:**

      Z = (X̄ − μ₀) / (σ/√n)

  Slå opp sannsynligheter eller kvantiler i E.3- / E.4-tabellene.
see_also:
