id: disjunkte-hendelser-glos
term_no: Disjunkte hendelser (gjensidig utelukkende)
short_def: "To hendelser kan ikke inntreffe samtidig: `P(A ∩ B) = 0`."
filters:
  structural_cues: [disjoint_events, independent_events]
  computes: [union_probability, test_independence, exact_probability]
long_def: |
  Når `A` og `B` er disjunkte, forenkles unionssetningen til:

      P(A ∪ B) = P(A) + P(B)

  Disjunkt er **IKKE** det samme som uavhengig: hvis disjunkte hendelser
  begge har positiv sannsynlighet, kan de ikke være uavhengige (vet du
  `A` skjedde, vet du sikkert `B` ikke skjedde).

  ## Slik kjenner du dem igjen

  Spør: kan de to hendelsene være sanne **på samme utfall**? Hvis nei,
  er de disjunkte.

  Tenk på selve utfallet (hele utvalget, hele kastet) — ikke på de
  enkelte elementene i det.

  **Enkelt eksempel:** «får krone» og «får mynt» i ett myntkast. Ett
  utfall kan ikke samtidig være krone og mynt → disjunkte.

  **Sammensatt eksempel:** trekk 5 kort fra en bunke med kategori A og
  kategori B.

      Hendelse 1: «alle 5 er fra A»     →  utvalget har 5A, 0B
      Hendelse 2: «ingen er fra A»      →  utvalget har 0A, 5B

  Ett utvalg kan ikke samtidig ha 5A og 0A. De to hendelsene er
  gjensidig utelukkende → disjunkte.

  > **Vanlig feil:** å begrunne med «hvert kort er enten fra A eller fra
  > B». Det handler om enkeltelementer, ikke om hendelsene. Argumentet
  > skal handle om at de to *hendelsesbeskrivelsene* ikke kan være
  > sanne for samme utvalg.

  ## Konsekvens

  Disjunkthet gir `A ⊆ B̄`, slik at

      P(A | B̄) = P(A) / (1 − P(B))
