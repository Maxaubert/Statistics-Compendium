id: de-morgans-lov
term_no: De Morgans lov
short_def: "Komplementet av en union er snittet av komplementene — og omvendt."
filters:
  computes: [union_probability, exact_probability]
  structural_cues: [complement_pattern, disjoint_events, no_occurrences]
aliases:
  - de morgans lov
  - de morgans lover
  - de-morgans-lover
long_def: |
  De Morgans to lover gir deg en måte å flytte et komplement inn eller
  ut av et union/snitt-uttrykk. Komplementet (overstreken) gjelder HELE
  uttrykket på den ene siden:

      «ikke (A eller B)»  =  «ikke A og ikke B»
      «ikke (A og B)»     =  «ikke A eller ikke B»

  Med komplement-notasjon:

      (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ
      (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ

  Brukes ofte for å forenkle uttrykk som "verken `A` eller `B`" eller
  "ikke begge". Sammen med komplementregelen gir det en kraftig måte å
  regne ut sammensatte sannsynligheter.

  **Sannsynlighetsversjon** (anvend `P(Eᶜ) = 1 − P(E)`):

      P(Aᶜ ∩ Bᶜ) = 1 − P(A ∪ B)        («ingen av delene»)
      P(Aᶜ ∪ Bᶜ) = 1 − P(A ∩ B)        («ikke begge»)

  **Eksempel** — «sannsynligheten for at en kunde verken bestiller
  mat eller drikke», gitt `P(M) = 0.7`, `P(D) = 0.6`, `P(M ∩ D) = 0.5`:

      P(M ∪ D) = 0.7 + 0.6 − 0.5 = 0.8
      P(Mᶜ ∩ Dᶜ) = 1 − P(M ∪ D) = 1 − 0.8 = 0.2
