id: binomial-fordeling
name_no: Binomialfordeling
type: distribution
category: discrete_distribution
tagline: "Antall suksesser i et fast antall `n` uavhengige forsøk med suksessannsynlighet `p`."

formula_main: "P(X = k) = C(n, k) · p^k · (1-p)^(n-k)"
formula_latex: "P(X = k) = \\binom{n}{k} p^k (1-p)^{n-k}"

what_it_does: |
  Modellerer antall suksesser i et fast antall `n` uavhengige Bernoulli-forsøk
  hvor hvert forsøk har samme suksessannsynlighet `p` og to mulige utfall
  (suksess eller fiasko).

why_use: |
  Brukes når problemet beskriver et fastlagt antall uavhengige forsøk og
  spør etter sannsynligheten for et bestemt antall suksesser. Eksempler i
  pensum: myntkast, trekk fra kortstokk med tilbakelegging, andel grantrær
  med sykdom i et utplukk.

recognition_cues:
  - "Oppgaven oppgir fast antall `n` forsøk og en andel/sannsynlighet `p` (f.eks. 'vi sjekker 10 trær, hver er syk med 20 % sannsynlighet')"
  - "Hvert forsøk har bare to utfall: suksess/fiasko, defekt/OK, syk/frisk"
  - "Spørsmålet ber om 'nøyaktig `k`', 'minst `k`', 'høyst `k`' suksesser"
  - "Med tilbakelegging — eller `p` antas konstant fordi populasjonen er stor i forhold til `n`"
  - "Spørsmål av typen 'hvor mange `n` må vi ha for at `P(X ≥ 1) > 0.95`' (terskelproblem)"

when_NOT_to_use:
  - "Trekker uten tilbakelegging fra endelig pott → bruk [hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling) i stedet"
  - "Antall forsøk varierer eller er ikke fastlagt → bruk [Poissonfordeling](/entry/poisson-fordeling)"
  - "Spørsmålet handler om antall hendelser pr. tidsenhet → bruk [Poissonfordeling](/entry/poisson-fordeling)"

symbols:
  - { sym: "X",      means: "antall suksesser av `n` forsøk, `X ~ Bin(n, p)`" }
  - { sym: "n",      means: "antall forsøk (heltall)" }
  - { sym: "p",      means: "suksessannsynlighet i hvert forsøk" }
  - { sym: "1 - p",  means: "fiaskoannsynlighet i hvert forsøk" }
  - { sym: "k",      means: "antall suksesser det spørres om (heltall, `0 ≤ k ≤ n`)" }
  - { sym: "C(n,k)", means: "binomialkoeffisient `n` over `k`, antall måter å plukke `k` blant `n`" }
  - { sym: "E[X]",   means: "forventet antall suksesser, `np`" }
  - { sym: "Var[X]", means: "variansen til `X`, `np(1−p)`" }
  - { sym: "σ",      means: "standardavviket, `√(np(1−p))`" }

properties:
  expected_value: "E[X] = np"
  variance: "Var[X] = np(1-p)"
  std_dev: "σ = √(np(1-p))"

filters:
  computes: [exact_probability, at_least_k, range_probability, find_n_for_threshold, expected_value]
  random_variable: [discrete_count]
  setup: [single_population, fixed_n_trials, with_replacement]
  structural_cues: [two_outcomes_per_trial, independent_events, complement_pattern, counting_events, probability_threshold, no_occurrences, all_same_type]
  parameters_known: [success_p]
  distribution_assumption: [binomial]
  tooling: [cumulative_binomial_table_E1, standard_normal_table_E3, calculator_binomial_coef, calculator_sqrt]

solution_variants:
  - label: "P(X = k)"
    recognition: "«Sannsynligheten for nøyaktig `k` suksesser av `n`», «hva er sjansen for 3 sekser i 10 kast?». Eksakt antall i et fast antall forsøk."
    steps:
      - "Identifiser `n` (antall forsøk) og `p` (suksessannsynlighet) fra oppgaveteksten"
      - "Skriv `X ~ Bin(n, p)` og noter ønsket verdi `k` (heltall, `0 ≤ k ≤ n`)"
      - text: "Sett inn i formelen:"
        formula: "P(X = k) = C(n,k) · p^k · (1−p)^(n−k)"
      - text: "Beregn binomialkoeffisienten (f.eks. `C(10,4) = 210`):"
        formula: "C(n,k) = n! / (k! · (n−k)!)"
      - text: "Multiplisér leddene sammen. Eksempel `n = 10, p = 0.30, k = 4`:"
        formula: "P(X = 4) = 210 · 0.3⁴ · 0.7⁶ ≈ 0.200"
        example: true
      - text: "Hvis `k = 0`, formelen forenkles:"
        formula: "P(X = 0) = (1−p)^n"
        conditional: true
      - text: "Hvis `k = n`, formelen forenkles:"
        formula: "P(X = n) = p^n"
        conditional: true
  - label: "P(X ≤ k)"
    recognition: "«Sannsynligheten for høyst `k` suksesser», «færre enn 5 av 20 lykkes». Kumulativ — slå opp i tabell E.1 eller summer."
    steps:
      - "Identifiser `n`, `p` og terskelen `k` fra oppgaven"
      - "Skriv `X ~ Bin(n, p)` og bekreft at vi ønsker den kumulative `P(X ≤ k)`"
      - "Slå opp verdien direkte i **tabell E.1** (Binomialtabell) for gitte `n`, `p`, `k`"
      - text: "Eksempel: `n = 10`, `p = 0.20`, `k = 1`:"
        formula: "P(X ≤ 1) = 0.376"
        example: true
      - text: "Hvis `k` eller `p` er utenfor tabell E.1 sitt område, summér pmf for hånd:"
        formula: "P(X ≤ k) = Σ_{i=0}^{k} C(n,i) · p^i · (1−p)^(n−i)"
        conditional: true
      - text: "Hvis `p > 0.5` og tabellen kun dekker `p ≤ 0.5`, snu spørsmålet: la `Y = n − X ~ Bin(n, 1−p)`, og bruk:"
        formula: "P(X ≤ k) = P(Y ≥ n−k) = 1 − P(Y ≤ n−k−1)"
        conditional: true
  - label: "P(X ≥ k)"
    recognition: "«Sannsynligheten for minst `k` suksesser», «hva er sjansen for at flere enn 7 av 20 lykkes?». Komplement av `P(X ≤ k−1)`."
    steps:
      - "Identifiser `n`, `p` og nedre grense `k` (oppgaven sier 'minst k')"
      - "Skriv `X ~ Bin(n, p)` og noter at vi vil ha `P(X ≥ k)`"
      - text: "Bruk komplementregelen:"
        formula: "P(X ≥ k) = 1 − P(X ≤ k−1)"
      - "Slå opp `P(X ≤ k−1)` i **tabell E.1**"
      - "Regn ut komplementet"
      - text: "Eksempel: `n = 10`, `p = 0.20`, `k = 2`. Tabell E.1 gir `P(X ≤ 1) = 0.376`:"
        formula: "P(X ≥ 2) = 1 − 0.376 = 0.624"
        example: true
      - text: "Hvis `k = 1`, forenkles uttrykket (ingen tabell nødvendig):"
        formula: "P(X ≥ 1) = 1 − (1−p)^n"
        conditional: true
      - { text: "Hvis `k − 1` er utenfor tabell E.1, summér pmf for `i = 0..k−1` for hånd og bruk komplement", conditional: true }
  - label: "Finn n / sjansen er mindre enn X"
    recognition: "«Hvor mange forsøk må jeg gjøre for at `P(X ≤ k) < α`?», «hvor stort utvalg trengs for at sjansen for å overse defekter blir liten?». Inverst design-problem."
    steps:
      - "Definer variabelen og noter kravet. F.eks. mynt-eksperiment: `X` = antall kron i `n` kast, `X ~ Bin(n, 0.5)`. Krav: `P(X = 0) < 0.01` (sannsynligheten for å aldri få kron skal være under 1 %)"
      - text: "Skriv `P(X = 0)` som funksjon av `n` ved å bruke pmf for `k = 0`:"
        formula: "P(X = 0) = (1 − p)^n = 0.5^n"
      - text: "Sett inn i kravet:"
        formula: "0.5^n < 0.01"
      - text: "Ta naturlig logaritme på begge sider:"
        formula: "n · ln(0.5) < ln(0.01)"
      - { text: "Vi deler på `ln(0.5)` (negativt) i neste steg: `<` flippes til `>`.", conditional: true }
      - text: "Løs for `n`:"
        formula: "n > ln(0.01) / ln(0.5) ≈ 6.64"
      - "Rund opp til nærmeste heltall: `n = 7`"
      - "Verifisér: `0.5^7 = 0.00781 < 0.01` ✓ og `0.5^6 = 0.0156 > 0.01` (så `n = 7` er minste verdi som tilfredsstiller kravet)"
  - label: "Finn n / sjansen overstiger X"
    recognition: "«Hvor mange forsøk må til for at sjansen for minst én suksess overstiger 95 %?». Bruk komplement: `1 − (1−p)ⁿ ≥ α`."
    steps:
      - "Definer variabelen og noter kravet. F.eks. lotto-eksempel: `X` = antall vinst på `n` lodd, `X ~ Bin(n, 0.05)`. Krav: `P(X ≥ 1) > 0.99` (sannsynligheten for minst én vinst skal overstige 99 %)"
      - text: "Skriv `P(X ≥ 1)` via komplement (det er ofte det enkleste):"
        formula: "P(X ≥ 1) = 1 − P(X = 0) = 1 − (1 − p)^n = 1 − 0.95^n"
      - text: "Sett inn i kravet:"
        formula: "1 − 0.95^n > 0.99"
      - { text: "Vi multipliserer med `−1` for å isolere `0.95^n` i neste steg: `>` flippes til `<`.", conditional: true }
      - text: "Isoler `0.95^n`:"
        formula: "0.95^n < 1 − 0.99 = 0.01"
      - text: "Ta naturlig logaritme på begge sider:"
        formula: "n · ln(0.95) < ln(0.01)"
      - { text: "Vi deler på `ln(0.95)` (negativt) i neste steg: `<` flippes til `>`.", conditional: true }
      - text: "Løs for `n`:"
        formula: "n > ln(0.01) / ln(0.95) ≈ 89.78"
      - "Rund opp til nærmeste heltall: `n = 90`"
      - { text: "Hvis kravet gjelder en mer kompleks hendelse (f.eks. `P(X ≥ 2) ≥ 0.95`), finnes ikke lukket logaritme-løsning. Da prøver du økende `n` i **tabell E.1** til kravet er oppfylt — se variant 'Finn n / sjansen for minst k (k ≥ 2)'.", conditional: true }

  - label: "Finn n / sjansen for minst k (k ≥ 2)"
    recognition: "«Hvor mange må vi inspisere for at sjansen for å finne minst 2 defekte er over 90 %?». Inverst, men med terskel høyere enn 1."
    steps:
      - "Definer variabelen og noter kravet. F.eks. avokado-eksempel: `X` = antall spiselige av `n`, `X ~ Bin(n, 0.6)`. Krav: `P(X ≥ 4) ≥ 0.90` (minst 4 spiselige med minst 90 % sjanse)."
      - text: "**Hvorfor virker ikke log-snarveien?** For `k = 1` blir `P(X ≥ 1) = 1 − (1 − p)^n` — bare én potens i `n`, så logaritmen isolerer `n` direkte. For `k ≥ 2` er `P(X ≥ k) = 1 − Σ_{i=0}^{k−1} C(n,i)·p^i·(1−p)^(n−i)` — en sum av flere ledd der `n` opptrer både i `C(n,i)` og i eksponenten. Ingen lukket formel — du må slå opp i **tabell E.1** for økende `n`."
        conditional: true
      - text: "Skriv om via komplement (tabellen gir `P(X ≤ k−1)`, ikke `P(X ≥ k)`):"
        formula: "P(X ≥ k) ≥ p*   ⇔   P(X ≤ k − 1) ≤ 1 − p*"
      - "Velg startverdi for `n`. Minste mulige er `n = k` (du må jo ha plass til `k` suksesser). Som første tipp kan forventningsverdien gi grov pekepinn: `n ≈ k / p` (avokado: `4 / 0.6 ≈ 7`)."
      - "Søk i tabellen: for hver `n`, slå opp `P(X ≤ k − 1)` i **tabell E.1** med riktig `p`. Øk `n` med 1 om gangen til verdien faller under `1 − p*`."
      - text: "Eksempel (`p = 0.6`, krav `P(X ≤ 3) ≤ 0.10`): `n = 7 → 0.290`, `n = 8 → 0.174`, `n = 9 → 0.099 ✓`. Minste `n` er 9:"
        formula: "P(X ≥ 4) = 1 − 0.099 = 0.901 ≥ 0.90"
        example: true
      - "Verifisér at `n − 1` IKKE tilfredsstiller kravet — ellers er svaret ditt ikke 'minste `n`'. (For `n = 8`: `P(X ≥ 4) = 1 − 0.174 = 0.826 < 0.90`, så `n = 9` er korrekt minste.)"
      - { text: "**Motsatt retning** (`P(X ≥ k) ≤ p*`, dvs. sannsynligheten skal være MINDRE enn terskel): ekvivalent med `P(X ≤ k − 1) ≥ 1 − p*`. Da reduserer du `n` til tabellverdien overstiger `1 − p*`, og svaret er da STØRSTE `n` som holder.", conditional: true }
      - { text: "Hvis `p` ikke står i tabell E.1, eller `n` blir for stort: summer pmf for hånd, eller bruk Python — `1 - binom.cdf(k-1, n, p)`.", conditional: true }

  - label: "Normaltilnærming (med heltallskorr.)"
    recognition: "«`n` er stort og tabell E.1 dekker det ikke», eller «`P(Y > 55)` i 300 terningkast». Når `np(1−p) ≥ 5` tilnærmes Bin med normalfordeling, og `±0.5`-korreksjonen bygger bro fra diskret til kontinuerlig."
    steps:
      - "Identifiser `n` og `p`, og noter grensen(e) `k` (eller `a`, `b`)"
      - text: "Sjekk gyldighetskravet — tommelfingerregel:"
        formula: "np(1−p) ≥ 5     (alternativt `np ≥ 5` og `n(1−p) ≥ 5`)"
      - text: "Beregn forventning og spredning til normaltilnærmingen:"
        formula:
          - "μ = np"
          - "σ = √(np(1−p))"
      - text: "Hovedformel — «høyst `k`» (nedre hale) med heltallskorreksjon `+0.5`:"
        formula: "P(X ≤ k) ≈ G((k + 0.5 − np)/√(np(1−p)))"
      - text: "«Mer enn `k`» (`X > k`) via komplement — samme `+0.5` siden vi inkluderer `k` i nedre hale:"
        formula: "P(X > k) ≈ 1 − G((k + 0.5 − np)/√(np(1−p)))"
      - text: "«Minst `k`» (`X ≥ k`) — pass på korreksjonen `−0.5` (vi inkluderer `k` selv):"
        formula: "P(X ≥ k) ≈ 1 − G((k − 0.5 − np)/√(np(1−p)))"
      - text: "Tosidig intervall `a ≤ X ≤ b` — utvid begge ender med 0.5:"
        formula: "P(a ≤ X ≤ b) ≈ G((b + 0.5 − np)/σ) − G((a − 0.5 − np)/σ)"
      - text: "Punkt-sannsynlighet «ved likhet» (`X = k`) — differanse av to nærliggende `G`-verdier:"
        formula: "P(X = k) ≈ G((k + 0.5 − np)/σ) − G((k − 0.5 − np)/σ)"
      - "Slå opp `G(z)` i **tabell E.3** (standard normalfordeling). Bruk `G(−z) = 1 − G(z)` for negative argumenter."
      - text: "Eksempel — `n = 300`, `p = 1/6`, `P(Y > 55)`. Her er `μ = 50`, `σ ≈ 6.455`:"
        formula: "P(Y > 55) ≈ 1 − G(0.85) ≈ 1 − 0.8023 = 0.198"
        example: true
      - text: "Tosidig — samme oppsett, `P(40 ≤ Y ≤ 60)`:"
        formula: "P(40 ≤ Y ≤ 60) ≈ G(1.63) − G(−1.63) ≈ 0.897"
        example: true
      - text: "Hvis `np(1−p) < 5`, ikke bruk normaltilnærming — gå til pmf-sum eller [Poisson-tilnærming](/entry/poisson-fordeling) i stedet (særlig hvis `p` er svært nær 0 eller 1)."
        conditional: true
      - text: "Glemmer du `±0.5`-korreksjonen blir svaret mindre presist (særlig nær halene og for små `n`). Inkluder den alltid når oppgaven sier «med heltallskorreksjon»."
        conditional: true

common_traps: |
  Vær sikker på at `p` er konstant fra forsøk til forsøk. Hvis du trekker
  uten tilbakelegging fra et lite utvalg, endrer `p` seg underveis og du
  bør bruke hypergeometrisk i stedet. Tabell E.1 gir `P(X ≤ k)`; for andre
  spørsmålsformer må du bruke komplement eller differanse.

python_snippet: |
  from scipy.stats import binom

  n, p = 10, 0.2

  # P(X = k)
  binom.pmf(2, n, p)        # 0.302

  # P(X ≤ k) – kumulativ
  binom.cdf(1, n, p)        # 0.376

  # P(X ≥ k) = 1 − P(X ≤ k−1)
  1 - binom.cdf(1, n, p)    # 0.624

detailed_solution_variants:
  - label: "P(X = k)"
    solutions:
      - source: "Praksis · bueskyting"
        question: "En bueskytter treffer blink med sannsynlighet `p = 0.30` for hvert skudd. Hun skyter `n = 10` skudd. Hva er sannsynligheten for at hun treffer nøyaktig 4 ganger?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall treff av 10 skudd" }
              - { text: "`X ~ Bin(10, 0.30)`" }
              - { comment: "vi vil ha `P(X = 4)`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = C(n,k)·p^k·(1−p)^(n−k)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 4) = C(10,4)·0.30^4·0.70^6`" }
              - { indent: "= 210 · 0.0081 · 0.117649" }
              - { indent: "≈ 210 · 0.000953" }
        result: "`P(X = 4) ≈ 0.2001`"
      - source: "Praksis · 2 seksere på 6 kast"
        question: "En vanlig terning kastes `n = 6` ganger. Hva er sannsynligheten for å få nøyaktig 2 seksere?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall seksere av 6 kast" }
              - { text: "`X ~ Bin(6, 1/6)`" }
              - { comment: "suksessannsynlighet `p = 1/6 ≈ 0.1667`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = C(n,k)·p^k·(1−p)^(n−k)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 2) = C(6,2)·(1/6)²·(5/6)^4`" }
              - { indent: "= 15 · (1/36) · (625/1296)" }
              - { indent: "= 15 · 0.02778 · 0.48225" }
        result: "`P(X = 2) ≈ 0.2009`"
      - source: "Eksamen mai25 · 3a (variant `P(X = k)`)"
        question: "En andel `p = 0.2` av grantrær har en sykdom. Vi sjekker tilfeldig 10 grantrær. Hva er sannsynligheten for at nøyaktig 2 av disse har sykdommen?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall syke i utplukk på 10" }
              - { text: "`X ~ Bin(10, 0.2)`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = C(n,k)·p^k·(1−p)^(n−k)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 2) = C(10,2)·0.2^2·0.8^8`" }
              - { indent: "= 45 · 0.04 · 0.16777" }
              - { indent: "≈ 45 · 0.006711" }
        result: "`P(X = 2) ≈ 0.3020`"

  - label: "P(X ≤ k)"
    solutions:
      - source: "Praksis · defekter i utplukk"
        question: "En produksjonslinje har defektandel `p = 0.05`. Vi tar et utplukk på `n = 20` enheter. Hva er sannsynligheten for at høyst 2 er defekte?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall defekte av 20" }
              - { text: "`X ~ Bin(20, 0.05)`" }
              - { comment: "vi vil ha `P(X ≤ 2)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.1", text: "Slå opp `P(X ≤ 2)` for `n = 20`, `p = 0.05` → 0.9245" } }
        result: "`P(X ≤ 2) ≈ 0.9245`"
      - source: "Praksis · quiz med gjetting"
        question: "En quiz har 10 ja/nei-spørsmål. En kandidat gjetter tilfeldig (`p = 0.5`). Hva er sannsynligheten for å få høyst 4 riktige?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall riktige av 10" }
              - { text: "`X ~ Bin(10, 0.5)`" }
              - { comment: "fordelingen er symmetrisk om `k = 5`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.1", text: "Slå opp `P(X ≤ 4)` for `n = 10`, `p = 0.5` → 0.3770" } }
          - label: "Symmetri-sjekk"
            lines:
              - { text: "Ved symmetri: `P(X ≤ 4) = P(X ≥ 6) = (1 − P(X = 5))/2`" }
              - { indent: "= (1 − 0.2461)/2 ≈ 0.3770" }
        result: "`P(X ≤ 4) ≈ 0.3770`"
      - source: "Praksis · vaksinerte i utvalg"
        question: "I en kommune er 90 % vaksinert (`p = 0.90`). Vi tar et tilfeldig utvalg på `n = 8` personer. Hva er sannsynligheten for at høyst 6 er vaksinert?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall vaksinerte av 8" }
              - { text: "`X ~ Bin(8, 0.90)`" }
              - { comment: "`p > 0.5`, så vi snur til `Y = 8 − X ~ Bin(8, 0.10)`" }
          - label: "Komplement via Y"
            lines:
              - { text: "`P(X ≤ 6) = P(Y ≥ 2) = 1 − P(Y ≤ 1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.1", text: "Slå opp `P(Y ≤ 1)` for `n = 8`, `p = 0.10` → 0.8131" } }
          - label: "Innsatt"
            lines:
              - { text: "`P(X ≤ 6) = 1 − 0.8131`" }
        result: "`P(X ≤ 6) ≈ 0.1869`"

  - label: "P(X ≥ k)"
    solutions:
      - source: "Eksamen mai25 · 3a"
        question: "En andel `p = 0.2` av grantrær har en sykdom. Vi sjekker tilfeldig 10 grantrær. Hva er sannsynligheten for at minst 2 av disse har sykdommen?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall syke i utplukk på 10" }
              - { text: "`X ~ Bin(10, 0.2)`" }
          - label: "Komplementregelen"
            lines:
              - { text: "`P(X ≥ 2) = 1 − P(X ≤ 1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.1", text: "Slå opp `P(X ≤ 1)` for `n = 10`, `p = 0.2` → 0.376" } }
          - label: "Innsatt"
            lines:
              - { text: "`P(X ≥ 2) = 1 − 0.376`" }
        result: "`P(X ≥ 2) ≈ 0.624`"
      - source: "Eksamen jan22 · oppgave 4b (avokado fra fru Petrell)"
        question: "Andelen spiselige avokadoer i butikken er `p = 0.6`. Fru Petrell plukker tilfeldig 4 avokadoer. Hva er sannsynligheten for at minst 3 av disse er spiselige?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall spiselige avokadoer av 4" }
              - { text: "`X ~ Bin(4, 0.6)`" }
              - { comment: "vi vil ha `P(X ≥ 3)`" }
          - label: "Komplementregelen"
            lines:
              - { text: "`P(X ≥ 3) = 1 − P(X ≤ 2)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.1", text: "Slå opp `P(X ≤ 2)` for `n = 4`, `p = 0.6` → 0.525" } }
          - label: "Innsatt"
            lines:
              - { text: "`P(X ≥ 3) = 1 − 0.525`" }
        result: "`P(X ≥ 3) ≈ 0.475` (knappe 48 % sjanse for at minst 3 av 4 avokadoer er spiselige)."

      - source: "Praksis · lottokuponger"
        question: "Et lodd har vinnersannsynlighet `p = 0.05`. Vi kjøper `n = 20` lodd. Hva er sannsynligheten for å vinne minst én gang?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall vinnerlodd av 20" }
              - { text: "`X ~ Bin(20, 0.05)`" }
              - { comment: "`k = 1` gir forenklet uttrykk via `P(X = 0)`" }
          - label: "Komplementregelen"
            lines:
              - { text: "`P(X ≥ 1) = 1 − P(X = 0)`" }
              - { indent: "= 1 − (1−p)^n" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X ≥ 1) = 1 − 0.95^20`" }
              - { indent: "= 1 − 0.3585" }
        result: "`P(X ≥ 1) ≈ 0.6415`"
      - source: "Praksis · kvalitetskontroll"
        question: "I en batch på `n = 50` deler er hver del OK med sannsynlighet `p = 0.99`. Hva er sannsynligheten for at minst 49 deler er OK?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall OK-deler av 50" }
              - { text: "`X ~ Bin(50, 0.99)`" }
              - { comment: "vi vil ha `P(X ≥ 49)`" }
          - label: "Direkte sum"
            lines:
              - { text: "`P(X ≥ 49) = P(X = 49) + P(X = 50)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 49) = C(50,49)·0.99^49·0.01^1`" }
              - { indent: "= 50 · 0.6111 · 0.01 ≈ 0.3056" }
              - { text: "`P(X = 50) = 0.99^50 ≈ 0.6050`" }
        result: "`P(X ≥ 49) ≈ 0.9106`"

  - label: "Finn n / sjansen er mindre enn X"
    solutions:
      - source: "Praksis · aldri krone"
        question: "En mynt kastes `n` ganger. Hvor mange ganger må vi kaste for at sannsynligheten for å aldri få krone er mindre enn 1 %?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall kron i `n` kast" }
              - { text: "`X ~ Bin(n, 0.5)`" }
              - { comment: "krav: `P(X = 0) < 0.01` — sannsynligheten for at vi aldri får krone skal være mindre enn 1 %" }
          - label: "Innsetting"
            lines:
              - { text: "`P(X = 0) = (1−p)^n = 0.5^n`" }
              - { text: "`0.5^n < 0.01`" }
          - label: "Logaritme"
            lines:
              - { text: "`n · ln(0.5) < ln(0.01)`" }
              - { comment: "`ln(0.5) < 0` snur ulikhetstegnet" }
              - { text: "`n > ln(0.01) / ln(0.5)`" }
              - { indent: "= −4.6052 / −0.6931" }
              - { indent: "≈ 6.64" }
          - label: "Avrunding"
            lines:
              - { text: "Rund opp til neste heltall: `n = 7`" }
              - { comment: "verifiser: `0.5^7 = 0.0078 < 0.01` ✓ og `0.5^6 = 0.0156 > 0.01`" }
        result: "`n = 7` kast"
      - source: "Praksis · ingen defekter"
        question: "Hver del produseres med en defektrate på 1 % (`p = 0.01`). Hvor stor batch `n` kan vi produsere og fortsatt ha minst 95 % sannsynlighet for at ingen del er defekt?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall defekter i batch på `n`" }
              - { text: "`X ~ Bin(n, 0.01)`" }
              - { comment: "krav: `P(X = 0) ≥ 0.95` — formen blir `(1−p)^n ≥ X` (motsatt retning), så vi ender med MAKS `n`" }
          - label: "Innsetting"
            lines:
              - { text: "`P(X = 0) = (1−p)^n = 0.99^n`" }
              - { text: "`0.99^n ≥ 0.95`" }
          - label: "Logaritme"
            lines:
              - { text: "`n · ln(0.99) ≥ ln(0.95)`" }
              - { comment: "`ln(0.99) < 0` snur ulikhetstegnet" }
              - { text: "`n ≤ ln(0.95) / ln(0.99)`" }
              - { indent: "= −0.05129 / −0.01005" }
              - { indent: "≈ 5.10" }
        result: "`n = 5` deler (maks batch)"

  - label: "Finn n / sjansen overstiger X"
    solutions:
      - source: "Praksis · legemiddel (a + b)"
        question: "Et legemiddel har 30 % sannsynlighet for å virke ved hver enkelt dose. Forsøkene antas uavhengige. **a)** Hva er sannsynligheten for at minst én av tre doser virker? **b)** Hvor mange doser trengs for at sannsynligheten for at minst én virker overstiger 0.95?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall doser som virker av `n`" }
              - { text: "`X ~ Bin(n, 0.3)`" }
              - { comment: "samme oppsett brukes i a) og b); kun `n` og kravet endres" }
          - label: "a) Sannsynlighet med n = 3"
            lines:
              - { text: "Vi vil ha `P(X ≥ 1)` for `n = 3`" }
              - { text: "`P(X ≥ 1) = 1 − P(X = 0) = 1 − (1−p)^n = 1 − 0.7^3`" }
              - { indent: "= 1 − 0.343 = 0.657" }
          - label: "b) Finn n med terskel 0.95"
            lines:
              - { text: "Krav: `P(X ≥ 1) > 0.95`" }
              - { text: "`1 − 0.7^n > 0.95`" }
              - { comment: "vi multipliserer med −1 i neste steg: > flippes til <" }
              - { text: "`0.7^n < 1 − 0.95 = 0.05`" }
              - { text: "`n · ln(0.7) < ln(0.05)`" }
              - { comment: "`ln(0.7) ≈ −0.357` (negativt): < flippes til >" }
              - { text: "`n > ln(0.05) / ln(0.7) ≈ 8.39`" }
              - { text: "Rund opp: `n = 9`" }
              - { comment: "verifiser: `1 − 0.7^9 ≈ 0.960 > 0.95` ✓" }
        result: "a) `P(X ≥ 1) ≈ 0.657`     b) `n = 9` doser"
      - source: "Eksamen jan22 · oppgave 4c (avokado, terskel på P(X ≥ 4))"
        question: "Andelen spiselige avokadoer er `p = 0.6`. Hvor mange avokadoer må fru Petrell ta med seg dersom hun skal være minst 90 % sikker på at hun får minst 4 avokadoer som er spiselige?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall spiselige avokadoer av `n`" }
              - { text: "`X ~ Bin(n, 0.6)`" }
              - { comment: "krav: `P(X ≥ 4) ≥ 0.90`. Her er terskelen IKKE `X ≥ 1` (da virker log-formelen), så vi må gjennom tabell E.1 for flere `n`." }
          - label: "Omskrivning"
            lines:
              - { text: "`P(X ≥ 4) = 1 − P(X ≤ 3)`, og kravet `P(X ≥ 4) ≥ 0.90` blir ekvivalent med `P(X ≤ 3) ≤ 0.10`" }
              - { comment: "vi øker `n` til tabellverdien `P(X ≤ 3)` faller under 0.10" }
          - label: "Tabellsøk"
            lines:
              - { table_lookup: { ref: "E.1", text: "n = 7, p = 0.6: P(X ≤ 3) = 0.290 → P(X ≥ 4) = 0.710 (for lav)" } }
              - { table_lookup: { ref: "E.1", text: "n = 8, p = 0.6: P(X ≤ 3) = 0.174 → P(X ≥ 4) = 0.826 (for lav)" } }
              - { table_lookup: { ref: "E.1", text: "n = 9, p = 0.6: P(X ≤ 3) = 0.099 → P(X ≥ 4) = 0.901 ✓" } }
              - { table_lookup: { ref: "E.1", text: "n = 10, p = 0.6: P(X ≤ 3) = 0.055 → P(X ≥ 4) = 0.945" } }
          - label: "Konklusjon"
            lines:
              - { text: "Minste `n` der `P(X ≥ 4) ≥ 0.90` er `n = 9` (sannsynlighet 0.901)." }
              - { comment: "med `n = 8` er sannsynligheten kun 0.826, så 8 holder ikke." }
        result: "`n = 9` avokadoer (`P(X ≥ 4) ≈ 0.901 ≥ 0.90`)."

      - source: "Praksis · minst én dose virker"
        question: "En medisinsk dose virker uavhengig på hver pasient med sannsynlighet `p = 0.4`. Hvor mange doser `n` trengs for at sannsynligheten for at minst én virker overstiger 0.95?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall doser som virker av `n`" }
              - { text: "`X ~ Bin(n, 0.4)`" }
              - { comment: "krav: `P(X ≥ 1) > 0.95`" }
          - label: "Komplementregelen"
            lines:
              - { text: "`P(X ≥ 1) = 1 − (1−p)^n > 0.95`" }
              - { indent: "= `0.6^n < 0.05`" }
          - label: "Logaritme"
            lines:
              - { text: "`n · ln(0.6) < ln(0.05)`" }
              - { comment: "`ln(0.6) < 0` snur ulikhetstegnet" }
              - { text: "`n > ln(0.05) / ln(0.6)`" }
              - { indent: "= −2.9957 / −0.5108" }
              - { indent: "≈ 5.86" }
          - label: "Avrunding"
            lines:
              - { text: "Rund opp til neste heltall: `n = 6`" }
              - { comment: "verifiser: `1 − 0.6^6 = 1 − 0.0467 ≈ 0.953 > 0.95` ✓" }
        result: "`n = 6` doser"
      - source: "Praksis · minst én vinst"
        question: "Hvert lodd har vinnersannsynlighet `p = 0.05`. Hvor mange lodd må vi kjøpe for at sannsynligheten for å vinne minst én gang er minst 0.99?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X` = antall vinnerlodd av `n`" }
              - { text: "`X ~ Bin(n, 0.05)`" }
              - { comment: "krav: `P(X ≥ 1) ≥ 0.99`" }
          - label: "Komplementregelen"
            lines:
              - { text: "`P(X ≥ 1) = 1 − (1−p)^n ≥ 0.99`" }
              - { indent: "= 0.95^n ≤ 0.01" }
          - label: "Logaritme"
            lines:
              - { text: "`n · ln(0.95) ≤ ln(0.01)`" }
              - { comment: "`ln(0.95) < 0` snur ulikhetstegnet" }
              - { text: "`n ≥ ln(0.01) / ln(0.95)`" }
              - { indent: "= −4.6052 / −0.05129" }
              - { indent: "≈ 89.78" }
        result: "`n = 90` lodd"

  - label: "Normaltilnærming (med heltallskorr.)"
    solutions:
      - source: "Øving 4 · oppgave 1c-d (300 terningkast)"
        question: "En terning kastes 10 ganger, og forsøket gjentas 30 ganger — totalt `n = 300` kast. La `Y` være antall seksere. For hvert kast er `p = 1/6`. Bruk normaltilnærming med heltallskorreksjon til å finne `P(Y > 55)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`Y` = antall seksere i 300 terningkast" }
              - { text: "`Y ~ Bin(300, 1/6)`" }
              - { comment: "Vi vil ha `P(Y > 55)` — øvre hale, motsatt retning" }
          - label: "Gyldighetssjekk"
            lines:
              - { text: "`np(1−p) = 300 · (1/6) · (5/6) ≈ 41.67 ≥ 5` ✓" }
              - { comment: "normaltilnærming er gyldig" }
          - label: "Forventning og spredning"
            lines:
              - { text: "`μ_Y = np = 300 · (1/6) = 50`" }
              - { text: "`σ_Y = √(np(1−p)) = √(300 · (1/6) · (5/6))`" }
              - { indent: "`= √41.667 ≈ 6.455`" }
          - label: "Formel"
            lines:
              - { text: "`P(Y > 55) ≈ 1 − G((55 + 0.5 − np)/√(np(1−p)))`" }
              - { comment: "heltallskorreksjonen `+0.5` legges til fordi `Y` er diskret og normalfordelingen kontinuerlig" }
          - label: "Innsatt"
            lines:
              - { text: "`P(Y > 55) ≈ 1 − G((55.5 − 50)/6.455)`" }
              - { indent: "`= 1 − G(5.5/6.455)`" }
              - { indent: "`= 1 − G(0.85)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "Slå opp `G(0.85)` i standard normalfordeling → `0.8023`" } }
          - label: "Sluttregning"
            lines:
              - { text: "`P(Y > 55) ≈ 1 − 0.8023`" }
        result: "`P(Y > 55) ≈ 0.198` (knapt 20 % sjanse for over 55 seksere i 300 kast)"

      - source: "Praksis · samme terningoppsett, tosidig intervall"
        question: "Samme oppsett: `Y ~ Bin(300, 1/6)`. Bruk normaltilnærming med heltallskorreksjon til å finne `P(40 ≤ Y ≤ 60)` — sannsynligheten for at antall seksere ligger i intervallet `[40, 60]`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`Y ~ Bin(300, 1/6)`" }
              - { comment: "tosidig intervall: `a = 40`, `b = 60` — utvid begge ender med 0.5" }
          - label: "Forventning og spredning"
            lines:
              - { text: "`μ_Y = np = 50`" }
              - { text: "`σ_Y = √(np(1−p)) ≈ 6.455`" }
              - { comment: "samme verdier som over — gjenbrukes" }
          - label: "Formel"
            lines:
              - { text: "`P(a ≤ Y ≤ b) ≈ G((b + 0.5 − np)/σ) − G((a − 0.5 − np)/σ)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(40 ≤ Y ≤ 60) ≈ G((60.5 − 50)/6.455) − G((39.5 − 50)/6.455)`" }
              - { indent: "`= G(10.5/6.455) − G(−10.5/6.455)`" }
              - { indent: "`= G(1.63) − G(−1.63)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "Slå opp `G(1.63) → 0.9484`, og bruk symmetri `G(−1.63) = 1 − 0.9484 = 0.0516`" } }
          - label: "Sluttregning"
            lines:
              - { text: "`= 0.9484 − 0.0516`" }
        result: "`P(40 ≤ Y ≤ 60) ≈ 0.897` (~90 % sjanse for at antall seksere ligger mellom 40 og 60)"

