id: disjunkte-hendelser
name_no: "Disjunkte (gjensidig utelukkende) hendelser"
type: concept
tagline: "To hendelser kan ikke inntreffe samtidig: P(A ∩ B) = 0."

what_it_means: |
  Hendelsene A og B er disjunkte (eller gjensidig utelukkende) hvis de
  ikke kan inntreffe samtidig. Da er P(A ∩ B) = 0, og unionssetningen
  forenkles til P(A ∪ B) = P(A) + P(B).

  Hvis A og B er disjunkte, er A ⊆ B̄, slik at P(A | B̄) = P(A) / (1 - P(B)).

  Disjunkte hendelser er IKKE det samme som uavhengige hendelser. Faktisk:
  hvis A og B er disjunkte og begge har positiv sannsynlighet, så er de
  IKKE uavhengige (kjenner du A inntreffer, vet du B ikke gjør).

recognition_cues:
  - "Oppgaven sier 'disjunkte' eller 'gjensidig utelukkende'"
  - "Du kan se at hendelsene fysisk ikke kan inntreffe sammen"
  - "Eksempel: alle 5 kort er hjerter / ingen av 5 kort er hjerter"

