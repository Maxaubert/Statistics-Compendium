id: en-utvalg-z-test
name_no: "Én-utvalg z-test"
type: test
category: hypothesis_test
tagline: "Tester forventningsverdien `μ` mot en gitt verdi `μ₀` når `σ` er kjent."

formula_main: "Z = (X̄ - μ₀) / (σ/√n)"
formula_latex: "Z = \\frac{\\overline{X} - \\mu_0}{\\sigma / \\sqrt{n}}"

what_it_does: |
  Tester en påstand (hypotese) om forventningsverdien `μ` i en populasjon.
  Du har en "påstandsverdi" `μ₀` (f.eks. "gjennomsnittlig forbruk er 50 W") og
  data fra et utvalg med kjent standardavvik `σ`. Z-testen sammenligner
  utvalgets gjennomsnitt `X̄` med `μ₀` og angir om forskjellen er stor nok til
  å forkaste påstanden.

why_use: |
  Velg z-test framfor t-test når populasjonens standardavvik `σ` er kjent
  (oppgitt i problemet, ikke estimert fra utvalget). I praksis betyr dette
  ofte at oppgaven sier noe som "antar at standardavviket er 5 watt" eller
  at utvalget er stort (`n ≥ 30`) slik at sentralgrenseteoremet gjør det
  tilnærmet samme test.

recognition_cues:
  - "Oppgaven oppgir en standardverdi/påstandsverdi `μ₀` (typisk navngitt 'forventet' eller 'standardmodellen')"
  - "Oppgaven oppgir at standardavviket `σ` er kjent eller 'antas kjent' (ofte med et tall – f.eks. '`σ = 5`')"
  - "Oppgaven oppgir et utvalg med `n` observasjoner (typisk `n ≥ 30`) og dets gjennomsnitt `x̄`"
  - "Spørsmålet ber om en hypotesetest: 'undersøk om `μ` er høyere/lavere/forskjellig fra `μ₀`'"
  - "Signifikansnivå `α` er gitt (vanligvis `0.05` eller `0.01`)"
  - "Spørsmål om `p`-verdi (signifikanssannsynlighet) er ofte med"

when_NOT_to_use:
  - "`σ` er ukjent (kun `s` estimert fra utvalg) → bruk [én-utvalgs t-test](/entry/en-utvalg-t-test) i stedet"
  - "Du sammenligner to grupper → bruk [to-utvalgs t-test](/entry/to-utvalgs-t-test)"
  - "Du tester en andel/proporsjon → bruk [z-test for andel](/entry/en-utvalg-z-test-andel)"

symbols:
  - { sym: "X̄", means: "utvalgsgjennomsnittet" }
  - { sym: "μ",  means: "den ukjente forventningsverdien i populasjonen" }
  - { sym: "μ₀", means: "verdien vi tester mot (fra nullhypotesen)" }
  - { sym: "σ",  means: "populasjonens standardavvik (kjent)" }
  - { sym: "n",  means: "antall observasjoner" }
  - { sym: "Z",  means: "testobservatoren, standardnormalfordelt under `H₀`" }
  - { sym: "H₀", means: "nullhypotesen (vanligvis `μ = μ₀` eller en ulikhet)" }
  - { sym: "H₁", means: "alternativhypotesen (`μ < μ₀`, `μ > μ₀` eller `μ ≠ μ₀`)" }
  - { sym: "α",  means: "signifikansnivå (sannsynlighet for å forkaste `H₀` når den er sann)" }
  - { sym: "z_α", means: "kritisk z-verdi slik at `P(Z > z_α) = α`, slått opp i tabell E.4" }
  - { sym: "G(z)", means: "kumulativ standardnormalfordeling, `P(Z ≤ z)`" }

filters:
  computes: [hypothesis_test, find_x_for_threshold, find_n_for_threshold]
  random_variable: [mean_of_samples, continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, summary_stats_given, two_sided_alternative, one_sided_alternative, probability_threshold]
  parameters_known: [population_variance_known, sample_size_large, mean_known, alpha_significance]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]
solution_variants:
  - label: "H₁: μ < μ₀ (venstre)"
    recognition: "«Er `μ` signifikant mindre enn `μ₀`?» når populasjonsstandardavviket `σ` er KJENT. Ensidig venstresidig."
    description: "Ensidig venstresidig test. Forkast hvis Z < −z_α."
    steps:
      - text: "Sett opp hypotesene. Du mistenker at sann μ ligger UNDER påstandsverdien (f.eks. ny julelys bruker mindre enn 50 W)."
        formula: "H₀: μ ≥ μ₀     mot     H₁: μ < μ₀"
      - "Sjekk forutsetninger: `σ` må være kjent (oppgitt), og enten X normalfordelt eller `n ≥ 30`."
      - text: "Når kan z-test brukes? Sjekk kombinasjonen av `σ` og `n`:"
        cases:
          - when: "`σ` kjent og `n ≥ 30`"
            then: "✓ z-test (CLT gir normalitet)"
          - when: "`σ` kjent og `n < 30` (normalfordeling oppgitt eller antatt)"
            then: "✓ z-test, men skriv at `n < 30` og at du antar normalfordeling"
          - when: "`σ` ukjent og `n ≥ 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test) (`s` estimert fra utvalg krever t-fordeling)"
          - when: "`σ` ukjent og `n < 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test)"
        conditional: true
      - text: "Beregn testobservatoren med formelen:"
        formula: "Z = (X̄ − μ₀) / (σ/√n)"
      - text: "Eksempel med `n = 36`, `σ = 5`, `X̄ = 98`, `μ₀ = 100`. For venstresidig forventes Z negativ."
        formula: "Z = (98 − 100) / (5/√36) = −2 / 0.833 ≈ −2.40"
        example: true
      - text: "Slå opp kritisk verdi `z_α` i **tabell E.4** (Z-kvantiltabell). For `α = 0.05` er `z_0.05 = 1.645`. Forkastningsregel for venstresidig:"
        formula: "Forkast H₀ hvis Z < −z_α"
      - "Sammenlign og konkluder. F.eks. `−2.40 < −1.645` ✓ → forkast H₀. Skriv konklusjonen i kontekst: «Tallene tyder på at μ er lavere enn μ₀.»"
      - text: "Alternativt: regn p-verdi. Slå opp `G(z)` i **tabell E.3** (Z-tabell, kumulativ). For venstresidig:"
        formula: "p = P(Z < z) = G(z)"
        conditional: true
      - { text: "Forkast hvis `p < α`.", conditional: true }

  - label: "H₁: μ > μ₀ (høyre)"
    recognition: "«Er `μ` signifikant større enn `μ₀`?» når `σ` er KJENT. Ensidig høyresidig."
    description: "Ensidig høyresidig test. Forkast hvis Z > +z_α."
    steps:
      - text: "Sett opp hypotesene. Du mistenker at sann μ ligger OVER påstandsverdien (f.eks. ny prosess gir høyere utbytte enn 100 enheter)."
        formula: "H₀: μ ≤ μ₀     mot     H₁: μ > μ₀"
      - "Sjekk forutsetninger: `σ` må være kjent (oppgitt), og enten X normalfordelt eller `n ≥ 30`."
      - text: "Når kan z-test brukes? Sjekk kombinasjonen av `σ` og `n`:"
        cases:
          - when: "`σ` kjent og `n ≥ 30`"
            then: "✓ z-test (CLT gir normalitet)"
          - when: "`σ` kjent og `n < 30` (normalfordeling oppgitt eller antatt)"
            then: "✓ z-test, men skriv at `n < 30` og at du antar normalfordeling"
          - when: "`σ` ukjent og `n ≥ 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test) (`s` estimert fra utvalg krever t-fordeling)"
          - when: "`σ` ukjent og `n < 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test)"
        conditional: true
      - text: "Beregn testobservatoren med formelen:"
        formula: "Z = (X̄ − μ₀) / (σ/√n)"
      - text: "Eksempel med `n = 36`, `σ = 5`, `X̄ = 102`, `μ₀ = 100`. For høyresidig forventes Z positiv."
        formula: "Z = (102 − 100) / (5/√36) = 2 / 0.833 ≈ 2.40"
        example: true
      - text: "Slå opp kritisk verdi `z_α` i **tabell E.4** (Z-kvantiltabell). For `α = 0.05` er `z_0.05 = 1.645`. Forkastningsregel for høyresidig:"
        formula: "Forkast H₀ hvis Z > +z_α"
      - "Sammenlign og konkluder. F.eks. `2.40 > 1.645` ✓ → forkast H₀. Skriv konklusjonen i kontekst: «Tallene tyder på at μ er høyere enn μ₀.»"
      - text: "Alternativt: regn p-verdi. Slå opp `G(z)` i **tabell E.3** (Z-tabell, kumulativ). For høyresidig:"
        formula: "p = P(Z > z) = 1 − G(z)"
        conditional: true
      - { text: "Forkast hvis `p < α`.", conditional: true }

  - label: "H₁: μ ≠ μ₀ (tosidig)"
    recognition: "«Avviker gjennomsnittet fra `μ₀`?» når `σ` er KJENT (oppgitt eksplisitt, ikke estimert)."
    description: "Tosidig test. Forkast hvis |Z| > z_(α/2)."
    steps:
      - text: "Sett opp hypotesene. Du mistenker at sann μ er FORSKJELLIG fra påstandsverdien, uten retningshypotese (f.eks. maskinen avviker fra mål 100 mm)."
        formula: "H₀: μ = μ₀     mot     H₁: μ ≠ μ₀"
      - "Sjekk forutsetninger: `σ` må være kjent (oppgitt), og enten X normalfordelt eller `n ≥ 30`."
      - text: "Når kan z-test brukes? Sjekk kombinasjonen av `σ` og `n`:"
        cases:
          - when: "`σ` kjent og `n ≥ 30`"
            then: "✓ z-test (CLT gir normalitet)"
          - when: "`σ` kjent og `n < 30` (normalfordeling oppgitt eller antatt)"
            then: "✓ z-test, men skriv at `n < 30` og at du antar normalfordeling"
          - when: "`σ` ukjent og `n ≥ 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test) (`s` estimert fra utvalg krever t-fordeling)"
          - when: "`σ` ukjent og `n < 30`"
            then: "✗ z-test — bruk [én-utvalg t-test](/entry/en-utvalg-t-test)"
        conditional: true
      - text: "Beregn testobservatoren med formelen. Fortegnet på Z spiller ingen rolle for tosidig — vi bruker `|Z|`."
        formula: "Z = (X̄ − μ₀) / (σ/√n)"
      - text: "Eksempel med `n = 36`, `σ = 5`, `X̄ = 102`, `μ₀ = 100`."
        formula: "Z = (102 − 100) / (5/√36) ≈ 2.40"
        example: true
      - text: "Slå opp kritisk verdi `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). Del α på TO siden α fordeles på to haler. For `α = 0.05` er `z_0.025 = 1.96` (IKKE `z_0.05 = 1.645`)."
        formula: "Forkast H₀ hvis |Z| > z_(α/2)"
      - "Sammenlign og konkluder. F.eks. `|2.40| = 2.40 > 1.96` ✓ → forkast H₀. Skriv konklusjonen i kontekst: «Tallene tyder på at μ avviker fra μ₀.»"
      - text: "Alternativt: regn p-verdi. Slå opp `G(|z|)` i **tabell E.3** (Z-tabell, kumulativ). For tosidig:"
        formula: "p = 2 · P(Z > |z|) = 2 · (1 − G(|z|))"
        conditional: true
      - { text: "Forkast hvis `p < α`.", conditional: true }

common_traps: |
  - **Ensidig vs. tosidig**: Hvis `H₁` er "mindre enn" eller "større enn", er testen ensidig (bruk `z_α`). Hvis `H₁` er "forskjellig fra", er den tosidig (bruk `z_(α/2)`).
  - **Fortegn på sjekkverdi**: For venstresidig test (`μ < μ₀`) er sjekkverdien `−z_α` (negativ), ikke `+z_α`. Forkast hvis `z < −z_α`.
  - **`z_α` vs. `z_(α/2)`**: Vanlig feil å bruke `z_α` også for tosidig test. For tosidig MÅ du bruke `z_(α/2)` (halvdelen av `α` i hver hale).
  - **`σ` vs. `s`**: Hvis `σ` ikke er oppgitt og du må regne `s²` fra dataene, er det t-test du skal bruke, ikke z-test.
  - **Konklusjonen tilbake til kontekst**: "Forkast `H₀`" er ikke nok. Si hva det betyr: "Det er grunn til å hevde at den nye produkten har lavere energiforbruk."

python_snippet: |
  from scipy.stats import norm
  import math

  x_bar, mu0, sigma, n, alpha = 48, 50, 5, 40, 0.05
  z = (x_bar - mu0) / (sigma / math.sqrt(n))   # -2.53

  # Venstresidig: forkast hvis z < -z_alpha
  z_alpha = norm.ppf(1 - alpha)                # 1.645
  reject = z < -z_alpha                        # True

  # p-verdi (venstresidig)
  p_value = norm.cdf(z)                        # 0.0057

detailed_solution_variants:
  - label: "H₁: μ < μ₀ (venstre)"
    solutions:
      - source: "Eksamen jan25 · oppgave 6c"
        question: "Forventet forbruk på standardmodellen er `μ₀ = 50 W`. Et utvalg på `n = 40` målinger av ny julelys gir `x̄ = 48 W`, og `σ = 5 W` antas kjent. Test H₀: μ ≥ 50 mot H₁: μ < 50 på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 40`, `x̄ = 48`, `σ = 5` (kjent), `μ₀ = 50`, `α = 0.05`." }
              - { text: "Z-test forutsetter kjent populasjonsstandardavvik σ — oppgaven oppgir dette eksplisitt." }
              - { text: "Med `n = 40 ≥ 30` gir sentralgrenseteoremet at X̄ er tilnærmet normalfordelt." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ ≥ 50 W (ny julelys er IKKE bedre enn standard)" }
              - { text: "H₁: μ < 50 W (ny julelys bruker mindre energi — venstresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (48 − 50) / (5/√40)`" }
              - { indent: "= `−2 / 0.7906`" }
              - { indent: "= `−2.53`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{0.05} = 1.645 → kritisk grense for venstresidig test er `−z_{0.05} = −1.645`. Forkast H₀ hvis `z < −1.645`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `z = −2.53 < −1.645` ✓" }
              - { text: "Beslutning: Forkast H₀ på signifikansnivå `α = 0.05`." }
              - { text: "Tolkning: Tallene gir grunn til å hevde at ny julelys har lavere forventet energiforbruk enn standardmodellen på 50 W." }
        result: "Forkast H₀. Ny julelys bruker signifikant mindre energi enn 50 W."

      - source: "Eksamen jan22 · oppgave 5a+5b (bensinpumpe, p-verdi)"
        question: "Justervesenet sjekker en bensinpumpe. 10 prøver tappes når telleverket viser 5.00 liter: 4.97, 4.94, 4.96, 4.95, 4.92, 5.00, 5.01, 4.98, 4.99, 5.02. Volumet `X` antas normalfordelt med ukjent `μ` og kjent `σ = 0.04` liter. **a)** Foreta en hypotesetest på `α = 0.05` for å sjekke om forventningsverdien til `X` er mindre enn 5.00. **b)** Finn p-verdien, og avgjør om H₀ ville blitt forkastet ved `α = 0.01`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 10`, `σ = 0.04` (kjent), `μ₀ = 5.00`, `α = 0.05`." }
              - { text: "Z-test fordi `σ` er oppgitt kjent. Normalantakelse er eksplisitt — `n < 30` er ikke et problem siden `X` er antatt normalfordelt." }
              - { text: "Snittet av målingene: `x̄ = (4.97+4.94+4.96+4.95+4.92+5.00+5.01+4.98+4.99+5.02)/10 = 49.74/10 = 4.974`" }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ ≥ 5.00 (pumpa tapper minst 5.00 i snitt — ok)" }
              - { text: "H₁: μ < 5.00 (pumpa tapper for lite — venstresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (4.974 − 5.00) / (0.04/√10)`" }
              - { indent: "= `−0.026 / 0.01265`" }
              - { indent: "= `−2.055 ≈ −2.06`" }
          - label: "a) Konklusjon ved α = 0.05"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{0.05} = 1.645 → kritisk grense `−1.645`. Forkast H₀ hvis `z < −1.645`." } }
              - { text: "`z = −2.06 < −1.645` ✓ → Forkast H₀ på `α = 0.05`." }
              - { text: "Konklusjon: Det er grunn til å tro at forventet tappet volum er mindre enn 5.00 liter." }
          - label: "b) p-verdien"
            lines:
              - { text: "Venstresidig p-verdi: `p = P(Z < −2.06) = G(−2.06)`" }
              - { table_lookup: { ref: "E.3", text: "G(−2.06) ≈ 0.0197 (alternativt 1 − G(2.06) = 1 − 0.9803)" } }
              - { text: "Sammenlign med α = 0.01: `p ≈ 0.020 > 0.01` → IKKE forkast H₀ ved `α = 0.01`." }
              - { comment: "regel: forkast H₀ hvis p ≤ α. Her er p akkurat over 0.01, så ved et strengere nivå holder vi på nullhypotesen." }
        result: "a) Forkast H₀ på `α = 0.05`. b) `p ≈ 0.020`; ved `α = 0.01` ville H₀ IKKE blitt forkastet."

      - source: "Praksis · produsentpåstand om snittvekt"
        question: "En produsent påstår at gjennomsnittsvekten på sjokoladeplater er `μ₀ = 250 g`, og populasjonens standardavvik er `σ = 5 g` (kjent). En kunde mistenker at platene veier mindre. Et utvalg på `n = 25` plater gir `x̄ = 248 g`. Test H₀: μ ≥ 250 mot H₁: μ < 250 på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 25`, `x̄ = 248`, `σ = 5` (kjent), `μ₀ = 250`, `α = 0.05`." }
              - { text: "Z-test forutsetter kjent σ — oppfylt." }
              - { text: "`n = 25 < 30`, men vekt antas tilnærmet normalfordelt, så testen er gyldig." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ ≥ 250 g (produsentens påstand holder)" }
              - { text: "H₁: μ < 250 g (platene veier i snitt mindre — venstresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (248 − 250) / (5/√25)`" }
              - { indent: "= `−2 / 1`" }
              - { indent: "= `−2.00`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{0.05} = 1.645 → kritisk grense `−z_{0.05} = −1.645`. Forkast H₀ hvis `z < −1.645`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `z = −2.00 < −1.645` ✓" }
              - { text: "Beslutning: Forkast H₀ på `α = 0.05`." }
              - { text: "Tolkning: Det er statistisk grunnlag for å hevde at gjennomsnittsvekten er lavere enn produsentens påstand om 250 g." }
        result: "Forkast H₀. Sjokoladeplatene veier i gjennomsnitt mindre enn 250 g."

  - label: "H₁: μ > μ₀ (høyre)"
    solutions:
      - source: "Praksis · maskinkomponenter"
        question: "En maskin produserer komponenter med kjent standardavvik `σ = 0.5 mm`. En ingeniør mistenker at gjennomsnittsstørrelsen overstiger `μ₀ = 10 mm`. Et utvalg på `n = 36` komponenter gir `x̄ = 10.15 mm`. Test H₀: μ ≤ 10 mot H₁: μ > 10 på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 36`, `x̄ = 10.15`, `σ = 0.5` (kjent), `μ₀ = 10`, `α = 0.05`." }
              - { text: "Z-test forutsetter kjent σ — oppfylt." }
              - { text: "`n = 36 ≥ 30` gir tilnærmet normalitet via SGT." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ ≤ 10 mm (komponentene er innenfor mål)" }
              - { text: "H₁: μ > 10 mm (komponentene er for store — høyresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (10.15 − 10) / (0.5/√36)`" }
              - { indent: "= `0.15 / (0.5/6)`" }
              - { indent: "= `0.15 / 0.0833`" }
              - { indent: "= `1.80`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{0.05} = 1.645 → forkastningsregel for høyresidig: forkast H₀ hvis `z > 1.645`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `z = 1.80 > 1.645` ✓" }
              - { text: "Beslutning: Forkast H₀ på `α = 0.05`." }
              - { text: "Tolkning: Det er statistisk grunnlag for å hevde at maskinen produserer komponenter med snittstørrelse over 10 mm — kalibrering bør vurderes." }
        result: "Forkast H₀. Maskinen produserer komponenter med snittstørrelse signifikant over 10 mm."

      - source: "Praksis · medikamentstudie"
        question: "En forsker tester om et nytt medikament gir høyere snittverdi for en biomarkør enn referanseverdien `μ₀ = 70`. Standardavviket er kjent `σ = 10`. Et utvalg på `n = 49` pasienter gir `x̄ = 73`. Test H₀: μ ≤ 70 mot H₁: μ > 70 på `α = 0.01`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 49`, `x̄ = 73`, `σ = 10` (kjent), `μ₀ = 70`, `α = 0.01`." }
              - { text: "Z-test forutsetter kjent σ — oppgitt eksplisitt." }
              - { text: "`n = 49 ≥ 30` gir tilnærmet normalitet." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ ≤ 70 (medikamentet gir ikke høyere biomarkørverdi)" }
              - { text: "H₁: μ > 70 (medikamentet gir høyere verdi — høyresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (73 − 70) / (10/√49)`" }
              - { indent: "= `3 / (10/7)`" }
              - { indent: "= `3 / 1.4286`" }
              - { indent: "= `2.10`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{0.01} = 2.326 → forkastningsregel: forkast H₀ hvis `z > 2.326`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `z = 2.10` er IKKE `> 2.326`." }
              - { text: "Beslutning: Vi kan IKKE forkaste H₀ på `α = 0.01`." }
              - { text: "Tolkning: På et strengt 1 %-nivå er det ikke tilstrekkelig bevis for at medikamentet hever biomarkørverdien. (Merk: på `α = 0.05` ville H₀ blitt forkastet.)" }
        result: "Behold H₀. Ikke nok statistisk bevis på `α = 0.01` for at medikamentet hever snittverdien."

  - label: "H₁: μ ≠ μ₀ (tosidig)"
    solutions:
      - source: "Praksis · kvalitetskontroll på flaskefylling"
        question: "En tappemaskin skal fylle flasker med `μ₀ = 500 ml`. Standardavviket er kjent `σ = 4 ml`. Kvalitetsavdelingen ønsker å undersøke om maskinen avviker fra mål (over eller under). Et utvalg på `n = 25` flasker gir `x̄ = 502 ml`. Test H₀: μ = 500 mot H₁: μ ≠ 500 på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 25`, `x̄ = 502`, `σ = 4` (kjent), `μ₀ = 500`, `α = 0.05`." }
              - { text: "Z-test forutsetter kjent σ — oppfylt." }
              - { text: "Fyllvolum antas normalfordelt, så `n = 25` er tilstrekkelig." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ = 500 ml (maskinen fyller riktig)" }
              - { text: "H₁: μ ≠ 500 ml (maskinen avviker — tosidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (502 − 500) / (4/√25)`" }
              - { indent: "= `2 / (4/5)`" }
              - { indent: "= `2 / 0.8`" }
              - { indent: "= `2.50`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "Tosidig på `α = 0.05` → bruk `z_{α/2} = z_{0.025} = 1.96`. Forkastningsregel: forkast H₀ hvis `|z| > 1.96`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `|z| = 2.50 > 1.96` ✓" }
              - { text: "Beslutning: Forkast H₀ på `α = 0.05`." }
              - { text: "Tolkning: Maskinen avviker signifikant fra målverdien 500 ml — fyller i snitt for mye. Kalibrering anbefales." }
        result: "Forkast H₀. Tappemaskinen avviker fra 500 ml-målet."

      - source: "Praksis · kalibreringssjekk på vekt"
        question: "En laboratorievekt skal vise `μ₀ = 100 g` for et standardlodd. Standardavviket er kjent `σ = 0.2 g`. En tekniker ønsker å sjekke om vekta er kalibrert (avvik i begge retninger er problematisk). Et utvalg på `n = 16` veiinger gir `x̄ = 99.85 g`. Test H₀: μ = 100 mot H₁: μ ≠ 100 på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 16`, `x̄ = 99.85`, `σ = 0.2` (kjent), `μ₀ = 100`, `α = 0.05`." }
              - { text: "Z-test forutsetter kjent σ — oppfylt." }
              - { text: "`n = 16 < 30`, men måleavlesninger antas normalfordelt, så testen er gyldig." }
          - label: "Hypoteser"
            lines:
              - { text: "H₀: μ = 100 g (vekta er kalibrert)" }
              - { text: "H₁: μ ≠ 100 g (vekta er ute av kalibrering — tosidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `Z = (x̄ − μ₀) / (σ/√n)`" }
              - { text: "Innsatt: `z = (99.85 − 100) / (0.2/√16)`" }
              - { indent: "= `−0.15 / (0.2/4)`" }
              - { indent: "= `−0.15 / 0.05`" }
              - { indent: "= `−3.00`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "Tosidig på `α = 0.05` → `z_{α/2} = z_{0.025} = 1.96`. Forkastningsregel: forkast H₀ hvis `|z| > 1.96`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenligning: `|z| = 3.00 > 1.96` ✓" }
              - { text: "Beslutning: Forkast H₀ på `α = 0.05`." }
              - { text: "Tolkning: Vekta avviker signifikant fra standardloddet på 100 g — den viser systematisk for lite og må kalibreres på nytt." }
        result: "Forkast H₀. Vekta er ute av kalibrering og må justeres."

