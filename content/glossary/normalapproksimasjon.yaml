id: normalapproksimasjon
term_no: Normalapproksimasjon
short_def: "Tilnærming der en diskret fordeling (binomial, poisson) byttes ut med en normalfordeling."
filters:
  distribution_assumption: [normal, binomial, poisson]
  tooling: [standard_normal_table_E3]
  parameters_known: [sample_size_large]
long_def: |
  **Binomial:** hvis `n·p·(1−p) ≥ 5`, så

      X ≈ N(np, √(np(1−p)))

  **Poisson:** hvis `λ` er stor (typisk `λ ≥ 10`), så

      Y ≈ N(λ, √λ)

  Normalapproksimasjon er drivkraften bak z-test og KI for andel og for
  poissonrate. Tommelfingerregel for andel-KI: bruk `p̂` i stedet for `p`
  i sjekken:

      n · p̂ · (1 − p̂) ≥ 5
aliases:
  - normalapproksimasjon
  - normalapproksimasjonen
  - normaltilnærming
  - normaltilnærmingen
see_also:
