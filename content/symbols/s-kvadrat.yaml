id: s-kvadrat
sym: "s²"
short_def: "Utvalgsvarians – estimat for populasjonsvariansen σ², regnet ut fra dataene dine."
contexts:
  - usage: "Utvalgsvarians"
    detail: |
      s² er bare s opphøyd i andre – utvalgsstandardavviket i
      kvadrert form. Hvor s sier 'typisk avvik fra gjennomsnittet',
      sier s² 'gjennomsnittlig kvadrert avvik'.

      Formel: s² = Σ(xᵢ − x̄)² / (n − 1)

      Igjen med n − 1 (Bessels korreksjon) for at s² skal være
      forventningsrett estimat for σ².

      Hvorfor kvadrert form i det hele tatt? Mange teoretiske
      formler er enklere i s² enn i s. For eksempel: konfidensintervall
      og test for σ² bygger på at (n−1)s²/σ² ~ χ²(n−1).

      Pass på enheter: hvis x er målt i kr, er s² i kr² – derfor
      tas roten til slutt så vi får tilbake kr (det er s).
    entry_refs:
      - ki-varians
      - en-utvalg-t-test
      - to-utvalgs-t-test
      - regresjon-residualvarians
