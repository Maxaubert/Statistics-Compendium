id: sigma-kvadrat
sym: "σ²"
short_def: "Populasjonsvarians – gjennomsnittlig kvadrert avvik fra μ. Standardavviket σ i kvadrert form."
contexts:
  - usage: "Populasjonsvarians"
    detail: |
      σ² måler spredning, akkurat som σ, men i kvadrerte enheter.
      Hvor σ sier 'typisk avvik fra μ', sier σ² 'gjennomsnittet av
      kvadrerte avvik'.

      Definisjon: σ² = E[(X − μ)²]

      Hvorfor kvadrert? To grunner: (1) det fjerner fortegn (negative
      og positive avvik teller likt), og (2) varianser er enklere å
      regne med – for uavhengige variabler gjelder Var(X + Y) = σ²ₓ + σ²ᵧ
      (man kan IKKE legge sammen standardavvik på samme måte).

      Pass på enheter: hvis X er i kr, er σ² i kr² – det blir litt
      rart å tolke direkte. Derfor tar man ofte roten til slutt og
      ender på σ.

      σ² estimeres fra utvalg som s². Sjelden kjent direkte.
    entry_refs:
      - varians-standardavvik-diskret
      - sum-uavhengige-normaler
      - ki-varians
      - normalfordeling
