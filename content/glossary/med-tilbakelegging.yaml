id: med-tilbakelegging
term_no: Med tilbakelegging
short_def: "Du putter trekningen tilbake før neste — hver trekning er uavhengig og har samme sannsynlighet."
filters:
  setup: [with_replacement, fixed_n_trials]
  distribution_assumption: [binomial]
  structural_cues: [independent_events, two_outcomes_per_trial]
  computes: [exact_probability]
  parameters_known: [success_p]
long_def: |
  Klassisk eksempel: trekke kuler fra en urne og legge dem tilbake mellom
  hver trekning. Hver trekning er uavhengig, og `p` forblir konstant.

  - **Med tilbakelegging:** binomialfordeling for antall suksesser i `n` trekninger
  - **Uten tilbakelegging:** hypergeometrisk fordeling

  Sjekk derfor alltid om oppgaven sier "med" eller "uten" tilbakelegging.
aliases:
  - med tilbakelegging
  - tilbakelegging
  - tilbakeleggingen
  - tilbakeleggingene
see_also:
  - { id: binomial-fordeling, kind: entry }
  - { id: uten-tilbakelegging-glos, kind: glossary }
  - { id: hypergeometrisk-fordeling, kind: entry }
