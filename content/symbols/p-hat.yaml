id: p-hat
sym: "p̂"
short_def: "Utvalgsandel — estimat for populasjonsandelen p, regnet som antall suksesser delt på antall forsøk."
contexts:
  - usage: "Utvalgsandel"
    detail: |
      Hatten betyr 'estimat fra utvalg'. Mens p er den sanne, ukjente
      andelen i populasjonen, er p̂ tallet du faktisk regner ut fra
      dine data: p̂ = X / n, der X er antall suksesser og n er
      utvalgsstørrelsen.

      Eksempel: spør du 200 personer og 64 svarer 'ja', blir
      p̂ = 64/200 = 0.32.

      p̂ er en tilfeldig variabel (varierer fra utvalg til utvalg)
      med E[p̂] = p og Var(p̂) = p(1−p)/n. For store n er p̂ tilnærmet
      normalfordelt — det er grunnlaget for z-tester på andel.

      Ikke å forveksle med p (uten hatt) som er den sanne andelen,
      eller med p-verdi (helt annet konsept).
    entry_refs:
      - en-utvalg-z-test-andel
      - ki-andel-binomial
see_also:
  - { id: punktestimat, kind: glossary }
