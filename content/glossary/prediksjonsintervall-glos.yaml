id: prediksjonsintervall-glos
term_no: Prediksjonsintervall
short_def: "Intervall for hvor en NY enkeltobservasjon vil ligge — bredere enn et KI."
filters:
  computes: [prediction_interval]
  setup: [linear_relationship]
  parameters_known: [confidence_level]
long_def: |
  - **Konfidensintervall:** for en parameter (f.eks. `μ`)
  - **Prediksjonsintervall:** for en framtidig enkelt-`Y`

  Prediksjonsintervallet er bredere fordi det må fange både usikkerheten
  i estimatet **og** den naturlige spredningen i `Y`.
see_also:
  - { id: regresjon-prediksjonsintervall, kind: entry }
