id: observatortest
term_no: Testobservator
short_def: "Tallet du regner ut fra dataene og sammenligner mot tabell — typisk `Z`, `T` eller `χ²`."
filters:
  computes: [hypothesis_test]
  distribution_assumption: [normal, t_distribution, chi_squared]
  random_variable: [mean_of_samples]
  setup: [single_population]
  structural_cues: [more_than_two_categories, one_sided_alternative, two_sided_alternative]
  parameters_known: [sample_size_small_lt30, population_variance_unknown, population_variance_known]
long_def: |
  Testobservatoren standardiserer dataene under `H₀` slik at du kan slå opp
  i en tabell. Sammenlign `|observator|` mot kritisk verdi.

  **Z-test:**

      Z = (X̄ − μ₀) / (σ/√n)

  **T-test** (bytt σ med s):

      T = (X̄ − μ₀) / (s/√n)

  **Kjikvadrat:**

      χ² = Σ (O − E)² / E
see_also:
  - { id: en-utvalg-z-test, kind: entry }
  - { id: en-utvalg-t-test, kind: entry }
  - { id: kjikvadrat-goodness-of-fit, kind: entry }
