id: sigma-kvadrat
term_no: Sigma-kvadrat (σ²)
short_def: "Populasjonsvariansen — forventet kvadrert avvik fra `μ`."
filters:
  parameters_known: [population_variance_known, population_variance_unknown, confidence_level]
  computes: [std_dev, confidence_interval]
  distribution_assumption: [chi_squared]
  tooling: [chi_square_quantile_table_E6]
aliases:
  - σ²
  - sigma-kvadrat
  - populasjonsvarians
  - populasjonsvariansen
long_def: |
  Definisjon:

      σ² = Var(X) = E[(X − μ)²]

  - **Estimat:** utvalgsvariansen `S²`, der vi deler på `(n − 1)`, ikke `n`.
  - **KI for σ²:** bruker kjikvadrat-fordeling med `n − 1` frihetsgrader.
  - **Sammenheng med σ:** standardavviket `σ = √σ²`.
  - **Sum av uavhengige:**

        Var(X + Y) = σ²_X + σ²_Y
see_also:
  - { id: varians, kind: glossary }
  - { id: sigma, kind: glossary }
  - { id: ki-varians, kind: entry }
