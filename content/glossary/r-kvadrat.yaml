id: r-kvadrat
term_no: R² (forklaringsgrad, determinasjonskoeffisient)
short_def: "Andelen av variasjonen i Y som forklares av X i regresjonsmodellen – mellom 0 og 1."
aliases:
  - R²
  - r²
  - forklaringsgrad
  - determinasjonskoeffisient
long_def: |
  R² = 1 − SSE/SST, der SST er total variasjon i Y og SSE er residualenes
  variasjon. R² = 0.80 betyr at modellen forklarer 80 % av variasjonen.
  For enkel lineær regresjon: R² = r² (kvadratet av Pearson-korrelasjonen).
  Høy R² gir ikke automatisk en god modell – sjekk også residualplott.
