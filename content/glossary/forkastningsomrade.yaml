id: forkastningsomrade
term_no: Forkastningsområde
short_def: "Settet av testobservator-verdier som fører til at `H₀` forkastes."
filters:
  computes: [hypothesis_test]
  parameters_known: [alpha_significance]
  distribution_assumption: [normal, chi_squared, t_distribution]
  tooling: [t_quantile_table_E5, normal_quantile_table_E4, chi_square_quantile_table_E6]
  structural_cues: [one_sided_alternative, two_sided_alternative]
long_def: |
  Forkastningsområdet ligger i halene av fordelingen til testobservatoren
  under `H₀`:

  **Høyresidig:**

      T > kritisk verdi

  **Venstresidig:**

      T < −kritisk verdi

  **Tosidig** (bruk `α/2` i hver hale):

      |T| > kritisk verdi
see_also:
  - { id: en-utvalg-z-test, kind: entry }
  - { id: signifikansniva-glos, kind: glossary }
