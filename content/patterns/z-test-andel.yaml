id: z-test-andel
name_no: "Test om p = p₀, stort n"
cue: "Oppgaven handler om en ANDEL eller suksessrate (ikke gjennomsnitt), og du har observert X suksesser i n forsøk. Spørsmålet er om andelen er forskjellig fra (eller større/mindre enn) en gitt p₀. Utvalget er stort nok til at normalapproksimasjon gjelder."
procedure:
  - "Sjekk at n·p₀ ≥ 5 og n·(1 − p₀) ≥ 5 (normalapproksimasjon gyldig)"
  - "Sett opp H₀: p = p₀ og H₁ (ensidig eller tosidig)"
  - "Regn testobservatoren Z = (X − n·p₀) / √(n·p₀·(1 − p₀))"
  - "Slå opp kritisk verdi i standardnormaltabell (95 % tosidig → 1.96; 95 % ensidig → 1.645)"
  - "Forkast H₀ hvis |Z| ≥ kritisk verdi (tosidig) eller Z er i forkastningsområdet (ensidig)"
  - "Alternativt: regn p-verdi fra Φ(Z)"
entry_refs:
  - en-utvalg-z-test-andel
example: "H₀: p = 0.5, H₁: p ≠ 0.5. n = 200, X = 115. Z = (115 − 100) / √(200·0.5·0.5) = 15/√50 ≈ 2.12. |Z| > 1.96 → forkast H₀."
