id: varians-standardavvik-diskret
name_no: "Varians og standardavvik (diskret stokastisk variabel)"
type: identity
category: distribution_property
tagline: "Var(X) = Σ (x − μ)²·P(X = x); σ = √Var(X). Vektet sum av kvadrerte avvik fra forventningsverdien."

formula_main: "Var(X) = Σ (x_i − μ)² · P(X = x_i);  σ = √Var(X)"
formula_latex: "\\text{Var}(X) = \\sum_i (x_i - \\mu)^2 \\cdot P(X = x_i)"

what_it_does: |
  Beregner variansen og standardavviket til en diskret stokastisk variabel.
  Variansen er forventet kvadratavvik fra μ; standardavviket σ er
  kvadratroten og er målt i samme enhet som X.

  Praktisk metode: regn ut `μ = E[X]` først, så for hver mulig verdi:
  trekk fra `μ`, kvadrér, multiplisér med sannsynligheten, og summér.
  Samme stil som du bruker for utvalgsvarians fra rådata, bare med
  `P(X = x)` som vekt i stedet for `1/(n−1)`.

why_use: |
  Mål for spredning. Inngår i nesten all videre statistisk inferens
  (z-test, t-test, KI, kovarians, korrelasjon).

recognition_cues:
  - "Diskret stokastisk variabel med kjent sannsynlighetsfordeling"
  - "Spørsmålet ber om Var(X), σ², σ, eller standardavviket"

when_NOT_to_use:
  - "X er kontinuerlig → bruk integralet `Var(X) = ∫ (x − μ)² · f(x) dx`"
  - "Du har kun rådata uten fordeling → bruk utvalgsvariansen `s² = Σ(x_i − x̄)² / (n − 1)`"

symbols:
  - { sym: "Var(X), σ²", means: "variansen" }
  - { sym: "σ",          means: "standardavviket, σ = √Var(X)" }
  - { sym: "μ",          means: "forventningsverdien E[X]" }
  - { sym: "E[X²]",      means: "Σ x_i² · P(X = x_i)" }

filters:
  computes: [std_dev]
  random_variable: [discrete_count]
  setup: [single_population, joint_table_given]
  structural_cues: [joint_table_present, summary_stats_given]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]

solution_template:
  - "Bekreft at du har `μ = E[X]` (regn det ut først hvis ikke gitt)"
  - "Skriv ut alle leddene: `(x_1 − μ)²·P(X=x_1) + (x_2 − μ)²·P(X=x_2) + ...`"
  - "Regn hvert ledd: avvik først, så kvadrér, så multiplisér med sannsynligheten"
  - "Summér: `Var(X) = Σ (x_i − μ)² · P(X = x_i)`"
  - "Standardavviket: `σ = √Var(X)`"
  - text: "Snarvei for uniform fordeling (alle P like): `Var(X) = E[X²] − μ²` der `E[X²] = Σ x_i²·P(X=x_i)`. Færre kvadreringer når sannsynlighetene er like."
    conditional: true

common_traps: |
  - **Pass på fortegnet i avviket** — `(x − μ)` kan være negativt, men
    `(x − μ)²` er alltid positivt. Negativ varians er regnefeil.
  - **Rekkefølgen er likegyldig** for kvadratavviket: `(x − μ)²` og
    `(μ − x)²` gir samme tall. Skriv slik du foretrekker.
  - **Vekten er sannsynligheten**, ikke `1/n`. Den FORSKJELLEN fra
    rådata-utvalgsvariansen er det viktigste å huske: PMF gir
    `Σ(x − μ)²·P`, rådata gir `Σ(x − x̄)²/(n − 1)`.

detailed_solution_variants:
  - label: "Varians og standardavvik (diskret SV)"
    solutions:
      - source: "Eksamen jan25 · oppgave 2c"
        question: "X tar verdier {−2, −1, 0, 1, 2} med sannsynligheter {0.3, 0.2, 0.2, 0.1, 0.2}, og `μ = −0.3`. Finn `Var(X)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`P(X=−2) = 0.3`, `P(X=−1) = 0.2`, `P(X=0) = 0.2`, `P(X=1) = 0.1`, `P(X=2) = 0.2`. Summen er 1 ✓" }
              - { text: "`μ = −0.3` (oppgitt eller regnet ut tidligere)." }
          - label: "Var(X) direkte"
            lines:
              - { text: "`Var(X) = Σ (x_i − μ)² · P(X = x_i)`" }
              - { indent: "`= (−2 − (−0.3))²·0.3 + (−1 − (−0.3))²·0.2 + (0 − (−0.3))²·0.2 + (1 − (−0.3))²·0.1 + (2 − (−0.3))²·0.2`" }
              - { indent: "`= (−1.7)²·0.3 + (−0.7)²·0.2 + (0.3)²·0.2 + (1.3)²·0.1 + (2.3)²·0.2`" }
              - { indent: "`= 2.89·0.3 + 0.49·0.2 + 0.09·0.2 + 1.69·0.1 + 5.29·0.2`" }
              - { indent: "`= 0.867 + 0.098 + 0.018 + 0.169 + 1.058 = 2.21`" }
          - label: "Standardavvik"
            lines:
              - { text: "`σ = √Var(X) = √2.21 ≈ 1.487`" }
        result: "Var(X) = 2.21,  σ ≈ 1.487"

      - source: "Øving 4 · oppgave 2a-stil (terning, uniform fordeling)"
        question: "Rettferdig terning: X ∈ {1, 2, 3, 4, 5, 6} med `P(X = x) = ⅙`. Tidligere fant vi `μ = 3.5`. Finn `Var(X)` og `σ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Uniform PMF — alle sannsynligheter er like (`⅙`)." }
              - { text: "`μ = E[X] = ⅙·(1+2+3+4+5+6) = 3.5`" }
          - label: "Var(X) direkte"
            lines:
              - { text: "`Var(X) = Σ (x_i − μ)² · ⅙`" }
              - { indent: "`= ⅙·((1−3.5)² + (2−3.5)² + (3−3.5)² + (4−3.5)² + (5−3.5)² + (6−3.5)²)`" }
              - { indent: "`= ⅙·(6.25 + 2.25 + 0.25 + 0.25 + 2.25 + 6.25)`" }
              - { indent: "`= ⅙·17.5 ≈ 2.92`" }
          - label: "Standardavvik"
            lines:
              - { text: "`σ = √2.92 ≈ 1.71`" }
              - { comment: "Ved uniform PMF kan du forenkle til ⅙·Σ(x − μ)² siden vekten er konstant." }
        result: "Var(X) ≈ 2.92,  σ ≈ 1.71"

      - source: "Praksis · lineær transformasjon `Var(aX+b) = a²·Var(X)`"
        question: "La X ta verdier `{0, 1, 2, 3}` med `p = {0.1, 0.3, 0.4, 0.2}` og `μ = 1.7`. Definer `Y = 2X + 5`. Finn `Var(Y)` og verifiser regelen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`Y = 2X + 5` tar verdier `{5, 7, 9, 11}` med samme sannsynligheter." }
              - { text: "Påstand: `Var(aX + b) = a²·Var(X)`, så `Var(Y) = 4·Var(X)`." }
          - label: "Var(X) direkte"
            lines:
              - { text: "`Var(X) = (0 − 1.7)²·0.1 + (1 − 1.7)²·0.3 + (2 − 1.7)²·0.4 + (3 − 1.7)²·0.2`" }
              - { indent: "`= 2.89·0.1 + 0.49·0.3 + 0.09·0.4 + 1.69·0.2`" }
              - { indent: "`= 0.289 + 0.147 + 0.036 + 0.338 = 0.81`" }
          - label: "Var(Y) direkte"
            lines:
              - { text: "`μ_Y = E[Y] = 2·1.7 + 5 = 8.4` (lineæritet)" }
              - { text: "`Var(Y) = (5 − 8.4)²·0.1 + (7 − 8.4)²·0.3 + (9 − 8.4)²·0.4 + (11 − 8.4)²·0.2`" }
              - { indent: "`= 11.56·0.1 + 1.96·0.3 + 0.36·0.4 + 6.76·0.2`" }
              - { indent: "`= 1.156 + 0.588 + 0.144 + 1.352 = 3.24`" }
          - label: "Verifiser regelen"
            lines:
              - { text: "`a²·Var(X) = 2²·0.81 = 3.24` ✓" }
              - { text: "`σ_Y = √3.24 = 1.8 = 2·0.9 = a·σ_X` ✓" }
              - { comment: "Konstantleddet b = 5 forskyver fordelingen, men endrer ikke spredningen." }
        result: "Var(Y) = 3.24,  σ_Y = 1.8"

