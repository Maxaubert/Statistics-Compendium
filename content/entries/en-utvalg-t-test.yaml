        question: "Et instrument skal i kalibrering gi gjennomsnitt `μ₀ = 10`. Et utvalg på `n = 20` målinger gir `x̄ = 10.4` og `s = 0.8`. Test om `μ ≠ 10` på `α = 0.05`."
