id: pearson-korrelasjon
term_no: "Pearson-korrelasjon (r)"
short_def: "Mål på lineær samvariasjon mellom to variabler — verdi mellom `−1` og `1`."
filters:
  computes: [correlation, covariance]
  setup: [linear_relationship]
  structural_cues: [linear_relationship_suspected, summary_stats_given, data_as_list]
  parameters_known: [sum_xx_sxy]
aliases:
  - pearson-korrelasjon
  - pearson-korrelasjonen
  - pearson-korrelasjonskoeffisient
  - pearson-korrelasjonskoeffisienten
  - korrelasjonskoeffisient
  - korrelasjonskoeffisienten
long_def: |
  To formler — samme tall, ulike datatyper.

  **Fra rådata-par (regresjons-konteksten):**

      r = S_XY / √(S_XX · S_YY)

  der `S_XX = Σ(x_i − x̄)²`, `S_YY = Σ(y_i − ȳ)²`, `S_XY = Σ(x_i − x̄)(y_i − ȳ)`.

  **Fra simultanfordeling (joint-konteksten):**

      r = Cov(X, Y) / (σ_X · σ_Y)

  Begge gir samme verdi når dataene er konsistente. Bruk rådata-formelen
  når du har observerte par; bruk joint-formelen når oppgaven gir en PMF
  for `(X, Y)`.

  - `r = 1`: perfekt positiv lineær sammenheng
  - `r = −1`: perfekt negativ
  - `r = 0`: ingen lineær sammenheng (kan likevel finnes ikke-lineær!)

  `r²` er forklaringsgraden i enkel lineær regresjon. Pearson måler kun
  lineære relasjoner og er sårbar for uteliggere — sjekk alltid
  spredningsplottet før du stoler på `r`.
