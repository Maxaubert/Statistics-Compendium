id: sigma
term_no: Sigma (σ)
short_def: "Populasjonens standardavvik — spredningen rundt `μ`, samme enhet som dataene."
filters:
  parameters_known: [population_variance_known]
  computes: [std_dev, hypothesis_test]
  distribution_assumption: [normal]
aliases:
  - σ
  - sigma
long_def: |
  Definisjon:

      σ = √Var(X)

  Standardavviket til populasjonen.

  - **Når `σ` er kjent:** z-test og z-baserte KI.
  - **Når `σ` er ukjent (det vanlige):** bruk `s` (utvalgets standardavvik) og t-fordeling.

  Pass på: stor `Σ` er sumtegn, liten `σ` er standardavvik — to helt
  forskjellige ting.
see_also:
  - { id: standardavvik, kind: glossary }
  - { id: sigma-kvadrat, kind: glossary }
  - { id: ki-mu-og-varians, kind: entry }
  - { id: en-utvalg-z-test, kind: entry }
