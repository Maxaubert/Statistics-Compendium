id: bootstrapping
name_no: "Bootstrapping"
type: method
tagline: "Resample med tilbakelegging fra dataene for å estimere usikkerhet uten å anta normalfordeling."

what_it_means: |
  Bootstrapping estimerer usikkerheten i en statistikk (typisk gjennomsnitt
  eller median) ved å trekke nye «utvalg» fra de observasjonene du har —
  med tilbakelegging — og se hvor mye statistikken varierer mellom
  resamplene. Brukes når dataene er for få eller for skjevtfordelte til at
  sentralgrenseteoremet kan anvendes.

  Kjerneidé: behandle ditt utvalg som om det var populasjonen, og bruk
  kjent sampling-statistikk på det.

symbols:
  - { sym: "N",          means: "antall observasjoner i opprinnelig utvalg" }
  - { sym: "B",          means: "antall bootstrap-resamples (typisk 999 eller 1000)" }
  - { sym: "x̄*",        means: "gjennomsnittet for ETT bootstrap-resample" }
  - { sym: "SE_boot",    means: "standardfeilen estimert fra bootstrap: utvalgsstandardavviket av de `B` x̄*-verdiene" }
  - { sym: "α",          means: "signifikansnivå (typisk 0.05 for 95 %-KI)" }
  - { sym: "z_(α/2)",    means: "kritisk z-verdi fra tabell E.4 for normaltilnærmet bootstrap-KI" }
  - { sym: "P_q",        means: "q-prosentilen av de `B` bootstrap-statistikkene (f.eks. `P_2.5`)" }

solution_variants:
  - label: "Tradisjonelt bootstrap-KI"
    recognition: "«Lag et bootstrap-KI for `μ` (eller `σ`, median, ...)», «kvantifiser usikkerheten uten å anta normalfordeling». Du har et lite datasett og vil estimere et intervall fra resamplinger."
    steps:
      - "Behandle de `N` observasjonene som om de var «populasjonen»."
      - "Trekk et tilfeldig utvalg på `N` elementer MED TILBAKELEGGING (samme observasjon kan trekkes flere ganger)."
      - "Beregn statistikken (f.eks. gjennomsnitt) for dette resamplet og lagre verdien."
      - "Gjenta steg 2–3 mange ganger — typisk 999 eller 1000."
      - "Beregn standardfeilen som utvalgsstandardavviket av de 999 bootstrap-statistikkene: `SE` = std-av-bootstrap-snittene."
      - text: "Lag KI. Antar at bootstrap-fordelingen er tilnærmet normal. Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell)."
        formula: "x̄ ± z_(α/2) · SE"
      - text: "Eksempel: ventetider på legekontor, `x̄ = 14.3` min, bootstrap-`SE = 1.8`, 95 % KI (`z_(0.025) = 1.96`):"
        formula: "14.3 ± 1.96 · 1.8 = [10.77, 17.83]"
        example: true
      - { text: "Sjekk bootstrap-fordelingen før du bruker normaltilnærmingen — er den skjev eller har tunge haler, bruk prosentilintervall i stedet.", conditional: true }
  - label: "Prosentilintervall"
    recognition: "«Lag et 95 % prosentilintervall fra bootstrap-fordelingen». Tar 2.5- og 97.5-percentilene av de resamplede statistikkene — bra for skjeve fordelinger."
    steps:
      - "Behandle de `N` observasjonene som om de var «populasjonen»."
      - "Trekk et tilfeldig utvalg på `N` elementer MED TILBAKELEGGING."
      - "Beregn statistikken (f.eks. gjennomsnitt) for dette resamplet og lagre verdien."
      - "Gjenta steg 2–3 mange ganger — typisk 999 eller 1000."
      - "Sorter de 999 bootstrap-statistikkene fra minst til størst."
      - "For 95 % KI: ta verdi nummer 25 (≈ 2.5-prosentilen) som nedre grense og verdi nummer 975 (≈ 97.5-prosentilen) som øvre grense."
      - { text: "Antar ingenting om at fordelingen er symmetrisk eller normal — egnet når bootstrap-fordelingen er skjev eller har tunge haler.", conditional: true }

common_traps: |
  **Forutsetning som ofte glemmes:** at de opprinnelige observasjonene er
  representative for populasjonen. Bootstrap «lager ikke noe ut av
  ingenting» — det estimerer bare usikkerhet, ikke korriger feil i utvalget.

  Ikke forveksle bootstrap-fordelingen (av estimatet `x̄`) med
  populasjonsfordelingen (av enkeltobservasjoner).

python_snippet: |
  import numpy as np
  resamples = np.array([
      np.random.choice(data, size=len(data), replace=True).mean()
      for _ in range(1000)
  ])
  ki_lo, ki_hi = np.percentile(resamples, [2.5, 97.5])

detailed_solution_variants:
  - label: "Tradisjonelt bootstrap-KI"
    solutions:
      - source: "Praksis · ventetid på legekontor"
        question: "12 pasienter rapporterte ventetid i minutter: `[8, 12, 14, 9, 17, 15, 11, 13, 20, 10, 14, 16]`. Bygg et 95 %-bootstrap-KI for gjennomsnittlig ventetid."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`N = 12`, `x̄ = 13.25` min. Datasettet er lite — bootstrap brukes for å unngå antakelser om normalfordeling." }
              - { text: "Vi resampler `B = 999` ganger MED TILBAKELEGGING og lagrer hvert resample-gjennomsnitt." }
          - label: "Bootstrap-fordeling"
            lines:
              - { text: "Anta at de 999 bootstrap-gjennomsnittene har:" }
              - { indent: "`gjennomsnitt ≈ 13.25` (samme som original)" }
              - { indent: "`SE_boot = utvalgsstandardavvik(x̄*) ≈ 1.06`" }
          - label: "Normaltilnærmet KI"
            lines:
              - { text: "`z_(0.025) = 1.96` (fra tabell E.4)" }
              - { table_lookup: { ref: "E.4", text: "z_(0.025) = 1.96" } }
              - { text: "`KI = x̄ ± z·SE_boot = 13.25 ± 1.96 · 1.06`" }
              - { indent: "`= 13.25 ± 2.08`" }
              - { indent: "`= [11.17, 15.33]`" }
          - label: "Tolkning"
            lines:
              - { comment: "95 % konfidens for at sann gjennomsnittlig ventetid ligger mellom 11.2 og 15.3 minutter." }
        result: "`95 %-KI ≈ [11.17, 15.33] min`"

      - source: "Praksis · medianlønn fra skjevt datasett"
        question: "8 personer rapporterer årslønn (i 1000 kr): `[450, 520, 480, 510, 470, 1500, 490, 460]`. En outlier (1500) gjør gjennomsnittet upålitelig. Bygg et 95 %-bootstrap-KI for MEDIANLØNNEN."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Original median: `Q₂ = (480 + 490)/2 = 485`. Outlier (1500) gjør t-basert KI uegnet siden fordelingen er svært skjev." }
              - { text: "Vi resampler `B = 999` ganger MED TILBAKELEGGING og lagrer MEDIANEN av hvert resample." }
          - label: "Bootstrap-fordeling for median"
            lines:
              - { text: "Anta bootstrap-medianene har:" }
              - { indent: "`gjennomsnitt ≈ 485`" }
              - { indent: "`SE_boot ≈ 17`" }
              - { comment: "Lavere SE enn bootstrap-fordelingen for gjennomsnittet ville gitt — medianen er ufølsom for outlieren." }
          - label: "Normaltilnærmet KI (gyldig hvis bootstrap-fordelingen ser normal ut)"
            lines:
              - { text: "`KI = 485 ± 1.96 · 17 ≈ [451.7, 518.3]`" }
          - label: "Sjekk: prosentilintervall som alternativ"
            lines:
              - { text: "Hvis bootstrap-fordelingen er skjev, bruk prosentil-versjonen (se neste fane)." }
        result: "`95 %-bootstrap-KI for medianen ≈ [452, 518] tusen kr/år`"

  - label: "Prosentilintervall"
    solutions:
      - source: "Praksis · ventetid, prosentil-versjon"
        question: "Samme ventetidsdata som over (`[8, 12, 14, 9, 17, 15, 11, 13, 20, 10, 14, 16]`, `N=12`). Bygg 95 %-KI med prosentilmetoden direkte (uten å bruke `SE`)."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Resample `B = 999` ganger MED TILBAKELEGGING. Beregn `x̄*` for hvert." }
              - { text: "Sortér de 999 verdiene fra minst til størst." }
          - label: "Prosentil-grenser for 95 %"
            lines:
              - { text: "`α/2 = 0.025` ⇒ nedre grense er verdi nummer `⌈999 · 0.025⌉ = 25` i sortert rekkefølge." }
              - { text: "`1 − α/2 = 0.975` ⇒ øvre grense er verdi nummer `⌊999 · 0.975⌋ + 1 = 975`." }
              - { text: "Anta sortert bootstrap-fordeling gir:" }
              - { indent: "`P_2.5 ≈ 11.4` (verdi nr. 25)" }
              - { indent: "`P_97.5 ≈ 15.2` (verdi nr. 975)" }
          - label: "Tolkning"
            lines:
              - { comment: "Prosentilmetoden krever IKKE normal bootstrap-fordeling. Tryggere enn ± z·SE når fordelingen er skjev." }
        result: "`95 %-prosentilintervall ≈ [11.4, 15.2] min`"

      - source: "Praksis · median, prosentil-versjon"
        question: "Samme lønnsdata (`[450, 520, 480, 510, 470, 1500, 490, 460]`). Bygg 95 %-prosentil-KI for medianen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`N = 8`, original median = 485. Resample `B = 999` ganger og beregn MEDIAN av hvert resample." }
              - { text: "Bootstrap-fordelingen for median fra et lite skjevt datasett er typisk SKJEV — perfekt for prosentilmetoden." }
          - label: "Prosentil-grenser"
            lines:
              - { text: "Sortér de 999 bootstrap-medianene. Plukk:" }
              - { indent: "`P_2.5 ≈ 465` (verdi nr. 25)" }
              - { indent: "`P_97.5 ≈ 510` (verdi nr. 975)" }
              - { comment: "Intervallet er ASYMMETRISK rundt 485 — det reflekterer skjevheten i bootstrap-fordelingen." }
          - label: "Sammenlign med normaltilnærmet KI"
            lines:
              - { text: "Normaltilnærming ga `[451.7, 518.3]`, prosentil gir `[465, 510]`. Prosentil er strammere og mer realistisk for skjev fordeling." }
        result: "`95 %-prosentil-KI for medianen ≈ [465, 510] tusen kr/år`"

recognition_cues:
  - "Oppgaven sier eksplisitt 'bruk bootstrap' eller 'bootstrap-konfidensintervall'"
  - "Lite utvalg (`n < 30`) og qq-plott eller histogram viser tydelig skjevhet"
  - "Du har rådata, men ingen normalfordelingsantakelse er rimelig"
  - "Python/R-kodebit med `np.random.choice(..., replace=True)` eller `sample(..., replace=TRUE)` er gitt"
  - "Oppgaven spør om standardfeil eller KI for en statistikk uten kjent fordeling (f.eks. median, kvartil)"

when_NOT_to_use:
  - "Dataene ser normalfordelte ut → bruk [KI for μ og σ²](/entry/ki-mu-og-varians) i stedet (z- eller t-basert)"
  - "Du har en andel `X/n` med stort `n` → bruk [KI for andel](/entry/ki-andel-binomial)"

filters:
  computes: [confidence_interval, parameter_estimate, std_dev]
  random_variable: [continuous, mean_of_samples]
  setup: [single_population, with_replacement]
  structural_cues: [data_as_list, summary_stats_given]
  parameters_known: [population_variance_unknown, confidence_level, sample_size_small_lt30]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

