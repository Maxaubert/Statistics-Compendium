id: beta-hat
sym: "β̂"
short_def: "Estimert stigningstall i regresjon — det β-verdien minste kvadraters metode gir deg ut fra dataene."
contexts:
  - usage: "Estimert stigningstall i regresjon"
    detail: |
      Hatten over β betyr 'estimat fra utvalget'. Mens β er den ukjente,
      sanne stigningen i populasjonen, er β̂ tallet du faktisk regner ut
      fra dine målepunkter (xᵢ, yᵢ).

      Formelen: β̂ = Σ(xᵢ − x̄)(yᵢ − ȳ) / Σ(xᵢ − x̄)². Den velger linja
      som minimerer summen av kvadrerte residualer — derfor 'beste' i
      forventningsrett, lineær forstand.

      β̂ brukes både i hypotesetest H₀: β = 0 (er det noen sammenheng?)
      og i konfidensintervall for β. Husk: β̂ er en tilfeldig variabel —
      den varierer fra utvalg til utvalg, og har derfor en standardfeil.

      Ikke bland med β (uten hatt): β er den sanne, ukjente verdien;
      β̂ er ditt punktestimat for den.
    entry_refs:
      - regresjon-estimat-alpha-beta
      - regresjon-test-stigningstall
      - regresjon-standardfeil-stigningstall
see_also:
