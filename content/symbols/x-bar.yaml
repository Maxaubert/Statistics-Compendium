id: x-bar
sym: "X̄"
short_def: "Utvalgsgjennomsnittet — punktestimat for populasjonsgjennomsnittet μ. Det aritmetiske snittet av målingene dine."
contexts:
  - usage: "Utvalgsgjennomsnitt"
    detail: |
      X̄ (les 'x-bar' eller 'x med strek') er det gjennomsnittet du
      regner ut fra dataene dine. Streken over X betyr 'gjennomsnitt'.

      Formel: X̄ = (1/n) · Σxᵢ = (x₁ + x₂ + ... + xₙ) / n

      Eksempel: målte du x₁ = 170, x₂ = 175, x₃ = 165 cm, så er
      X̄ = (170 + 175 + 165)/3 = 170 cm.

      Som tilfeldig variabel har X̄ disse egenskapene:
      - E[X̄] = μ (forventningsrett: i snitt treffer den μ)
      - Var(X̄) = σ²/n (mer data = mindre variabel)
      - Standardfeilen er σ/√n

      Sentralgrenseteoremet sier at X̄ er tilnærmet normalfordelt
      når n er stor — uansett hvordan den underliggende fordelingen
      ser ut. Det er det som gjør z- og t-tester mulige i praksis.

      Pass på: X̄ (utvalgsgjennomsnitt) vs μ (populasjonsgjennomsnitt).
      X̄ er det du regner ut; μ er det du estimerer.
    entry_refs:
      - en-utvalg-z-test
      - en-utvalg-t-test
      - to-utvalgs-t-test
      - ki-mu-kjent-sigma
      - ki-mu-ukjent-sigma
      - sum-uavhengige-normaler
