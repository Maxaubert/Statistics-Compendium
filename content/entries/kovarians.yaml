id: kovarians
name_no: "Kovarians Cov(X,Y)"
type: identity
category: distribution_property
tagline: "Mål for hvor mye to variabler 'beveger seg sammen'."

formula_main: "Cov(X,Y) = E[XY] − μ_X · μ_Y    der    E[XY] = Σ_i Σ_j x_i · y_j · P(X=x_i, Y=y_j)"
formula_latex: "\\begin{gathered} \\text{Cov}(X, Y) = E[XY] - \\mu_X\\,\\mu_Y \\\\[4pt] E[XY] = \\sum_i \\sum_j x_i\\,y_j\\,P(X=x_i,\\,Y=y_j) \\end{gathered}"

what_it_does: |
  Beregner kovariansen mellom to stokastiske variabler X og Y fra en
  simultanfordeling. Positiv kovarians: variablene øker sammen.
  Negativ: når X er stor, er Y typisk liten. Null: ingen lineær sammenheng.

why_use: |
  Mellomberegning for korrelasjon ρ. Også del av variansformelen for
  Var(X+Y) = Var(X) + Var(Y) + 2·Cov(X,Y).

recognition_cues:
  - "Du har en simultanfordeling for X og Y"
  - "Spørsmålet ber om Cov(X,Y) eller du trenger den til ρ"

when_NOT_to_use:
  - "(X, Y) er kontinuerlige → bruk dobbeltintegralet `E[XY] = ∫∫ x·y · f(x, y) dx dy`"
  - "Du har bare rådata-par `(x_i, y_i)` → bruk utvalgskovariansen `s_XY = Σ(x_i − x̄)(y_i − ȳ) / (n − 1)`"
  - "Du vil måle styrken av sammenhengen — bruk korrelasjon `ρ` (skalainvariant), ikke Cov direkte"

symbols:
  - { sym: "Cov(X,Y)", means: "kovariansen" }
  - { sym: "E[XY]",     means: "Σ x_i·y_j·P(X=x_i, Y=y_j) over hele simultantabellen" }
  - { sym: "μ_X, μ_Y",  means: "forventningsverdiene" }

filters:
  computes: [covariance, expected_value, std_dev, test_independence]
  random_variable: [discrete_count]
  setup: [joint_table_given]
  structural_cues: [joint_table_present, summary_stats_given, independent_events]
  parameters_known: [mean_known]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]
solution_template:
  - "Beregn μ_X og μ_Y fra marginalfordelingene"
  - "Beregn E[XY] = Σ_i Σ_j x_i · y_j · P(X=x_i, Y=y_j) – kun celler med positiv sannsynlighet bidrar"
  - "Cov(X,Y) = E[XY] - μ_X·μ_Y"

common_traps: |
  Du kan dropp celler med x_i = 0 eller y_j = 0 (bidraget er null) og
  celler med p = 0. Pass på fortegn – kovarians kan være negativ.

detailed_solution_variants:
  - label: "Kovarians fra simultantabell"
    solutions:
      - source: "Eksamen mai25 · oppgave 1c"
        question: "Gitt simultanfordelingen for `X` og `Y` der `μ_X = 0.6` og `μ_Y = 0.7`. Finn `Cov(X, Y)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Vi har en simultantabell for to diskrete variabler `X ∈ {0, 1}` og `Y ∈ {0, 1, 2}`."
              - text: "Marginalforventningene `μ_X` og `μ_Y` er gitt fra deloppgaver (a) og (b)."
              - text: "Vi skal beregne `Cov(X, Y) = E[XY] − μ_X · μ_Y`."
          - label: "Simultantabellen"
            lines:
              - { text: "Tabellen gir den felles sannsynligheten `P(X = x_i, Y = y_j)` for hver celle:" }
              - { text: "`           Y=0    Y=1    Y=2   |  P(X)`" }
              - { text: "`X=0       0.10   0.20   0.10   |  0.40`" }
              - { text: "`X=1       0.40   0.10   0.10   |  0.60`" }
              - { text: "`P(Y)      0.50   0.30   0.20   |  1.00`" }
              - { comment: "Marginalradene/-kolonnene (sum av rader/kolonner) summerer til 1." }
          - label: "Forventningsverdier (kontroll fra marginalene)"
            lines:
              - text: "`μ_X = 0 · P(X=0) + 1 · P(X=1) = 0 · 0.40 + 1 · 0.60 = 0.60` ✓"
              - text: "`μ_Y = 0 · 0.50 + 1 · 0.30 + 2 · 0.20 = 0 + 0.30 + 0.40 = 0.70` ✓"
          - label: "E[XY] — bruk JOINT-sannsynlighet fra simultantabellen"
            lines:
              - text: "For en generell simultanfordeling må du bruke selve celle-sannsynligheten `P(X=x_i, Y=y_j)`."
              - { text: "`(0, 0):  0 · 0 · 0.10 = 0`" }
              - { text: "`(0, 1):  0 · 1 · 0.20 = 0`" }
              - { text: "`(0, 2):  0 · 2 · 0.10 = 0`" }
              - { text: "`(1, 0):  1 · 0 · 0.40 = 0`" }
              - { text: "`(1, 1):  1 · 1 · 0.10 = 0.10`" }
              - { text: "`(1, 2):  1 · 2 · 0.10 = 0.20`" }
              - { text: "`                  E[XY] = 0.30`" }
              - { comment: "Cellene med `x_i = 0` ELLER `y_j = 0` gir produktet 0 og bidrar ikke. Det er bare de to siste cellene som teller — derfor `0.10 + 0.20`." }
          - label: "Kovarians"
            lines:
              - text: "Sett inn i kovariansformelen:"
              - indent: "`Cov(X, Y) = E[XY] − μ_X · μ_Y`"
              - indent: "`         = 0.30 − 0.60 · 0.70`"
              - indent: "`         = 0.30 − 0.42 = −0.12`"
          - label: "Tolkning"
            lines:
              - text: "`Cov(X, Y) = −0.12 < 0`, så `X` og `Y` er negativt assosierte."
              - text: "Når `X` er stor (`= 1`), har `Y` tendens til å være liten, og omvendt."
              - text: "Sjekk: hadde `X` og `Y` vært uavhengige, ville `E[XY] = μ_X · μ_Y = 0.42` og `Cov = 0`. Avviket `−0.12` viser graden av (negativ) avhengighet."
        result: "`Cov(X, Y) = −0.12`"

      - source: "Praksis · simultanfordeling 2 × 2"
        question: "La `X ∈ {0, 1}` og `Y ∈ {0, 1}` med simultanfordeling `P(0,0) = 0.4`, `P(0,1) = 0.1`, `P(1,0) = 0.2`, `P(1,1) = 0.3`. Finn `Cov(X, Y)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Diskret simultantabell for to binære variabler."
              - text: "Vi må først finne marginalforventningene, deretter `E[XY]`."
          - label: "Forventningsverdier"
            lines:
              - text: "Marginalfordeling for `X`: `P(X=0) = 0.4 + 0.1 = 0.5`, `P(X=1) = 0.2 + 0.3 = 0.5`."
              - indent: "`E[X] = 0 · 0.5 + 1 · 0.5 = 0.5`"
              - text: "Marginalfordeling for `Y`: `P(Y=0) = 0.4 + 0.2 = 0.6`, `P(Y=1) = 0.1 + 0.3 = 0.4`."
              - indent: "`E[Y] = 0 · 0.6 + 1 · 0.4 = 0.4`"
              - text: "Beregn `E[XY]` (kun cellen `(1, 1)` bidrar siden andre celler har `x = 0` eller `y = 0`):"
              - indent: "`E[XY] = 1 · 1 · 0.3 = 0.3`"
          - label: "Kovarians"
            lines:
              - text: "Sett inn i `Cov(X, Y) = E[XY] − E[X] · E[Y]`:"
              - indent: "`Cov(X, Y) = 0.3 − 0.5 · 0.4`"
              - indent: "`         = 0.3 − 0.20 = 0.10`"
          - label: "Tolkning"
            lines:
              - text: "`Cov(X, Y) = 0.10 > 0`: `X` og `Y` er positivt assosierte."
              - text: "Høy verdi av `X` opptrer typisk sammen med høy verdi av `Y`."
        result: "`Cov(X, Y) = 0.10`"

      - source: "Praksis · tolkning av fortegn"
        question: "Forklar hva fortegnet til `Cov(X, Y)` betyr, og illustrer med et tilfelle der `Cov(X, Y) = 0` men `X` og `Y` ikke er uavhengige."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Vi tolker `Cov(X, Y) = E[XY] − μ_X · μ_Y` som mål for lineær samvariasjon."
              - text: "Tre tilfeller: positiv, negativ, og null kovarians."
          - label: "Forventningsverdier"
            lines:
              - text: "Eksempel: `X ∈ {−1, 0, 1}` uniformt, og `Y = X²`."
              - indent: "`E[X] = (−1 + 0 + 1)/3 = 0`"
              - indent: "`E[Y] = E[X²] = (1 + 0 + 1)/3 = 2/3`"
              - text: "Beregn `E[XY] = E[X · X²] = E[X³]`:"
              - indent: "`E[X³] = ((−1)³ + 0³ + 1³)/3 = 0`"
          - label: "Kovarians"
            lines:
              - text: "Sett inn i formelen:"
              - indent: "`Cov(X, Y) = E[XY] − μ_X · μ_Y = 0 − 0 · 2/3 = 0`"
              - comment: "Likevel er `Y` fullstendig bestemt av `X` (ikke uavhengige)."
          - label: "Tolkning"
            lines:
              - text: "Fortegnsregler:"
              - indent: "`Cov > 0`: positivt assosierte – store `X` følger store `Y`."
              - indent: "`Cov < 0`: negativt assosierte – store `X` følger små `Y`."
              - indent: "`Cov = 0`: ukorrelerte (ingen lineær sammenheng)."
              - text: "Viktig: `Cov = 0` betyr ikke uavhengighet. Eksempelet over viser ikke-lineær avhengighet med null kovarians."
        result: "Fortegnet til `Cov(X, Y)` indikerer retning på lineær samvariasjon; `Cov = 0` utelukker ikke avhengighet."

