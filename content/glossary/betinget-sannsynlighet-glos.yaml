id: betinget-sannsynlighet-glos
term_no: Betinget sannsynlighet
short_def: "P(A|B) = sannsynligheten for A når vi vet at B har inntruffet."
long_def: |
  Formel: P(A|B) = P(A ∩ B) / P(B), forutsatt P(B) > 0. Hvis A og B er
  uavhengige, er P(A|B) = P(A). Brukes i Bayes' setning og total
  sannsynlighet.
