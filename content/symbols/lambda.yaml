id: lambda
sym: "λ"
short_def: "Rate – antall hendelser per tidsenhet (eller per arealenhet, lengdeenhet osv). Hovedparameteren i poisson- og eksponentialfordelingen."
contexts:
  - usage: "Rate i poissonprosess"
    detail: |
      Tenk på λ som 'hvor ofte ting skjer i snitt'. Hvis du i snitt
      får 3 telefoner per time på et kundesenter, er λ = 3 per time.

      Mer formelt: forventet antall hendelser per tidsenhet (eller
      areal, lengde, volum). Antall hendelser i et vindu av lengde
      t er da Poisson(λt), og tiden mellom hendelser er Exp(λ).

      Estimerer du fra data: λ̂ = totalt antall hendelser / total tid.
      Eksempel: 24 telefoner over 8 timer gir λ̂ = 3 per time.

      Pass på: enheten henger med. Måler du λ per time og spør om
      neste 30 minutter, må du regne λt med t = 0.5.
    entry_refs:
      - poisson-fordeling
      - eksponential-fordeling
      - ki-poissonrate
  - usage: "Rate i eksponentialfordeling"
    detail: |
      Hvis ventetiden T til neste hendelse er Exp(λ), er forventet
      ventetid E[T] = 1/λ og variansen Var(T) = 1/λ².

      Intuisjon: stor λ betyr at hendelser kommer hyppig – korte
      ventetider. Liten λ betyr sjeldne hendelser – lange ventetider.

      Eksempel: hvis λ = 3 telefoner per time, er forventet tid til
      neste telefon 1/3 time = 20 minutter.
    entry_refs:
      - eksponential-fordeling
see_also:
