common_traps: |
  Husk frihetsgrader: ν = n - 1 for én-utvalgs t-test (ikke n - 2 som i
  regresjon, og ikke n_X + n_Y - 2 som i to-utvalgs). Pass på fortegn:
  for venstresidig test sammenlignes med -t_α, for høyresidig med +t_α.
  Tosidig: |t| > t_(α/2,ν).

python_snippet: |
  from scipy.stats import t

  x_bar, mu0, s, n, alpha = 71.30, 70, 14.33, 10, 0.05
  t_obs = (x_bar - mu0) / (s / (n ** 0.5))     # 0.287

  # Tosidig kritisk verdi
  t_crit = t.ppf(1 - alpha/2, df=n-1)          # 2.262

  reject = abs(t_obs) > t_crit                 # False

