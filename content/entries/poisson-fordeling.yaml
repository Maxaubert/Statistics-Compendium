id: poisson-fordeling
name_no: Poissonfordeling
type: distribution
category: discrete_distribution
tagline: "Antall hendelser i et tidsvindu, gitt en konstant rate."

formula_main: "P(X = k) = e^(-λt) · (λt)^k / k!"
formula_latex: "P(X = k) = \\frac{e^{-\\lambda t}(\\lambda t)^k}{k!}"

what_it_does: |
  Modellerer antall uavhengige hendelser som inntreffer med konstant rate
  i et fast tidsvindu eller område. Antallet kan i prinsippet være null,
  én, eller hvor som helst opp til et stort heltall.

why_use: |
  Naturlig valg når hendelsene "kommer som de kommer" og det ikke finnes
  noen forhåndsbestemt øvre grense for antallet. Eksempler i pensum:
  vulkanutbrudd, sommerfugler i felle, kunder som kommer til en kasse.

recognition_cues:
  - "Oppgaven nevner eksplisitt 'Poissonprosess' eller 'rate `λ` pr. [tidsenhet]'"
  - "Du teller hendelser i et fast tidsvindu eller område"
  - "Hendelser inntreffer uavhengig og kontinuerlig over tid eller rom"
  - "Spørsmålet ber om 'nøyaktig `k`', 'minst `k`', 'ingen', eller 'høyst `k`'"
  - "Ikke fast antall forsøk: hendelser kommer som de kommer"
  - "Total tid eller område er gitt (timer, uker, måneder, m², osv.)"

when_NOT_to_use:
  - "Fast antall `n` forsøk er gitt → bruk [binomialfordeling](/entry/binomial-fordeling) i stedet"
  - "Spørsmålet handler om TID TIL første hendelse → bruk [eksponentialfordeling](/entry/eksponential-fordeling)"
  - "Trekker uten tilbakelegging fra endelig pott → bruk [hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling)"

symbols:
  - { sym: "λ",  means: "rate (gjennomsnittlig antall hendelser pr. tidsenhet eller pr. arealenhet)" }
  - { sym: "t",  means: "lengden på vinduet (samme enhet som raten)" }
  - { sym: "λt", means: "forventet antall hendelser i vinduet (skrives ofte som `μ`)" }
  - { sym: "k",  means: "antallet det spørres om (heltall `≥ 0`)" }
  - { sym: "e",  means: "Eulers tall `≈ 2.71828`" }
  - { sym: "k!", means: "`k`-fakultet, `k · (k-1) · (k-2) · ... · 1`" }

properties:
  expected_value: "E[X] = λt"
  variance: "Var[X] = λt"
  std_dev: "σ = √(λt)"

filters:
  computes: [exact_probability, at_least_k, range_probability, expected_value, find_n_for_threshold]
  random_variable: [discrete_count]
  setup: [single_population, events_in_window]
  structural_cues: [rate_given, process_over_time, independent_events, poisson_process_mentioned, counting_events, complement_pattern]
  parameters_known: [rate_lambda]
  distribution_assumption: [poisson]
  tooling: [cumulative_poisson_table_E2, calculator_exp, calculator_factorial]
solution_variants:
  - label: "P(X = k)"
    steps:
      - "Identifiser raten `λ` med enhet (f.eks. `λ = 0.0261` utbrudd/måned) og vinduets lengde `t` i samme enhet (f.eks. `t = 60` måneder)"
      - "Regn ut forventet antall `μ = λt` (f.eks. `μ = 0.0261 · 60 = 1.5678`)"
      - "Bekreft at `k` er et konkret heltall `≥ 0` (oppgaven sier 'nøyaktig `k`', 'ett', 'to', osv.)"
      - "Sett inn i formelen `P(X = k) = e^(-μ) · μ^k / k!` direkte"
      - { text: "Hvis `k = 0`: forenkle til `P(X = 0) = e^(-μ)` (fordi `μ^0 = 1` og `0! = 1`) — ikke gå via E.2", conditional: true }
      - { text: "Hvis spørsmålet ber om en sum (f.eks. 'ett eller to'): regn `P(X = 1) + P(X = 2)` separat og legg sammen", conditional: true }
      - "Regn ut `e^(-μ)` på kalkulator, deretter `μ^k / k!`, og multipliser"
      - "Avrund til 3–4 desimaler og dobbeltsjekk at resultatet er mellom 0 og 1"

  - label: "P(X ≤ k)"
    steps:
      - "Identifiser `λ` og `t`, og regn ut `μ = λt` (f.eks. `λ = 0.84`/min, `t = 2` min → `μ = 1.68`)"
      - "Les av `k` fra oppgaven (formuleringer som 'høyst `k`', 'ikke mer enn `k`', '`k` eller færre')"
      - "Slå opp `P(X ≤ k)` direkte i tabell E.2: finn kolonnen for `μ` (eller nærmeste verdi) og raden for `k`"
      - { text: "Hvis `μ` ikke står eksakt i tabellen, rund til nærmeste tabellverdi og noter avviket — eller regn manuelt med summen `Σ e^(-μ) μ^i / i!` for `i = 0..k`", conditional: true }
      - { text: "Hvis `k` er stor og `μ` er liten (f.eks. `k ≥ 6`, `μ < 2`): `P(X ≤ k) ≈ 1`, du kan svare `≈ 1` uten oppslag", conditional: true }
      - "Skriv ned tabellverdien som svar; ingen videre regning trengs"
      - "Sjekk fornuft: for `k ≈ μ` skal verdien ligge rundt `0.5–0.6`; for `k ≫ μ` skal den være nær 1"

  - label: "P(X ≥ k)"
    steps:
      - "Identifiser `λ` og `t`, og regn ut `μ = λt` (f.eks. `μ = 1.68`)"
      - "Skriv om via komplement: `P(X ≥ k) = 1 − P(X ≤ k − 1)`"
      - { text: "Tabellen skal slås opp på `k − 1`, IKKE på `k`. F.eks. for `P(X ≥ 3)` slå opp `P(X ≤ 2)`. Bruker du `P(X ≤ 3)` i stedet, mister du bidraget fra `X = 3` selv og svaret blir for lavt.", conditional: true }
      - { text: "Hvis `k = 1`: forenkle til `P(X ≥ 1) = 1 − P(X = 0) = 1 − e^(-μ)` — raskere enn E.2", conditional: true }
      - "Slå opp `P(X ≤ k − 1)` i tabell E.2 med kolonne for `μ` og rad for `k − 1` (f.eks. `k = 3` → slå opp rad 2)"
      - { text: "Hvis tabellen ikke har eksakt `μ`: bruk nærmeste verdi, eller summer `P(X = 0) + P(X = 1) + ... + P(X = k−1)` manuelt og trekk fra 1", conditional: true }
      - "Trekk tabellverdien fra 1 for å få svaret"
      - "Sjekk fornuft: `P(X ≥ k)` skal synke når `k` vokser; for `k = 1` skal verdien være nær `1 − e^(-μ)`"

  - label: "P(a ≤ X ≤ b)"
    steps:
      - "Identifiser `λ` og `t`, og regn ut `μ = λt` (f.eks. `λ = 0.05` pr. natt, `t = 60` → `μ = 3`)"
      - "Les av nedre grense `a` og øvre grense `b` fra oppgaven (formuleringer som 'mellom `a` og `b`', '`a` eller `b`', 'minst `a`, høyst `b`')"
      - "Skriv intervallet via to kumulative oppslag: `P(a ≤ X ≤ b) = P(X ≤ b) − P(X ≤ a − 1)`"
      - { text: "Tabellen skal slås opp på `a − 1`, IKKE på `a`. Bruker du `P(X ≤ a)` mister du bidraget fra `X = a` selv. F.eks. for `P(2 ≤ X ≤ 5)` slå opp `P(X ≤ 1)`, ikke `P(X ≤ 2)`.", conditional: true }
      - { text: "Hvis `a = 1`: forenkles til `P(1 ≤ X ≤ b) = P(X ≤ b) − P(X = 0) = P(X ≤ b) − e^(-μ)`", conditional: true }
      - "Slå opp begge verdiene i tabell E.2 (kolonne for `μ`, rader for `b` og `a − 1`)"
      - "Trekk de to: `P(X ≤ b) − P(X ≤ a − 1)`"
      - { text: "Alternativt for små intervaller: summer punktsannsynlighetene direkte, `P(X = a) + P(X = a + 1) + ... + P(X = b)`", conditional: true }
      - "Sjekk fornuft: svaret skal være mellom 0 og 1, og mindre enn både `P(X ≤ b)` og `P(X ≥ a)` hver for seg"

  - label: "P(X = 0)"
    steps:
      - "Gjenkjenn formuleringer som 'ingen hendelser', 'ikke finne noen', 'tom felle', 'null utbrudd' → dette er `P(X = 0)`"
      - "Identifiser `λ` og `t` med riktig enhet (f.eks. `λ = 0.01`/time, `t = 168` timer for én uke)"
      - "Regn ut `μ = λt` (f.eks. `μ = 0.01 · 168 = 1.68`)"
      - "Bruk den forenklede formelen direkte: `P(X = 0) = e^(-μ)` (`μ^0 = 1`, `0! = 1`, så hele brøken kollapser)"
      - "Regn ut `e^(-μ)` på kalkulator (f.eks. `e^(-1.68) ≈ 0.1864`)"
      - { text: "Hvis spørsmålet egentlig ber om 'minst én' (`P(X ≥ 1)`): svar `1 − e^(-μ)` i stedet — vanlig oppfølgingsoppgave", conditional: true }
      - "Avrund til 3–4 desimaler; svaret skal alltid være mellom 0 og 1"

  - label: "Finn k for terskel"
    steps:
      - "Identifiser terskelen `p*` fra oppgaven (f.eks. 'finn minste `k` slik at `P(X ≥ k) ≥ 0.05`' eller 'høyst 1% sjanse')"
      - "Regn ut `μ = λt` for det aktuelle vinduet"
      - "Avgjør retning: 'minste `k` slik at `P(X ≥ k) ≥ p*`' krever at du øker `k` til sannsynligheten faller under `p*`; 'høyst `k` slik at `P(X ≤ k) ≥ p*`' krever motsatt"
      - "Bygg en liten tabell med `k = 0, 1, 2, ...` og slå opp `P(X ≤ k)` fra tabell E.2 for hver"
      - "Regn `P(X ≥ k) = 1 − P(X ≤ k − 1)` for hver rad og sammenlign med `p*`"
      - "Velg det minste (eller største) `k` som tilfredsstiller ulikheten — les nøye om kravet er strikt (`>`) eller ikke-strikt (`≥`)"
      - { text: "Hvis ingen `k` i tabellen tilfredsstiller terskelen: utvid tabellen manuelt med formelen, eller konkluder at hendelsen er praktisk umulig/sikker", conditional: true }
      - "Skriv svaret med ord ('minste `k` er ...') og oppgi den tilhørende sannsynligheten som dokumentasjon"

common_traps: |
  Husk å multiplisere raten med vindusstørrelsen før innsetting (`μ = λt`,
  ikke bare `λ`). Hvis raten er pr. time og vinduet er en uke, må `t` omregnes
  til timer (168). Bruk samme tidsenhet for begge. Tabell E.2 leser opp
  `P(X ≤ k)`, så spørsmål om "nøyaktig `k`" eller "minst `k`" må regnes om via
  komplement eller ved å ta differanse mellom to tabelloppslag.

python_snippet: |
  from scipy.stats import poisson

  # μ = λt = forventet antall hendelser i vinduet
  mu = 0.01 * 168          # 1.68

  # P(X = k)
  poisson.pmf(0, mu)        # 0.1864

  # P(X ≤ k) – kumulativ
  poisson.cdf(2, mu)        # 0.7625

  # P(X ≥ k) = 1 − P(X ≤ k−1)
  1 - poisson.cdf(2, mu)    # 0.2375

detailed_solution_variants:
  - label: "P(X = k)"
    solutions:
      - source: "Eksamen jan26 · oppgave 4 (tilpasset)"
        question: "Klippeblåvinger fanges som en poissonprosess med rate `λ = 0.01` sommerfugler pr. time. La `X` være antall i fellen etter én uke (168 timer). Finn `P(X = 2)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X ~ Poisson(λt)`" }
              - { text: "`λ = 0.01` pr. time, `t = 168` timer" }
              - { text: "`μ = λt = 0.01 · 168 = 1.68`" }
              - { comment: "spørres om k = 2" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = e^(-μ) · μ^k / k!`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 2) = e^(-1.68) · 1.68² / 2!`" }
              - { indent: "`= 0.1864 · 2.8224 / 2`" }
              - { indent: "`= 0.1864 · 1.4112`" }
        result: "`P(X = 2) ≈ 0.263`"

      - source: "Praksis · vulkanutbrudd"
        question: "Vulkanen Mauna Loa har rate `λ = 0.0261` utbrudd pr. måned. Finn sannsynligheten for nøyaktig to utbrudd i løpet av fem år (60 måneder)."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 0.0261` pr. måned, `t = 60` måneder" }
              - { text: "`μ = λt = 0.0261 · 60 = 1.5678`" }
              - { text: "`k = 2`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = e^(-μ) · μ^k / k!`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 2) = e^(-1.5678) · 1.5678² / 2!`" }
              - { indent: "`= 0.2085 · 2.4580 / 2`" }
              - { indent: "`= 0.2085 · 1.2290`" }
        result: "`P(X = 2) ≈ 0.255`"

      - source: "Praksis · kundeanrop"
        question: "Et kundesenter mottar i snitt `λ = 3` anrop pr. time. Finn sannsynligheten for nøyaktig 4 anrop i løpet av én time."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 3` pr. time, `t = 1` time" }
              - { text: "`μ = λt = 3`" }
              - { text: "`k = 4`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = k) = e^(-μ) · μ^k / k!`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 4) = e^(-3) · 3⁴ / 4!`" }
              - { indent: "`= 0.04979 · 81 / 24`" }
              - { indent: "`= 0.04979 · 3.375`" }
        result: "`P(X = 4) ≈ 0.168`"

  - label: "P(X ≤ k)"
    solutions:
      - source: "Praksis · kundeanrop (kumulativ)"
        question: "Et kundesenter har rate `λ = 1` anrop pr. minutt. I et 2-minutters vindu er `μ = λt = 2`. Finn `P(X ≤ 3)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 1` pr. minutt, `t = 2` min" }
              - { text: "`μ = λt = 2`" }
              - { text: "Spørres om `P(X ≤ 3)`" }
          - label: "Formel"
            lines:
              - { text: "`P(X ≤ k) = Σ_{i=0}^{k} e^(-μ) · μ^i / i!`" }
              - { comment: "leses direkte i tabell E.2" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 2, k = 3 → P(X ≤ 3) = 0.857" } }
        result: "`P(X ≤ 3) ≈ 0.857`"

      - source: "Praksis · defekter på samlebånd"
        question: "Defekter inntreffer med rate `λ = 0.5` pr. time. Finn sannsynligheten for høyst én defekt i et 4-timers skift."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 0.5` pr. time, `t = 4` timer" }
              - { text: "`μ = λt = 2`" }
              - { text: "Høyst 1 defekt = `P(X ≤ 1)`" }
          - label: "Formel"
            lines:
              - { text: "`P(X ≤ 1) = P(X = 0) + P(X = 1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 2, k = 1 → P(X ≤ 1) = 0.406" } }
              - { comment: "verifiser: e^(-2)(1 + 2) = 0.1353 · 3 = 0.406" }
        result: "`P(X ≤ 1) ≈ 0.406`"

  - label: "P(X ≥ k)"
    solutions:
      - source: "Praksis · komplement med formel"
        question: "Hendelser inntreffer med `μ = 1.5` i et gitt vindu. Finn `P(X ≥ 2)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 1.5`, `k = 2`" }
              - { text: "Bruk komplement fordi `P(X ≥ k)` ikke står direkte i E.2" }
          - label: "Formel"
            lines:
              - { text: "`P(X ≥ 2) = 1 − P(X ≤ 1)`" }
              - { indent: "`= 1 − (P(X = 0) + P(X = 1))`" }
              - { indent: "`= 1 − (e^(-1.5) + 1.5 · e^(-1.5))`" }
          - label: "Innsatt"
            lines:
              - { text: "`e^(-1.5) ≈ 0.2231`" }
              - { text: "`P(X = 0) = 0.2231`" }
              - { text: "`P(X = 1) = 1.5 · 0.2231 = 0.3347`" }
              - { text: "`P(X ≤ 1) = 0.2231 + 0.3347 = 0.5578`" }
              - { text: "`P(X ≥ 2) = 1 − 0.5578`" }
        result: "`P(X ≥ 2) ≈ 0.442`"

      - source: "Praksis · kundeanrop (E.2)"
        question: "Et kundesenter har `μ = 4` anrop i et gitt tidsvindu. Finn `P(X ≥ 6)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 4`, `k = 6`" }
          - label: "Formel"
            lines:
              - { text: "`P(X ≥ 6) = 1 − P(X ≤ 5)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 4, k = 5 → P(X ≤ 5) = 0.785" } }
              - { text: "`P(X ≥ 6) = 1 − 0.785`" }
        result: "`P(X ≥ 6) ≈ 0.215`"

  - label: "P(a ≤ X ≤ b)"
    solutions:
      - source: "Praksis · stjerneskudd over en sesong"
        question: "En forsker observerer en sjelden type stjerneskudd som inntreffer med rate `λ = 0.05` pr. natt (poissonprosess). Finn sannsynligheten for at forskeren observerer ett eller to slike stjerneskudd i løpet av en sesong på 60 netter."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 0.05` pr. natt, `t = 60` netter" }
              - { text: "`μ = λt = 0.05 · 60 = 3`" }
              - { text: "Spørres om `P(1 ≤ X ≤ 2)` (ett eller to)" }
          - label: "Formel"
            lines:
              - { text: "`P(1 ≤ X ≤ 2) = P(X ≤ 2) − P(X ≤ 0)`" }
              - { comment: "P(X ≤ 0) = P(X = 0) = e^(-μ)" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 3, k = 2 → P(X ≤ 2) = 0.4232" } }
              - { table_lookup: { ref: "E.2", text: "μ = 3, k = 0 → P(X ≤ 0) = 0.0498" } }
          - label: "Innsatt"
            lines:
              - { text: "`P(1 ≤ X ≤ 2) = 0.4232 − 0.0498`" }
              - { indent: "`= 0.3734`" }
          - label: "Sjekk"
            lines:
              - { comment: "alternativ: P(X = 1) + P(X = 2) = 3·e^(-3) + 4.5·e^(-3) ≈ 0.1494 + 0.2240 = 0.3734 ✓" }
        result: "`P(1 ≤ X ≤ 2) ≈ 0.373`"

      - source: "Praksis · kundeanrop i intervall"
        question: "Et kundesenter har rate `λ = 1.5` anrop pr. minutt. Finn sannsynligheten for mellom 3 og 5 anrop (begge inkludert) i løpet av 4 minutter."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 1.5` pr. minutt, `t = 4` min" }
              - { text: "`μ = λt = 6`" }
              - { text: "`a = 3`, `b = 5` → spørres om `P(3 ≤ X ≤ 5)`" }
          - label: "Formel"
            lines:
              - { text: "`P(3 ≤ X ≤ 5) = P(X ≤ 5) − P(X ≤ 2)`" }
              - { comment: "Pass på: nedre grense slås opp på a − 1 = 2, ikke på a = 3" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 6, k = 5 → P(X ≤ 5) = 0.4457" } }
              - { table_lookup: { ref: "E.2", text: "μ = 6, k = 2 → P(X ≤ 2) = 0.0620" } }
          - label: "Innsatt"
            lines:
              - { text: "`P(3 ≤ X ≤ 5) = 0.4457 − 0.0620`" }
              - { indent: "`= 0.3837`" }
        result: "`P(3 ≤ X ≤ 5) ≈ 0.384`"

  - label: "P(X = 0)"
    solutions:
      - source: "Praksis · ingen kundeanrop"
        question: "Et kundesenter har rate `λ = 2` anrop pr. time. Finn sannsynligheten for ingen anrop i løpet av én time."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`λ = 2` pr. time, `t = 1` time" }
              - { text: "`μ = λt = 2`" }
              - { comment: "k = 0 → forenklet formel" }
          - label: "Formel"
            lines:
              - { text: "`P(X = 0) = e^(-μ)`" }
              - { comment: "fordi μ⁰ = 1 og 0! = 1" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 0) = e^(-2)`" }
        result: "`P(X = 0) ≈ 0.135`"

      - source: "Praksis · ingen vulkanutbrudd"
        question: "Vulkanen har `μ = 1.5` utbrudd over et gitt vindu. Finn sannsynligheten for null utbrudd."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 1.5`, `k = 0`" }
          - label: "Formel"
            lines:
              - { text: "`P(X = 0) = e^(-μ)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(X = 0) = e^(-1.5)`" }
        result: "`P(X = 0) ≈ 0.223`"

  - label: "Finn k for terskel"
    solutions:
      - source: "Praksis · forsikringskrav"
        question: "Et forsikringsselskap mottar `μ = 5` krav pr. uke. Finn minste `k` slik at `P(X ≥ k) < 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 5` pr. uke" }
              - { text: "Søker minste `k` slik at `P(X ≥ k) < 0.05`" }
              - { text: "Ekvivalent: `P(X ≤ k − 1) > 0.95`" }
          - label: "Formel"
            lines:
              - { text: "`P(X ≥ k) = 1 − P(X ≤ k − 1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.2", text: "μ = 5, k = 8 → P(X ≤ 8) = 0.932" } }
              - { text: "`P(X ≥ 9) = 1 − 0.932 = 0.068` (for høyt)" }
              - { table_lookup: { ref: "E.2", text: "μ = 5, k = 9 → P(X ≤ 9) = 0.968" } }
              - { text: "`P(X ≥ 10) = 1 − 0.968 = 0.032 < 0.05` ✓" }
          - label: "Konklusjon"
            lines:
              - { text: "Minste `k` er 10" }
