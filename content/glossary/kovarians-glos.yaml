id: kovarians-glos
term_no: Kovarians (Cov)
short_def: "Mål på hvor mye to variabler beveger seg sammen – positiv = samme retning, negativ = motsatt."
long_def: |
  Cov(X,Y) = E[XY] − μ_X·μ_Y. Null kovarians betyr ingen lineær
  sammenheng (men kan ha annen sammenheng). Skalaavhengig: bytter du
  enhet, endres tallet. Korrelasjon er kovarians normalisert til [−1, 1].
