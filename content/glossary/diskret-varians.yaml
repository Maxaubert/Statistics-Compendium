id: diskret-varians
term_no: Variansen til diskret stokastisk variabel
short_def: "Når du har en PMF: `Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)` — vektet sum av kvadrerte avvik der vekten er sannsynligheten."
filters:
  random_variable: [discrete_count]
  computes: [std_dev, expected_value, variance]
  parameters_known: [mean_known]
long_def: |
  Formel:

      Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)

  Direkte beregning av variansen for en diskret stokastisk variabel med
  kjent sannsynlighetsfordeling. Vekten er sannsynligheten.

  **Trenger rådata?** Ikke i form av observasjoner — du trenger
  PMF-tabellen `xᵢ → P(X = xᵢ)` og forventningsverdien `μ`.

  **Snarvei for uniform fordeling:**

      Var(X) = E[X²] − μ²

  Når alle sannsynligheter er like, er det ofte raskere å regne
  `Σ xᵢ²·P` og trekke fra `μ²` enn å regne hver `(xᵢ − μ)²` for seg.

  Standardavviket `σ = √Var(X)` har samme enhet som `X`.
aliases:
  - varians til diskret stokastisk variabel
  - variansen til diskret stokastisk variabel
  - diskret varians
