id: sannsynlighetsfordeling
term_no: Sannsynlighetsfordeling (PMF, PDF)
short_def: "Funksjon som tilordner sannsynlighet til hver mulig verdi (diskret, PMF) eller tetthet i hvert intervall (kontinuerlig, PDF) av en stokastisk variabel."
long_def: |
  Forkortelsene står for engelsk:

  - **PMF** = *probability mass function* (sannsynlighetsmassefunksjon) — for diskrete variabler.
  - **PDF** = *probability density function* (tetthetsfunksjon) — for kontinuerlige variabler.

  **Diskret stokastisk variabel (PMF):** sannsynlighet for hver verdi `xᵢ`:

      P(X = xᵢ)        med    Σ P(X = xᵢ) = 1

  **Kontinuerlig stokastisk variabel (PDF):** tetthet `f(x) ≥ 0` med:

      ∫ f(x) dx = 1

  Sannsynlighet for et intervall regnes som integral:

      P(a ≤ X ≤ b) = ∫_a^b f(x) dx

  PMF/PDF er fundamentet for `E[X]`, `Var(X)`, KI og hypotesetester.
