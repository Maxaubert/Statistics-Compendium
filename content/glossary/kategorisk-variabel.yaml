id: kategorisk-variabel
term_no: Kategorisk variabel
short_def: "Variabel som tar verdier i et begrenset sett av kategorier (kjønn, blodtype, røyker/ikke), ikke tall man regner med."
filters:
  structural_cues: [more_than_two_categories, joint_table_present, two_outcomes_per_trial]
  distribution_assumption: [chi_squared]
  computes: [test_independence, hypothesis_test]
  random_variable: [proportion]
  tooling: [chi_square_quantile_table_E6]
long_def: |
  Kategoriske variabler grupperer observasjoner i klasser. Sannsynlighet
  for hver kategori, andeler, og uavhengighet mellom kategoriske variabler
  testes med kjikvadrat-tester. Skiller seg fra numeriske variabler
  (vekt, høyde) der man bruker gjennomsnitt, varians, t- og z-tester.
aliases:
  - kategorisk variabel
  - kategoriske variable
  - kategoriske variabler
  - kategoriske
  - kategorisk
see_also:
  - { id: kjikvadrat-uavhengighet, kind: entry }
  - { id: kjikvadrat-goodness-of-fit, kind: entry }
  - { id: kontingenstabell, kind: glossary }
