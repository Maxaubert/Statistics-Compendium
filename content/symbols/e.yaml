id: e
sym: "e"
short_def: "Eulers tall, e ≈ 2.71828. En matematisk konstant som dukker opp i poisson- og eksponentialformler."
contexts:
  - usage: "Eulers tall (matematisk konstant)"
    detail: |
      e er bare et tall – omtrent 2.71828 – på samme måte som π er
      omtrent 3.14159. Du trenger ikke å forstå hvor det kommer fra
      for å bruke det; behandle det som en knapp på kalkulatoren
      (typisk merket e^x eller exp).

      Du møter e to steder i dette kurset:
      - Poissonfordelingens punktformel: P(X = k) = e^(−μ) · μᵏ / k!
      - Eksponentialfordelingens tetthet: f(t) = λ · e^(−λt)

      Eksempel: skal du regne P(X = 2) med μ = 3, taster du
      e^(−3) · 3² / 2! ≈ 0.224 på kalkulatoren.

      Ikke å forveksle med E (stor E) som ofte betyr forventningsverdi
      eller forventet frekvens i kjikvadrat-tester.
    entry_refs:
      - poisson-fordeling
      - eksponential-fordeling
