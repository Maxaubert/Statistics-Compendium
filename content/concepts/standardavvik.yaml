id: standardavvik
name_no: "Standardavvik (oversikt over de ulike formene)"
type: concept
tagline: "Kvadratrot av variansen — spredning i samme enhet som dataene. Tre store grupper: data, kjent fordeling, og estimat."

what_it_means: |
  **Standardavvik er kvadratroten av variansen** og har samme enhet som
  dataene (mens variansen har enhet kvadrert). Hver variansform har derfor
  en parallell standardavvik-form. Strukturen følger
  [Varians (oversikt)](/concept/varians) — under er de viktigste formene
  for standardavvik.

  ---

  ## A. Utregnet fra dine data

  Trenger rådata `x_1, …, x_n`:

  - **`x̄ = Σ xᵢ / n`** — utvalgsgjennomsnittet, midtpunktet i dataene og
    estimat for `μ`. (Klikk gjennomsnittet for definisjon.)
  - **`s = √( Σ(xᵢ − x̄)² / (n − 1) )`** — utvalgsstandardavviket,
    spredningen i dataene og estimat for `σ` når populasjonens
    standardavvik er ukjent. Brukes i
    [Én-utvalg t-test](/entry/en-utvalg-t-test) og
    [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma).
  - **`S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )`** — residualstandardavviket i
    regresjon, gjennomsnittlig størrelse på residualene. Se
    [Residualenes varians](/entry/regresjon-residualvarians).

  ---

  ## B. Avlest fra en kjent fordeling

  Når fordelingen er navngitt, er `σ` en egenskap — du slipper å regne
  fra rådata.

  - **Normal `N(μ, σ)`:** `σ` (oppgitt direkte). Se
    [Normalfordeling](/entry/normalfordeling).
  - **Binomial `B(n, p)`:** `σ = √(np(1 − p))`. Se
    [Binomialfordeling](/entry/binomial-fordeling); detalj-popup: binomialvarians.
  - **Poisson `Poisson(λ)`:** `σ = √λ`. Se
    [Poissonfordeling](/entry/poisson-fordeling); detalj-popup: poissonvarians.
  - **Eksponential `Eksp(λ)`:** `σ = 1/λ` (lik forventningen). Se
    [Eksponentialfordeling](/entry/eksponential-fordeling); detalj-popup: eksponentialvarians.

  Sjekk alltid «Egenskaper»-kortene på fordelings-siden for de eksakte
  formlene.

  ---

  ## C. Spredning til et estimat (standardfeil)

  Når du regner ut et tall fra et utvalg (et estimat), har det **selv** en
  spredning — kalt **standardfeilen** (`SE`). Det er IKKE spredningen i
  rådataene; det er hvor mye estimatet typisk varierer fra utvalg til utvalg.

  - **`σ_X̄ = σ/√n`** — standardfeilen til utvalgsgjennomsnittet.
    Bruker `s/√n` hvis `σ` er ukjent. Trenger IKKE rådata — bare `σ` (eller
    et estimat for den) og `n`. Innebygget i
    [Én-utvalg z-test](/entry/en-utvalg-z-test) og
    [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma). Detalj-popups:
    variansen til utvalgsgjennomsnittet, standardfeilen.
  - **`SE(β̂) = √(S_E² / S_XX)`** — standardfeilen til regresjonsstigningstallet.
    Kjernen i hypotesetest og KI for `β`. Se
    [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).
  - **`SE(p̂) = √(p̂(1 − p̂) / n)`** — standardfeilen til utvalgsandelen.
    Brukes i [Z-test for andel p](/entry/en-utvalg-z-test-andel) og
    [KI for andel p (binomial)](/entry/ki-andel-binomial).

  ---

  ## Trenger du rådata eller ikke?

  Et viktig skille på eksamen:

  - **Trenger rådata:** `x̄`, `s`, `S_E` — alt som regnes ut fra
    `Σ(...)`-summer over observasjonene.
  - **Trenger IKKE rådata:** `σ/√n`, `√(np(1 − p))`, `√λ`, `1/λ` —
    så lenge fordelingens parametere (eller utvalgsstørrelsen + et
    estimat for `σ`) er gitt.

  Eksempel: hvis oppgaven sier «antar `σ = 5`, finn standardfeilen til
  `X̄` for `n = 25`», trenger du bare `σ/√n = 1` — ingen kalkulering på dataene.

recognition_cues:
  - "Oppgaven nevner spredning, standardavvik, eller standardfeil"
  - "Du må velge mellom σ (kjent), s (estimat fra rådata), og σ/√n (spredning til X̄)"
  - "Du har et estimat og skal kvantifisere usikkerheten i det"

