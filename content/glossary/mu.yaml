id: mu
term_no: My (μ)
short_def: "Populasjonens forventningsverdi — det «sanne» gjennomsnittet du prøver å estimere."
filters:
  parameters_known: [mean_known, population_variance_unknown, population_variance_known]
  random_variable: [mean_of_samples, difference_of_means]
  computes: [expected_value, parameter_estimate, confidence_interval, find_mu_for_threshold, hypothesis_test]
  setup: [two_independent_samples]
  distribution_assumption: [normal, t_distribution]
aliases:
  - μ
  - my
long_def: |
  `μ` er forventningsverdien (populasjonsgjennomsnittet) til en variabel:

      μ = E(X)

  Estimeres med utvalgsgjennomsnittet `X̄`.

  Mange tester og KI handler om `μ`: t-test for `μ`, KI for `μ`,
  sammenligning av to `μ`.

  Ikke forveksle `μ` (populasjon, ukjent konstant) med `X̄` (utvalg,
  tilfeldig variabel).
see_also:
  - { id: gjennomsnitt, kind: glossary }
  - { id: punktestimat, kind: glossary }
  - { id: en-utvalg-t-test, kind: entry }
  - { id: ki-mu-og-varians, kind: entry }
