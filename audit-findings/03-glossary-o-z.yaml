          computes: [hypothesis_test]
          distribution_assumption: [normal]
          parameters_known: [population_variance_known]
          random_variable: [mean_of_samples]
          setup: [single_population]
        currently_surfaces: false
        missing_tags: [parameters_known.population_variance_known, random_variable.mean_of_samples, setup.single_population]
      - scenario: "T-test on small sample with sigma unknown: pick the right test statistic."
        student_filters:
          computes: [hypothesis_test]
          distribution_assumption: [t_distribution]
          parameters_known: [population_variance_unknown, sample_size_small_lt30]
          random_variable: [mean_of_samples]
          setup: [single_population]
        currently_surfaces: false
        missing_tags: [parameters_known.population_variance_unknown, parameters_known.sample_size_small_lt30, random_variable.mean_of_samples, setup.single_population]
      - scenario: "Goodness-of-fit chi-square test on a categorical table."
        student_filters:
          computes: [hypothesis_test]
          distribution_assumption: [chi_squared]
          structural_cues: [more_than_two_categories]
        currently_surfaces: false
        missing_tags: [structural_cues.more_than_two_categories]
    proposed_new_filters_yaml_additions: []

