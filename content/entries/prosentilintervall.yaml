id: prosentilintervall
name_no: "Prosentilintervall"
type: method
tagline: "KI laget ved å ta prosentilene direkte fra en (typisk bootstrap-)fordeling."

what_it_means: |
  Et alternativ til z- eller t-baserte konfidensintervall, brukt typisk
  med bootstrap. For et 95 % KI tas 2.5 %- og 97.5 %-prosentilen som
  endepunkter.

  Konkret med 999 bootstrap-resampler:
  - Sorter de 999 verdiene.
  - Nedre grense: verdi nummer 25 (≈ 2.5-prosentilen).
  - Øvre grense: verdi nummer 975 (≈ 97.5-prosentilen).

  Fordel: gjør ingen antakelse om at fordelingen er symmetrisk eller
  normal. Egnet når bootstrap-fordelingen er skjev eller har tunge haler.

recognition_cues:
  - "Bootstrap er allerede etablert som metoden"
  - "Spørsmål om alternativ til 'tradisjonelt' KI"
  - "Bootstrap-fordelingen er skjev"

filters: {}

related:
