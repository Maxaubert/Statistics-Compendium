id: alternativhypotese
term_no: Alternativhypotese (H₁)
short_def: "Påstanden du vil bevise – det H₀ må vike for hvis dataene er ekstreme nok."
aliases:
  - alternativhypotese
  - alternativhypotesen
  - H₁
  - H_1
long_def: |
  `H₁` kan være ensidig eller tosidig:

  - **Høyresidig:** `H₁: μ > μ₀` (kritikk i øvre hale)
  - **Venstresidig:** `H₁: μ < μ₀` (kritikk i nedre hale)
  - **Tosidig:** `H₁: μ ≠ μ₀` (kritikk i begge haler, `α/2` i hver)

  Form på `H₁` bestemmer hvor du ser etter ekstreme verdier.
see_also:
