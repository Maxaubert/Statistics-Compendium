id: y-hat
sym: "ŷ"
short_def: "Predikert verdi i regresjon – det modellen sier y bør være for en gitt x. Punktet på regresjonslinja."
contexts:
  - usage: "Predikert verdi fra regresjonslinje"
    detail: |
      ŷ ('y-hat') er regresjonsmodellens spådom: gitt en x-verdi,
      hva sier den estimerte linja at y er?

      Formel: ŷ = α̂ + β̂x

      Eksempel: estimerte du α̂ = 2 og β̂ = 0.5, og spør om y for
      x = 10, så er ŷ = 2 + 0.5 · 10 = 7.

      Det observerte y for samme x stemmer ikke nødvendigvis med ŷ –
      forskjellen yᵢ − ŷᵢ kalles residualet (avstanden fra punkt
      til linje).

      ŷ brukes til prediksjon for nye x-verdier. Husk: et
      prediksjonsintervall rundt ŷ må inkludere både modellusikkerheten
      (i α̂ og β̂) OG den naturlige spredningen rundt linja (S_E).

      Ikke å forveksle med y (faktisk observert verdi) eller ȳ
      (gjennomsnittet av observerte y).
    entry_refs:
      - regresjon-estimat-alpha-beta
      - regresjon-prediksjonsintervall
      - regresjon-residualvarians
see_also:
  - { id: residual, kind: glossary }
  - { id: prediksjonsintervall-glos, kind: glossary }
