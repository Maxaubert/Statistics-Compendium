id: populasjonsstandardavvik
term_no: Populasjonsstandardavvik (σ)
short_def: "Den «sanne» spredningen i hele populasjonen — `σ = √Var(X)`, antatt kjent eller estimert."
filters:
  parameters_known: [population_variance_known, confidence_level]
  computes: [std_dev, hypothesis_test, confidence_interval]
  random_variable: [mean_of_samples]
  distribution_assumption: [normal]
long_def: |
  Definisjon:

      σ = √Var(X)

  Den faste, ukjente spredningen rundt forventningsverdien `μ` i hele
  populasjonen.

  - **Når `σ` er kjent:** bruk z-test og z-baserte KI for `μ`.
  - **Når `σ` er ukjent (det vanlige):** estimer den med
    utvalgsstandardavviket `s` og bruk t-fordelt inferens.

  Skiller seg fra utvalgsstandardavviket `s`, som regnes ut fra dataene
  og varierer fra utvalg til utvalg.
aliases:
  - populasjonsstandardavvik
  - populasjonsstandardavviket
  - populasjonens standardavvik
see_also:
