id: ki-mu-og-varians
name_no: "Konfidensintervall for μ, σ² og σ (ett utvalg)"
type: identity
category: confidence_interval
tagline: "`(1−α)·100 %` KI for forventning og varians fra ett utvalg. Tre situasjoner: `σ` kjent, `σ` ukjent, eller KI for `σ²`/`σ`."

formula_main: "x̄ ± z_(α/2)·σ/√n   |   x̄ ± t_(α/2, n−1)·s/√n   |   ((n−1)s²/χ²_(α/2), (n−1)s²/χ²_(1−α/2))"
formula_latex: "\\overline{x} \\pm z_{\\alpha/2}\\frac{\\sigma}{\\sqrt{n}} \\;\\Big|\\; \\overline{x} \\pm t_{\\alpha/2, n-1}\\frac{s}{\\sqrt{n}} \\;\\Big|\\; \\left(\\frac{(n-1)s^2}{\\chi^2_{\\alpha/2}},\\, \\frac{(n-1)s^2}{\\chi^2_{1-\\alpha/2}}\\right)"

what_it_does: |
  Tre tett relaterte konfidensintervall fra ett utvalg av normalfordelte
  observasjoner — samlet på samme side fordi du må velge mellom dem ofte:

  - **`σ` kjent** ⇒ z-basert KI for `μ` (tabell E.4)
  - **`σ` ukjent** ⇒ t-basert KI for `μ` (tabell E.5)
  - **KI for `σ²`** ⇒ χ²-basert (tabell E.6); ta √ av grensene for `σ`

  Velg riktig fane under for prosedyren som passer oppgaven din.

why_use: |
  Alle tre er standard-verktøy for å tallfeste usikkerheten i et estimat:

  - **Forventning `μ`** — det vanligste KI-spørsmålet. Avgjør om `σ` er
    oppgitt (kjent) eller estimert fra data (ukjent) for å velge mellom
    z og t.
  - **Varians `σ²` / standardavvik `σ`** — brukes når oppgaven handler om
    presisjon, toleranse eller kvalitetskontroll på SPREDNINGEN, ikke
    senteret.

  Alle tre forutsetter normalfordelte observasjoner (eller stort utvalg
  for z-versjonen, via sentralgrenseteoremet).

recognition_cues:
  - "Oppgaven ber om '95 % (eller 90/99 %) konfidensintervall for `μ`'"
  - "Oppgaven ber om '95 % KI for `σ²`' eller for `σ` (spredningen)"
  - "Utvalgsstørrelse `n` og gjennomsnitt `x̄` (eller `s²`) er gitt"
  - "Frasering «estimer `μ`/`σ` med usikkerhetsangivelse»"
  - "Du har normalfordelte data og skal lage et intervall fra ett utvalg"

when_NOT_to_use:
  - "Du estimerer en andel `p` → bruk [KI for andel](/entry/ki-andel-binomial)"
  - "Du estimerer en rate `λ` i en poissonprosess → bruk [KI for poissonrate](/entry/ki-poissonrate)"
  - "Du sammenligner to grupper → bruk [KI for to utvalg](/entry/ki-to-utvalg) eller [to-utvalgs t-test](/entry/to-utvalgs-t-test)"
  - "Du jobber med regresjonsparametre `α̂, β̂` → bruk [lineær regresjon](/entry/lineaer-regresjon)"

symbols:
  - { sym: "x̄",            means: "utvalgsgjennomsnittet" }
  - { sym: "μ",             means: "ukjent populasjonsgjennomsnitt (det vi estimerer)" }
  - { sym: "σ",             means: "populasjonsstandardavvik (kjent eller ukjent)" }
  - { sym: "σ²",            means: "populasjonsvariansen (det vi estimerer i fane 3)" }
  - { sym: "s",             means: "utvalgs-standardavvik (estimat for `σ`)" }
  - { sym: "s²",            means: "utvalgsvarians, `Σ(x_i − x̄)²/(n − 1)`" }
  - { sym: "n",             means: "antall observasjoner" }
  - { sym: "ν",             means: "frihetsgrader, `n − 1` for ett-utvalgs-KI" }
  - { sym: "α",             means: "signifikansnivå; `1 − α` er konfidensnivået" }
  - { sym: "z_(α/2)",       means: "kvantil i standardnormal — tabell E.4" }
  - { sym: "t_(α/2, n-1)",  means: "kvantil i t-fordelingen — tabell E.5" }
  - { sym: "χ²_(α, ν)",     means: "kritisk verdi i χ²-fordelingen — tabell E.6" }

filters:
  computes: [confidence_interval, parameter_estimate, find_n_for_threshold, std_dev, hypothesis_test]
  random_variable: [mean_of_samples, continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, summary_stats_given, data_as_list, probability_threshold]
  parameters_known: [population_variance_known, population_variance_unknown, sample_size_small_lt30, sample_size_large, confidence_level]
  distribution_assumption: [normal, t_distribution, chi_squared]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, t_quantile_table_E5, chi_square_quantile_table_E6, calculator_sqrt]

