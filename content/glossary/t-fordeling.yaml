id: t-fordeling
term_no: T-fordeling (Student's t)
short_def: "Klokkeformet, men bredere enn standardnormal — formen styres av frihetsgrader `ν`."
filters:
  distribution_assumption: [t_distribution]
  parameters_known: [population_variance_unknown, sample_size_small_lt30]
  tooling: [t_quantile_table_E5]
  computes: [hypothesis_test, confidence_interval]
long_def: |
  T-fordelingen brukes når vi standardiserer et utvalgsgjennomsnitt med
  utvalgsstandardavviket `s` i stedet for det kjente `σ`. Da følger
  testobservatoren

      T = (X̄ − μ₀) / (s/√n)

  en t-fordeling med `ν` frihetsgrader.

  - **Form:** symmetrisk om `0`, klokkeformet — men har tyngre haler enn standardnormal.
  - **Eneste parameter:** frihetsgrader `ν`. Lite `ν` → bredere haler; stort `ν` → likner standardnormal.
  - **Tilnærming:** for `n ≥ 30` kan z-fordeling brukes i stedet.
  - **Tabell:** kvantilene står i tabell E.5.

  Ikke forveksle med `t`-verdien selv: t-fordelingen er fordelingen,
  `t`-verdien er den observerte testobservatoren.
aliases:
  - t-fordeling
  - t-fordelingen
  - t-fordelt
  - student-t
  - students t
