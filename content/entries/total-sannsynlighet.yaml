id: total-sannsynlighet
name_no: "Setningen om total sannsynlighet"
type: rule
category: probability_rule
tagline: "Total sannsynlighet for `B` summert over alle 'måter' den kan inntreffe."

formula_main: "P(B) = P(A) · P(B|A) + P(A̅) · P(B|A̅)"
formula_latex: "P(B) = P(A) \\cdot P(B|A) + P(\\overline{A}) \\cdot P(B|\\overline{A})"

what_it_does: |
  Bryter sannsynligheten for `B` opp i bidrag fra to disjunkte tilfeller `A`
  og `Ā` (eller mer generelt fra en partisjon av utfallsrommet). Brukes
  ofte når `B` kan inntreffe på flere "måter" og betingede sannsynligheter
  er gitt for hver.

why_use: |
  Standardteknikken når oppgaven gir `P(B|A)`, `P(B|Ā)`, og marginalsannsynlighetene
  `P(A)`, `P(Ā)`, og spør etter `P(B)`. Også grunnsteinen i Bayes' setning.

recognition_cues:
  - "**Hvilken regel?** Når oppgaven gir flere prosenter er det ofte én av disse fem reglene. Velg etter spørsmålet: «hva er `P(B)` totalt?» → TOTAL SANNSYNLIGHET (denne) · «gitt `B`, finn `P(A)`» → [Bayes' setning](/entry/bayes-setning) · «`P(A` og `B)`?» → [produktregel](/entry/produktregel) · «`P(A` eller `B)`?» → [unionssetningen](/entry/unionssetningen) · «minst én / ingen» → [komplementregelen](/entry/komplementregelen)."
  - "Du er gitt betingede sannsynligheter `P(B|A)` og `P(B|Ā)`"
  - "Du vil finne den marginale (totale) sannsynligheten `P(B)`"
  - "Spørsmålet handler om 'hva er sjansen for `B` totalt sett?'"
  - "Populasjonen er delt i grupper (kjønn, type, kategori) og du vil utlede en samlet rate"

when_NOT_to_use:
  - "Du har `P(B)` og en betinget — og spør om motsatt retning `P(A|B)` → bruk [Bayes' setning](/entry/bayes-setning) i stedet"
  - "Du vil bare regne `P(Aᶜ) = 1 − P(A)` → bruk [komplementregelen](/entry/komplementregelen)"
  - "Hendelsene `A` og `B` er uavhengige → forenkler til `P(B) = P(B|A) = P(B|Ā)` (ingen partisjonering nødvendig)"

symbols:
  - { sym: "A, A̅",    means: "to disjunkte hendelser som dekker hele utfallsrommet" }
  - { sym: "A_i",     means: "hendelsene i en partisjon — gjensidig utelukkende og dekker alt (`ΣP(A_i) = 1`)" }
  - { sym: "P(A)",    means: "marginal sannsynlighet for `A` (priorvekt)" }
  - { sym: "P(B|A)",  means: "sannsynlighet for `B` gitt `A`" }
  - { sym: "P(B)",    means: "den marginale (totale) sannsynligheten for `B`" }
  - { sym: "P(A ∩ B)", means: "fellessannsynlighet, `= P(A)·P(B|A)`" }

filters:
  computes: [exact_probability, marginal_probability, conditional_probability, joint_probability]
  random_variable: [discrete_count]
  setup: [single_population]
  structural_cues: [conditional_given, more_than_two_categories, disjoint_events, conditioning_on_complement, andel_og_rate_per_gruppe]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_variants:
  - label: "Forover: finn `P(B)`"
    recognition: "«Hva er den totale sannsynligheten for `B`?», «hva er sjansen for et positivt testresultat samlet?». Partisjoner sample-rommet og summer."
    steps:
      - "Identifiser partisjonen (typisk `A` og `Ā`, eller flere disjunkte hendelser som dekker hele utfallsrommet)"
      - "Skriv ned marginalsannsynlighetene `P(A)`, `P(Ā)` og de betingede `P(B|A)`, `P(B|Ā)`"
      - { text: "Pass på lesemåten: '1 % AV gruppe A er defekt' er BETINGET `P(D|A) = 0.01`. '1 % ER fra A og defekt' er JOINT `P(A ∩ D) = 0.01` — bruk joint-varianten under hvis det er joint.", conditional: true }
      - "Sjekk at `P(A) + P(Ā) = 1` (eller at alle marginalsannsynlighetene summeres til 1 ved flere hypoteser)"
      - text: "Sett inn i formelen:"
        formula: "P(B) = Σ_i P(A_i)·P(B|A_i)"
      - text: "Eksempel — 2 grupper (jenter/gutter, drikker tran):"
        formula: "P(T) = P(J)·P(T|J) + P(J̄)·P(T|J̄) = 0.52·0.23 + 0.48·0.34 = 0.2828"
        example: true
      - text: "Eksempel — 3 grupper (maskin A, B, C med ulike defektrater):"
        formula: |-
          P(D) = P(A)·P(D|A) + P(B)·P(D|B) + P(C)·P(D|C)
               = 0.50·0.01 + 0.30·0.02 + 0.20·0.05 = 0.021
        example: true

  - label: "Joint-form: når du har P(A ∩ B) i stedet for P(B|A)"
    recognition: "«Du har simultansannsynligheter, ikke betingede», eller «P(A ∩ B) gitt for hver delpopulasjon». Summer rett over partisjonen."
    steps:
      - "Gjenkjenn ordlyden: 'X % er fra A_i og B' (joint) vs. 'X % AV A_i er B' (betinget)"
      - text: "Bruk den enklere summen — disjunkte måter B kan inntreffe på:"
        formula: "P(B) = P(A ∩ B) + P(Ā ∩ B)"
      - text: "Generelt for flere grupper:"
        formula: "P(B) = Σ_i P(A_i ∩ B)"
      - text: "Eksempel — 'av alle studenter er 12 % jenter som består og 14 % gutter som består':"
        formula: "P(består) = P(J ∩ består) + P(J̄ ∩ består) = 0.12 + 0.14 = 0.26"
        example: true
      - text: "Eksempel — produksjonslinje, joint-tall direkte: 0.5 % A&defekt, 0.6 % B&defekt, 1.0 % C&defekt:"
        formula: "P(D) = 0.005 + 0.006 + 0.010 = 0.021"
        example: true
      - { text: "Hvis du har en blanding av betingede og joint: konvertér før du summerer. `P(A_i ∩ B) = P(A_i)·P(B|A_i)`.", conditional: true }

  - label: "Finn ukjent betinget (når total P(B) er gitt)"
    recognition: "Oppgaven gir TOTAL-sannsynligheten `P(B)` (samlet rate/grad), pluss andelen `P(A)` og betinget for ÉN kategori `P(B|A)`. Du skal finne betinget for den andre, `P(B|Ā)`. Klassisk eksempel: «total spiregrad 80 %, 60 % er ringblomst med spiregrad 90 % — finn spiregraden for de andre»."
    steps:
      - text: "**Steg 1 — oversett teksten til sannsynligheter.** Det som er gitt som «TOTALT», «SAMLET» eller «I SNITT» er `P(B)`. Det som er gitt FOR en spesifikk gruppe er betinget. Det som er ANDELEN av gruppen i populasjonen er marginal `P(A)`."
        cases:
          - { when: "«spiregraden TOTALT er 80 %»", then: "P(S) = 0.80 — total" }
          - { when: "«60 % er ringblomst»", then: "P(R) = 0.60 — marginal for kategorien" }
          - { when: "«spiregraden for ringblomst er 90 %»", then: "P(S | R) = 0.90 — gitt betinget" }
          - { when: "«spiregraden for de andre frøene?»", then: "P(S | R̄) = ?  — det du SØKER" }
      - text: "Skriv opp total-sannsynlighetsligningen:"
        formula: "P(B) = P(A)·P(B|A) + P(Ā)·P(B|Ā)"
      - text: "Løs algebraisk for den ukjente betingede:"
        formula: "P(B|Ā) = (P(B) − P(A)·P(B|A)) / (1 − P(A))"
      - text: "Eksempel — frøposen: `P(S) = 0.80`, `P(R) = 0.60`, `P(S|R) = 0.90`. Spiregraden for de andre:"
        formula: "P(S | R̄) = (0.80 − 0.60·0.90) / (1 − 0.60) = 0.26 / 0.40 = 0.65"
        example: true

common_traps: |
  Pass på at `A` og `Ā` er DISJUNKTE og dekker hele utfallsrommet. For mer enn
  to grupper, summer over alle: `P(B) = Σ P(A_i)·P(B|A_i)`. Sjekk at
  `P(A) + P(Ā) = 1`.

detailed_solution_variants:
  - label: "Total sannsynlighet"
    solutions:
      - source: "Eksamen mai25 · oppgave 2c"
        question: "23 % av jentene og 34 % av guttene drikker tran daglig. Populasjonen er 52 % jenter og 48 % gutter. Finn `P(T)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `J` (jente) og `J̄` (gutt) – disjunkte og dekker hele utfallsrommet." }
              - { text: "La `T` være hendelsen 'drikker tran daglig'." }
              - { text: "Marginalsannsynligheter: `P(J) = 0.52`, `P(J̄) = 0.48`." }
              - { text: "Betingede sannsynligheter: `P(T|J) = 0.23`, `P(T|J̄) = 0.34`." }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Setningen om total sannsynlighet gir:" }
              - { indent: "`P(T) = P(J)·P(T|J) + P(J̄)·P(T|J̄)`" }
              - { text: "Innsetting av tallene:" }
              - { indent: "`= 0.52·0.23 + 0.48·0.34`" }
              - { indent: "`= 0.1196 + 0.1632`" }
        result: "`P(T) = 0.2828` (28.28 %)"
      - source: "Praksis · produksjonslinje"
        question: "Tre maskiner produserer komponenter. Maskin A lager 50 % med defektrate 1 %, maskin B lager 30 % med defektrate 2 %, og maskin C lager 20 % med defektrate 5 %. Hva er den totale sannsynligheten for at en tilfeldig valgt komponent er defekt?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `{A, B, C}` – maskinen som produserte komponenten (disjunkt og dekkende)." }
              - { text: "La `D` være hendelsen 'komponenten er defekt'." }
              - { text: "Marginalsannsynligheter: `P(A) = 0.50`, `P(B) = 0.30`, `P(C) = 0.20`." }
              - { text: "Betingede defektrater: `P(D|A) = 0.01`, `P(D|B) = 0.02`, `P(D|C) = 0.05`." }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Summer bidragene fra hver maskin:" }
              - { indent: "`P(D) = P(A)·P(D|A) + P(B)·P(D|B) + P(C)·P(D|C)`" }
              - { text: "Innsetting:" }
              - { indent: "`= 0.50·0.01 + 0.30·0.02 + 0.20·0.05`" }
              - { indent: "`= 0.005 + 0.006 + 0.010`" }
              - { comment: "Sjekk: `P(A) + P(B) + P(C) = 1` – partisjonen er gyldig." }
        result: "`P(D) = 0.021` (2.1 %)"
      - source: "Praksis · medisinsk test"
        question: "I en befolkning er 1 % syke og 99 % friske. Testen er 99 % nøyaktig på syke (sensitivitet) og 95 % nøyaktig på friske (spesifisitet, dvs. 5 % falsk positiv). Hva er den totale sannsynligheten for at en tilfeldig testet person får positivt testresultat?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `S` (syk) og `S̄` (frisk) – disjunkte og dekker hele utfallsrommet." }
              - { text: "La `+` være hendelsen 'positivt testresultat'." }
              - { text: "Marginalsannsynligheter: `P(S) = 0.01`, `P(S̄) = 0.99`." }
              - { text: "Betingede sannsynligheter:" }
              - { indent: "`P(+|S) = 0.99` (sensitivitet – sann positiv)" }
              - { indent: "`P(+|S̄) = 0.05` (falsk positiv = 1 − spesifisitet)" }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Setningen om total sannsynlighet gir:" }
              - { indent: "`P(+) = P(S)·P(+|S) + P(S̄)·P(+|S̄)`" }
              - { text: "Innsetting:" }
              - { indent: "`= 0.01·0.99 + 0.99·0.05`" }
              - { indent: "`= 0.0099 + 0.0495`" }
              - { comment: "Falsk-positiv-bidraget dominerer fordi friske er en mye større gruppe." }
        result: "`P(+) = 0.0594` (5.94 %)"

