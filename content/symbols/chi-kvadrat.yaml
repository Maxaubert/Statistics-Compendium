id: chi-kvadrat
sym: "χ²"
short_def: "Kjikvadrat – både navnet på en familie sannsynlighetsfordelinger og navnet på testobservatoren som følger den."
contexts:
  - usage: "Testobservator i kjikvadrat-tester"
    detail: |
      Tenk på χ² som et 'avstandsmål' mellom det du observerte og det
      H₀ forutsa. Stor χ² betyr at dataene avviker mye fra det modellen
      tilsa – mistenkelig nok til kanskje å forkaste H₀.

      Formel: χ² = Σ (O − E)² / E, der O er observert antall i hver
      kategori og E er forventet antall under H₀. Kvadrering gjør at
      avvik begge veier teller positivt; deling på E vekter slik at
      små forventede frekvenser ikke dominerer.

      Sammenlign tallet du regner ut med en kritisk verdi fra
      χ²-tabellen (vedlegg E.5) for ν frihetsgrader. Faller χ² over
      kritisk verdi (eller p < α), forkast H₀.

      Ikke å forveksle med χ alene; vi bruker nesten alltid χ² (kvadrert)
      i denne sammenhengen.
    entry_refs:
      - kjikvadrat-goodness-of-fit
      - kjikvadrat-uavhengighet
  - usage: "Kjikvadratfordelingen"
    detail: |
      Kjikvadratfordelingen er fordelingen til en sum av kvadrerte
      uavhengige standard normalvariabler. Den er skjev mot høyre,
      kun positive verdier, og blir mer symmetrisk når frihetsgradene
      ν vokser.

      Du møter den i to typiske sammenhenger: (1) kjikvadrat-tester
      som over, og (2) konfidensintervall for varians, der
      (n−1)s²/σ² ~ χ²(n−1).
    entry_refs:
      - ki-varians
see_also:
