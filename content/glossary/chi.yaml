id: chi
term_no: Kjikvadrat-fordeling (χ², chi)
short_def: "Skjev fordeling brukt for KI for `σ²`, goodness-of-fit og uavhengighetstest. Eneste parameter er frihetsgrader."
filters:
  distribution_assumption: [chi_squared]
  computes: [hypothesis_test, confidence_interval, test_independence, std_dev]
  tooling: [chi_square_quantile_table_E6]
  setup: [joint_table_given]
  structural_cues: [joint_table_present, more_than_two_categories]
  parameters_known: [population_variance_unknown]
aliases:
  - kjikvadrat
  - kjikvadratet
  - kjikvadrat-fordeling
  - kjikvadrat-fordelingen
  - kjikvadratfordeling
  - kjikvadratfordelingen
  - chi
  - kji
  - χ²
long_def: |
  Den greske bokstaven `χ` (chi/kji) møter du nesten alltid i kvadrert form:
  `χ²`. Brukes til:

  - KI for varians `σ²`
  - Goodness-of-fit-test
  - Uavhengighetstest i krysstabell

  Fordelingen har frihetsgrader som eneste parameter og er ikke-symmetrisk
  (skjev mot høyre). Slå opp kvantiler i E.6-tabellen.
see_also:
