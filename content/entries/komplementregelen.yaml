id: komplementregelen
name_no: "Komplementregelen"
type: rule
category: probability_rule
tagline: "Sannsynligheten for at en hendelse IKKE inntreffer."

formula_main: "P(A̅) = 1 − P(A)"
formula_latex: "P(\\overline{A}) = 1 - P(A)"

what_it_does: |
  Den enkleste, men kraftigste, regelen i sannsynlighetsregning. Sier at
  sannsynligheten for at noe IKKE skjer er én minus sannsynligheten for
  at det skjer. Brukes nesten alltid når oppgaven inneholder ord som
  "minst" eller "ingen", fordi direkte beregning blir mye vanskeligere.

why_use: |
  Mange oppgaver er enklere å løse via komplementet enn direkte. Klassisk
  eksempel: "minst én suksess i `n` forsøk". Direkte ville krevet sum over
  alle `k = 1, 2, ..., n`. Via komplement: bare `1 − P(0 suksesser)`, én enkel
  utregning.

recognition_cues:
  - "Spørsmålet inneholder ord som 'minst én', 'minst `k`', 'ingen', 'høyst `k`', 'ikke alle'"
  - "Direkte beregning av det som spørres etter ville kreve sum over mange utfall"
  - "Negasjonen (det motsatte) er enklere å beskrive enn det spørsmålet ber om"
  - "Du har en kumulativ tabell (E.1, E.2, E.3) som gir `P(X ≤ k)`, men spørsmålet er om `P(X ≥ k)`"
  - "Spørsmål som starter med 'finn `n` slik at sannsynligheten for ... overstiger ...' (terskelproblem)"

when_NOT_to_use:
  - "Hendelsen er en union eller skjæring av flere ulike kategorier → bruk [unionssetningen](/entry/unionssetningen) eller [produktregelen](/entry/produktregel) i stedet"
  - "Du har betingede sannsynligheter og partisjoner → bruk [total sannsynlighet](/entry/total-sannsynlighet)"
  - "Du må snu retning på en betinget sannsynlighet → bruk [Bayes' setning](/entry/bayes-setning)"

symbols:
  - { sym: "A",     means: "en hendelse" }
  - { sym: "A̅",     means: "komplementet av `A` (`Ā` inntreffer hvis `A` ikke gjør det)" }

filters:
  computes: [exact_probability, at_least_k, find_n_for_threshold]
  random_variable: [discrete_count, continuous, time_until_event]
  setup: [single_population]
  structural_cues: [complement_pattern, independent_events, time_until_first]
  parameters_known: []
  distribution_assumption: [none_assumed, binomial, poisson, normal, exponential]
  tooling: [calculator_only]
solution_variants:
  - label: "Minst k"
    steps:
      - "Identifiser hendelsen: 'minst k hendelser inntreffer', altså `P(X ≥ k)`"
      - text: "Skriv om via komplement (NB: `k − 1`, ikke `k`):"
        formula: "P(X ≥ k) = 1 − P(X ≤ k − 1)"
      - "Slå opp `P(X ≤ k − 1)` i kumulativ tabell (E.1 binomial, E.2 poisson) eller regn ut direkte"
      - text: "Trekk fra 1 og les av svaret. Eksempel:"
        formula: "P(X ≥ 3) = 1 − P(X ≤ 2)"
      - { text: "Hvis indeksen i 'minst k' tolkes feil, du ender med `P(X ≤ k)` — ikke `P(X ≤ k−1)` — så svaret er for stort", conditional: true }
      - text: "Hvis 'minst en' er spørsmålet, det er bare `1 − P(ingen)` — ingen tabelloppslag nødvendig (f.eks. binomial):"
        formula: "P(minst en) = 1 − (1 − p)^n"
        conditional: true

  - label: "Ingen / null"
    steps:
      - "Identifiser hendelsen som `P(X = 0)` — sannsynligheten for null forekomster"
      - text: "Velg riktig pmf-uttrykk basert på fordeling: Poisson, binomial, eller geometrisk (avh. av definisjon)."
        formula: "Poisson: P(X = 0) = e^(−λt);  Binomial: P(X = 0) = (1 − p)^n"
      - text: "Sett inn parametrene direkte. Eksempel: Poisson med `λ = 2`, `t = 1.5`:"
        formula: "P(X = 0) = e^(−3) ≈ 0.0498"
        example: true
      - text: "Hvis spørsmålet egentlig er om 'minst én', bruk komplementet:"
        formula: "P(X ≥ 1) = 1 − P(X = 0)"
      - { text: "Hvis hendelsene IKKE er uavhengige, `(1 − p)^n` gjelder ikke — bruk hypergeometrisk eller direkte telling i stedet", conditional: true }

  - label: "Ikke alle"
    steps:
      - "Identifiser 'alle'-hendelsen først: f.eks. 'alle n forsøk er suksess' har sannsynlighet `p^n` (uavhengige)"
      - text: "Komplementet til 'alle' er 'minst én er IKKE':"
        formula: "P(ikke alle) = 1 − P(alle) = 1 − p^n"
      - "Pass på: 'ikke alle' ≠ 'ingen'. 'Ingen' er `(1 − p)^n`, 'ikke alle' er `1 − p^n`"
      - text: "Beregn og les av. Eksempel: `P(alle 5 hjerter) = 0.000495`:"
        formula: "P(ikke alle hjerter) = 1 − 0.000495 = 0.999505"
        example: true
      - { text: "Hvis hendelsene IKKE er uavhengige (f.eks. trekk uten tilbakelegging), bruk hypergeometrisk for `P(alle)` før du tar komplementet", conditional: true }

  - label: "Finn n for terskel"
    steps:
      - text: "Skriv kravet som ulikhet: 'minst én hendelse skjer med sannsynlighet ≥ T':"
        formula: "1 − (1 − p)^n ≥ T"
      - text: "Isoler `(1 − p)^n`:"
        formula: "(1 − p)^n ≤ 1 − T"
      - text: "Ta logaritme på begge sider — husk at `ln(1 − p) < 0`, så ulikheten snur:"
        formula: "n ≥ ln(1 − T) / ln(1 − p)"
      - text: "Rund OPP til nærmeste heltall (f.eks. `p = 0.05`, `T = 0.99`):"
        formula: "n ≥ ln(0.01)/ln(0.95) ≈ 89.78  →  n = 90"
        example: true
      - text: "Verifiser ved innsetting:"
        formula: "1 − 0.95^90 ≈ 0.9906 ≥ 0.99  (OK)"
      - { text: "Hvis du glemmer å snu ulikheten ved logaritme av tall < 1, du får feil retning og dermed feil n", conditional: true }
      - { text: "Hvis hendelsene IKKE er uavhengige, bruk addisjon med betinget-sannsynlighet i stedet for `(1 − p)^n`", conditional: true }

common_traps: |
  - **"Minst `k`" indeks-feil**: `P(X ≥ k) = 1 − P(X ≤ k − 1)`, IKKE `1 − P(X ≤ k)`. For `k = 3`: `P(X ≥ 3) = 1 − P(X ≤ 2)`.
  - **"Ikke alle" ≠ "ingen"**: Hvis `A` er "alle 5 kort er hjerter", så er `Ā` "minst ett kort er IKKE hjerter" (ikke "ingen er hjerter"). De to siste er forskjellige hendelser.
  - **Komplement av disjunkt union**: `P(Ā ∩ B̄) = 1 − P(A ∪ B)`, via De Morgans lov. Brukes for "verken `A` eller `B`".
  - **Komplement i tellinger**: For "minst én suksess", komplementet er "null suksesser" (ofte enkelt å regne).

detailed_solution_variants:
  - label: "Minst k"
    solutions:
      - source: "Praksis · terninger"
        question: "Du kaster fire vanlige terninger. Hva er sannsynligheten for at minst én viser sekser?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "La `X` være antall seksere blant de fire kastene. Hver terning er uavhengig, og `P(sekser) = 1/6` for hver."
              - text: "Spørsmålet er `P(X ≥ 1)` — typisk 'minst én'-mønster som direkte ville krevd å summere over `X = 1, 2, 3, 4`."
          - label: "Komplement"
            lines:
              - text: "Komplementet til 'minst én sekser' er 'ingen seksere i det hele tatt', altså `X = 0`."
              - text: "Da har vi `P(X ≥ 1) = 1 − P(X = 0)`."
          - label: "Beregning"
            lines:
              - text: "Hver terning unngår sekser med sannsynlighet `5/6`, og terningene er uavhengige:"
              - indent: "`P(X = 0) = (5/6)⁴ = 625/1296 ≈ 0.4823`"
              - text: "Trekker fra 1:"
              - indent: "`P(X ≥ 1) = 1 − 0.4823 = 0.5177`"
        result: "`P(minst én sekser) ≈ 0.5177`"

      - source: "Praksis · vulkanutbrudd (Poisson)"
        question: "Vulkanutbrudd i et område modelleres Poisson med rate `0.03` utbrudd per år. Hva er sannsynligheten for minst to utbrudd i løpet av de neste 50 årene?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "Antall utbrudd `X` i 50 år er Poisson med `λt = 0.03 · 50 = 1.5`."
              - text: "Vi vil ha `P(X ≥ 2)`. Direkte: `P(X = 2) + P(X = 3) + ...` (uendelig sum)."
          - label: "Komplement"
            lines:
              - text: "Komplementet til 'minst 2' er `X ≤ 1`, altså 0 eller 1 utbrudd:"
              - indent: "`P(X ≥ 2) = 1 − P(X = 0) − P(X = 1)`"
              - comment: "Merk: `1 − P(X ≤ 1)`, IKKE `1 − P(X ≤ 2)` — vanlig indeks-felle."
          - label: "Beregning"
            lines:
              - text: "Med `λt = 1.5`:"
              - indent: "`P(X = 0) = e^(−1.5) ≈ 0.2231`"
              - indent: "`P(X = 1) = 1.5 · e^(−1.5) ≈ 0.3347`"
              - text: "Sum:"
              - indent: "`P(X ≤ 1) ≈ 0.2231 + 0.3347 = 0.5578`"
              - text: "Komplement:"
              - indent: "`P(X ≥ 2) = 1 − 0.5578 = 0.4422`"
        result: "`P(X ≥ 2) ≈ 0.4422`"

      - source: "Praksis · indeks-felle for 'minst k'"
        question: "En binomisk variabel har `n = 10`, `p = 0.3`. Forklar hvorfor `P(X ≥ 2) = 1 − P(X ≤ 1)` og IKKE `1 − P(X ≤ 2)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Hendelsen 'minst 2' består av utfallene `X = 2, 3, 4, ..., 10`."
              - text: "Komplementet er alle utfall som IKKE er minst 2, altså `X = 0` eller `X = 1`."
          - label: "Komplement"
            lines:
              - text: "Komplementet er `X ≤ 1` (ikke `X ≤ 2`), fordi `X = 2` selv hører til hovedhendelsen 'minst 2'."
              - indent: "`P(X ≥ 2) = 1 − P(X ≤ 1)`"
              - comment: "Tommelfingerregel: `P(X ≥ k) = 1 − P(X ≤ k − 1)`."
          - label: "Beregning"
            lines:
              - text: "Slå opp i Tabell E.1 (binomisk kumulativ) med `n = 10`, `p = 0.3`:"
              - table_lookup: { ref: "E.1", text: "`P(X ≤ 1) ≈ 0.1493` for `n = 10`, `p = 0.3`" }
              - text: "Komplement:"
              - indent: "`P(X ≥ 2) = 1 − 0.1493 = 0.8507`"
              - text: "Hadde vi feilaktig brukt `1 − P(X ≤ 2) ≈ 1 − 0.3828 = 0.6172`, ville vi mistet bidraget fra `X = 2` (som er ca. `0.2335`)."
        result: "`P(X ≥ 2) ≈ 0.8507` (ikke `0.6172`)"

  - label: "Ingen / null"
    solutions:
      - source: "Praksis · binomisk kvalitetskontroll"
        question: "I en sending på `n = 10` komponenter er sannsynligheten for at en gitt komponent er defekt `p = 0.05`. Hva er sannsynligheten for at INGEN er defekte?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "La `X` være antall defekte. Da er `X ~ Bin(10, 0.05)`."
              - text: "Spørsmålet er `P(X = 0)` — typisk 'ingen / null'-mønster."
          - label: "Komplement"
            lines:
              - text: "Her bruker vi IKKE komplement direkte; men 'ingen defekte' er ofte selv komplementet til 'minst én defekt'."
              - indent: "`P(X = 0) = 1 − P(X ≥ 1)`"
              - text: "Det er like enkelt å regne `P(X = 0)` direkte fra binomisk pmf."
          - label: "Beregning"
            lines:
              - text: "Direkte fra pmf:"
              - indent: "`P(X = 0) = (1 − p)^n = 0.95^10`"
              - indent: "`0.95^10 ≈ 0.5987`"
        result: "`P(X = 0) ≈ 0.5987`"

      - source: "Praksis · Poisson-anrop"
        question: "Antall anrop til en sentralbord er Poisson med rate `0.3` anrop per minutt. Hva er sannsynligheten for INGEN anrop i løpet av 10 minutter?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "Antall anrop `X` i 10 minutter er Poisson med `λt = 0.3 · 10 = 3`."
              - text: "Vi spør `P(X = 0)`."
          - label: "Komplement"
            lines:
              - text: "'Ingen anrop' er selv komplementet til 'minst ett anrop':"
              - indent: "`P(X ≥ 1) = 1 − P(X = 0)`"
              - text: "Vi regner `P(X = 0)` direkte og ser at det også gir oss `P(X ≥ 1)` gratis."
          - label: "Beregning"
            lines:
              - text: "Poisson pmf ved `k = 0`:"
              - indent: "`P(X = 0) = e^(−λt) = e^(−3)`"
              - indent: "`e^(−3) ≈ 0.0498`"
        result: "`P(X = 0) ≈ 0.0498`"

  - label: "Ikke alle"
    solutions:
      - source: "Praksis · komponentpålitelighet"
        question: "Et system består av 5 komponenter i serie. Hver komponent fungerer uavhengig med sannsynlighet `p = 0.95`. Hva er sannsynligheten for at minst én komponent feiler (altså at IKKE alle fungerer)?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "La `A` = 'alle 5 komponenter fungerer'. Komponentene er uavhengige."
              - text: "'Ikke alle fungerer' er det samme som 'minst én feiler' — komplementet av `A`."
          - label: "Komplement"
            lines:
              - text: "Skriv om eksplisitt:"
              - indent: "`P(ikke alle OK) = 1 − P(alle OK) = 1 − p⁵`"
              - comment: "Pass på: 'ikke alle' er IKKE det samme som 'ingen' — sistnevnte ville vært `(1 − p)⁵ ≈ 3·10⁻⁷`."
          - label: "Beregning"
            lines:
              - text: "Med `p = 0.95`:"
              - indent: "`P(alle OK) = 0.95⁵ ≈ 0.7738`"
              - text: "Komplement:"
              - indent: "`P(minst én feiler) = 1 − 0.7738 = 0.2262`"
        result: "`P(minst én feiler) ≈ 0.2262`"

      - source: "Praksis · quiz med 10 ja/nei-spørsmål"
        question: "En student gjetter helt tilfeldig på 10 ja/nei-spørsmål. Hva er sannsynligheten for at IKKE alle blir riktige?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "La `A` = 'alle 10 svar er riktige'. Hvert svar er uavhengig med `p = 0.5`."
              - text: "Hendelsen 'ikke alle riktige' er komplementet av `A`."
          - label: "Komplement"
            lines:
              - text: "'Ikke alle riktige' = 'minst ett galt':"
              - indent: "`P(ikke alle riktige) = 1 − P(alle riktige) = 1 − 0.5^10`"
          - label: "Beregning"
            lines:
              - text: "Sett inn:"
              - indent: "`0.5^10 = 1/1024 ≈ 0.000977`"
              - indent: "`P(ikke alle riktige) = 1 − 0.000977 ≈ 0.9990`"
        result: "`P(ikke alle riktige) ≈ 0.999`"

  - label: "Finn n for terskel"
    solutions:
      - source: "Praksis · sjeldne suksesser"
        question: "Et eksperiment lykkes med sannsynlighet `p = 0.02` per forsøk. Hvor mange uavhengige forsøk trenger man for at sannsynligheten for minst én suksess skal være minst `0.95`?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "La `n` være antall forsøk og `X` antall suksesser. Vi krever `P(X ≥ 1) ≥ 0.95`."
              - text: "Direkte uttrykt blir dette en kompleks sum; komplement gir én linje."
          - label: "Komplement"
            lines:
              - text: "Komplementet av 'minst én suksess' er 'null suksesser':"
              - indent: "`P(X ≥ 1) = 1 − (1 − p)^n = 1 − 0.98^n`"
              - text: "Kravet blir:"
              - indent: "`1 − 0.98^n ≥ 0.95  ⇔  0.98^n ≤ 0.05`"
          - label: "Beregning"
            lines:
              - text: "Ta naturlig logaritme på begge sider. Siden `ln(0.98) < 0`, snur ulikheten:"
              - indent: "`n · ln(0.98) ≤ ln(0.05)`"
              - indent: "`n ≥ ln(0.05) / ln(0.98)`"
              - indent: "`n ≥ (−2.9957) / (−0.0202) ≈ 148.3`"
              - text: "Rund OPP til nærmeste heltall:"
              - indent: "`n = 149`"
              - text: "Verifiser:"
              - indent: "`1 − 0.98^149 ≈ 1 − 0.04945 ≈ 0.9506 ≥ 0.95`  ✓"
        result: "`n = 149`"

      - source: "Praksis · myntkast"
        question: "Hvor mange myntkast trengs for at sannsynligheten for minst én krone skal være minst `0.99`?"
        sections:
          - label: "Identifisering"
            lines:
              - text: "Hvert kast gir krone med `p = 0.5`, uavhengig av andre kast."
              - text: "Vi vil ha `P(minst én krone i n kast) ≥ 0.99`."
          - label: "Komplement"
            lines:
              - text: "Komplementet er 'ingen krone i n kast', altså n mynt på rad:"
              - indent: "`P(minst én krone) = 1 − 0.5^n`"
              - text: "Kravet blir:"
              - indent: "`1 − 0.5^n ≥ 0.99  ⇔  0.5^n ≤ 0.01`"
          - label: "Beregning"
            lines:
              - text: "Ta logaritme (base 2 er praktisk her, men ln virker like fint):"
              - indent: "`n · ln(0.5) ≤ ln(0.01)`"
              - indent: "`n ≥ ln(0.01) / ln(0.5) = log₂(100) ≈ 6.6439`"
              - text: "Rund OPP:"
              - indent: "`n = 7`"
              - text: "Verifiser:"
              - indent: "`1 − 0.5^7 = 1 − 1/128 ≈ 0.9922 ≥ 0.99`  ✓"
              - indent: "`1 − 0.5^6 = 1 − 1/64 ≈ 0.9844 < 0.99`  (så `n = 6` er for lite)"
        result: "`n = 7`"

related:
  - { id: "unionssetningen",   kind: "entry" }
  - { id: "binomial-fordeling", kind: "entry" }
  - { id: "poisson-fordeling", kind: "entry" }

tools:
  - "Tabell E.1 – Kumulativ binomisk sannsynlighet (slå opp P(X ≤ k) for binomial)"
  - "Tabell E.2 – Kumulativ poissonfordeling (slå opp P(X ≤ k) for poisson)"
  - "Tabell E.3 – Z-tabell (slå opp G(z) når kontinuerlig)"
  - "Kalkulator: subtraksjon"
