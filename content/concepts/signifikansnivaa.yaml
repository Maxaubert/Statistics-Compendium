id: signifikansnivaa
name_no: "Signifikansnivå α"
type: concept
tagline: "Risikoen man er villig til å ta for å gjøre en type-I-feil (forkaste sann H₀)."

what_it_means: |
  Signifikansnivået α er sannsynligheten for å forkaste H₀ når H₀ faktisk
  er sann (type-I-feil). Vanlige valg er α = 0.10, 0.05, 0.01.

  Konfidensnivå er 1 - α: et 95 % konfidensintervall har α = 0.05.

  Tre måter å bruke:
  1. Sammenligne testobservator med kvantil z_α (eller t_α): forkast hvis testobs > kvantil.
  2. Sammenligne p-verdi med α: forkast hvis p < α.
  3. Bygge konfidensintervall: med (1-α)·100 % konfidensnivå.

recognition_cues:
  - "Oppgaven angir 'signifikansnivå α = ...' eller 'α-nivå'"
  - "'Konfidensnivå 95 %' tilsvarer α = 0.05"
  - "Du skal sammenligne en p-verdi mot α for konklusjon"

filters:
  computes: [hypothesis_test, confidence_interval]

