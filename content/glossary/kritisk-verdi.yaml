id: kritisk-verdi
term_no: Kritisk verdi
short_def: "Tabellverdien testobservatoren må passere for at `H₀` skal forkastes."
filters:
  computes: [hypothesis_test, test_independence]
  parameters_known: [alpha_significance]
  tooling: [normal_quantile_table_E4, t_quantile_table_E5, chi_square_quantile_table_E6]
  distribution_assumption: [chi_squared, normal, t_distribution]
long_def: |
  Den **kritiske verdien** er grensen testobservatoren må passere for at `H₀`
  skal forkastes — den deler tallinja i et forkastningsområde og et akseptområde.

  **Slik finner du den:**

  1. Velg signifikansnivå `α`.
  2. Slå opp i riktig tabell: **E.4** (z), **E.5** (t, med `df`), **E.6** (χ²)
     eller **E.8** (F).
  3. **Ensidig** test bruker `α`; **tosidig** bruker `α/2` (halve `α` i hver hale).

  **Forkastningsregel:** forkast `H₀` når testobservatoren er mer ekstrem enn den
  kritiske verdien — f.eks. `T > t_α` (høyresidig), `T < −t_α` (venstresidig)
  eller `|Z| > z_(α/2)` (tosidig).

  Alternativ vei til samme konklusjon: regn [p-verdien](glossary:p-verdi-glos) og
  forkast hvis `p < α`.
aliases:
