id: gunstige-pa-mulige
name_no: "Gunstige på mulige (uniform sannsynlighetsfordeling)"
type: method
tagline: "Når alle utfall er like sannsynlige: `P(A) = antall gunstige / antall mulige`."

what_it_means: |
  I en uniform sannsynlighetsfordeling – der alle utfall er like sannsynlige
  – kan vi regne ut sannsynligheten for en hendelse `A` som:

    `P(A) = antall gunstige utfall / antall mulige utfall`

  Mer formelt: hvis utfallsrommet `Ω` har `|Ω|` utfall som alle er like
  sannsynlige, og `|A|` er antallet utfall som tilhører `A`, så er
  `P(A) = |A| / |Ω|`.

  Dette er fundamentalt for kombinatoriske sannsynlighetsoppgaver
  (kortspill, terningkast, urnemodeller). Telling av "gunstige" og
  "mulige" gjøres typisk med binomialkoeffisienten.

recognition_cues:
  - "Hver elementært utfall er likt sannsynlig"
  - "Trekning fra urne, kortstokk, eller annen 'tilfeldig' kilde"
  - "Spørsmål om sannsynlighet uten en navngitt fordeling"
  - "Det første steget er å telle 'gunstige' og 'mulige'"

when_NOT_to_use:
  - "Utfall er IKKE like sannsynlige → bruk en navngitt fordeling ([binomial](/entry/binomial-fordeling), [hypergeometrisk](/entry/hypergeometrisk-fordeling), [normal](/entry/normalfordeling), …)"
  - "Du må telle 'gunstige' eller 'mulige' først → bruk en av kombinatorikk-entryene (ordnet/uordnet utvalg) for selve tellingen"
  - "Du teller ordnede sekvenser med tilbakelegging → bruk [ordnet utvalg med tilbakelegging](/entry/ordnet-utvalg-med-tilbakelegging) (`n^k`)"
  - "Du teller ordnede sekvenser uten tilbakelegging → bruk [ordnet utvalg uten tilbakelegging](/entry/ordnet-utvalg-uten-tilbakelegging) (`n!/(n−k)!`)"
  - "Du teller uordnede utvalg uten tilbakelegging → bruk [uordnet utvalg uten tilbakelegging](/entry/uordnet-utvalg-uten-tilbakelegging) (`C(n,k)`)"
  - "Du trekker uten tilbakelegging fra en endelig populasjon med kjent suksessrate `K/N` → bruk direkte [hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling) i stedet for å telle manuelt"

filters:
  computes: [exact_probability, combinatorial_count]
  random_variable: [discrete_count]
  setup: [single_population, without_replacement, finite_pool]
  structural_cues: [independent_events]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only, calculator_binomial_coef]

common_traps: |
  - **Forutsetningen om like sannsynlige utfall**: formelen `|A|/|Ω|` gjelder
    KUN når alle elementære utfall er like sannsynlige. Hvis trekningen er
    skjev (vektet terning, ulikt fordelte kuler), må du regne med faktiske
    sannsynligheter — telling holder ikke.
  - **Ordnet vs. uordnet i teller og nevner**: pass på at "gunstige" og "mulige"
    telles på SAMME måte. Hvis nevneren er `C(N, k)` (uordnet), må telleren også
    være uordnet. Blander du `n!/(n−k)!` og `C(n,k)`, blir svaret feil.
  - **"Minst én"-spørsmål**: tell heller komplementet ("ingen") og bruk
    `P(minst én) = 1 − P(ingen)` — det er nesten alltid raskere enn å summere
    `P(nøyaktig 1) + P(nøyaktig 2) + …`.
  - **Dobbelttelling**: hvis du teller "alle hjerter" som `C(13,5)` OG "alle
    ruter" som `C(13,5)`, må du IKKE telle utvalg som inneholder begge to
    ganger — disjunkte tilfeller summeres, overlappende krever
    [unionssetningen](/entry/unionssetningen).

