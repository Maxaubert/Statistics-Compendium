id: kumulativ
term_no: Kumulativ fordeling
short_def: "`F(x) = P(X ≤ x)` — sannsynligheten for at `X` er mindre enn eller lik `x`."
long_def: |
  Standardnormaltabellen E.3 gir `G(z) = P(Z ≤ z)`.

  - `P(X > x) = 1 − F(x)`
  - `P(a < X ≤ b) = F(b) − F(a)`

  Pass på om tabellen er kumulativ eller halekumulativ — de fleste i
  pensum er `P(X ≤ x)`.
