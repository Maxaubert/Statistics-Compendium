long_def: |
  Oppgaver av typen «hvilken fordeling beskriver dette?» løses ved å lese
  strukturen i problemet — ikke ved å gjette navn. Sjekklisten:

  ## Diskrete (telle-)variabler

  - [Bernoulli](/glossary/bernoulli-forsoek) — ett enkelt forsøk med to utfall (suksess/fiasko), sannsynlighet `p`. Byggekloss for binomial.
  - [Binomial](/entry/binomial-fordeling) — antall suksesser i `n` UAVHENGIGE forsøk med fast `p` (med tilbakelegging). Cue: «`n` forsøk», «sannsynlighet `p`», «hvor mange klarer …».
  - [Hypergeometrisk](/entry/hypergeometrisk-fordeling) — antall suksesser i `n` trekninger UTEN tilbakelegging fra endelig populasjon `N` med `K` suksesser. Cue: «trekker uten å legge tilbake», «av de `K` av `N` får jeg …».
  - [Poisson](/entry/poisson-fordeling) — antall hendelser i et fast tids-/areal-/volumintervall, rate `λ` gitt. Cue: «i gjennomsnitt `λ` per …», «antall kunder per time», «antall feil per meter».

  ## Kontinuerlige (måle-)variabler

  - [Normalfordeling](/entry/normalfordeling) — symmetrisk klokkeform. Cue: «`N(μ, σ)`», «normalfordelt med …», eller indirekte via [sentralgrenseteoremet](/glossary/sentralgrenseteoremet-glos) når man ser på gjennomsnitt/sum av mange uavhengige.
  - [Eksponential](/entry/eksponential-fordeling) — ventetid TIL første hendelse i en poissonprosess med rate `λ`. Cue: «tid til neste», «levetid», «hvor lenge går det før …».
  - [t-fordeling](/glossary/t-fordeling) — standardisert gjennomsnitt når `σ` IKKE er kjent og må estimeres med utvalgs-`s`. Cue: hypotesetest eller KI for `μ`, og `σ` er ukjent. Parameteren er frihetsgrader `ν = n − 1`.
  - Kjikvadrat (`χ²`) — sum av kvadrerte standardnormale. Brukes i [goodness-of-fit](/entry/kjikvadrat-goodness-of-fit), [uavhengighetstest](/entry/kjikvadrat-uavhengighet) og [KI for varians](/entry/ki-mu-og-varians).

  ## Beslutningssekvens

  1. Er variabelen **diskret (heltall)** eller **kontinuerlig (måling)**?
  2. Diskret: teller jeg «antall i `n` forsøk» (binomial/hypergeom.) eller «antall hendelser per tid» (poisson)?
  3. Kontinuerlig: er det «tid til hendelse» (eksponential) eller en målbar størrelse (normal, t, χ²)?
  4. Skal jeg gjøre inferens om `μ`? Sjekk om `σ` er KJENT (`z`) eller ESTIMERT med `s` (`t`).

  ## Sammenligningstabell — diskrete fordelinger

  | Kriterium | Bernoulli | Binomial | Hypergeometrisk | Poisson |
  |---|---|---|---|---|
  | Diskret (telles)? | ✓ | ✓ | ✓ | ✓ |
  | Tilbakelegging | n/a (`n = 1`) | MED (konstant `p`) | UTEN | n/a (rate-basert) |
  | Fast antall forsøk `n` | `n = 1` | ✓ | ✓ | nei — tids-/areal-vindu |
  | Uavhengige forsøk | n/a | ✓ kreves | nei (`p` endres) | ✓ kreves |
  | Endelig pott | n/a | nei | ✓ (`N` totalt) | nei |
  | Bruker `p` | ✓ | ✓ | indirekte (`K/N`) | nei |
  | Bruker `λ` | nei | nei | nei | ✓ |
  | Parametre | `p` | `n, p` | `N, K, n` | `λ` (eller `μ = λt`) |
  | `E[X]` | `p` | `np` | `n·K/N` | `λ` |
  | Klassisk eksempel | myntkast (1 kast) | 10 kast — antall kron | trekk 5 kort — antall hjerter | antall kunder per time |

  ## Sammenligningstabell — kontinuerlige fordelinger

  | Kriterium | Normal | Eksponential | t-fordeling | Kjikvadrat |
  |---|---|---|---|---|
  | Kontinuerlig (måles)? | ✓ | ✓ | ✓ | ✓ |
  | Symmetrisk | ✓ | nei (skjev høyre) | ✓ | nei (skjev høyre) |
  | Hva måles? | målt verdi | tid TIL hendelse | standardisert snitt | sum av kvadrater |
  | Bruker `μ, σ` | ✓ direkte | nei | indirekte (standardiseres) | nei |
  | Bruker `λ` | nei | ✓ | nei | nei |
  | Parametre | `μ, σ` | `λ` | `ν = n − 1` | `ν` |
  | Antar `σ` kjent? | normal → ja, t → nei | n/a | nei — bruker `s` | n/a |
  | `E[X]` | `μ` | `1/λ` | 0 | `ν` |
  | Klassisk eksempel | IQ, høyde | levetid, ventetid | t-test for `μ` med lite `n` | varianstest, kontingenstabell |

  ## Sammenhenger mellom fordelinger

  - Sum av uavhengige normaler er normal.
  - Gjennomsnitt av `n` uavhengige variabler er tilnærmet normalt for stor `n` ifølge [sentralgrenseteoremet](/glossary/sentralgrenseteoremet-glos) (CLT) — uansett opprinnelig fordeling.
  - Når `σ` er ukjent og estimert med `s`, går normalfordelingen over til [t-fordeling](/glossary/t-fordeling) med `ν = n − 1` frihetsgrader.
  - Hypergeometrisk ≈ binomial når populasjonen er stor (utvalg mye mindre enn populasjon, typisk `n/N < 0.05`).
  - Binomial ≈ poisson når `n` er stor og `p` liten (med `λ = n·p`).
  - Binomial ≈ normal når `n·p` og `n(1−p)` begge er store nok (typisk `n·p ≥ 5` og `n(1−p) ≥ 5`).
