id: r
sym: "r"
short_def: "Utvalgskorrelasjonskoeffisient (Pearsons r) – måler styrken og retningen på den lineære sammenhengen mellom to variabler."
contexts:
  - usage: "Utvalgskorrelasjon (Pearson)"
    detail: |
      r forteller deg to ting om hvordan x og y henger sammen lineært:
      retning (tegn) og styrke (størrelse).

      Verdier:
      - r = 1: perfekt positiv lineær sammenheng (alle punkter på en
        stigende linje)
      - r = 0: ingen lineær sammenheng
      - r = −1: perfekt negativ lineær sammenheng

      Tommelfingerregel: |r| < 0.3 svak, 0.3–0.7 moderat, > 0.7 sterk.

      r² (forklart varians) tolkes som andelen av variasjonen i y som
      kan forklares ved den lineære sammenhengen med x. Eksempel:
      r = 0.8 gir r² = 0.64, så 64 % av variasjonen i y forklares.

      VIKTIG: r måler kun lineær sammenheng. r kan være 0 selv om
      det finnes en sterk ikke-lineær sammenheng (f.eks. en parabel).
      Korrelasjon er heller ikke det samme som årsakssammenheng.
    entry_refs:
      - regresjon-korrelasjonskoeffisient
      - korrelasjon-joint
see_also:
  - { id: korrelasjon-glos, kind: glossary }
  - { id: spredningsplott, kind: concept }
