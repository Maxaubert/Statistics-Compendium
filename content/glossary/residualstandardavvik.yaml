id: residualstandardavvik
term_no: Residualstandardavvik (S_E)
short_def: "Kvadratroten av residualvariansen: `S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )`. Typisk avvik fra regresjonslinjen."
filters:
  setup: [linear_relationship]
  parameters_known: [residual_variance, sum_xx_sxy, slope_se]
  computes: [std_dev, prediction_interval, hypothesis_test]
  random_variable: [slope_estimate]
  structural_cues: [linear_relationship_suspected, data_as_list]
long_def: |
  Formel:

      S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )

  Gjennomsnittlig størrelse på residualene — hvor langt observasjonene
  typisk ligger unna regresjonslinjen, målt i samme enhet som `y`.

  **Trenger rådata?** Indirekte: trenger `(xᵢ, yᵢ)`-parene for å regne
  residualene. Hvis `S_E²` (eller `S_E`) er oppgitt, trenger du ikke
  rådataene.

  **`n − 2` i nevneren:** to frihetsgrader er brukt opp på å estimere
  `αˆ` og `βˆ`.

  Inngår i:

      SE(βˆ) = √(S_E² / S_XX)

  og i prediksjonsintervaller.
aliases:
  - residualstandardavvik
  - residualstandardavviket
  - s_e
