id: t-test-mu
name_no: "Test om μ = μ₀, σ ukjent"
cue: "Oppgaven har en hypotese om forventningsverdien (f.eks. 'er gjennomsnittet høyere enn 100?'), σ er IKKE oppgitt, og utvalget gir både x̄ og s. Det skal avgjøres om vi kan forkaste H₀: μ = μ₀ på et gitt signifikansnivå."
procedure:
  - "Sett opp H₀: μ = μ₀ og H₁ (ensidig eller tosidig — les nøye)"
  - "Velg signifikansnivå α (vanligvis 0.05)"
  - "Regn testobservatoren T = (x̄ − μ₀) / (s/√n)"
  - "Bestem frihetsgrader ν = n − 1"
  - "Slå opp kritisk verdi i t-tabell (ensidig: t_(α, ν); tosidig: t_(α/2, ν))"
  - "Forkast H₀ hvis |T| ≥ kritisk verdi (tosidig) eller T er i forkastningsområdet (ensidig)"
  - "Alternativt: regn p-verdi og forkast hvis p ≤ α"
entry_refs:
  - en-utvalg-t-test
example: "H₀: μ = 100, H₁: μ > 100. n = 16, x̄ = 103.2, s = 6. T = (103.2 − 100) / (6/4) = 2.13. Kritisk verdi t_(0.05, 15) = 1.753. Forkast H₀."
