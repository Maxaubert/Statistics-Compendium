id: forventningsverdi-oversikt
name_no: "Forventningsverdi (oversikt)"
type: overview
tagline: "E[X] = vektet gjennomsnitt. Alle formene er samme idé med forskjellige vekter eller datakilder."

what_it_means: |
  Forventningsverdien er det langsiktige snittet av en variabel — det
  vektede gjennomsnittet av mulige verdier.

      forventningsverdi = «sum av verdi · vekt»

  Vekten er sannsynligheten (stokastisk variabel) eller `1/n` (utvalg).

  ## [Forventningsverdi for diskret stokastisk variabel](glossary:forventningsverdi)

      E[X] = Σ xᵢ · P(X = xᵢ)

  Når du har en PMF-tabell. Vekten er sannsynligheten.

  Entry: [Forventningsverdi for diskret stokastisk variabel](/entry/forventningsverdi-diskret).

  ## Forventningsverdi for kontinuerlig stokastisk variabel

      E[X] = ∫ x · f(x) dx

  For kontinuerlige variabler (vekt, tid, lengde) med tetthet `f(x)`.
  I praksis bruker du ferdige formler — `E[X] = μ` for normal, `E[T] = 1/λ`
  for eksponential.

  ## [Utvalgsgjennomsnitt (x̄)](glossary:gjennomsnitt)

      x̄ = Σ xᵢ / n

  Estimat for `μ` fra rådata. Forventningsrett: `E[X̄] = μ` når observasjonene
  er iid.

  ## Lineæritet

      E[aX + b] = a·E[X] + b

  Skalering og forskyvning. Eksempel: `Y = 2X + 5` med `E[X] = 3` gir `E[Y] = 11`.

  ## Sum av variabler

      E[X + Y] = E[X] + E[Y]

  Forventningen til en sum er summen av forventningene — **krever IKKE
  uavhengighet**. For `n` iid kopier: `E[X₁ + … + Xₙ] = n·μ`.

  ## Produkt under uavhengighet

      E[X · Y] = E[X] · E[Y]        (kun hvis X ⊥ Y)

  Hvis ikke uavhengige: regn `E[X·Y]` direkte fra simultanfordelingen.
  Sammenheng: `Cov(X, Y) = E[X·Y] − E[X]·E[Y]`.

  Entry: [Kovarians Cov(X,Y)](/entry/kovarians).

recognition_cues:
  - "Oppgaven ber om E[X], μ, eller forventningsverdien"
  - "Oppgaven gir en transformert variabel (Y = aX + b) og spør om E[Y]"
  - "Oppgaven gir simultanfordeling og spør om E[X · Y] eller E[X + Y]"
  - "Du har rådata og trenger gjennomsnittet x̄"

