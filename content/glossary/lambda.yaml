id: lambda
term_no: Lambda (λ)
short_def: "Rate — antall hendelser per tids- eller romenhet i poisson- og eksponentialfordelingen."
aliases:
  - λ
  - lambda
long_def: |
  `λ` er rateparameteren.

  **Poisson** — sannsynlighet for `k` hendelser:

      P(X = k) = e^(−λ) · λ^k / k!

  der `λ` er forventet antall hendelser i intervallet.

  **Eksponential** — tid mellom hendelser med rate `λ`:

      E[T] = 1/λ

  Pass på enheter — hvis raten er per minutt, må `t` også være i minutter.
  Når oppgaven gir «rate» eller «gjennomsnittlig antall», er det `λ`.
