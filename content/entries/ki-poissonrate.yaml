id: ki-poissonrate
name_no: "Konfidensintervall for poissonrate λ"
type: identity
category: confidence_interval
tagline: "`(1−α)·100 %` KI for raten `λ` basert på `Y` observerte hendelser i tid `t`."

formula_main: "λ̂ ± z_(α/2) · √(λ̂/t);  λ̂ = Y/t"
formula_latex: "\\hat{\\lambda} \\pm z_{\\alpha/2} \\cdot \\sqrt{\\frac{\\hat{\\lambda}}{t}}, \\quad \\hat{\\lambda} = \\frac{Y}{t}"

what_it_does: |
  Tilnærmet KI for raten `λ` i en poissonprosess, basert på at `Y` hendelser
  ble observert i et vindu av lengde `t`. Bruker normalapproksimasjon, som
  er gyldig når `λt > 10`.

why_use: |
  Standardvalg når oppgaven gir antall observerte hendelser i en
  tidsperiode og spør etter et intervallestimat for raten.

recognition_cues:
  - "Du har observert `Y` hendelser i en kjent tidsperiode `t` (eller område)"
  - "Du vil estimere raten `λ` med usikkerhetsmål"
  - "Konfidensnivå er gitt"
  - "Det er etablert at hendelsene følger en poissonprosess"

when_NOT_to_use:
  - "Du estimerer en andel/sannsynlighet (av `n` forsøk) → bruk [KI for andel](/entry/ki-andel-binomial) i stedet"
  - "`λt < 10` – normalapproksimasjon for unøyaktig"

symbols:
  - { sym: "λ",        means: "raten (det vi vil estimere)" }
  - { sym: "λ̂",        means: "punktestimat, `λ̂ = Y/t`" }
  - { sym: "Y",         means: "antall hendelser observert i tidsperioden" }
  - { sym: "t",         means: "lengden på observasjonsperioden" }
  - { sym: "z_(α/2)",   means: "kvantil i standardnormalfordelingen" }

filters:
  computes: [confidence_interval, parameter_estimate]
  random_variable: [discrete_count]
  setup: [single_population, events_in_window]
  structural_cues: [rate_given, process_over_time, poisson_process_mentioned, counting_events, summary_stats_given, independent_events]
  parameters_known: [rate_lambda, confidence_level, sample_size_large]
  distribution_assumption: [poisson, normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]

solution_template:
  - "Identifiser totalt antall observerte hendelser `Y` og total observasjonstid `t` (samme enhet som raten)"
  - "Beregn punktestimat `λ̂ = Y/t`"
  - "Sjekk at `Y > 10` (≈ `λ̂·t > 10`) for at normalapproksimasjon er gyldig"
  - "Finn `α` fra konfidensnivået: `(1 − α)·100 %` KI ⇒ `α = 1 − konfidensnivå` (f.eks. 90 % KI gir `α = 0.10`, så `α/2 = 0.05`)"
  - "Slå opp `z_(α/2)` i tabell E.4 (f.eks. `z_(0.05) = 1.645`)"
  - "Beregn margin: `z_(α/2) · √(λ̂/t) = z_(α/2) · √Y / t`"
  - "KI: `λ̂ ± margin`"

common_traps: |
  Sjekk at `t` er i samme enhet som raten (timer, dager, måneder, osv.).
  Variansformelen i nevneren bruker `√(λ̂/t)`, ekvivalent med `√Y / t`.
  Hvis `Y` er liten, er normalapproksimasjon for unøyaktig – men i pensum
  forutsettes ofte at det er ok.

python_snippet: |
  import math
  from scipy.stats import norm

  Y, t, alpha = 15, 840, 0.10
  lam_hat = Y / t                       # 0.01786
  z = norm.ppf(1 - alpha/2)             # 1.645
  margin = z * math.sqrt(lam_hat / t)
  ci = (lam_hat - margin, lam_hat + margin)

detailed_solution_variants:
  - label: "KI for poisson-rate λ"
    solutions:
      - source: "Eksamen jan26 · oppgave 4e"
        question: "Biologen lar fellen stå i fem uker og fanger 15 klippeblåvinger. Finn et tilnærmet 90 % konfidensintervall for raten λ."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Y = 15 hendelser (klippeblåvinger fanget)" }
              - { text: "t = 5 uker = 5·168 = 840 timer" }
              - { text: "Konfidensnivå 90 % → α = 0.10, α/2 = 0.05" }
          - label: "Estimat"
            lines:
              - { text: "λ̂ = Y/t = 15/840 = 0.01786 pr. time" }
              - { comment: "Y = 15 > 10, så normalapproksimasjon er gyldig" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_(α/2) = z_0.05 = 1.645" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = z_(α/2) · √(λ̂/t) = 1.645 · √(0.01786 / 840)" }
              - { indent: "= 1.645 · √(2.126·10⁻⁵)" }
              - { indent: "= 1.645 · 0.00461 = 0.00758" }
              - { text: "KI = λ̂ ± margin = 0.01786 ± 0.00758" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 90 % sikre på at raten λ ligger mellom 0.0103 og 0.0254 fangster pr. time." }
        result: "λ ∈ [0.0103, 0.0254] pr. time"

      - source: "Praksiseksempel · vulkanutbrudd"
        question: "I løpet av 60 år er det observert 12 vulkanutbrudd i et område. Anta poissonprosess. Finn et 95 % konfidensintervall for raten λ pr. år."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Y = 12 hendelser (vulkanutbrudd)" }
              - { text: "t = 60 år" }
              - { text: "Konfidensnivå 95 % → α = 0.05, α/2 = 0.025" }
          - label: "Estimat"
            lines:
              - { text: "λ̂ = Y/t = 12/60 = 0.20 utbrudd pr. år" }
              - { comment: "Y = 12 > 10, normalapproksimasjon er ok" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_(α/2) = z_0.025 = 1.96" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = z_(α/2) · √(λ̂/t) = 1.96 · √(0.20 / 60)" }
              - { indent: "= 1.96 · √(0.003333)" }
              - { indent: "= 1.96 · 0.05774 = 0.1132" }
              - { text: "KI = λ̂ ± margin = 0.20 ± 0.113" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 95 % sikre på at den sanne raten λ ligger mellom 0.087 og 0.313 utbrudd pr. år." }
        result: "λ ∈ [0.087, 0.313] utbrudd pr. år"

      - source: "Praksiseksempel · telefonsentral"
        question: "En telefonsentral mottar 25 anrop i løpet av 1 time. Anta poissonprosess. Finn et 99 % konfidensintervall for raten λ pr. time."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Y = 25 hendelser (anrop)" }
              - { text: "t = 1 time" }
              - { text: "Konfidensnivå 99 % → α = 0.01, α/2 = 0.005" }
          - label: "Estimat"
            lines:
              - { text: "λ̂ = Y/t = 25/1 = 25 anrop pr. time" }
              - { comment: "Y = 25 > 10, normalapproksimasjon er trygg" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_(α/2) = z_0.005 = 2.576" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = z_(α/2) · √(λ̂/t) = 2.576 · √(25 / 1)" }
              - { indent: "= 2.576 · √25" }
              - { indent: "= 2.576 · 5 = 12.88" }
              - { text: "KI = λ̂ ± margin = 25 ± 12.88" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 99 % sikre på at sentralens sanne ankomstrate λ ligger mellom 12.12 og 37.88 anrop pr. time." }
              - { comment: "Merk: bredt intervall fordi vi kun har observert ett tidsvindu (t = 1)." }
        result: "λ ∈ [12.12, 37.88] anrop pr. time"

