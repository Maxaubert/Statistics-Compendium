                  ] } }
          - label: "Rangsum og U for gruppa H₁ peker mot lav"
            lines:
              - { text: "Høyresidig (X stor) ⇒ Y skal ha små rangtall. Beregn `U_Y`." }
              - { text: "`W_Y = 1+2+3+4+6 = 16`" }
              - { text: "`U_Y = 16 − 5·6/2 = 1`" }
              - { comment: "Til kontroll: W_X = 5+7+8+9+10 = 39, U_X = 39−15 = 24, U_X+U_Y = 25 = n_X·n_Y ✓" }
