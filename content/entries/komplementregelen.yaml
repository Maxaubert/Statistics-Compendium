id: komplementregelen
name_no: "Komplementregelen"
type: rule
category: probability_rule
tagline: "Sannsynligheten for at en hendelse IKKE inntreffer."

formula_main: "P(A̅) = 1 − P(A)"
formula_latex: "P(\\overline{A}) = 1 - P(A)"

what_it_does: |
  Den enkleste, men kraftigste, regelen i sannsynlighetsregning. Sier at
  sannsynligheten for at noe IKKE skjer er én minus sannsynligheten for
  at det skjer. Brukes nesten alltid når oppgaven inneholder ord som
  "minst" eller "ingen", fordi direkte beregning blir mye vanskeligere.

why_use: |
  Mange oppgaver er enklere å løse via komplementet enn direkte. Klassisk
  eksempel: "minst én suksess i n forsøk". Direkte ville krevet sum over
  alle k = 1, 2, ..., n. Via komplement: bare 1 - P(0 suksesser), én enkel
  utregning.

recognition_cues:
  - "Spørsmålet inneholder ord som 'minst én', 'minst k', 'ingen', 'høyst k', 'ikke alle'"
  - "Direkte beregning av det som spørres etter ville kreve sum over mange utfall"
  - "Negasjonen (det motsatte) er enklere å beskrive enn det spørsmålet ber om"
  - "Du har en kumulativ tabell (E.1, E.2, E.3) som gir P(X ≤ k), men spørsmålet er om P(X ≥ k)"
  - "Spørsmål som starter med 'finn n slik at sannsynligheten for ... overstiger ...' (terskelproblem)"

symbols:
  - { sym: "A",     means: "en hendelse" }
  - { sym: "A̅",     means: "komplementet av A (A̅ inntreffer hvis A ikke gjør det)" }

filters:
  computes: [exact_probability, at_least_k]
  random_variable: []
  setup: [single_population]
  structural_cues: [complement_pattern]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_variants:
  - label: "Minst k"
    steps:
      - "Identifiser hendelsen: 'minst k hendelser inntreffer', altså `P(X ≥ k)`"
      - "Skriv om via komplement: `P(X ≥ k) = 1 − P(X ≤ k − 1)` (NB: `k − 1`, ikke `k`)"
      - "Slå opp `P(X ≤ k − 1)` i kumulativ tabell (E.1 binomial, E.2 poisson) eller regn ut direkte"
      - "Trekk fra 1 og les av svaret. Eksempel: `P(X ≥ 3) = 1 − P(X ≤ 2)`"
      - { text: "Hvis indeksen i 'minst k' tolkes feil, du ender med `P(X ≤ k)` — ikke `P(X ≤ k−1)` — så svaret er for stort", conditional: true }
      - { text: "Hvis 'minst en' er spørsmålet, det er bare `1 − P(ingen)` — ingen tabelloppslag nødvendig (f.eks. binomial: `1 − (1 − p)^n`)", conditional: true }

  - label: "Ingen / null"
    steps:
      - "Identifiser hendelsen som `P(X = 0)` — sannsynligheten for null forekomster"
      - "Velg riktig pmf-uttrykk basert på fordeling: Poisson `P(X = 0) = e^(−λt)`; binomial `P(X = 0) = (1 − p)^n`; geometrisk `P(X = 0)` (avh. av definisjon)"
      - "Sett inn parametrene direkte. Eksempel: Poisson med `λ = 2`, `t = 1.5` gir `P(X = 0) = e^(−3) ≈ 0.0498`"
      - "Hvis spørsmålet egentlig er om 'minst én', bruk komplementet: `P(X ≥ 1) = 1 − P(X = 0)`"
      - { text: "Hvis hendelsene IKKE er uavhengige, `(1 − p)^n` gjelder ikke — bruk hypergeometrisk eller direkte telling i stedet", conditional: true }

  - label: "Ikke alle"
    steps:
      - "Identifiser 'alle'-hendelsen først: f.eks. 'alle n forsøk er suksess' har sannsynlighet `p^n` (uavhengige)"
      - "Komplementet til 'alle' er 'minst én er IKKE': `P(ikke alle) = 1 − P(alle) = 1 − p^n`"
      - "Pass på: 'ikke alle' ≠ 'ingen'. 'Ingen' er `(1 − p)^n`, 'ikke alle' er `1 − p^n`"
      - "Beregn og les av. Eksempel: `P(alle 5 hjerter) = 0.000495` → `P(ikke alle hjerter) = 1 − 0.000495 = 0.999505`"
      - { text: "Hvis hendelsene IKKE er uavhengige (f.eks. trekk uten tilbakelegging), bruk hypergeometrisk for `P(alle)` før du tar komplementet", conditional: true }

  - label: "Finn n for terskel"
    steps:
      - "Skriv kravet som ulikhet: 'minst én hendelse skjer med sannsynlighet ≥ T' blir `1 − (1 − p)^n ≥ T`"
      - "Isoler `(1 − p)^n`: `(1 − p)^n ≤ 1 − T`"
      - "Ta logaritme på begge sider — husk at `ln(1 − p) < 0`, så ulikheten snur: `n ≥ ln(1 − T) / ln(1 − p)`"
      - "Rund OPP til nærmeste heltall (f.eks. `p = 0.05`, `T = 0.99` → `n ≥ ln(0.01)/ln(0.95) ≈ 89.78` → `n = 90`)"
      - "Verifiser ved innsetting: `1 − 0.95^90 ≈ 0.9906 ≥ 0.99` (OK)"
      - { text: "Hvis du glemmer å snu ulikheten ved logaritme av tall < 1, du får feil retning og dermed feil n", conditional: true }
      - { text: "Hvis hendelsene IKKE er uavhengige, bruk addisjon med betinget-sannsynlighet i stedet for `(1 − p)^n`", conditional: true }

common_traps: |
  - **"Minst k" indeks-feil**: P(X ≥ k) = 1 − P(X ≤ k − 1), IKKE 1 − P(X ≤ k). For k = 3: P(X ≥ 3) = 1 − P(X ≤ 2).
  - **"Ikke alle" ≠ "ingen"**: Hvis A er "alle 5 kort er hjerter", så er A̅ "minst ett kort er IKKE hjerter" (ikke "ingen er hjerter"). De to siste er forskjellige hendelser.
  - **Komplement av disjunkt union**: P(A̅ ∩ B̅) = 1 − P(A ∪ B), via De Morgans lov. Brukes for "verken A eller B".
  - **Komplement i tellinger**: For "minst én suksess", komplementet er "null suksesser" (ofte enkelt å regne).

examples:
  - source: "Eksamen jan25 · oppgave 1b"
    excerpt: "P(alle 5 trukne kort er hjerter) = 0.000495. Sannsynlighet for at IKKE alle er hjerter?"
    solution_sketch: "P(ikke alle) = 1 − 0.000495 = 0.999505"
  - source: "Eksamen jan26 · oppgave 1c"
    excerpt: "P(minst én kron i n kast) > 0.99 ekvivalent med 1 − P(0 kron) > 0.99."
    solution_sketch: "P(X ≥ 1) > 0.99 ⇔ P(X = 0) < 0.01 ⇔ 0.5^n < 0.01"
  - source: "Eksamen jan26 · oppgave 4b"
    excerpt: "P(minst tre klippeblåvinger). Bruk komplement."
    solution_sketch: "P(X ≥ 3) = 1 − P(X ≤ 2)"

