id: ki-andel-binomial
name_no: "Konfidensintervall for andel p (binomial)"
type: identity
category: confidence_interval
tagline: "`(1−α)·100 %` KI for sannsynlighet/andel `p` basert på `X` suksesser av `n` forsøk."

formula_main: "p̂ ± z_(α/2) · √(p̂·(1-p̂)/n)"
formula_latex: "\\hat{p} \\pm z_{\\alpha/2} \\cdot \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}}"

what_it_does: |
  Gir et tilnærmet intervall som med `(1−α)·100 %` sikkerhet inneholder
  den sanne andelen `p` i en populasjon, basert på `p̂ = X/n`. Forutsetter
  at `n` er stort nok (`n·p̂·(1−p̂) ≥ 5`).

why_use: |
  Brukes når problemet handler om en binomisk situasjon (`n` forsøk,
  hver med to mulige utfall) og vi vil estimere den underliggende
  sannsynligheten `p` med usikkerhetsmål.

recognition_cues:
  - "Spørsmålet ber om KI for en andel/sannsynlighet"
  - "Du har observert `X` suksesser i `n` forsøk"
  - "Konfidensnivå er gitt"
  - "Du har en binomisk situasjon (samme `p` i hvert forsøk, uavhengige)"

when_NOT_to_use:
  - "Du estimerer en rate (per tidsenhet) → bruk [KI for poissonrate](/entry/ki-poissonrate)"
  - "`n·p̂·(1−p̂) < 5` → normalapproksimasjon for unøyaktig"
  - "Du vil teste `p` mot en spesifisert verdi `p₀` (ikke estimere intervall) → bruk [z-test for andel](/entry/en-utvalg-z-test-andel) i stedet"

symbols:
  - { sym: "p̂",        means: "punktestimat for andelen, `p̂ = X/n`" }
  - { sym: "X",         means: "antall suksesser observert" }
  - { sym: "n",         means: "antall forsøk" }
  - { sym: "z_(α/2)",   means: "kvantil i standardnormalfordelingen" }

filters:
  computes: [confidence_interval, parameter_estimate, find_n_for_threshold]
  random_variable: [proportion, discrete_count]
  setup: [single_population, fixed_n_trials, with_replacement]
  structural_cues: [two_outcomes_per_trial, success_probability_given, independent_events, total_observations_n, summary_stats_given]
  parameters_known: [success_p, sample_size_large, confidence_level]
  distribution_assumption: [binomial, normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]
solution_template:
  - "Identifiser antall suksesser `X` og utvalgsstørrelsen `n`"
  - text: "Beregn punktestimat:"
    formula: "p̂ = X/n"
  - text: "Sjekk at normalapproksimasjon er gyldig:"
    formula: "n·p̂·(1−p̂) ≥ 5"
  - "Finn `α` fra konfidensnivået: `(1 − α)·100 %` KI ⇒ `α = 1 − konfidensnivå` (f.eks. 90 % KI gir `α = 0.10`, så `α/2 = 0.05`)"
  - "Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). F.eks. `z_(0.05) = 1.645`"
  - text: "Beregn margin:"
    formula: "margin = z_(α/2) · √(p̂(1−p̂)/n)"
  - text: "Sett opp KI:"
    formula: "p̂ ± margin"

common_traps: |
  Standard error i KI bruker `p̂` (estimert), MEN i [hypotesetest for andel](/entry/en-utvalg-z-test-andel)
  bruker man `p₀` (verdien fra `H₀`). Pass på! Husk å sjekke approksimasjons-
  betingelsen før du bruker normalapproksimasjon.

python_snippet: |
  import math
  from scipy.stats import norm

  X, n, alpha = 23, 80, 0.10
  p_hat = X / n                         # 0.2875
  z = norm.ppf(1 - alpha/2)             # 1.645
  margin = z * math.sqrt(p_hat * (1 - p_hat) / n)
  ci = (p_hat - margin, p_hat + margin)

detailed_solution_variants:
  - label: "KI for andel p"
    solutions:
      - source: "Eksamen mai25 · oppgave 3b"
        question: "Vi plukket ut 80 grantrær og 23 hadde sykdom. Finn et tilnærmet 90 % konfidensintervall for andelen p av grantrær som har sykdommen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 80, X = 23, konfidensnivå 90 % → α = 0.10" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 23/80 = 0.2875`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 80·0.2875·0.7125 ≈ 16.4 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.05} = 1.645" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.2875·0.7125/80)`" }
              - { indent: "`= √0.002562 = 0.0506`" }
              - { text: "`marginal = z·SE = 1.645·0.0506 = 0.0832`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.2875 ± 0.0832`" }
              - { indent: "`= (0.204, 0.371)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 90 % sikre på at den sanne andelen syke grantrær ligger mellom 20.4 % og 37.1 %." }
        result: "`p ∈ (0.204, 0.371)`"

      - source: "Praksis · meningsmåling"
        question: "I en undersøkelse svarte 200 av 500 spurte at de støtter et nytt forslag. Lag et 95 % konfidensintervall for den sanne andelen p som støtter forslaget."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 500, X = 200, konfidensnivå 95 % → α = 0.05" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 200/500 = 0.40`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 500·0.40·0.60 = 120 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.025} = 1.96" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.40·0.60/500)`" }
              - { indent: "`= √0.00048 = 0.02191`" }
              - { text: "`marginal = z·SE = 1.96·0.02191 = 0.0429`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.40 ± 0.043`" }
              - { indent: "`= (0.357, 0.443)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 95 % sikre på at den sanne andelen som støtter forslaget ligger mellom 35.7 % og 44.3 %." }
        result: "`p ∈ (0.357, 0.443)`"

      - source: "Praksis · produkttest"
        question: "I en kvalitetstest viser det seg at 12 av 80 deler er defekte. Lag et 99 % konfidensintervall for den sanne defekt-raten p."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "n = 80, X = 12, konfidensnivå 99 % → α = 0.01" }
          - label: "Estimat"
            lines:
              - { text: "`p̂ = X/n = 12/80 = 0.15`" }
              - { text: "Sjekk approksimasjon: `n·p̂·(1-p̂) = 80·0.15·0.85 = 10.2 ≥ 5` ✓" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "z_{α/2} = z_{0.005} = 2.576" } }
          - label: "Standardfeil og marg"
            lines:
              - { text: "`SE = √(p̂(1-p̂)/n) = √(0.15·0.85/80)`" }
              - { indent: "`= √0.001594 = 0.0399`" }
              - { text: "`marginal = z·SE = 2.576·0.0399 = 0.1028`" }
          - label: "Intervall"
            lines:
              - { text: "`p̂ ± marginal = 0.15 ± 0.103`" }
              - { indent: "`= (0.047, 0.253)`" }
          - label: "Tolkning"
            lines:
              - { text: "Vi er 99 % sikre på at den sanne defekt-raten ligger mellom 4.7 % og 25.3 %. Intervallet er bredt fordi konfidensnivået er høyt og n relativt lite." }
        result: "`p ∈ (0.047, 0.253)`"

