id: normalfordeling
name_no: Normalfordeling
type: distribution
category: continuous_distribution
tagline: "Klokkeformet kontinuerlig fordeling — den vanligste antakelsen i statistikk."

formula_main: "X ~ N(μ, σ);  Z = (X - μ) / σ ~ N(0, 1);  P(X ≤ x) = G((x - μ) / σ)"
formula_latex: "X \\sim N(\\mu, \\sigma), \\quad Z = \\frac{X - \\mu}{\\sigma} \\sim N(0, 1)"

what_it_does: |
  Den klassiske "klokkeformede" fordelingen. Beskriver en kontinuerlig
  variabel X (en målbar verdi som kan være hva som helst innenfor et
  intervall — vekt, høyde, kaffemengde, testresultater) som er symmetrisk
  rundt midtverdien μ, med spredning angitt av σ.

  Sannsynligheter under normalfordelingen regnes ikke direkte ut, men slås
  opp i en tabell (E.3 — Z-tabell) etter at variabelen er "standardisert"
  med transformasjonen Z = (X - μ)/σ. Z-verdien forteller hvor mange
  standardavvik over eller under gjennomsnittet observasjonen ligger.

why_use: |
  Mange naturlige fenomener er tilnærmet normalfordelte (vekt, høyde,
  målefeil, gjennomsnittsresultater). Sentralgrenseteoremet sier at
  gjennomsnittet av mange uavhengige variabler er tilnærmet normalfordelt
  uansett underliggende fordeling, så normalfordelingen brukes også indirekte
  i z-tester, t-tester og konfidensintervaller.

recognition_cues:
  - "Oppgaven sier eksplisitt 'normalfordelt med forventningsverdi μ og standardavvik σ'"
  - "Oppgaven oppgir både en gjennomsnittsverdi μ og en spredning σ for en kontinuerlig størrelse"
  - "Spørsmålet er på formen P(X < x), P(X > x) eller P(a < X < b) for kontinuerlig X"
  - "Stort antall observasjoner (n ≥ 30) der man ser på gjennomsnittet — sentralgrenseteoremet gir tilnærmet normalfordeling"
  - "Spørsmålet ber om 'sannsynligheten for at en tilfeldig valgt X overstiger / underskrider en verdi'"
  - "Skjult variant: 'finn x slik at P(X < x) = p' (invers normal — bruk z-kvantiltabellen E.4)"

when_NOT_to_use:
  - "Variabelen er diskret (heltall) → bruk binomial, Poisson, eller hypergeometrisk"
  - "Datamaterialet ser klart skjevt ut (qq-plott avviker) → vurder bootstrap"
  - "Variabelen er bare positiv tid mellom hendelser → bruk eksponentialfordeling"

symbols:
  - { sym: "μ",     means: "forventningsverdien (sentrum av klokken)" }
  - { sym: "σ",     means: "standardavviket (spredning)" }
  - { sym: "σ²",    means: "variansen" }
  - { sym: "Z",     means: "standardnormalisert variabel, Z = (X − μ)/σ" }
  - { sym: "G(z)",  means: "kumulativ standardnormalfordeling, P(Z ≤ z)" }
  - { sym: "z_α",   means: "α-kvantilet, slik at P(Z > z_α) = α" }

properties:
  expected_value: "E[X] = μ"
  variance: "Var[X] = σ²"
  std_dev: "σ"

filters:
  computes: [exact_probability, range_probability, find_mu_for_threshold]
  random_variable: [continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, mean_and_sd_given]
  parameters_known: [population_variance_known, mean_known]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]

solution_template:
  - "Skriv ned hva X representerer og hvilke verdier μ og σ har (les nøye gjennom oppgaven)"
  - "Bekreft at X ~ N(μ, σ) er antatt — enten direkte oppgitt, eller via sentralgrenseteoremet for store n"
  - "Identifiser hva spørsmålet etterspør: P(X < x), P(X > x), P(a < X < b), eller en x-verdi som oppfyller en betingelse"
  - "Standardiser: erstatt X med Z og verdiene med (verdi − μ)/σ. F.eks. P(X < 24) = P(Z < (24 − 25)/0.48) = P(Z < -2.08)"
  - "Slå opp G(z) i tabell E.3 (Z-tabell). Tabellen gir P(Z ≤ z), arealet til VENSTRE for z"
  - "For 'høyre hale' P(Z > z), bruk 1 − G(z). For tosidig 'mellom a og b': G(b-standardisert) − G(a-standardisert)"
  - "For invers (finn x når P(X < x) = p er gitt): finn z_p i E.4 og regn x = μ + σ · z (eller −z hvis venstre hale)"

common_traps: |
  - **Forveksle ikke σ (standardavvik) med σ² (varians).** Hvis oppgaven sier "varians 25", er σ = 5, ikke 25.
  - **G(z) gir arealet til VENSTRE.** For "større enn z", bruk 1 − G(z).
  - **Symmetri**: G(−z) = 1 − G(z). Brukes for negative z hvis tabellen kun viser positive (vår tabell viser begge).
  - **Standardisering må gjøres riktig**: Z = (X − μ)/σ, ikke (μ − X)/σ. Sjekk fortegnet.
  - **Avrunding av z**: rund til 2 desimaler for å passe tabellen (z = -2.08, ikke -2.0833).
  - **Invers-oppgaver**: hvis P(X < 300) er liten (< 0.5) og verdien står til venstre for μ, må z være negativ. Ikke bare bruk z fra tabellen direkte; reflekter fortegnet.

python_snippet: |
  from scipy.stats import norm

  mu, sigma = 25, 0.48

  # P(X ≤ x)
  norm.cdf(24, loc=mu, scale=sigma)         # 0.0188

  # P(a < X ≤ b)
  norm.cdf(310, loc=302, scale=5) - norm.cdf(305, loc=302, scale=5)  # 0.2195

  # Invers: finn x slik at P(X ≤ x) = p
  norm.ppf(0.001, loc=300, scale=5)         # finne x for P(X<x)=0.001

examples:
  - source: "Eksamen jan25 · oppgave 5a"
    excerpt: "Mengden kaffe er normalfordelt med μ = 25 cl, σ = 0.48 cl. Sannsynlighet for at en kopp har mindre enn 24 cl?"
    solution_sketch: "P(X < 24) = G((24-25)/0.48) = G(-2.08) = 0.0188"
  - source: "Eksamen mai25 · oppgave 4a"
    excerpt: "Fyllingen av såpebeholdere er N(302, 5). Sannsynlighet for innhold mellom 305 og 310 ml?"
    solution_sketch: "P(305 < X ≤ 310) = G(1.6) − G(0.6) = 0.9452 − 0.7257 = 0.2195"
  - source: "Eksamen mai25 · oppgave 4d"
    excerpt: "Hva må μ justeres til for at P(X < 300) < 0.001 når σ = 5?"
    solution_sketch: "(300 − μ)/5 = −z_0.001 = −3.090 → μ = 300 + 15.45 = 315.45 ml"

detailed_solutions:
  - source: "Eksamen jan25 · oppgave 5a"
    question: "X er normalfordelt med μ = 25 cl og σ = 0.48 cl. Finn P(X < 24)."
    sections:
      - label: "Identifisering"
        lines:
          - { text: "X ~ N(25, 0.48)" }
      - label: "Standardisering"
        lines:
          - { text: "P(X < 24) = P(Z < (24 - 25)/0.48)" }
          - { indent: "= P(Z < -2.0833)" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.3", text: "G(-2.08) ≈ 0.0188" } }
    result: "P(X < 24) ≈ 0.0188"

  - source: "Eksamen mai25 · oppgave 4a"
    question: "X er normalfordelt med μ = 302 ml og σ = 5 ml. Finn P(305 < X ≤ 310)."
    sections:
      - label: "Standardisering"
        lines:
          - { text: "P(305 < X ≤ 310) = G((310-302)/5) - G((305-302)/5)" }
          - { indent: "= G(1.6) - G(0.6)" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.3", text: "G(1.6) ≈ 0.9452" } }
          - { table_lookup: { ref: "E.3", text: "G(0.6) ≈ 0.7257" } }
          - { text: "= 0.9452 - 0.7257" }
    result: "P(305 < X ≤ 310) ≈ 0.2195"

  - source: "Eksamen mai25 · oppgave 4d"
    question: "Standardavviket er σ = 5 ml. Hva må forventningsverdien μ være for at P(X < 300) < 0.001?"
    sections:
      - label: "Identifisering"
        lines:
          - { text: "Vi vil ha P(X < 300) = 0.001 (grenseverdien)" }
          - { text: "G((300 - μ)/5) = 0.001" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.4", text: "z_0.001 = 3.090, så det venstresidige kvantilet er -z_0.001 = -3.090" } }
      - label: "Innsatt"
        lines:
          - { text: "(300 - μ)/5 = -3.090" }
          - { text: "300 - μ = -15.45" }
          - { text: "μ = 315.45" }
    result: "μ må justeres opp til minst 315.45 ml"

