id: kjikvadrat-uavhengighet
name_no: Kjikvadrat-test for uavhengighet
type: test
category: hypothesis_test
tagline: "Tester om to kategoriske variable er uavhengige (kontingenstabell)."

formula_main: "χ² = Σ (O_ij − E_ij)² / E_ij,    E_ij = (rad_i · kol_j) / n"
formula_latex: "\\chi^2 = \\sum_{i,j} \\frac{(O_{ij} - E_{ij})^2}{E_{ij}}, \\quad E_{ij} = \\frac{r_i \\cdot c_j}{n}"

what_it_does: |
  Tester om to kategoriske variable (f.eks. røyking × kreft, kjønn × stemmegivning)
  er uavhengige i populasjonen. Bruker en `r × c`-kontingenstabell der hver celle har
  observert antall `O_ij` og forventet antall `E_ij` regnet som `rad-sum × kol-sum / n`.

why_use: |
  Når du har en simultan-kategori-tabell og vil teste `H₀`: variablene er uavhengige.

recognition_cues:
  - "Data oppgis som en `r × c`-kontingenstabell (rader × kolonner)"
  - "Spørsmålet handler om sammenheng mellom to kategoriske egenskaper"
  - "'Er `X` og `Y` uavhengige?' eller 'er det en sammenheng mellom `X` og `Y`?'"

when_NOT_to_use:
  - "Bare én variabel → bruk [goodness-of-fit-test](/entry/kjikvadrat-goodness-of-fit) i stedet"
  - "Variablene er kontinuerlige → bruk korrelasjon eller regresjon"
  - "`n` liten og noen `E_ij < 5` → testen er ikke pålitelig"

symbols:
  - { sym: "χ²",   means: "testobservatoren, kjikvadrat-fordelt med `ν` frihetsgrader under `H₀`" }
  - { sym: "O_ij", means: "observert antall i celle (rad `i`, kolonne `j`)" }
  - { sym: "E_ij", means: "forventet antall `= (rad-sum_i × kol-sum_j) / n`" }
  - { sym: "n",    means: "totalt antall observasjoner i tabellen" }
  - { sym: "r",    means: "antall rader" }
  - { sym: "c",    means: "antall kolonner" }
  - { sym: "ν",    means: "frihetsgrader `= (r − 1)(c − 1)`" }
  - { sym: "H₀",   means: "nullhypotesen om at de to variablene er uavhengige" }
  - { sym: "α",    means: "signifikansnivå (typisk `0.05`)" }

filters:
  computes: [hypothesis_test, test_independence]
  random_variable: [discrete_count]
  setup: [single_population]
  structural_cues: [more_than_two_categories, summary_stats_given, independent_events]
  parameters_known: [alpha_significance, sample_size_large]
  distribution_assumption: [chi_squared]
  tooling: [chi_square_quantile_table_E6]

recognition: "«Er to kategoriske variable uavhengige?», «er kjønn og preferanse uavhengige?», eller «henger valg sammen med alder?». Du har en kontingenstabell (rader × kolonner)."

solution_template:
  - "Skriv ned `H₀`: `X` og `Y` er uavhengige"
  - "Regn marginalsummene (rad-summer og kol-summer)"
  - text: "Regn forventede antall for hver celle:"
    formula: "E_ij = (rad_i · kol_j) / n"
  - "Sjekk at alle `E_ij ≥ 5`"
  - text: "Regn testobservatoren over alle celler:"
    formula: "χ² = Σ (O_ij − E_ij)² / E_ij"
  - text: "Eksempel — kjønn × trandrikking, `O = [[20, 30], [25, 25]]`, alle `E = [[22.5, 27.5], [22.5, 27.5]]`:"
    formula: "χ² = 0.278 + 0.227 + 0.278 + 0.227 ≈ 1.01"
    example: true
  - text: "Bestem frihetsgrader:"
    formula: "ν = (r − 1)(c − 1)"
  - "Slå opp kritisk verdi `χ²_(α, ν)` i **tabell E.6** (kjikvadrat-kvantiltabell)"
  - text: "Forkastningsregel (= konkluder at variablene er avhengige):"
    formula: "Forkast H₀ hvis χ² > χ²_(α, ν)"

common_traps: |
  Frihetsgradene er `(r−1)(c−1)`, ikke `r·c−1`. Pass også på at marginalsummene
  i regningen treffer totalt `n`. Hvis flere `E_ij < 5` må du slå sammen
  kategorier eller bruke en eksakt test (Fisher).

python_snippet: |
  from scipy.stats import chi2_contingency

  observed = [[20, 30],
              [25, 25]]   # rader: kjønn (M/K); kolonner: tar tran (ja/nei)
  chisq, p, df, expected = chi2_contingency(observed)

detailed_solution_variants:
  - label: "Test for uavhengighet"
    solutions:
      - source: "Praksis · kjønn vs. trandrikking"
        question: "Vi spør 100 personer om kjønn og om de tar tran daglig. Resultat: menn ja=20/nei=30, kvinner ja=25/nei=25. Test om kjønn og trandrikking er uavhengige på 5 %-nivå."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: kjønn og trandrikking er uavhengige`" }
              - { text: "`H₁: kjønn og trandrikking er avhengige`" }
          - label: "Marginalsummer"
            lines:
              - { text: "Rad-summer: `M = 20+30 = 50`, `K = 25+25 = 50`." }
              - { text: "Kolonne-summer: `Ja = 20+25 = 45`, `Nei = 30+25 = 55`." }
              - { text: "Total: `n = 100`." }
          - label: "Forventede antall E_ij = (rad·kol)/n"
            lines:
              - { text: "`E(M, Ja) = 50·45/100 = 22.5`" }
              - { text: "`E(M, Nei) = 50·55/100 = 27.5`" }
              - { text: "`E(K, Ja) = 50·45/100 = 22.5`" }
              - { text: "`E(K, Nei) = 50·55/100 = 27.5`" }
              - { text: "Alle `E_ij ≥ 5` ✓" }
          - label: "Testobservator"
            lines:
              - { text: "`χ² = Σ (O_ij − E_ij)² / E_ij`" }
              - { indent: "`= (20−22.5)²/22.5 + (30−27.5)²/27.5`" }
              - { indent: "`+ (25−22.5)²/22.5 + (25−27.5)²/27.5`" }
              - { indent: "`= 0.278 + 0.227 + 0.278 + 0.227 ≈ 1.010`" }
          - label: "Konklusjon"
            lines:
              - { text: "Frihetsgrader: `ν = (r−1)(c−1) = (2−1)(2−1) = 1`." }
              - { table_lookup: { ref: "E.6", text: "`χ²_(0.05, 1) = 3.841`." } }
              - { text: "`χ² = 1.010 < 3.841` → behold `H₀`." }
        result: "Behold `H₀`: ingen statistisk grunnlag for å hevde at kjønn og trandrikking er avhengige."

      - source: "Praksis · alder × stemmegivning (3×3, signifikant)"
        question: |
          300 velgere kategoriseres etter alder (`<30`, `30–50`, `>50`) og parti
          (`A`, `B`, `C`):

          |               | Parti A | Parti B | Parti C | Sum  |
          |---------------|---------|---------|---------|------|
          | Under 30      | 30      | 40      | 30      | 100  |
          | 30–50         | 50      | 35      | 25      | 110  |
          | Over 50       | 60      | 20      | 10      | 90   |
          | **Sum**       | **140** | **95**  | **65**  | **300** |

          Test om alder og partivalg er uavhengige på α = 0.05.
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: alder og parti er uavhengige`" }
              - { text: "`H₁: alder og parti er avhengige`" }
          - label: "Forventede antall E_ij = (rad·kol)/n"
            lines:
              - { text: "**Rad 1 (`<30`, sum 100):**" }
              - { indent: "`E(1,A) = 100·140/300 ≈ 46.67`" }
              - { indent: "`E(1,B) = 100·95/300 ≈ 31.67`" }
              - { indent: "`E(1,C) = 100·65/300 ≈ 21.67`" }
              - { text: "**Rad 2 (`30–50`, sum 110):**" }
              - { indent: "`E(2,A) = 110·140/300 ≈ 51.33`" }
              - { indent: "`E(2,B) = 110·95/300 ≈ 34.83`" }
              - { indent: "`E(2,C) = 110·65/300 ≈ 23.83`" }
              - { text: "**Rad 3 (`>50`, sum 90):**" }
              - { indent: "`E(3,A) = 90·140/300 = 42`" }
              - { indent: "`E(3,B) = 90·95/300 = 28.5`" }
              - { indent: "`E(3,C) = 90·65/300 = 19.5`" }
              - { text: "Alle `E_ij ≥ 5` ✓" }
          - label: "Testobservator"
            lines:
              - { text: "`χ² = Σ (O_ij − E_ij)² / E_ij`" }
              - { indent: "`= (30−46.67)²/46.67 + (40−31.67)²/31.67 + (30−21.67)²/21.67`" }
              - { indent: "`+ (50−51.33)²/51.33 + (35−34.83)²/34.83 + (25−23.83)²/23.83`" }
              - { indent: "`+ (60−42)²/42 + (20−28.5)²/28.5 + (10−19.5)²/19.5`" }
              - { indent: "`= 5.95 + 2.19 + 3.20 + 0.034 + 0.0008 + 0.0574 + 7.71 + 2.535 + 4.628`" }
              - { indent: "`≈ 26.31`" }
          - label: "Konklusjon"
            lines:
              - { text: "Frihetsgrader: `ν = (3−1)(3−1) = 4`." }
              - { table_lookup: { ref: "E.6", text: "`χ²_(0.05, 4) = 9.488`." } }
              - { text: "`χ² = 26.31 ≫ 9.488` → forkast `H₀` (klart signifikant)." }
              - { comment: "p-verdi ≈ 0.00003 — sterk evidens for sammenheng. Eldre velgere viser tydelig preferanse for parti A; yngre er mer jevnt fordelt." }
        result: "Forkast `H₀` på α = 0.05. Alder og parti er signifikant assosiert i denne populasjonen."

      - source: "Praksis · effektstørrelse Cramér's V (når H₀ forkastes)"
        question: "Med samme alder × parti-resultat (`χ² = 26.31`, `n = 300`, tabell `3 × 3`): beregn Cramér's V som mål på STYRKEN av sammenhengen."
        sections:
          - label: "Formel"
            lines:
              - { text: "`V = √(χ² / (n · min(r−1, c−1)))`" }
              - { comment: "`V` ligger mellom 0 (uavhengig) og 1 (perfekt avhengig). Cohens skala: 0.1 svak, 0.3 moderat, 0.5 sterk." }
          - label: "Innsetting"
            lines:
              - { text: "Med `r = c = 3`, blir `min(r−1, c−1) = 2`:" }
              - { indent: "`V = √(26.31 / (300 · 2))`" }
              - { indent: "`= √(26.31/600)`" }
              - { indent: "`= √0.04385`" }
              - { indent: "`≈ 0.21`" }
          - label: "Tolkning"
            lines:
              - { text: "`V ≈ 0.21` ⇒ svak til moderat sammenheng. Selv om kjikvadrat-testen er sterkt signifikant, er DEN PRAKTISKE styrken bare moderat — testen ble signifikant særlig fordi `n = 300` er stort." }
        result: "`Cramér's V ≈ 0.21` — moderat assosiasjon mellom alder og partivalg."

