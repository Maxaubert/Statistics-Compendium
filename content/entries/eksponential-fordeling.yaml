id: eksponential-fordeling
name_no: Eksponentialfordeling
type: distribution
category: continuous_distribution
tagline: "Tiden mellom hendelser i en poissonprosess (ventetidsfordelingen)."

formula_main: "f(t) = λ · e^(-λt) (tetthet),  F(t) = 1 - e^(-λt) (kumulativ)"
formula_latex: "f(t) = \\lambda e^{-\\lambda t}, \\quad F(t) = 1 - e^{-\\lambda t}"

what_it_does: |
  Modellerer ventetiden T fra et tilfeldig punkt i en poissonprosess til
  neste hendelse, eller mellom to påfølgende hendelser. Verdien er
  kontinuerlig og positiv (T > 0).

why_use: |
  Når problemet handler om TID TIL noe skjer (i kontrast til antall ting
  som skjer), og vi vet eller antar at hendelsene følger en poissonprosess.
  Tett knyttet sammen med Poissonfordeling: hvis antall hendelser er
  Poisson(λt), så er ventetiden eksponentialfordelt med parameter λ.

recognition_cues:
  - "Spørsmålet handler om tid TIL første hendelse, eller mellom to hendelser"
  - "T er en kontinuerlig stokastisk variabel (positivt reelt tall)"
  - "Det er allerede etablert i oppgaven at hendelsene er en poissonprosess"
  - "Spørsmålet er på formen P(T > t), P(T < t) eller P(a < T < b)"
  - "Rate λ er gitt"

when_NOT_to_use:
  - "Spørsmålet teller hendelser i et fast vindu → bruk Poissonfordeling"
  - "Tiden er ikke knyttet til en poissonprosess → annen kontinuerlig fordeling"

symbols:
  - { sym: "λ",  means: "rate (samme λ som i den underliggende poissonprosessen)" }
  - { sym: "t",  means: "ventetiden (alltid > 0)" }
  - { sym: "f(t)", means: "sannsynlighetstettheten – areal under = sannsynlighet" }
  - { sym: "F(t)", means: "kumulativ fordelingsfunksjon, P(T ≤ t)" }
  - { sym: "e",  means: "Eulers tall ≈ 2.71828" }

properties:
  expected_value: "E[T] = 1/λ"
  variance: "Var[T] = 1/λ²"
  std_dev: "σ = 1/λ"

filters:
  computes: [exact_probability, range_probability]
  random_variable: [continuous, time_until_event]
  setup: [single_population, events_in_window]
  structural_cues: [rate_given, process_over_time, independent_events, poisson_process_mentioned, time_until_first]
  parameters_known: [rate_lambda]
  distribution_assumption: [exponential]
  tooling: [calculator_exp]

solution_variants:
  - label: "P(T > t) — overlevelse (ingen hendelse innen t)"
    steps:
      - "Bekreft at problemet handler om tid TIL første hendelse i en poissonprosess, og at spørsmålet er på formen 'ingen hendelse innen t' eller 'T større enn t'"
      - "Identifiser raten `λ` og noter enheten (per minutt, per time, per år, ...)"
      - { text: "Hvis raten er gitt per time men spørsmålet er per minutt (eller motsatt), konvertér først slik at `λ` og `t` har samme tidsenhet", conditional: true }
      - "Bruk overlevelsesformelen direkte: `P(T > t) = e^(−λt)`"
      - "Sett inn tall og regn ut (f.eks. `λ = 1/15` per min, `t = 30` → `P(T > 30) = e^(−2) ≈ 0.135`)"
      - "Sjekk at svaret er mellom 0 og 1, og at det går mot 0 når `t` blir stort"

  - label: "P(T < t) — hendelse innen t"
    steps:
      - "Bekreft at spørsmålet er 'minst én hendelse innen t', 'hendelsen skjer før t', eller 'ventetiden er kortere enn t'"
      - "Identifiser raten `λ` og pass på at `t` er i samme tidsenhet"
      - { text: "Hvis raten er gitt per time men spørsmålet er per minutt (eller motsatt), konvertér først", conditional: true }
      - "Bruk kumulativ fordelingsfunksjon: `F(t) = P(T < t) = 1 − e^(−λt)`"
      - "Sett inn tall og regn ut (f.eks. `λ = 0.01` per time, `t = 48` → `P(T < 48) = 1 − e^(−0.48) ≈ 0.381`)"
      - { text: "Alternativt: regn først `P(T > t) = e^(−λt)` og bruk komplementregelen `P(T < t) = 1 − P(T > t)`. Nyttig hvis du allerede har overlevelsen", conditional: true }
      - "Sjekk at svaret er mellom 0 og 1, og at det går mot 1 når `t` blir stort"

  - label: "P(a < T < b) — intervall"
    steps:
      - "Bekreft at spørsmålet ber om sannsynligheten for at ventetiden faller i et intervall `(a, b)`"
      - "Identifiser `λ`, `a` og `b`, alle med samme tidsenhet"
      - { text: "Hvis intervallets endepunkter er i en annen enhet enn raten, konvertér først", conditional: true }
      - "Bruk differansen av to kumulative: `P(a < T < b) = F(b) − F(a) = e^(−λa) − e^(−λb)`"
      - "Sett inn og regn ut (f.eks. `λ = 1/10` per min, `a = 5`, `b = 15` → `e^(−0.5) − e^(−1.5) ≈ 0.607 − 0.223 = 0.384`)"
      - "Sjekk at `b > a` og at svaret er positivt og mindre enn både `P(T > a)` og `P(T < b)`"

  - label: "Memoryless (gitt at det ikke har skjedd noe i s minutter)"
    steps:
      - { text: "Hvis spørsmålet sier 'gitt at det ikke har skjedd noe i de siste s minutter, hva er sannsynligheten for å vente t til', bruk memoryless-egenskapen i stedet for å betinget regne på vanlig måte", conditional: true }
      - "Memoryless-egenskapen: `P(T > s + t | T > s) = P(T > t)` — fortiden 'glemmes', bare den nye ventetiden `t` betyr noe"
      - "Identifiser `λ` og den nye ventetiden `t` (ikke `s + t`); `s` brukes ikke i utregningen"
      - { text: "Hvis raten og `t` er i ulike enheter, konvertér først", conditional: true }
      - "Bruk overlevelsesformelen på `t` alene: `P(T > t) = e^(−λt)`"
      - "Sett inn tall (f.eks. `λ = 1/15` per min, har ventet `s = 20` min uten hendelse, vil vente `t = 10` min til → `P = e^(−10/15) ≈ 0.513`)"
      - "Tolk: ventetidsfordelingen 'starter på nytt' hvert øyeblikk uten hendelse — typisk for poissonprosesser"

common_traps: |
  Eksponentialfordeling og Poissonfordeling deler samme λ men måler ulike
  ting: Poisson teller hendelser, eksponential måler ventetid. Dobbelsjekk
  at oppgaven faktisk spør om TID, ikke ANTALL. P(T > t) (overlevelse) er
  e^(-λt), ikke 1 - e^(-λt). Husk samme tidsenhet som raten.

python_snippet: |
  from scipy.stats import expon

  lam = 0.01    # rate pr. time
  t = 48        # timer

  # P(T > t) = e^(-λt)
  expon.sf(t, scale=1/lam)        # 0.6188

  # P(T ≤ t) = 1 - e^(-λt)
  expon.cdf(t, scale=1/lam)       # 0.3812

examples:
  - source: "Eksamen jan26 · oppgave 4c"
    excerpt: "La T være tiden, målt i timer, til den første klippeblåvingen blir fanget i fellen. Hvilken fordeling har T?"
    solution_sketch: "Siden vi har en poissonprosess med rate λ = 0.01/t, vil T være eksponentialfordelt med samme λ = 0.01 pr. time."
  - source: "Eksamen jan26 · oppgave 4d"
    excerpt: "Hva er sannsynligheten for at ingen klippeblåvinger fanges i løpet av de første 48 timene?"
    solution_sketch: "P(T > 48) = e^(-0.01·48) = e^(-0.48) ≈ 0.6188"
  - source: "Eksamen jan25 · oppgave 4b (alternativ utregning)"
    excerpt: "Sannsynlighet for minst ett vulkanutbrudd over 5 år er ekvivalent med ventetiden er kortere enn 5 år."
    solution_sketch: "P(T < 60 mnd) = F(60) = 1 - e^(-0.0261·60) = 0.792 (samme som via P(X ≥ 1) i Poisson)"

detailed_solutions:
  - source: "Eksamen jan26 · oppgave 4d"
    question: "Hva er sannsynligheten for at ingen klippeblåvinger fanges i løpet av de første 48 timene? Bruk λ = 0.01 pr. time."
    sections:
      - label: "Identifisering"
        lines:
          - { text: "T = tid til første hendelse" }
          - { text: "T ~ Eksponential(λ = 0.01/t)" }
          - { comment: "spørres om P(T > 48)" }
      - label: "Formel"
        lines:
          - { text: "F(t) = 1 - e^(-λt)" }
          - { text: "P(T > t) = 1 - F(t) = e^(-λt)" }
      - label: "Innsatt"
        lines:
          - { text: "P(T > 48) = e^(-0.01 · 48)" }
          - { indent: "= e^(-0.48)" }
    result: "P(T > 48) ≈ 0.6188"

