id: uordnet-utvalg-uten-tilbakelegging
name_no: "Uordnet utvalg uten tilbakelegging (telling + P)"
type: combinatorics
category: combinatorics
tagline: "Tell uordnede utvalg (`C(n, k)`) og regn sannsynligheter for alle like, ingen, eller blanding fra to kategorier."

formula_main: "C(n, k) = n! / (k! · (n - k)!)"
formula_latex: "\\binom{n}{k} = \\frac{n!}{k! (n-k)!}"

what_it_does: |
  Beregner antall mulige måter å plukke ut `k` elementer fra en mengde
  av `n` forskjellige elementer, når rekkefølgen ikke spiller noen rolle
  og ingen elementer kan trekkes flere ganger. Tallet skrives også som
  binomialkoeffisienten `C(n, k)` eller "n velg k".

why_use: |
  Brukes for å telle antall gunstige eller mulige utvalg i sannsynlighetsberegninger
  med "uniform sannsynlighetsfordeling og uten tilbakelegging" (kort fra
  kortstokk, baller fra urne, etc.). Direkte forbundet med hypergeometrisk
  fordeling og binomial sannsynlighet.

recognition_cues:
  - "Du trekker eller velger ut `k` elementer fra `n` (eller `N` i sannsynlighets-varianter)"
  - "Rekkefølgen er IKKE viktig (samme utvalg uansett rekkefølge)"
  - "UTEN tilbakelegging: hvert element kan velges maksimalt én gang"
  - "Ofte blir det gunstige/mulige med `C(A₁, k₁)·C(A₂, k₂) / C(N, k)` (hypergeometrisk: del populasjon i 2 kategorier, plukk noen fra hver)"

when_NOT_to_use:
  - "Rekkefølgen teller, uten tilbakelegging → bruk [ordnet utvalg uten tilbakelegging](/entry/ordnet-utvalg-uten-tilbakelegging) (`n!/(n−k)!`)"
  - "Tilbakelegging er tillatt (rekkefølgen teller) → bruk [ordnet utvalg med tilbakelegging](/entry/ordnet-utvalg-med-tilbakelegging) (`n^k`)"
  - "Antall suksesser i `n` uavhengige forsøk med konstant `p` → bruk [binomialfordeling](/entry/binomial-fordeling)"
  - "Oppgaven definerer `X` som en STOKASTISK VARIABEL og spør om `E[X]`, `Var[X]`, `σ`, eller bruker «X ~ ...»-notasjon → bruk [hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling). Selve sannsynlighetsformelen `C(K, k)·C(N − K, n − k) / C(N, n)` er den samme, men hypergeometrisk-entryen har forventning, varians og det fulle fordelings-rammeverket. Tommelfingerregel: «hvor mange måter / hva er sannsynligheten» ⇒ denne entryen; «hva er fordelingen til `X` / forventet antall / standardavvik» ⇒ hypergeometrisk."

symbols:
  - { sym: "n",       means: "antall elementer i populasjonen — brukes i ren telling-variant (samme rolle som `N` i sannsynlighets-variantene)" }
  - { sym: "k",       means: "antall vi trekker ut (sample size). Visuelt distinkt fra `K` — vi bruker `A` for kategori-størrelse i stedet for å unngå forveksling" }
  - { sym: "N",       means: "TOTAL populasjon i sannsynlighets-variantene (samme rolle som `n` i tellings-varianten)" }
  - { sym: "A",       means: "antall i kategori A — «suksesser» i populasjonen" }
  - { sym: "M",       means: "antall IKKE i kategori A, `M = N − A` — «ikke-suksesser» i populasjonen" }
  - { sym: "A₁, A₂",  means: "antall i kategori 1 og 2 når oppgaven har to navngitte kategorier (jenter/gutter, røde/svarte)" }
  - { sym: "k₁, k₂",  means: "antall trukket fra hver kategori (`k₁ + k₂ = k`)" }
  - { sym: "m",       means: "antall par/symmetriske kategorier (i par-fanen)" }
  - { sym: "j",       means: "antall komplette par i utvalget (i par-fanen)" }
  - { sym: "n!",      means: "`n`-fakultet, `n·(n−1)·...·1`" }
  - { sym: "C(n,k)",  means: "binomialkoeffisient, også skrevet som `ⁿCₖ` eller `(n velg k)`" }

filters:
  computes: [combinatorial_count, exact_probability]
  random_variable: [discrete_count]
  setup: [single_population, without_replacement, finite_pool]
  structural_cues: [complement_pattern, all_same_type, mixed_categories, no_occurrences]
  distribution_assumption: [none_assumed, hypergeometric]
  tooling: [calculator_binomial_coef, calculator_factorial]

solution_variants:
  - label: "Antall utvalg"
    recognition: "«Hvor mange måter kan vi velge `k` av `n` på (rekkefølge spiller ingen rolle)?», «hvor mange forskjellige hender i poker?». `C(n, k) = n!/(k!(n−k)!)`."
    steps:
      - "Identifiser `n` (totalt antall elementer) og `k` (antall som skal velges)"
      - "Bekreft at rekkefølgen IKKE betyr noe og at samme element ikke kan velges to ganger (uten tilbakelegging)"
      - text: "Beregn binomialkoeffisienten på kalkulator (typisk `nCr` eller `COMB`):"
        formula: "C(n, k) = n! / (k! · (n − k)!)"
      - text: "Eksempel — Lotto-kupong (`n = 34`, `k = 7`):"
        formula: "C(34, 7) = 34!/(7!·27!) = 5 379 616"
        example: true
      - text: "Hvis `k` er stor og du må regne for hånd, bruk symmetrien `C(n, k) = C(n, n − k)` for å redusere arbeidet"
        conditional: true
  - label: "Alle (eller ikke alle) samme type"
    recognition: "«Sannsynligheten for at alle de `k` trukne er røde», «alle som ble valgt er kvinner», eller motsatt: «minst én er av en annen type», «ikke alle er like». Uten tilbakelegging."
    steps:
      - text: "For denne formelen trenger du KUN tre tall: `N`, `A`, og `k`. Identifiser dem fra oppgaven:"
        formula:
          - "N  = total populasjon"
          - "A  = antall i den ønskede kategorien (kategori A — det du vil alle k skal komme fra)"
          - "k  = antall du trekker"
      - text: "Sannsynligheten for ALLE eller IKKE ALLE av samme type (komplementet er bare `1 − ` første formel):"
        formula:
          - "P(alle k er A)       = C(A, k) / C(N, k)"
          - "P(ikke alle k er A)  = 1 − C(A, k) / C(N, k)"
      - text: "Eksempel — 5 hjerter fra 52-korts stokk (`N = 52`, `A = 13`, `k = 5`):"
        formula:
          - "P(alle hjerter)       = C(13, 5) / C(52, 5) = 1 287 / 2 598 960 ≈ 4.95·10⁻⁴"
          - "P(ikke alle hjerter)  = 1 − 4.95·10⁻⁴ ≈ 0.9995"
        example: true
      - { text: "**Hvis du har `m` symmetriske kategorier (par sko, par sokker, par batcher) og spørsmålet er om matchende par**, bruk heller **«Sannsynlighet for par»-fanen** — den håndterer alle `k`-verdier korrekt. Formelen under fungerer kun når `k ≤ A` (du kan trekke alle k fra ÉN av kategoriene).", conditional: true }
      - text: "Med `m` like kategorier av størrelse `A`, sannsynlighet for at alle `k` kommer fra én og samme kategori:"
        formula: "P(alle k fra én av m kategoriene) = m · C(A, k) / C(N, k)     (krever k ≤ A)"
        conditional: true
      - { text: "Alternativt: bruk produktregelen sekvensielt — plukk én sko (uansett), så er sjansen for matchende andre `(A−1)/(N−1)`, osv. Begge metoder gir samme svar.", conditional: true }
      - text: "Sekvensiell form (uten tilbakelegging):"
        formula: "P = (A/N) · ((A−1)/(N−1)) · … · ((A−k+1)/(N−k+1))"
        conditional: true
  - label: "Ingen av type A"
    recognition: "«Sannsynligheten for at ingen av de `k` er defekte», «ingen ess i hånda». Uten tilbakelegging."
    steps:
      - text: "For denne formelen trenger du KUN tre tall: `N`, `M`, og `k`. Identifiser dem fra oppgaven:"
        formula:
          - "N  = total populasjon"
          - "M  = antall IKKE i den uønskede kategorien (det du vil alle k skal komme fra)"
          - "k  = antall du trekker"
      - { text: "Tips: hvis oppgaven oppgir `A` (antall i kategori A) i stedet for `M`, regn `M = N − A`. F.eks. 52 kort med 13 hjerter ⇒ `M = 52 − 13 = 39` ikke-hjerter.", conditional: true }
      - text: "Sannsynligheten (gunstige `C(M, k)` over mulige `C(N, k)`):"
        formula: "P(ingen av k er A) = C(M, k) / C(N, k)"
      - text: "Eksempel — ingen hjerter blant 5 kort (`N = 52`, `M = 39` ikke-hjerter, `k = 5`):"
        formula: "P = C(39, 5) / C(52, 5) = 575 757 / 2 598 960 ≈ 0.222"
        example: true
      - text: "Pass på: dette er IKKE `(1 − p)^k` med `p = A/N`, fordi sannsynlighetene endrer seg når det trekkes uten tilbakelegging. Bruk kombinasjonsformelen, ikke binomialformelen."
        conditional: true
  - label: "Eksakt x av type A"
    recognition: "«Sannsynligheten for nøyaktig `x` av kategori A blant `k` trukne», «3 røde av 5 trekninger». Standard hypergeometrisk-formel. Generaliserer «Alle» (`x = k`) og «Ingen» (`x = 0`)."
    steps:
      - text: "For denne formelen trenger du fire tall: `N`, `A`, `k`, og `x`. Identifiser dem fra oppgaven:"
        formula:
          - "N  = total populasjon"
          - "A  = antall i kategori A (suksesser i populasjonen)"
          - "k  = antall du trekker"
          - "x  = antall av kategori A du vil ha i utvalget"
      - { text: "Definer også `M = N − A` (ikke-A-gruppen) for å gjøre formelen renere.", conditional: true }
      - text: "Sannsynligheten:"
        formula: "P(eksakt x av A) = C(A, x) · C(M, k − x) / C(N, k)"
      - text: "Eksempel — trekk 5 kort fra 52, finn `P(eksakt 3 hjerter)` (`N = 52, A = 13, M = 39, k = 5, x = 3`):"
        formula:
          - "C(13, 3) = 286"
          - "C(39, 2) = 741"
          - "C(52, 5) = 2 598 960"
          - "P = 286 · 741 / 2 598 960 ≈ 0.0815"
        example: true
      - { text: "Spesialtilfeller: `x = k` gir formelen i «Alle samme type»-fanen; `x = 0` gir formelen i «Ingen av type A»-fanen.", conditional: true }
      - { text: "Identisk med hypergeometrisk-formelen `P(X = x) = C(K, x)·C(N − K, n − x)/C(N, n)` — bare med annet navn på variablene.", conditional: true }
  - label: "Par-mønstre (m par)"
    recognition: "«5 par sko/sokker/poser, trekk k poser — hva er sjansen for nøyaktig j par?». Når kategoriene er likeverdige par (hver av størrelse 2) er det ingen forhåndsbestemt «kategori A» — du må kombinere valg med multiplikasjonsprinsippet."
    steps:
      - text: "For disse formlene trenger du tre tall:"
        formula:
          - "m  = antall par"
          - "N  = 2·m = totalt antall enkeltelementer"
          - "k  = antall du trekker"
      - text: "**Generell formel** — sannsynligheten for nøyaktig `j` komplette par i utvalget (`C(N, k)` er alltid nevneren):"
        formula:
          - "P(nøyaktig j par) = C(m, j) · C(m − j, k − 2j) · 2^(k − 2j) / C(N, k)"
          - "Gyldig når: k − 2j ≥ 0  og  k − 2j ≤ m − j"
      - text: "Tre vanlige spesialtilfeller (sett `j = 0, 1, 2` inn i den generelle):"
        formula:
          - "j=0  P(ingen par)       = C(m, k) · 2ᵏ              / C(N, k)"
          - "j=1  P(nøyaktig 1 par)  = m · C(m−1, k−2) · 2^(k−2) / C(N, k)"
          - "j=2  P(nøyaktig 2 par)  = C(m, 2) · C(m−2, k−4) · 2^(k−4) / C(N, k)"
          - "     P(minst ett par)   = 1 − P(ingen par)"
      - text: "Eksempel — `m = 5 par`, `N = 10`, `k = 4`:"
        formula:
          - "P(ingen par)      = C(5, 0)·C(5, 4)·2⁴ / C(10, 4) = 80/210 ≈ 0.381"
          - "P(nøyaktig 1 par) = C(5, 1)·C(4, 2)·2² / C(10, 4) = 120/210 ≈ 0.571"
          - "P(nøyaktig 2 par) = C(5, 2)·C(3, 0)·2⁰ / C(10, 4) = 10/210 ≈ 0.048"
          - "Sjekk: 0.381 + 0.571 + 0.048 = 1.000 ✓"
        example: true
      - { text: "**For `k = 4`** er maks mulige par 2 (siden hvert par krever 2 plasser). For større `k`-verdier kan du få 3, 4, ... par — bare bruk samme generelle formel med `j = 3, 4, …` så lenge gyldighetsbetingelsene holder.", conditional: true }
      - { text: "**Hvorfor passer ikke «alle k er A»-formelen?** Den krever én forhåndsbestemt kategori og at alle k kommer fra den. Med `k = 4` og parstørrelse 2 gir `C(2, 4) = 0` — alltid umulig. Her er det ikke ett par som er «kategorien», men hele systemet av m par.", conditional: true }

  - label: "Blanding: k₁ fra A og k₂ fra B"
    recognition: "«Sannsynligheten for `k₁` røde og `k₂` blå i et utvalg av `k₁ + k₂`», «2 jenter og 3 gutter i komiteen». Hypergeometrisk-mønster."
    steps:
      - text: "For denne formelen trenger du fem tall: `N`, `A₁`, `A₂`, `k₁`, og `k₂`. Identifiser dem fra oppgaven:"
        formula:
          - "N   = total populasjon"
          - "A₁  = antall i kategori 1 (røde, jenter, ...)"
          - "A₂  = antall i kategori 2 (blå, gutter, ...) — typisk `A₂ = N − A₁`"
          - "k₁  = antall du vil trekke fra kategori 1"
          - "k₂  = antall du vil trekke fra kategori 2 (`k₁ + k₂ = k`)"
      - text: "Sannsynligheten (gunstige = uavhengige valg fra hver kategori ganget sammen, over mulige `C(N, k)`):"
        formula: "P = C(A₁, k₁) · C(A₂, k₂) / C(N, k)"
      - text: "Eksempel — komité med 2 jenter og 2 gutter fra klasse 10 J + 15 G:"
        formula: "P = C(10,2)·C(15,2) / C(25,4) = 45·105 / 12 650 ≈ 0.374"
        example: true
      - text: "Dette er hypergeometrisk sannsynlighet — det samme regnestykket som [hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling), bare uttrykt direkte med binomialkoeffisienter. Pass på at `k₁ + k₂ = k` (totalt trukne)."
        conditional: true

common_traps: |
  - **`C(n, k) ≠ n^k` og `C(n, k) ≠ P(n, k)`**: `n^k` er ordnet MED tilbakelegging,
    `P(n, k) = n!/(n−k)!` er ordnet UTEN tilbakelegging, og `C(n, k)` er uordnet
    uten tilbakelegging. Forholdet `P(n, k) = C(n, k)·k!`.
  - **Gyldig område**: `0 ≤ k ≤ n`, og både `n` og `k` må være heltall.
    Ber oppgaven om `C(5, 7)` (`k > n`), er det `0` — eller en feillesning.
  - **Trekk uten tilbakelegging fra to kategorier**: bruk produktet
    `C(A₁, k₁)·C(A₂, k₂) / C(N, k)` for "nøyaktig `k₁` av type 1 og `k₂` av type 2
    blant `k` trukne, `k₁ + k₂ = k`". Dette er hypergeometrisk sannsynlighet.
  - **"Minst én"**: regn komplementet `1 − C(M, k)/C(N, k)` ("ingen av type A"),
    ikke summer `P(1) + P(2) + …`. Vesentlig raskere.
  - **Symmetri**: `C(n, k) = C(n, n − k)`. Praktisk når `k` er nær `n` —
    f.eks. `C(20, 18) = C(20, 2) = 190`, slipper du å regne `20!/(18!·2!)` ut.
  - **Ikke bruk binomial**: når trekningen er uten tilbakelegging endrer `p`
    seg underveis. Bruk hypergeometrisk/C-formel, ikke `(A/N)^k·(1−A/N)^(n−k)`.
  - **Par-mønstre**: når populasjonen er `m` likeverdige par (sko, sokker,
    batch-poser), bruk **par-fanen** — IKKE «alle k er A»-formelen (som gir
    0 hvis `k > 2` fordi hvert par bare har 2 elementer).

detailed_solution_variants:
  - label: "Antall utvalg"
    solutions:
      - source: "Praksiseksempel · Lotto"
        question: "I norsk Lotto velger man 7 tall fra 34 mulige. På hvor mange måter kan dette gjøres?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Populasjonen består av `n = 34` tall, og vi velger `k = 7` av disse." }
              - { text: "Rekkefølgen er likegyldig (en lottokupong er den samme uansett hvilken rekkefølge tallene krysses av i)." }
              - { text: "Hvert tall kan velges maksimalt én gang, altså uten tilbakelegging." }
              - { comment: "Klassisk binomialkoeffisient-anvendelse: ren telling, ingen sannsynlighet." }
          - label: "Formel"
            lines:
              - { text: "`C(n, k) = n! / (k! · (n − k)!)`" }
          - label: "Innsatt"
            lines:
              - { text: "`C(34, 7) = 34! / (7! · 27!)`" }
              - { indent: "`= (34 · 33 · 32 · 31 · 30 · 29 · 28) / (7 · 6 · 5 · 4 · 3 · 2 · 1)`" }
              - { indent: "`= 27 113 264 640 / 5 040`" }
              - { indent: "`= 5 379 616`" }
        result: "`C(34, 7) = 5 379 616` mulige kuponger"

      - source: "Praksiseksempel · femkortshånd"
        question: "Hvor mange ulike femkortshender finnes fra en kortstokk med 52 kort?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 52` ulike kort, `k = 5` trekkes." }
              - { text: "Rekkefølgen i hånda spiller ingen rolle, og samme kort kan ikke trekkes to ganger." }
          - label: "Formel"
            lines:
              - { text: "`C(n, k) = n! / (k! · (n − k)!)`" }
          - label: "Innsatt"
            lines:
              - { text: "`C(52, 5) = 52! / (5! · 47!)`" }
              - { indent: "`= (52 · 51 · 50 · 49 · 48) / (5 · 4 · 3 · 2 · 1)`" }
              - { indent: "`= 311 875 200 / 120`" }
              - { indent: "`= 2 598 960`" }
        result: "`C(52, 5) = 2 598 960` mulige hender"

  - label: "Alle (eller ikke alle) samme type"
    solutions:
      - source: "Praksis · sko i mørket"
        question: "I en mørk garderobe ligger det fem par sko i en haug. Du plukker tilfeldig opp to sko. Hva er sannsynligheten for at skoene du har plukket opp hører sammen (utgjør et par)?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Totalt `N = 10` sko (5 par à 2). Vi plukker `k = 2`." }
              - { text: "Hvert par utgjør en «kategori» med `A = 2` likeverdige sko. Det finnes 5 slike kategorier (parene)." }
              - { text: "«Skoene hører sammen» = begge fra SAMME par. Per par gjelder den vanlige formelen, og vi summerer over alle 5 parene." }
          - label: "Formel"
            lines:
              - { text: "For ETT bestemt par X:" }
              - { indent: "`P(begge fra par X) = C(2, 2) / C(10, 2)`" }
              - { text: "Det er 5 par som hver gir et matchende utfall — summer:" }
              - { indent: "`P(par) = 5 · C(2, 2) / C(10, 2)`" }
          - label: "Innsatt"
            lines:
              - { text: "Mulige (hvilke som helst 2 sko av 10):" }
              - { indent: "`C(10, 2) = 45`" }
              - { text: "Gunstige (5 matchende par, hvert med `C(2, 2) = 1` måte):" }
              - { indent: "`5 · 1 = 5`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 5 / 45 = 1/9 ≈ 0.111`" }
              - { comment: "Alternativt: plukk én sko (uansett), så er sjansen for matchende andre 1/9. Samme svar." }
        result: "`P(matchende par) = 1/9 ≈ 0.111` (11.1 %)"

  - label: "Ingen av type A"
    solutions:
      - source: "Praksiseksempel · ingen hjerter"
        question: "Vi trekker 5 kort fra en kortstokk med 52 kort, hvorav 13 er hjerter. Hva er sannsynligheten for at INGEN av de uttrukne er hjerter?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`N = 52` kort, `A = 13` hjerter (kategori A), `k = 5` trukne." }
              - { text: "Antall IKKE i kategori A: `M = N − A = 52 − 13 = 39` ikke-hjerter." }
              - { text: "«Ingen hjerter» betyr at alle 5 kommer fra `M`-gruppen." }
          - label: "Formel"
            lines:
              - { text: "`P(ingen av k er A) = C(M, k) / C(N, k)`" }
          - label: "Innsatt"
            lines:
              - { text: "Antall gunstige (5 valgt fra `M = 39` ikke-hjerter):" }
              - { indent: "`C(39, 5) = 39! / (5! · 34!) = 575 757`" }
              - { text: "Antall mulige (5 kort blant 52):" }
              - { indent: "`C(52, 5) = 2 598 960`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 575 757 / 2 598 960 ≈ 0.2215`" }
              - { comment: "Sjekk: dette er IKKE (1 − 13/52)^5 = 0.2373. Forskjellen kommer av at p endrer seg uten tilbakelegging." }
        result: "`P(ingen hjerter) ≈ 0.2215`"

  - label: "Blanding: k₁ fra A og k₂ fra B"
    solutions:
      - source: "Praksiseksempel · klassetilfeldighet"
        question: "En klasse har 25 studenter, hvorav 10 er jenter og 15 er gutter. Læreren skal velge tilfeldig en gruppe på 4 studenter til å presentere et prosjekt. Hva er sannsynligheten for at gruppen består av nøyaktig 2 jenter og 2 gutter?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`N = 25` studenter totalt, `A₁ = 10` jenter, `A₂ = 15` gutter." }
              - { text: "Vi velger `k = 4` studenter, der vi vil ha `k₁ = 2` jenter og `k₂ = 2` gutter (`k₁ + k₂ = k`)." }
              - { text: "Rekkefølgen spiller ingen rolle, og samme student kan ikke velges to ganger." }
          - label: "Formel"
            lines:
              - { text: "`P = C(A₁, k₁) · C(A₂, k₂) / C(N, k)`" }
          - label: "Innsatt"
            lines:
              - { text: "Antall måter å velge 2 jenter blant 10:" }
              - { indent: "`C(10, 2) = 10! / (2! · 8!) = 45`" }
              - { text: "Antall måter å velge 2 gutter blant 15:" }
              - { indent: "`C(15, 2) = 15! / (2! · 13!) = 105`" }
              - { text: "Antall mulige grupper på 4 fra 25:" }
              - { indent: "`C(25, 4) = 25! / (4! · 21!) = 12 650`" }
              - { text: "Antall gunstige (2 jenter OG 2 gutter):" }
              - { indent: "`45 · 105 = 4 725`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 4 725 / 12 650 ≈ 0.3735`" }
        result: "`P(2 jenter og 2 gutter) ≈ 0.3735`"

      - source: "Praksiseksempel · Poker (fire like)"
        question: "Hva er sannsynligheten for å få nøyaktig 'fire like' i en femkortshånd fra en standard kortstokk?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`N = 52` kort, `k = 5` trukne." }
              - { text: "«Fire like» = 4 kort av én valør + 1 kort av en hvilken som helst annen valør. Dette er en blanding fra to kategorier (den valgte valøren og resten)." }
              - { text: "Vi må først velge HVILKEN valør som skal være firlingen (13 mulige valører), så telle utvalg." }
          - label: "Formel"
            lines:
              - { text: "Per valg av valør: `C(A₁, k₁) · C(A₂, k₂)` med `A₁ = 4` (kort av valøren), `k₁ = 4`, `A₂ = 48` (alle andre kort), `k₂ = 1`." }
              - { text: "Total gunstige: 13 · `C(4, 4) · C(48, 1)`" }
              - { text: "Sannsynlighet: `P = gunstige / C(N, k)`" }
          - label: "Innsatt"
            lines:
              - { text: "Per valør: `C(4, 4) · C(48, 1) = 1 · 48 = 48`" }
              - { text: "Multipliser med 13 valører: `13 · 48 = 624`" }
              - { text: "Antall mulige hender: `C(52, 5) = 2 598 960`" }
              - { text: "Sannsynligheten:" }
              - { indent: "`P = 624 / 2 598 960 ≈ 2.40 · 10⁻⁴`" }
        result: "`P(fire like) ≈ 0.00024`"

