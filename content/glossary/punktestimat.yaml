id: punktestimat
term_no: Punktestimat
short_def: "Ett tall som er beste gjet av en parameter, regnet ut fra dataene."
filters:
  computes: [parameter_estimate]
  random_variable: [mean_of_samples, proportion]
  setup: [single_population]
  structural_cues: [data_as_list]
  parameters_known: [success_p, rate_lambda]
  distribution_assumption: [poisson, binomial]
long_def: |
  Når du har data fra et utvalg, regner du ut et "best guess" for en
  ukjent parameter (`μ`, `p`, `σ`, `β`…). Dette ene tallet kalles et
  punktestimat.

  Punktestimater alene sier ingenting om usikkerheten — for det trenger
  du et konfidensintervall.
see_also:
  - { id: ki-mu-kjent-sigma, kind: entry }
  - { id: ki-mu-ukjent-sigma, kind: entry }
