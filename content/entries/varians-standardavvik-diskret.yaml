id: varians-standardavvik-diskret
name_no: "Varians og standardavvik (diskret stokastisk variabel)"
type: identity
category: distribution_property
tagline: "σ² = E[X²] - μ²; σ = √σ². Mål for spredning rundt forventningsverdien."

formula_main: "Var(X) = E[X²] - μ² = Σ x_i² · P(X = x_i) - μ²;  σ = √Var(X)"
formula_latex: "\\text{Var}(X) = E[X^2] - \\mu^2 = \\sum_i x_i^2 \\cdot P(X = x_i) - \\mu^2"

what_it_does: |
  Beregner variansen og standardavviket til en diskret stokastisk variabel.
  Variansen er forventet kvadratavvik fra μ; standardavviket σ er
  kvadratroten og er målt i samme enhet som X.

why_use: |
  Mål for spredning. Inngår i nesten all videre statistisk inferens
  (z-test, t-test, KI, kovarians, korrelasjon).

recognition_cues:
  - "Diskret stokastisk variabel med kjent sannsynlighetsfordeling"
  - "Spørsmålet ber om Var(X), σ², σ, eller standardavviket"

symbols:
  - { sym: "Var(X), σ²", means: "variansen" }
  - { sym: "σ",          means: "standardavviket, σ = √Var(X)" }
  - { sym: "μ",          means: "forventningsverdien E[X]" }
  - { sym: "E[X²]",      means: "Σ x_i² · P(X = x_i)" }

filters:
  computes: [std_dev]
  random_variable: [discrete_count]
  setup: [single_population, joint_table_given]
  structural_cues: [joint_table_present, summary_stats_given]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]

solution_template:
  - "Finn først E[X] = μ"
  - "Beregn E[X²] = Σ x_i²·P(X=x_i)"
  - "Var(X) = E[X²] - μ²"
  - "σ = √Var(X)"

common_traps: |
  Pass på rekkefølgen: σ² = E[X²] - μ², ikke E[(X-μ)²] uten utledning. Begge er
  ekvivalente, men førsteformen er mer praktisk for utregning. Husk å kvadrere
  μ til slutt: μ², ikke 2μ.

detailed_solution_variants:
  - label: "Varians og standardavvik (diskret SV)"
    solutions:
      - source: "Eksamen jan25 · oppgave 2c"
        question: "X tar verdier {-2, -1, 0, 1, 2} med sannsynligheter {0.3, 0.2, 0.2, 0.1, 0.2}, og `μ = -0.3`. Finn `Var(X)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X er diskret stokastisk variabel med verdiområde `{-2, -1, 0, 1, 2}`." }
              - { text: "Sannsynligheter: `P(X=-2)=0.3`, `P(X=-1)=0.2`, `P(X=0)=0.2`, `P(X=1)=0.1`, `P(X=2)=0.2`." }
              - { text: "Sjekk: `0.3 + 0.2 + 0.2 + 0.1 + 0.2 = 1.0` ✓" }
              - { text: "Forventningsverdi oppgitt: `μ = -0.3`." }
          - label: "Forventningsverdi"
            lines:
              - { text: "Verifiser `E[X] = Σ x_i · P(X=x_i)`:" }
              - { indent: "= `(-2)·0.3 + (-1)·0.2 + 0·0.2 + 1·0.1 + 2·0.2`" }
              - { indent: "= `-0.6 - 0.2 + 0 + 0.1 + 0.4`" }
              - { indent: "= `-0.3`" }
              - { text: "Stemmer med oppgitt `μ = -0.3`." }
          - label: "E[X²]"
            lines:
              - { text: "`E[X²] = Σ x_i² · P(X=x_i)`:" }
              - { indent: "= `(-2)²·0.3 + (-1)²·0.2 + 0²·0.2 + 1²·0.1 + 2²·0.2`" }
              - { indent: "= `4·0.3 + 1·0.2 + 0 + 1·0.1 + 4·0.2`" }
              - { indent: "= `1.2 + 0.2 + 0 + 0.1 + 0.8`" }
              - { indent: "= `2.3`" }
          - label: "Varians og σ"
            lines:
              - { text: "`σ² = E[X²] - μ² = 2.3 - (-0.3)² = 2.3 - 0.09 = 2.21`" }
              - { text: "`σ = √2.21 ≈ 1.487`" }
        result: "Var(X) = 2.21,  σ ≈ 1.487"

      - source: "Praksis · diskret SV med fire verdier"
        question: "X tar verdier `{0, 1, 2, 3}` med sannsynligheter `{0.1, 0.3, 0.4, 0.2}`. Tidligere fant vi `E[X] = 1.7`. Beregn `Var(X)` og `σ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X er diskret stokastisk variabel med verdiområde `{0, 1, 2, 3}`." }
              - { text: "Sannsynligheter: `P(X=0)=0.1`, `P(X=1)=0.3`, `P(X=2)=0.4`, `P(X=3)=0.2`." }
              - { text: "Sjekk: `0.1 + 0.3 + 0.4 + 0.2 = 1.0` ✓" }
              - { text: "Oppgitt: `μ = E[X] = 1.7`." }
          - label: "Forventningsverdi"
            lines:
              - { text: "Verifiser `E[X] = Σ x_i · P(X=x_i)`:" }
              - { indent: "= `0·0.1 + 1·0.3 + 2·0.4 + 3·0.2`" }
              - { indent: "= `0 + 0.3 + 0.8 + 0.6`" }
              - { indent: "= `1.7`" }
              - { text: "Stemmer med oppgitt `μ = 1.7`." }
          - label: "E[X²]"
            lines:
              - { text: "`E[X²] = Σ x_i² · P(X=x_i)`:" }
              - { indent: "= `0²·0.1 + 1²·0.3 + 2²·0.4 + 3²·0.2`" }
              - { indent: "= `0·0.1 + 1·0.3 + 4·0.4 + 9·0.2`" }
              - { indent: "= `0 + 0.3 + 1.6 + 1.8`" }
              - { indent: "= `3.7`" }
          - label: "Varians og σ"
            lines:
              - { text: "`σ² = E[X²] - μ² = 3.7 - 1.7² = 3.7 - 2.89 = 0.81`" }
              - { text: "`σ = √0.81 = 0.9`" }
              - { text: "Pent tall siden `0.81 = 0.9²`." }
        result: "Var(X) = 0.81,  σ = 0.9"

      - source: "Praksis · lineær transformasjon `Var(aX+b) = a²·Var(X)`"
        question: "La X ta verdier `{0, 1, 2, 3}` med `p = {0.1, 0.3, 0.4, 0.2}` (samme som over, `Var(X) = 0.81`). Definer `Y = 2X + 5`. Vis at `Var(Y) = 4·Var(X)` ved direkte utregning."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X er diskret SV med verdiområde `{0, 1, 2, 3}` og `p = {0.1, 0.3, 0.4, 0.2}`." }
              - { text: "Y = 2X + 5 tar dermed verdier `{5, 7, 9, 11}` med samme sannsynligheter." }
              - { text: "Påstand: `Var(aX + b) = a²·Var(X)`, dvs. `Var(Y) = 4·0.81 = 3.24`." }
          - label: "Forventningsverdi"
            lines:
              - { text: "Fra X: `μ_X = 1.7` (vist tidligere)." }
              - { text: "For Y: `E[Y] = E[2X + 5] = 2·E[X] + 5 = 2·1.7 + 5 = 8.4`." }
              - { text: "Direkte: `E[Y] = 5·0.1 + 7·0.3 + 9·0.4 + 11·0.2`" }
              - { indent: "= `0.5 + 2.1 + 3.6 + 2.2 = 8.4` ✓" }
          - label: "E[X²]"
            lines:
              - { text: "Her trenger vi `E[Y²]` for å regne ut `Var(Y)` direkte." }
              - { text: "`E[Y²] = Σ y_i² · P(Y=y_i)`:" }
              - { indent: "= `5²·0.1 + 7²·0.3 + 9²·0.4 + 11²·0.2`" }
              - { indent: "= `25·0.1 + 49·0.3 + 81·0.4 + 121·0.2`" }
              - { indent: "= `2.5 + 14.7 + 32.4 + 24.2`" }
              - { indent: "= `73.8`" }
          - label: "Varians og σ"
            lines:
              - { text: "`Var(Y) = E[Y²] - (E[Y])² = 73.8 - 8.4² = 73.8 - 70.56 = 3.24`" }
              - { text: "Sjekk regelen: `a²·Var(X) = 2²·0.81 = 4·0.81 = 3.24` ✓" }
              - { text: "`σ_Y = √3.24 = 1.8 = 2·0.9 = a·σ_X`, som forventet." }
              - { comment: "Konstantleddet b = 5 forskyver fordelingen, men endrer ikke spredningen." }
        result: "Var(Y) = 3.24,  σ_Y = 1.8"

related:
  - { id: "forventningsverdi-diskret", kind: "entry" }
  - { id: "kovarians",                 kind: "entry" }
  - { id: "korrelasjon-joint",         kind: "entry" }

tools:
  - "Kalkulator: kvadrering, kvadratrot, summer"
