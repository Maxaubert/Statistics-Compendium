id: komplement
term_no: Komplement (Ā, A^c)
short_def: "Hendelsen «ikke A» — alle utfall som ikke ligger i `A`. `P(Ā) = 1 − P(A)`."
filters:
  computes: [exact_probability, at_least_k, union_probability]
  structural_cues: [complement_pattern]
  distribution_assumption: [binomial, poisson]
long_def: |
  Komplementet skrives `Ā`, `A^c` eller `A'`. Komplementregelen er en
  av de enkleste, men mest nyttige reglene:

      P(Ā) = 1 − P(A)

  Brukes når det er lettere å regne «minst én» som «1 − ingen», eller
  «ikke alle» som «1 − alle».

  **Eksempel** — minst én treff i `n` forsøk:

      P(minst én treff) = 1 − P(null treff) = 1 − (1 − p)^n
