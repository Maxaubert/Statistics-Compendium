id: produktregel
name_no: "Produktregelen og betinget sannsynlighet"
type: rule
category: probability_rule
tagline: "P(A ∩ B) = P(A) · P(B|A) – sannsynlighet for at to hendelser begge inntreffer."

formula_main: "P(A ∩ B) = P(A) · P(B | A);  P(B | A) = P(A ∩ B) / P(A)"
formula_latex: "P(A \\cap B) = P(A) \\cdot P(B|A), \\quad P(B|A) = \\frac{P(A \\cap B)}{P(A)}"

what_it_does: |
  Definerer betinget sannsynlighet og produktregelen som en omformulering
  av samme regel. Sier hvordan sannsynligheter kombineres når hendelser
  skjer i sekvens. For uavhengige hendelser er P(B|A) = P(B), så
  P(A ∩ B) = P(A)·P(B).

why_use: |
  Grunnleggende verktøy for sekvensielle hendelser (f.eks. trekninger fra
  en kortstokk uten tilbakelegging) og for å regne om mellom betinget
  og felles sannsynlighet.

recognition_cues:
  - "Sekvensielle hendelser, der den andre avhenger av den første"
  - "Spørsmålet involverer 'gitt at A inntreffer' eller 'først, så'"
  - "Du har P(A) og P(B|A), eller du vil finne P(B|A)"
  - "Trekning uten tilbakelegging der p endrer seg etter første trekning"

when_NOT_to_use:
  - "Hendelsene er uavhengige → P(A ∩ B) = P(A)·P(B) er enklere"

symbols:
  - { sym: "P(A ∩ B)",   means: "sannsynlighet for at både A og B inntreffer" }
  - { sym: "P(B | A)",    means: "betinget sannsynlighet for B, gitt at A inntreffer" }

filters:
  computes: [exact_probability, conditional_probability, joint_probability]
  random_variable: []
  setup: [single_population, without_replacement]
  structural_cues: [conditional_given, independent_events]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_template:
  - "Identifiser hendelsene A og B"
  - "Avgjør om hendelsene er sekvensielle eller du vil finne en betinget sannsynlighet"
  - "Hvis A og B er uavhengige: P(A ∩ B) = P(A)·P(B)"
  - "Ellers: P(A ∩ B) = P(A) · P(B|A) (eller via P(A|B))"

common_traps: |
  P(B|A) er IKKE det samme som P(A|B) generelt – bytte rekkefølge gir
  feil svar (med mindre A og B er uavhengige). For å konvertere mellom
  dem, bruk Bayes' setning.

detailed_solution_variants:
  - label: "Produktregel for snitt"
    solutions:
      - source: "Praksis · trekk uten tilbakelegging"
        question: "En urne inneholder 5 røde og 3 hvite kuler. Vi trekker to kuler uten tilbakelegging. Hva er sannsynligheten for at begge er røde?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «første kule er rød» og `B` = «andre kule er rød»." }
              - { text: "Hendelsene er sekvensielle og IKKE uavhengige – sammensetningen i urnen endrer seg etter første trekning." }
              - { text: "Vi skal bruke produktregelen med betinget sannsynlighet." }
          - label: "Formel"
            lines:
              - { text: "Generell produktregel:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B | A)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 5/8`  (5 røde av 8 totalt ved første trekning)" }
              - { indent: "`P(B | A) = 4/7`  (etter at en rød er trukket: 4 røde av 7 igjen)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn i produktregelen:" }
              - { indent: "`P(A ∩ B) = (5/8) · (4/7)`" }
              - { indent: "`= 20/56`" }
              - { indent: "`= 5/14`" }
              - { comment: "Forkort brøken med felles faktor 4." }
        result: "`P(begge røde) = 5/14 ≈ 0.357`"

      - source: "Praksis · kortstokk uten tilbakelegging"
        question: "Vi trekker to kort fra en standard kortstokk (52 kort) uten tilbakelegging. Hva er sannsynligheten for at begge er ess?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «første kort er ess» og `B` = «andre kort er ess»." }
              - { text: "Trekning uten tilbakelegging ⇒ hendelsene er avhengige." }
              - { text: "Det finnes 4 ess i en kortstokk på 52 kort." }
          - label: "Formel"
            lines:
              - { text: "Produktregel for avhengige hendelser:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B | A)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 4/52`  (4 ess av 52 kort)" }
              - { indent: "`P(B | A) = 3/51`  (3 ess igjen av 51 kort etter første trekning)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn i formelen:" }
              - { indent: "`P(A ∩ B) = (4/52) · (3/51)`" }
              - { indent: "`= 12/2652`" }
              - { indent: "`= 1/221`" }
              - { indent: "`≈ 0.00452`" }
        result: "`P(to ess) = 1/221 ≈ 0.0045`"

      - source: "Praksis · uavhengige hendelser"
        question: "Vi kaster en mynt og en terning samtidig. Hva er sannsynligheten for å få krone OG en sekser?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "La `A` = «mynten viser krone» og `B` = «terningen viser 6»." }
              - { text: "Mynt og terning påvirker ikke hverandre ⇒ hendelsene er uavhengige." }
              - { text: "Da forenkles produktregelen til `P(A ∩ B) = P(A) · P(B)`." }
          - label: "Formel"
            lines:
              - { text: "Produktregel for uavhengige hendelser:" }
              - { indent: "`P(A ∩ B) = P(A) · P(B)`" }
              - { text: "Sannsynligheter:" }
              - { indent: "`P(A) = 1/2`  (krone på en rettferdig mynt)" }
              - { indent: "`P(B) = 1/6`  (sekser på en rettferdig terning)" }
          - label: "Innsatt"
            lines:
              - { text: "Sett inn:" }
              - { indent: "`P(A ∩ B) = (1/2) · (1/6)`" }
              - { indent: "`= 1/12`" }
              - { indent: "`≈ 0.0833`" }
        result: "`P(krone ∩ sekser) = 1/12 ≈ 0.083`"

