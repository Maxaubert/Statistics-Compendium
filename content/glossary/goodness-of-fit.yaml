id: goodness-of-fit
term_no: Goodness-of-fit (tilpasningstest)
short_def: "Test som sjekker om observerte antall i kategorier samsvarer med en forventet fordeling."
filters:
  distribution_assumption: [chi_squared]
  computes: [hypothesis_test]
  structural_cues: [more_than_two_categories]
  tooling: [chi_square_quantile_table_E6]
  parameters_known: [alpha_significance]
long_def: |
  Sammenligner observerte antall `Oᵢ` med forventede antall `Eᵢ` under
  en gitt hypotese (likedeling, bestemt teoretisk fordeling, etc.).

  **Testobservator:**

      χ² = Σ (Oᵢ − Eᵢ)² / Eᵢ

  Stor `χ²`-verdi → dataene passer dårlig med hypotesen. Frihetsgrader
  er typisk `k − 1`, men reduseres ytterligere hvis parametere ble
  estimert fra dataene.
aliases:
  - goodness-of-fit
  - goodness of fit
  - tilpasningstest
  - tilpasningstesten
see_also:
  - { id: kjikvadrat-goodness-of-fit, kind: entry }
  - { id: kjikvadrat-uavhengighet, kind: entry }
