id: varians-oversikt
name_no: "Varians (oversikt)"
type: overview
tagline: "Mål for spredning. Samme idé i alle former, men formelen ser ulik ut etter hva slags data du har."

what_it_means: |
  Varians måler hvor mye en variabel typisk avviker kvadratisk fra
  gjennomsnittet.

  Den grunnleggende ideen er alltid den samme:

      varians = «vektet sum av kvadrerte avvik fra gjennomsnittet»

forms:
  - title: "Variansen til diskret stokastisk variabel"
    symbol: "Var(X)"
    glossary_id: diskret-varians
    formula: "Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)"
    description: "Når du har en PMF-tabell. Vekt = sannsynligheten."
    entry_links:
      - { id: varians-standardavvik-diskret, label: "Entry" }
  - title: "Utvalgsvarians"
    symbol: "s²"
    glossary_id: utvalgsvarians
    formula: "s² = Σ (xᵢ − x̄)² / (n − 1)"
    description: "Den vanligste formen i praksis — fra rådata når fordelingen er ukjent."
    entry_links:
      - { id: utvalgsvarians-radata, label: "Entry" }
      - { id: en-utvalg-t-test, label: "Én-utvalg t-test" }
      - { id: ki-mu-ukjent-sigma, label: "KI for μ (ukjent σ)" }
      - { id: ki-varians, label: "KI for σ²" }
  - title: "Pooled (interpolert) varians"
    symbol: "S_P²"
    glossary_id: pooled-varians
    formula: "S_P² = ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2)"
    description: "Felles variansestimat for to grupper med antatt lik σ²."
    entry_links:
      - { id: to-utvalgs-t-test, label: "To-utvalgs t-test (pooled)" }
  - title: "Residualvarians"
    symbol: "S_E²"
    glossary_id: residualvarians
    formula: "S_E² = Σ (yᵢ − ŷᵢ)² / (n − 2)"
    description: "Spredningen i avvikene fra regresjonslinjen."
    entry_links:
      - { id: regresjon-residualvarians, label: "Entry" }
      - { id: regresjon-standardfeil-stigningstall, label: "SE(β̂)" }
      - { id: regresjon-test-stigningstall, label: "Hypotesetest for β" }
      - { id: regresjon-prediksjonsintervall, label: "Prediksjonsintervall" }
  - title: "Binomialvarians"
    symbol: "B(n,p)"
    glossary_id: binomialvarians
    formula: "Var(X) = np(1 − p)"
    description: "For B(n, p). Størst når p = 0.5."
    entry_links:
      - { id: binomial-fordeling, label: "Entry" }
  - title: "Poissonvarians"
    symbol: "Pois(λ)"
    glossary_id: poissonvarians
    formula: "Var(X) = λ   (eller λt for et vindu)"
    description: "Spesielt: E[X] = Var(X) = λ for Poisson."
    entry_links:
      - { id: poisson-fordeling, label: "Entry" }
  - title: "Eksponentialvarians"
    symbol: "Eksp(λ)"
    glossary_id: eksponentialvarians
    formula: "Var(T) = 1/λ²"
    description: "Ventetid med rate λ."
    entry_links:
      - { id: eksponential-fordeling, label: "Entry" }
  - title: "Hypergeometrisk varians"
    symbol: "Hg(N,K,n)"
    glossary_id: hypergeometrisk-varians
    formula: "Var(X) = n · (K/N) · ((N−K)/N) · ((N−n)/(N−1))"
    description: "Som binomialvariansen, men med endelig-populasjon-korreksjon."
    entry_links:
      - { id: hypergeometrisk-fordeling, label: "Entry" }
  - title: "Variansen til utvalgsgjennomsnittet"
    symbol: "Var(X̄)"
    glossary_id: variansen-til-utvalgsgjennomsnittet
    formula: "Var(X̄) = σ²/n          SE(X̄) = σ/√n"
    description: "Spredningen i selve estimatet X̄, ikke i dataene."
    entry_links:
      - { id: en-utvalg-z-test, label: "Én-utvalg z-test" }
      - { id: ki-mu-kjent-sigma, label: "KI for μ (kjent σ)" }
  - title: "Variansen til stigningstallet"
    symbol: "Var(β̂)"
    glossary_id: variansen-til-stigningstallet
    formula: "Var(β̂) = S_E² / S_XX          SE(β̂) = √(Var(β̂))"
    description: "Hvor presist vi kjenner regresjonsstigningen."
    entry_links:
      - { id: regresjon-standardfeil-stigningstall, label: "Entry" }
  - title: "Kovarians"
    symbol: "Cov(X,Y)"
    glossary_id: kovarians-glos
    formula: "Cov(X, Y) = E[XY] − μ_X · μ_Y"
    description: "Mål for samvariasjon mellom to variabler. Cov(X, X) = Var(X) — varians er kovarians med seg selv. Brukes som mellomsteg for korrelasjon ρ og for Var(X+Y)."
    entry_links:
      - { id: kovarians, label: "Entry" }
      - { id: korrelasjon-joint, label: "ρ(X,Y)" }

recognition_cues:
  - "Oppgaven nevner spredning, varians, eller standardavvik"
  - "Du må velge mellom flere variansformer (rådata vs. fordeling vs. residual)"
  - "Du trenger et estimat for σ² for å gå videre i en t-test eller KI"

filters:
  computes: [std_dev]
  random_variable: [discrete_count, continuous]
  setup: [single_population, two_independent_samples, linear_relationship]
  structural_cues: [data_as_list, joint_table_present, summary_stats_given]
  parameters_known: [population_variance_unknown]
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]
