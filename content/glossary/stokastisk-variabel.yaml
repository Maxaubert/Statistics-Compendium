id: stokastisk-variabel
term_no: Stokastisk variabel (X, tilfeldig variabel)
short_def: "En variabel hvis verdi er bestemt av et tilfeldig forsøk — kan være diskret eller kontinuerlig."
filters:
  random_variable: [discrete_count, continuous]
  computes: [std_dev, expected_value, exact_probability]
long_def: |
  En stokastisk variabel `X` tilordner et tall til hvert utfall av et tilfeldig forsøk.

  - **Diskret stokastisk variabel:** tar tellbare verdier (antall, telling) og har en sannsynlighetsfordeling `P(X = x)`.
  - **Kontinuerlig stokastisk variabel:** tar verdier i et intervall (vekt, høyde, tid) og har en tetthetsfunksjon `f(x)`.

  Skrives vanligvis med stor bokstav (`X`, `Y`) for selve variabelen og liten (`x`, `y`) for en konkret verdi.
aliases:
  - stokastisk variabel
  - stokastiske variabler
  - tilfeldig variabel
  - tilfeldige variabler
see_also:
  - { id: forventningsverdi, kind: glossary }
  - { id: varians, kind: glossary }
  - { id: forventningsverdi-diskret, kind: entry }
  - { id: normalfordeling, kind: entry }
