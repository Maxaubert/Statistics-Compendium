id: ki-mu-ukjent-sigma
name_no: "Konfidensintervall for μ (ukjent σ)"
type: identity
category: confidence_interval
tagline: "(1-α)·100 % KI for forventningsverdien når σ er ukjent og estimert som S."

formula_main: "x̄ ± t_(α/2, n-1) · s/√n"
formula_latex: "\\overline{x} \\pm t_{\\alpha/2, n-1} \\cdot \\frac{s}{\\sqrt{n}}"

what_it_does: |
  Gir et intervall som med (1-α)·100 % sikkerhet inneholder μ, når
  populasjonens σ ikke er kjent og må estimeres med utvalgs-standardavviket
  s. Bruker t-fordelingen med n - 1 frihetsgrader.

why_use: |
  Standardvalg når σ ikke er kjent. T-fordelingen er bredere enn standardnormal
  for små n, og tar dermed hensyn til usikkerheten i estimatet av σ.

recognition_cues:
  - "Spørsmålet ber om et konfidensintervall for μ"
  - "σ er IKKE oppgitt; kun s eller s² fra utvalg er tilgjengelig"
  - "Konfidensnivå er gitt"

when_NOT_to_use:
  - "σ er kjent → bruk z-basert KI"
  - "Du sammenligner to grupper → bruk to-utvalgs-formler"
  - "Det handler om andel → bruk KI for andel"

symbols:
  - { sym: "x̄",          means: "utvalgsgjennomsnittet" }
  - { sym: "s",           means: "utvalgs-standardavvik (estimat for σ)" }
  - { sym: "n",           means: "antall observasjoner" }
  - { sym: "ν",           means: "frihetsgrader, ν = n - 1" }
  - { sym: "t_(α/2, n-1)", means: "kvantil i t-fordelingen" }

filters:
  computes: [confidence_interval, parameter_estimate]
  random_variable: [mean_of_samples, continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, data_as_list, summary_stats_given, total_observations_n]
  parameters_known: [population_variance_unknown, sample_size_small_lt30, sample_size_large, confidence_level]
  distribution_assumption: [t_distribution, normal]
  tooling: [t_quantile_table_E5, calculator_sqrt, normal_quantile_table_E4, standard_normal_table_E3]
solution_template:
  - "Identifiser konfidensnivå (1-α) og α"
  - "Beregn s² = (1/(n-1)) · Σ(xi - x̄)² (eller bruk gitt s)"
  - "Slå opp t_(α/2, n-1) i tabell E.5 (kolonne for α/2, rad for n-1 frihetsgrader)"
  - "Beregn marginen t_(α/2, n-1) · s/√n"
  - "Sett opp intervallet x̄ ± margin"

common_traps: |
  ν = n - 1 for én-utvalgs KI (ikke n - 2). T-kvantiltabellen E.5 har
  α-verdier i kolonnehodene, så t_(α/2,ν) finnes ved å lete etter α/2
  i kolonneraden. For 95 % KI med n=10: ν=9, α/2=0.025 → t = 2.262.

python_snippet: |
  from scipy.stats import t
  import math

  x_bar, s, n, alpha = 71.30, 14.33, 10, 0.05
  t_crit = t.ppf(1 - alpha/2, df=n-1)
  margin = t_crit * s / math.sqrt(n)
  ci = (x_bar - margin, x_bar + margin)

detailed_solution_variants:
  - label: "KI for μ (ukjent σ)"
    solutions:
      - source: "Praksis · klassetest, gammel metode"
        question: "Et utvalg av `n = 10` testresultater har `x̄ = 71.30` og utvalgsstandardavvik `s² = 205.34`. Finn et 95 % konfidensintervall for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 10`, `x̄ = 71.30`, `s² = 205.34` ⇒ `s = √205.34 ≈ 14.33`." }
              - { text: "`σ` er ikke kjent (kun estimert som `s` fra utvalget) → bruk t-basert KI." }
          - label: "Kvantil"
            lines:
              - { text: "Frihetsgrader: `ν = n − 1 = 9`. Konfidensnivå 95 % ⇒ `α = 0.05`, `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.5", text: "Slå opp `t_(0.025, 9) = 2.262`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = t_(α/2, n−1) · s/√n`" }
              - { indent: "`= 2.262 · 14.33/√10`" }
              - { indent: "`= 2.262 · 4.531`" }
              - { indent: "`≈ 10.25`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = 71.30 ± 10.25 = [61.05, 81.55]`" }
        result: "`95 % KI for μ: [61.05, 81.55]`"

      - source: "Praksis · liten produktprøve (rådata)"
        question: "Innholdet av 6 såpebeholdere ble målt: 297, 300, 293, 296, 304, 302 ml. Finn et 95 % KI for forventet fyllingsmengde, uten å forutsette kjent `σ`."
        sections:
          - label: "Gjennomsnittet"
            lines:
              - { text: "`n = 6`. Først regn `x̄` fra rådataene:" }
              - { text: "`x̄ = (297 + 300 + 293 + 296 + 304 + 302)/6 = 1792/6 ≈ 298.67`" }
          - label: "Utvalgsvarians og s"
            lines:
              - { text: "`var = ((297−298.67)² + (300−298.67)² + (293−298.67)² + (296−298.67)² + (304−298.67)² + (302−298.67)²)/(6−1)`" }
              - { indent: "`= ((−1.67)² + (1.33)² + (−5.67)² + (−2.67)² + (5.33)² + (3.33)²)/5`" }
              - { indent: "`= (2.79 + 1.77 + 32.15 + 7.13 + 28.41 + 11.09)/5`" }
              - { indent: "`= 83.34/5 ≈ 16.67`" }
              - { text: "`s = √16.67 ≈ 4.08`" }
          - label: "Kvantil"
            lines:
              - { text: "`ν = n − 1 = 5`, `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 5) = 2.571`." } }
          - label: "Intervall"
            lines:
              - { text: "`KI = x̄ ± t_(α/2, ν) · s/√n`" }
              - { indent: "`= 298.67 ± 2.571 · 4.08/√6`" }
              - { indent: "`= 298.67 ± 4.28`" }
              - { indent: "`= [294.39, 302.95]`" }
        result: "`95 % KI for μ: [294.39, 302.95] ml`"

