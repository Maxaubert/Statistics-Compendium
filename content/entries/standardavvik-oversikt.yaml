id: standardavvik-oversikt
name_no: "Standardavvik (oversikt)"
type: overview
tagline: "Kvadratrot av variansen — spredning i samme enhet som dataene. Hver variansform har sin parallell."

what_it_means: |
  Standardavviket sier hvor langt en typisk observasjon ligger fra
  gjennomsnittet — et mål på spredning i samme enhet som dataene.
  Det er kvadratroten av variansen.

      σ = √Var(X)

forms:
  - title: "Standardavvik for diskret stokastisk variabel"
    symbol: "σ"
    glossary_id: diskret-varians
    formula: "σ = √( Σ (xᵢ − μ)² · P(X = xᵢ) )"
    description: "Når du har en PMF-tabell. Vekt = sannsynligheten."
    entry_links:
      - { id: varians-standardavvik-diskret, label: "Entry" }
  - title: "Populasjonsstandardavvik"
    symbol: "σ"
    glossary_id: populasjonsstandardavvik
    formula: "σ = √( Σ (xᵢ − μ)² / N )"
    description: "Den «sanne» spredningen i hele populasjonen. Antas kjent eller estimeres med utvalgsstandardavviket s når den ikke er gitt."
    entry_links:
      - { id: en-utvalg-z-test, label: "Én-utvalg z-test" }
      - { id: ki-mu-kjent-sigma, label: "KI for μ (kjent σ)" }
  - title: "Utvalgsstandardavvik"
    symbol: "s"
    glossary_id: utvalgsstandardavvik
    formula: "s = √( Σ(xᵢ − x̄)² / (n − 1) )"
    description: "Estimat for σ når populasjonens standardavvik er ukjent. n − 1 er Bessels korreksjon."
    entry_links:
      - { id: en-utvalg-t-test, label: "Én-utvalg t-test" }
      - { id: ki-mu-ukjent-sigma, label: "KI for μ (ukjent σ)" }
  - title: "Pooled standardavvik"
    symbol: "S_P"
    glossary_id: pooled-varians
    formula: "S_P = √( ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2) )"
    description: "Felles standardavvik-estimat for to grupper med antatt lik σ."
    entry_links:
      - { id: to-utvalgs-t-test, label: "To-utvalgs t-test (pooled)" }
  - title: "Residualstandardavvik"
    symbol: "S_E"
    glossary_id: residualstandardavvik
    formula: "S_E = √( Σ(yᵢ − ŷᵢ)² / (n − 2) )"
    description: "Typisk avvik fra regresjonslinjen."
    entry_links:
      - { id: regresjon-residualvarians, label: "Entry" }
  - title: "Standardavvik for binomial"
    symbol: "B(n,p)"
    glossary_id: binomialvarians
    formula: "σ = √(np(1 − p))"
    entry_links:
      - { id: binomial-fordeling, label: "Entry" }
  - title: "Standardavvik for poisson"
    symbol: "Pois(λ)"
    glossary_id: poissonvarians
    formula: "σ = √λ"
    entry_links:
      - { id: poisson-fordeling, label: "Entry" }
  - title: "Standardavvik for eksponential"
    symbol: "Eksp(λ)"
    glossary_id: eksponentialvarians
    formula: "σ = 1/λ   (lik forventningen)"
    entry_links:
      - { id: eksponential-fordeling, label: "Entry" }
  - title: "Standardavvik for hypergeometrisk"
    symbol: "Hg(N,K,n)"
    glossary_id: hypergeometrisk-varians
    formula: "σ = √( n · (K/N) · ((N−K)/N) · ((N−n)/(N−1)) )"
    description: "Som binomial-σ, men med endelig-populasjon-korreksjonen."
    entry_links:
      - { id: hypergeometrisk-fordeling, label: "Entry" }
  - title: "Standardfeil til utvalgsgjennomsnittet"
    symbol: "σ_X̄"
    glossary_id: variansen-til-utvalgsgjennomsnittet
    formula: "σ_X̄ = σ/√n          (eller s/√n hvis σ er ukjent)"
    description: "Spredningen i selve estimatet X̄, ikke i rådataene."
    entry_links:
      - { id: en-utvalg-z-test, label: "Én-utvalg z-test" }
      - { id: ki-mu-kjent-sigma, label: "KI for μ (kjent σ)" }
  - title: "Standardfeil til regresjonsstigningstallet"
    symbol: "SE(β̂)"
    glossary_id: standardfeil-til-stigningstallet
    formula: "SE(β̂) = √(S_E² / S_XX)"
    description: "Kjernen i hypotesetest og KI for β."
    entry_links:
      - { id: regresjon-standardfeil-stigningstall, label: "Entry" }
  - title: "Standardfeil til utvalgsandelen"
    symbol: "SE(p̂)"
    glossary_id: standardfeil-til-andel
    formula: "SE(p̂) = √(p̂(1 − p̂) / n)"
    entry_links:
      - { id: en-utvalg-z-test-andel, label: "Z-test for andel p" }
      - { id: ki-andel-binomial, label: "KI for andel p" }
recognition_cues:
  - "Oppgaven nevner spredning, standardavvik, eller standardfeil, og du er usikker på hvilken form"
  - "Du må velge mellom `σ` (kjent), `s` (estimat fra rådata), og `σ/√n` (spredning til `X̄`)"
  - "Du har et estimat (`X̄`, `p̂`, `β̂`) og skal kvantifisere usikkerheten i det"

when_NOT_to_use:
  - "Du vet allerede hvilken form (rådata, PMF, residual, SE(β̂)) → gå direkte til den spesifikke entryen"
  - "Du trenger variansen `σ²` (kvadratenheten) i en KI-formel → bruk [varians (oversikt)](/entry/varians-oversikt)"

filters:
  computes: [std_dev, variance]
  random_variable: [discrete_count, continuous, mean_of_samples, sum_of_samples, proportion]
  setup: [single_population]
  structural_cues: [data_as_list, summary_stats_given, mean_and_sd_given]
  parameters_known: [population_variance_known, population_variance_unknown, success_p]
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]
related:
  - { id: "varians-oversikt",                     kind: "entry" }
  - { id: "standardavvik",                        kind: "glossary" }
  - { id: "utvalgsstandardavvik",                 kind: "glossary" }
  - { id: "populasjonsstandardavvik",             kind: "glossary" }
  - { id: "standardfeil",                         kind: "glossary" }
  - { id: "variansen-til-utvalgsgjennomsnittet",  kind: "glossary" }
  - { id: "regresjon-standardfeil-stigningstall", kind: "entry" }
  - { id: "ki-mu-ukjent-sigma",                   kind: "entry" }
