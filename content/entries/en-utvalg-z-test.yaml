id: en-utvalg-z-test
name_no: "Én-utvalg z-test"
type: test
category: hypothesis_test
tagline: "Tester forventningsverdien μ mot en gitt verdi μ₀ når σ er kjent."

formula_main: "Z = (X̄ - μ₀) / (σ/√n)"
formula_latex: "Z = \\frac{\\overline{X} - \\mu_0}{\\sigma / \\sqrt{n}}"

what_it_does: |
  Tester en påstand (hypotese) om forventningsverdien μ i en populasjon.
  Du har en "påstandsverdi" μ₀ (f.eks. "gjennomsnittlig forbruk er 50 W") og
  data fra et utvalg med kjent standardavvik σ. Z-testen sammenligner
  utvalgets gjennomsnitt X̄ med μ₀ og angir om forskjellen er stor nok til
  å forkaste påstanden.

why_use: |
  Velg z-test framfor t-test når populasjonens standardavvik σ er kjent
  (oppgitt i problemet, ikke estimert fra utvalget). I praksis betyr dette
  ofte at oppgaven sier noe som "antar at standardavviket er 5 watt" eller
  at utvalget er stort (n ≥ 30) slik at sentralgrenseteoremet gjør det
  tilnærmet samme test.

recognition_cues:
  - "Oppgaven oppgir en standardverdi/påstandsverdi μ₀ (typisk navngitt 'forventet' eller 'standardmodellen')"
  - "Oppgaven oppgir at standardavviket σ er kjent eller 'antas kjent' (ofte med et tall — f.eks. 'σ = 5')"
  - "Oppgaven oppgir et utvalg med n observasjoner (typisk n ≥ 30) og dets gjennomsnitt x̄"
  - "Spørsmålet ber om en hypotesetest: 'undersøk om μ er høyere/lavere/forskjellig fra μ₀'"
  - "Signifikansnivå α er gitt (vanligvis 0.05 eller 0.01)"
  - "Spørsmål om p-verdi (signifikanssannsynlighet) er ofte med"

when_NOT_to_use:
  - "σ er ukjent (kun s estimert fra utvalg) → bruk én-utvalgs t-test"
  - "Du sammenligner to grupper → bruk to-utvalgs t-test"
  - "Du tester en andel/proporsjon → bruk z-test for andel"

symbols:
  - { sym: "X̄", means: "utvalgsgjennomsnittet" }
  - { sym: "μ₀", means: "verdien vi tester mot (fra nullhypotesen)" }
  - { sym: "σ",  means: "populasjonens standardavvik (kjent)" }
  - { sym: "n",  means: "antall observasjoner" }
  - { sym: "Z",  means: "testobservatoren, standardnormalfordelt under H₀" }

filters:
  computes: [hypothesis_test]
  random_variable: [mean_of_samples]
  setup: [single_population]
  structural_cues: [normal_assumed, mean_and_sd_given, total_observations_n]
  parameters_known: [population_variance_known, sample_size_large, mean_known, alpha_significance]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4]

solution_template:
  - "Formuler hypotesene. H₀ er 'status quo' (typisk μ ≥ μ₀, μ ≤ μ₀, eller μ = μ₀). H₁ er det du vil bevise (μ < μ₀, μ > μ₀, eller μ ≠ μ₀)"
  - "Bestem retning: en-sidig hvis H₁ er 'mindre enn' eller 'større enn'; tosidig hvis 'forskjellig fra'"
  - "Begrunn z-testen: σ er kjent (oppgitt) og enten observasjonene er normalfordelte eller n ≥ 30"
  - "Beregn z = (x̄ − μ₀) / (σ/√n). Pass på fortegnet: hvis x̄ < μ₀ blir z negativ"
  - "Slå opp kritisk verdi i tabell E.4 (Z-kvantiltabell). Ensidig: z_α; tosidig: z_(α/2)"
  - "Forkastingsregel: Venstresidig (μ < μ₀) → forkast hvis z < −z_α. Høyresidig (μ > μ₀) → forkast hvis z > z_α. Tosidig (μ ≠ μ₀) → forkast hvis |z| > z_(α/2)"
  - "Konkluder med en setning: 'Vi forkaster H₀ på α = ... ' eller 'Vi kan ikke forkaste H₀ på α = ...', og hva det betyr i sammenheng med oppgavens kontekst"
  - "Hvis p-verdi etterspørres: For venstresidig p = G(z); for høyresidig p = 1 − G(z); for tosidig p = 2·(1 − G(|z|))"

common_traps: |
  - **Ensidig vs. tosidig**: Hvis H₁ er "mindre enn" eller "større enn", er testen ensidig (bruk z_α). Hvis H₁ er "forskjellig fra", er den tosidig (bruk z_(α/2)).
  - **Fortegn på sjekkverdi**: For venstresidig test (μ < μ₀) er sjekkverdien −z_α (negativ), ikke +z_α. Forkast hvis z < −z_α.
  - **z_α vs. z_(α/2)**: Vanlig feil å bruke z_α også for tosidig test. For tosidig MÅ du bruke z_(α/2) (halvdelen av α i hver hale).
  - **σ vs. s**: Hvis σ ikke er oppgitt og du må regne s² fra dataene, er det t-test du skal bruke, ikke z-test.
  - **Konklusjonen tilbake til kontekst**: "Forkast H₀" er ikke nok. Si hva det betyr: "Det er grunn til å hevde at den nye produkten har lavere energiforbruk."

python_snippet: |
  from scipy.stats import norm
  import math

  x_bar, mu0, sigma, n, alpha = 48, 50, 5, 40, 0.05
  z = (x_bar - mu0) / (sigma / math.sqrt(n))   # -2.53

  # Venstresidig: forkast hvis z < -z_alpha
  z_alpha = norm.ppf(1 - alpha)                # 1.645
  reject = z < -z_alpha                        # True

  # p-verdi (venstresidig)
  p_value = norm.cdf(z)                        # 0.0057

examples:
  - source: "Eksamen jan25 · oppgave 6"
    excerpt: "Standardavviket er σ = 5 W (kjent). Utvalg n = 40, x̄ = 48 W. Test om ny julelys har lavere energiforbruk enn 50 W på α = 0.05."
    solution_sketch: "z = (48-50)/(5/√40) = -2.53. -2.53 < -z_0.05 = -1.645 → forkast H₀."
  - source: "Eksamen mai25 · oppgave 4b"
    excerpt: "σ = 5 ml (kjent). Utvalg n = 6, x̄ = 298.67 ml. Test om μ < 302 på α = 0.05."
    solution_sketch: "z = (298.67-302)/(5/√6) = -1.63. -1.63 ikke < -1.645 → IKKE forkast H₀."

detailed_solutions:
  - source: "Eksamen jan25 · oppgave 6c"
    question: "Forventet forbruk på standardmodellen er 50 W. Utvalg på 40 målinger av ny julelys gir x̄ = 48 W, σ = 5 W kjent. Test H₀: μ ≥ 50 mot H₁: μ < 50 på α = 0.05."
    sections:
      - label: "Hypoteser"
        lines:
          - { text: "H₀: μ ≥ 50 W (ny er IKKE bedre)" }
          - { text: "H₁: μ < 50 W (ny er bedre)" }
      - label: "Testobservator"
        lines:
          - { text: "Z = (X̄ - μ₀) / (σ/√n)" }
      - label: "Innsatt"
        lines:
          - { text: "z = (48 - 50) / (5/√40)" }
          - { indent: "= -2 / 0.7906" }
          - { indent: "= -2.53" }
      - label: "Kritisk verdi"
        lines:
          - { table_lookup: { ref: "E.4", text: "z_0.05 = 1.645 → forkastningsregel: forkast hvis z < -1.645" } }
      - label: "Sammenligning"
        lines:
          - { text: "-2.53 < -1.645 ✓" }
    result: "Forkast H₀ på α = 0.05. Tallene tyder på at ny julelys har lavere forbruk."

  - source: "Eksamen mai25 · oppgave 4b"
    question: "X̄ = 298.67, n = 6, σ = 5 (kjent). Test H₀: μ ≥ 302 mot H₁: μ < 302 på α = 0.05."
    sections:
      - label: "Hypoteser"
        lines:
          - { text: "H₀: μ ≥ 302" }
          - { text: "H₁: μ < 302" }
      - label: "Innsatt"
        lines:
          - { text: "z = (298.67 - 302) / (5/√6) = -3.33/2.041 = -1.63" }
      - label: "Kritisk verdi"
        lines:
          - { table_lookup: { ref: "E.4", text: "z_0.05 = 1.645" } }
      - label: "Sammenligning"
        lines:
          - { text: "-1.63 IKKE < -1.645" }
    result: "Vi kan IKKE forkaste H₀ på α = 0.05."

