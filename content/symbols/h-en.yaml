id: h-en
sym: "H₁"
short_def: "Alternativhypotesen — påstanden du vil 'bevise'. Den utfordrer nullhypotesen H₀."
contexts:
  - usage: "Alternativhypotese i hypotesetest"
    detail: |
      H₁ er det interessante du tror er sant, mens H₀ er det 'kjedelige'
      utgangspunktet. Hele hypotesetesten går ut på å se om dataene
      gir nok bevis til å forkaste H₀ til fordel for H₁.

      H₁ kan formuleres på tre måter, og formen bestemmer hvor i
      fordelingen du leter etter ekstreme verdier:
      - Ensidig høyre: H₁: μ > μ₀ (ser i høyre hale)
      - Ensidig venstre: H₁: μ < μ₀ (ser i venstre hale)
      - Tosidig: H₁: μ ≠ μ₀ (begge haler — α deles på 2)

      Eksempel: tror du nytt mat senker blodtrykket, blir H₀: μ = μ₀
      og H₁: μ < μ₀. Velg form på H₁ før du ser dataene.

      Ikke bland med H₀ — H₀ har likhetstegn (=), H₁ har ulikhet (<, >, ≠).
    entry_refs:
      - en-utvalg-z-test
      - en-utvalg-t-test
      - to-utvalgs-t-test
      - regresjon-test-stigningstall
see_also:
