id: z-score
term_no: Z-score (z-verdi)
short_def: "Hvor mange standardavvik en observasjon ligger fra forventningen: Z = (X − μ)/σ."
long_def: |
  Z-score standardiserer en observasjon til standardnormalfordeling
  (μ = 0, σ = 1). Brukes både til å sammenligne verdier på ulike skalaer
  og som testobservator i z-test. For utvalgsgjennomsnitt: Z = (X̄ − μ₀)
  / (σ/√n). Slå opp sannsynligheter eller kvantiler i E.3 / E.4-tabellene.
