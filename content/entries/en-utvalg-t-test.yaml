id: en-utvalg-t-test
name_no: "Én-utvalg t-test"
type: test
category: hypothesis_test
tagline: "Tester forventningsverdien `μ` mot en gitt verdi `μ₀` når `σ` er ukjent."

formula_main: "T = (X̄ - μ₀) / (S/√n)"
formula_latex: "T = \\frac{\\overline{X} - \\mu_0}{S / \\sqrt{n}}"

what_it_does: |
  Tester nullhypotesen om forventningsverdien `μ` er lik (eller minst/høyst)
  en gitt verdi `μ₀`, når populasjonsstandardavviket `σ` er ukjent og må
  estimeres med utvalgsstandardavviket `S`. Testobservatoren er t-fordelt
  med `ν = n − 1` frihetsgrader.

why_use: |
  Brukes når man ikke kjenner populasjonens `σ`, og kun har utvalgsstørrelse
  og utvalgs-statistikk. Standardvalget i praksis siden `σ` sjelden er kjent.
  Forutsetter normalfordelte observasjoner eller stort utvalg (`n ≥ 30`).

recognition_cues:
  - "Du skal teste forventningsverdien `μ` mot en bestemt verdi `μ₀`"
  - "Standardavviket `σ` er IKKE oppgitt; kun `s²` eller `s` kan beregnes fra utvalg"
  - "Eller `σ` er et estimat fra dataene, ikke en kjent populasjonsverdi"
  - "Spørsmålet kan være: 'er gjennomsnittet høyere/lavere/forskjellig fra `μ₀`?'"

when_NOT_to_use:
  - "`σ` er kjent (oppgitt eksplisitt) → bruk [én-utvalg z-test](/entry/en-utvalg-z-test) i stedet"
  - "Du sammenligner to grupper → bruk [to-utvalgs t-test](/entry/to-utvalgs-t-test)"
  - "Du tester en andel → bruk [z-test for andel](/entry/en-utvalg-z-test-andel)"
  - "Normalfordeling kan IKKE antas og `n` er lite → bruk ikke-parametrisk [Wilcoxon tegn-rangtest](/entry/wilcoxon-tegn-rang)"

symbols:
  - { sym: "X̄",   means: "utvalgsgjennomsnittet" }
  - { sym: "μ",    means: "den ukjente forventningsverdien i populasjonen" }
  - { sym: "μ₀",   means: "verdien vi tester mot (fra nullhypotesen)" }
  - { sym: "S",    means: "utvalgs-standardavviket (estimat for `σ`)" }
  - { sym: "s²",   means: "utvalgsvariansen, `s² = Σ(xᵢ − x̄)² / (n−1)`" }
  - { sym: "n",    means: "antall observasjoner" }
  - { sym: "ν",    means: "frihetsgrader, `ν = n − 1`" }
  - { sym: "T",    means: "testobservatoren, t-fordelt under `H₀`" }
  - { sym: "H₀",   means: "nullhypotesen (vanligvis `μ = μ₀`)" }
  - { sym: "H₁",   means: "alternativhypotesen (`μ < μ₀`, `μ > μ₀` eller `μ ≠ μ₀`)" }
  - { sym: "α",    means: "signifikansnivå (sannsynlighet for å forkaste `H₀` når den er sann)" }
  - { sym: "t_(α, ν)", means: "kritisk verdi (kvantil) i t-fordelingen, slått opp i tabell E.5" }

filters:
  computes: [hypothesis_test]
  random_variable: [mean_of_samples, continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, data_as_list, summary_stats_given, two_sided_alternative, one_sided_alternative]
  parameters_known: [population_variance_unknown, mean_known, sample_size_small_lt30, sample_size_large, alpha_significance]
  distribution_assumption: [t_distribution, normal]
  tooling: [t_quantile_table_E5, calculator_sqrt]

solution_variants:
  - label: "H₁: μ < μ₀ (venstre)"
    recognition: "«Er gjennomsnittet `μ` SIGNIFIKANT MINDRE enn `μ₀`?», eller «test om vekten er under spesifikasjonen». Ensidig — retning oppgitt, `σ` er ukjent."
    description: "Ensidig venstresidig test. Forkast H₀ hvis `T < −t_(α, ν)`."
    steps:
      - text: "Formuler hypotesene (venstresidig). `H₀: μ ≥ μ₀` er den strenge formen siden null og alternativ skal dekke hele tallinjen; mange pensumbøker forenkler til `H₀: μ = μ₀` — testmekanikken er identisk fordi grenseverdien er 'verste fall' for nullen:"
        formula: "H₀: μ ≥ μ₀     mot     H₁: μ < μ₀"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - text: "Beregn `x̄` og `s` fra dataene:"
        formula: "s² = Σ(xᵢ − x̄)² / (n−1)"
      - text: "Beregn testobservatoren med formelen:"
        formula: "T = (x̄ − μ₀)/(s/√n)"
      - text: "Eksempel med `n = 12`, `ν = 11`, `x̄ = 4.6`, `s = 0.8`, `μ₀ = 5.0`:"
        formula: "T = (4.6 − 5.0)/(0.8/√12) ≈ −1.732"
        example: true
      - { text: "Hvis `σ` er kjent, bruk z-test i stedet (mer presist for kjent `σ`)", conditional: true }
      - "Slå opp `t_(α, ν)` i **tabell E.5** (t-kvantiltabell) med `ν = n − 1` frihetsgrader (f.eks. `α = 0.05`, `ν = 11` → `t_(0.05, 11) ≈ 1.796`)"
      - text: "Forkastingsregel for venstresidig (kritisk verdi negativ):"
        formula: "Forkast H₀ hvis T < −t_(α, ν)"
      - text: "Hvis du oppgir p-verdi: ensidig (venstresidig); forkast hvis `p < α`."
        formula: "p = P(T < t, ν)"
        conditional: true
      - "Konkluder i kontekst: hvis `T < −t_(α, ν)`, er det signifikant evidens for at `μ < μ₀`"
  - label: "H₁: μ > μ₀ (høyre)"
    recognition: "«Er gjennomsnittet `μ` SIGNIFIKANT STØRRE enn `μ₀`?», «kan vi hevde at den nye metoden gir høyere snitt?». Ensidig høyresidig, `σ` ukjent."
    description: "Ensidig høyresidig test. Forkast H₀ hvis `T > +t_(α, ν)`."
    steps:
      - text: "Formuler hypotesene (høyresidig). Strengt: `H₀: μ ≤ μ₀` (null og alternativ dekker hele tallinjen); forenklet form `H₀: μ = μ₀` gir identisk test:"
        formula: "H₀: μ ≤ μ₀     mot     H₁: μ > μ₀"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - text: "Beregn `x̄` og `s` fra dataene:"
        formula: "s² = Σ(xᵢ − x̄)² / (n−1)"
      - text: "Beregn testobservatoren med formelen:"
        formula: "T = (x̄ − μ₀)/(s/√n)"
      - text: "Eksempel med `n = 12`, `ν = 11`, `x̄ = 5.4`, `s = 0.8`, `μ₀ = 5.0`:"
        formula: "T = (5.4 − 5.0)/(0.8/√12) ≈ 1.732"
        example: true
      - { text: "Hvis `n` er stor (`≥ 30`), gir t- og z-test nær identiske svar", conditional: true }
      - "Slå opp `t_(α, ν)` i **tabell E.5** (t-kvantiltabell) med `ν = n − 1` frihetsgrader (f.eks. `α = 0.05`, `ν = 11` → `t_(0.05, 11) ≈ 1.796`)"
      - text: "Forkastingsregel for høyresidig (kritisk verdi positiv):"
        formula: "Forkast H₀ hvis T > +t_(α, ν)"
      - text: "Hvis du oppgir p-verdi: ensidig (høyresidig); forkast hvis `p < α`."
        formula: "p = P(T > t, ν)"
        conditional: true
      - "Konkluder i kontekst: hvis `T > +t_(α, ν)`, er det signifikant evidens for at `μ > μ₀`"
  - label: "H₁: μ ≠ μ₀ (tosidig)"
    recognition: "«Test om gjennomsnittet er forskjellig fra `μ₀`», «avviker dataene fra spec-verdien?». Tosidig — ingen retning oppgitt, `σ` ukjent."
    description: "Tosidig test. Forkast H₀ hvis `|T| > t_(α/2, ν)`."
    steps:
      - text: "Formuler hypotesene (tosidig):"
        formula: "H₀: μ = μ₀     mot     H₁: μ ≠ μ₀"
      - "Begrunn t-test: `σ` er ukjent, og enten er observasjonene normalfordelte eller `n` er stor nok"
      - text: "Beregn `x̄` og `s` fra dataene:"
        formula: "s² = Σ(xᵢ − x̄)² / (n−1)"
      - text: "Beregn testobservatoren med formelen:"
        formula: "T = (x̄ − μ₀)/(s/√n)"
      - text: "Eksempel med `n = 10`, `ν = 9`, `x̄ = 71.30`, `s = 14.33`, `μ₀ = 70`:"
        formula: "T = (71.30 − 70)/(14.33/√10) ≈ 0.287"
        example: true
      - { text: "Hvis `σ` er kjent, bruk z-test i stedet (mer presist for kjent `σ`)", conditional: true }
      - "Slå opp `t_(α/2, ν)` i **tabell E.5** (t-kvantiltabell) med `ν = n − 1` frihetsgrader (merk: `α/2`, ikke `α`; f.eks. `α = 0.05`, `ν = 9` → `t_(0.025, 9) ≈ 2.262`)"
      - text: "Forkastingsregel for tosidig (kritisk verdi gjelder begge haler):"
        formula: "Forkast H₀ hvis |T| > t_(α/2, ν)"
      - text: "Hvis du oppgir p-verdi: tosidig; forkast hvis `p < α`."
        formula: "p = 2·P(T > |t|, ν)"
        conditional: true
      - "Konkluder i kontekst: hvis `|T| > t_(α/2, ν)`, er det signifikant evidens for at `μ ≠ μ₀`; ellers beholdes `H₀`"

detailed_solution_variants:
  - label: "H₁: μ < μ₀ (venstre)"
    solutions:
      - source: "Praksis · Lyspærers levetid"
        question: "Et utvalg av `n = 12` lyspærer har observert gjennomsnittlig levetid `x̄ = 970` timer med utvalgsstandardavvik `s = 40`. Produsenten hevder at gjennomsnittlig levetid er `μ₀ = 1000` timer. Test om `μ < 1000` på signifikansnivå `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 12`, `x̄ = 970`, `s = 40`, `μ₀ = 1000`, `α = 0.05`." }
              - { text: "Frihetsgrader: `ν = n − 1 = 11`." }
              - { text: "`σ` er ukjent og estimeres av `s` ⇒ én-utvalgs t-test." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≥ 1000`" }
              - { text: "`H₁: μ < 1000` (venstresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "Innsatt: `T = (970 − 1000)/(40/√12)`." }
              - { text: "`s/√n = 40/√12 ≈ 11.547`." }
              - { text: "`T ≈ −30/11.547 ≈ −2.598`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.05, 11) ≈ 1.796` ⇒ kritisk verdi `−t_(0.05, 11) ≈ −1.796`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ −2.598 < −1.796`." }
              - { text: "Forkast `H₀`." }
              - { text: "Det er signifikant evidens på 5 %-nivå for at gjennomsnittlig levetid er kortere enn 1000 timer." }
        result: "`T ≈ −2.598 < −1.796` ⇒ forkast `H₀`. `μ < 1000` h."
      - source: "Eksamen jan22 · oppgave 5c (bensinpumpe, ukjent σ, n=4)"
        question: "En ny type bensinpumpe har ukjent `σ`. Fire prøver gir 4.98, 4.99, 4.97, 4.95 liter når telleverket viser 5.00. Foreta en hypotesetest på `α = 0.10` for å sjekke om forventningsverdien til volumet er mindre enn 5.00."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 4`, `μ₀ = 5.00`, `α = 0.10`. Ukjent `σ` ⇒ t-test." }
              - { text: "Frihetsgrader: `ν = n − 1 = 3`." }
              - { comment: "X antas normalfordelt — kritisk for t-test ved så lite n" }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≥ 5.00` (pumpa tapper minst 5.00 — kalibrert eller for mye)" }
              - { text: "`H₁: μ < 5.00` (pumpa tapper for lite — venstresidig)" }
          - label: "Gjennomsnitt og s"
            lines:
              - { text: "`x̄ = (4.98 + 4.99 + 4.97 + 4.95)/4 = 19.89/4 = 4.9725`" }
              - { text: "Avvik fra `x̄`: `0.0075, 0.0175, −0.0025, −0.0225`" }
              - { text: "Sum av kvadrater: `0.0075² + 0.0175² + 0.0025² + 0.0225² = 0.000875`" }
              - { text: "`s² = 0.000875 / 3 ≈ 0.0002917`" }
              - { text: "`s ≈ 0.01708`" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "`s/√n = 0.01708/√4 = 0.00854`" }
              - { text: "`T = (4.9725 − 5.00)/0.00854 = −0.0275/0.00854 ≈ −3.22`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.10, 3) ≈ 1.638` ⇒ venstresidig kritisk grense `−1.638`. Forkast H₀ hvis `T < −1.638`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ −3.22 < −1.638` ✓" }
              - { text: "Forkast `H₀` på `α = 0.10`." }
              - { text: "Også med så få målinger som `n = 4` er evidensen tydelig — det er grunn til å tro at forventet tappet volum er under 5.00 liter." }
        result: "`T ≈ −3.22 < −1.638` ⇒ forkast `H₀`. Den nye pumpa tapper signifikant mindre enn 5.00 liter."

      - source: "Praksis · Prosessgjennomsnitt under mål"
        question: "En produksjonsprosess skal gi et gjennomsnitt på `μ₀ = 50`. Et utvalg på `n = 8` enheter gir `x̄ = 46` og `s = 6`. Test på `α = 0.05` om prosessens gjennomsnitt er lavere enn målet."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 8`, `x̄ = 46`, `s = 6`, `μ₀ = 50`, `α = 0.05`." }
              - { text: "Frihetsgrader: `ν = n − 1 = 7`." }
              - { text: "`σ` ukjent ⇒ én-utvalgs t-test." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≥ 50`" }
              - { text: "`H₁: μ < 50` (venstresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "Innsatt: `T = (46 − 50)/(6/√8)`." }
              - { text: "`s/√n = 6/√8 ≈ 2.121`." }
              - { text: "`T ≈ −4/2.121 ≈ −1.886`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.05, 7) ≈ 1.895` ⇒ kritisk verdi `−t_(0.05, 7) ≈ −1.895`." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ −1.886` mot `−1.895`." }
              - { text: "`T > −1.895` (så vidt), så vi beholder `H₀`." }
              - { text: "På 5 %-nivå er det ikke tilstrekkelig evidens for at prosessgjennomsnittet er lavere enn 50; resultatet er på grensen og motiverer ev. større utvalg." }
        result: "`T ≈ −1.886 > −1.895` ⇒ behold `H₀` (resultat på grensen)."
  - label: "H₁: μ > μ₀ (høyre)"
    solutions:
      - source: "Øving 5 · oppgave 2 (rådata, beregn s² først)"
        question: "Test om gjennomsnittet er over `μ₀ = 14` på signifikansnivå `α = 0.01`. Målinger: 15, 17, 18, 14, 19, 16, 17, 15, 19, 13."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≤ 14`" }
              - { text: "`H₁: μ > 14` (høyresidig)" }
          - label: "Gjennomsnittet"
            lines:
              - { text: "`x̄ = (15 + 17 + 18 + 14 + 19 + 16 + 17 + 15 + 19 + 13)/10 = 163/10 = 16.3`" }
          - label: "Utvalgsvarians og s"
            lines:
              - { text: "`var = ((15−16.3)² + (17−16.3)² + (18−16.3)² + (14−16.3)² + (19−16.3)² + (16−16.3)² + (17−16.3)² + (15−16.3)² + (19−16.3)² + (13−16.3)²)/(10−1)`" }
              - { indent: "`= (1.69 + 0.49 + 2.89 + 5.29 + 7.29 + 0.09 + 0.49 + 1.69 + 7.29 + 10.89)/9`" }
              - { indent: "`= 38.10/9 ≈ 4.23`" }
              - { text: "`s = √4.23 ≈ 2.06`" }
          - label: "Testobservator"
            lines:
              - { text: "`T = (x̄ − μ₀)/(s/√n) = (16.3 − 14)/(2.06/√10)`" }
              - { indent: "`= 2.3/0.6515 ≈ 3.53`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.01, 9) ≈ 2.821` (høyresidig kritisk verdi)." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ 3.53 > 2.821` ✓" }
              - { text: "Forkast `H₀`." }
              - { text: "På 1 %-nivå er det signifikant evidens for at `μ > 14`." }
        result: "`T ≈ 3.53 > 2.821` ⇒ forkast `H₀`. `μ > 14`."

      - source: "Praksis · Gjødselpåstand"
        question: "En gjødselprodusent hevder at avlingen er minst `μ₀ = 50` kg/dekar. Et utvalg på `n = 10` jordstykker gir `x̄ = 53` og `s = 4`. Test om `μ > 50` på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 10`, `x̄ = 53`, `s = 4`, `μ₀ = 50`, `α = 0.05`." }
              - { text: "Frihetsgrader: `ν = n − 1 = 9`." }
              - { text: "`σ` ukjent ⇒ én-utvalgs t-test." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≤ 50`" }
              - { text: "`H₁: μ > 50` (høyresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "Innsatt: `T = (53 − 50)/(4/√10)`." }
              - { text: "`s/√n = 4/√10 ≈ 1.265`." }
              - { text: "`T ≈ 3/1.265 ≈ 2.372`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.05, 9) ≈ 1.833` (høyresidig kritisk verdi)." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ 2.372 > 1.833`." }
              - { text: "Forkast `H₀`." }
              - { text: "På 5 %-nivå er det signifikant evidens for at gjennomsnittlig avling er høyere enn 50 kg/dekar; produsentens påstand støttes." }
        result: "`T ≈ 2.372 > 1.833` ⇒ forkast `H₀`. `μ > 50` kg/dekar."
      - source: "Praksis · Reaksjonstidstrening"
        question: "Etter et treningsprogram måles reaksjonstid hos `n = 15` deltakere: `x̄ = 210` ms og `s = 20`. Tidligere referanse er `μ₀ = 200` ms. Test om treningen gir høyere reaksjonstid (dårligere) på `α = 0.01`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 15`, `x̄ = 210`, `s = 20`, `μ₀ = 200`, `α = 0.01`." }
              - { text: "Frihetsgrader: `ν = n − 1 = 14`." }
              - { text: "`σ` ukjent ⇒ én-utvalgs t-test." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ ≤ 200`" }
              - { text: "`H₁: μ > 200` (høyresidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "Innsatt: `T = (210 − 200)/(20/√15)`." }
              - { text: "`s/√n = 20/√15 ≈ 5.164`." }
              - { text: "`T ≈ 10/5.164 ≈ 1.936`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.01, 14) ≈ 2.624` (høyresidig kritisk verdi)." } }
          - label: "Konklusjon"
            lines:
              - { text: "Sammenlign: `T ≈ 1.936 < 2.624`." }
              - { text: "Behold `H₀`." }
              - { text: "På 1 %-nivå er det ikke tilstrekkelig evidens for at reaksjonstiden er høyere enn 200 ms; observert økning er ikke statistisk signifikant ved dette strenge nivået." }
        result: "`T ≈ 1.936 < 2.624` ⇒ behold `H₀`."
  - label: "H₁: μ ≠ μ₀ (tosidig)"
    solutions:
      - source: "Praksis · Påfyllingsmaskin"
        question: "En påfyllingsmaskin skal fylle flasker med `μ₀ = 500` ml. Et utvalg på `n = 15` flasker gir `x̄ = 503` og `s = 4`. Test om `μ ≠ 500` på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 15`, `x̄ = 503`, `s = 4`, `μ₀ = 500`, `α = 0.05`." }
              - { text: "Frihetsgrader: `ν = n − 1 = 14`." }
              - { text: "`σ` ukjent ⇒ én-utvalgs t-test." }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: μ = 500`" }
              - { text: "`H₁: μ ≠ 500` (tosidig)" }
          - label: "Testobservator"
            lines:
              - { text: "Formel: `T = (x̄ − μ₀)/(s/√n)`." }
              - { text: "Innsatt: `T = (503 − 500)/(4/√15)`." }
              - { text: "`s/√n = 4/√15 ≈ 1.033`." }
              - { text: "`T ≈ 3/1.033 ≈ 2.905`." }
          - label: "Tabelloppslag"
            lines:
