id: minste-kvadraters-metode
term_no: Minste kvadraters metode (OLS)
short_def: "Estimerer regresjonslinja ved å minimere summen av kvadrerte residualer Σ(yᵢ − ŷᵢ)²."
filters:
  setup: [linear_relationship]
  random_variable: [slope_estimate]
  structural_cues: [linear_relationship_suspected]
  computes: [parameter_estimate]
  parameters_known: [sum_xx_sxy]
aliases:
  - minste kvadraters metode
  - minste kvadraters
  - OLS
long_def: |
  Metoden velger `αˆ` og `βˆ` slik at summen av kvadrerte avstander mellom
  observerte `yᵢ` og predikerte `ŷᵢ` blir minst mulig. Kvadratet straffer
  store avvik mer enn små og gjør matematikken pen (lukket løsning).

  **Stigningstall:**

      βˆ = S_xy / S_xx

  **Konstantledd:**

      αˆ = ȳ − βˆ·x̄

  Sårbar for uteliggere fordi store avvik veier ekstra tungt.
