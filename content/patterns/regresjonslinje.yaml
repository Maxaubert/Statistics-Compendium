id: regresjonslinje
name_no: "Lineær sammenheng (x, y), estimer linje"
cue: "Oppgaven gir et datasett med par (x_i, y_i) — eller summer som Σx, Σy, Σx², Σxy — og ber deg finne den 'beste' rette linjen ŷ = α̂ + β̂·x. Ofte etterfulgt av en prediksjon: 'hva er ŷ når x = …?'"
procedure:
  - "Regn x̄ og ȳ (gjennomsnittene)"
  - "Regn S_xy = Σ(x_i − x̄)(y_i − ȳ) og S_xx = Σ(x_i − x̄)²"
  - "Tips: S_xy = Σx_i·y_i − n·x̄·ȳ; S_xx = Σx_i² − n·x̄²"
  - "β̂ = S_xy / S_xx (stigningstallet)"
  - "α̂ = ȳ − β̂·x̄ (skjæringspunktet)"
  - "Skriv linjen: ŷ = α̂ + β̂·x"
  - "For prediksjon: sett inn ønsket x og les av ŷ"
entry_refs:
  - regresjon-estimat-alpha-beta
example: "n = 10, x̄ = 5, ȳ = 12, S_xy = 80, S_xx = 40. β̂ = 80/40 = 2, α̂ = 12 − 2·5 = 2. Linjen er ŷ = 2 + 2x."
