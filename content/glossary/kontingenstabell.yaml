id: kontingenstabell
term_no: Kontingenstabell (krysstabell, r×c-tabell)
short_def: "Tabell over antall observasjoner i hver kombinasjon av to kategoriske variabler."
filters:
  setup: [joint_table_given]
  structural_cues: [joint_table_present, more_than_two_categories]
  distribution_assumption: [chi_squared]
  computes: [test_independence, hypothesis_test]
long_def: |
  Hver rad svarer til en verdi av variabel `X`, hver kolonne til en
  verdi av variabel `Y`. Cellen `O_ij` teller hvor mange observasjoner
  som har `X = i` og `Y = j`.

  Brukes som input til kjikvadrat-test for uavhengighet.

  **Forventet antall under H₀:**

      E_ij = (rad-sum × kol-sum) / totalsum

  **Testobservator:**

      χ² = Σ (O − E)² / E
aliases:
  - kontingenstabell
  - kontingenstabellen
  - kontingenstabeller
  - krysstabell
  - krysstabellen
  - r×c-tabell
  - r x c-tabell
see_also:
  - { id: kjikvadrat-uavhengighet, kind: entry }
  - { id: kjikvadrat-goodness-of-fit, kind: entry }
