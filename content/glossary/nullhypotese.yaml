id: nullhypotese
term_no: Nullhypotese (H₀)
short_def: "Påstanden vi tester mot — typisk «ingen effekt» eller «ingen forskjell»."
filters:
  computes: [hypothesis_test, test_independence]
  random_variable: [difference_of_means, proportion]
  setup: [two_independent_samples]
  parameters_known: [alpha_significance, success_p]
  distribution_assumption: [chi_squared, normal, binomial, t_distribution]
  structural_cues: [one_sided_alternative, two_sided_alternative]
aliases:
  - nullhypotese
  - nullhypotesen
  - H₀
  - H_0
long_def: |
  `H₀` er status quo som dataene må motbevise. Du forkaster aldri `H₀`
  med mindre testobservatoren er ekstrem nok.

  **"Ikke forkaste" betyr ikke at `H₀` er sann** — bare at vi ikke har
  bevis nok mot den.
see_also:
