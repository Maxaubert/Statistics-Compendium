id: z
sym: "z"
short_def: "Z-statistikk eller standardisert verdi – antall standardavvik fra gjennomsnittet, regnet som (X − μ)/σ."
contexts:
  - usage: "Z-statistikk i hypotesetest (kjent σ)"
    detail: |
      Når σ er kjent (eller utvalget er stort nok til at sentralgrense-
      teoremet slår inn) bruker du z-statistikken til å teste om
      utvalgsgjennomsnittet ditt er overraskende langt fra μ₀.

      Formel: z = (x̄ − μ₀) / (σ/√n)

      Under H₀ følger z standard normalfordeling N(0, 1). Slå opp i
      tabell E.3 (kumulativ standardnormal) for å finne kritisk
      verdi eller p-verdi.

      Eksempel: hvis z = 2.1 og du har en tosidig test med α = 0.05,
      er kritisk verdi ±1.96. |2.1| > 1.96 → forkast H₀.

      Kjent σ er sjelden i praksis – derfor brukes t-test oftere
      enn z-test. Men z dukker opp i andelstest og når n er stor.
    entry_refs:
      - en-utvalg-z-test
      - en-utvalg-z-test-andel
      - ki-mu-kjent-sigma
      - ki-andel-binomial
  - usage: "Standardisert verdi"
    detail: |
      z = (X − μ)/σ uttrykker hvor mange standardavvik X ligger fra μ.

      Eksempel: X = 175 cm, μ = 170, σ = 10 → z = (175 − 170)/10 = 0.5.
      Altså: 175 cm ligger 0.5 standardavvik over snittet.

      Hvorfor standardisere? Slik kan du bruke én tabell (E.3) til
      å regne sannsynligheter for ALLE normalfordelinger, uansett
      hvilken μ og σ de har.

      Negative z-verdier er observasjoner under gjennomsnittet,
      positive over.
    entry_refs:
      - normalfordeling
see_also:
  - { id: normalisering, kind: glossary }
  - { id: kritisk-verdi, kind: glossary }
