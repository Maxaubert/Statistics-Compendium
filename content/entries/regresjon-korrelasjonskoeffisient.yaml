id: regresjon-korrelasjonskoeffisient
name_no: "Korrelasjonskoeffisient r (Pearson)"
type: regression
category: regression_estimate
tagline: "Mål på styrken og retningen av en lineær sammenheng mellom x og y."

formula_main: "r = S_XY / (√S_XX · √S_YY) = Σ(x_i - x̄)(y_i - ȳ) / √(Σ(x_i - x̄)² · Σ(y_i - ȳ)²)"
formula_latex: "r = \\frac{\\sum (x_i - \\bar{x})(y_i - \\bar{y})}{\\sqrt{\\sum (x_i - \\bar{x})^2 \\cdot \\sum (y_i - \\bar{y})^2}}"

what_it_does: |
  Beregner Pearson-korrelasjonskoeffisient r mellom to variabler basert
  på n observasjonspar. r ligger mellom -1 og 1: r = 1 perfekt positiv
  lineær sammenheng, r = -1 perfekt negativ, r = 0 ingen lineær
  sammenheng.

why_use: |
  Etter du har sett et spredningsplott, kvantifiserer r styrken av den
  lineære sammenhengen. Skiller seg fra ρ (korrelasjon for fellesfordeling
  fra populasjon) ved at r er et ESTIMAT basert på utvalg, og brukes i
  regresjonsanalyse.

recognition_cues:
  - "Du har n par av observasjoner (x_i, y_i)"
  - "Spørsmålet ber om 'korrelasjonskoeffisient' eller 'styrken av sammenhengen'"
  - "Datatabell viser S_XX, S_YY, S_XY eller summer som lar deg regne dem ut"

when_NOT_to_use:
  - "Du jobber med en simultanfordeling (felles teoretisk fordeling) → bruk ρ"
  - "Du forventer en ikke-lineær sammenheng → r kan være misvisende"

symbols:
  - { sym: "r",       means: "korrelasjonskoeffisient (utvalgsestimat)" }
  - { sym: "S_XX",    means: "Σ(x_i - x̄)²" }
  - { sym: "S_YY",    means: "Σ(y_i - ȳ)²" }
  - { sym: "S_XY",    means: "Σ(x_i - x̄)(y_i - ȳ)" }

filters:
  computes: [correlation]
  random_variable: [slope_estimate]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list, summary_stats_given]
  parameters_known: [sum_xx_sxy]
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]

solution_template:
  - "Beregn x̄, ȳ"
  - "Beregn S_XX, S_YY, S_XY (eller hent fra datatabell)"
  - "r = S_XY / √(S_XX · S_YY)"
  - "Tolk: nær 1 = sterk positiv, nær -1 = sterk negativ, nær 0 = ingen lineær sammenheng"

common_traps: |
  r måler bare LINEÆR sammenheng. Sterk ikke-lineær sammenheng (f.eks.
  kvadratisk) kan gi r ≈ 0. Husk forskjellen på r og ρ: r er estimat
  fra utvalg av (x,y)-par; ρ er korrelasjon fra en fellesfordeling.

detailed_solution_variants:
  - label: "Korrelasjonskoeffisient r"
    solutions:
      - source: "Eksamen mai25 · oppgave 5b"
        question: "Datatabellen gir `Σ(x-x̄)² = 15.6`, `Σ(y-ȳ)² = 734.1`, `Σ(x-x̄)(y-ȳ) = 103.4`. Beregn korrelasjonskoeffisient `r` og tolk resultatet."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi har `n` par av observasjoner og oppsummerte mellom-summer." }
              - { text: "Spørsmålet ber om Pearson-korrelasjonskoeffisient `r` — et mål på styrken av den lineære sammenhengen." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gitt direkte fra datatabellen:" }
              - { indent: "`S_XX = Σ(x-x̄)² = 15.6`" }
              - { indent: "`S_YY = Σ(y-ȳ)² = 734.1`" }
              - { indent: "`S_XY = Σ(x-x̄)(y-ȳ) = 103.4`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "Formel: `r = S_XY / √(S_XX · S_YY)`" }
              - { text: "Sett inn:" }
              - { indent: "`r = 103.4 / √(15.6 · 734.1)`" }
              - { indent: "`= 103.4 / √11451.96`" }
              - { indent: "`= 103.4 / 107.01`" }
              - { indent: "`≈ 0.966`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ 0.966` ligger svært nær 1 — sterk positiv lineær sammenheng mellom `x` og `y`." }
              - { text: "Forklart variasjon: `r² ≈ 0.933` — ca. 93 % av variasjonen i `y` forklares av lineær regresjon på `x`." }
        result: "`r ≈ 0.966` (sterk positiv lineær sammenheng, `r² ≈ 0.933`)"

      - source: "Praksisoppgave (samme data som regresjon-estimat #2)"
        question: "Gitt datasettet `(1,2), (2,3), (3,5), (4,6), (5,8)`. Beregn korrelasjonskoeffisient `r` og tolk."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 5` par av observasjoner." }
              - { text: "Vi skal kvantifisere styrken av den lineære sammenhengen mellom `x` og `y`." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gjennomsnitt:" }
              - { indent: "`x̄ = (1+2+3+4+5)/5 = 3`" }
              - { indent: "`ȳ = (2+3+5+6+8)/5 = 4.8`" }
              - { text: "`S_XX = Σ(x-x̄)² = 4 + 1 + 0 + 1 + 4 = 10`" }
              - { text: "`S_XY = Σ(x-x̄)(y-ȳ) = (-2)(-2.8)+(-1)(-1.8)+0·0.2+1·1.2+2·3.2`" }
              - { indent: "`= 5.6 + 1.8 + 0 + 1.2 + 6.4 = 15`" }
              - { text: "`S_YY = Σy² − n·ȳ² = (4+9+25+36+64) − 5·(4.8)² = 138 − 5·23.04 = 138 − 115.2 = 22.8`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "Formel: `r = S_XY / √(S_XX · S_YY)`" }
              - { text: "Sett inn:" }
              - { indent: "`r = 15 / √(10 · 22.8)`" }
              - { indent: "`= 15 / √228`" }
              - { indent: "`= 15 / 15.0997`" }
              - { indent: "`≈ 0.987`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ 0.987` — meget sterk positiv lineær sammenheng." }
              - { text: "`r² ≈ 0.975` — ca. 97.5 % av variasjonen i `y` forklares av regresjonen på `x`." }
              - { text: "Punktene ligger nesten på en rett linje (jf. spredningsplott)." }
        result: "`r ≈ 0.987` (`r² ≈ 0.975`)"

      - source: "Praksisoppgave (svak/negativ korrelasjon for kontrast)"
        question: "Datasett `(1,5), (2,4), (3,5), (4,3), (5,3)`. Beregn `r` og tolk hva en negativ verdi betyr."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 5` par. Spørsmålet ber om `r` for å se om sammenhengen er positiv, negativ eller svak." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gjennomsnitt:" }
              - { indent: "`x̄ = (1+2+3+4+5)/5 = 3`" }
              - { indent: "`ȳ = (5+4+5+3+3)/5 = 4`" }
              - { text: "`S_XX = 4 + 1 + 0 + 1 + 4 = 10`" }
              - { text: "`S_XY = (-2)(1)+(-1)(0)+0·1+1·(-1)+2·(-1)`" }
              - { indent: "`= -2 + 0 + 0 - 1 - 2 = -5`" }
              - { text: "`S_YY = Σ(y-ȳ)² = 1 + 0 + 1 + 1 + 1 = 4`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "Formel: `r = S_XY / √(S_XX · S_YY)`" }
              - { text: "Sett inn:" }
              - { indent: "`r = -5 / √(10 · 4)`" }
              - { indent: "`= -5 / √40`" }
              - { indent: "`= -5 / 6.3246`" }
              - { indent: "`≈ -0.791`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ -0.791` — moderat til sterk NEGATIV lineær sammenheng: når `x` øker, har `y` en tendens til å avta." }
              - { text: "`r² ≈ 0.625` — ca. 62.5 % av variasjonen i `y` forklares av lineær regresjon på `x`. Resten (≈37.5 %) er uforklart støy." }
              - { text: "MERK: `r` måler bare lineær sammenheng. Ved et ikke-lineært mønster kan `r` være liten selv om punktene følger en tydelig kurve." }
        result: "`r ≈ -0.791` (`r² ≈ 0.625`, negativ retning)"

