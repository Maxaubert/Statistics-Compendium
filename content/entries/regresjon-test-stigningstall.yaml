id: regresjon-test-stigningstall
name_no: "Hypotesetest for stigningstallet β i lineær regresjon"
type: test
category: hypothesis_test
tagline: "Tester om det er en lineær sammenheng mellom `x` og `y`, dvs. om stigningstallet `β` er forskjellig fra null."

formula_main: "T = (β̂ - β₀) / SE(β̂);  SE(β̂) = √(S_E² / Σ(x_i - x̄)²)"
formula_latex: "T = \\frac{\\hat{\\beta} - \\beta_0}{\\text{SE}(\\hat{\\beta})}, \\quad \\text{SE}(\\hat{\\beta}) = \\sqrt{\\frac{S_E^2}{\\sum (x_i - \\bar{x})^2}}"

what_it_does: |
  Tester om regresjonsparametern `β` (stigningstallet) er forskjellig fra
  en gitt verdi `β₀` (vanligvis `0`, dvs. om det er sammenheng i det hele tatt).
  Testobservatoren er t-fordelt med `ν = n − 2` frihetsgrader.

why_use: |
  Etter du har estimert en regresjonslinje `ŷ = α̂ + β̂·x`, er det viktig å
  vurdere om sammenhengen kan skyldes tilfeldigheter. Hvis vi ikke kan
  forkaste `H₀: β = 0`, har vi ikke statistisk grunnlag for å si at det
  faktisk er en lineær sammenheng.

recognition_cues:
  - "Du har en regresjonslinje og vil teste om sammenhengen er signifikant"
  - "Spørsmålet er av type: 'kan sammenhengen skyldes tilfeldigheter?'"
  - "Du har `β̂` og `SE(β̂)` gitt, eller du kan beregne dem"
  - "`n − 2` frihetsgrader nevnes (kjennetegn på regresjonstest)"

when_NOT_to_use:
  - "Du vil teste om `μ =` en verdi → bruk [én-utvalgs t-test](/entry/en-utvalg-t-test) i stedet"
  - "Du sammenligner to grupper → [to-utvalgs t-test](/entry/to-utvalgs-t-test)"
  - "Du estimerer `Y` for en `x`-verdi (ikke selve sammenhengen) → [prediksjonsintervall](/entry/regresjon-prediksjonsintervall)"

symbols:
  - { sym: "β̂",    means: "estimert stigningstall" }
  - { sym: "β",     means: "den ukjente populasjonsstigningen (det vi tester)" }
  - { sym: "β₀",    means: "verdien vi tester mot, ofte `0`" }
  - { sym: "SE(β̂)", means: "standardfeilen til `β̂`" }
  - { sym: "S_E²",   means: "estimat for residualenes varians" }
  - { sym: "n",     means: "antall observasjonspar" }
  - { sym: "ν",     means: "frihetsgrader, `ν = n − 2`" }
  - { sym: "T",     means: "testobservator, t-fordelt under `H₀`" }
  - { sym: "H₀",    means: "nullhypotesen, typisk `β = β₀` (ofte `β = 0`)" }
  - { sym: "α",     means: "signifikansnivå (typisk `0.05`)" }

filters:
  computes: [hypothesis_test, test_independence]
  random_variable: [slope_estimate, continuous]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, regression_line_given, data_as_list, summary_stats_given, normal_assumed, total_observations_n, two_sided_alternative, one_sided_alternative]
  parameters_known: [slope_se, residual_variance, alpha_significance, sum_xx_sxy, population_variance_unknown, regression_line_estimate]
  distribution_assumption: [t_distribution, normal]
  tooling: [t_quantile_table_E5, calculator_sqrt]

solution_template:
  - text: "Formuler hypotesene (typisk tosidig test)."
    formula: "H₀: β = 0     mot     H₁: β ≠ 0"
  - text: "Beregn `SE(β̂)` hvis ikke gitt."
    formula: "SE(β̂) = √(S_E² / Σ(x_i − x̄)²)"
  - text: "Beregn testobservatoren."
    formula: "T = (β̂ − 0) / SE(β̂)"
  - text: "Eksempel: `β̂ = 6.63`, `SE(β̂) = 0.625`:"
    formula: "T = 6.63 / 0.625 ≈ 10.61"
    example: true
  - "Finn kvantil `t_(α/2, n−2)` i **tabell E.5** (t-kvantiltabell, tosidig)"
  - text: "Forkastningsregel."
    formula: "Forkast H₀ hvis |T| > t_(α/2, n−2)"
  - "Konkluder om hvorvidt det er statistisk grunnlag for lineær sammenheng"

common_traps: |
  - **`ν = n − 2` i regresjon** (ikke `n − 1`), fordi to parametre (`α̂`, `β̂`)
    er estimert. Bruker du `n − 1` får du for liten kritisk verdi og forkaster
    `H₀` for ofte.
  - **`SE(β̂) ≠ S_E`**: `SE(β̂) = √(S_E²/S_XX) = S_E/√S_XX`. Disse blandes
    konstant — `S_E` er residualstandardavvik, `SE(β̂)` er standardfeilen
    til selve `β̂`-estimatet.
  - **Tosidig vs. ensidig**: `H₁: β ≠ 0` (tosidig, bruk `t_(α/2, n−2)`) vs.
    `H₁: β > 0` (høyresidig, bruk `t_(α, n−2)`). "Er det positiv sammenheng?"
    er ofte ensidig, "er det noen sammenheng?" er tosidig.
  - **`β₀ = 0` er ikke alltid testen**: noen oppgaver tester `H₀: β = β₀` for
    annen `β₀` (f.eks. om stigningstallet er minst en gitt verdi).
    Telleren er da `β̂ − β₀`, ikke bare `β̂`.
  - **Ikke-forkast ≠ bevis for null sammenheng**: liten `n` eller mye støy
    kan gi `|T| < t_kritisk` selv om det egentlig finnes en sammenheng.
    Konklusjon: "ingen statistisk grunnlag for å hevde sammenheng".

python_snippet: |
  import numpy as np
  from scipy.stats import t

  x = np.array([5,6,7,8,6,7,8,5,9,7])
  y = np.array([68,75,80,85,72,78,92,70,95,82])

  beta_hat = np.cov(x, y, ddof=1)[0,1] / np.var(x, ddof=1)
  alpha_hat = y.mean() - beta_hat * x.mean()
  y_hat = alpha_hat + beta_hat * x
  SSE = ((y - y_hat) ** 2).sum()
  n = len(x)
  SE2 = SSE / (n - 2)
  SE_beta = (SE2 / ((x - x.mean()) ** 2).sum()) ** 0.5

  t_obs = beta_hat / SE_beta              # 10.61
  t_crit = t.ppf(0.975, df=n-2)            # 2.306

detailed_solution_variants:
  - label: "Test β = 0 (lineær sammenheng?)"
    solutions:
      - source: "Eksamen mai25 · oppgave 5d"
        question: "Regresjonslinjen er `ŷ = 34.6 + 6.63·x` med `SSE = 48.7437` og `Σ(x_i - x̄)² = 15.6`, `n = 10`. Test om sammenhengen mellom søvn og eksamensresultat er signifikant på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`β̂ = 6.63`, `SSE = 48.7437`, `Σ(x_i - x̄)² = 15.6`" }
              - { text: "`n = 10`, `α = 0.05`" }
              - { comment: "SE(β̂) må beregnes fra SSE og Σ(x-x̄)²" }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: β = 0` (ingen lineær sammenheng)" }
              - { text: "`H₁: β ≠ 0` (det ER en lineær sammenheng)" }
              - { comment: "tosidig test" }
          - label: "Testobservator"
            lines:
              - { text: "`S_E² = SSE / (n-2) = 48.7437 / 8 = 6.093`" }
              - { text: "`SE(β̂) = √(S_E² / Σ(x-x̄)²) = √(6.093 / 15.6) = 0.625`" }
              - { text: "`T = β̂ / SE(β̂) = 6.63 / 0.625 = 10.61`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "`df = n - 2 = 10 - 2 = 8`" }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 8) = 2.306` (tosidig kritisk verdi)" } }
          - label: "Konklusjon"
            lines:
              - { text: "`|T| = 10.61 > 2.306` ✓ → forkast `H₀`" }
              - { comment: "klart signifikant resultat" }
        result: "Forkast `H₀` på `α = 0.05`. Det er statistisk signifikant lineær sammenheng mellom søvn og eksamensresultat."

      - source: "Praksis · klar sammenheng"
        question: "Datasettet `(1,2), (2,3), (3,5), (4,6), (5,8)` gir `β̂ = 1.5` og `SE(β̂) = 0.1`. Test om det er en lineær sammenheng på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`β̂ = 1.5`, `SE(β̂) = 0.1`" }
              - { text: "`n = 5`, `α = 0.05`" }
              - { comment: "begge størrelser er gitt direkte" }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: β = 0` (ingen lineær sammenheng)" }
              - { text: "`H₁: β ≠ 0` (lineær sammenheng)" }
              - { comment: "tosidig test" }
          - label: "Testobservator"
            lines:
              - { text: "`T = β̂ / SE(β̂) = 1.5 / 0.1 = 15.0`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "`df = n - 2 = 5 - 2 = 3`" }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 3) = 3.182` (tosidig kritisk verdi)" } }
          - label: "Konklusjon"
            lines:
              - { text: "`|T| = 15.0 ≫ 3.182` ✓ → forkast `H₀` med god margin" }
              - { comment: "selv med kun n=5 er sammenhengen overveldende" }
        result: "Forkast `H₀` på `α = 0.05`. Det er sterk statistisk signifikant lineær sammenheng mellom `x` og `y`."

      - source: "Praksis · svak sammenheng"
        question: "I et datasett med `n = 12` observasjoner finner vi `β̂ = 0.35` og `SE(β̂) = 0.28`. Test om det er en lineær sammenheng på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`β̂ = 0.35`, `SE(β̂) = 0.28`" }
              - { text: "`n = 12`, `α = 0.05`" }
              - { comment: "merk at SE er stor relativt til β̂" }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: β = 0` (ingen lineær sammenheng)" }
              - { text: "`H₁: β ≠ 0` (lineær sammenheng)" }
              - { comment: "tosidig test" }
          - label: "Testobservator"
            lines:
              - { text: "`T = β̂ / SE(β̂) = 0.35 / 0.28 = 1.25`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "`df = n - 2 = 12 - 2 = 10`" }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 10) = 2.228` (tosidig kritisk verdi)" } }
          - label: "Konklusjon"
            lines:
              - { text: "`|T| = 1.25 < 2.228` ✗ → kan IKKE forkaste `H₀`" }
              - { comment: "punktet ligger innenfor akseptanseområdet" }
        result: "Vi forkaster ikke `H₀` på `α = 0.05`. Det er ikke statistisk grunnlag for å hevde at det finnes en lineær sammenheng mellom `x` og `y`."

