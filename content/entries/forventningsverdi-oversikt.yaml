id: forventningsverdi-oversikt
name_no: "Forventningsverdi (oversikt)"
type: overview
tagline: "`E[X]` = vektet gjennomsnitt. Alle formene er samme idé med forskjellige vekter eller datakilder."

what_it_means: |
  Forventningsverdien er det langsiktige snittet av en variabel — det
  vektede gjennomsnittet av mulige verdier.

      forventningsverdi = «sum av verdi · vekt»

  Vekten er sannsynligheten (stokastisk variabel) eller `1/n` (utvalg).

forms:
  - title: "Forventningsverdi for diskret stokastisk variabel"
    symbol: "Σ x·P"
    glossary_id: forventningsverdi
    formula: "E[X] = Σ xᵢ · P(X = xᵢ)"
    description: "Når du har en PMF-tabell. Vekten er sannsynligheten."
    entry_links:
      - { id: diskret-stokastisk-variabel, label: "Entry" }
  - title: "Forventningsverdi for kontinuerlig stokastisk variabel"
    symbol: "∫ x·f(x)dx"
    formula: "E[X] = ∫ x · f(x) dx"
    description: "For kontinuerlige variabler (vekt, tid, lengde) med tetthet f(x). I praksis bruker du ferdige formler — E[X] = μ for normal, E[T] = 1/λ for eksponential."
  - title: "Utvalgsgjennomsnitt"
    symbol: "X̄"
    glossary_id: gjennomsnitt
    formula: "X̄ = Σ Xᵢ / n"
    description: "Estimat for μ fra rådata. Forventningsrett: E[X̄] = μ når observasjonene er iid."
  - title: "Lineæritet"
    symbol: "aX+b"
    formula: "E[aX + b] = a·E[X] + b"
    description: "Skalering og forskyvning. Eksempel: Y = 2X + 5 med E[X] = 3 gir E[Y] = 11."
  - title: "Sum av variabler"
    symbol: "X+Y"
    formula: "E[X + Y] = E[X] + E[Y]"
    description: "Forventningen til en sum er summen av forventningene. Krever IKKE uavhengighet."
  - title: "Sum av n iid variabler"
    symbol: "Σ Xᵢ"
    formula: "E[Y] = E[X₁ + … + Xₙ] = n · E[X] = n · μ"
    description: "Direkte formel når Y er en sum av n uavhengige og identisk fordelte variabler. Krever bare at hver Xᵢ har samme forventning μ. Eksempel: Y = X₁+…+X₁₃₀ med E[Xᵢ] = 65 gir E[Y] = 130·65 = 8450."
    entry_links:
      - { id: sum-uavhengige-normaler, label: "Sum av uavhengige normaler" }
      - { id: sentralgrenseteoremet-glos, label: "Sentralgrenseteoremet" }
  - title: "Produkt under uavhengighet"
    symbol: "X·Y"
    formula: "E[X · Y] = E[X] · E[Y]        (KUN hvis X ⊥ Y)"
    description: "⚠️ Gjelder BARE når X og Y er uavhengige (`Cov(X, Y) = 0`). Hvis `Cov(X, Y) ≠ 0` er denne snarveien FEIL — bruk formelen under i stedet."
    entry_links:
      - { id: kovarians, label: "Kovarians Cov(X,Y)" }
  - title: "Produkt når X og Y er avhengige"
    symbol: "X·Y (via Cov)"
    formula: "E[X · Y] = E[X] · E[Y] + Cov(X, Y)"
    description: "Når `Cov(X, Y) ≠ 0` kan du IKKE bruke `E[X·Y] = E[X]·E[Y]`. Tenk i stedet: «snarveien + Cov-korreksjon». Avledet fra definisjonen `Cov(X, Y) = E[X·Y] − E[X]·E[Y]`. Eksempel: `E[X] = 20`, `E[Y] = 15`, `Cov = 5` ⇒ `E[X·Y] = 300 + 5 = 305`."
    entry_links:
      - { id: kovarians, label: "Kovarians Cov(X,Y)" }

recognition_cues:
  - "Oppgaven ber om `E[X]`, `μ`, eller forventningsverdien"
  - "Oppgaven gir en transformert variabel (`Y = aX + b`) og spør om `E[Y]`"
  - "Oppgaven gir simultanfordeling og spør om `E[X · Y]` eller `E[X + Y]`"
  - "Du har rådata og trenger gjennomsnittet `x̄`"

when_NOT_to_use:
  - "Du vet hvilken konkret form du trenger (PMF, rådata, simultantabell) → gå direkte til den spesifikke entryen"
  - "Spørsmålet handler om spredning, ikke senter → bruk [varians (oversikt)](/entry/varians-oversikt) i stedet"

filters:
  computes: [expected_value]
  random_variable: [discrete_count, continuous]
  setup: [single_population]
  structural_cues: [data_as_list, summary_stats_given]
  parameters_known: [mean_known, rate_lambda]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]
