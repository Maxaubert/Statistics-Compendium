id: joint
term_no: Joint (felles)
short_def: "Engelsk for «felles» — som i joint distribution = simultanfordeling."
filters:
  computes: [joint_probability, marginal_probability, conditional_probability, test_independence]
  structural_cues: [conditional_given]
aliases:
  - joint
  - joint distribution
  - joint probability
long_def: |
  Lærebøker veksler mellom "joint", "simultan" og "felles". Alle betyr
  det samme: fordelingen til to (eller flere) variabler sammen,
  `P(X=x, Y=y)`.

  Joint probability: `P(X=x ∩ Y=y)`.
see_also:
  - { id: simultanfordeling, kind: glossary }
  - { id: korrelasjon-joint, kind: entry }
