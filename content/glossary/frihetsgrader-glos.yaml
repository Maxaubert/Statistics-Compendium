id: frihetsgrader-glos
term_no: Frihetsgrader (df, ν)
short_def: "Hvor mange uavhengige biter informasjon som er igjen etter at noe er estimert fra dataene."
aliases:
  - frihetsgrader
  - frihetsgrad
  - df
  - ν
long_def: |
  Forkortelsen `df` står for engelsk *degrees of freedom*; `ν` er det
  greske bokstavsymbolet. Begge betyr det samme.

  Frihetsgrader velger riktig rad i t-tabellen og χ²-tabellen.
  Tommelfingerregler:

  - **Én-utvalg t-test og KI for μ:** `ν = n − 1`
  - **To-utvalg t-test (pooled):** `ν = n_X + n_Y − 2`
  - **Lineær regresjon:** `ν = n − 2`
  - **Kjikvadrat:** `ν = (rader − 1)·(kolonner − 1)`

  Større `ν` → t-fordelingen ligner mer på standardnormal.
see_also:
