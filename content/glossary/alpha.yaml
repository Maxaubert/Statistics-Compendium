id: alpha
term_no: Alfa (α)
short_def: "Signifikansnivå i hypotesetesting — også konstantleddet i regresjonslinja `Y = α + β·X`."
filters:
  parameters_known: [alpha_significance, confidence_level]
  computes: [hypothesis_test, confidence_interval, parameter_estimate]
  setup: [linear_relationship]
  structural_cues: [linear_relationship_suspected]
  tooling: [normal_quantile_table_E4]
aliases:
  - alfa
  - α
long_def: |
  α har to vanlige betydninger på dette kurset:

  - **Signifikansnivå:** sannsynligheten du godtar for å forkaste `H₀` når `H₀` er sann (type-I-feil). Vanlige verdier: `0.10`, `0.05`, `0.01`. Konfidensnivå = `1 − α`.
  - **Regresjon:** konstantleddet (intercept), altså verdien til `Y` når `X = 0`.
see_also:
  - { id: signifikansniva-glos, kind: glossary }
  - { id: intercept, kind: glossary }
  - { id: lineaer-regresjon, kind: entry }
