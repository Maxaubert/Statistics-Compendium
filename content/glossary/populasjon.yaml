id: populasjon
term_no: Populasjon
short_def: "Hele gruppen du vil si noe om — alle individer/objekter av interesse."
long_def: |
  Populasjonen er det fulle universet (alle nordmenn, alle produserte
  enheter, alle mulige målinger). Populasjonens egenskaper (μ, σ², p)
  kalles parametere og er typisk ukjente. Du trekker et utvalg fra
  populasjonen og bruker det til å estimere parameterne. Konklusjonen
  i en test gjelder populasjonen, ikke bare utvalget.
see_also:
