        result: "Forkast `H₀`. Sterk statistisk signifikant lineær sammenheng."

      - source: "Praksis · svak sammenheng"
        question: "I et datasett med `n = 12` observasjoner finner vi `β̂ = 0.35` og `SE(β̂) = 0.28`. Test om det er en lineær sammenheng på `α = 0.05`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`β̂ = 0.35`, `SE(β̂) = 0.28`, `n = 12`, `α = 0.05`." }
              - { comment: "merk at SE er stor relativt til β̂" }
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: β = 0`, `H₁: β ≠ 0` (tosidig)." }
          - label: "Testobservator"
            lines:
              - { text: "`T = 0.35 / 0.28 = 1.25`" }
          - label: "Tabelloppslag"
            lines:
              - { text: "`df = 10`" }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 10) = 2.228`" } }
          - label: "Konklusjon"
            lines:
              - { text: "`|T| = 1.25 < 2.228` ✗ → kan IKKE forkaste `H₀`" }
              - { comment: "punktet ligger innenfor akseptanseområdet" }
        result: "Vi forkaster ikke `H₀`. Ingen statistisk grunnlag for å hevde at det finnes en lineær sammenheng."

  - label: "KI for E(Y|x)"
    solutions:
      - source: "Eksamen sept 2022 · oppgave 5e"
        question: "Regresjonsmodell for hvilepuls `Y` mot alder `x`: `α̂ = 69.22`, `β̂ = 0.114`, `s = 1.832`, `SE(β̂) = 0.040`, `x̄ = 41.9`, `n = 10`. Finn et 90 % konfidensintervall for forventet hvilepuls `E(Y|x)` når `x₀ = 35`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi skal finne et konfidensintervall for FORVENTNINGSVERDIEN `E(Y|x₀)`, ikke for en ny enkelt observasjon." }
              - { text: "Formel: `KI = α̂ + β̂·x₀ ± t_(α/2, n−2) · s · √(1/n + ((x₀ − x̄)/(s/SE(β̂)))²)`." }
              - { comment: "INGEN `1 +` under rota — det er det som skiller KI for E(Y|x) fra prediksjonsintervallet for ny Y." }
          - label: "Oppgitt"
            lines:
              - { text: "`α̂ = 69.22`, `β̂ = 0.114`" }
              - { text: "`s = 1.832`, `SE(β̂) = 0.040`" }
              - { text: "`x̄ = 41.9`, `n = 10`, `x₀ = 35`" }
              - { text: "Konfidensnivå 90 % ⇒ `α = 0.10`, `α/2 = 0.05`, `df = n − 2 = 8`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.05, 8) = 1.860`" } }
          - label: "Punktestimat ŷ₀"
            lines:
              - { text: "`ŷ₀ = α̂ + β̂·x₀ = 69.22 + 0.114·35`" }
              - { indent: "`= 69.22 + 3.99 = 73.21 ≈ 73.2`" }
          - label: "Margin"
            lines:
              - { text: "Hjelpestørrelse `s/SE(β̂)`:" }
              - { indent: "`s/SE(β̂) = 1.832/0.040 = 45.8`" }
              - { text: "Avviksleddet `(x₀ − x̄)/(s/SE(β̂))`:" }
              - { indent: "`(35 − 41.9)/45.8 ≈ −0.1507`,  `(−0.1507)² ≈ 0.0227`" }
              - { text: "Under rota:" }
              - { indent: "`1/n + 0.0227 = 0.1 + 0.0227 = 0.1227`,  `√0.1227 ≈ 0.3503`" }
              - { text: "Sett sammen:" }
              - { indent: "`margin = 1.860 · 1.832 · 0.3503 ≈ 1.19 ≈ 1.2`" }
              - { comment: "Ingen `1+` under rota — derfor smalere enn prediksjonsintervallet." }
          - label: "Intervall"
            lines:
              - { text: "`KI = ŷ₀ ± margin = 73.2 ± 1.2`" }
              - { indent: "`≈ [72.0, 74.4]`" }
          - label: "Sammenligning med PI"
            lines:
              - { text: "Til sammenligning, prediksjonsintervall for ny `Y` ved samme `x₀ = 35`:" }
              - { indent: "`margin_PI = 1.860 · 1.832 · √(1 + 0.1 + 0.0227) = 1.860 · 1.832 · √1.1227 ≈ 3.61`" }
              - { text: "PI ville altså vært `73.2 ± 3.6 ≈ [69.6, 76.8]` — ca. 3 ganger bredere enn KI." }
        result: "`KI ≈ 73.2 ± 1.2 = [72.0, 74.4]` (90 % KI for `E(Y|x = 35)`)"

      - source: "Variant · hvilepuls ved `x₀ = x̄`"
        question: "Samme oppsett som forrige (`α̂ = 69.22`, `β̂ = 0.114`, `s = 1.832`, `SE(β̂) = 0.040`, `x̄ = 41.9`, `n = 10`, 90 % nivå). Finn konfidensintervallet for `E(Y|x)` når `x₀ = x̄ = 41.9`. Vis at dette gir den SMALESTE mulige KI."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Når `x₀ = x̄` forsvinner avviksleddet `(x₀ − x̄)²` fra rota:" }
              - { indent: "`margin = t · s · √(1/n + 0) = t · s · √(1/n)`" }
              - { text: "Dette er bredden ved senterverdien `x̄` — alle andre `x₀` gir bredere KI." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "`t_(0.05, 8) = 1.860`" } }
          - label: "Punktestimat ŷ₀"
            lines:
              - { text: "`ŷ₀ = α̂ + β̂·x̄ = 69.22 + 0.114·41.9`" }
              - { indent: "`= 69.22 + 4.7766 ≈ 74.0`" }
              - { comment: "Dette er punktet `(x̄, ȳ)` som regresjonslinja alltid går gjennom." }
          - label: "Margin"
            lines:
              - { text: "Avviksleddet forsvinner siden `x₀ − x̄ = 0`:" }
              - { indent: "`margin = 1.860 · 1.832 · √(1/10) = 1.860 · 1.832 · 0.3162 ≈ 1.08`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = 74.0 ± 1.08 ≈ [72.9, 75.1]`" }
          - label: "Sammenligning og innsikt"
            lines:
              - { text: "Smalere enn KI ved `x₀ = 35` (gikk fra `1.2` til `1.08`)." }
              - { text: "PI ved `x₀ = x̄` ville vært `≈ 3.57` — fortsatt bred siden `1`-tallet dominerer under rota." }
              - { text: "Forhold `PI/KI ≈ 3.3` ved `x₀ = x̄`: PI tjener lite på å stå i sentrum, mens KI krymper merkbart." }
              - { comment: "Generell regel: KI for E(Y|x) er smalest ved x̄ og vokser parabolsk i begge retninger. Design forsøket slik at interessante x₀ ligger nær x̄." }
        result: "`KI ≈ 74.0 ± 1.08 ≈ [72.9, 75.1]` — smalest mulig KI for `E(Y|x)` med disse parameterne"

  - label: "Prediksjonsintervall for ny Y"
    solutions:
      - source: "Eksamen jan26 · oppgave 6"
        question: "Regresjonslinjen er ŷ = 34.6 + 6.63·x med S_E² = 6.093, SE(β̂) = 0.625, n = 10, x̄ = 6.8. Finn et 95 % prediksjonsintervall for Y når x₀ = 5, og avgjør om det er usannsynlig at en student med 5 timers søvn får 75 % eller bedre."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "α̂ = 34.6, β̂ = 6.63, S_E² = 6.093 ⇒ S_E = √6.093 ≈ 2.4684" }
              - { text: "SE(β̂) = 0.625, n = 10, x̄ = 6.8" }
              - { text: "Nytt x₀ = 5, konfidensnivå 1 − α = 0.95" }
              - { comment: "S_XX = (S_E/SE(β̂))² = (2.4684/0.625)² ≈ 15.59" }
          - label: "Predikert verdi"
            lines:
              - { text: "ŷ₀ = α̂ + β̂·x₀ = 34.6 + 6.63·5" }
              - { indent: "= 34.6 + 33.15 = 67.75" }
          - label: "Standardfeil for prediksjon"
            lines:
              - { text: "SE_pred = S_E · √(1 + 1/n + (x₀ − x̄)²/S_XX)" }
              - { indent: "= 2.4684 · √(1 + 1/10 + (5 − 6.8)²/15.59)" }
              - { indent: "= 2.4684 · √(1 + 0.1 + 3.24/15.59)" }
              - { indent: "= 2.4684 · √(1 + 0.1 + 0.208)" }
              - { indent: "= 2.4684 · √1.308 ≈ 2.4684 · 1.143 ≈ 2.822" }
          - label: "Tabelloppslag"
            lines:
              - { text: "ν = n − 2 = 8 frihetsgrader, α/2 = 0.025" }
              - { table_lookup: { ref: "E.5", text: "t_(0.025, 8) = 2.306" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = t · SE_pred = 2.306 · 2.822 ≈ 6.51" }
              - { text: "PI: ŷ₀ ± margin = 67.75 ± 6.51" }
              - { indent: "= [61.24, 74.26]" }
          - label: "Tolkning"
            lines:
              - { text: "Med 95 % sannsynlighet vil en NY student med 5 timers søvn score mellom 61.24 % og 74.26 %." }
              - { text: "Siden 75 ligger UTENFOR intervallet, er det usannsynlig at studenten får 75 % eller bedre." }
        result: "95 % prediksjonsintervall: [61.24, 74.26]. 75 % er usannsynlig."

      - source: "Praksisoppgave · standard datasett, x₀ nær x̄"
        question: "Et lite datasett (1,2), (2,3), (3,5), (4,6), (5,8) gir β̂ = 1.5, α̂ = 0.3, S_E = √0.1 ≈ 0.3162, S_XX = 10, x̄ = 3, n = 5. Finn et 95 % prediksjonsintervall for en NY observasjon Y når x₀ = 4."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "α̂ = 0.3, β̂ = 1.5, S_E ≈ 0.3162" }
              - { text: "S_XX = 10, x̄ = 3, n = 5" }
              - { text: "Nytt x₀ = 4, konfidensnivå 1 − α = 0.95" }
          - label: "Predikert verdi"
            lines:
              - { text: "ŷ₀ = α̂ + β̂·x₀ = 0.3 + 1.5·4" }
              - { indent: "= 0.3 + 6.0 = 6.3" }
          - label: "Standardfeil for prediksjon"
            lines:
              - { text: "SE_pred = S_E · √(1 + 1/n + (x₀ − x̄)²/S_XX)" }
              - { indent: "= 0.3162 · √(1 + 1/5 + (4 − 3)²/10)" }
              - { indent: "= 0.3162 · √(1 + 0.2 + 0.1)" }
              - { indent: "= 0.3162 · √1.3 ≈ 0.3604" }
              - { comment: "1-tallet under rota fanger usikkerheten i den NYE observasjonen; uten det får man KI for E[Y|x]." }
          - label: "Tabelloppslag"
            lines:
              - { text: "ν = n − 2 = 3 frihetsgrader, α/2 = 0.025" }
              - { table_lookup: { ref: "E.5", text: "t_(0.025, 3) = 3.182" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = t · SE_pred = 3.182 · 0.3604 ≈ 1.147" }
              - { text: "PI: 6.3 ± 1.147 ≈ [5.15, 7.45]" }
          - label: "Tolkning"
            lines:
              - { text: "Med 95 % sannsynlighet vil en ny y-observasjon ved x₀ = 4 ligge mellom ca. 5.15 og 7.45." }
              - { text: "Bredt intervall fordi n er svært liten (kun 5 punkter) og t-kvantilen er stor." }
        result: "95 % prediksjonsintervall ved x₀ = 4: [5.15, 7.45]."

      - source: "Praksisoppgave · samme datasett, x₀ langt fra x̄ (ekstrapolering)"
        question: "Med samme datasett som over (β̂ = 1.5, α̂ = 0.3, S_E ≈ 0.3162, S_XX = 10, x̄ = 3, n = 5), finn et 95 % prediksjonsintervall for en NY Y når x₀ = 7. Sammenlign bredden med intervallet ved x₀ = 4."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "α̂ = 0.3, β̂ = 1.5, S_E ≈ 0.3162, S_XX = 10, x̄ = 3, n = 5" }
              - { text: "Nytt x₀ = 7 (4 enheter unna x̄), 1 − α = 0.95" }
          - label: "Predikert verdi"
            lines:
              - { text: "ŷ₀ = 0.3 + 1.5·7 = 10.8" }
              - { comment: "Merk: x₀ = 7 ligger utenfor observert x-spenn (1–5) → ekstrapolering, vær forsiktig." }
          - label: "Standardfeil for prediksjon"
            lines:
              - { text: "SE_pred = S_E · √(1 + 1/n + (x₀ − x̄)²/S_XX)" }
              - { indent: "= 0.3162 · √(1 + 0.2 + 16/10)" }
              - { indent: "= 0.3162 · √2.8 ≈ 0.5291" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.5", text: "t_(0.025, 3) = 3.182" } }
          - label: "Intervall"
            lines:
              - { text: "Margin = 3.182 · 0.5291 ≈ 1.684" }
              - { text: "PI: 10.8 ± 1.684 ≈ [9.12, 12.48]" }
          - label: "Tolkning"
            lines:
              - { text: "95 % PI: [9.12, 12.48], bredde ≈ 3.37 — sammenlignet med x₀ = 4 (bredde ≈ 2.29) er intervallet ca. 47 % bredere." }
              - { text: "Prediksjonsintervaller er smalest ved x̄ og vokser ut til sidene fordi `(x₀ − x̄)²/S_XX` øker raskt." }
        result: "95 % prediksjonsintervall ved x₀ = 7: [9.12, 12.48] – tydelig bredere pga. avstand fra x̄."

  - label: "Korrelasjon r"
    solutions:
      - source: "Eksamen mai25 · oppgave 5b"
        question: "Datatabellen gir `Σ(x-x̄)² = 15.6`, `Σ(y-ȳ)² = 734.1`, `Σ(x-x̄)(y-ȳ) = 103.4`. Beregn korrelasjonskoeffisient `r` og tolk resultatet."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi har `n` par av observasjoner og oppsummerte mellom-summer." }
              - { text: "Spørsmålet ber om Pearson-korrelasjonskoeffisient `r` — et mål på styrken av den lineære sammenhengen." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gitt direkte fra datatabellen:" }
              - { indent: "`S_XX = 15.6`, `S_YY = 734.1`, `S_XY = 103.4`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "`r = S_XY / √(S_XX · S_YY)`" }
              - { indent: "`= 103.4 / √(15.6 · 734.1)`" }
              - { indent: "`= 103.4 / √11451.96`" }
              - { indent: "`= 103.4 / 107.01 ≈ 0.966`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ 0.966` ligger svært nær 1 — sterk positiv lineær sammenheng mellom `x` og `y`." }
              - { text: "Forklart variasjon: `r² ≈ 0.933` — ca. 93 % av variasjonen i `y` forklares av lineær regresjon på `x`." }
        result: "`r ≈ 0.966` (sterk positiv lineær sammenheng, `r² ≈ 0.933`)"

      - source: "Praksis · perfekt nesten-rett-linje"
        question: "Gitt datasettet `(1,2), (2,3), (3,5), (4,6), (5,8)`. Beregn `r` og tolk."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 5` par. Vi skal kvantifisere styrken av sammenhengen." }
          - label: "Mellom-summer"
            lines:
              - { text: "`x̄ = 3`, `ȳ = 4.8`" }
              - { text: "`S_XX = 10`, `S_YY = 22.8`, `S_XY = 15`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "`r = 15 / √(10 · 22.8) = 15 / √228 = 15 / 15.0997 ≈ 0.987`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ 0.987` — meget sterk positiv lineær sammenheng." }
              - { text: "`r² ≈ 0.975` — ca. 97.5 % av variasjonen i `y` forklares av regresjonen på `x`." }
        result: "`r ≈ 0.987` (`r² ≈ 0.975`)"

      - source: "Praksis · negativ korrelasjon"
        question: "Datasett `(1,5), (2,4), (3,5), (4,3), (5,3)`. Beregn `r` og tolk hva en negativ verdi betyr."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 5` par." }
          - label: "Mellom-summer"
            lines:
              - { text: "`x̄ = 3`, `ȳ = 4`" }
              - { text: "`S_XX = 10`, `S_XY = (-2)(1) + (-1)(0) + 0·1 + 1·(-1) + 2·(-1) = -5`, `S_YY = 4`" }
          - label: "Korrelasjonskoeffisient"
            lines:
              - { text: "`r = -5 / √(10 · 4) = -5 / √40 = -5 / 6.3246 ≈ -0.791`" }
          - label: "Tolkning"
            lines:
              - { text: "`r ≈ -0.791` — moderat til sterk NEGATIV lineær sammenheng: når `x` øker, har `y` en tendens til å avta." }
              - { text: "`r² ≈ 0.625` — ca. 62.5 % forklart, resten er uforklart støy." }
              - { text: "MERK: `r` måler bare lineær sammenheng. Ved et ikke-lineært mønster kan `r` være liten selv om punktene følger en tydelig kurve." }
        result: "`r ≈ -0.791` (`r² ≈ 0.625`, negativ retning)"

