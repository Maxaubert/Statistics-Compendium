id: sigma-sum
sym: "Σ"
short_def: "Summetegn – 'sum av alle ledd som følger'. Stor gresk sigma – IKKE standardavviket σ."
contexts:
  - usage: "Sumoperator"
    detail: |
      Σ betyr 'legg sammen alle leddene'. Det er bare en kompakt
      måte å skrive en lang sum på.

      Σᵢ₌₁ⁿ xᵢ = x₁ + x₂ + x₃ + ... + xₙ

      Du leser det som: 'sum, fra i = 1 til n, av xᵢ'.

      Eksempel: hvis x₁ = 2, x₂ = 4, x₃ = 6, så er
      Σᵢ₌₁³ xᵢ = 2 + 4 + 6 = 12.

      Σ dukker opp overalt: gjennomsnitt (Σxᵢ / n), varians
      (Σ(xᵢ − x̄)² / (n − 1)), kjikvadrat (Σ(O − E)²/E), og
      forventningsverdi for diskrete fordelinger (Σ x · P(X = x)).

      VIKTIG: stor Σ (summetegn) vs liten σ (standardavvik). Samme
      bokstav, helt annen rolle. Stor Σ etterfølges typisk av et
      uttrykk å summere; liten σ står alene som et tall.
    entry_refs:
      - forventningsverdi-diskret
      - varians-standardavvik-diskret
      - kjikvadrat-goodness-of-fit
      - regresjon-estimat-alpha-beta
