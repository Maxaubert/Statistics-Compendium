long_def: |
  En matematisk modell for hendelser som inntreffer tilfeldig spredt
  utover tid (eller område), der det gjennomsnittlige antallet hendelser
  per tidsenhet er konstant, og der én hendelse ikke påvirker når neste
  kommer.

  **Konkret eksempel.** En kasse på Coop får i snitt `2` kunder per
  minutt. Det betyr ikke at kundene kommer som klokkeslett 0:30, 1:00,
  1:30 og så videre. De spres tilfeldig: noen ganger 3 kunder på 30
  sekunder, andre ganger ingen kunder på 2 minutter. Snittet er likevel
  2 per minutt over tid. Dette er en poissonprosess med rate
  `λ = 2` per minutt.


  ## Størrelsene

  - `λ` (lambda) = raten, antall hendelser i snitt per tidsenhet (f.eks. `2` per minutt)
  - `t` = lengden på vinduet, i samme tidsenhet som `λ`
  - `λ · t` = forventet antall hendelser (Coop: `λ = 2`, `t = 5` → snitt `10` kunder)


  ## Tre konsekvenser av modellen

  Disse tre er hva du bruker prosessen til på eksamen.


  ### 1. Antall hendelser er Poissonfordelt

  > [!read] X ~ Poisson(λt)
  > X følger en Poisson-fordeling med parameter `λt`.

  `X` er antall hendelser i et vindu av lengde `t`. Brukes til *hvor
  mange*-spørsmål: `P(X = 5)`, `P(X ≥ 3)`.


  ### 2. Ventetiden er eksponentialfordelt

  > [!read] T ~ Eksponential(λ)
  > T følger en eksponentialfordeling med rate `λ`.

  `T` er hvor lenge du venter før neste hendelse. Brukes til *når*-spørsmål:
  `P(T > 3 minutter)` er sannsynligheten for at ingen kunde dukker opp på
  3 minutter.

  > [!tip] Poisson teller hendelser, eksponential måler ventetid. Begge kommer fra samme prosess.


  ### 3. Disjunkte vinduer er uavhengige

  «Disjunkte vinduer» betyr tidsvinduer som ikke overlapper. Hva som
  skjedde i ett vindu, sier ingenting om hva som skjer i et annet
  vindu.

  Eksempel: hvis du observerte 4 kunder mellom kl. 12:00 og 12:05, er
  forventet antall kunder mellom kl. 12:05 og 12:10 fortsatt `λ · t`,
  uavhengig av de 4 du så. Prosessen er *minneløs*.


  ## Typiske eksempler

  Vulkanutbrudd i et område, sommerfugler som flyr inn i en felle,
  kunder til en kasse, radioaktiv nedbrytning, lyn-nedslag, trykkfeil
  per bokside, telefonsamtaler til et sentralbord.
