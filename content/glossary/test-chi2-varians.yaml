id: test-chi2-varians
term_no: "Kjikvadrat-test for varians eller standardavvik (én utvalg)"
short_def: "Tester `H₀: σ² = σ₀²` (ekvivalent `σ = σ₀`) på ett utvalg. Bruker χ²-fordelingen og tabell E.6. Spørsmålet handler om spredning, ikke om gjennomsnitt."
aliases:
