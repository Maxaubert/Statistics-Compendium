id: ki-mu-kjent-sigma
name_no: "Konfidensintervall for μ (kjent σ)"
type: identity
category: confidence_interval
tagline: "`(1−α)·100 %` KI for forventningsverdien når populasjonens `σ` er kjent."

formula_main: "x̄ ± z_(α/2) · σ/√n"
formula_latex: "\\overline{x} \\pm z_{\\alpha/2} \\cdot \\frac{\\sigma}{\\sqrt{n}}"

what_it_does: |
  Gir et intervall som med `(1−α)·100 %` sikkerhet inneholder den ukjente
  forventningsverdien `μ`, basert på et utvalgsgjennomsnitt `x̄` og kjent `σ`.

why_use: |
  Brukes når vi vil estimere `μ` med usikkerhetsangivelse, og vi har en
  trygg verdi for `σ` (oppgitt eller historisk). Forutsetter normalfordelte
  observasjoner eller stort utvalg (`n ≥ 30`).

recognition_cues:
  - "Spørsmålet ber om et konfidensintervall for `μ` (eller en gjennomsnittlig verdi)"
  - "Standardavviket `σ` er gitt eksplisitt"
  - "Konfidensnivå er gitt (90 %, 95 %, 99 %, osv.)"

when_NOT_to_use:
  - "`σ` er ukjent → bruk [t-basert KI for μ](/entry/ki-mu-ukjent-sigma) i stedet"
  - "Du estimerer en andel → bruk [KI for andel](/entry/ki-andel-binomial)"
  - "Du estimerer en rate i en poissonprosess → bruk [KI for poissonrate](/entry/ki-poissonrate)"

symbols:
  - { sym: "x̄",       means: "utvalgsgjennomsnittet" }
  - { sym: "σ",        means: "kjent populasjonsstandardavvik" }
  - { sym: "n",        means: "antall observasjoner" }
  - { sym: "α",        means: "signifikansnivået; `1 − α` er konfidensnivået" }
  - { sym: "z_(α/2)",  means: "kvantil i standardnormal slik at `P(Z > z_(α/2)) = α/2`" }

filters:
  computes: [confidence_interval, parameter_estimate, find_n_for_threshold]
  random_variable: [mean_of_samples, continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, mean_and_sd_given, summary_stats_given, data_as_list, total_observations_n]
  parameters_known: [population_variance_known, sample_size_large, confidence_level, sample_size_small_lt30]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]
solution_template:
  - "Identifiser konfidensnivå `(1 − α)` og finn `α` (f.eks. 90 % gir `α = 0.10`)"
  - "Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). F.eks. `α/2 = 0.05` gir `1.645`"
  - text: "Beregn marginen:"
    formula: "margin = z_(α/2) · σ/√n"
  - text: "Sett opp intervallet:"
    formula: "x̄ ± margin"
  - text: "Eksempel: kaffeautomat `n = 100`, `x̄ = 25.05` cl, `σ = 0.48`, 90 % KI (`z_(0.05) = 1.645`):"
    formula: "25.05 ± 1.645·0.48/√100 ≈ 25.05 ± 0.079 = [24.97, 25.13]"
    example: true

common_traps: |
  Bruk `z_(α/2)`, ikke `z_α` (vi vil ha `α/2` i hver hale i et tosidig intervall).
  Konfidensnivå 90 % betyr `α = 0.10`, så `z_(α/2) = z_0.05 = 1.645`.

python_snippet: |
  from scipy.stats import norm
  import math

  x_bar, sigma, n, alpha = 25, 0.48, 100, 0.05
  z = norm.ppf(1 - alpha/2)
  margin = z * sigma / math.sqrt(n)
  ci = (x_bar - margin, x_bar + margin)

detailed_solution_variants:
  - label: "KI for μ (kjent σ)"
    solutions:
      - source: "Praksis · julelys-måling"
        question: "Et utvalg på `n = 40` julelys ga gjennomsnittlig effekt `x̄ = 48` watt. Populasjonens standardavvik er `σ = 5` watt (kjent). Finn et 95 % konfidensintervall for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 40`, `x̄ = 48`, `σ = 5` (kjent), konfidensnivå `(1 − α) = 0.95`." }
              - { text: "Siden `σ` er kjent og `n ≥ 30`, kan vi bruke `z`-basert KI." }
          - label: "Kvantil"
            lines:
              - { text: "`α = 1 − 0.95 = 0.05`, så `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.025) = 1.960`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = z_(α/2) · σ/√n`" }
              - { indent: "`= 1.960 · 5/√40`" }
              - { indent: "`= 1.960 · 0.7906`" }
              - { indent: "`≈ 1.55`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = x̄ ± margin = 48 ± 1.55`" }
              - { indent: "`= [46.45, 49.55]`" }
        result: "`95 % KI for μ: [46.45, 49.55] watt`"

      - source: "Praksis · kaffemengde"
        question: "Kaffeautomaten gir mengder med kjent `σ = 0.48` cl. Et utvalg av `n = 100` trykk ga `x̄ = 25.05` cl. Finn et 90 % KI for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 100`, `x̄ = 25.05`, `σ = 0.48`, konfidensnivå 90 %." }
          - label: "Kvantil"
            lines:
              - { text: "`α = 0.10`, så `α/2 = 0.05`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.05) = 1.645`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = 1.645 · 0.48/√100 = 1.645 · 0.048 = 0.0790`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = 25.05 ± 0.0790 = [24.97, 25.13]`" }
        result: "`90 % KI for μ: [24.97, 25.13] cl`"

