id: fast-n-binomial
name_no: "Fast n forsøk, p gitt — antall suksesser"
cue: "Oppgaven sier eksplisitt eller implisitt at det utføres et fast antall n uavhengige forsøk, hver med samme suksessannsynlighet p, og spør etter antall suksesser. Trekning skjer med tilbakelegging, eller fra en populasjon der p kan regnes som konstant."
procedure:
  - "Identifiser antall forsøk n (et tall som er kjent på forhånd)"
  - "Identifiser suksessannsynligheten p og hva som teller som 'suksess'"
  - "Sjekk at forsøkene er uavhengige og at p er konstant"
  - "Avgjør hva spørsmålet ber om: P(X = k), P(X ≤ k), P(X ≥ k)"
  - "For 'minst k': bruk komplement P(X ≥ k) = 1 − P(X ≤ k−1)"
  - "Slå opp P(X ≤ k) i tabell E.1 (kumulativ binomial), eller regn direkte med P(X = k) = C(n, k)·p^k·(1−p)^(n−k)"
entry_refs:
  - binomial-fordeling
example: "Av n = 12 grantrær er andelen syke p = 0.3. Finn P(minst 4 syke). P(X ≥ 4) = 1 − P(X ≤ 3) ≈ 1 − 0.493 = 0.507."
