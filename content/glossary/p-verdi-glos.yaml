id: p-verdi-glos
term_no: P-verdi
short_def: "Sannsynligheten for å se data minst like ekstreme som dine, gitt at `H₀` er sann."
filters:
  computes: [hypothesis_test]
  parameters_known: [alpha_significance, population_variance_unknown, population_variance_known]
  distribution_assumption: [t_distribution, normal]
  tooling: [t_quantile_table_E5, standard_normal_table_E3]
long_def: |
  P-verdien måler hvor godt dataene passer med `H₀`. Liten `p`-verdi
  betyr at dataene er rare hvis `H₀` stemmer — altså bevis mot `H₀`.

  **Beslutningsregel:** forkast `H₀` hvis `p < α`.

  **Venstresidig z-test:**

      p = P(Z ≤ z_obs | H₀) = G(z_obs)

  **Høyresidig z-test:**

      p = 1 − G(z_obs)

  **Tosidig z-test:**

      p = 2·(1 − G(|z_obs|))

  P-verdien er **IKKE** sannsynligheten for at `H₀` er sann.
