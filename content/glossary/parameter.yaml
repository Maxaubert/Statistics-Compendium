id: parameter
term_no: Parameter
short_def: "En ukjent populasjonsstørrelse (μ, σ², p, λ) som du vil estimere fra data."
long_def: |
  Parametere beskriver populasjonen og er konstante (ikke tilfeldige).
  Vanlige parametere:

  - `μ` — forventning
  - `σ²` — varians
  - `p` — andel
  - `λ` — rate
  - `α`, `β` — regresjonskoeffisienter

  Du kan ikke se parameteren direkte — du estimerer den. En statistikk
  beregnet fra utvalget er en estimator for parameteren.
