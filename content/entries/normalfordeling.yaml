id: normalfordeling
name_no: Normalfordeling
type: distribution
category: continuous_distribution
tagline: "Klokkeformet kontinuerlig fordeling – den vanligste antakelsen i statistikk."

formula_main: "X ~ N(μ, σ);  Z = (X - μ) / σ ~ N(0, 1);  P(X ≤ x) = G((x - μ) / σ)"
formula_latex: "X \\sim N(\\mu, \\sigma), \\quad Z = \\frac{X - \\mu}{\\sigma} \\sim N(0, 1)"

what_it_does: |
  Den klassiske "klokkeformede" fordelingen. Beskriver en kontinuerlig
  variabel X (en målbar verdi som kan være hva som helst innenfor et
  intervall – vekt, høyde, kaffemengde, testresultater) som er symmetrisk
  rundt midtverdien μ, med spredning angitt av σ.

  Sannsynligheter under normalfordelingen regnes ikke direkte ut, men slås
  opp i en tabell (E.3 – Z-tabell) etter at variabelen er "standardisert"
  med transformasjonen Z = (X - μ)/σ. Z-verdien forteller hvor mange
  standardavvik over eller under gjennomsnittet observasjonen ligger.

why_use: |
  Mange naturlige fenomener er tilnærmet normalfordelte (vekt, høyde,
  målefeil, gjennomsnittsresultater). Sentralgrenseteoremet sier at
  gjennomsnittet av mange uavhengige variabler er tilnærmet normalfordelt
  uansett underliggende fordeling, så normalfordelingen brukes også indirekte
  i z-tester, t-tester og konfidensintervaller.

recognition_cues:
  - "Oppgaven sier eksplisitt 'normalfordelt med forventningsverdi μ og standardavvik σ'"
  - "Oppgaven oppgir både en gjennomsnittsverdi μ og en spredning σ for en kontinuerlig størrelse"
  - "Spørsmålet er på formen P(X < x), P(X > x) eller P(a < X < b) for kontinuerlig X"
  - "Stort antall observasjoner (n ≥ 30) der man ser på gjennomsnittet – sentralgrenseteoremet gir tilnærmet normalfordeling"
  - "Spørsmålet ber om 'sannsynligheten for at en tilfeldig valgt X overstiger / underskrider en verdi'"
  - "Skjult variant: 'finn x slik at P(X < x) = p' (invers normal – bruk z-kvantiltabellen E.4)"

when_NOT_to_use:
  - "Variabelen er diskret (heltall) → bruk binomial, Poisson, eller hypergeometrisk"
  - "Datamaterialet ser klart skjevt ut (qq-plott avviker) → vurder bootstrap"
  - "Variabelen er bare positiv tid mellom hendelser → bruk eksponentialfordeling"

symbols:
  - { sym: "μ",     means: "forventningsverdien (sentrum av klokken)" }
  - { sym: "σ",     means: "standardavviket (spredning)" }
  - { sym: "σ²",    means: "variansen" }
  - { sym: "Z",     means: "standardnormalisert variabel, Z = (X − μ)/σ" }
  - { sym: "G(z)",  means: "kumulativ standardnormalfordeling, P(Z ≤ z)" }
  - { sym: "z_α",   means: "α-kvantilet, slik at P(Z > z_α) = α" }

properties:
  expected_value: "E[X] = μ"
  variance: "Var[X] = σ²"
  std_dev: "σ"

filters:
  computes: [exact_probability, range_probability, find_mu_for_threshold]
  random_variable: [continuous]
  setup: [single_population]
  structural_cues: [normal_assumed, mean_and_sd_given]
  parameters_known: [population_variance_known, mean_known]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]

solution_variants:
  - label: "P(X < x)"
    steps:
      - "Noter `μ`, `σ` og terskelen `x` fra oppgaven (f.eks. `μ = 25`, `σ = 0.48`, `x = 24`)."
      - "Bekreft at `X ~ N(μ, σ)` — enten direkte oppgitt, eller via sentralgrenseteoremet når `n ≥ 30`."
      - "Standardiser med `z = (x − μ)/σ` og rund til 2 desimaler (f.eks. `(24 − 25)/0.48 = −2.0833 ≈ −2.08`)."
      - "Slå opp `G(z)` i tabell E.3 — arealet til VENSTRE for `z` (f.eks. `G(−2.08) ≈ 0.0188`)."
      - "Svaret er `P(X < x) = G(z)`."
      - { text: "Hvis tabellen din kun viser positive `z`, bruk symmetri: `G(−z) = 1 − G(z)`. (Vår E.3 dekker både fortegn, så dette er sjelden nødvendig.)", conditional: true }

  - label: "P(X > x)"
    steps:
      - "Noter `μ`, `σ` og terskelen `x` (f.eks. `μ = 302`, `σ = 5`, `x = 310`)."
      - "Standardiser: `z = (x − μ)/σ` (f.eks. `(310 − 302)/5 = 1.6`)."
      - "Slå opp `G(z)` i E.3 (f.eks. `G(1.6) ≈ 0.9452`)."
      - "Bruk komplementet siden E.3 gir venstrearealet: `P(X > x) = 1 − G(z)` (f.eks. `1 − 0.9452 = 0.0548`)."
      - "Fortegnssjekk: `x > μ ⇒ z > 0` (svar `< 0.5`); `x < μ ⇒ z < 0` (svar `> 0.5`)."

  - label: "P(a < X < b)"
    steps:
      - "Noter `μ`, `σ` og grensene `a < b` (f.eks. `μ = 302`, `σ = 5`, `a = 305`, `b = 310`)."
      - "Standardiser begge: `z_a = (a − μ)/σ`, `z_b = (b − μ)/σ` (f.eks. `z_a = 0.6`, `z_b = 1.6`)."
      - "Slå opp `G(z_a)` og `G(z_b)` i E.3 (f.eks. `G(0.6) ≈ 0.7257`, `G(1.6) ≈ 0.9452`)."
      - "Trekk fra: `P(a < X < b) = G(z_b) − G(z_a)` (f.eks. `0.9452 − 0.7257 = 0.2195`)."
      - "Sanity-sjekk: svaret skal ligge i `[0, 1]`. Negativt resultat betyr at du har byttet om `z_a` og `z_b`."

  - label: "Invers: finn x"
    steps:
      - "Les hva som er gitt: en sannsynlighet og hvilken side. Enten `P(X < x) = p`, eller `P(X > x) = α` (da er `p = 1 − α`)."
      - "Slå opp `z` slik at `G(z) = p` i tabell E.4 (Z-kvantil). Eksempel: `p = 0.975 ⇒ z = 1.96`."
      - { text: "Hvis `p < 0.5`: `z` er negativ. Bruk refleksjon `z = −z_{1−p}` (f.eks. `p = 0.001 ⇒ z = −z_{0.999} = −3.090`).", conditional: true }
      - "Sett inn i `x = μ + σ · z` (f.eks. `μ = 300`, `σ = 5`, `z = −3.090 ⇒ x = 300 − 15.45 = 284.55`)."
      - "Sanity-sjekk: `p < 0.5 ⇒ x < μ`; `p > 0.5 ⇒ x > μ`. Stemmer det ikke, har du glemt fortegnet på `z`."

  - label: "Invers: finn μ (eller σ)"
    steps:
      - "Identifiser det ukjente (`μ` eller `σ`) og hva som er gitt: typisk en grense `g` og en målsannsynlighet `p` (f.eks. `P(X < 300) = 0.001`, `σ = 5`)."
      - "Sett opp likningen `G((g − μ)/σ) = p`."
      - "Slå opp `z = G⁻¹(p)` i tabell E.4. Husk at `p < 0.5` gir negativ `z` (f.eks. `p = 0.001 ⇒ z = −3.090`)."
      - "Løs for det ukjente: `μ = g − σ · z`, eller `σ = (g − μ)/z` hvis `σ` er ukjent (f.eks. `μ = 300 − 5·(−3.090) = 315.45`)."
      - { text: "Retningssjekk for `μ`: hvis du vil at `P(X < g)` skal bli MINDRE, må `μ` flyttes OPP (lenger fra `g` på høyre side).", conditional: true }
      - { text: "Motsatt retning: hvis du vil at `P(X > g)` skal bli mindre, må `μ` flyttes NED (lenger fra `g` på venstre side).", conditional: true }

# Fallback for konsumenter som forventer flat liste — peker videre til faner over.
solution_template:
  - "Noter `μ`, `σ` og hva oppgaven spør om."
  - "Identifiser variant — se faner over: `P(X < x)`, `P(X > x)`, `P(a < X < b)`, eller invers."
  - "Standardiser med `Z = (X − μ)/σ`, slå opp i E.3 (kumulativ) eller E.4 (kvantil)."

common_traps: |
  - **Forveksle ikke σ (standardavvik) med σ² (varians).** Hvis oppgaven sier "varians 25", er σ = 5, ikke 25.
  - **G(z) gir arealet til VENSTRE.** For "større enn z", bruk 1 − G(z).
  - **Symmetri**: G(−z) = 1 − G(z). Brukes for negative z hvis tabellen kun viser positive (vår tabell viser begge).
  - **Standardisering må gjøres riktig**: Z = (X − μ)/σ, ikke (μ − X)/σ. Sjekk fortegnet.
  - **Avrunding av z**: rund til 2 desimaler for å passe tabellen (z = -2.08, ikke -2.0833).
  - **Invers-oppgaver**: hvis P(X < 300) er liten (< 0.5) og verdien står til venstre for μ, må z være negativ. Ikke bare bruk z fra tabellen direkte; reflekter fortegnet.

python_snippet: |
  from scipy.stats import norm

  mu, sigma = 25, 0.48

  # P(X ≤ x)
  norm.cdf(24, loc=mu, scale=sigma)         # 0.0188

  # P(a < X ≤ b)
  norm.cdf(310, loc=302, scale=5) - norm.cdf(305, loc=302, scale=5)  # 0.2195

  # Invers: finn x slik at P(X ≤ x) = p
  norm.ppf(0.001, loc=300, scale=5)         # finne x for P(X<x)=0.001

example_variants:
  - label: "P(X < x)"
    examples:
      - source: "Eksamen jan25 · oppgave 5a"
        excerpt: "Mengden kaffe er normalfordelt med μ = 25 cl, σ = 0.48 cl. Sannsynlighet for at en kopp har mindre enn 24 cl?"
        solution_sketch: "P(X < 24) = G((24-25)/0.48) = G(-2.08) = 0.0188"
      - source: "Praksis · positiv z"
        excerpt: "Voksenhøyde X i en populasjon: X ~ N(170, 6²) cm. Sannsynlighet for at en tilfeldig person er under 175 cm?"
        solution_sketch: "P(X < 175) = G((175-170)/6) = G(0.83) = 0.7967"
      - source: "Praksis · IQ"
        excerpt: "IQ er N(100, 15²). Sannsynlighet for at en person har IQ under 90?"
        solution_sketch: "P(X < 90) = G((90-100)/15) = G(-0.67) = 1 − G(0.67) = 1 − 0.7486 = 0.2514"

  - label: "P(X > x)"
    examples:
      - source: "Praksis · IQ-grense"
        excerpt: "IQ er N(100, 15²). Sannsynlighet for at en person har IQ over 130 ('begavet')?"
        solution_sketch: "P(X > 130) = 1 − G((130-100)/15) = 1 − G(2.00) = 1 − 0.9772 = 0.0228"
      - source: "Praksis · høyde"
        excerpt: "Voksenhøyde X ~ N(170, 6²). Sannsynlighet for at en tilfeldig person er over 180 cm?"
        solution_sketch: "P(X > 180) = 1 − G((180-170)/6) = 1 − G(1.67) = 1 − 0.9525 = 0.0475"
      - source: "Praksis · standardnormal"
        excerpt: "Z ~ N(0, 1). Hva er P(Z > 1.96)?"
        solution_sketch: "P(Z > 1.96) = 1 − G(1.96) = 1 − 0.9750 = 0.0250  (klassisk tosidig 5 %-grense)"

  - label: "P(a < X < b)"
    examples:
      - source: "Eksamen mai25 · oppgave 4a"
        excerpt: "Fyllingen av såpebeholdere er N(302, 5). Sannsynlighet for innhold mellom 305 og 310 ml?"
        solution_sketch: "P(305 < X ≤ 310) = G(1.6) − G(0.6) = 0.9452 − 0.7257 = 0.2195"
      - source: "Praksis · ±1σ"
        excerpt: "X ~ N(μ, σ). Hva er P(μ − σ < X < μ + σ)?"
        solution_sketch: "= G(1) − G(-1) = 0.8413 − 0.1587 = 0.6826  (≈ 68 %, klokkekurvens midtre del)"
      - source: "Praksis · IQ-bånd"
        excerpt: "IQ er N(100, 15²). Sannsynlighet for at en tilfeldig person har IQ mellom 85 og 115?"
        solution_sketch: "= G((115-100)/15) − G((85-100)/15) = G(1) − G(-1) = 0.6826"

  - label: "Invers: finn x"
    examples:
      - source: "Praksis · 95-persentil"
        excerpt: "X ~ N(60, 5²). Finn x slik at P(X ≤ x) = 0.95."
        solution_sketch: "z₀.₉₅ = 1.645  (E.4)  →  x = 60 + 5·1.645 = 68.23"
      - source: "Praksis · IQ-toppen"
        excerpt: "IQ er N(100, 15²). Hvilken IQ overgår 99 % av befolkningen?"
        solution_sketch: "P(X ≤ x) = 0.99  →  z = 2.326  →  x = 100 + 15·2.326 ≈ 134.9"
      - source: "Praksis · venstre hale"
        excerpt: "X ~ N(170, 6²). Hvilken høyde er nedre 10 %-grense ('1 av 10 er under')?"
        solution_sketch: "P(X ≤ x) = 0.10  →  z = -1.282  →  x = 170 − 6·1.282 ≈ 162.3 cm"

  - label: "Invers: finn μ (eller σ)"
    examples:
      - source: "Eksamen mai25 · oppgave 4d"
        excerpt: "Hva må μ justeres til for at P(X < 300) < 0.001 når σ = 5?"
        solution_sketch: "(300 − μ)/5 = −z_0.001 = −3.090  →  μ = 300 + 15.45 = 315.45 ml"
      - source: "Praksis · finn σ"
        excerpt: "X ~ N(50, σ²) der μ er kjent. Hvor stor må σ være for at P(X < 40) = 0.05?"
        solution_sketch: "(40 − 50)/σ = −1.645  →  σ = 10/1.645 ≈ 6.08"
      - source: "Praksis · spec-grense"
        excerpt: "Fyllemaskin har σ = 5 ml. Hva må μ være for at minst 95 % av flaskene har ≥ 100 ml?"
        solution_sketch: "P(X ≥ 100) ≥ 0.95  →  P(X < 100) ≤ 0.05  →  (100 − μ)/5 ≤ −1.645  →  μ ≥ 108.23 ml"

detailed_solutions:
  - source: "Eksamen jan25 · oppgave 5a"
    question: "X er normalfordelt med μ = 25 cl og σ = 0.48 cl. Finn P(X < 24)."
    sections:
      - label: "Identifisering"
        lines:
          - { text: "X ~ N(25, 0.48)" }
      - label: "Standardisering"
        lines:
          - { text: "P(X < 24) = P(Z < (24 - 25)/0.48)" }
          - { indent: "= P(Z < -2.0833)" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.3", text: "G(-2.08) ≈ 0.0188" } }
    result: "P(X < 24) ≈ 0.0188"

  - source: "Eksamen mai25 · oppgave 4a"
    question: "X er normalfordelt med μ = 302 ml og σ = 5 ml. Finn P(305 < X ≤ 310)."
    sections:
      - label: "Standardisering"
        lines:
          - { text: "P(305 < X ≤ 310) = G((310-302)/5) - G((305-302)/5)" }
          - { indent: "= G(1.6) - G(0.6)" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.3", text: "G(1.6) ≈ 0.9452" } }
          - { table_lookup: { ref: "E.3", text: "G(0.6) ≈ 0.7257" } }
          - { text: "= 0.9452 - 0.7257" }
    result: "P(305 < X ≤ 310) ≈ 0.2195"

  - source: "Eksamen mai25 · oppgave 4d"
    question: "Standardavviket er σ = 5 ml. Hva må forventningsverdien μ være for at P(X < 300) < 0.001?"
    sections:
      - label: "Identifisering"
        lines:
          - { text: "Vi vil ha P(X < 300) = 0.001 (grenseverdien)" }
          - { text: "G((300 - μ)/5) = 0.001" }
      - label: "Tabelloppslag"
        lines:
          - { table_lookup: { ref: "E.4", text: "z_0.001 = 3.090, så det venstresidige kvantilet er -z_0.001 = -3.090" } }
      - label: "Innsatt"
        lines:
          - { text: "(300 - μ)/5 = -3.090" }
          - { text: "300 - μ = -15.45" }
          - { text: "μ = 315.45" }
    result: "μ må justeres opp til minst 315.45 ml"

