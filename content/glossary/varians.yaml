id: varians
term_no: Varians (Var, σ²)
short_def: "Mål på spredning: forventet kvadrert avvik fra gjennomsnittet."
filters:
  computes: [std_dev, covariance, parameter_estimate, expected_value, variance]
  parameters_known: [population_variance_known, population_variance_unknown]
  random_variable: [discrete_count]
  structural_cues: [data_as_list, independent_events]
long_def: |
  **Definisjon:**

      Var(X) = E[(X − μ)²] = E[X²] − μ²

  **Utvalgsvarians (rådata):**

      s² = Σ(xᵢ − x̄)² / (n − 1)

  **Lineær transformasjon:**

      Var(aX + b) = a²·Var(X)

  **Sum av to variabler:**

      Var(X + Y) = Var(X) + Var(Y) + 2·Cov(X, Y)

  Hvis `X` og `Y` er uavhengige er `Cov = 0`, så variansene legges sammen.
