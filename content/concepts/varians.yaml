id: varians
name_no: "Varians (oversikt over de ulike formene)"
type: concept
tagline: "Mål for spredning. Samme idé i alle former, men formelen ser ulik ut etter hva slags data du har."

what_it_means: |
  Varians måler hvor mye en variabel typisk avviker kvadratisk fra
  gjennomsnittet. Standardavviket er kvadratroten av variansen og har
  samme enhet som dataene.

  Den grunnleggende ideen er alltid den samme:

      varians = «vektet sum av kvadrerte avvik fra gjennomsnittet»

  Vekten og delingsleddet endrer seg etter hva du har og hva du estimerer:
  en sannsynlighetsfordeling, et utvalg, et residual, en kjent fordelingsfamilie.
  Under er de tre store gruppene: utregning fra data, lesing fra en kjent fordeling,
  og spredning til et estimat.

  ---

  ## A. Utregning fra dine data

  **A1. Diskret SV med PMF — `Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)`**

  Bruk når du har en tabell med verdier `xᵢ` og sannsynligheter `P(X = xᵢ)`.
  Multiplisér hvert kvadrert avvik med sin sannsynlighet og summér.
  Snarvei for uniform fordeling: `Var(X) = E[X²] − μ²`.

  Entry: [Varians og standardavvik (diskret SV)](/entry/varians-standardavvik-diskret).
  Brukes i: [Forventningsverdi for diskret SV](/entry/forventningsverdi-diskret),
  [Kovarians](/entry/kovarians), [Korrelasjon](/entry/korrelasjon-joint).

  **A2. Utvalgsvarians fra rådata — `s² = Σ (xᵢ − x̄)² / (n − 1)`**

  Bruk når du har en liste med `n` observasjoner og ingen kjent fordeling —
  den vanligste formen i praksis. `n − 1` (Bessels korreksjon) gjør `s²`
  forventningsrett for `σ²`. Standardavviket er `s = √s²`.

  Entry: [Utvalgsvarians fra rådata](/entry/utvalgsvarians-radata).
  Brukes i: [Én-utvalg t-test](/entry/en-utvalg-t-test),
  [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma),
  [KI for σ²](/entry/ki-varians).

  **A3. Pooled (interpolert) varians — `S_P² = ((n_X−1)·s_X² + (n_Y−1)·s_Y²) / (n_X+n_Y−2)`**

  Bruk når du sammenligner to grupper med antatt felles `σ²` i to-utvalgs t-test.
  Vektet snitt der vekten er antall frihetsgrader.

  Konsept: [Interpolert (pooled) varians](/concept/interpolert-varians).
  Brukes i: [To-utvalgs t-test (pooled)](/entry/to-utvalgs-t-test).

  **A4. Residualvarians i regresjon — `S_E² = Σ(yᵢ − ŷᵢ)² / (n − 2)`**

  Måler hvor langt observasjonene ligger unna regresjonslinjen i snitt.
  `n − 2` fordi vi har estimert både `α̂` og `β̂` fra samme data.

  Entry: [Residualenes varians S_E²](/entry/regresjon-residualvarians).
  Brukes i: [SE(β̂)](/entry/regresjon-standardfeil-stigningstall),
  [Hypotesetest for β](/entry/regresjon-test-stigningstall),
  [Prediksjonsintervall](/entry/regresjon-prediksjonsintervall).

  ---

  ## B. Avlest fra en kjent fordeling

  Når du har en navngitt fordeling, slipper du å regne — variansen er en
  egenskap ved fordelingen. Sjekk «Egenskaper»-kortene på hver fordelings-side.

  - **Binomial:** `Var(X) = np(1 − p)` — se [Binomialfordeling](/entry/binomial-fordeling); detalj-popup: binomialvarians.
  - **Poisson:** `Var(X) = λ` (eller `λt` for et vindu) — se [Poissonfordeling](/entry/poisson-fordeling); detalj-popup: poissonvarians.
  - **Eksponential:** `Var(T) = 1/λ²` — se [Eksponentialfordeling](/entry/eksponential-fordeling); detalj-popup: eksponentialvarians.
  - **Hypergeometrisk:** `Var(X) = n·(K/N)·((N−K)/N)·((N−n)/(N−1))` — se [Hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling).
  - **Normal:** `Var(X) = σ²` — se [Normalfordeling](/entry/normalfordeling).

  Spesielt for Poisson: forventningsverdien er lik variansen (`E[X] = Var(X) = λ`).
  Det gjør den kjennelig — hvis empirisk gjennomsnitt og varians er nær like,
  passer Poisson godt.

  ---

  ## C. Spredning til et estimat

  Disse er IKKE «varians til en variabel» i vanlig forstand, men spredningen
  i et tall vi har regnet ut fra et utvalg. De er fundamentet for KI-er
  og standardfeilene som står i nevneren av nesten alle testobservatorer.

  **C1. Variansen til utvalgsgjennomsnittet — `Var(X̄) = σ²/n`**

  Standardfeilen er `SE(X̄) = σ/√n` (eller `s/√n` hvis `σ` er ukjent).
  Stort `n` → liten `Var(X̄)` → smalt KI, presis test.

  Detalj-popup: variansen til utvalgsgjennomsnittet.
  Innebygget i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  **C2. Variansen til stigningstallet — `Var(β̂) = S_E² / S_XX`**

  Standardfeilen er `SE(β̂) = √(Var(β̂))`. Stor `S_XX` (mye spredning i x)
  → liten `SE(β̂)` → presis estimering. Liten `S_XX` → høy usikkerhet.

  Entry: [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).

  ---

  ## Sammenheng

  Alle disse er forskjellige måter å regne det samme grunnbegrepet —
  en gjennomsnittlig kvadrert avvik. Hvis du forstår hvorfor `s² =
  Σ(xᵢ − x̄)² / (n − 1)` er riktig form for rådata, har du forstått
  rytmen i alle de andre. Sjekk også [Standardavvik (oversikt)](/concept/standardavvik)
  for parallellen til σ.

