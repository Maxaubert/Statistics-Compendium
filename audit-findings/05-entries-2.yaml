chunk: entries-part-2
items:
  - id: marginalfordeling
    type: entry
    contexts:
      - scenario: "Simultantabell gitt for (X, Y); finn marginalfordelingen til X (radsummene)."
        student_filters:
          setup: [joint_table_given]
          random_variable: [discrete_count]
          computes: [marginal_probability]
          structural_cues: [joint_table_present]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Trenger marginalsannsynlighet P(X=x) som mellomberegning for å regne ut E[X] etterpå."
        student_filters:
          setup: [joint_table_given]
          random_variable: [discrete_count]
          computes: [marginal_probability, exact_probability]
          structural_cues: [joint_table_present]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Vil sjekke om X og Y er uavhengige; trenger først marginalfordelingene fra simultantabellen."
        student_filters:
          setup: [joint_table_given]
          random_variable: [discrete_count]
          computes: [marginal_probability, test_independence]
          structural_cues: [joint_table_present]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: false
        missing_tags:
          - dimension: computes
            missing: [test_independence]
            note: "Marginalfordelingen er typisk forløper for uavhengighetstest; legge til test_independence er rimelig."

  - id: normalfordeling
    type: entry
    contexts:
      - scenario: "X ~ N(μ, σ) gitt eksplisitt; finn P(X < x)."
        student_filters:
          setup: [single_population]
          random_variable: [continuous]
          computes: [exact_probability]
          structural_cues: [normal_assumed, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Invers: finn x slik at P(X < x) = 0.95 (95-persentilet)."
        student_filters:
          setup: [single_population]
          random_variable: [continuous]
          computes: [find_x_for_threshold]
          structural_cues: [normal_assumed, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [normal_quantile_table_E4]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Finn P(a < X < b), klassisk intervall-spørsmål."
        student_filters:
          setup: [single_population]
          random_variable: [continuous]
          computes: [range_probability]
          structural_cues: [normal_assumed, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3]
        currently_surfaces: true
        missing_tags: []
      - scenario: "P(X > x) – \"høyere enn\" med kompliment, klassisk høyrehale-spørsmål."
        student_filters:
          setup: [single_population]
          random_variable: [continuous]
          computes: [exact_probability]
          structural_cues: [normal_assumed, mean_and_sd_given, complement_pattern]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3]
        currently_surfaces: true
        missing_tags: []

  - id: poisson-fordeling
    type: entry
    contexts:
      - scenario: "Poissonprosess med rate λ; finn P(X = k) for et tidsvindu."
        student_filters:
          setup: [events_in_window]
          random_variable: [discrete_count]
          computes: [exact_probability]
          structural_cues: [rate_given, poisson_process_mentioned, counting_events]
          parameters_known: [rate_lambda]
          distribution_assumption: [poisson]
          tooling: [calculator_exp, calculator_factorial]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Finn P(X ≥ k) i poissonvindu — bruk komplement og tabell E.2."
        student_filters:
          setup: [events_in_window]
          random_variable: [discrete_count]
          computes: [at_least_k]
          structural_cues: [rate_given, poisson_process_mentioned, complement_pattern, counting_events]
          parameters_known: [rate_lambda]
          distribution_assumption: [poisson]
          tooling: [cumulative_poisson_table_E2]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Forventet antall hendelser i et tidsvindu (E[X] = λt)."
        student_filters:
          setup: [events_in_window]
          random_variable: [discrete_count]
          computes: [expected_value]
          structural_cues: [rate_given, process_over_time, counting_events]
          parameters_known: [rate_lambda]
          distribution_assumption: [poisson]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Finn minste k slik at P(X ≥ k) < 0.05 — terskel-oppgave (kapasitetsplanlegging)."
        student_filters:
          setup: [events_in_window]
          random_variable: [discrete_count]
          computes: [find_n_for_threshold]
          structural_cues: [rate_given, counting_events]
          parameters_known: [rate_lambda]
          distribution_assumption: [poisson]
          tooling: [cumulative_poisson_table_E2]
        currently_surfaces: false
        missing_tags:
          - dimension: computes
            missing: [find_n_for_threshold]
            note: "Detaljert solution-variant 'Finn k for terskel' er allerede implementert; mangler kun filter-tag."

  - id: produktregel
    type: entry
    contexts:
      - scenario: "Trekker to kuler uten tilbakelegging; finn P(begge røde)."
        student_filters:
          setup: [without_replacement, finite_pool]
          random_variable: [discrete_count]
          computes: [joint_probability]
          structural_cues: [conditional_given]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Direkte beregning av betinget sannsynlighet P(A|B) = P(A∩B)/P(B)."
        student_filters:
          setup: [single_population]
          random_variable: [discrete_count]
          computes: [conditional_probability]
          structural_cues: [conditional_given]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Test om to hendelser er uavhengige: sjekk om P(A∩B) = P(A)·P(B)."
        student_filters:
          setup: [single_population]
          random_variable: [discrete_count]
          computes: [test_independence]
          structural_cues: [independent_events]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Mynt OG terning samtidig — uavhengige hendelser, P(A∩B) = P(A)·P(B)."
        student_filters:
          setup: [single_population]
          random_variable: [discrete_count]
          computes: [joint_probability]
          structural_cues: [independent_events]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []

  - id: prosentilintervall
    type: entry
    contexts:
      - scenario: "Etter bootstrap er kjørt, lag 95 % KI ved å ta 2.5- og 97.5-prosentilen."
        student_filters:
          setup: [single_population]
          random_variable: [mean_of_samples]
          computes: [confidence_interval]
          structural_cues: [data_as_list]
          parameters_known: [confidence_level, population_variance_unknown]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Bootstrapfordelingen er skjev — bruk prosentil-KI istedenfor t-basert."
        student_filters:
          setup: [single_population]
          random_variable: [mean_of_samples]
          computes: [confidence_interval]
          structural_cues: [data_as_list, summary_stats_given]
          parameters_known: [confidence_level, sample_size_small_lt30]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: false
        missing_tags:
          - dimension: parameters_known
            missing: [sample_size_small_lt30]
            note: "Bootstrap brukes typisk i små utvalg der CLT/t er upålitelig; verdt å vurdere."
      - scenario: "Punktestimat for parameter (median, andel, gjennomsnitt) der bootstrap-fordelingen brukes."
        student_filters:
          setup: [single_population]
          random_variable: [proportion]
          computes: [parameter_estimate, confidence_interval]
          structural_cues: [data_as_list]
          parameters_known: [confidence_level]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: false
        missing_tags:
          - dimension: random_variable
            missing: [proportion]
            note: "Bootstrap-prosentilintervall passer også for andelestimater, ikke bare gjennomsnitt."

  - id: regresjon-estimat-alpha-beta
    type: entry
    contexts:
      - scenario: "Datatabellen oppgir Σ(x-x̄)² og Σ(x-x̄)(y-ȳ); finn regresjonslinjen."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [parameter_estimate]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Rådata gitt som liste av (x, y)-par; estimer α̂ og β̂."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [parameter_estimate]
          structural_cues: [linear_relationship_suspected, data_as_list]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Lab-forsøk (x = last, y = forlengelse); finn beste rette linje."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate, continuous]
          computes: [parameter_estimate]
          structural_cues: [linear_relationship_suspected, data_as_list, total_observations_n]
          distribution_assumption: [none_assumed]
          tooling: [calculator_only]
        currently_surfaces: true
        missing_tags: []

  - id: regresjon-korrelasjonskoeffisient
    type: entry
    contexts:
      - scenario: "Mellomsummene gitt; finn Pearson r og tolk styrken."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [correlation]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Rådata (x_i, y_i) gitt som liste; beregn r."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [correlation]
          structural_cues: [linear_relationship_suspected, data_as_list]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Vil kvantifisere styrken av lineær sammenheng mellom to målte variabler (uten regresjonsestimering)."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [correlation, parameter_estimate]
          structural_cues: [linear_relationship_suspected, data_as_list, total_observations_n]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []

  - id: regresjon-prediksjonsintervall
    type: entry
    contexts:
      - scenario: "Har α̂, β̂, S_E, SE(β̂), x̄, n; lag 95 % prediksjonsintervall ved en ny x₀."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [prediction_interval]
          structural_cues: [linear_relationship_suspected, summary_stats_given, normal_assumed]
          parameters_known: [slope_se, residual_variance, confidence_level]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Avgjør om en spesifikk verdi (f.eks. 75 %) er sannsynlig ved x₀ = 5 — sjekk om innenfor PI."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [prediction_interval, find_x_for_threshold]
          structural_cues: [linear_relationship_suspected, summary_stats_given, normal_assumed]
          parameters_known: [slope_se, residual_variance, confidence_level]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Sammenlign bredden av PI for x₀ nær x̄ vs. langt unna (ekstrapolering)."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [prediction_interval]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [residual_variance, sum_xx_sxy, confidence_level]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []

  - id: regresjon-residualvarians
    type: entry
    contexts:
      - scenario: "SSE er gitt; finn S_E² = SSE / (n-2) og S_E."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [parameter_estimate, std_dev]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [residual_variance]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Trenger S_E² som mellomberegning til SE(β̂) i en hypotesetest for β."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate, continuous]
          computes: [parameter_estimate]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [population_variance_unknown, sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Har S_YY og β̂·S_XY; bruk kompakt formel S_E² = (S_YY − β̂·S_XY)/(n−2)."
        student_filters:
          setup: [linear_relationship]
          random_variable: [continuous]
          computes: [parameter_estimate, std_dev]
          structural_cues: [linear_relationship_suspected, summary_stats_given, total_observations_n]
          parameters_known: [residual_variance, sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: structural_cues
            missing: [total_observations_n]
            note: "Frihetsgrader (n-2) er sentralt; rimelig at total_observations_n er en kjennetegn."

  - id: regresjon-standardfeil-stigningstall
    type: entry
    contexts:
      - scenario: "Har S_E² og S_XX; finn SE(β̂) som steg mot t-test."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [parameter_estimate, std_dev]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [residual_variance, sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Skal lage KI for β; trenger SE(β̂)."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [std_dev, confidence_interval]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [residual_variance, sum_xx_sxy]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: computes
            missing: [confidence_interval]
            note: "SE(β̂) er sentral input til KI for β; legg til confidence_interval."
      - scenario: "Vurdere usikkerheten i estimatet av β̂ (mindre SE = mer presist)."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [std_dev]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [residual_variance, slope_se]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []

  - id: regresjon-test-stigningstall
    type: entry
    contexts:
      - scenario: "Har β̂, SE(β̂), n; test H₀: β = 0 vs H₁: β ≠ 0 på α = 0.05."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [hypothesis_test]
          structural_cues: [linear_relationship_suspected, summary_stats_given]
          parameters_known: [slope_se, alpha_significance]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Spørsmål: 'kan sammenhengen mellom søvn og eksamen skyldes tilfeldigheter?'"
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [hypothesis_test, test_independence]
          structural_cues: [linear_relationship_suspected, data_as_list, summary_stats_given]
          parameters_known: [residual_variance, sum_xx_sxy, alpha_significance]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Har β̂ og SSE og Σ(x-x̄)²; må selv beregne SE(β̂) før T."
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          computes: [hypothesis_test]
          structural_cues: [linear_relationship_suspected, summary_stats_given, total_observations_n]
          parameters_known: [residual_variance, sum_xx_sxy, alpha_significance]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []

  - id: standardavvik-oversikt
    type: entry
    contexts:
      - scenario: "Student er usikker på hvilken std-formel som passer (s, σ, σ/√n, SE(β̂))."
        student_filters:
          setup: [single_population]
          random_variable: [continuous]
          computes: [std_dev]
          structural_cues: [data_as_list, mean_and_sd_given]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Vil finne riktig formel for standardfeilen til andelen p̂."
        student_filters:
          setup: [single_population]
          random_variable: [proportion]
          computes: [std_dev]
          structural_cues: [summary_stats_given]
          parameters_known: [success_p]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: random_variable
            missing: [proportion]
            note: "Oversikten lenker til SE(p̂), så proportion bør være med."
          - dimension: parameters_known
            missing: [success_p]
            note: "Andel-relaterte SE-formler bruker p; oversikten dekker dette."
      - scenario: "Skal regne σ for sum/diff av flere normaler — vil bekrefte at σ_Y = σ·√n."
        student_filters:
          setup: [single_population]
          random_variable: [sum_of_samples, mean_of_samples]
          computes: [std_dev]
          structural_cues: [mean_and_sd_given]
          parameters_known: [population_variance_known]
          distribution_assumption: [none_assumed]
          tooling: [calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: random_variable
            missing: [sum_of_samples]
            note: "Oversikten dekker σ for X̄ men ikke summen eksplisitt; usikker hvor langt overview skal strekke seg."

  - id: sum-uavhengige-normaler
    type: entry
    contexts:
      - scenario: "5 uavhengige målinger fra N(μ, σ); finn P(sum > k)."
        student_filters:
          setup: [fixed_n_trials]
          random_variable: [sum_of_samples, continuous]
          computes: [exact_probability]
          structural_cues: [normal_assumed, independent_events, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "X og Y uavhengige normalfordelte; finn fordeling og P(X − Y > 0)."
        student_filters:
          setup: [two_independent_samples]
          random_variable: [difference_of_means, continuous]
          computes: [exact_probability]
          structural_cues: [normal_assumed, independent_events, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3, calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: setup
            missing: [two_independent_samples]
            note: "Sum/diff av to uavhengige normaler er en typisk to-utvalgs-kontekst."
          - dimension: random_variable
            missing: [difference_of_means]
            note: "Detaljerte solutions inkluderer 'Differanse X−Y' og 'Lineær kombinasjon'."
      - scenario: "Lineær kombinasjon aX + bY (portefølje, blandinger); finn fordelingen og sannsynlighet."
        student_filters:
          setup: [two_independent_samples]
          random_variable: [continuous]
          computes: [exact_probability, range_probability]
          structural_cues: [normal_assumed, independent_events, mean_and_sd_given]
          parameters_known: [mean_known, population_variance_known]
          distribution_assumption: [normal]
          tooling: [standard_normal_table_E3, calculator_sqrt]
        currently_surfaces: false
        missing_tags:
          - dimension: setup
            missing: [two_independent_samples]
            note: "Lineær kombinasjon krever to (eller flere) uavhengige variabler."

  - id: to-utvalgs-t-test
    type: entry
    contexts:
      - scenario: "To uavhengige grupper, ukjent σ, antas normal; test om μ_X = μ_Y (tosidig)."
        student_filters:
          setup: [two_independent_samples]
          random_variable: [difference_of_means]
          computes: [hypothesis_test]
          structural_cues: [normal_assumed, data_as_list]
          parameters_known: [population_variance_unknown, alpha_significance]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Ny vs gammel metode: H₁: μ_X < μ_Y, ensidig venstre."
        student_filters:
          setup: [two_independent_samples]
          random_variable: [difference_of_means]
          computes: [hypothesis_test]
          structural_cues: [normal_assumed, data_as_list, summary_stats_given]
          parameters_known: [population_variance_unknown, alpha_significance, sample_size_small_lt30]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5, calculator_sqrt]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Stort utvalg fra to grupper med oppsummeringsstatistikk; test om gjennomsnittene er forskjellige."
        student_filters:
          setup: [two_independent_samples]
          random_variable: [difference_of_means, mean_of_samples]
          computes: [hypothesis_test]
          structural_cues: [summary_stats_given, total_observations_n]
          parameters_known: [population_variance_unknown, sample_size_large, alpha_significance]
