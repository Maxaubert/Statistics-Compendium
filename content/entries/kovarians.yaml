id: kovarians
name_no: "Kovarians Cov(X,Y)"
type: identity
category: distribution_property
tagline: "Mål for hvor mye to variabler 'beveger seg sammen'."

formula_main: "Cov(X,Y) = E[XY] − μ_X · μ_Y    der    E[XY] = Σ_i Σ_j x_i · y_j · P(X=x_i, Y=y_j)"
formula_latex: "\\begin{gathered} \\text{Cov}(X, Y) = E[XY] - \\mu_X\\,\\mu_Y \\\\[4pt] E[XY] = \\sum_i \\sum_j x_i\\,y_j\\,P(X=x_i,\\,Y=y_j) \\end{gathered}"

what_it_does: |
  Beregner kovariansen mellom to stokastiske variabler X og Y fra en
  simultanfordeling. Positiv kovarians: variablene øker sammen.
  Negativ: når X er stor, er Y typisk liten. Null: ingen lineær sammenheng.

why_use: |
  Mellomberegning for korrelasjon ρ. Også del av variansformelen for
  Var(X+Y) = Var(X) + Var(Y) + 2·Cov(X,Y).

recognition_cues:
  - "Du har en simultanfordeling for `X` og `Y` (tabell med `P(X = x_i, Y = y_j)`)"
  - "Spørsmålet ber eksplisitt om `Cov(X, Y)`, eller du trenger den som mellomsteg til `ρ`"
  - "Spørsmålet ber deg sjekke om `X` og `Y` er ukorrelerte (`Cov = 0`)"
  - "Du skal regne ut `Var(X + Y)` eller `Var(aX + bY)` der `Cov` inngår"

when_NOT_to_use:
  - "(X, Y) er kontinuerlige → bruk dobbeltintegralet `E[XY] = ∫∫ x·y · f(x, y) dx dy`"
  - "Du har bare rådata-par `(x_i, y_i)` → bruk utvalgskovariansen `s_XY = Σ(x_i − x̄)(y_i − ȳ) / (n − 1)`"
  - "Du vil måle styrken av sammenhengen — bruk korrelasjon `ρ` (skalainvariant), ikke Cov direkte"

symbols:
  - { sym: "Cov(X,Y)", means: "kovariansen" }
  - { sym: "E[XY]",     means: "Σ x_i·y_j·P(X=x_i, Y=y_j) over hele simultantabellen" }
  - { sym: "μ_X, μ_Y",  means: "forventningsverdiene til `X` og `Y`" }
  - { sym: "x_i, y_j",  means: "verdiene `X` og `Y` kan ta i simultantabellen" }
  - { sym: "P(X=x_i, Y=y_j)", means: "simultansannsynligheten for cellen `(x_i, y_j)`" }

filters:
  computes: [covariance, expected_value, std_dev, test_independence]
  random_variable: [discrete_count]
  structural_cues: [summary_stats_given, independent_events]
  parameters_known: [mean_known]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]
solution_variants:
  - label: "Beregn Cov(X, Y) fra simultantabell"
    recognition: "«Beregn `Cov(X, Y)`», «test om to variabler er uavhengige via kovarians», eller mellomsteg for `ρ` eller `Var(X+Y)`. Du har en simultanfordeling gitt som tabell."
    steps:
      - "Beregn μ_X og μ_Y fra marginalfordelingene"
      - text: "Eksempel — `P(X = 0) = 0.40`, `P(X = 1) = 0.60`; `P(Y = 0) = 0.50`, `P(Y = 1) = 0.30`, `P(Y = 2) = 0.20`:"
        formula:
          - "μ_X = 0 · 0.40 + 1 · 0.60 = 0.60"
          - "μ_Y = 0 · 0.50 + 1 · 0.30 + 2 · 0.20 = 0.70"
        example: true
      - text: "Beregn E[XY] – kun celler med positiv sannsynlighet bidrar:"
        formula: "E[XY] = Σ_i Σ_j x_i · y_j · P(X = x_i, Y = y_j)"
      - text: "Sett inn i kovariansformelen:"
        formula: "Cov(X, Y) = E[XY] − μ_X · μ_Y"
      - text: "Eksempel: `E[XY] = 0.30`, `μ_X = 0.60`, `μ_Y = 0.70`:"
        formula: "Cov(X, Y) = 0.30 − 0.60·0.70 = −0.12"
        example: true

  - label: "Finn E[XY] når Cov er gitt"
    recognition: "«Regn ut `E(XY)`», «hva er forventet produkt når vi har `Cov(X, Y)` og `E[X]`, `E[Y]`?». Du har kovariansen oppgitt og skal løse ut joint-forventningen — IKKE bruk snarveien `E[X]·E[Y]` med mindre `Cov = 0`."
    steps:
      - "Identifiser hva som er gitt: `Cov(X, Y)`, `E[X]`, `E[Y]`. Sjekk at variablene IKKE er uavhengige (`Cov ≠ 0`) — ellers er snarveien rett frem."
      - text: "Start fra definisjonen av kovarians og løs for `E[XY]`:"
        formula:
          - "Cov(X, Y) = E[XY] − E[X]·E[Y]"
          - "E[XY] = E[X]·E[Y] + Cov(X, Y)"
      - text: "Eksempel: `E[X] = 20`, `E[Y] = 15`, `Cov(X, Y) = 5`:"
        formula: "E[XY] = 20·15 + 5 = 300 + 5 = 305"
        example: true
      - text: "**Pass på:** snarveien `E[XY] = E[X]·E[Y]` gjelder KUN hvis `X` og `Y` er uavhengige (`Cov = 0`). Med `Cov ≠ 0` får du feil svar med snarveien."
        conditional: true

common_traps: |
  - **Trekk fra `μ_X · μ_Y`, ikke `μ_X + μ_Y`**: formelen er
    `Cov = E[XY] − μ_X·μ_Y`. Lett å skrive `− μ_X − μ_Y` på automat.
  - **`E[XY] ≠ E[X]·E[Y]`** generelt — likhet gjelder KUN ved uavhengighet.
    Hele poenget med kovariansen er å måle dette avviket. Sett du
    `E[XY] = μ_X·μ_Y` direkte, antar du implisitt uavhengighet og får alltid `0`.
  - **Fortegn er informasjon**: negativ kovarians betyr at `X` og `Y` beveger
    seg motsatt — ikke en regnefeil. Positiv = samme retning, null = ingen
    lineær sammenheng (men kan fortsatt være avhengige!).
  - **Celler med `p = 0`, `x = 0` eller `y = 0`**: bidrar `0` til `E[XY]` og kan
    droppes for å spare regning, men husk de TELLER fortsatt i marginalene.
  - **Cov(X, X) = Var(X)**: nyttig som sanity-sjekk og dukker opp i
    `Var(X + Y) = Var(X) + Var(Y) + 2·Cov(X, Y)`.

detailed_solution_variants:
  - label: "Beregn Cov(X, Y) fra simultantabell"
    solutions:
      - source: "Eksamen mai25 · oppgave 1c"
        question: "Finn `Cov(X, Y)` fra simultanfordelingen."
        sections:
          - label: "Steg"
            lines:
              - step_trail:
                  steps:
                    - { label: "1 · Marginal", done: true }
                    - { label: "2 · E[X], E[Y]", done: true }
                    - { label: "3 · Var, σ", done: true }
                    - { label: "4 · Cov" }
          - label: "Simultantabellen"
            lines:
              - table:
                  headers: ["", "Y = 0", "Y = 1", "Y = 2", "P(X)"]
                  rows:
                    - ["X = 0", "0.10", "0.20", "0.10", "0.40"]
                    - ["X = 1", "0.40", "0.10", "0.10", "0.60"]
                    - ["P(Y)", "0.50", "0.30", "0.20", "1.00"]
                  margin_col: true
                  margin_row: true
          - label: "Forutsetninger fra forrige steg"
            lines:
              - { text: "`μ_X = 0.60` · `μ_Y = 0.70` · `σ_X ≈ 0.49` · `σ_Y ≈ 0.78`" }
          - label: "E[XY] — bruk JOINT-sannsynlighet fra simultantabellen"
            lines:
              - text: "For en generell simultanfordeling må du bruke selve celle-sannsynligheten `P(X=x_i, Y=y_j)`."
              - { text: "`(0, 0):  0 · 0 · 0.10 = 0`" }
              - { text: "`(0, 1):  0 · 1 · 0.20 = 0`" }
              - { text: "`(0, 2):  0 · 2 · 0.10 = 0`" }
              - { text: "`(1, 0):  1 · 0 · 0.40 = 0`" }
              - { text: "`(1, 1):  1 · 1 · 0.10 = 0.10`" }
              - { text: "`(1, 2):  1 · 2 · 0.10 = 0.20`" }
              - { text: "`                  E[XY] = 0.30`" }
              - { comment: "Cellene med `x_i = 0` ELLER `y_j = 0` gir produktet 0 og bidrar ikke. Det er bare de to siste cellene som teller — derfor `0.10 + 0.20`." }
          - label: "Kovarians"
            lines:
              - text: "Sett inn i kovariansformelen:"
              - indent: "`Cov(X, Y) = E[XY] − μ_X · μ_Y`"
              - indent: "`         = 0.30 − 0.60 · 0.70`"
              - indent: "`         = 0.30 − 0.42 = −0.12`"
              - tip: "Hadde `X` og `Y` vært uavhengige, ville `E[XY] = μ_X · μ_Y = 0.42` og `Cov = 0`. Avviket `−0.12` viser graden av (negativ) avhengighet."
        result: "`Cov(X, Y) = −0.12`"

      - source: "Praksis · simultanfordeling 2 × 2"
        question: "La `X ∈ {0, 1}` og `Y ∈ {0, 1}` med simultanfordeling `P(0,0) = 0.4`, `P(0,1) = 0.1`, `P(1,0) = 0.2`, `P(1,1) = 0.3`. Finn `Cov(X, Y)`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Diskret simultantabell for to binære variabler."
              - text: "Vi må først finne marginalforventningene, deretter `E[XY]`."
          - label: "Forventningsverdier"
            lines:
              - text: "Marginalfordeling for `X`: `P(X=0) = 0.4 + 0.1 = 0.5`, `P(X=1) = 0.2 + 0.3 = 0.5`."
              - indent: "`E[X] = 0 · 0.5 + 1 · 0.5 = 0.5`"
              - text: "Marginalfordeling for `Y`: `P(Y=0) = 0.4 + 0.2 = 0.6`, `P(Y=1) = 0.1 + 0.3 = 0.4`."
              - indent: "`E[Y] = 0 · 0.6 + 1 · 0.4 = 0.4`"
              - text: "Beregn `E[XY]` (kun cellen `(1, 1)` bidrar siden andre celler har `x = 0` eller `y = 0`):"
              - indent: "`E[XY] = 1 · 1 · 0.3 = 0.3`"
          - label: "Kovarians"
            lines:
              - text: "Sett inn i `Cov(X, Y) = E[XY] − E[X] · E[Y]`:"
              - indent: "`Cov(X, Y) = 0.3 − 0.5 · 0.4`"
              - indent: "`         = 0.3 − 0.20 = 0.10`"
          - label: "Tolkning"
            lines:
              - text: "`Cov(X, Y) = 0.10 > 0`: `X` og `Y` er positivt assosierte."
              - text: "Høy verdi av `X` opptrer typisk sammen med høy verdi av `Y`."
        result: "`Cov(X, Y) = 0.10`"

      - source: "Praksis · tolkning av fortegn"
        question: "Forklar hva fortegnet til `Cov(X, Y)` betyr, og illustrer med et tilfelle der `Cov(X, Y) = 0` men `X` og `Y` ikke er uavhengige."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Vi tolker `Cov(X, Y) = E[XY] − μ_X · μ_Y` som mål for lineær samvariasjon."
              - text: "Tre tilfeller: positiv, negativ, og null kovarians."
          - label: "Forventningsverdier"
            lines:
              - text: "Eksempel: `X ∈ {−1, 0, 1}` uniformt, og `Y = X²`."
              - indent: "`E[X] = (−1 + 0 + 1)/3 = 0`"
              - indent: "`E[Y] = E[X²] = (1 + 0 + 1)/3 = 2/3`"
              - text: "Beregn `E[XY] = E[X · X²] = E[X³]`:"
              - indent: "`E[X³] = ((−1)³ + 0³ + 1³)/3 = 0`"
          - label: "Kovarians"
            lines:
              - text: "Sett inn i formelen:"
              - indent: "`Cov(X, Y) = E[XY] − μ_X · μ_Y = 0 − 0 · 2/3 = 0`"
              - comment: "Likevel er `Y` fullstendig bestemt av `X` (ikke uavhengige)."
          - label: "Tolkning"
            lines:
              - text: "Fortegnsregler:"
              - indent: "`Cov > 0`: positivt assosierte – store `X` følger store `Y`."
              - indent: "`Cov < 0`: negativt assosierte – store `X` følger små `Y`."
              - indent: "`Cov = 0`: ukorrelerte (ingen lineær sammenheng)."
              - text: "Viktig: `Cov = 0` betyr ikke uavhengighet. Eksempelet over viser ikke-lineær avhengighet med null kovarians."
        result: "Fortegnet til `Cov(X, Y)` indikerer retning på lineær samvariasjon; `Cov = 0` utelukker ikke avhengighet."

  - label: "Finn E[XY] når Cov er gitt"
    solutions:
      - source: "Praksis · E(XY) gitt Cov, E[X], E[Y]"
        question: "X og Y har `E[X] = 20`, `E[Y] = 15`, og `Cov(X, Y) = 5`. Finn `E[XY]`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi har `Cov(X, Y) = 5 ≠ 0`, så `X` og `Y` er IKKE uavhengige." }
              - { text: "Snarveien `E[XY] = E[X]·E[Y]` gjelder bare ved uavhengighet — vi må bruke kovarians­definisjonen i stedet." }
          - label: "Definisjonen av kovarians"
            lines:
              - { text: "`Cov(X, Y) = E[XY] − E[X]·E[Y]`" }
              - { text: "Løs for det vi søker:" }
              - { indent: "`E[XY] = E[X]·E[Y] + Cov(X, Y)`" }
          - label: "Innsetting"
            lines:
              - { text: "`E[XY] = 20·15 + 5`" }
              - { indent: "`= 300 + 5`" }
              - { indent: "`= 305`" }
          - label: "Sjekk"
            lines:
              - { text: "Hadde X og Y vært uavhengige ville `E[XY] = E[X]·E[Y] = 300`. Avviket `+5` er nettopp kovariansen." }
              - { comment: "Generelt: positiv kovarians ⇒ E[XY] > E[X]·E[Y]; negativ ⇒ E[XY] < E[X]·E[Y]." }
        result: "`E[XY] = 305`"

      - source: "Praksis · negativ kovarians"
        question: "X og Y har `E[X] = 0.6`, `E[Y] = 0.7`, `Cov(X, Y) = −0.12`. Finn `E[XY]`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`Cov(X, Y) = −0.12 < 0` — `X` og `Y` beveger seg motsatt (negativ avhengighet)." }
          - label: "Bruk kovarians­definisjonen"
            lines:
              - { text: "`E[XY] = E[X]·E[Y] + Cov(X, Y)`" }
              - { indent: "`= 0.6·0.7 + (−0.12)`" }
              - { indent: "`= 0.42 − 0.12`" }
              - { indent: "`= 0.30`" }
          - label: "Sjekk"
            lines:
              - { text: "Snarvei-svaret ville vært `0.42`. Den negative kovariansen `−0.12` trekker `E[XY]` ned til `0.30`." }
        result: "`E[XY] = 0.30`"

