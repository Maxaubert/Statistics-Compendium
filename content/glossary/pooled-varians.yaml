id: pooled-varians
term_no: Pooled (interpolert) varians (S_P²)
short_def: "Felles variansestimat for to grupper: `S_P² = ((n_X−1)·s_X² + (n_Y−1)·s_Y²) / (n_X + n_Y − 2)`."
filters:
  setup: [two_independent_samples]
  random_variable: [difference_of_means]
  parameters_known: [population_variance_unknown, confidence_level]
  distribution_assumption: [t_distribution]
  computes: [hypothesis_test, std_dev, confidence_interval]
  structural_cues: [summary_stats_given]
  tooling: [t_quantile_table_E5]
long_def: |
  Formel:

      S_P² = ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2)

  Brukes i to-utvalgs t-test der vi antar at begge gruppene har samme
  underliggende `σ²`. Et vektet snitt av de to utvalgsvariansene — vekten
  er antall frihetsgrader i hver gruppe.

  **Trenger rådata?** Indirekte: trenger `s_X²` og `s_Y²`, som regnes
  fra rådata. Hvis utvalgsvariansene allerede er gitt i oppgaven,
  trenger du ikke selve observasjonene.

  **Antakelse:** lik `σ²` i begge grupper. Hvis ikke, bruk Welch t-test.

  Standardavviket er `S_P = √S_P²`.

  **Standardfeil i to-utvalgs t-test:**

      SE = S_P · √(1/n_X + 1/n_Y)

