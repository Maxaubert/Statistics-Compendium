id: kritisk-verdi
term_no: Kritisk verdi
short_def: "Tabellverdien testobservatoren må passere for at `H₀` skal forkastes."
filters:
  computes: [hypothesis_test, test_independence]
  parameters_known: [alpha_significance]
  tooling: [normal_quantile_table_E4, t_quantile_table_E5, chi_square_quantile_table_E6]
  distribution_assumption: [chi_squared, normal, t_distribution]
long_def: |
  Slå opp i z-, t-, eller χ²-tabellen med `α` (og `df` hvis nødvendig).
  Hvis testobservatoren er mer ekstrem enn den kritiske verdien, ligger
  den i forkastningsområdet og du forkaster `H₀`. Tosidig test: bruk `α/2`.
aliases:
  - kritisk verdi
  - kritiske verdi
  - kritiske verdien
  - kritiske verdier
  - kritiske verdiene
  - kritisk verdien
see_also:
