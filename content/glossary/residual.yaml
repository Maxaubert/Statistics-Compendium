id: residual
term_no: Residual
short_def: "Forskjellen mellom observert `y` og predikert `ŷ` i en regresjonsmodell."
filters:
  setup: [linear_relationship]
  parameters_known: [residual_variance]
  structural_cues: [linear_relationship_suspected, data_as_list]
  computes: [parameter_estimate, std_dev]
long_def: |
  Formel:

      eᵢ = yᵢ − ŷᵢ        der    ŷᵢ = α̂ + β̂·xᵢ

  Summen av residualene er `0` ved minste kvadraters tilpasning.
  Variansen til residualene (`S_E²`) brukes til å lage KI og
  prediksjonsintervaller i regresjon.
see_also:
  - { id: regresjon-estimat-alpha-beta, kind: entry }
  - { id: regresjon-residualvarians, kind: entry }
