id: hypergeometrisk-varians
term_no: Hypergeometrisk varians
short_def: "For trekning UTEN tilbakelegging: `Var(X) = n · (K/N) · ((N−K)/N) · ((N−n)/(N−1))`."
filters:
  distribution_assumption: [hypergeometric]
  random_variable: [discrete_count]
  setup: [without_replacement, finite_pool, fixed_n_trials]
  computes: [std_dev, expected_value]
long_def: |
  For en `Hypergeometrisk(N, K, n)`-fordelt variabel `X` (antall
  «vellykkede» i `n` trekninger uten tilbakelegging fra en pott på
  `N` elementer hvorav `K` er «vellykkede»):

      E[X]   = n · K/N
      Var(X) = n · (K/N) · ((N−K)/N) · ((N−n)/(N−1))

  **Sammenligning med binomial:** sett `p = K/N`. Da blir
  binomial-forventningen den samme (`n·p`) og binomialvariansen er
  `n·p·(1−p)`. Den hypergeometriske variansen er den binomiale
  multiplisert med **endelig-populasjon-korreksjonen**:

      (N − n) / (N − 1)

  Faktoren er `< 1` når `n > 1`. Når `n` er liten i forhold til `N`,
  går korreksjonen mot `1` og hypergeometrisk ≈ binomial.
aliases:
  - hypergeometrisk varians
  - hypergeometrisk variansen
