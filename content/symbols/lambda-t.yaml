id: lambda-t
sym: "λt"
short_def: "Forventet antall hendelser i en poissonprosess over tidsvindu t. Lik μ i poissonfordelingen."
contexts:
  - usage: "Forventet antall i poissonvindu"
    detail: |
      Hvis hendelser kommer med rate λ per tidsenhet, er antall hendelser i et
      vindu av lengde t poissonfordelt med parameter μ = λt. Kalkulator: regn
      ut λt først, slå deretter opp i tabell E.2 med μ = λt.
    entry_refs:
      - poisson-fordeling
      - eksponential-fordeling
      - ki-poissonrate
see_also:
  - { id: poisson-prosess, kind: concept }
