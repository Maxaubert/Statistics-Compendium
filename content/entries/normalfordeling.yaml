id: normalfordeling
name_no: Normalfordeling
type: distribution
category: continuous_distribution
tagline: "Klokkeformet kontinuerlig fordeling – den vanligste antakelsen i statistikk."

formula_main: "X ~ N(μ, σ);  Z = (X - μ) / σ ~ N(0, 1);  P(X ≤ x) = G((x - μ) / σ)"
formula_latex: "X \\sim N(\\mu, \\sigma), \\quad Z = \\frac{X - \\mu}{\\sigma} \\sim N(0, 1)"

what_it_does: |
  Den klassiske "klokkeformede" fordelingen. Beskriver en kontinuerlig
  variabel X (en målbar verdi som kan være hva som helst innenfor et
  intervall – vekt, høyde, kaffemengde, testresultater) som er symmetrisk
  rundt midtverdien μ, med spredning angitt av σ.

  Sannsynligheter under normalfordelingen regnes ikke direkte ut, men slås
  opp i en tabell (E.3 – Z-tabell) etter at variabelen er "standardisert"
  med transformasjonen Z = (X - μ)/σ. Z-verdien forteller hvor mange
  standardavvik over eller under gjennomsnittet observasjonen ligger.

why_use: |
  Mange naturlige fenomener er tilnærmet normalfordelte (vekt, høyde,
  målefeil, gjennomsnittsresultater). Sentralgrenseteoremet sier at
  gjennomsnittet av mange uavhengige variabler er tilnærmet normalfordelt
  uansett underliggende fordeling, så normalfordelingen brukes også indirekte
  i z-tester, t-tester og konfidensintervaller.

recognition_cues:
  - "Oppgaven sier eksplisitt 'normalfordelt med forventningsverdi `μ` og standardavvik `σ`'"
  - "Oppgaven oppgir både en gjennomsnittsverdi `μ` og en spredning `σ` for en kontinuerlig størrelse"
  - "Spørsmålet er på formen `P(X < x)`, `P(X > x)` eller `P(a < X < b)` for kontinuerlig `X`"
  - "Stort antall observasjoner (`n ≥ 30`) der man ser på gjennomsnittet – sentralgrenseteoremet gir tilnærmet normalfordeling"
  - "Spørsmålet ber om 'sannsynligheten for at en tilfeldig valgt `X` overstiger / underskrider en verdi'"
  - "Skjult variant: 'finn `x` slik at `P(X < x) = p`' (invers normal – bruk z-kvantiltabellen E.4)"

when_NOT_to_use:
  - "Variabelen er diskret (heltall) → bruk [binomial](/entry/binomial-fordeling), [Poisson](/entry/poisson-fordeling), eller [hypergeometrisk](/entry/hypergeometrisk-fordeling)"
  - "Datamaterialet ser klart skjevt ut (qq-plott avviker) → vurder [bootstrap](/entry/bootstrapping)"
  - "Variabelen er bare positiv tid mellom hendelser → bruk [eksponentialfordeling](/entry/eksponential-fordeling)"

symbols:
  - { sym: "μ",     means: "forventningsverdien (sentrum av klokken)" }
  - { sym: "σ",     means: "standardavviket (spredning)" }
  - { sym: "σ²",    means: "variansen" }
  - { sym: "Z",     means: "standardnormalisert variabel, `Z = (X − μ)/σ`" }
  - { sym: "G(z)",  means: "kumulativ standardnormalfordeling, `P(Z ≤ z)`" }
  - { sym: "z_α",   means: "`α`-kvantilet, slik at `P(Z > z_α) = α`" }

properties:
  expected_value: "E[X] = μ"
  variance: "Var[X] = σ²"
  std_dev: "σ"

filters:
  computes: [exact_probability, range_probability, find_mu_for_threshold, find_x_for_threshold, find_n_for_threshold]
  random_variable: [continuous, mean_of_samples]
  setup: [single_population]
  structural_cues: [normal_assumed, mean_and_sd_given, complement_pattern]
  parameters_known: [population_variance_known, mean_known, sample_size_large]
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]

solution_variants:
  - label: "P(X < x)"
    steps:
      - "Noter `μ`, `σ` og terskelen `x` fra oppgaven (f.eks. `μ = 25`, `σ = 0.48`, `x = 24`)."
      - "Bekreft at `X ~ N(μ, σ)` — enten direkte oppgitt, eller via sentralgrenseteoremet når `n ≥ 30`."
      - text: "Standardiser og rund til 2 desimaler (f.eks. `(24 − 25)/0.48 = −2.0833 ≈ −2.08`):"
        formula: "z = (x − μ)/σ"
      - "Slå opp `G(z)` i **tabell E.3** (Z-tabell, kumulativ) — arealet til VENSTRE for `z` (f.eks. `G(−2.08) ≈ 0.0188`)."
      - text: "Svaret er:"
        formula: "P(X < x) = G(z)"
      - text: "Hvis tabellen din kun viser positive `z`, bruk symmetri (vår E.3 dekker både fortegn, så dette er sjelden nødvendig):"
        formula: "G(−z) = 1 − G(z)"
        conditional: true

  - label: "P(X > x)"
    steps:
      - "Noter `μ`, `σ` og terskelen `x` (f.eks. `μ = 302`, `σ = 5`, `x = 310`)."
      - text: "Standardiser (f.eks. `(310 − 302)/5 = 1.6`):"
        formula: "z = (x − μ)/σ"
      - "Slå opp `G(z)` i **tabell E.3** (Z-tabell, kumulativ) (f.eks. `G(1.6) ≈ 0.9452`)."
      - text: "Bruk komplementet siden E.3 gir venstrearealet (f.eks. `1 − 0.9452 = 0.0548`):"
        formula: "P(X > x) = 1 − G(z)"
      - "Fortegnssjekk: `x > μ ⇒ z > 0` (svar `< 0.5`); `x < μ ⇒ z < 0` (svar `> 0.5`)."

  - label: "P(a < X < b)"
    steps:
      - "Noter `μ`, `σ` og grensene `a < b` (f.eks. `μ = 302`, `σ = 5`, `a = 305`, `b = 310`)."
      - text: "Standardiser begge (f.eks. `z_a = 0.6`, `z_b = 1.6`):"
        formula: "z_a = (a − μ)/σ,   z_b = (b − μ)/σ"
      - "Slå opp `G(z_a)` og `G(z_b)` i **tabell E.3** (Z-tabell, kumulativ) (f.eks. `G(0.6) ≈ 0.7257`, `G(1.6) ≈ 0.9452`)."
      - text: "Trekk fra (f.eks. `0.9452 − 0.7257 = 0.2195`):"
        formula: "P(a < X < b) = G(z_b) − G(z_a)"
      - "Sanity-sjekk: svaret skal ligge i `[0, 1]`. Negativt resultat betyr at du har byttet om `z_a` og `z_b`."

  - label: "Invers: finn x"
    steps:
      - "Les hva som er gitt: en sannsynlighet og hvilken side. Enten `P(X < x) = p`, eller `P(X > x) = α` (da er `p = 1 − α`)."
      - "Slå opp `z` slik at `G(z) = p` i **tabell E.4** (Z-kvantiltabell). Eksempel: `p = 0.975 ⇒ z = 1.96`."
      - text: "Hvis `p < 0.5`: `z` er negativ. Bruk refleksjon (f.eks. `p = 0.001 ⇒ z = −z_{0.999} = −3.090`):"
        formula: "z = −z_{1−p}"
        conditional: true
      - text: "Sett inn (f.eks. `μ = 300`, `σ = 5`, `z = −3.090 ⇒ x = 300 − 15.45 = 284.55`):"
        formula: "x = μ + σ · z"
      - "Sanity-sjekk: `p < 0.5 ⇒ x < μ`; `p > 0.5 ⇒ x > μ`. Stemmer det ikke, har du glemt fortegnet på `z`."

  - label: "Invers: finn μ (eller σ)"
    steps:
      - "Identifiser det ukjente (`μ` eller `σ`) og hva som er gitt: typisk en grense `g` og en målsannsynlighet `p` (f.eks. `P(X < 300) = 0.001`, `σ = 5`)."
      - text: "Sett opp likningen:"
        formula: "G((g − μ)/σ) = p"
      - "Slå opp `z = G⁻¹(p)` i **tabell E.4** (Z-kvantiltabell). Husk at `p < 0.5` gir negativ `z` (f.eks. `p = 0.001 ⇒ z = −3.090`)."
      - text: "Løs for det ukjente (f.eks. `μ = 300 − 5·(−3.090) = 315.45`):"
        formula: "μ = g − σ · z     (eller   σ = (g − μ)/z)"
      - { text: "Retningssjekk for `μ`: hvis du vil at `P(X < g)` skal bli MINDRE, må `μ` flyttes OPP (lenger fra `g` på høyre side).", conditional: true }
      - { text: "Motsatt retning: hvis du vil at `P(X > g)` skal bli mindre, må `μ` flyttes NED (lenger fra `g` på venstre side).", conditional: true }

# Fallback for konsumenter som forventer flat liste — peker videre til faner over.
solution_template:
  - "Noter `μ`, `σ` og hva oppgaven spør om."
  - "Identifiser variant — se faner over: `P(X < x)`, `P(X > x)`, `P(a < X < b)`, eller invers."
  - text: "Standardiser, slå opp i **tabell E.3** (kumulativ) eller **tabell E.4** (kvantil):"
    formula: "Z = (X − μ)/σ"

common_traps: |
  - **Forveksle ikke `σ` (standardavvik) med `σ²` (varians).** Hvis oppgaven sier "varians 25", er `σ = 5`, ikke 25.
  - **`G(z)` gir arealet til VENSTRE.** For "større enn `z`", bruk `1 − G(z)`.
  - **Symmetri**: `G(−z) = 1 − G(z)`. Brukes for negative `z` hvis tabellen kun viser positive (vår tabell viser begge).
  - **Standardisering må gjøres riktig**: `Z = (X − μ)/σ`, ikke `(μ − X)/σ`. Sjekk fortegnet.
  - **Avrunding av `z`**: rund til 2 desimaler for å passe tabellen (`z = -2.08`, ikke `-2.0833`).
  - **Invers-oppgaver**: hvis `P(X < 300)` er liten (`< 0.5`) og verdien står til venstre for `μ`, må `z` være negativ. Ikke bare bruk `z` fra tabellen direkte; reflekter fortegnet.

python_snippet: |
  from scipy.stats import norm

  mu, sigma = 25, 0.48

  # P(X ≤ x)
  norm.cdf(24, loc=mu, scale=sigma)         # 0.0188

  # P(a < X ≤ b)
  norm.cdf(310, loc=302, scale=5) - norm.cdf(305, loc=302, scale=5)  # 0.2195

  # Invers: finn x slik at P(X ≤ x) = p
  norm.ppf(0.001, loc=300, scale=5)         # finne x for P(X<x)=0.001

detailed_solution_variants:
  - label: "P(X < x)"
    solutions:
      - source: "Eksamen jan25 · oppgave 5a"
        question: "Mengden kaffe X er normalfordelt med μ = 25 cl og σ = 0.48 cl. Finn `P(X < 24)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X ~ N(25, 0.48)`, terskel `x = 24`." }
          - label: "Standardisering"
            lines:
              - { text: "`P(X < 24) = P(Z < (24 − 25)/0.48)`" }
              - { indent: "`= P(Z < −2.0833) ≈ P(Z < −2.08)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(−2.08) ≈ 0.0188" } }
        result: "`P(X < 24) ≈ 0.0188` (om lag 1.9 % av koppene har mindre enn 24 cl)."

      - source: "Praksis · høyde, positiv z"
        question: "Voksenhøyde `X ~ N(170, 6²)` cm. Finn sannsynligheten for at en tilfeldig voksen er under 175 cm."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 170`, `σ = 6`, terskel `x = 175`." }
          - label: "Standardisering"
            lines:
              - { text: "`P(X < 175) = G((175 − 170)/6)`" }
              - { indent: "`= G(0.8333) ≈ G(0.83)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(0.83) ≈ 0.7967" } }
        result: "`P(X < 175) ≈ 0.7967` (om lag 80 % er under 175 cm)."

      - source: "Praksis · IQ, negativ z"
        question: "IQ er `X ~ N(100, 15²)`. Finn `P(X < 90)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 100`, `σ = 15`, terskel `x = 90` (under gjennomsnittet ⇒ negativ z)." }
          - label: "Standardisering"
            lines:
              - { text: "`P(X < 90) = G((90 − 100)/15)`" }
              - { indent: "`= G(−0.6667) ≈ G(−0.67)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(−0.67) ≈ 0.2514 (alternativt 1 − G(0.67) = 1 − 0.7486)" } }
        result: "`P(X < 90) ≈ 0.2514` (rundt 25 % har IQ under 90)."

  - label: "P(X > x)"
    solutions:
      - source: "Praksis · IQ-grense"
        question: "IQ er `X ~ N(100, 15²)`. Finn `P(X > 130)` (klassisk 'begavet'-grense)."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 100`, `σ = 15`, terskel `x = 130`. Vi vil ha høyrearealet, så bruk komplement." }
          - label: "Standardisering"
            lines:
              - { text: "`z = (130 − 100)/15 = 2.00`" }
              - { text: "`P(X > 130) = 1 − G(2.00)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(2.00) ≈ 0.9772" } }
              - { text: "`= 1 − 0.9772`" }
        result: "`P(X > 130) ≈ 0.0228` (vel 2 % har IQ over 130)."

      - source: "Praksis · høyde"
        question: "Voksenhøyde `X ~ N(170, 6²)` cm. Finn `P(X > 180)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 170`, `σ = 6`, terskel `x = 180`. Høyresidig hale ⇒ komplement." }
          - label: "Standardisering"
            lines:
              - { text: "`z = (180 − 170)/6 = 1.6667 ≈ 1.67`" }
              - { text: "`P(X > 180) = 1 − G(1.67)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(1.67) ≈ 0.9525" } }
              - { text: "`= 1 − 0.9525`" }
        result: "`P(X > 180) ≈ 0.0475` (knappe 5 % er over 180 cm)."

      - source: "Praksis · standardnormal"
        question: "`Z ~ N(0, 1)`. Finn `P(Z > 1.96)` — den klassiske tosidige 5 %-grensen."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`Z` er allerede standardisert (`μ = 0`, `σ = 1`), så ingen omregning trengs." }
          - label: "Innsetting"
            lines:
              - { text: "`P(Z > 1.96) = 1 − G(1.96)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(1.96) ≈ 0.9750" } }
              - { text: "`= 1 − 0.9750`" }
        result: "`P(Z > 1.96) ≈ 0.0250` (2.5 % i hver hale ⇒ 5 % tosidig)."

  - label: "P(a < X < b)"
    solutions:
      - source: "Eksamen mai25 · oppgave 4a"
        question: "Fyllingen `X` av såpebeholdere er `N(302, 5²)` ml. Finn `P(305 < X ≤ 310)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`X ~ N(302, 5)`, grenser `a = 305`, `b = 310`." }
          - label: "Standardisering"
            lines:
              - { text: "`P(305 < X ≤ 310) = G((310 − 302)/5) − G((305 − 302)/5)`" }
              - { indent: "`= G(1.6) − G(0.6)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(1.6) ≈ 0.9452" } }
              - { table_lookup: { ref: "E.3", text: "G(0.6) ≈ 0.7257" } }
              - { text: "`= 0.9452 − 0.7257`" }
        result: "`P(305 < X ≤ 310) ≈ 0.2195` (om lag 22 % av beholderne ligger i intervallet)."

      - source: "Praksis · ±1σ-regelen"
        question: "`X ~ N(μ, σ)`. Finn `P(μ − σ < X < μ + σ)` (den midtre delen av klokkekurven)."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Symmetrisk intervall rundt `μ`, bredde `2σ`." }
          - label: "Standardisering"
            lines:
              - { text: "`z_a = (μ − σ − μ)/σ = −1`, `z_b = (μ + σ − μ)/σ = 1`" }
              - { text: "`P(μ − σ < X < μ + σ) = G(1) − G(−1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(1) ≈ 0.8413" } }
              - { table_lookup: { ref: "E.3", text: "G(−1) ≈ 0.1587" } }
              - { text: "`= 0.8413 − 0.1587`" }
        result: "`≈ 0.6826` (den klassiske 68 %-regelen for ±1σ)."

      - source: "Praksis · IQ-bånd"
        question: "IQ er `X ~ N(100, 15²)`. Finn `P(85 < X < 115)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 100`, `σ = 15`. Intervallet `(85, 115)` er nettopp `μ ± σ`." }
          - label: "Standardisering"
            lines:
              - { text: "`z_a = (85 − 100)/15 = −1`, `z_b = (115 − 100)/15 = 1`" }
              - { text: "`P(85 < X < 115) = G(1) − G(−1)`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.3", text: "G(1) ≈ 0.8413" } }
              - { table_lookup: { ref: "E.3", text: "G(−1) ≈ 0.1587" } }
              - { text: "`= 0.8413 − 0.1587`" }
        result: "`≈ 0.6826` (omtrent to av tre har IQ i båndet 85–115)."

  - label: "Invers: finn x"
    solutions:
      - source: "Praksis · 95-persentil"
        question: "`X ~ N(60, 5²)`. Finn `x` slik at `P(X ≤ x) = 0.95`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 60`, `σ = 5`, mål `p = 0.95`. Vi trenger 95-kvantilet." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "Kvantilet for `P(Z ≤ z) = 0.95`: `z = 1.645`." } }
          - label: "Innsetting"
            lines:
              - { text: "`x = μ + σ · z = 60 + 5 · 1.645`" }
              - { indent: "`= 60 + 8.225`" }
        result: "`x ≈ 68.23` (95 % av X-verdiene ligger under denne grensen)."

      - source: "Praksis · IQ-toppen"
        question: "IQ er `X ~ N(100, 15²)`. Hvilken IQ-verdi overgår 99 % av befolkningen, dvs. `P(X ≤ x) = 0.99`?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 100`, `σ = 15`, mål `p = 0.99`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "Kvantilet for `P(Z ≤ z) = 0.99`: `z = 2.326`." } }
          - label: "Innsetting"
            lines:
              - { text: "`x = 100 + 15 · 2.326`" }
              - { indent: "`= 100 + 34.89`" }
        result: "`x ≈ 134.9` (kun 1 % av befolkningen har IQ over denne verdien)."

      - source: "Praksis · venstre hale"
        question: "`X ~ N(170, 6²)` cm. Finn nedre 10 %-grensen, dvs. `x` slik at `P(X ≤ x) = 0.10`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`μ = 170`, `σ = 6`, mål `p = 0.10`. Siden `p < 0.5` blir `z` negativ." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "Kvantilet for `P(Z ≤ z) = 0.10`: `z = −1.282` (bruk symmetri eller E.4 i `p`-modus)." } }
          - label: "Innsetting"
            lines:
              - { text: "`x = 170 + 6 · (−1.282)`" }
              - { indent: "`= 170 − 7.692`" }
        result: "`x ≈ 162.3` cm (én av ti er kortere enn dette)."

  - label: "Invers: finn μ (eller σ)"
    solutions:
      - source: "Eksamen mai25 · oppgave 4d"
        question: "Standardavviket er `σ = 5` ml. Hva må forventningsverdien `μ` være for at `P(X < 300) < 0.001`?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Vi setter likhet i grenseverdien: `P(X < 300) = 0.001`." }
              - { text: "`G((300 − μ)/5) = 0.001`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`G⁻¹(0.001) = −3.090` (siden `p < 0.5` er `z` negativ)." } }
          - label: "Innsetting"
            lines:
              - { text: "`300 = μ + 5·(−3.090) = μ − 15.45`" }
              - { text: "`μ = 300 + 15.45 = 315.45`" }
        result: "`μ ≥ 315.45` ml (`P(X < 300) < 0.001` for alle `μ` over denne grensen)."

      - source: "Praksis · finn σ"
        question: "`X ~ N(50, σ²)` med kjent `μ = 50`. Hvor stor må `σ` være for at `P(X < 40) = 0.05`?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Ukjent `σ`, gitt `μ = 50`, terskel `g = 40`, `p = 0.05`." }
              - { text: "`G((40 − 50)/σ) = 0.05`" }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`G⁻¹(0.05) = −1.645`." } }
          - label: "Innsetting"
            lines:
              - { text: "`40 = 50 + σ·(−1.645) = 50 − 1.645·σ`" }
              - { text: "`1.645·σ = 50 − 40 = 10`" }
              - { text: "`σ = 10 / 1.645`" }
        result: "`σ ≈ 6.08` (større σ ⇒ mer spredning og høyere P(X < 40))."

      - source: "Praksis · spec-grense"
        question: "Fyllemaskin har `σ = 5` ml. Hva må `μ` være for at minst 95 % av flaskene har `≥ 100` ml?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`P(X ≥ 100) ≥ 0.95` ⇔ `P(X < 100) ≤ 0.05`." }
              - { text: "Sett likhet i grensen: `G((100 − μ)/5) = 0.05`." }
          - label: "Tabelloppslag"
            lines:
              - { table_lookup: { ref: "E.4", text: "`G⁻¹(0.05) = −1.645`." } }
          - label: "Innsetting"
            lines:
              - { text: "`100 = μ + 5·(−1.645) = μ − 8.225`" }
              - { text: "`μ = 100 + 8.225 = 108.225`" }
