id: normalisering
term_no: Standardnormalisering
short_def: "`Z = (X − μ)/σ` — gjør om en normalfordelt `X` til standardnormal `Z ~ N(0, 1)`."
filters:
  distribution_assumption: [normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4]
  computes: [exact_probability, range_probability, find_x_for_threshold, hypothesis_test]
  structural_cues: [normal_assumed, mean_and_sd_given]
  parameters_known: [mean_known, population_variance_known]
aliases:
  - standardnormalisering
  - standardnormal
  - standardnormalfordeling
  - standardnormalfordelingen
long_def: |
  Også kalt **standardnormalisering**. Trikset for å bruke z-tabellen E.3:
  hvis `X ~ N(μ, σ)`, så er

      Z = (X − μ) / σ ~ N(0, 1)

  og dermed:

      P(X ≤ x) = G( (x − μ) / σ )

  Samme idé brukes i nesten alle z-tester: **standardiser → slå opp → sammenlign**.

  **Brukes for:**

  - Sannsynlighetsberegning fra vilkårlig `N(μ, σ)` via tabellen.
  - Z-test (testobservatoren er standardnormalisert).
  - KI for `μ` med kjent `σ` (`z_(α/2)` er kvantil i standardnormal).
