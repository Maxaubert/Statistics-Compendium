id: gjennomsnitt
term_no: Gjennomsnitt (X̄, μ)
short_def: "Summen av observasjoner delt på antallet — det aritmetiske midlet."
filters:
  random_variable: [mean_of_samples, difference_of_means]
  computes: [expected_value, parameter_estimate, confidence_interval, hypothesis_test]
  setup: [single_population, two_independent_samples]
  structural_cues: [data_as_list]
  parameters_known: [sample_size_large]
  distribution_assumption: [normal]
long_def: |
  **Utvalgsgjennomsnitt** (trenger rådata):

      X̄ = (1/n) · Σ xᵢ

  **Forventningsverdi** (populasjon, en parameter):

      μ = E[X]

  Sentralgrenseteoremet: `X̄` er tilnærmet `N(μ, σ/√n)` for store `n`,
  uansett hvilken fordeling `Xᵢ` har. Spredningen i selve `X̄` er
  derfor `σ/√n` — se variansen til utvalgsgjennomsnittet.
see_also:
  - { id: diskret-stokastisk-variabel, kind: entry }
  - { id: sentralgrenseteoremet-glos, kind: glossary }
