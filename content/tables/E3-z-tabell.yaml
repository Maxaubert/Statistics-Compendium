id: E3-z-tabell
name_no: Z-tabell
formal_name_no: "Kumulativ standardnormalfordeling"
code: "E.3"
description: "Slår opp G(z) = P(Z ≤ z) for en gitt z-verdi. Brukes for å konvertere standardiserte normalverdier til sannsynligheter."
inputs:
  - { name: "z", type: number, min: -3.99, max: 3.99, step: any }
output: "G(z) = P(Z ≤ z)"
distribution: normal_cumulative
toggle_label: "z → p"
input_hint: "Sett inn standardisert verdi z. Får arealet til VENSTRE for z."
inverse:
  inputs:
    - { name: "p", type: number, min: 0.0001, max: 0.9999, step: any }
  output: "z slik at G(z) = p"
  toggle_label: "p → z"
  input_hint: "Sett inn kumulativ sannsynlighet p (venstre hale). Får z slik at P(Z ≤ z) = p."
related_entries:
  - normalfordeling
  - en-utvalg-z-test
  - standardnormalisering
  - sum-uavhengige-normaler
  - p-verdi
