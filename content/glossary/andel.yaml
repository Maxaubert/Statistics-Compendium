id: andel
term_no: Andel (p, p̂)
short_def: "Brøkdelen av en populasjon (`p`) eller et utvalg (`p̂ = X/n`) som har en bestemt egenskap."
filters:
  random_variable: [proportion]
  parameters_known: [success_p, alpha_significance]
  distribution_assumption: [binomial, normal]
  computes: [confidence_interval, hypothesis_test, parameter_estimate]
  setup: [single_population]
  structural_cues: [success_probability_given]
long_def: |
  `p` er populasjonsandelen — det vi prøver å estimere. `p̂` er
  utvalgsandelen — antall «suksesser» delt på antall observasjoner:

      p̂ = X / n

  **KI for andel** (krever `n·p̂·(1−p̂) ≥ 5`):

      p̂ ± z_(α/2) · √( p̂(1−p̂) / n )

  **Testobservator:**

      Z = (p̂ − p₀) / √( p₀(1−p₀) / n )
aliases:
  - andel
  - andelen
  - andeler
  - andelene
  - utvalgsandel
  - utvalgsandelen
  - populasjonsandel
  - populasjonsandelen
see_also:
