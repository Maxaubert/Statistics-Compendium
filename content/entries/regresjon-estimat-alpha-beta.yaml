id: regresjon-estimat-alpha-beta
name_no: "Lineær regresjon – estimater for α og β"
type: regression
category: regression_estimate
tagline: "Punktestimater for skjæringspunktet `α̂` og stigningstallet `β̂` i `ŷ = α̂ + β̂·x`."

formula_main: "β̂ = Σ(x_i - x̄)(y_i - ȳ) / Σ(x_i - x̄)²;  α̂ = ȳ - β̂·x̄"
formula_latex: "\\hat{\\beta} = \\frac{\\sum (x_i - \\bar{x})(y_i - \\bar{y})}{\\sum (x_i - \\bar{x})^2}, \\quad \\hat{\\alpha} = \\bar{y} - \\hat{\\beta} \\bar{x}"

what_it_does: |
  Beregner minste-kvadraters-estimater for parametrene i en enkel
  lineær regresjon `ŷ = α̂ + β̂·x`. `β̂` er stigningstallet (hvor mye `y` endres
  per enhet `x`), `α̂` er skjæringspunktet (verdi av `y` når `x = 0`).

why_use: |
  Første steg i enhver enkel lineær regresjonsanalyse. Gir den "beste"
  rette linjen gjennom datapunktene (i forstand av minste sum av kvadrerte
  residualer).

recognition_cues:
  - "Du har `n` par av observasjoner `(x_i, y_i)`"
  - "Du skal finne en lineær sammenheng `y = α + β·x` fra data"
  - "Spørsmålet ber om 'estimer regresjonslinjen' eller 'finn `ŷ`'"
  - "Datatabell med `Σ(x−x̄)²`, `Σ(x−x̄)(y−ȳ)` er typisk gitt"

when_NOT_to_use:
  - "Sammenhengen er åpenbart ikke-lineær (kurvet, eksponentiell, osv.) — vurder transformasjon eller polynomregresjon"
  - "Du vil teste om sammenhengen er signifikant → bruk [hypotesetest for β](/entry/regresjon-test-stigningstall) etter du har `β̂`"
  - "Du vil bare måle styrken på sammenhengen → bruk [korrelasjonskoeffisient r](/entry/regresjon-korrelasjonskoeffisient)"
  - "Du vil predikere en enkelt `y`-verdi → først `α̂, β̂`, så [prediksjonsintervall](/entry/regresjon-prediksjonsintervall)"

symbols:
  - { sym: "x_i, y_i",      means: "observasjonsparene" }
  - { sym: "x̄, ȳ",         means: "gjennomsnitt av `x` og `y`" }
  - { sym: "α̂",            means: "estimat for skjæringspunktet (intercept)" }
  - { sym: "β̂",            means: "estimat for stigningstallet (slope)" }
  - { sym: "S_XX",          means: "`Σ(x_i − x̄)²` (sum av kvadrerte avvik for `x`)" }
  - { sym: "S_XY",          means: "`Σ(x_i − x̄)(y_i − ȳ)` (krysssum)" }

filters:
  computes: [parameter_estimate]
  random_variable: [slope_estimate, continuous]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list, summary_stats_given, total_observations_n]
  parameters_known: [sum_xx_sxy]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_template:
  - "Beregn `x̄` og `ȳ`"
  - text: "Beregn mellom-summene `S_XX` og `S_XY`."
    formula: "S_XX = Σ(x_i − x̄)²     S_XY = Σ(x_i − x̄)(y_i − ȳ)"
  - text: "Beregn stigningstallet."
    formula: "β̂ = S_XY / S_XX"
  - text: "Beregn skjæringspunktet."
    formula: "α̂ = ȳ − β̂·x̄"
  - text: "Eksempel: `S_XX = 15.6`, `S_XY = 103.4`, `x̄ = 6.8`, `ȳ = 79.7`:"
    formula: "β̂ = 103.4/15.6 ≈ 6.63;  α̂ = 79.7 − 6.63·6.8 ≈ 34.62"
    example: true
  - text: "Skriv regresjonslinjen."
    formula: "ŷ = α̂ + β̂·x"

common_traps: |
  - **Krysssum vs. produktsum**: `S_XY = Σ(x_i − x̄)(y_i − ȳ)` er IKKE det samme
    som `Σx_i·y_i`. Hvis bare `Σx_i·y_i` er gitt, omform:
    `Σ(x_i − x̄)(y_i − ȳ) = Σx_i·y_i − n·x̄·ȳ`. Tilsvarende:
    `S_XX = Σx_i² − n·x̄²`.
  - **Bytt ikke om `x` og `y`**: `β̂_(y|x) = S_XY/S_XX` er hva som forklarer `y`
    fra `x`. Bytter du roller, får du en annen linje (`β̂_(x|y) = S_XY/S_YY`),
    ikke bare den inverse helningen.
  - **Linjen går gjennom `(x̄, ȳ)`**: bruk dette som sanity-sjekk. Hvis
    `ŷ(x̄) ≠ ȳ`, har du regnet `α̂` feil.
  - **Ekstrapolering**: regresjonslinjen gjelder kun innenfor det `x`-intervallet
    dataene dekker. Predikere langt utenfor (negativ `x`, eller `x` 10x større
    enn maks) er statistisk uforsvarlig selv om formelen gir et tall.
  - **Enheter**: `β̂` har enhet `(enhet av y)/(enhet av x)`. Sjekk dette mot
    konteksten — det avslører ofte regnefeil med faktor 10.

python_snippet: |
  import numpy as np

  x = np.array([5,6,7,8,6,7,8,5,9,7])
  y = np.array([68,75,80,85,72,78,92,70,95,82])
  x_bar, y_bar = x.mean(), y.mean()    # 6.8, 79.7

  Sxx = ((x - x_bar) ** 2).sum()         # 15.6
  Sxy = ((x - x_bar) * (y - y_bar)).sum()  # 103.4

  beta_hat = Sxy / Sxx                   # 6.63
  alpha_hat = y_bar - beta_hat * x_bar   # 34.6

detailed_solution_variants:
  - label: "Estimater α̂ og β̂"
    solutions:
      - source: "Eksamen mai25 · oppgave 5c"
        question: "Fra datatabellen oppgis: `Σ(x_i - x̄)² = 15.6`, `Σ(x_i - x̄)(y_i - ȳ) = 103.4`, `x̄ = 6.8`, `ȳ = 79.7`. Finn den estimerte regresjonslinjen `ŷ = α̂ + β̂·x`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Datasett med `n = 10` par `(x_i, y_i)`. Mellom-summene er allerede oppgitt i tabellen." }
          - label: "Mellom-summer"
            lines:
              - { text: "`x̄ = 6.8`, `ȳ = 79.7` (gitt)" }
              - { text: "`S_XX = Σ(x_i - x̄)² = 15.6`" }
              - { text: "`S_XY = Σ(x_i - x̄)(y_i - ȳ) = 103.4`" }
          - label: "Estimater"
            lines:
              - { text: "`β̂ = S_XY / S_XX = 103.4 / 15.6`" }
              - { indent: "`= 6.628...`" }
              - { indent: "`≈ 6.63`" }
              - { text: "`α̂ = ȳ - β̂·x̄ = 79.7 - 6.63·6.8`" }
              - { indent: "`= 79.7 - 45.08`" }
              - { indent: "`≈ 34.62`" }
          - label: "Linjelikning"
            lines:
              - { text: "Setter inn estimatene i `ŷ = α̂ + β̂·x`:" }
              - { indent: "`ŷ = 34.62 + 6.63·x`" }
        result: "`ŷ = 34.62 + 6.63·x`"

      - source: "Praksis · 5 datapunkter"
        question: "Gitt datapunktene `(1, 2)`, `(2, 3)`, `(3, 5)`, `(4, 6)`, `(5, 8)`. Estimer `α̂` og `β̂` i den enkle lineære regresjonsmodellen `ŷ = α̂ + β̂·x`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 5` par `(x_i, y_i)`: `(1,2)`, `(2,3)`, `(3,5)`, `(4,6)`, `(5,8)`." }
              - { text: "Vi må regne ut mellom-summene fra rådata." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gjennomsnitt:" }
              - { indent: "`x̄ = (1+2+3+4+5)/5 = 15/5 = 3`" }
              - { indent: "`ȳ = (2+3+5+6+8)/5 = 24/5 = 4.8`" }
              - { text: "Sum av kvadrater og krysssum:" }
              - { indent: "`Σx_i² = 1 + 4 + 9 + 16 + 25 = 55`" }
              - { indent: "`Σx_i·y_i = 2 + 6 + 15 + 24 + 40 = 87`" }
              - { text: "Bruker beregningsformlene:" }
              - { indent: "`S_XX = Σx_i² - n·x̄² = 55 - 5·9 = 10`" }
              - { indent: "`S_XY = Σx_i·y_i - n·x̄·ȳ = 87 - 5·3·4.8 = 87 - 72 = 15`" }
          - label: "Estimater"
            lines:
              - { text: "`β̂ = S_XY / S_XX = 15 / 10 = 1.5`" }
              - { text: "`α̂ = ȳ - β̂·x̄ = 4.8 - 1.5·3`" }
              - { indent: "`= 4.8 - 4.5 = 0.3`" }
          - label: "Linjelikning"
            lines:
              - { text: "Setter inn i `ŷ = α̂ + β̂·x`:" }
              - { indent: "`ŷ = 0.3 + 1.5·x`" }
        result: "`α̂ = 0.3`, `β̂ = 1.5`, `ŷ = 0.3 + 1.5·x`"

      - source: "Praksis · lab-data (strekk vs. last)"
        question: "I et fysikkforsøk måles forlengelsen `y` (mm) av en fjær for ulike laster `x` (N). Data: `(2, 4.2)`, `(4, 7.8)`, `(6, 12.1)`, `(8, 15.9)`. Finn regresjonslinjen `ŷ = α̂ + β̂·x`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "`n = 4` målepar `(x_i, y_i)` fra fjærforsøk." }
              - { text: "Hooke's lov antyder lineær sammenheng `y ≈ β·x` (med `α ≈ 0` ideelt sett)." }
          - label: "Mellom-summer"
            lines:
              - { text: "Gjennomsnitt:" }
              - { indent: "`x̄ = (2+4+6+8)/4 = 20/4 = 5`" }
              - { indent: "`ȳ = (4.2+7.8+12.1+15.9)/4 = 40.0/4 = 10.0`" }
              - { text: "Sum av kvadrater og krysssum:" }
              - { indent: "`Σx_i² = 4 + 16 + 36 + 64 = 120`" }
              - { indent: "`Σx_i·y_i = 2·4.2 + 4·7.8 + 6·12.1 + 8·15.9`" }
              - { indent: "`= 8.4 + 31.2 + 72.6 + 127.2 = 239.4`" }
              - { text: "Beregningsformler:" }
              - { indent: "`S_XX = Σx_i² - n·x̄² = 120 - 4·25 = 20`" }
              - { indent: "`S_XY = Σx_i·y_i - n·x̄·ȳ = 239.4 - 4·5·10 = 239.4 - 200 = 39.4`" }
          - label: "Estimater"
            lines:
              - { text: "`β̂ = S_XY / S_XX = 39.4 / 20 = 1.97`" }
              - { text: "`α̂ = ȳ - β̂·x̄ = 10.0 - 1.97·5`" }
              - { indent: "`= 10.0 - 9.85 = 0.15`" }
          - label: "Linjelikning"
            lines:
              - { text: "Setter inn estimatene:" }
              - { indent: "`ŷ = 0.15 + 1.97·x`" }
        result: "`α̂ ≈ 0.15`, `β̂ ≈ 1.97`, `ŷ = 0.15 + 1.97·x`"

