id: eksponential-fordeling
name_no: Eksponentialfordeling
type: distribution
category: continuous_distribution
tagline: "Tiden mellom hendelser i en poissonprosess (ventetidsfordelingen)."

formula_main: "f(t) = λ · e^(-λt) (tetthet),  F(t) = 1 - e^(-λt) (kumulativ)"
formula_latex: "f(t) = \\lambda e^{-\\lambda t}, \\quad F(t) = 1 - e^{-\\lambda t}"

what_it_does: |
  Modellerer ventetiden T fra et tilfeldig punkt i en poissonprosess til
  neste hendelse, eller mellom to påfølgende hendelser. Verdien er
  kontinuerlig og positiv (T > 0).

why_use: |
  Når problemet handler om TID TIL noe skjer (i kontrast til antall ting
  som skjer), og vi vet eller antar at hendelsene følger en poissonprosess.
  Tett knyttet sammen med Poissonfordeling: hvis antall hendelser er
  Poisson(λt), så er ventetiden eksponentialfordelt med parameter λ.

recognition_cues:
  - "Spørsmålet handler om tid TIL første hendelse, eller mellom to hendelser"
  - "T er en kontinuerlig stokastisk variabel (positivt reelt tall)"
  - "Det er allerede etablert i oppgaven at hendelsene er en poissonprosess"
  - "Spørsmålet er på formen P(T > t), P(T < t) eller P(a < T < b)"
  - "Rate λ er gitt"

when_NOT_to_use:
  - "Spørsmålet teller hendelser i et fast vindu → bruk Poissonfordeling"
  - "Tiden er ikke knyttet til en poissonprosess → annen kontinuerlig fordeling"

symbols:
  - { sym: "λ",  means: "rate (samme λ som i den underliggende poissonprosessen)" }
  - { sym: "t",  means: "ventetiden (alltid > 0)" }
  - { sym: "f(t)", means: "sannsynlighetstettheten – areal under = sannsynlighet" }
  - { sym: "F(t)", means: "kumulativ fordelingsfunksjon, P(T ≤ t)" }
  - { sym: "e",  means: "Eulers tall ≈ 2.71828" }

properties:
  expected_value: "E[T] = 1/λ"
  variance: "Var[T] = 1/λ²"
  std_dev: "σ = 1/λ"

filters:
  computes: [exact_probability, range_probability, expected_value, find_x_for_threshold]
  random_variable: [continuous, time_until_event]
  setup: [single_population, events_in_window]
  structural_cues: [rate_given, process_over_time, independent_events, poisson_process_mentioned, time_until_first, complement_pattern]
  parameters_known: [rate_lambda]
  distribution_assumption: [exponential]
  tooling: [calculator_exp]

solution_variants:
  - label: "P(T > t) — overlevelse (ingen hendelse innen t)"
    steps:
      - "Bekreft at problemet handler om tid TIL første hendelse i en poissonprosess, og at spørsmålet er på formen 'ingen hendelse innen t' eller 'T større enn t'"
      - "Identifiser raten `λ` og noter enheten (per minutt, per time, per år, ...)"
      - { text: "Hvis raten er gitt per time men spørsmålet er per minutt (eller motsatt), konvertér først slik at `λ` og `t` har samme tidsenhet", conditional: true }
      - "Bruk overlevelsesformelen direkte: `P(T > t) = e^(−λt)`"
      - "Sett inn tall og regn ut (f.eks. `λ = 1/15` per min, `t = 30` → `P(T > 30) = e^(−2) ≈ 0.135`)"
      - "Sjekk at svaret er mellom 0 og 1, og at det går mot 0 når `t` blir stort"

  - label: "P(T < t) — hendelse innen t"
    steps:
      - "Bekreft at spørsmålet er 'minst én hendelse innen t', 'hendelsen skjer før t', eller 'ventetiden er kortere enn t'"
      - "Identifiser raten `λ` og pass på at `t` er i samme tidsenhet"
      - { text: "Hvis raten er gitt per time men spørsmålet er per minutt (eller motsatt), konvertér først", conditional: true }
      - "Bruk kumulativ fordelingsfunksjon: `F(t) = P(T < t) = 1 − e^(−λt)`"
      - "Sett inn tall og regn ut (f.eks. `λ = 0.01` per time, `t = 48` → `P(T < 48) = 1 − e^(−0.48) ≈ 0.381`)"
      - { text: "Alternativt: regn først `P(T > t) = e^(−λt)` og bruk komplementregelen `P(T < t) = 1 − P(T > t)`. Nyttig hvis du allerede har overlevelsen", conditional: true }
      - "Sjekk at svaret er mellom 0 og 1, og at det går mot 1 når `t` blir stort"

  - label: "P(a < T < b) — intervall"
    steps:
      - "Bekreft at spørsmålet ber om sannsynligheten for at ventetiden faller i et intervall `(a, b)`"
      - "Identifiser `λ`, `a` og `b`, alle med samme tidsenhet"
      - { text: "Hvis intervallets endepunkter er i en annen enhet enn raten, konvertér først", conditional: true }
      - "Bruk differansen av to kumulative: `P(a < T < b) = F(b) − F(a) = e^(−λa) − e^(−λb)`"
      - "Sett inn og regn ut (f.eks. `λ = 1/10` per min, `a = 5`, `b = 15` → `e^(−0.5) − e^(−1.5) ≈ 0.607 − 0.223 = 0.384`)"
      - "Sjekk at `b > a` og at svaret er positivt og mindre enn både `P(T > a)` og `P(T < b)`"

  - label: "Memoryless (gitt at det ikke har skjedd noe i s minutter)"
    steps:
      - { text: "Hvis spørsmålet sier 'gitt at det ikke har skjedd noe i de siste s minutter, hva er sannsynligheten for å vente t til', bruk memoryless-egenskapen i stedet for å betinget regne på vanlig måte", conditional: true }
      - "Memoryless-egenskapen: `P(T > s + t | T > s) = P(T > t)` — fortiden 'glemmes', bare den nye ventetiden `t` betyr noe"
      - "Identifiser `λ` og den nye ventetiden `t` (ikke `s + t`); `s` brukes ikke i utregningen"
      - { text: "Hvis raten og `t` er i ulike enheter, konvertér først", conditional: true }
      - "Bruk overlevelsesformelen på `t` alene: `P(T > t) = e^(−λt)`"
      - "Sett inn tall (f.eks. `λ = 1/15` per min, har ventet `s = 20` min uten hendelse, vil vente `t = 10` min til → `P = e^(−10/15) ≈ 0.513`)"
      - "Tolk: ventetidsfordelingen 'starter på nytt' hvert øyeblikk uten hendelse — typisk for poissonprosesser"

common_traps: |
  Eksponentialfordeling og Poissonfordeling deler samme λ men måler ulike
  ting: Poisson teller hendelser, eksponential måler ventetid. Dobbelsjekk
  at oppgaven faktisk spør om TID, ikke ANTALL. P(T > t) (overlevelse) er
  e^(-λt), ikke 1 - e^(-λt). Husk samme tidsenhet som raten.

python_snippet: |
  from scipy.stats import expon

  lam = 0.01    # rate pr. time
  t = 48        # timer

  # P(T > t) = e^(-λt)
  expon.sf(t, scale=1/lam)        # 0.6188

  # P(T ≤ t) = 1 - e^(-λt)
  expon.cdf(t, scale=1/lam)       # 0.3812

detailed_solution_variants:
  - label: "P(T > t) — overlevelse (ingen hendelse innen t)"
    solutions:
      - source: "Praksis · Lyspære med forventet levetid"
        question: "En lyspære har forventet levetid på 1000 timer. Hva er sannsynligheten for at den varer i mer enn 1500 timer?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = levetid (tid til pæren brenner)" }
              - { text: "`E[T] = 1000` t  ⇒  `λ = 1/1000 = 0.001` per time" }
              - { text: "T ~ Eksponential(`λ = 0.001`)" }
              - { comment: "spørres om `P(T > 1500)`" }
          - label: "Formel"
            lines:
              - { text: "`P(T > t) = e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(T > 1500) = e^(−0.001 · 1500)`" }
              - { indent: "`= e^(−1.5)`" }
              - { indent: "`≈ 0.2231`" }
        result: "`P(T > 1500) ≈ 0.2231`"

      - source: "Praksis · Kundeankomster i butikk"
        question: "Kunder kommer til en butikk med rate 0.1 per minutt. Hva er sannsynligheten for at det ikke kommer noen kunde i løpet av de neste 30 minuttene?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til neste kundeankomst" }
              - { text: "`λ = 0.1` per minutt" }
              - { text: "T ~ Eksponential(`λ = 0.1`)" }
              - { comment: "ingen kunde i 30 min  ⇔  `P(T > 30)`" }
          - label: "Formel"
            lines:
              - { text: "`P(T > t) = e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(T > 30) = e^(−0.1 · 30)`" }
              - { indent: "`= e^(−3)`" }
              - { indent: "`≈ 0.0498`" }
        result: "`P(T > 30) ≈ 0.0498`"

      - source: "Praksis · Komponentens MTBF"
        question: "En komponent har MTBF (mean time between failures) på 5 år. Hva er sannsynligheten for at den fungerer i mer enn 10 år uten feil?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til feil" }
              - { text: "`MTBF = E[T] = 5` år  ⇒  `λ = 1/5 = 0.2` per år" }
              - { text: "T ~ Eksponential(`λ = 0.2`)" }
              - { comment: "spørres om `P(T > 10)`" }
          - label: "Formel"
            lines:
              - { text: "`P(T > t) = e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(T > 10) = e^(−0.2 · 10)`" }
              - { indent: "`= e^(−2)`" }
              - { indent: "`≈ 0.1353`" }
        result: "`P(T > 10) ≈ 0.1353`"

  - label: "P(T < t) — hendelse innen t"
    solutions:
      - source: "Praksis · Anropssenter — første anrop"
        question: "Anrop kommer til et anropssenter med rate 0.1 per minutt. Hva er sannsynligheten for at det første anropet kommer innen 5 minutter?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til første anrop" }
              - { text: "`λ = 0.1` per minutt" }
              - { text: "T ~ Eksponential(`λ = 0.1`)" }
              - { comment: "spørres om `P(T < 5)`" }
          - label: "Formel"
            lines:
              - { text: "`F(t) = P(T < t) = 1 − e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(T < 5) = 1 − e^(−0.1 · 5)`" }
              - { indent: "`= 1 − e^(−0.5)`" }
              - { indent: "`≈ 1 − 0.6065`" }
              - { indent: "`≈ 0.3935`" }
        result: "`P(T < 5) ≈ 0.3935`"

      - source: "Praksis · Vulkanutbrudd"
        question: "Vulkanutbrudd skjer i et område med rate 0.5 per år (poissonprosess). Hva er sannsynligheten for at det kommer et utbrudd innen ett år?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til neste utbrudd" }
              - { text: "`λ = 0.5` per år" }
              - { text: "T ~ Eksponential(`λ = 0.5`)" }
              - { comment: "spørres om `P(T < 1)`" }
          - label: "Formel"
            lines:
              - { text: "`F(t) = 1 − e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(T < 1) = 1 − e^(−0.5 · 1)`" }
              - { indent: "`= 1 − e^(−0.5)`" }
              - { indent: "`≈ 1 − 0.6065`" }
              - { indent: "`≈ 0.3935`" }
          - label: "Sjekk"
            lines:
              - { comment: "samme som via Poisson: `P(X ≥ 1) = 1 − e^(−0.5)`" }
        result: "`P(T < 1) ≈ 0.3935`"

  - label: "P(a < T < b) — intervall"
    solutions:
      - source: "Praksis · Bussintervall"
        question: "Busser ankommer holdeplassen som en poissonprosess med rate 6 per time. Hva er sannsynligheten for at neste buss kommer mellom 10 og 30 minutter fra nå?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til neste buss" }
              - { text: "rate gitt per time: `6/time`  ⇒  per minutt: `λ = 6/60 = 0.1` per min" }
              - { text: "T ~ Eksponential(`λ = 0.1` per min)" }
              - { comment: "spørres om `P(10 < T < 30)`" }
          - label: "Formel"
            lines:
              - { text: "`P(a < T < b) = F(b) − F(a) = e^(−λa) − e^(−λb)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(10 < T < 30) = e^(−0.1 · 10) − e^(−0.1 · 30)`" }
              - { indent: "`= e^(−1) − e^(−3)`" }
              - { indent: "`≈ 0.3679 − 0.0498`" }
              - { indent: "`≈ 0.3181`" }
        result: "`P(10 < T < 30) ≈ 0.3181`"

      - source: "Praksis · Anropssenter — intervall"
        question: "Anrop kommer med rate 0.5 per minutt. Hva er sannsynligheten for at neste anrop kommer mellom 2 og 5 minutter fra nå?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til neste anrop" }
              - { text: "`λ = 0.5` per minutt" }
              - { text: "T ~ Eksponential(`λ = 0.5`)" }
              - { comment: "spørres om `P(2 < T < 5)`" }
          - label: "Formel"
            lines:
              - { text: "`P(a < T < b) = e^(−λa) − e^(−λb)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(2 < T < 5) = e^(−0.5 · 2) − e^(−0.5 · 5)`" }
              - { indent: "`= e^(−1) − e^(−2.5)`" }
              - { indent: "`≈ 0.3679 − 0.0821`" }
              - { indent: "`≈ 0.2858`" }
        result: "`P(2 < T < 5) ≈ 0.2858`"

  - label: "Memoryless (gitt at det ikke har skjedd noe i s minutter)"
    solutions:
      - source: "Praksis · Klassisk kundeankomster"
        question: "Kunder kommer med rate 0.1 per minutt. Det har ikke kommet noen kunde de siste 5 minuttene. Hva er sannsynligheten for at vi må vente i mer enn 10 minutter til?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = tid til neste kunde" }
              - { text: "`λ = 0.1` per minutt, `s = 5` (fortid), `t = 10` (ny ventetid)" }
              - { comment: "memoryless: `P(T > s + t | T > s) = P(T > t)`" }
              - { comment: "`s = 5` brukes ikke i utregningen" }
          - label: "Formel"
            lines:
              - { text: "`P(T > t) = e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(må vente > 10 min til) = P(T > 10) = e^(−0.1 · 10)`" }
              - { indent: "`= e^(−1)`" }
              - { indent: "`≈ 0.3679`" }
          - label: "Tolkning"
            lines:
              - { comment: "fordelingen 'starter på nytt' — de 5 minuttene som har gått teller ikke" }
        result: "`P(T > 10 | T > 5) = e^(−1) ≈ 0.3679`"

      - source: "Praksis · Lyspære som har kjørt i 500 timer"
        question: "En lyspære har forventet levetid 1000 timer (`λ = 0.001` per time). Den har allerede vært i drift i 500 timer uten å brenne. Hva er sannsynligheten for at den varer i minst 1500 timer til?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "T = total levetid" }
              - { text: "`λ = 0.001` per time, `s = 500` (allerede brukt), `t = 1500` (gjenstående)" }
              - { comment: "memoryless: `P(T > s + t | T > s) = P(T > t)`" }
          - label: "Formel"
            lines:
              - { text: "`P(T > t) = e^(−λt)`" }
          - label: "Innsatt"
            lines:
              - { text: "`P(varer ≥ 1500 t til) = P(T > 1500) = e^(−0.001 · 1500)`" }
              - { indent: "`= e^(−1.5)`" }
              - { indent: "`≈ 0.2231`" }
          - label: "Tolkning"
            lines:
              - { comment: "pæren 'husker ikke' de 500 timene den allerede har brent" }
              - { comment: "i praksis er ikke pærer memoryless — slitasje gjør at modellen er en idealisering" }
        result: "`P(T > 1500 | T > 500) = e^(−1.5) ≈ 0.2231`"

