id: kovarians-glos
term_no: Kovarians (Cov)
short_def: "Mål på hvor mye to variabler beveger seg sammen — positiv = samme retning, negativ = motsatt."
filters:
  computes: [covariance, correlation]
  setup: [linear_relationship, joint_table_given]
  structural_cues: [linear_relationship_suspected, joint_table_present, data_as_list]
long_def: |
  Formel:

      Cov(X, Y) = E[XY] − μ_X · μ_Y

  Null kovarians betyr ingen lineær sammenheng (men kan ha annen
  sammenheng). Skalaavhengig: bytter du enhet, endres tallet.
  Korrelasjon er kovarians normalisert til `[−1, 1]`.
aliases:
  - kovarians
  - kovariansen
  - kovarianser
  - kovariansene
  - samvariasjon
  - samvariasjonen
see_also:
