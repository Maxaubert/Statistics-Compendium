id: hypergeometrisk-fordeling
name_no: Hypergeometrisk fordeling
type: distribution
category: discrete_distribution
tagline: "Antall 'vellykkede' i et utplukk uten tilbakelegging fra endelig pott."

formula_main: "P(X = k) = C(K, k) · C(N-K, n-k) / C(N, n)"
formula_latex: "P(X = k) = \\frac{\\binom{K}{k} \\binom{N-K}{n-k}}{\\binom{N}{n}}"

what_it_does: |
  Modellerer antall "vellykkede" trekninger når man trekker `n` elementer
  uten tilbakelegging fra en endelig populasjon med `N` elementer, hvorav
  `K` er "vellykkede".

why_use: |
  Korrekt fordeling for trekning fra endelig pott uten tilbakelegging,
  for eksempel kortspill, utplukk av varer fra en kasse, kvalitetskontroll.
  Skiller seg fra binomial nettopp ved at `p` endrer seg etter hver trekning.

recognition_cues:
  - "Trekker fra endelig populasjon UTEN tilbakelegging"
  - "Det er gitt et antall `N` totalt og `K` 'vellykkede' i populasjonen"
  - "Du trekker `n` stykker"
  - "Spørsmålet handler om antall vellykkede `k` blant de `n` trukne"
  - "I praksis: trekninger ut av en hatt, kort fra kortstokk, utplukk av varer"

when_NOT_to_use:
  - "Trekker MED tilbakelegging eller fra uendelig populasjon → bruk [binomial](/entry/binomial-fordeling) i stedet"
  - "Antall trekninger er ikke fastlagt → vurder geometrisk eller annet"
  - "`n/N` er liten (`< 5%`) – da er [binomial](/entry/binomial-fordeling) en god tilnærming"

symbols:
  - { sym: "X",  means: "antall vellykkede i de `n` trekningene, `X ~ Hyp(N, K, n)`" }
  - { sym: "N",  means: "total antall i populasjonen" }
  - { sym: "K",  means: "antall 'vellykkede' i populasjonen" }
  - { sym: "n",  means: "antall trekninger" }
  - { sym: "k",  means: "antall vellykkede blant de `n` trukne (det vi spør om)" }
  - { sym: "C(a,b)", means: "binomialkoeffisient `a` over `b`" }
  - { sym: "σ",  means: "standardavviket, `σ = √Var[X]`" }

properties:
  expected_value: "E[X] = n · K/N"
  variance: "Var[X] = n · K/N · (N-K)/N · (N-n)/(N-1)"
  std_dev: "σ = √(Var[X])"

filters:
  computes: [exact_probability, at_least_k, range_probability, combinatorial_count, expected_value]
  random_variable: [discrete_count]
  setup: [single_population, without_replacement, finite_pool, fixed_n_trials]
  structural_cues: [two_outcomes_per_trial, complement_pattern, counting_events, mixed_categories, no_occurrences]
  parameters_known: [success_p]
  distribution_assumption: [hypergeometric]
  tooling: [calculator_binomial_coef]
recognition: "«Sannsynligheten for å trekke `k` av `K` typer i et utvalg på `n`», «`k` defekte blant `K` defekte i en pott av `N`». Endelig pott UTEN tilbakelegging er kjennetegnet."

solution_template:
  - "Identifiser `N` (totalt), `K` (vellykkede), `n` (trekninger), `k` (spørsmål)"
  - "Skriv `X ~ Hyp(N, K, n)`"
  - text: "Sett inn i formelen (gunstige delt på mulige):"
    formula: "P(X = k) = C(K,k) · C(N−K, n−k) / C(N, n)"
  - text: "Eksempel — trekk 5 kort fra 52, finn `P(2 hjerter)` (`N = 52, K = 13, n = 5, k = 2`):"
    formula: "P(X = 2) = C(13,2)·C(39,3) / C(52,5) = 78·9139 / 2 598 960 ≈ 0.274"
    example: true
  - "Forenkle binomialkoeffisienten der mulig før du multipliserer"

common_traps: |
  Pass på rollene: `K` er vellykkede i populasjonen, `n` er antall trekninger,
  `k` er antall vellykkede blant de trukne. Lett å forveksle `K` og `n`.
  Ikke bland sammen med binomial: binomial har konstant `p`; hypergeometrisk
  har `p` som endrer seg etter hver trekning.

python_snippet: |
  from scipy.stats import hypergeom

  # P(X = k) for trekning av n=5 fra N=52 med K=13 'gunstige'
  hypergeom.pmf(5, 52, 13, 5)        # 0.000495 (alle 5 hjerter)

detailed_solution_variants:
  - label: "Hypergeometrisk: P(X = k)"
    solutions:
      - source: "Eksamen jan25 · oppgave 1a"
        question: "Vi trekker 5 kort fra en kortstokk på 52 kort. 13 av kortene er hjerter. Hva er sannsynligheten for at alle 5 trukne er hjerter?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X = antall hjerter blant de 5 trukne" }
              - { text: "N = 52 (totalt antall kort)" }
              - { text: "K = 13 (antall hjerter i populasjonen)" }
              - { text: "n = 5 (antall trekninger)" }
              - { text: "k = 5 (antall vellykkede vi spør om)" }
              - { text: "X ~ Hypergeometrisk(N=52, K=13, n=5)" }
          - label: "Formel"
            lines:
              - { text: "P(X = k) = C(K, k) · C(N-K, n-k) / C(N, n)" }
              - { text: "P(X = 5) = C(13, 5) · C(39, 0) / C(52, 5)" }
          - label: "Innsatt"
            lines:
              - { text: "C(13, 5) = 1287" }
              - { text: "C(39, 0) = 1" }
              - { text: "C(52, 5) = 2 598 960" }
              - { text: "P(X = 5) = 1287 · 1 / 2 598 960" }
        result: "P(X = 5) ≈ 0.000495 (≈ 4.95 · 10⁻⁴)"
      - source: "Praksis · lotto-sjanse"
        question: "I et lotto trekkes 7 av 34 tall. Du leverer en kupong med 7 valgte tall. Hva er sannsynligheten for at du gjetter nøyaktig 5 riktige?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X = antall riktige blant dine 7 valgte tall" }
              - { text: "N = 34 (totalt antall tall)" }
              - { text: "K = 7 (antall vinnertall i populasjonen)" }
              - { text: "n = 7 (antall tall du har valgt)" }
              - { text: "k = 5 (antall riktige vi spør om)" }
              - { text: "X ~ Hypergeometrisk(N=34, K=7, n=7)" }
          - label: "Formel"
            lines:
              - { text: "P(X = k) = C(K, k) · C(N-K, n-k) / C(N, n)" }
              - { text: "P(X = 5) = C(7, 5) · C(27, 2) / C(34, 7)" }
          - label: "Innsatt"
            lines:
              - { text: "C(7, 5) = 21" }
              - { text: "C(27, 2) = 351" }
              - { text: "C(34, 7) = 5 379 616" }
              - { text: "P(X = 5) = 21 · 351 / 5 379 616 = 7371 / 5 379 616" }
        result: "P(X = 5) ≈ 0.00137 (≈ 1.37 · 10⁻³)"
      - source: "Praksis · kvalitetskontroll"
        question: "Et parti består av 100 deler, hvorav 8 er defekte. Det trekkes 10 deler uten tilbakelegging. Hva er sannsynligheten for at akkurat 1 av de trukne er defekt?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "X = antall defekte blant de 10 trukne" }
              - { text: "N = 100 (totalt antall deler i partiet)" }
              - { text: "K = 8 (antall defekte i populasjonen)" }
              - { text: "n = 10 (antall trukne deler)" }
              - { text: "k = 1 (antall defekte vi spør om)" }
              - { text: "X ~ Hypergeometrisk(N=100, K=8, n=10)" }
          - label: "Formel"
            lines:
              - { text: "P(X = k) = C(K, k) · C(N-K, n-k) / C(N, n)" }
              - { text: "P(X = 1) = C(8, 1) · C(92, 9) / C(100, 10)" }
          - label: "Innsatt"
            lines:
              - { text: "C(8, 1) = 8" }
              - { text: "C(92, 9) ≈ 1.260 · 10¹¹" }
              - { text: "C(100, 10) ≈ 1.731 · 10¹³" }
              - { text: "P(X = 1) ≈ 8 · 1.260 · 10¹¹ / 1.731 · 10¹³" }
        result: "P(X = 1) ≈ 0.3823 (≈ 38.2 %)"

