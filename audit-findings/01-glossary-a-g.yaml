chunk: glossary-a-g
items:
  - id: alpha
    type: glossary
    current_filters:
      parameters_known: [alpha_significance, confidence_level]
      computes: [hypothesis_test, confidence_interval]
    contexts:
      - scenario: "Studenten har en hypotesetest med α = 0.05 og skal forkaste H₀ hvis p < α"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal lage et 95% KI som tilsvarer α = 0.05"
        student_filters:
          computes: [confidence_interval]
          parameters_known: [confidence_level, alpha_significance]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten ser α i regresjonslinja Y = α + β·X og skal tolke konstantleddet (intercept)"
        student_filters:
          setup: [linear_relationship]
          random_variable: [slope_estimate]
          structural_cues: [linear_relationship_suspected]
          computes: [parameter_estimate]
        currently_surfaces: false
        missing_tags:
          - dim: setup
            value: linear_relationship
          - dim: structural_cues
            value: linear_relationship_suspected
          - dim: computes
            value: parameter_estimate
      - scenario: "Studenten skal velge kritisk verdi z_(α/2) i en tosidig test"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
          tooling: [normal_quantile_table_E4]
        currently_surfaces: true
        missing_tags:
          - dim: tooling
            value: normal_quantile_table_E4
    proposed_new_filters_yaml_additions: []

  - id: alternativhypotese
    type: glossary
    current_filters:
      computes: [hypothesis_test]
    contexts:
      - scenario: "Studenten skal formulere H₁ for en ensidig hypotesetest om μ"
        student_filters:
          computes: [hypothesis_test]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal velge ensidig vs tosidig H₁ basert på problemtekst (større/mindre/forskjellig)"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: alpha_significance
      - scenario: "Studenten skal teste H₁: p ≠ p₀ for en andel"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [proportion]
          parameters_known: [success_p]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: proportion
          - dim: parameters_known
            value: success_p
      - scenario: "Studenten skal teste H₁: β ≠ 0 i regresjon"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [slope_estimate]
          setup: [linear_relationship]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: slope_estimate
          - dim: setup
            value: linear_relationship
    proposed_new_filters_yaml_additions: []

  - id: andel
    type: glossary
    current_filters:
      random_variable: [proportion]
      parameters_known: [success_p]
      distribution_assumption: [binomial, normal]
      computes: [confidence_interval, hypothesis_test, parameter_estimate]
    contexts:
      - scenario: "Studenten skal lage 95% KI for andelen defekte i populasjonen basert på X = 12 defekte av n = 100"
        student_filters:
          computes: [confidence_interval]
          random_variable: [proportion]
          setup: [single_population]
          distribution_assumption: [binomial, normal]
        currently_surfaces: true
        missing_tags:
          - dim: setup
            value: single_population
      - scenario: "Studenten har p̂ og skal teste H₀: p = p₀"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [proportion]
          parameters_known: [success_p, alpha_significance]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: alpha_significance
      - scenario: "Studenten skal estimere populasjonsandelen p ved p̂ = X/n"
        student_filters:
          computes: [parameter_estimate]
          random_variable: [proportion]
          setup: [single_population]
        currently_surfaces: true
        missing_tags:
          - dim: setup
            value: single_population
      - scenario: "Studenten skal bruke normalapproksimasjon når n·p̂·(1−p̂) ≥ 5"
        student_filters:
          distribution_assumption: [normal, binomial]
          random_variable: [proportion]
          structural_cues: [success_probability_given]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: success_probability_given
    proposed_new_filters_yaml_additions: []

  - id: bernoulli-forsoek
    type: glossary
    current_filters:
      distribution_assumption: [binomial]
      setup: [fixed_n_trials]
      structural_cues: [two_outcomes_per_trial, success_probability_given]
      parameters_known: [success_p]
    contexts:
      - scenario: "Studenten leser at hvert myntkast er et Bernoulli-forsøk og skal regne X = antall kron av n kast"
        student_filters:
          distribution_assumption: [binomial]
          setup: [fixed_n_trials]
          structural_cues: [two_outcomes_per_trial, success_probability_given]
          random_variable: [discrete_count]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: discrete_count
      - scenario: "Studenten har én Bernoulli-observasjon og skal regne P(suksess)"
        student_filters:
          computes: [exact_probability]
          structural_cues: [two_outcomes_per_trial, success_probability_given]
          parameters_known: [success_p]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: exact_probability
      - scenario: "Studenten knytter Bernoulli-forsøk til andelsestimering p̂ = X/n"
        student_filters:
          random_variable: [proportion]
          computes: [parameter_estimate]
          structural_cues: [two_outcomes_per_trial]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: proportion
          - dim: computes
            value: parameter_estimate
    proposed_new_filters_yaml_additions: []

  - id: beta
    type: glossary
    current_filters:
      random_variable: [slope_estimate]
      setup: [linear_relationship]
      computes: [hypothesis_test, parameter_estimate]
    contexts:
      - scenario: "Studenten skal estimere β̂ i regresjonsmodellen Y = α + β·X + ε"
        student_filters:
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          computes: [parameter_estimate]
          structural_cues: [linear_relationship_suspected]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: linear_relationship_suspected
      - scenario: "Studenten ser β nevnt som type-II-feil-sannsynlighet og skal forstå teststyrke 1−β"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: alpha_significance
      - scenario: "Studenten skal teste H₀: β = 0 for å sjekke om X har lineær effekt på Y"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          parameters_known: [slope_se]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: slope_se
      - scenario: "Studenten skal lage KI for β̂"
        student_filters:
          computes: [confidence_interval]
          random_variable: [slope_estimate]
          setup: [linear_relationship]
        currently_surfaces: false
        missing_tags:
          - dim: computes
            value: confidence_interval
    proposed_new_filters_yaml_additions: []

  - id: beta-koeffisient
    type: glossary
    current_filters:
      random_variable: [slope_estimate]
      setup: [linear_relationship]
      structural_cues: [linear_relationship_suspected]
      computes: [parameter_estimate, confidence_interval, hypothesis_test]
    contexts:
      - scenario: "Studenten skal beregne β̂ fra Σ(x-x̄)(y-ȳ) og Σ(x-x̄)²"
        student_filters:
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          computes: [parameter_estimate]
          parameters_known: [sum_xx_sxy]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: sum_xx_sxy
      - scenario: "Studenten skal lage KI for stigningstallet β̂ ± t·SE(β̂)"
        student_filters:
          computes: [confidence_interval]
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          parameters_known: [slope_se]
          distribution_assumption: [t_distribution]
          tooling: [t_quantile_table_E5]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: slope_se
          - dim: distribution_assumption
            value: t_distribution
          - dim: tooling
            value: t_quantile_table_E5
      - scenario: "Studenten skal teste H₀: β = 0 mot H₁: β ≠ 0"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          parameters_known: [slope_se]
          distribution_assumption: [t_distribution]
        currently_surfaces: true
        missing_tags:
          - dim: parameters_known
            value: slope_se
          - dim: distribution_assumption
            value: t_distribution
      - scenario: "Studenten skal tolke β-koeffisient som økning i Y per enhet økning i X"
        student_filters:
          random_variable: [slope_estimate]
          setup: [linear_relationship]
          structural_cues: [linear_relationship_suspected]
        currently_surfaces: true
        missing_tags: []
    proposed_new_filters_yaml_additions: []

  - id: betinget-sannsynlighet-glos
    type: glossary
    current_filters:
      computes: [conditional_probability]
      structural_cues: [conditional_given]
    contexts:
      - scenario: "Studenten har P(A∩B) og P(B) og skal regne P(A|B)"
        student_filters:
          computes: [conditional_probability]
          structural_cues: [conditional_given]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal bruke Bayes' setning for å snu betingelsen"
        student_filters:
          computes: [conditional_probability]
          structural_cues: [conditional_given]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten har simultantabell og skal regne betinget sannsynlighet i krysstabell"
        student_filters:
          computes: [conditional_probability]
          setup: [joint_table_given]
          structural_cues: [joint_table_present]
        currently_surfaces: true
        missing_tags:
          - dim: setup
            value: joint_table_given
          - dim: structural_cues
            value: joint_table_present
      - scenario: "Studenten skal sjekke uavhengighet via P(A|B) = P(A)"
        student_filters:
          computes: [test_independence, conditional_probability]
          structural_cues: [independent_events, conditional_given]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: test_independence
          - dim: structural_cues
            value: independent_events
    proposed_new_filters_yaml_additions: []

  - id: bias
    type: glossary
    current_filters:
      computes: [parameter_estimate]
    contexts:
      - scenario: "Studenten skal vurdere om en estimator θ̂ er forventningsskjev — regne E[θ̂] − θ"
        student_filters:
          computes: [parameter_estimate]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal forklare hvorfor variansestimatoren med n i nevneren er biased mens n−1 er unbiased"
        student_filters:
          computes: [parameter_estimate, std_dev]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: std_dev
      - scenario: "Studenten skal sammenligne MSE = bias² + varians for to estimatorer"
        student_filters:
          computes: [parameter_estimate, std_dev]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: std_dev
    proposed_new_filters_yaml_additions: []

  - id: binomialvarians
    type: glossary
    current_filters:
      distribution_assumption: [binomial]
      random_variable: [discrete_count]
      computes: [std_dev, expected_value]
      parameters_known: [success_p]
      setup: [fixed_n_trials]
    contexts:
      - scenario: "Studenten har Binomial(n=20, p=0.3) og skal regne Var(X) = np(1-p)"
        student_filters:
          distribution_assumption: [binomial]
          random_variable: [discrete_count]
          computes: [std_dev]
          parameters_known: [success_p]
          setup: [fixed_n_trials]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal regne E[X] = np for binomialfordeling"
        student_filters:
          distribution_assumption: [binomial]
          computes: [expected_value]
          parameters_known: [success_p]
          setup: [fixed_n_trials]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal sjekke betingelsen n·p·(1−p) ≥ 5 for normalapproksimasjon av binomial"
        student_filters:
          distribution_assumption: [binomial, normal]
          structural_cues: [success_probability_given]
          parameters_known: [success_p]
          setup: [fixed_n_trials]
        currently_surfaces: true
        missing_tags:
          - dim: distribution_assumption
            value: normal
          - dim: structural_cues
            value: success_probability_given
      - scenario: "Studenten skal regne Var(p̂) = p(1-p)/n for utvalgsandel"
        student_filters:
          random_variable: [proportion]
          computes: [std_dev]
          parameters_known: [success_p]
          distribution_assumption: [binomial]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: proportion
    proposed_new_filters_yaml_additions: []

  - id: boksplott
    type: glossary
    current_filters:
      structural_cues: [data_as_list]
    contexts:
      - scenario: "Studenten har en liste med observasjoner og skal lage boksplott (Q1, median, Q3, uteliggere)"
        student_filters:
          structural_cues: [data_as_list]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal sammenligne to grupper med boksplott side om side"
        student_filters:
          structural_cues: [data_as_list]
          setup: [two_independent_samples]
        currently_surfaces: true
        missing_tags:
          - dim: setup
            value: two_independent_samples
      - scenario: "Studenten skal lese median og kvartiler fra et boksplott"
        student_filters:
          structural_cues: [data_as_list]
        currently_surfaces: true
        missing_tags: []
    proposed_new_filters_yaml_additions: []

  - id: chi
    type: glossary
    current_filters:
      distribution_assumption: [chi_squared]
      computes: [hypothesis_test, confidence_interval, test_independence]
      tooling: [chi_square_quantile_table_E6]
    contexts:
      - scenario: "Studenten skal lage KI for σ² ved hjelp av kjikvadratfordelingen"
        student_filters:
          distribution_assumption: [chi_squared]
          computes: [confidence_interval, std_dev]
          tooling: [chi_square_quantile_table_E6]
          parameters_known: [population_variance_unknown]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: std_dev
          - dim: parameters_known
            value: population_variance_unknown
      - scenario: "Studenten skal kjøre goodness-of-fit-test med χ² = Σ(Oᵢ−Eᵢ)²/Eᵢ"
        student_filters:
          distribution_assumption: [chi_squared]
          computes: [hypothesis_test]
          structural_cues: [more_than_two_categories]
          tooling: [chi_square_quantile_table_E6]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: more_than_two_categories
      - scenario: "Studenten skal kjøre uavhengighetstest i en simultantabell"
        student_filters:
          distribution_assumption: [chi_squared]
          computes: [test_independence, hypothesis_test]
          setup: [joint_table_given]
          structural_cues: [joint_table_present, more_than_two_categories]
          tooling: [chi_square_quantile_table_E6]
        currently_surfaces: true
        missing_tags:
          - dim: setup
            value: joint_table_given
          - dim: structural_cues
            value: joint_table_present
          - dim: structural_cues
            value: more_than_two_categories
      - scenario: "Studenten skal slå opp kvantil i χ²-tabellen for gitt frihetsgrad"
        student_filters:
          distribution_assumption: [chi_squared]
          tooling: [chi_square_quantile_table_E6]
        currently_surfaces: true
        missing_tags: []
    proposed_new_filters_yaml_additions: []

  - id: de-morgans-lov
    type: glossary
    current_filters:
      computes: [union_probability, exact_probability]
      structural_cues: [complement_pattern]
    contexts:
      - scenario: "Studenten skal regne P(verken A eller B) = P(A̅ ∩ B̅) = 1 − P(A ∪ B)"
        student_filters:
          computes: [union_probability, exact_probability]
          structural_cues: [complement_pattern]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal regne P(minst én) ved hjelp av komplement"
        student_filters:
          computes: [exact_probability]
          structural_cues: [complement_pattern]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten har disjunkte hendelser og skal forenkle uttrykk med komplement"
        student_filters:
          computes: [union_probability]
          structural_cues: [disjoint_events, complement_pattern]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: disjoint_events
    proposed_new_filters_yaml_additions: []

  - id: disjunkte-hendelser-glos
    type: glossary
    current_filters:
      structural_cues: [disjoint_events]
      computes: [union_probability]
    contexts:
      - scenario: "Studenten skal regne P(A ∪ B) = P(A) + P(B) når hendelsene er disjunkte"
        student_filters:
          structural_cues: [disjoint_events]
          computes: [union_probability]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal forklare forskjellen mellom disjunkt og uavhengig"
        student_filters:
          structural_cues: [disjoint_events, independent_events]
          computes: [test_independence, exact_probability]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: independent_events
          - dim: computes
            value: test_independence
          - dim: computes
            value: exact_probability
      - scenario: "Studenten skal regne P(A) når oppgaven sier 'enten A eller B (men ikke begge)'"
        student_filters:
          structural_cues: [disjoint_events]
          computes: [union_probability, exact_probability]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: exact_probability
    proposed_new_filters_yaml_additions: []

  - id: diskret-varians
    type: glossary
    current_filters:
      random_variable: [discrete_count]
      computes: [std_dev]
    contexts:
      - scenario: "Studenten har en PMF-tabell og skal beregne Var(X) = Σ(xᵢ−μ)²·P(X=xᵢ)"
        student_filters:
          random_variable: [discrete_count]
          computes: [std_dev]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal regne σ for en diskret variabel og bruke σ = √Var(X)"
        student_filters:
          random_variable: [discrete_count]
          computes: [std_dev, expected_value]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: expected_value
      - scenario: "Studenten skal bruke snarvei Var(X) = E[X²] − μ² for diskret variabel"
        student_filters:
          random_variable: [discrete_count]
          computes: [std_dev, expected_value]
          parameters_known: [mean_known]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: expected_value
          - dim: parameters_known
            value: mean_known
    proposed_new_filters_yaml_additions: []

  - id: eksponentialvarians
    type: glossary
    current_filters:
      distribution_assumption: [exponential]
      random_variable: [time_until_event, continuous]
      parameters_known: [rate_lambda]
      computes: [std_dev, expected_value]
    contexts:
      - scenario: "Studenten har Eksp(λ=2) ventetid og skal regne Var(T) = 1/λ²"
        student_filters:
          distribution_assumption: [exponential]
          random_variable: [time_until_event, continuous]
          parameters_known: [rate_lambda]
          computes: [std_dev]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal regne forventet ventetid E[T] = 1/λ"
        student_filters:
          distribution_assumption: [exponential]
          random_variable: [time_until_event]
          parameters_known: [rate_lambda]
          computes: [expected_value]
          structural_cues: [time_until_first, rate_given]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: time_until_first
          - dim: structural_cues
            value: rate_given
      - scenario: "Studenten har en Poissonprosess og skal finne σ for ventetiden mellom hendelser"
        student_filters:
          distribution_assumption: [exponential]
          random_variable: [time_until_event]
          parameters_known: [rate_lambda]
          computes: [std_dev]
          structural_cues: [poisson_process_mentioned, process_over_time]
        currently_surfaces: true
        missing_tags:
          - dim: structural_cues
            value: poisson_process_mentioned
          - dim: structural_cues
            value: process_over_time
    proposed_new_filters_yaml_additions: []

  - id: ensidig-test
    type: glossary
    current_filters:
      computes: [hypothesis_test]
      parameters_known: [alpha_significance]
    contexts:
      - scenario: "Studenten har H₁: μ > μ₀ og skal beregne høyresidig p-verdi"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal velge ensidig vs tosidig basert på «minst», «høyst», «større enn»"
        student_filters:
          computes: [hypothesis_test]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten har en ensidig z-test for andel og skal finne kritisk verdi"
        student_filters:
          computes: [hypothesis_test]
          random_variable: [proportion]
          distribution_assumption: [normal]
          tooling: [normal_quantile_table_E4]
          parameters_known: [alpha_significance]
        currently_surfaces: true
        missing_tags:
          - dim: random_variable
            value: proportion
          - dim: distribution_assumption
            value: normal
          - dim: tooling
            value: normal_quantile_table_E4
      - scenario: "Studenten har en ensidig t-test for μ"
        student_filters:
          computes: [hypothesis_test]
          distribution_assumption: [t_distribution]
          parameters_known: [alpha_significance, population_variance_unknown]
          tooling: [t_quantile_table_E5]
        currently_surfaces: true
        missing_tags:
          - dim: distribution_assumption
            value: t_distribution
          - dim: parameters_known
            value: population_variance_unknown
          - dim: tooling
            value: t_quantile_table_E5
    proposed_new_filters_yaml_additions: []

  - id: estimator
    type: glossary
    current_filters:
      computes: [parameter_estimate]
    contexts:
      - scenario: "Studenten skal velge mellom ulike estimatorer for μ basert på forventningsrett og varians"
        student_filters:
          computes: [parameter_estimate]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal forklare forskjell mellom estimator (regel) og estimat (tall)"
        student_filters:
          computes: [parameter_estimate]
        currently_surfaces: true
        missing_tags: []
      - scenario: "Studenten skal bruke X̄ som estimator for μ"
        student_filters:
          computes: [parameter_estimate, expected_value]
          random_variable: [mean_of_samples]
          setup: [single_population]
        currently_surfaces: true
        missing_tags:
          - dim: computes
            value: expected_value
          - dim: random_variable
