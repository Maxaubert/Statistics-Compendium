solution_variants:
  - label: "KI for μ (σ kjent)"
    recognition: "«Lag et 95 % konfidensintervall for `μ` når `σ` er kjent». Populasjonsstandardavviket er gitt eksplisitt (ikke estimert fra data)."
    steps:
      - text: "Dersom `s` er kjent, så er ikke dette det samme som at `σ` er kjent."
        conditional: true
      - "Identifiser konfidensnivå `(1 − α)` og finn `α` (f.eks. 90 % gir `α = 0.10`)"
      - "Slå opp `z_(α/2)` i **tabell E.4** (Z-kvantiltabell). F.eks. `α/2 = 0.05` gir `1.645`"
      - text: "Beregn marginen:"
        formula: "margin = z_(α/2) · σ/√n"
      - text: "Sett opp intervallet:"
        formula: "x̄ ± margin"
      - text: "Eksempel: kaffeautomat `n = 100`, `x̄ = 25.05` cl, `σ = 0.48`, 90 % KI (`z_(0.05) = 1.645`):"
        formula: "25.05 ± 1.645·0.48/√100 ≈ 25.05 ± 0.079 = [24.97, 25.13]"
        example: true
      - text: "**`σ` vs `s`**: hvis bare utvalgsstandardavviket `s` er kjent (regnet fra dataene), bruk t-basert KI i neste fane, ikke z-basert. Z er for når `σ` er gitt eksternt."
        conditional: true

  - label: "KI for μ (σ ukjent)"
    recognition: "«Lag et 95 % konfidensintervall for `μ`», «estimer `μ` med usikkerhet». Du har utvalgsdata eller `s` er gitt — `σ` er IKKE kjent (typisk eksamensoppgave)."
    steps:
      - text: "Dersom `s` er kjent, så er ikke dette det samme som at `σ` er kjent."
        conditional: true
      - "Identifiser konfidensnivå `(1 − α)` og `α`"
      - text: "Beregn utvalgsvariansen (eller bruk gitt `s`):"
        formula: "s² = Σ(x_i − x̄)² / (n−1)"
      - "Slå opp `t_(α/2, n−1)` i **tabell E.5** (t-kvantiltabell): kolonne for `α/2`, rad for `n−1` frihetsgrader"
      - text: "Beregn marginen:"
        formula: "margin = t_(α/2, n−1) · s/√n"
      - text: "Sett opp intervallet:"
        formula: "x̄ ± margin"
      - text: "Eksempel: testresultater `n = 10`, `x̄ = 71.30`, `s = 14.33`, 95 % KI (`t_(0.025, 9) = 2.262`):"
        formula: "71.30 ± 2.262·14.33/√10 ≈ 71.30 ± 10.25 = [61.05, 81.55]"
        example: true
      - text: "**`ν = n − 1`** for én-utvalgs KI (ikke `n − 2` — det er regresjon). For 95 % KI med `n = 10`: `ν = 9`, `α/2 = 0.025` ⇒ `t = 2.262`."
        conditional: true

  - label: "KI for σ² og σ"
    recognition: "«Lag et 95 % konfidensintervall for variansen `σ²`» eller for standardavviket `σ`. Du har utvalgsvariansen `s²` og vil ha intervall rundt populasjonsvariansen / spredningen."
    steps:
      - text: "Merk: her er det INGEN σ-kjent/ukjent-variant — vi estimerer jo `σ²` (og `σ`) fra dataene. Hvis `σ` allerede var kjent, ville du ikke trenge dette intervallet."
        conditional: true
      - "Bekreft at fordelingen er normalfordelt (eller antatt). Identifiser `n` og `s²`"
      - text: "Bestem frihetsgrader:"
        formula: "ν = n − 1"
      - "Slå opp `χ²_(α/2, ν)` og `χ²_(1−α/2, ν)` i **tabell E.6** (Kjikvadrat-kvantiltabell)"
      - text: "**Steg 1: KI for σ².** Sett inn grensene — pass på fordelingen av kvantilene:"
        formula:
          - "nedre(σ²) = (n−1)·s² / χ²_(α/2, ν)"
          - "øvre(σ²)  = (n−1)·s² / χ²_(1−α/2, ν)"
      - text: "Eksempel: maskinpresisjon `n = 15`, `s² = 4.5`, 95 % KI (`χ²_(0.025, 14) = 26.12`, `χ²_(0.975, 14) = 5.63`):"
        formula: "KI(σ²) = [14·4.5/26.12, 14·4.5/5.63] ≈ [2.41, 11.19]"
        example: true
      - text: "**Steg 2: KI for σ.** Ta kvadratroten av begge grensene fra steg 1:"
        formula:
          - "nedre(σ) = √nedre(σ²)"
          - "øvre(σ)  = √øvre(σ²)"
      - text: "Eksempel videre: `KI(σ) = [√2.41, √11.19] ≈ [1.55, 3.34]`."
        example: true
      - text: "**Pass på asymmetrien:** intervallet er IKKE sentrert om `s²`. Den LILLE kvantilen `χ²_(1−α/2)` står i nevneren for ØVRE grense; den STORE `χ²_(α/2)` står i nevneren for NEDRE grense. Lett å bytte om."
        conditional: true

  - label: "Finn n for ønsket KI-bredde"
    recognition: "«Hvor stor må `n` være for at 95 % KI for `μ` skal ha total bredde høyst `L`?», «hvor mange målinger trengs for halvbredde `E`?». Planlegger utvalgsstørrelsen FØR data samles inn."
    steps:
      - text: "Husk skillet: `L` er TOTAL bredde av KI, `E = L/2` er halvbredde/margin. Mange oppgaver oppgir det ene — dobbeltsjekk hvilket. Bruker du feil form blir `n` 4× for stor eller 4× for liten."
        conditional: true
      - "Identifiser konfidensnivå `(1 − α)` og finn `α/2` (95 % ⇒ `α/2 = 0.025`)."
      - "Slå opp `z_(α/2)` i **tabell E.4** (95 % ⇒ `z_(0.025) = 1.960`)."
      - text: "**σ kjent — total bredde `L`:** løs `2·z_(α/2)·σ/√n ≤ L` for `n`:"
        formula: "n ≥ (2·z_(α/2)·σ/L)²"
      - text: "Ekvivalent form med halvbredde `E = L/2`:"
        formula: "n ≥ (z_(α/2)·σ/E)²"
        conditional: true
      - text: "**σ ukjent (pilot `s`):** strengt tatt iterativt — bytt `z` med `t_(α/2, n−1)`. Bruk z-formelen med pilot-`s` som god startestimat (`t ≈ z` når `n > 30`)."
        formula: "n ≈ (2·z_(α/2)·s/L)²    ⟵ z-tilnærming; iterer med t hvis n < 30"
      - text: "**Rund ALLTID OPP** til neste hele tall — `n = 96.04` betyr at `n = 96` ikke er nok; du må ha `n = 97` for å garantere bredden."
        conditional: true
      - text: "Eksempel (σ kjent): `σ = 10`, total bredde `L = 4`, 95 % (`z = 1.960`):"
        formula: "n ≥ (2·1.960·10/4)² = 9.8² = 96.04 ⇒ n = 97"
        example: true
      - text: "Eksempel (σ ukjent, pilot `s = 12`, `L = 5`, 95 %, z-tilnærming):"
        formula: "n ≥ (2·1.960·12/5)² ≈ 88.51 ⇒ n = 89"
        example: true
      - text: "Sjekk t-korreksjon hvis `n` blir lite (`n < 30`): slå opp `t_(α/2, n−1)` i **tabell E.5** og gjenta. For `n = 89` ⇒ `t_(0.025, 88) ≈ 1.987 ≈ z`, så `n = 89` står."
        conditional: true

solution_template:
  - "Identifiser HVA oppgaven spør om — KI for `μ` eller for `σ²`/`σ`?"
  - "For `μ`: er `σ` kjent (gitt eksternt) eller ukjent (må estimeres med `s`)? Velg riktig fane."
  - "For `σ²`/`σ`: gå direkte til den tredje fanen — χ²-basert."

common_traps: |
  - **`z` vs `t`** — er `σ` virkelig kjent? Hvis bare `s` er regnet fra dataene,
    er det t-fordelingen og fane 2 du skal bruke, ikke z. Z-fanen er for når
    `σ` er gitt eksternt (oppgavetekst, historiske data, spec).
  - **`z_(α/2)`, ikke `z_α`** — vi vil ha `α/2` i hver hale i et tosidig
    intervall. 90 % KI gir `α = 0.10` og `z_(α/2) = z_0.05 = 1.645`. Bruker du
    `z_α` blir intervallet for smalt — bare 80 % dekning.
  - **`σ/√n`, ikke `σ`** — standardfeilen til `x̄` er `σ/√n`. Glemmer du `√n`
    blir intervallet `√n` ganger for bredt.
  - **`ν = n − 1`** for ett-utvalgs KI. (`n − 2` er regresjon.)
  - **Konfidensnivå vs α** — 95 % konfidens er `α = 0.05`, ikke `α = 0.95`.
    `1 − α` er konfidensnivået.
  - **KI for σ² er ASYMMETRISK** rundt `s²`. Ikke prøv å sentrere det. Den
    lille χ²-kvantilen `(1 − α/2)` går i nevneren for ØVRE grense; den store
    `(α/2)` i nevneren for NEDRE.
  - **Tolkningen** — intervallet inneholder parameteren med 95 % sannsynlighet
    FØR dataene er samlet inn. Etter at det er regnet ut, ligger parameteren
    enten i intervallet eller ikke; det er PROSESSEN som har 95 % treffrate.

python_snippet: |
  from scipy.stats import norm, t, chi2
  import math

  x_bar, s, sigma, n, alpha = 25, 0.48, 0.48, 100, 0.05

  # KI for μ (kjent σ)
  z = norm.ppf(1 - alpha/2)
  ci_z = (x_bar - z*sigma/math.sqrt(n), x_bar + z*sigma/math.sqrt(n))

  # KI for μ (ukjent σ)
  t_crit = t.ppf(1 - alpha/2, df=n-1)
  ci_t = (x_bar - t_crit*s/math.sqrt(n), x_bar + t_crit*s/math.sqrt(n))

  # KI for σ²
  nu = n - 1
  s2 = s ** 2
  lower = (nu * s2) / chi2.ppf(1 - alpha/2, df=nu)
  upper = (nu * s2) / chi2.ppf(alpha/2, df=nu)
  ci_var = (lower, upper)

detailed_solution_variants:
  - label: "KI for μ (σ kjent)"
    solutions:
      - source: "Praksis · julelys-måling"
        question: "Et utvalg på `n = 40` julelys ga gjennomsnittlig effekt `x̄ = 48` watt. Populasjonens standardavvik er `σ = 5` watt (kjent). Finn et 95 % konfidensintervall for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 40`, `x̄ = 48`, `σ = 5` (kjent), konfidensnivå `(1 − α) = 0.95`." }
              - { text: "Siden `σ` er kjent og `n ≥ 30`, kan vi bruke `z`-basert KI." }
          - label: "Kvantil"
            lines:
              - { text: "`α = 1 − 0.95 = 0.05`, så `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.025) = 1.960`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = z_(α/2) · σ/√n`" }
              - { indent: "`= 1.960 · 5/√40`" }
              - { indent: "`= 1.960 · 0.7906`" }
              - { indent: "`≈ 1.55`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = x̄ ± margin = 48 ± 1.55`" }
              - { indent: "`= [46.45, 49.55]`" }
        result: "`95 % KI for μ: [46.45, 49.55] watt`"

      - source: "Praksis · kaffemengde"
        question: "Kaffeautomaten gir mengder med kjent `σ = 0.48` cl. Et utvalg av `n = 100` trykk ga `x̄ = 25.05` cl. Finn et 90 % KI for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 100`, `x̄ = 25.05`, `σ = 0.48`, konfidensnivå 90 %." }
          - label: "Kvantil"
            lines:
              - { text: "`α = 0.10`, så `α/2 = 0.05`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.05) = 1.645`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = 1.645 · 0.48/√100 = 1.645 · 0.048 = 0.0790`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = 25.05 ± 0.0790 = [24.97, 25.13]`" }
        result: "`90 % KI for μ: [24.97, 25.13] cl`"

  - label: "KI for μ (σ ukjent)"
    solutions:
      - source: "Praksis · klassetest, gammel metode"
        question: "Et utvalg av `n = 10` testresultater har `x̄ = 71.30` og utvalgsstandardavvik `s² = 205.34`. Finn et 95 % konfidensintervall for `μ`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 10`, `x̄ = 71.30`, `s² = 205.34` ⇒ `s = √205.34 ≈ 14.33`." }
              - { text: "`σ` er ikke kjent (kun estimert som `s` fra utvalget) → bruk t-basert KI." }
          - label: "Kvantil"
            lines:
              - { text: "Frihetsgrader: `ν = n − 1 = 9`. Konfidensnivå 95 % ⇒ `α = 0.05`, `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.5", text: "Slå opp `t_(0.025, 9) = 2.262`." } }
          - label: "Margin"
            lines:
              - { text: "`margin = t_(α/2, n−1) · s/√n`" }
              - { indent: "`= 2.262 · 14.33/√10`" }
              - { indent: "`= 2.262 · 4.531`" }
              - { indent: "`≈ 10.25`" }
          - label: "Intervall"
            lines:
              - { text: "`KI = 71.30 ± 10.25 = [61.05, 81.55]`" }
        result: "`95 % KI for μ: [61.05, 81.55]`"

      - source: "Praksis · liten produktprøve (rådata)"
        question: "Innholdet av 6 såpebeholdere ble målt: 297, 300, 293, 296, 304, 302 ml. Finn et 95 % KI for forventet fyllingsmengde, uten å forutsette kjent `σ`."
        sections:
          - label: "Gjennomsnittet"
            lines:
              - { text: "`n = 6`. Først regn `x̄` fra rådataene:" }
              - { text: "`x̄ = (297 + 300 + 293 + 296 + 304 + 302)/6 = 1792/6 ≈ 298.67`" }
          - label: "Utvalgsvarians og s"
            lines:
              - { text: "`var = ((297−298.67)² + (300−298.67)² + (293−298.67)² + (296−298.67)² + (304−298.67)² + (302−298.67)²)/(6−1)`" }
              - { indent: "`= ((−1.67)² + (1.33)² + (−5.67)² + (−2.67)² + (5.33)² + (3.33)²)/5`" }
              - { indent: "`= (2.79 + 1.77 + 32.15 + 7.13 + 28.41 + 11.09)/5`" }
              - { indent: "`= 83.34/5 ≈ 16.67`" }
              - { text: "`s = √16.67 ≈ 4.08`" }
          - label: "Kvantil"
            lines:
              - { text: "`ν = n − 1 = 5`, `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 5) = 2.571`." } }
          - label: "Intervall"
            lines:
              - { text: "`KI = x̄ ± t_(α/2, ν) · s/√n`" }
              - { indent: "`= 298.67 ± 2.571 · 4.08/√6`" }
              - { indent: "`= 298.67 ± 4.28`" }
              - { indent: "`= [294.39, 302.95]`" }
        result: "`95 % KI for μ: [294.39, 302.95] ml`"

  - label: "KI for σ² og σ"
    solutions:
      - source: "Praksis · maskinpresisjon"
        question: "Et utvalg på `n = 15` målinger fra en produksjonslinje gir utvalgsvarians `s² = 4.5`. Anta normalfordelte målinger. Finn et 95 % konfidensintervall for variansen `σ²`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `n = 15`, `s² = 4.5`, normalfordeling antatt, konfidensnivå 95 %." }
              - { text: "Frihetsgrader: `ν = n − 1 = 14`. `α = 0.05`, `α/2 = 0.025`." }
          - label: "Kvantiler"
            lines:
              - { table_lookup: { ref: "E.6", text: "`χ²_(0.025, 14) = 26.12` (øvre hale, brukes til NEDRE intervallgrense)." } }
              - { table_lookup: { ref: "E.6", text: "`χ²_(0.975, 14) = 5.63` (nedre hale, brukes til ØVRE intervallgrense)." } }
          - label: "Innsetting"
            lines:
              - { text: "Nedre grense: `(n−1)·s² / χ²_(α/2, ν) = 14·4.5 / 26.12 ≈ 2.41`" }
              - { text: "Øvre grense: `(n−1)·s² / χ²_(1−α/2, ν) = 14·4.5 / 5.63 ≈ 11.19`" }
          - label: "Intervall"
            lines:
              - { text: "`KI for σ² = [2.41, 11.19]`" }
              - { text: "Tilhørende KI for σ (kvadratroten av begge): `[√2.41, √11.19] = [1.55, 3.34]`" }
        result: "`95 % KI for σ²: [2.41, 11.19]`; for `σ: [1.55, 3.34]`"

  - label: "Finn n for ønsket KI-bredde"
    solutions:
      - source: "Praksis · prosesskontroll, σ kjent"
        question: "Et historisk datasett gir kjent standardavvik `σ = 10`. Du ønsker et 95 % konfidensintervall for `μ` med total bredde høyst `L = 4`. Hvor stor må utvalgsstørrelsen `n` være?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: `σ = 10` (kjent), ønsket total bredde `L = 4`, konfidensnivå `(1 − α) = 0.95`." }
              - { text: "Siden `σ` er kjent bruker vi z-basert formel for `n`." }
          - label: "Tabelloppslag"
            lines:
              - { text: "`α = 0.05`, så `α/2 = 0.025`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.025) = 1.960`" } }
          - label: "Formel"
            lines:
              - { text: "Marginen er `z_(α/2)·σ/√n`, og total bredde `L = 2·margin`. Krav `L ≤ 4` gir:" }
              - { indent: "`2·z_(α/2)·σ/√n ≤ L`" }
              - { indent: "`⇔ n ≥ (2·z_(α/2)·σ/L)²`" }
          - label: "Innsatt"
            lines:
              - { text: "`n ≥ (2·1.960·10/4)² = 9.8² = 96.04`" }
          - label: "Avrunding"
            lines:
              - { text: "Rund OPP for å garantere kravet: `n = ⌈96.04⌉ = 97`." }
          - label: "Kontroll"
            lines:
              - { text: "Med `n = 97`: bredde `= 2·1.960·10/√97 ≈ 3.98 ≤ 4` ✓" }
              - { text: "Med `n = 96`: bredde `= 2·1.960·10/√96 ≈ 4.001 > 4` ✗ — akkurat for bredt." }
        result: "`n = 97` gir 95 % KI for `μ` med bredde høyst `4` når `σ = 10`."

      - source: "Praksis · pilotstudie, σ ukjent"
        question: "En pilotstudie ga utvalgsstandardavvik `s = 12`. Du ønsker et 95 % konfidensintervall for `μ` med total bredde høyst `L = 5`. Hvor stor må `n` være? `σ` er ikke kjent."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Gitt: pilot `s = 12`, ønsket total bredde `L = 5`, konfidensnivå 95 %." }
              - { text: "`σ` er ukjent ⇒ strengt tatt iterativt med `t_(α/2, n−1)`. Vi starter med z-tilnærming (god når `n > 30`)." }
          - label: "Tabelloppslag (z-tilnærming)"
            lines:
              - { text: "`α/2 = 0.025`." }
              - { table_lookup: { ref: "E.4", text: "`z_(0.025) = 1.960`" } }
          - label: "Formel"
            lines:
              - { text: "Samme form som σ kjent, men `σ` byttes med pilot-`s`:" }
              - { indent: "`n ≥ (2·z_(α/2)·s/L)²`" }
          - label: "Innsatt"
            lines:
              - { text: "`n ≥ (2·1.960·12/5)² = 9.408² ≈ 88.51`" }
          - label: "Avrunding"
            lines:
              - { text: "Rund OPP: `n = ⌈88.51⌉ = 89`." }
          - label: "Sjekk t-korreksjon"
            lines:
              - { text: "`n = 89 > 30`, så `t ≈ z` — z-tilnærmingen er god. Slå opp for sikkerhets skyld:" }
              - { table_lookup: { ref: "E.5", text: "`t_(0.025, 88) ≈ 1.987` (≈ `z = 1.960`)" } }
              - { text: "Med `t = 1.987`: `n ≥ (2·1.987·12/5)² ≈ 90.97 ⇒ n = 91`. Forskjellen er marginal; mange oppgaver godtar z-tilnærmingen `n = 89`. Vil du være konservativ, oppgi `n = 91`." }
        result: "`n ≈ 89` med z-tilnærming (eller `n = 91` med t-korreksjon når `s = 12`, `L = 5`)."

