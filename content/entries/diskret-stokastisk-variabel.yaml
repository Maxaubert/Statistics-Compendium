id: diskret-stokastisk-variabel
name_no: "Forventningsverdi, varians og standardavvik (diskret stokastisk variabel)"
type: identity
category: distribution_property
tagline: "`E[X]` = veid sum av verdiene; `Var(X)` = veid sum av kvadrerte avvik fra `μ`; `σ = √Var(X)`."

formula_main: "E[X] = Σ x_i · P(X = x_i);  Var(X) = Σ (x_i − μ)² · P(X = x_i);  σ = √Var(X)"
formula_latex: "E[X] = \\sum_i x_i \\cdot P(X = x_i), \\quad \\text{Var}(X) = \\sum_i (x_i - \\mu)^2 \\cdot P(X = x_i), \\quad \\sigma = \\sqrt{\\text{Var}(X)}"

what_it_does: |
  De tre grunnleggende egenskapene til en diskret stokastisk variabel `X` med
  kjent sannsynlighetsfordeling (PMF):

  - **Forventningsverdi** `E[X] = μ` — verdiene `x_i` vektet med
    sannsynlighetene `P(X = x_i)`. Tyngdepunktet i fordelingen.
  - **Varians** `Var(X) = σ²` — vektet sum av kvadrerte avvik fra `μ`.
    Mål for spredning, men i kvadrerte enheter.
  - **Standardavvik** `σ` — kvadratroten av variansen, i samme enhet som `X`.
    Det vi rapporterer videre.

  Sida samler alt tre på samme side fordi de regnes i sekvens: `μ` først,
  så `Var(X)` (som krever `μ`), så `σ = √Var(X)`. Velg fane under for
  prosedyren som passer oppgaven din.

why_use: |
  De mest grunnleggende byggeklossene for en diskret variabel. Inngår i:

  - z-/t-tester og konfidensintervaller (forventning og spredning)
  - kovarians og korrelasjon (`Cov(X, Y) = E[XY] − μ_X·μ_Y`)
  - `Var(aX + b) = a²·Var(X)`-regelen for lineære transformasjoner
  - `Var(X + Y) = Var(X) + Var(Y) + 2·Cov(X, Y)` for sum av variabler

  Klassiske eksamensoppgaver gir en PMF-tabell og ber om `E[X]`, deretter
  `Var(X)` og `σ`. Når `μ` er funnet, er resten mekanisk.

recognition_cues:
  - "Diskret stokastisk variabel med kjent sannsynlighetsfordeling (PMF som tabell eller formel)"
  - "Spørsmålet ber om `E[X]`, `μ`, forventningsverdien, `Var(X)`, `σ²`, eller standardavviket"
  - "Du har en tabell med `x`-verdier og `P(X = x)`-verdier"
  - "Mellomsteg før kovarians, korrelasjon, eller hypotesetest"
  - "Spørsmålet ber om forventet utbetaling, gjennomsnitt på lang sikt, eller spredning rundt forventning"

when_NOT_to_use:
  - "`X` er kontinuerlig (måling, tid, mengde) → bruk integralet `E[X] = ∫ x·f(x) dx` (og tilsvarende for `Var`)"
  - "Du har bare rådata `x_1, ..., x_n` uten sannsynligheter → bruk [utvalgsgjennomsnitt og utvalgsvarians](/entry/utvalgsvarians-radata) (deler på `n − 1`, ikke vekter med `P(X=x)`)"
  - "Du har en simultantabell `P(X = x, Y = y)` → marginaliser først med [marginalfordeling](/entry/marginalfordeling) for å hente ut riktige `P(X = x)`"
  - "Du vil måle samvariasjon mellom to variabler → [kovarians](/entry/kovarians) og [korrelasjon ρ](/entry/korrelasjon-joint)"

symbols:
  - { sym: "X",          means: "den diskrete stokastiske variabelen" }
  - { sym: "x_i",        means: "verdiene `X` kan ta" }
  - { sym: "P(X = x_i)", means: "sannsynligheten for hver verdi" }
  - { sym: "E[X], μ",    means: "forventningsverdien (tyngdepunkt i fordelingen)" }
  - { sym: "Var(X), σ²", means: "variansen (vektet kvadratavvik fra `μ`)" }
  - { sym: "σ",          means: "standardavviket, `σ = √Var(X)` (samme enhet som `X`)" }
  - { sym: "E[X²]",      means: "`Σ x_i² · P(X = x_i)` — brukes i snarveien `Var(X) = E[X²] − μ²`" }

filters:
  computes: [expected_value, std_dev, marginal_probability]
  random_variable: [discrete_count]
  setup: [single_population]
  structural_cues: [summary_stats_given, data_as_list]
  parameters_known: [mean_known]
  distribution_assumption: [none_assumed]
  tooling: [calculator_only, calculator_sqrt]

