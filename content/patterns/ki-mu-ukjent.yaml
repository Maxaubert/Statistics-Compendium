id: ki-mu-ukjent
name_no: "Normal antatt, σ ukjent — KI for μ"
cue: "Oppgaven ber om et konfidensintervall for μ, men populasjonens σ er IKKE oppgitt. Du har derimot utvalgs-standardavviket s (eller råtall som kan brukes til å regne s). Dette er standardsituasjonen i praksis."
procedure:
  - "Identifiser konfidensnivået (1 − α)·100 % og frihetsgrader ν = n − 1"
  - "Slå opp t_(α/2, n−1) i t-tabell (tabell A.3)"
  - "Regn utvalgsgjennomsnitt x̄ og utvalgs-standardavvik s hvis ikke gitt"
  - "Regn standardfeilen s/√n"
  - "Regn marginalfeilen E = t_(α/2, n−1) · s/√n"
  - "Skriv intervallet: x̄ ± E"
entry_refs:
  - ki-mu-ukjent-sigma
example: "n = 10, x̄ = 12.5, s = 2.1. 95 % KI for μ: t_(0.025, 9) = 2.262, så 12.5 ± 2.262·2.1/√10 = 12.5 ± 1.502 = [11.00, 14.00]."
