id: standardavvik
term_no: Standardavvik (σ, s)
short_def: "Kvadratroten av variansen — spredning i samme enhet som dataene."
filters:
  computes: [std_dev, range_probability, parameter_estimate]
  parameters_known: [population_variance_known, population_variance_unknown]
  structural_cues: [normal_assumed, data_as_list, mean_and_sd_given]
  distribution_assumption: [normal]
long_def: |
  Definisjon:

      σ = √Var(X)        (utvalg: s = √s²)

  Tommelfingerregel for normalfordelte data:

  - `~68 %` ligger innen `1σ` fra `μ`
  - `~95 %` innen `2σ`
  - `~99.7 %` innen `3σ`

  Brukes i standardisering:

      Z = (X − μ) / σ
see_also:
  - { id: varians-standardavvik-diskret, kind: entry }
  - { id: normalisering, kind: glossary }
