id: en-utvalg-z-test-andel
name_no: "Z-test for andel p"
type: test
category: hypothesis_test
tagline: "Tester om en suksessrate p i en populasjon er lik (eller minst/høyst) en gitt verdi p₀."

formula_main: "Z = (X - n·p₀) / √(n · p₀ · (1 - p₀))"
formula_latex: "Z = \\frac{X - n p_0}{\\sqrt{n p_0 (1 - p_0)}}"

what_it_does: |
  Tester nullhypotesen om sannsynligheten p (eller andelen) i en
  populasjon er lik p₀, basert på at vi har observert X suksesser i
  n forsøk. Bruker normalapproksimasjon for binomialfordelingen, som
  er gyldig når n·p̂·(1-p̂) ≥ 5.

why_use: |
  Når problemet handler om en andel – andelen syke i en populasjon,
  andelen velgere som støtter en kandidat, andelen defekte enheter –
  og ikke et gjennomsnitt. Vanlig type test i offentlige undersøkelser.

recognition_cues:
  - "Du har en BINOMISK situasjon: n forsøk med samme suksessannsynlighet"
  - "Du tester om p (andelen suksesser i populasjonen) er lik en gitt p₀"
  - "Du har observert X suksesser av n forsøk"
  - "Antall forsøk er stort nok: n·p̂·(1-p̂) ≥ 5"

when_NOT_to_use:
  - "n er liten og normalapproksimasjon ikke gyldig – bruk eksakt binomial"
  - "Du tester gjennomsnitt, ikke andel – bruk z- eller t-test for μ"

symbols:
  - { sym: "X",   means: "antall suksesser observert i utvalget" }
  - { sym: "n",   means: "totalt antall forsøk" }
  - { sym: "p₀",  means: "verdien for sannsynlighet vi tester mot" }
  - { sym: "p̂",   means: "estimert andel, p̂ = X/n" }
  - { sym: "Z",   means: "testobservator, standardnormalfordelt under H₀" }

filters:
  computes: [hypothesis_test, find_n_for_threshold]
  random_variable: [proportion, discrete_count]
  setup: [single_population, fixed_n_trials, with_replacement]
  structural_cues: [two_outcomes_per_trial, success_probability_given, independent_events, total_observations_n, summary_stats_given]
  parameters_known: [success_p, sample_size_large, alpha_significance]
  distribution_assumption: [binomial, normal]
  tooling: [standard_normal_table_E3, normal_quantile_table_E4, calculator_sqrt]
solution_template:
  - "Formuler hypotesene H₀: p = p₀ vs H₁ (én- eller tosidig)"
  - "Bekreft normalapproksimasjon: n·p̂·(1-p̂) ≥ 5"
  - "Beregn p̂ = x/n"
  - "Beregn z = (x - n·p₀) / √(n·p₀·(1-p₀)) – eller ekvivalent z = (p̂ - p₀) / √(p₀(1-p₀)/n)"
  - "Finn kvantil z_α (ensidig) eller z_(α/2) (tosidig) i tabell E.4"
  - "Sammenlign og konkluder"

common_traps: |
  Variansen i nevneren bruker p₀ (verdien fra H₀), IKKE p̂. Dette er
  forskjellig fra konfidensintervall for andel, som bruker p̂. Husk
  rotuttrykket – vanlig feil å glemme kvadratroten.

python_snippet: |
  from scipy.stats import norm
  import math

  x, n, p0, alpha = 23, 80, 0.30, 0.05
  z = (x - n*p0) / math.sqrt(n * p0 * (1 - p0))
  z_crit = norm.ppf(1 - alpha/2)             # tosidig 1.96

detailed_solution_variants:
  - label: "Z-test for andel p"
    solutions:
      - source: "Praksis · myntfairness (tosidig)"
        question: "En mynt er kastet `n = 100` ganger og gitt `60` kron. Test om mynten er rettferdig (`p = 0.5`) på signifikansnivå 5 %."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: p = 0.5`  (mynten er rettferdig)" }
              - { text: "`H₁: p ≠ 0.5`  (tosidig — vi har ingen retningshypotese)" }
          - label: "Forutsetninger"
            lines:
              - { text: "Sjekk normalapproksimasjon: `n·p₀·(1−p₀) = 100·0.5·0.5 = 25 ≥ 5` ✓" }
              - { text: "`p̂ = 60/100 = 0.60`" }
          - label: "Testobservator"
            lines:
              - { text: "`Z = (p̂ − p₀) / √(p₀(1−p₀)/n)`" }
              - { indent: "`= (0.60 − 0.50) / √(0.5·0.5/100)`" }
              - { indent: "`= 0.10 / 0.05 = 2.00`" }
          - label: "Konklusjon"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_(α/2) = z_(0.025) = 1.960` (tosidig kritisk verdi)." } }
              - { text: "`|Z| = 2.00 > 1.96` → forkast `H₀`." }
        result: "Forkast `H₀` på 5 %-nivå: tallene tyder på at mynten ikke er rettferdig."

      - source: "Praksis · andel grantrær med sykdom (ensidig)"
        question: "En produsent påstår at høyst 20 % av grantrær har sykdom. Et utvalg på `n = 80` ga `23` syke. Test om andelen er HØYERE enn 20 % på 5 %-nivå."
        sections:
          - label: "Hypoteser"
            lines:
              - { text: "`H₀: p ≤ 0.20`  (produsentens påstand)" }
              - { text: "`H₁: p > 0.20`  (høyresidig)" }
          - label: "Forutsetninger"
            lines:
              - { text: "Normalapproksimasjon: `n·p₀·(1−p₀) = 80·0.20·0.80 = 12.8 ≥ 5` ✓" }
              - { text: "`p̂ = 23/80 = 0.2875`" }
          - label: "Testobservator"
            lines:
              - { text: "`Z = (p̂ − p₀) / √(p₀(1−p₀)/n)`" }
              - { indent: "`= (0.2875 − 0.20) / √(0.20·0.80/80)`" }
              - { indent: "`= 0.0875 / 0.04472 ≈ 1.957`" }
          - label: "Konklusjon"
            lines:
              - { table_lookup: { ref: "E.4", text: "`z_α = z_(0.05) = 1.645` (ensidig kritisk verdi)." } }
              - { text: "`Z = 1.957 > 1.645` → forkast `H₀`." }
        result: "Forkast `H₀` på 5 %-nivå: utvalget tyder på at andelen syke trær er høyere enn 20 %."

