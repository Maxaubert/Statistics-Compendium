id: tosidig-test
term_no: Tosidig test (to-sidig)
short_def: "Hypotesen ser begge retninger — `H₁: μ ≠ μ₀`."
filters:
  computes: [hypothesis_test]
  parameters_known: [alpha_significance, population_variance_unknown, population_variance_known]
  random_variable: [mean_of_samples]
  distribution_assumption: [t_distribution, normal]
  tooling: [normal_quantile_table_E4, t_quantile_table_E5, standard_normal_table_E3]
long_def: |
  En tosidig test forkaster hvis observatoren er langt unna i begge
  retninger. `α` deles likt i to haler (`α/2` i hver).

  **Kritisk verdi:**

      z_(α/2)        eller    t_(α/2, df)

  **p-verdi** (symmetrisk fordeling):

      p = 2 · P(|Z| ≥ |observert|)

  Standard når oppgaven bare spør om det er «forskjell» eller «endring»
  uten å spesifisere retning.
see_also:
  - { id: ensidig-test, kind: glossary }
  - { id: alternativhypotese, kind: glossary }
  - { id: kritisk-verdi, kind: glossary }
  - { id: p-verdi-glos, kind: glossary }
