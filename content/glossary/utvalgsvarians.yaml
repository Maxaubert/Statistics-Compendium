id: utvalgsvarians
term_no: Utvalgsvarians (s²)
short_def: "Estimat for `σ²` regnet ut fra rådata: `s² = Σ(xᵢ − x̄)² / (n − 1)`."
filters:
  parameters_known: [population_variance_unknown, confidence_level]
  distribution_assumption: [t_distribution, chi_squared]
  computes: [std_dev, parameter_estimate, confidence_interval, variance]
  structural_cues: [data_as_list]
  random_variable: [difference_of_means]
  setup: [two_independent_samples, single_population]
  tooling: [chi_square_quantile_table_E6]
long_def: |
  Formel:

      s² = Σ(xᵢ − x̄)² / (n − 1)

  Den vanligste variansformen i praksis: gjennomsnittlig kvadrert avvik
  fra `x̄`, med `n − 1` i nevneren (Bessels korreksjon) for å være
  forventningsrett for `σ²`.

  **Trenger rådata** `x_1, …, x_n` for å regne `Σ(xᵢ − x̄)²`.

  Standardavviket er `s = √s²`. Brukes i én-utvalg t-test, KI for `μ`
  (ukjent `σ`), KI for `σ²`, og pooled varians.
aliases:
  - utvalgsvarians
  - utvalgsvariansen
  - s²
