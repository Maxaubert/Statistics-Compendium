id: alpha
term_no: Alfa (α)
short_def: "Signifikansnivå i hypotesetesting – også konstantleddet i regresjonslinja Y = α + β·X."
long_def: |
  α har to vanlige betydninger på dette kurset. (1) Signifikansnivå:
  sannsynligheten du godtar for å forkaste H₀ når H₀ er sann (type-1-feil).
  Vanlige verdier: 0.10, 0.05, 0.01. Konfidensnivå = 1 − α. (2) I regresjon:
  konstantleddet (intercept), altså verdien til Y når X = 0.
see_also:
