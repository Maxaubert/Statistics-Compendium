id: beta
term_no: Beta (β)
short_def: "Stigningstall i regresjon — også sannsynligheten for type-II-feil i hypotesetesting."
aliases:
  - beta
  - β
long_def: |
  β har to betydninger:

  - **Regresjon:** stigningstallet i `Y = α + β·X + ε`, altså hvor mye `Y` endres når `X` øker med én enhet.
  - **Hypotesetesting:** sannsynligheten for type-II-feil (å beholde `H₀` når `H₁` er sann). Teststyrke = `1 − β`.

  Lærebøker er ofte tvetydige – sjekk konteksten.
