id: signifikansniva-glos
term_no: Signifikansnivå (α)
short_def: "Risikoen du godtar for å forkaste `H₀` når `H₀` egentlig er sann."
filters:
  parameters_known: [alpha_significance, confidence_level]
  computes: [hypothesis_test, confidence_interval]
long_def: |
  Signifikansnivået `α` bestemmer hvor sterke beviser du krever før du
  forkaster `H₀`. Vanlige verdier: `0.10`, `0.05`, `0.01`.

  - Konfidensnivå er `1 − α`, så et 95 % KI svarer til `α = 0.05`.
  - Beslutningsregel: forkast `H₀` hvis `p < α`.

  **Tre måter å bruke `α`:**

  1. Sammenligne testobservator med kvantil `z_α` (eller `t_α`): forkast hvis testobs > kvantil.
  2. Sammenligne p-verdi med `α`: forkast hvis `p < α`.
  3. Bygge konfidensintervall: med `(1 − α)·100 %` konfidensnivå.
see_also:
