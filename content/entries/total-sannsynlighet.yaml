id: total-sannsynlighet
name_no: "Setningen om total sannsynlighet"
type: rule
category: probability_rule
tagline: "Total sannsynlighet for B summert over alle 'måter' den kan inntreffe."

formula_main: "P(B) = P(A) · P(B|A) + P(A̅) · P(B|A̅)"
formula_latex: "P(B) = P(A) \\cdot P(B|A) + P(\\overline{A}) \\cdot P(B|\\overline{A})"

what_it_does: |
  Bryter sannsynligheten for B opp i bidrag fra to disjunkte tilfeller A
  og A̅ (eller mer generelt fra en partisjon av utfallsrommet). Brukes
  ofte når B kan inntreffe på flere "måter" og betingede sannsynligheter
  er gitt for hver.

why_use: |
  Standardteknikken når oppgaven gir P(B|A), P(B|A̅), og marginalsannsynlighetene
  P(A), P(A̅), og spør etter P(B). Også grunnsteinen i Bayes' setning.

recognition_cues:
  - "Du er gitt betingede sannsynligheter P(B|A) og P(B|A̅)"
  - "Du vil finne den marginale (totale) sannsynligheten P(B)"
  - "Spørsmålet handler om 'hva er sjansen for B totalt sett?'"
  - "Populasjonen er delt i grupper (kjønn, type, kategori) og du vil utlede en samlet rate"

symbols:
  - { sym: "A, A̅",    means: "to disjunkte hendelser som dekker hele utfallsrommet" }
  - { sym: "P(B|A)",  means: "sannsynlighet for B gitt A" }
  - { sym: "P(B)",    means: "den marginale (totale) sannsynligheten for B" }

filters:
  computes: [exact_probability, marginal_probability]
  random_variable: []
  setup: [single_population]
  structural_cues: [conditional_given, more_than_two_categories]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_only]

solution_variants:
  - label: "Forover: finn `P(B)`"
    steps:
      - "Identifiser partisjonen (typisk `A` og `Ā`, eller flere disjunkte hendelser som dekker hele utfallsrommet)"
      - "Skriv ned marginalsannsynlighetene `P(A)`, `P(Ā)` og de betingede `P(B|A)`, `P(B|Ā)`"
      - "Sjekk at `P(A) + P(Ā) = 1` (eller at alle marginalsannsynlighetene summeres til 1 ved flere hypoteser)"
      - "Sett inn i formelen: `P(B) = Σ_i P(A_i)·P(B|A_i)`"
      - "Eksempel: `P(T) = P(J)·P(T|J) + P(J̄)·P(T|J̄) = 0.52·0.23 + 0.48·0.34 = 0.2828`"
  - label: "Bakover: finn ukjent betinget"
    steps:
      - "Bruk når `P(B)` ER GITT (ofte 'totalt sett'-tall) sammen med en av de betingede, og du skal finne den ANDRE betingede"
      - "Identifiser hva som er gitt: typisk `P(B)`, `P(A)`, `P(B|A)` — og hva som er ukjent: `P(B|Ā)`"
      - "Skriv opp samme ligning som forover-varianten: `P(B) = P(A)·P(B|A) + P(Ā)·P(B|Ā)`"
      - "Løs for det ukjente leddet: `P(B|Ā) = (P(B) − P(A)·P(B|A)) / P(Ā)`"
      - "Eksempel: P(spirer) = 0.8 totalt, P(ringblomstfrø) = 0.6, P(spirer|ringblomstfrø) = 0.9. Spiregraden for andre frø: `(0.8 − 0.6·0.9) / (1 − 0.6) = 0.26/0.4 = 0.65`"
      - "Sjekk fornuft: svaret skal ligge i `[0, 1]` og være konsistent med marginalen"

common_traps: |
  Pass på at A og A̅ er DISJUNKTE og dekker hele utfallsrommet. For mer enn
  to grupper, summer over alle: P(B) = Σ P(A_i)·P(B|A_i). Sjekk at
  P(A) + P(A̅) = 1.

detailed_solution_variants:
  - label: "Total sannsynlighet"
    solutions:
      - source: "Eksamen mai25 · oppgave 2c"
        question: "23 % av jentene og 34 % av guttene drikker tran daglig. Populasjonen er 52 % jenter og 48 % gutter. Finn `P(T)`."
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `J` (jente) og `J̄` (gutt) – disjunkte og dekker hele utfallsrommet." }
              - { text: "La `T` være hendelsen 'drikker tran daglig'." }
              - { text: "Marginalsannsynligheter: `P(J) = 0.52`, `P(J̄) = 0.48`." }
              - { text: "Betingede sannsynligheter: `P(T|J) = 0.23`, `P(T|J̄) = 0.34`." }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Setningen om total sannsynlighet gir:" }
              - { indent: "`P(T) = P(J)·P(T|J) + P(J̄)·P(T|J̄)`" }
              - { text: "Innsetting av tallene:" }
              - { indent: "`= 0.52·0.23 + 0.48·0.34`" }
              - { indent: "`= 0.1196 + 0.1632`" }
        result: "`P(T) = 0.2828` (28.28 %)"
      - source: "Praksis · produksjonslinje"
        question: "Tre maskiner produserer komponenter. Maskin A lager 50 % med defektrate 1 %, maskin B lager 30 % med defektrate 2 %, og maskin C lager 20 % med defektrate 5 %. Hva er den totale sannsynligheten for at en tilfeldig valgt komponent er defekt?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `{A, B, C}` – maskinen som produserte komponenten (disjunkt og dekkende)." }
              - { text: "La `D` være hendelsen 'komponenten er defekt'." }
              - { text: "Marginalsannsynligheter: `P(A) = 0.50`, `P(B) = 0.30`, `P(C) = 0.20`." }
              - { text: "Betingede defektrater: `P(D|A) = 0.01`, `P(D|B) = 0.02`, `P(D|C) = 0.05`." }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Summer bidragene fra hver maskin:" }
              - { indent: "`P(D) = P(A)·P(D|A) + P(B)·P(D|B) + P(C)·P(D|C)`" }
              - { text: "Innsetting:" }
              - { indent: "`= 0.50·0.01 + 0.30·0.02 + 0.20·0.05`" }
              - { indent: "`= 0.005 + 0.006 + 0.010`" }
              - { comment: "Sjekk: `P(A) + P(B) + P(C) = 1` – partisjonen er gyldig." }
        result: "`P(D) = 0.021` (2.1 %)"
      - source: "Praksis · medisinsk test"
        question: "I en befolkning er 1 % syke og 99 % friske. Testen er 99 % nøyaktig på syke (sensitivitet) og 95 % nøyaktig på friske (spesifisitet, dvs. 5 % falsk positiv). Hva er den totale sannsynligheten for at en tilfeldig testet person får positivt testresultat?"
        sections:
          - label: "Identifisering"
            lines:
              - { text: "Partisjon: `S` (syk) og `S̄` (frisk) – disjunkte og dekker hele utfallsrommet." }
              - { text: "La `+` være hendelsen 'positivt testresultat'." }
              - { text: "Marginalsannsynligheter: `P(S) = 0.01`, `P(S̄) = 0.99`." }
              - { text: "Betingede sannsynligheter:" }
              - { indent: "`P(+|S) = 0.99` (sensitivitet – sann positiv)" }
              - { indent: "`P(+|S̄) = 0.05` (falsk positiv = 1 − spesifisitet)" }
          - label: "Total sannsynlighet"
            lines:
              - { text: "Setningen om total sannsynlighet gir:" }
              - { indent: "`P(+) = P(S)·P(+|S) + P(S̄)·P(+|S̄)`" }
              - { text: "Innsetting:" }
              - { indent: "`= 0.01·0.99 + 0.99·0.05`" }
              - { indent: "`= 0.0099 + 0.0495`" }
              - { comment: "Falsk-positiv-bidraget dominerer fordi friske er en mye større gruppe." }
        result: "`P(+) = 0.0594` (5.94 %)"

related:
