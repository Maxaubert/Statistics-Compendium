id: regresjon-residualvarians
name_no: "Residualenes varians S_E²"
type: regression
category: regression_estimate
tagline: "Variansen til feilene rundt regresjonslinjen — mål for hvor godt linjen passer."

formula_main: "S_E² = SSE / (n - 2);  SSE = Σ(y_i - α̂ - β̂·x_i)²"
formula_latex: "S_E^2 = \\frac{\\text{SSE}}{n - 2}, \\quad \\text{SSE} = \\sum (y_i - \\hat{\\alpha} - \\hat{\\beta} x_i)^2"

what_it_does: |
  Estimat for variansen til residualene (avvik mellom observert og
  predikert y). Inngår i utregning av SE(β̂) og prediksjonsintervaller.
  S_E (kvadratroten) kalles ofte "standard error" i regresjon.

why_use: |
  Nødvendig som mellomberegning for nesten alt videre i regresjon:
  hypotesetest for β, KI for β, prediksjonsintervaller. Måler også
  generelt hvor "sprett" datapunktene er rundt regresjonslinjen.

recognition_cues:
  - "Du jobber med lineær regresjon"
  - "Du trenger SSE eller residualenes spredning"
  - "Spørsmålet snakker om 'residualenes varians' eller 'standardfeil'"
  - "Datatabell inkluderer kolonne (y_i - α̂ - β̂·x_i)²"

symbols:
  - { sym: "SSE",     means: "Sum of Squared Errors, Σ(y_i - α̂ - β̂·x_i)²" }
  - { sym: "S_E²",    means: "estimat for residualenes varians" }
  - { sym: "S_E",     means: "estimat for residualenes standardavvik" }
  - { sym: "n",       means: "antall observasjonspar" }
  - { sym: "ν",       means: "frihetsgrader, n - 2" }

filters:
  computes: [parameter_estimate]
  random_variable: [slope_estimate]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]

solution_template:
  - "Beregn SSE = Σ(y_i - α̂ - β̂·x_i)² (eller hent fra tabell)"
  - "S_E² = SSE / (n - 2)"
  - "S_E = √S_E² (standardavviket)"

common_traps: |
  Frihetsgrader er n - 2 (ikke n - 1), fordi to parametre (α̂, β̂) er
  estimert. SSE forveksles ofte med S_XX = Σ(x-x̄)² — disse er HELT
  forskjellige.

python_snippet: |
  import numpy as np
  x = np.array([5,6,7,8,6,7,8,5,9,7])
  y = np.array([68,75,80,85,72,78,92,70,95,82])
  beta_hat, alpha_hat = 6.63, 34.6
  y_hat = alpha_hat + beta_hat * x
  SSE = ((y - y_hat) ** 2).sum()       # 48.7437
  SE2 = SSE / (len(x) - 2)              # 6.093
  SE = SE2 ** 0.5                       # 2.4684

examples:
  - source: "Eksamen mai25 · oppgave 5d"
    excerpt: "SSE = 48.7437, n = 10. Finn S_E²."
    solution_sketch: "S_E² = 48.7437 / 8 = 6.093"
  - source: "Eksamen jan26 · oppgave 6"
    excerpt: "Oppgitt: S_E² = 6.093, brukt i prediksjonsintervall."
    solution_sketch: "S_E = √6.093 = 2.4684"

