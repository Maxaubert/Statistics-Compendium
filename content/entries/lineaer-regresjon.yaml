id: lineaer-regresjon
name_no: "Lineær regresjon og korrelasjon (Pearson r)"
type: regression
category: regression_estimate
tagline: "Modeller en lineær sammenheng `Y = α + β·x + ε`. Estimer linja, mål usikkerhet, test, prediker."

formula_main: "ŷ = α̂ + β̂·x;  β̂ = S_XY / S_XX;  α̂ = ȳ − β̂·x̄"
formula_latex: "\\hat{y} = \\hat{\\alpha} + \\hat{\\beta} x \\quad\\text{der}\\quad \\hat{\\beta} = \\frac{S_{XY}}{S_{XX}}, \\quad \\hat{\\alpha} = \\bar{y} - \\hat{\\beta}\\bar{x}"

what_it_does: |
  Modellerer en LINEÆR sammenheng mellom en uavhengig variabel `x` og en avhengig
  variabel `Y`. Modellen er `Y = α + β·x + ε` der `ε ~ N(0, σ²)` er en tilfeldig
  feilkomponent. Vi estimerer parametrene `α` og `β` ut fra `n` observasjonspar
  `(x_i, y_i)` med minste-kvadraters-metode og får regresjonslinja `ŷ = α̂ + β̂·x`.

  Sida samler ALT du trenger for enkel lineær regresjon: estimering av linja,
  residualvarians `S_E²`, standardfeilen `SE(β̂)`, hypotesetest for stigningstallet,
  prediksjonsintervall for en ny `Y`, og korrelasjonskoeffisient `r`. Velg fane
  under for prosedyren som passer oppgaven din.

why_use: |
  Lineær regresjon er det vanligste verktøyet for å beskrive og predikere
  sammenhenger mellom to kontinuerlige størrelser. Du bruker den til å:

  - estimere hvor mye `y` endres når `x` øker med én enhet (`β̂`),
  - måle hvor godt linja passer dataene (`S_E²`, `r`, `r²`),
  - avgjøre om sammenhengen er statistisk signifikant (hypotesetest for `β`),
  - predikere en ny `y`-verdi for en gitt `x` (prediksjonsintervall).

  Velg riktig fane under: prosedyrene bruker stort sett de samme mellom-summene
  (`S_XX`, `S_XY`, `S_E²`), så når du har gjort én er du halvveis gjennom de andre.

recognition_cues:
  - "Du har `n` par av observasjoner `(x_i, y_i)` og mistenker en lineær sammenheng"
  - "Spørsmålet ber om å 'estimere regresjonslinja' eller å 'finne `ŷ`'"
  - "Spørsmålet ber om en `β̂`, `α̂`, residualvarians `S_E²`, standardfeil `SE(β̂)`, korrelasjon `r`, eller prediksjonsintervall"
  - "Hypotesetest med `n − 2` frihetsgrader nevnes — kjennetegn på regresjonstest"
  - "Datatabell viser `Σ(x − x̄)²`, `Σ(x − x̄)(y − ȳ)`, `Σ(y − ȳ)²` (typiske mellom-summer)"
  - "Oppgaven sier 'er det usannsynlig at en ny observasjon ligger over/under en verdi?' (prediksjonsintervall)"

when_NOT_to_use:
  - "Du har flere uavhengige variabler `x_1, x_2, …` → bruk [multippel regresjon](/entry/multippel-regresjon)"
  - "Sammenhengen er åpenbart ikke-lineær (kurvet, eksponentiell) → vurder transformasjon eller annen modell"
  - "Du jobber med en simultanfordeling `P(X = x, Y = y)` (teoretisk, ikke utvalg) → bruk [korrelasjon ρ fra fellesfordeling](/entry/korrelasjon-joint)"
  - "Du har bare `y`-verdier uten en uavhengig `x` → vanlig én-utvalgs-statistikk: [t-test](/entry/en-utvalg-t-test), [KI for μ](/entry/ki-mu-og-varians)"
  - "Du forventer at residualene IKKE er normalfordelte eller har konstant varians → vurder bootstrap eller robust regresjon"

symbols:
  - { sym: "x_i, y_i",       means: "de `n` observasjonsparene" }
  - { sym: "n",              means: "antall observasjonspar" }
  - { sym: "x̄, ȳ",          means: "gjennomsnitt av `x`- og `y`-verdiene" }
  - { sym: "α̂",             means: "estimat for skjæringspunktet (intercept), `α̂ = ȳ − β̂·x̄`" }
  - { sym: "β̂",             means: "estimat for stigningstallet (slope), `β̂ = S_XY / S_XX`" }
  - { sym: "β",              means: "den ukjente populasjonsstigningen (det vi tester og lager KI for)" }
  - { sym: "ŷ",              means: "predikert verdi: `ŷ = α̂ + β̂·x`" }
  - { sym: "ε",              means: "tilfeldig feilkomponent, `ε ~ N(0, σ²)`" }
  - { sym: "σ²",             means: "den (ukjente) variansen til residualene i populasjonen" }
  - { sym: "S_XX",           means: "`Σ(x_i − x̄)²` — sum av kvadrerte avvik for `x`" }
  - { sym: "S_YY",           means: "`Σ(y_i − ȳ)²` — sum av kvadrerte avvik for `y`" }
  - { sym: "S_XY",           means: "`Σ(x_i − x̄)(y_i − ȳ)` — krysssum" }
  - { sym: "SSE",            means: "`Σ(y_i − ŷ_i)²` — sum av kvadrerte residualer" }
  - { sym: "S_E²",           means: "estimat for residualvariansen, `S_E² = SSE / (n − 2)`" }
  - { sym: "S_E",            means: "estimat for residualstandardavviket, `S_E = √S_E²`" }
  - { sym: "SE(β̂)",         means: "standardfeilen til `β̂`, `SE(β̂) = √(S_E² / S_XX)`" }
  - { sym: "r",              means: "korrelasjonskoeffisient (Pearson), `r = S_XY / √(S_XX · S_YY)`" }
  - { sym: "r²",             means: "forklaringsgrad — andel av variasjonen i `y` som forklares av lineær regresjon på `x`" }
  - { sym: "T",              means: "testobservator for `β`, t-fordelt med `n − 2` frihetsgrader under `H₀`" }
  - { sym: "ν",              means: "frihetsgrader, `ν = n − 2`" }
  - { sym: "t_(α/2, n−2)",   means: "kvantil i t-fordelingen med `n − 2` frihetsgrader" }

properties:
  expected_value: "E[β̂] = β"
  variance: "Var(β̂) = σ² / S_XX"
  std_dev: "SE(β̂) = √(S_E² / S_XX)"

filters:
  computes: [parameter_estimate, std_dev, hypothesis_test, prediction_interval, correlation, find_x_for_threshold, confidence_interval, test_independence]
  random_variable: [slope_estimate, continuous]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list, summary_stats_given, normal_assumed, two_sided_alternative, one_sided_alternative]
  parameters_known: [slope_se, residual_variance, sum_xx_sxy, confidence_level, alpha_significance, population_variance_unknown, regression_line_estimate]
  distribution_assumption: [t_distribution, normal, none_assumed]
  tooling: [t_quantile_table_E5, calculator_sqrt, calculator_only]

