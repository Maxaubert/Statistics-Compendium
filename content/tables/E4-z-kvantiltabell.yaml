id: E4-z-kvantiltabell
name_no: "Z-kvantiltabell"
formal_name_no: "Standardnormalfordelingens kvantiltabell"
code: "E.4"
description: "Inverse av Z-tabellen. Slår opp z_α slik at P(Z > z_α) = α (areal i høyre hale). Brukes typisk i konfidensintervaller og ensidige hypotesetester."
inputs:
  - { name: "α", type: number, min: 0.001, max: 0.5, step: any }
output: "z_α"
distribution: normal_quantile
toggle_label: "α (høyre hale)"
input_hint: "α er sannsynligheten i HØYRE hale: P(Z > z_α) = α. F.eks. α = 0.05 gir z_α ≈ 1.645."
inverse:
  inputs:
    - { name: "p", type: number, min: 0.0001, max: 0.9999, step: any }
  output: "z slik at G(z) = p"
  toggle_label: "p (kumulativ)"
  input_hint: "p er kumulativ VENSTRE-hale-sannsynlighet: P(Z ≤ z) = p. F.eks. p = 0.9 gir z ≈ 1.2816."
related_entries:
  - normalfordeling
  - ki-mu-og-varians
  - ki-andel-binomial
  - ki-poissonrate
  - en-utvalg-z-test
  - en-utvalg-z-test-andel
