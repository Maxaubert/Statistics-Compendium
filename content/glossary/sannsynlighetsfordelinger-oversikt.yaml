id: sannsynlighetsfordelinger-oversikt
term_no: "Hvilken sannsynlighetsfordeling? — oversikt"
short_def: "Cheat-sheet for «hvilken navngitt fordeling beskriver dette?». Strukturen i situasjonen avgjør, ikke navnet."
