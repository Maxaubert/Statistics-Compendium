id: standardfeil
term_no: Standardfeil (SE)
short_def: "Standardavviket til et estimat — hvor mye estimatet typisk varierer fra utvalg til utvalg."
aliases:
  - standardfeil
  - standardfeilen
  - SE
long_def: |
  Formel: `SE(X̄) = σ/√n` (eller `s/√n` hvis `σ` er ukjent).

  `SE` er **IKKE** spredningen i dataene, men spredningen i estimatet.
  Står i nevneren i nesten alle testobservatorer og KI-er:

  - **Testobservator:** `estimat / SE`
  - **KI:** `estimat ± kvantil · SE`
see_also:
  - { id: ki-mu-kjent-sigma, kind: entry }
  - { id: regresjon-standardfeil-stigningstall, kind: entry }
