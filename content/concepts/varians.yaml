id: varians
name_no: "Varians (oversikt over de ulike formene)"
type: concept
tagline: "Mål for spredning. Samme idé i alle former, men formelen ser ulik ut etter hva slags data du har."

what_it_means: |
  Varians måler hvor mye en variabel typisk avviker kvadratisk fra
  gjennomsnittet. Standardavviket er kvadratroten av variansen og har
  samme enhet som dataene.

  Den grunnleggende ideen er alltid den samme:

      varians = «vektet sum av kvadrerte avvik fra gjennomsnittet»

  Sidene under er en kjapp oversikt over hver variansform. **Klikk på
  overskriften** for å åpne ordliste-popupen med detaljert forklaring,
  inkludert om du trenger rådata eller ikke.

  ## [Variansen til diskret stokastisk variabel](glossary:diskret-varians)

      Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)

  Når du har en PMF-tabell. Vekt = sannsynligheten.

  Entry: [Varians og standardavvik (diskret stokastisk variabel)](/entry/varians-standardavvik-diskret).

  ## [Utvalgsvarians (s²)](glossary:utvalgsvarians)

      s² = Σ (xᵢ − x̄)² / (n − 1)

  Den vanligste formen i praksis — fra rådata når fordelingen er ukjent.

  Entry: [Utvalgsvarians fra rådata](/entry/utvalgsvarians-radata). Brukes i:
  [Én-utvalg t-test](/entry/en-utvalg-t-test),
  [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma),
  [KI for σ²](/entry/ki-varians).

  ## [Pooled (interpolert) varians (S_P²)](glossary:pooled-varians)

      S_P² = ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2)

  Felles variansestimat for to grupper med antatt lik `σ²`.

  Brukes i: [To-utvalgs t-test (pooled)](/entry/to-utvalgs-t-test).

  ## [Residualvarians (S_E²)](glossary:residualvarians)

      S_E² = Σ (yᵢ − ŷᵢ)² / (n − 2)

  Spredningen i avvikene fra regresjonslinjen.

  Entry: [Residualenes varians](/entry/regresjon-residualvarians).
  Brukes i: [SE(β̂)](/entry/regresjon-standardfeil-stigningstall),
  [Hypotesetest for β](/entry/regresjon-test-stigningstall),
  [Prediksjonsintervall](/entry/regresjon-prediksjonsintervall).

  ## [Binomialvarians](glossary:binomialvarians)

      Var(X) = np(1 − p)

  For `B(n, p)`. Størst når `p = 0.5`.

  Entry: [Binomialfordeling](/entry/binomial-fordeling).

  ## [Poissonvarians](glossary:poissonvarians)

      Var(X) = λ   (eller λt for et vindu)

  Spesielt: `E[X] = Var(X) = λ` for Poisson.

  Entry: [Poissonfordeling](/entry/poisson-fordeling).

  ## [Eksponentialvarians](glossary:eksponentialvarians)

      Var(T) = 1/λ²

  Ventetid med rate `λ`.

  Entry: [Eksponentialfordeling](/entry/eksponential-fordeling).

  ## [Hypergeometrisk varians](glossary:hypergeometrisk-varians)

      Var(X) = n · (K/N) · ((N−K)/N) · ((N−n)/(N−1))

  Som binomialvariansen, men med endelig-populasjon-korreksjon.

  Entry: [Hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling).

  ## [Normalvarians](glossary:normalvarians)

      Var(X) = σ²

  Trivielt — `σ²` er parameteren selv.

  Entry: [Normalfordeling](/entry/normalfordeling).

  ## [Variansen til utvalgsgjennomsnittet](glossary:variansen-til-utvalgsgjennomsnittet)

      Var(X̄) = σ²/n          SE(X̄) = σ/√n

  Spredningen i selve estimatet `X̄`, ikke i dataene.

  Innebygget i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  ## [Variansen til stigningstallet](glossary:variansen-til-stigningstallet)

      Var(β̂) = S_E² / S_XX          SE(β̂) = √(Var(β̂))

  Hvor presist vi kjenner regresjonsstigningen.

  Entry: [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).

  ## Sammenheng

  Alle disse er forskjellige måter å regne det samme grunnbegrepet —
  en gjennomsnittlig kvadrert avvik. Vekten og delingsleddet endrer seg
  etter hva du har og hva du estimerer.

  Hvis du forstår hvorfor `s² = Σ(xᵢ − x̄)² / (n − 1)` er riktig form for
  rådata, har du forstått rytmen i alle de andre.

  Se også [Standardavvik (oversikt)](/concept/standardavvik) for parallellen til σ.

recognition_cues:
  - "Oppgaven nevner spredning, varians, eller standardavvik"
  - "Du må velge mellom flere variansformer (rådata vs. fordeling vs. residual)"
  - "Du trenger et estimat for σ² for å gå videre i en t-test eller KI"

