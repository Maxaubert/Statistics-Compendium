solution_variants:
  - label: "Estimere α̂ og β̂"
    recognition: "«Estimer regresjonslinja `ŷ = α̂ + β̂·x` fra dataene», «Finn `β̂` og `α̂`», eller «beste lineære tilpasning». Du har typisk en datatabell eller ferdige mellom-summer (`S_XX`, `S_XY`, `x̄`, `ȳ`)."
    steps:
      - "Beregn `x̄` og `ȳ` fra rådata, eller hent dem fra oppgaven."
      - text: "Beregn mellom-summene `S_XX` og `S_XY`."
        formula:
          - "S_XX = Σ(x_i − x̄)²"
          - "S_XY = Σ(x_i − x̄)(y_i − ȳ)"
      - text: "Hvis bare `Σx_i², Σx_i·y_i` er gitt, bruk beregningsformlene:"
        formula:
          - "S_XX = Σx_i² − n·x̄²"
          - "S_XY = Σx_i·y_i − n·x̄·ȳ"
        conditional: true
      - text: "Beregn stigningstallet."
        formula: "β̂ = S_XY / S_XX"
      - text: "Beregn skjæringspunktet."
        formula: "α̂ = ȳ − β̂·x̄"
      - text: "Eksempel: `S_XX = 15.6`, `S_XY = 103.4`, `x̄ = 6.8`, `ȳ = 79.7`:"
        formula: "β̂ = 103.4 / 15.6 ≈ 6.63;  α̂ = 79.7 − 6.63·6.8 ≈ 34.62"
        example: true
      - text: "Skriv regresjonslinja. `x` er den uavhengige variabelen — den lar du stå som `x` når du oppgir linja generelt. Den settes inn først NÅR du skal predikere `ŷ` for en konkret verdi (f.eks. `x = 5` timer søvn ⇒ `ŷ(5) = α̂ + β̂·5`)."
        formula: "ŷ = α̂ + β̂·x"
      - "Sanity-sjekk: linja må gå gjennom `(x̄, ȳ)`. Sett `x = x̄` inn i `ŷ`-uttrykket og bekreft at du får `ȳ`."

  - label: "Residualvarians S_E²"
    recognition: "«Finn estimat for residualenes varians `S_E²`», «beregn `S_E`», eller «hvor stor er spredningen rundt linja?». Du har `SSE` eller mellom-summene; oftest et mellomsteg før hypotesetest, KI eller prediksjonsintervall."
    steps:
      - "Forutsetter at du har `α̂` og `β̂` (fra første fane)."
      - text: "Beregn `SSE` (sum av kvadrerte residualer), enten direkte fra rådata eller via den kompakte formelen som bruker `S_YY` og `S_XY`."
        formula:
          - "SSE = Σ(y_i − α̂ − β̂·x_i)²"
          - "SSE = S_YY − β̂·S_XY        (kompakt form)"
      - text: "Del på `n − 2` frihetsgrader (to parametre brukt opp på `α̂` og `β̂`)."
        formula: "S_E² = SSE / (n − 2)"
      - text: "Eksempel: `n = 10`, `SSE = 48.7437`:"
        formula: "S_E² = 48.7437 / 8 ≈ 6.093"
        example: true
      - text: "Ta kvadratrota hvis oppgaven ber om residualstandardavviket."
        formula: "S_E = √S_E² ≈ 2.4684"

  - label: "Standardfeil SE(β̂)"
    recognition: "«Finn standardfeilen til stigningstallet `SE(β̂)`» eller «hvor presist er `β̂` estimert?». Mellomsteg før hypotesetest eller KI for `β`."
    steps:
      - "Forutsetter at du har `S_E²` (fra forrige fane) og `S_XX` (fra første fane)."
      - text: "Sett inn i formelen."
        formula: "SE(β̂) = √(S_E² / S_XX)"
      - text: "Eksempel: `S_E² = 6.093`, `S_XX = 15.6`:"
        formula: "SE(β̂) = √(6.093 / 15.6) = √0.391 ≈ 0.625"
        example: true
      - "Tolkning: liten `SE(β̂)` ⇒ presis estimering av `β`; stor ⇒ bredt KI og lav test-styrke."

  - label: "Hypotesetest for β"
    recognition: "«Er det statistisk signifikant lineær sammenheng?», «test om `β = 0`», «kan sammenhengen skyldes tilfeldigheter?», eller «er stigningstallet ulikt null?». Du får ofte oppgitt et signifikansnivå `α` (f.eks. `0.05`)."
    steps:
      - text: "Formuler hypotesene (vanligvis tosidig, `β₀ = 0` for 'finnes sammenheng?')."
        formula: "H₀: β = β₀     mot     H₁: β ≠ β₀"
      - "Beregn `SE(β̂)` (fane før) hvis ikke gitt."
      - text: "Beregn testobservatoren."
        formula: "T = (β̂ − β₀) / SE(β̂)"
      - text: "Eksempel: `β̂ = 6.63`, `SE(β̂) = 0.625`, `β₀ = 0`:"
        formula: "T = 6.63 / 0.625 ≈ 10.61"
        example: true
      - "Slå opp `t_(α/2, n−2)` i **tabell E.5** (tosidig). For 95 %, `n = 10`: `t_(0.025, 8) = 2.306`."
      - text: "Forkastningsregel."
        formula: "Forkast H₀ hvis |T| > t_(α/2, n−2)"
      - text: "Ensidig variant: hvis `H₁: β > β₀` (eller `β < β₀`), bruk `t_(α, n−2)` og sjekk fortegnet."
        formula: "Forkast hvis T > t_(α, n−2)   (henholdsvis T < −t_(α, n−2))"
        conditional: true
      - "Konkluder kontekstuelt: 'forkast H₀ ⇒ statistisk grunnlag for lineær sammenheng' eller 'kan ikke forkaste — ingen statistisk grunnlag'."

  - label: "KI for E(Y|x)"
    recognition: "«Finn et 95 % konfidensintervall for `E(Y|x)` når `x = x₀`», «forventet hvilepuls for 35-åringer», «gjennomsnittlig respons ved gitt `x`», eller «estimer forventningsverdien til `Y` ved `x = x₀`». Spør om GJENNOMSNITTET (forventningsverdien) — ikke én ny enkelt observasjon."
    steps:
      - text: "Sjekk hva oppgaven har gitt deg. Mange størrelser kan utledes fra hverandre — bruk den formen oppgaven gir."
        cases:
          - { when: "`α̂`, `β̂`", then: "Skjæringspunkt og stigningstall (fra fane 1)" }
          - { when: "`s = √S²_E`", then: "Residualstandardavvik — ta `√` hvis oppgaven gir deg variansen `S²_E`" }
          - { when: "`SE(β̂)`", then: "Standardfeilen til `β̂` — brukes direkte i kompakt formel via `s/SE(β̂) = √S_XX`" }
          - { when: "`df = n − 2`", then: "Frihetsgrader til t-fordelingen" }
          - { when: "`x̄ = (Σx_i)/n`", then: "Gjennomsnitt av x — regn ut hvis ikke gitt" }
          - { when: "`x₀`", then: "x-verdien du estimerer forventningsverdien ved (gitt av oppgaven)" }
      - "Finn `α` fra konfidensnivået (90 % ⇒ `α = 0.10`, `α/2 = 0.05`; 95 % ⇒ `α/2 = 0.025`)."
      - "Slå opp `t_(α/2, n−2)` i **tabell E.5**."
      - text: "Beregn `ŷ₀` ved å sette `x₀` inn i regresjonslinja. `α̂` er skjæringspunktet (fra fane 1) — ikke `α` fra konfidensnivået."
        formula: "ŷ₀ = α̂ + β̂·x₀"
      - text: "Beregn margin (merk: INGEN `1+` under rota — det skiller fra prediksjonsintervallet). Bruk kompakt PDF-formel med `s/SE(β̂)` direkte:"
        formula: "margin = t_(α/2, n−2) · s · √(1/n + ((x₀ − x̄)/(s/SE(β̂)))²)"
      - text: "Ekvivalent form hvis oppgaven gir deg `S_XX` direkte i stedet for `SE(β̂)`:"
        formula: "margin = t_(α/2, n−2) · s · √(1/n + (x₀ − x̄)²/S_XX)"
        conditional: true
      - text: "Hvis oppgaven har gitt deg `S²_E` (variansen), husk å ta kvadratroten først: `s = √S²_E`."
        conditional: true
      - text: "Skriv konfidensintervallet."
        formula: "KI = ŷ₀ ± margin"
      - text: "Eksempel (sept 2022 oppg. 5e — hvilepuls vs alder): `α̂ = 69.22`, `β̂ = 0.114`, `s = 1.832`, `SE(β̂) = 0.040`, `x̄ = 41.9`, `n = 10`, `x₀ = 35`, 90 % ⇒ `t_(0.05, 8) = 1.860`:"
        formula:
          - "ŷ₀ = 69.22 + 0.114·35 = 73.2"
          - "margin = 1.860 · 1.832 · √(1/10 + ((35−41.9)/(1.832/0.040))²) ≈ 1.2"
          - "KI = 73.2 ± 1.2 = [72.0, 74.4]"
        example: true
      - text: "**Sammenligning med prediksjonsintervall** (samme oppsett): PI har `1 +` ekstra under rota, så det er ALLTID bredere enn KI for `E(Y|x)`."
        cases:
          - { when: "KI for `E(Y|x)`", then: "`margin = 1.860 · 1.832 · √(1/10 + 0.0227) ≈ 1.2`" }
          - { when: "PI for ny `Y`",   then: "`margin = 1.860 · 1.832 · √(1 + 1/10 + 0.0227) ≈ 3.6`" }
          - { when: "Forhold `PI/KI`", then: "≈ 3.0 ved `x₀ = 35` her — PI er ca. tre ganger bredere" }
      - "Tolkning: KI er smalest når `x₀ = x̄` (siste ledd under rota forsvinner) og vokser parabolsk når `x₀` fjerner seg fra `x̄`. Ekstrapolering langt utenfor datasettet gir uforsvarlig bred KI."

  - label: "Prediksjonsintervall for ny Y"
    recognition: "«Finn et 95 % prediksjonsintervall for `Y` når `x = x₀`», «er det usannsynlig at en student med 5 timers søvn får 75 % eller bedre?», eller «mellom hvilke verdier vil en ny `y` ligge?». Spør om ÉN ny enkelt observasjon, ikke gjennomsnittet."
    steps:
      - text: "Sjekk hva oppgaven har gitt deg. Mange størrelser kan utledes fra hverandre — bruk den formen oppgaven gir."
        cases:
          - { when: "`α̂`, `β̂`", then: "Skjæringspunkt og stigningstall (fra fane 1)" }
          - { when: "`S_E = √S²_E`", then: "Standardavviket — ta `√` hvis oppgaven gir deg variansen" }
          - { when: "`S_XX = S²_E / SE(β̂)²`", then: "Regn ut `S_XX` hvis oppgaven kun gir deg `SE(β̂)`" }
          - { when: "`df = n − 2`", then: "Frihetsgrader til t-fordelingen" }
          - { when: "`x̄ = (Σx_i) / n`", then: "Gjennomsnitt av x — regn ut hvis ikke gitt" }
          - { when: "`x₀`", then: "x-verdien du predikerer ved (gitt av oppgaven)" }
      - "Finn `α` fra konfidensnivået (95 % ⇒ `α = 0.05`, `α/2 = 0.025`)."
      - "Slå opp `t_(α/2, n−2)` i **tabell E.5**."
      - text: "Beregn `ŷ₀` ved å sette `x₀` (gitt av oppgaven) inn i regresjonslinja. `α̂` er skjæringspunktet fra fane 1 — ikke `α` fra konfidensnivået."
        formula: "ŷ₀ = α̂ + β̂·x₀"
      - text: "Regn ut `S_XX` hvis oppgaven kun har gitt deg `SE(β̂)`."
        formula: "S_XX = S²_E / SE(β̂)²"
      - text: "Beregn margin."
        formula: "margin = t_(α/2, n−2) · S_E · √(1 + 1/n + (x₀ − x̄)² / S_XX)"
      - text: "Hvis oppgaven har gitt deg `S²_E` (variansen), husk å ta kvadratroten før du setter inn i margin-formelen: `S_E = √S²_E`."
        conditional: true
      - text: "Skriv prediksjonsintervallet."
        formula: "PI = ŷ₀ ± margin"
      - text: "Eksempel: `α̂ = 34.6`, `β̂ = 6.63`, `S_E ≈ 2.468`, `SE(β̂) = 0.625`, `n = 10`, `x̄ = 6.8`, `x₀ = 5`:"
        formula:
          - "ŷ₀ = 34.6 + 6.63·5 = 67.75"
          - "margin = 2.306 · 2.468 · √(1 + 0.1 + 0.208) ≈ 6.51"
          - "PI = 67.75 ± 6.51 ≈ [61.24, 74.26]"
        example: true
      - "Sammenlign mot oppgavens terskel: ligger verdien innenfor eller utenfor intervallet?"

  - label: "Korrelasjon r"
    recognition: "«Beregn korrelasjonskoeffisient `r`», «hvor sterk er den lineære sammenhengen?», «forklaringsgrad `r²`», eller «andel av variasjonen forklart». Måler bare LINEÆR sammenheng — krummet mønster kan gi `r ≈ 0`."
    steps:
      - text: "Beregn gjennomsnittene fra rådata (eller hent fra oppgaven):"
        formula:
          - "x̄ = (Σx_i) / n"
          - "ȳ = (Σy_i) / n"
      - text: "Beregn de tre mellom-summene (hopper du over denne hvis oppgaven oppgir dem direkte):"
        formula:
          - "S_XX = Σ(x_i − x̄)²"
          - "S_YY = Σ(y_i − ȳ)²"
          - "S_XY = Σ(x_i − x̄)(y_i − ȳ)"
      - text: "Beregn korrelasjonskoeffisienten:"
        formula: "r = S_XY / √(S_XX · S_YY)"
      - text: "Eksempel: `S_XX = 15.6`, `S_YY = 734.1`, `S_XY = 103.4`:"
        formula: "r = 103.4 / √(15.6 · 734.1) ≈ 0.966"
        example: true
      - text: "Tolk: `r ∈ [−1, 1]`. Nær `1` = sterk positiv, nær `−1` = sterk negativ, nær `0` = ingen lineær sammenheng."
        cases:
          - { when: "|r| > 0.9", then: "Svært sterk lineær sammenheng" }
          - { when: "0.7 < |r| ≤ 0.9", then: "Sterk lineær sammenheng" }
          - { when: "0.4 < |r| ≤ 0.7", then: "Moderat lineær sammenheng" }
          - { when: "|r| ≤ 0.4", then: "Svak eller ingen lineær sammenheng" }
      - text: "`r²` gir forklaringsgraden (andel av variasjonen i `y` som forklares av regresjonen)."
        formula: "r² ≈ 0.966² ≈ 0.933  (≈ 93 %)"

solution_template:
  - "Identifiser HVA oppgaven spør om — velg en av fanene over."
  - "Estimere linja → fane 'Estimere α̂ og β̂'. Måle spredning → 'Residualvarians S_E²'. Standardfeil → 'Standardfeil SE(β̂)'. Test β → 'Hypotesetest for β'. Predikere ny Y → 'Prediksjonsintervall'. Styrke av sammenheng → 'Korrelasjon r'."
  - "De fleste oppgavene bygger på samme mellom-summer. Regn `x̄`, `ȳ`, `S_XX`, `S_XY` først, så har du grunnlaget for alt."

common_traps: |
  - **Frihetsgrader er `n − 2`, ikke `n − 1`**, fordi to parametre (`α̂`, `β̂`)
    er estimert fra dataene. Bruker du `n − 1` blir `S_E²` litt for liten og
    kritisk verdi for liten — du forkaster `H₀` for ofte.
  - **`SE(β̂) ≠ S_E`**: `SE(β̂) = S_E / √S_XX`. Begge kalles ofte "standardfeil" og
    blandes konstant. `S_E` er residualenes spredning; `SE(β̂)` er usikkerheten
    i selve `β̂`-estimatet.
  - **`SSE` vs `S_XX`**: `SSE = Σ(y_i − ŷ_i)²` (kvadrerte residualer i `y`),
    `S_XX = Σ(x_i − x̄)²` (kvadrerte avvik i `x`). Helt forskjellige tall som
    ofte står side ved side i en oppgave.
  - **`S_XY` er IKKE `Σx_i·y_i`**: `S_XY = Σ(x_i − x̄)(y_i − ȳ) = Σx_i·y_i − n·x̄·ȳ`.
    Tilsvarende for `S_XX`.
  - **Prediksjonsintervall vs KI for `E[Y|x]`**: prediksjonsintervallet (én ny `Y`)
    har `1 +` under rota — `√(1 + 1/n + (x₀ − x̄)²/S_XX)`. Konfidensintervallet
    for forventningsverdien `E[Y|x]` mangler det `1`-tallet og er smalere.
    Oppgaver ber typisk om PI når de spør 'sannsynligheten for at en ny student
    får...'.
  - **Ekstrapolering**: regresjonslinja gjelder bare innenfor `x`-intervallet
    dataene dekker. Predikere langt utenfor (negative `x` eller 10× max) er
    statistisk uforsvarlig selv om formelen gir et tall. Prediksjonsintervallet
    blir også raskt bredt fordi `(x₀ − x̄)²/S_XX` vokser.
  - **`r` måler bare LINEÆR sammenheng**: sterk ikke-lineær (kvadratisk, eksponentiell)
    kan gi `r ≈ 0`. Plot dataene først.
  - **Ikke-forkast `H₀: β = 0` betyr ikke 'ingen sammenheng'**: liten `n` eller
    mye støy kan gi `|T| < t_kritisk` selv om sammenhengen er reell. Konklusjon:
    'ingen statistisk grunnlag for å hevde sammenheng' — ikke 'sammenhengen er null'.
  - **Forutsetninger** for inferens (test, KI, PI): residualene `ε` er uavhengige,
    normalfordelte med konstant varians `σ²`. Punktestimering av `α̂, β̂` krever
    ikke normalitet — men hypotesetest og intervaller gjør det.
  - **Enheter**: `β̂` har enhet `(enhet av y)/(enhet av x)`. Sjekk dette mot
    konteksten — det avslører ofte regnefeil med faktor 10.

python_snippet: |
  import numpy as np
  from scipy.stats import t

  x = np.array([5, 6, 7, 8, 6, 7, 8, 5, 9, 7])
  y = np.array([68, 75, 80, 85, 72, 78, 92, 70, 95, 82])
  n = len(x)

  # 1) Mellom-summer
  x_bar, y_bar = x.mean(), y.mean()      # 6.8, 79.7
  Sxx = ((x - x_bar) ** 2).sum()           # 15.6
  Syy = ((y - y_bar) ** 2).sum()           # 734.1
  Sxy = ((x - x_bar) * (y - y_bar)).sum()  # 103.4

  # 2) Estimater
  beta_hat  = Sxy / Sxx                    # 6.63
  alpha_hat = y_bar - beta_hat * x_bar     # 34.6

  # 3) Residualvarians og standardfeil
  y_hat = alpha_hat + beta_hat * x
  SSE   = ((y - y_hat) ** 2).sum()         # 48.74
  SE2   = SSE / (n - 2)                    # 6.093
  SE    = SE2 ** 0.5                       # 2.468
  SE_beta = (SE2 / Sxx) ** 0.5             # 0.625

  # 4) Hypotesetest: H0: β = 0
  T = beta_hat / SE_beta                   # 10.61
  t_crit = t.ppf(0.975, df=n-2)            # 2.306 (tosidig α = 0.05)
  reject = abs(T) > t_crit                 # True

  # 5) Prediksjonsintervall for ny Y ved x0 = 5
  x0 = 5
  y_hat0 = alpha_hat + beta_hat * x0       # 67.75
  margin = t_crit * SE * (1 + 1/n + (x0 - x_bar) ** 2 / Sxx) ** 0.5  # 6.51
  PI = (y_hat0 - margin, y_hat0 + margin)  # (61.24, 74.26)

  # 6) Korrelasjon
  r  = Sxy / (Sxx * Syy) ** 0.5            # 0.966
  r2 = r ** 2                              # 0.933

