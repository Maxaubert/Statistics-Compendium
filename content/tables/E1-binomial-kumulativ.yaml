id: E1-binomial-kumulativ
name_no: Binomialtabell
formal_name_no: "Kumulativ binomisk sannsynlighet"
code: "E.1"
description: "Slår opp P(X ≤ k) for binomialfordeling med valgte n og p. Brukes når du har fast antall forsøk og ønsker kumulativ sannsynlighet."
inputs:
  - { name: "n", type: integer, min: 2,    max: 10,  step: 1 }
  - { name: "p", type: number,  min: 0.01, max: 0.99, step: any }
  - { name: "k", type: integer, min: 0,    max: 10,  step: 1 }
output: "P(X ≤ k)"
distribution: binomial
related_entries:
  - binomial-fordeling
  - en-utvalg-z-test-andel
  - ki-andel-binomial
