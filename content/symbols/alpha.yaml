id: alpha
sym: "α"
short_def: "Den greske bokstaven alfa har to vanlige roller på dette kurset: signifikansnivå i en hypotesetest, eller konstantleddet i en regresjonslinje."
contexts:
  - usage: "Signifikansnivå i hypotesetest"
    detail: |
      Tenk på α som 'feilmarginen du tåler' når du tester en hypotese.
      Konkret: sannsynligheten for at du forkaster nullhypotesen H₀ selv
      om den egentlig er sann (en såkalt type-1-feil).

      I praksis: du velger α på forhånd – vanligvis 0.05 (5 %) eller
      0.01 (1 %). Etterpå regner du ut p-verdien, og hvis p < α, forkaster
      du H₀. Lavere α = strengere test = vanskeligere å forkaste H₀.

      Eksempel: med α = 0.05 godtar du at i 5 av 100 tilfeller vil du
       felle en uskyldig H₀. Husk: α settes alltid før du ser dataene.
    entry_refs:
      - en-utvalg-t-test
      - en-utvalg-z-test
      - en-utvalg-z-test-andel
      - to-utvalgs-t-test
      - kjikvadrat-goodness-of-fit
      - kjikvadrat-uavhengighet
      - regresjon-test-stigningstall
  - usage: "Konstantleddet i regresjonslinje"
    detail: |
      I regresjonsmodellen y = α + βx er α verdien y har når x = 0 –
      altså der linja krysser y-aksen. Kalles også intercept eller
      skjæringspunkt.

      Du kjenner sjelden den 'sanne' α; den estimeres fra dataene
      som α̂ ved minste kvadraters metode. Lett å forveksle med α
      som signifikansnivå – kontekst avgjør: står det 'α = 0.05',
      er det signifikansnivå; står det 'y = α + βx', er det intercept.
    entry_refs:
      - regresjon-estimat-alpha-beta
      - regresjon-prediksjonsintervall
