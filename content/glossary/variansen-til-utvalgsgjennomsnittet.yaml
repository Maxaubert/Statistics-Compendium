id: variansen-til-utvalgsgjennomsnittet
term_no: Variansen til utvalgsgjennomsnittet (Var(X̄))
short_def: "`Var(X̄) = σ²/n` — spredningen i selve gjennomsnittet, ikke i dataene. Standardfeilen er `SE(X̄) = σ/√n`."
filters:
  random_variable: [mean_of_samples]
  computes: [std_dev, confidence_interval, hypothesis_test, find_n_for_threshold]
  parameters_known: [population_variance_known, population_variance_unknown, confidence_level]
  setup: [single_population]
  distribution_assumption: [normal]
long_def: |
  Når du regner ut `X̄` fra `n` uavhengige observasjoner med samme
  varians `σ²`, er variansen til selve gjennomsnittet:

      Var(X̄) = σ²/n

  Standardfeilen blir kvadratroten:

      SE(X̄) = σ/√n   (eller `s/√n` hvis σ er ukjent)

  - **Stort `n` → liten `Var(X̄)`** → smalt KI, presis test.
  - **Ikke det samme som `Var(X)`:** den variansen er spredningen i en
    enkelt observasjon. `Var(X̄)` er spredningen i estimatet `X̄`.
  - **Trenger IKKE rådata** når `σ` (eller et estimat for σ) allerede
    er gitt — formelen sier hva spredningen i `X̄` blir uten å se på selve dataene.

  Bygd inn i: én-utvalg z-test, én-utvalg t-test, og KI for μ — der står
  `σ/√n` eller `s/√n` i nevneren.
aliases:
  - variansen til utvalgsgjennomsnittet
  - varians til utvalgsgjennomsnittet
  - varians til x̄
  - var(x̄)
  - var(xbar)
