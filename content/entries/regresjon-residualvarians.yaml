id: regresjon-residualvarians
name_no: "Residualenes varians S_E²"
type: regression
category: regression_estimate
tagline: "Variansen til feilene rundt regresjonslinjen – mål for hvor godt linjen passer."

formula_main: "S_E² = SSE / (n - 2);  SSE = Σ(y_i - α̂ - β̂·x_i)²"
formula_latex: "S_E^2 = \\frac{\\text{SSE}}{n - 2}, \\quad \\text{SSE} = \\sum (y_i - \\hat{\\alpha} - \\hat{\\beta} x_i)^2"

what_it_does: |
  Estimat for variansen til residualene (avvik mellom observert og
  predikert y). Inngår i utregning av SE(β̂) og prediksjonsintervaller.
  S_E (kvadratroten) kalles ofte "standard error" i regresjon.

why_use: |
  Nødvendig som mellomberegning for nesten alt videre i regresjon:
  hypotesetest for β, KI for β, prediksjonsintervaller. Måler også
  generelt hvor "sprett" datapunktene er rundt regresjonslinjen.

recognition_cues:
  - "Du jobber med lineær regresjon"
  - "Du trenger SSE eller residualenes spredning"
  - "Spørsmålet snakker om 'residualenes varians' eller 'standardfeil'"
  - "Datatabell inkluderer kolonne (y_i - α̂ - β̂·x_i)²"

symbols:
  - { sym: "SSE",     means: "Sum of Squared Errors, Σ(y_i - α̂ - β̂·x_i)²" }
  - { sym: "S_E²",    means: "estimat for residualenes varians" }
  - { sym: "S_E",     means: "estimat for residualenes standardavvik" }
  - { sym: "n",       means: "antall observasjonspar" }
  - { sym: "ν",       means: "frihetsgrader, n - 2" }

filters:
  computes: [parameter_estimate]
  random_variable: [slope_estimate]
  setup: [single_population, linear_relationship]
  structural_cues: [linear_relationship_suspected, data_as_list]
  parameters_known: []
  distribution_assumption: [none_assumed]
  tooling: [calculator_sqrt]

solution_template:
  - "Beregn SSE = Σ(y_i - α̂ - β̂·x_i)² (eller hent fra tabell)"
  - "S_E² = SSE / (n - 2)"
  - "S_E = √S_E² (standardavviket)"

common_traps: |
  Frihetsgrader er n - 2 (ikke n - 1), fordi to parametre (α̂, β̂) er
  estimert. SSE forveksles ofte med S_XX = Σ(x-x̄)² – disse er HELT
  forskjellige.

python_snippet: |
  import numpy as np
  x = np.array([5,6,7,8,6,7,8,5,9,7])
  y = np.array([68,75,80,85,72,78,92,70,95,82])
  beta_hat, alpha_hat = 6.63, 34.6
  y_hat = alpha_hat + beta_hat * x
  SSE = ((y - y_hat) ** 2).sum()       # 48.7437
  SE2 = SSE / (len(x) - 2)              # 6.093
  SE = SE2 ** 0.5                       # 2.4684

detailed_solution_variants:
  - label: "Residualvarians S_E²"
    solutions:
      - source: "Eksamen mai25 · oppgave 5d"
        question: "Datasett med n = 10 observasjonspar (x_i, y_i) der x = antall år erfaring og y = lønn. Etter regresjon er β̂ = 6.63 og α̂ = 34.6. SSE = Σ(y_i − α̂ − β̂·x_i)² er beregnet til 48.7437. Finn estimatet for residualenes varians `S_E²` og standardavviket `S_E`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Lineær regresjon med n = 10 observasjonspar."
              - text: "Oppgitt: SSE = 48.7437, β̂ = 6.63, α̂ = 34.6."
              - text: "Vi skal finne residualvariansen `S_E²` og `S_E`."
          - label: "Mellom-summer"
            lines:
              - text: "SSE er allerede gitt som ferdig utregnet sum:"
              - indent: "`SSE = Σ(y_i − α̂ − β̂·x_i)² = 48.7437`."
              - text: "Frihetsgrader: `ν = n − 2 = 10 − 2 = 8` (to parametre estimert: α, β)."
          - label: "Estimater"
            lines:
              - text: "Punktestimat for stigningstall: `β̂ = 6.63` (gitt)."
              - text: "Punktestimat for konstantledd: `α̂ = 34.6` (gitt)."
          - label: "Residualvarians"
            lines:
              - text: "Formel: `S_E² = SSE / (n − 2)`."
              - text: "Innsetting:"
              - indent: "`S_E² = 48.7437 / (10 − 2)`"
              - indent: "`     = 48.7437 / 8`"
              - indent: "`     ≈ 6.093`."
          - label: "S_E (standardavvik)"
            lines:
              - text: "`S_E = √S_E² = √6.093 ≈ 2.4684`."
        result: "`S_E² ≈ 6.093`, `S_E ≈ 2.468`"

      - source: "Praksis · lite datasett"
        question: "Datasettet (1,2), (2,3), (3,5), (4,6), (5,8) med n = 5. Det er allerede beregnet at `S_YY = 22.8`, `S_XY = 15` og `β̂ = 1.5`. Finn residualvariansen `S_E²` og `S_E`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Lineær regresjon, n = 5 observasjonspar."
              - text: "Datasett: (1,2), (2,3), (3,5), (4,6), (5,8)."
              - text: "Oppgitt: `S_YY = 22.8`, `S_XY = 15`, `β̂ = 1.5`."
          - label: "Mellom-summer"
            lines:
              - text: "Gjennomsnitt: `x̄ = (1+2+3+4+5)/5 = 3`, `ȳ = (2+3+5+6+8)/5 = 4.8`."
              - text: "`S_XX = Σ(x_i − x̄)² = 4 + 1 + 0 + 1 + 4 = 10`."
              - text: "`S_YY = 22.8` (gitt)."
              - text: "`S_XY = 15` (gitt)."
              - text: "Frihetsgrader: `ν = n − 2 = 5 − 2 = 3`."
          - label: "Estimater"
            lines:
              - text: "`β̂ = S_XY / S_XX = 15 / 10 = 1.5` (gitt, og verifisert)."
          - label: "Residualvarians"
            lines:
              - text: "Bruker den kompakte formelen:"
              - indent: "`S_E² = (S_YY − β̂·S_XY) / (n − 2)`."
              - text: "Innsetting:"
              - indent: "`S_E² = (22.8 − 1.5·15) / (5 − 2)`"
              - indent: "`     = (22.8 − 22.5) / 3`"
              - indent: "`     = 0.3 / 3`"
              - indent: "`     = 0.1`."
          - label: "S_E (standardavvik)"
            lines:
              - text: "`S_E = √0.1 ≈ 0.3162`."
        result: "`S_E² = 0.1`, `S_E ≈ 0.316`"

      - source: "Praksis · datasett med større spredning"
        question: "Datasettet (1,3), (2,2), (3,7), (4,5), (5,10), (6,8) med n = 6. Det er beregnet at `x̄ = 3.5`, `ȳ = 5.833`, `S_XX = 17.5`, `S_YY = 47.833` og `S_XY = 22.5`. Finn `β̂`, `S_E²` og `S_E`."
        sections:
          - label: "Identifisering"
            lines:
              - text: "Lineær regresjon, n = 6 observasjonspar."
              - text: "Datasett: (1,3), (2,2), (3,7), (4,5), (5,10), (6,8)."
              - text: "Oppgitt: `x̄ = 3.5`, `ȳ = 5.833`, `S_XX = 17.5`, `S_YY = 47.833`, `S_XY = 22.5`."
          - label: "Mellom-summer"
            lines:
              - text: "`S_XX = Σ(x_i − x̄)² = 17.5`."
              - text: "`S_YY = Σ(y_i − ȳ)² = 47.833`."
              - text: "`S_XY = Σ(x_i − x̄)(y_i − ȳ) = 22.5`."
              - text: "Frihetsgrader: `ν = n − 2 = 6 − 2 = 4`."
          - label: "Estimater"
            lines:
              - text: "`β̂ = S_XY / S_XX = 22.5 / 17.5 ≈ 1.2857`."
          - label: "Residualvarians"
            lines:
              - text: "Formel: `S_E² = (S_YY − β̂·S_XY) / (n − 2)`."
              - text: "Innsetting:"
              - indent: "`S_E² = (47.833 − 1.2857·22.5) / (6 − 2)`"
              - indent: "`     = (47.833 − 28.929) / 4`"
              - indent: "`     = 18.904 / 4`"
              - indent: "`     ≈ 4.726`."
          - label: "S_E (standardavvik)"
            lines:
              - text: "`S_E = √4.726 ≈ 2.174`."
        result: "`S_E² ≈ 4.726`, `S_E ≈ 2.174`"

