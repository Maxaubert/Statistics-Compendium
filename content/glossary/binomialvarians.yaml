id: binomialvarians
term_no: Binomialvarians (Var(X) = np(1−p))
short_def: "Spesielt for `Binomial(n, p)`: `E[X] = np`, `Var(X) = np(1 − p)`, `σ = √(np(1 − p))`."
filters:
  distribution_assumption: [binomial, normal]
  random_variable: [discrete_count, proportion]
  computes: [std_dev, expected_value, variance]
  parameters_known: [success_p]
  setup: [fixed_n_trials]
  structural_cues: [success_probability_given]
long_def: |
  For en `Binomial(n, p)`-fordelt variabel `X` (antall suksesser i `n`
  uavhengige Bernoulli-forsøk med suksessannsynlighet `p`):

      E[X]   = np
      Var(X) = np(1 − p)
      σ      = √(np(1 − p))

  Variansen er størst når `p = 0.5` (da blir `Var = n/4`) og går mot
  `0` når `p` nærmer seg `0` eller `1`. For andelen `p̂ = X/n`:

      Var(p̂) = p(1 − p) / n

  Brukes som **kjennelig egenskap** for binomial og som grunnlag for
  normalapproksimasjon når:

      n · p · (1 − p) ≥ 5
aliases:
  - binomialvarians
  - binomialvariansen
  - binomial varians
