id: varians
name_no: "Varians (oversikt over de ulike formene)"
type: concept
tagline: "Mål for spredning. Samme idé i alle former, men formelen ser ulik ut etter hva slags data du har."

what_it_means: |
  Varians måler hvor mye en variabel typisk avviker kvadratisk fra
  gjennomsnittet. Standardavviket er kvadratroten av variansen og har
  samme enhet som dataene.

  Den grunnleggende ideen er alltid den samme:

      varians = «vektet sum av kvadrerte avvik fra gjennomsnittet»

  Vekten og delingsleddet endrer seg etter hva du har og hva du estimerer.
  Sidene under dekker hver av de viktige variansformene én gang hver.

  ## Diskret SV med PMF

      Var(X) = Σ (xᵢ − μ)² · P(X = xᵢ)

  Bruk når du har en tabell med verdier `xᵢ` og sannsynligheter `P(X = xᵢ)`.
  Multiplisér hvert kvadrert avvik med sin sannsynlighet og summér.
  Snarvei for uniform fordeling: `Var(X) = E[X²] − μ²`.

  Entry: [Varians og standardavvik (diskret SV)](/entry/varians-standardavvik-diskret).

  ## Utvalgsvarians (s²)

      s² = Σ (xᵢ − x̄)² / (n − 1)

  Bruk når du har en liste med `n` observasjoner og ingen kjent fordeling —
  den vanligste formen i praksis. `n − 1` (Bessels korreksjon) gjør `s²`
  forventningsrett for `σ²`. Standardavviket er `s = √s²`.

  Entry: [Utvalgsvarians fra rådata](/entry/utvalgsvarians-radata). Brukes i:
  [Én-utvalg t-test](/entry/en-utvalg-t-test),
  [KI for μ (ukjent σ)](/entry/ki-mu-ukjent-sigma),
  [KI for σ²](/entry/ki-varians).

  ## Pooled (interpolert) varians (S_P²)

      S_P² = ((n_X − 1)·s_X² + (n_Y − 1)·s_Y²) / (n_X + n_Y − 2)

  Bruk når du sammenligner to grupper med antatt felles `σ²` i to-utvalgs
  t-test. Vektet snitt der vekten er antall frihetsgrader.

  Konsept: [Interpolert (pooled) varians](/concept/interpolert-varians).
  Brukes i: [To-utvalgs t-test (pooled)](/entry/to-utvalgs-t-test).

  ## Residualvarians (S_E²)

      S_E² = Σ (yᵢ − ŷᵢ)² / (n − 2)

  Måler hvor langt observasjonene ligger unna regresjonslinjen i snitt.
  `n − 2` fordi vi har estimert både `α̂` og `β̂` fra samme data.

  Entry: [Residualenes varians S_E²](/entry/regresjon-residualvarians).
  Brukes i: [SE(β̂)](/entry/regresjon-standardfeil-stigningstall),
  [Hypotesetest for β](/entry/regresjon-test-stigningstall),
  [Prediksjonsintervall](/entry/regresjon-prediksjonsintervall).

  ## Binomialvarians

      Var(X) = np(1 − p)

  For `B(n, p)`. Størst når `p = 0.5`. Detaljer: binomialvarians.
  Entry: [Binomialfordeling](/entry/binomial-fordeling).

  ## Poissonvarians

      Var(X) = λ   (eller λt for et vindu)

  Spesielt for Poisson: `E[X] = Var(X) = λ`. Detaljer: poissonvarians.
  Entry: [Poissonfordeling](/entry/poisson-fordeling).

  ## Eksponentialvarians

      Var(T) = 1/λ²

  For ventetid med rate `λ`. Detaljer: eksponentialvarians.
  Entry: [Eksponentialfordeling](/entry/eksponential-fordeling).

  ## Hypergeometrisk varians

      Var(X) = n · (K/N) · ((N−K)/N) · ((N−n)/(N−1))

  Som binomialvariansen, men ganget med endelig-populasjon-korreksjonen
  `(N−n)/(N−1)`. Detaljer: hypergeometrisk varians.
  Entry: [Hypergeometrisk fordeling](/entry/hypergeometrisk-fordeling).

  ## Normalvarians

      Var(X) = σ²

  Trivielt — `σ²` er parameteren selv.
  Entry: [Normalfordeling](/entry/normalfordeling).

  ## Variansen til utvalgsgjennomsnittet

      Var(X̄) = σ²/n          SE(X̄) = σ/√n

  Spredningen i selve estimatet `X̄`, ikke i dataene. Bruker `s/√n` hvis
  `σ` er ukjent. Stort `n` → liten `Var(X̄)` → smalt KI, presis test.
  Detaljer: variansen til utvalgsgjennomsnittet.

  Innebygget i: [Én-utvalg z-test](/entry/en-utvalg-z-test),
  [KI for μ (kjent σ)](/entry/ki-mu-kjent-sigma).

  ## Variansen til stigningstallet

      Var(β̂) = S_E² / S_XX          SE(β̂) = √(Var(β̂))

  Stor `S_XX` (mye spredning i `x`) → liten `SE(β̂)` → presis estimering.

  Entry: [Standardfeil til β̂](/entry/regresjon-standardfeil-stigningstall).

  ## Sammenheng

  Alle disse er forskjellige måter å regne det samme grunnbegrepet —
  en gjennomsnittlig kvadrert avvik. Vekten og delingsleddet endrer seg
  etter hva du har og hva du estimerer.

  Hvis du forstår hvorfor `s² = Σ(xᵢ − x̄)² / (n − 1)` er riktig form for
  rådata, har du forstått rytmen i alle de andre.

  Se også [Standardavvik (oversikt)](/concept/standardavvik) for parallellen til σ.

