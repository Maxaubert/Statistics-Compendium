id: standardfeil-til-stigningstallet
term_no: Standardfeil til stigningstallet (SE(βˆ))
short_def: "`SE(βˆ) = √(S_E² / S_XX)` — kvadratroten av Var(βˆ). Hvor presist vi kjenner regresjonsstigningen."
filters:
  random_variable: [slope_estimate]
  setup: [linear_relationship]
  parameters_known: [slope_se, residual_variance, sum_xx_sxy, confidence_level]
  computes: [std_dev, hypothesis_test, confidence_interval]
  distribution_assumption: [t_distribution]
  tooling: [t_quantile_table_E5]
long_def: |
  Formel:

      SE(βˆ) = √(S_E² / S_XX)

  Standardfeilen til estimatet `βˆ`. Står i nevneren av testobservatoren:

      T = βˆ / SE(βˆ)

  og brukes i konfidensintervallet:

      βˆ ± t_(α/2, n−2) · SE(βˆ)

  **Trenger rådata?** Indirekte: trenger `S_E²` og `S_XX`, som beregnes
  fra `(xᵢ, yᵢ)`. Hvis disse er oppgitt, trenger du ikke rådataene.

  **Tolkning:** liten `SE(βˆ)` → presis estimat → smalt KI;
  stor → høy usikkerhet.

  **Frihetsgrader** for testen er `n − 2`.
aliases:
  - standardfeil til stigningstallet
  - se(βˆ)
  - se(beta-hat)
